    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: AUDITOR
    source_column: SCMS.AUDITOR.ID
    comment: "FK target: audit_firm_auditor.audit_firm_auditor_id. Shared entity. Hash: hash_id('SCMS.AUDITOR', ID)."
    classification_context: "Source System Code = 'SCMS_AUDITOR' | Identification Type Code = 'AUDITOR_CERT'"
    etl_derived_value: null

  - name: Involved Party Code
    physical_name: ip_code
    business_meaning: Mã Audit Firm Auditor.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: AUDITOR
    source_column: SCMS.AUDITOR.ID
    comment: "Lookup pair: audit_firm_auditor.audit_firm_auditor_code. Pair with Involved Party Id."
    classification_context: "Source System Code = 'SCMS_AUDITOR' | Identification Type Code = 'AUDITOR_CERT'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: AUDITOR
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'SCMS_AUDITOR' | Identification Type Code = 'AUDITOR_CERT'"
