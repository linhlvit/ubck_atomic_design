    table_type: "fact"
    module: "QLCB"
    status: "draft"
    reuse_status: "partial"
    description: "Hồ sơ đăng ký chào bán nộp qua TTHC — đếm và phân tích theo nhóm trạng thái xử lý, hình thức, năm (Nhóm 5-6). Repoint IDS → TTHC 2026-08-24: driving ap_content_item_index lọc content_tp_code=HoSoTTHC + latest_ind=1 + cơ quan xử lý = Ban Quản lý chào bán chứng khoán, join ap_document lấy 4 trường parse từ JSON. Grain: 1 hồ sơ TTHC × 1 ngày snapshot (ETL full-scan hàng ngày vì nhóm trạng thái phản ánh trạng thái hiện hành)."
    source_atomic:
      - "ap_content_item_index"
      - "ap_document"
    modules_using:
      - "QLCB"
    columns:
      - logical_name: "Application Item Code"
        physical_name: "application_item_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "DD"
        description: "Degenerate Dimension — BK hồ sơ TTHC (ContentItemId của content item HoSoTTHC). Grain đếm đơn nhất của Fact: COUNT(application_item_code) = COUNT(*) của SQL BA, không cần DISTINCT. WHERE mang toàn bộ filter phạm vi của Fact: content_tp_code = HoSoTTHC, latest_ind = 1, cơ quan xử lý = Ban Quản lý chào bán chứng khoán (resolve qua display_text — không thành cột theo HLD), và submission_dt IS NOT NULL để FK ngày gửi hồ sơ non-nullable"
        source_atomic_table: "ap_content_item_index"
        source_atomic_column: "ap_content_item_index.content_item_code"
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Calendar Date Dimension — ngày ETL snapshot (daily full-scan) vì Application Status Group Code phản ánh trạng thái xử lý hiện hành của hồ sơ"
        source_atomic_table: "ap_content_item_index"
        source_atomic_column: null
      - logical_name: "Submission Date Dimension Id"
        physical_name: "submission_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Calendar Date Dimension — ngày gửi hồ sơ ($.HoSoTTHC.NgayGuiHoSo.Value, đã parse + xử lý timezone và TRUNC về DATE tại tầng ODS→Atomic). Thay thế Certificate Date Dimension Id của thiết kế IDS cũ. Non-nullable: ETL loại hồ sơ có submission_dt NULL, khớp filter BETWEEN của SQL BA"
        source_atomic_table: "ap_document"
        source_atomic_column: "ap_document.submission_dt"
      - logical_name: "Administrative Procedure Application Status Dimension Id"
        physical_name: "ap_application_status_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Administrative Procedure Application Status Dimension — trạng thái hồ sơ ($.HoSoTTHC.TrangThaiHoSo.ContentItemIds[0]). Thay thế cột Application Status Code (Classification Value direct map) của thiết kế IDS cũ"
        source_atomic_table: "ap_document"
        source_atomic_column: "ap_document.document_status_code"
      - logical_name: "Administrative Procedure Application Type Dimension Id"
        physical_name: "ap_application_tp_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Administrative Procedure Application Type Dimension — hình thức chào bán ($.HoSoTTHC.LoaiHoSo.ContentItemIds[0]). Thay thế Offering Method Dimension Id; non-nullable và lookup 1:1 nên KHÔNG làm phồng grain như LEFT JOIN Plan của thiết kế IDS cũ"
        source_atomic_table: "ap_document"
        source_atomic_column: "ap_document.offering_method_code"

