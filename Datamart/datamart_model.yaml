        description: "[SỬA 2026-09-19, dev report SIT — sync 7 phát hiện] (1) Bỏ violation_report. (2) Thêm bước chốt 1 báo cáo/kỳ trước khi xếp hạng (ưu tiên HN>TH>ME>RI). (3) Bỏ điều kiện `(CASE WHEN rpt_quarter=1..4 THEN ngày cuối quý END) <= trading_dt` — CASE không có ELSE nên với rpt_quarter 5/6 biểu thức trả NULL, WHERE vô tình loại các kỳ này, NGƯỢC với chủ đích đã ghi ở đây từ trước (\"VCSH là chỉ tiêu tại một thời điểm, KHÔNG ép theo lịch cố định như Revenue/LNST\"). Nay chỉ còn `submission_dt <= trading_dt` làm điều kiện thời gian — VCSH chấp nhận cả kỳ bán niên/cả năm làm số liệu \"gần nhất\", đúng ý đồ ban đầu. Lấy quý/kỳ gần nhất đã công bố tính đến ngày giao dịch (BCDKT, row_desc 400 DN/BH · 500 TD). Dùng chung cho Nhóm 3/6 (và reuse Nhóm 9/11/13/15/17/19/21/33)."
