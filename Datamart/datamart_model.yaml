        description: "[SỬA 2026-09-14, làm rõ theo review — không đổi etl_logic/số liệu] Tổng khối lượng giao dịch cổ phiếu/CCQ 3 sàn (UPCOM/HNX/HOSE) — GỘP CẢ khớp lệnh VÀ thỏa thuận (loại trừ phái sinh và trái phiếu). Tên gọi cũ dễ gây hiểu nhầm là ''khớp lệnh thuần'' — thực chất etl_logic KHÔNG có điều kiện Board Type nên không loại trừ thỏa thuận. Khác với `Total Matched Volume` (cột riêng cùng bảng, loại trừ thỏa thuận, phục vụ nhóm Top) và `Index Total Matched Volume` (trên `Fact Index Constituent Snapshot`, loại trừ thỏa thuận theo rổ chỉ số, phục vụ K_GSTT_47). **LƯU Ý QUAN TRỌNG:** SUM(`total_vol`) của các mã CK trong 1 rổ chỉ số KHÔNG khớp `idx_total_matched_vol` của rổ đó — chênh đúng phần KLGD thỏa thuận. Đây là CHỦ Ý THIẾT KẾ (2 chỉ tiêu nghiệp vụ khác nhau: ''Tổng KL'' của Nhóm 1 dùng cho hầu hết Nhóm vs ''KLGD của chỉ số'' của Nhóm 5 — theo đúng yêu cầu sheet Tổng hợp công thức), KHÔNG PHẢI BUG — không tự ý ''sửa cho khớp nhau''. **[XÁC NHẬN 2026-09-14, Data Modeler]** Giữ nguyên giá trị gộp — đây là chỉ tiêu nghiệp vụ riêng (Tổng KL toàn thị trường, dùng cho hầu hết Nhóm), không phải toggle theo tham số ''Thỏa thuận'' như mô tả ở 1 số dòng khác của sheet Tổng hợp công thức (Chức năng Danh mục>>Cổ phiếu). Không cần thiết kế lại theo toggle. **[CẬP NHẬT 2026-09-16]** BA STT 1 (Nhóm 1) sau đó tự đổi định nghĩa ''Tổng KLGD'' thành ''Tổng KLGD khớp lệnh'' (loại thỏa thuận) — K_GSTT_13/14 (Nhóm 1 và các Nhóm reuse 3/9/10/23/24/29/30) nay chuyển sang dùng `total_matched_vol`/`total_matched_val`, KHÔNG còn dùng cột `total_vol` này nữa. Cột `total_vol` nay chỉ còn phục vụ K_GSTT_146 (Nhóm 33 — ''Tổng KL'', giá trị gộp cả khớp lệnh + thỏa thuận theo đúng BA STT 33, xác nhận KHÔNG đổi). [SỬA JOIN KEY 2026-09-11, xác nhận qua issue Thủy] Join sang sổ lệnh (securities_trade) trước đây dùng cứng symbol cho mọi sàn — sai với HNX/UPCOM/FDS (floor_code 02/04/03), các sàn này phải join qua isin_code, chỉ riêng HOSE (floor_code=10) mới dùng symbol. Áp dụng đồng nhất cho mọi cột join securities_trade trên bảng này."
