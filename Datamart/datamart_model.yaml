        nullable: true
        key: ""
        description: "Tuổi NHN tại thời điểm populate"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.brth_dt / scr_prac.brth_yr"
      - logical_name: "Nationality Code"
        physical_name: "nat_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
