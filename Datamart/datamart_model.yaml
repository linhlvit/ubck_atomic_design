    description: "Lịch sử tuân thủ & vi phạm CTCK — quyết định xử phạt hành chính, thanh tra/kiểm tra. Grain: nhánh Admin Penalty Decision = 1 CTCK x 1 quyết định xử phạt; nhánh Inspection/Examination = 1 hành vi vi phạm x 1 đối tượng bị xử phạt. Multi-source tách bộ (Admin Penalty Decision/Inspection/Examination) — 3 file LLD riêng, UNION về 1 schema cột đích thống nhất (PK chung compliance_event_code). Chỉ giữ KPI READY (K_QLKD_188, 197-203) — không có Periodic Report (Nhóm 38/39 phần PENDING gating dữ liệu động). Nguồn Atomic track draft chưa approved. GAP: sc_code cho nhánh Inspection/Examination chưa có FK surrogate chính thức, chỉ text-match qua Inspection/Examination Team Target.target_reference_id."
    source_atomic:
      - "sc_administrative_penalty_decision"
      - "penalty_decision_subject"
      - "penalty_decision"
      - "pd_subject_behavior"
      - "violation_behavior"
      - "penalty_type"
      - "inspection_team"
      - "inspection_team_target"
      - "examination_team"
      - "examination_team_target"
