schema_type: datamart_model
schema_version: "1.0"

# ============================================================
# DATAMART MODEL — Registry schema cross-module
# ============================================================
# Mục đích: nguồn sự thật duy nhất về schema của mọi Datamart entity.
# Khi module B partial thêm cột vào bảng của module A
# → cập nhật file này → schema trong model luôn là phiên bản đầy đủ nhất.
#
# QUY TẮC GHI:
#   - id: "DTM-{datamart_table}" — unique cross-module, không thay đổi sau khi tạo
#   - datamart_table: snake_case — không đổi sau khi ghi lần đầu
#   - source_atomic_table và source_atomic_column: luôn cùng độ dài list, 1-1 theo index
#   - source_atomic_column: format "table.column"; null nếu Generated
#   - Ghi vào file này SAU KHI human approve merge master (Phase 1 LLD)
#
# FIELDS entity-level:
#   id, logical_name, datamart_table, table_type, module, status,
#   reuse_status, description, source_atomic, modules_using, columns
#
# FIELDS column-level:
#   logical_name, physical_name, data_domain, data_type, nullable,
#   key, description, source_atomic_table, source_atomic_column
#
# table_type  : dim / fact / operational
# module      : tên module viết HOA (NHNCK, PTTT, ...) hoặc SHARED
# status      : draft / approved
# reuse_status: new / reuse / partial
# key         : PK / NK / FK → <Dim> / DD / "" (trống)
# ============================================================

entities:

  - id: "DTM-cdr_dt_dim"
    logical_name: "Calendar Date Dimension"
    datamart_table: "cdr_dt_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Lịch ngày — năm/quý/tháng/ngày nghỉ. Conformed Dim dùng chung toàn Datamart. Grain: 1 ngày."
    source_atomic:
      - "cdr_dt"
    modules_using:
      - "NHNCK"
      - "GSDC"
      - "GSTT"
    columns:
      - logical_name: "Calendar Date Dimension Id"
        physical_name: "cdr_dt_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cdr_dt"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt_id"
      - logical_name: "Calendar Date"
        physical_name: "cdr_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: false
        key: "NK"
        description: "NK — ngày lịch dùng để join từ Fact"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Year"
        physical_name: "year"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Năm (YYYY)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Quarter"
        physical_name: "quarter"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Quý (1–4)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Month"
        physical_name: "month"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Tháng (1–12)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Day Of Week"
        physical_name: "day_of_week"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Thứ trong tuần (1=Chủ nhật, 7=Thứ bảy)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Is Weekend"
        physical_name: "is_weekend"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "(Sửa 2026-07-17) Y nếu là ngày cuối tuần (thứ 7 hoặc CN), N nếu không"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Holiday Flag"
        physical_name: "holiday_flag"
        data_domain: "Indicator"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Sửa 2026-07-20) Cờ đánh dấu ngày nghỉ — Y nếu là ngày nghỉ, N nếu không. Chỉ đánh dấu nghỉ/không nghỉ, không phân biệt loại nghỉ. Atomic cdr_dt hiện chỉ có Holiday Flag (hol_f — public holiday); ETL tạm map trực tiếp, chờ Atomic bổ sung nếu cần phân biệt thêm loại ngày nghỉ khác"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.hol_f"
      - logical_name: "Is Trading Date"
        physical_name: "is_trading_date"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "(Sửa 2026-09-05, partial — thêm từ GSTT, yêu cầu thiết kế trực tiếp từ user) Y nếu ngày lịch này là ngày giao dịch thực tế của thị trường chứng khoán (tồn tại bản ghi trên Market Index Snapshot), N nếu không (cuối tuần/lễ/ngày market không mở cửa). Dùng để lọc \"ngày giao dịch\" (khác Is Weekend/Holiday Flag — không dùng chung lịch nghỉ lễ nhà nước, vì thị trường có thể nghỉ thêm ngày không phải lễ chính thức hoặc ngược lại). \"Ngày giao dịch gần nhất\" = MAX(cdr_dt) WHERE is_trading_date = 'Y' — tính tại tầng BI, dùng làm tham số lọc mặc định cho dashboard/báo cáo giao dịch thị trường (xem GSTT Nhóm 1, K_GSTT_128). ETL: EXISTS(SELECT 1 FROM market_index_snapshot WHERE market_index_snapshot.trading_dt = cdr_dt.cdr_dt) → 'Y' ELSE 'N' — join_atomic khác driving table cdr_dt (partial, không ảnh hưởng cột direct hiện có)"
        source_atomic_table: "market_index_snapshot"
        source_atomic_column: "market_index_snapshot.trading_dt"

  - id: "DTM-securities_practitioner_dim"
    logical_name: "Securities Practitioner Dimension"
    datamart_table: "securities_practitioner_dim"
    table_type: "dim"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng thái hành nghề. SCD4A (current state). Grain: 1 NHN."
    source_atomic:
      - "securities_practitioner"
      - "geographic_area"
      - "cl_value"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Securities Practitioner Dimension Id"
        physical_name: "securities_practitioner_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: securities_practitioner (NHNCK.PROFESSIONALS)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Practitioner Code"
        physical_name: "practitioner_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "BK"
        description: "BK — mã NHN, dùng để join từ Fact"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.sp_code"
      - logical_name: "Full Name"
        physical_name: "full_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Họ tên đầy đủ NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.full_nm"
      - logical_name: "Education Level Code"
        physical_name: "education_level_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Sửa 2026-08) Trình độ học vấn — Classification Value (scheme: EDUCATIONAL_LEVEL, đổi tên từ EDUCATION_LEVEL). Giá trị thật lưu trực tiếp tiếng Việt: 'Đại học'/'Cử nhân'/'Thạc sĩ'/'Tiến sĩ' — không phải code tiếng Anh"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.education_level_code"
      - logical_name: "Education Level Name"
        physical_name: "education_level_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Bổ sung 2026-08) Tên trình độ học vấn — ETL-derived: denormalize từ Classification (scheme: EDUCATIONAL_LEVEL) tại thời điểm populate, cùng pattern với Practice_Status_Name"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_nm"
      - logical_name: "Nationality Code"
        physical_name: "nationality_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Sửa 2026-08: tự join Geographic Area filter COUNTRY — không dùng cột denormalized securities_practitioner.nationality_code chưa xác nhận đã populate đúng) Mã quốc tịch NHN"
        source_atomic_table: "geographic_area"
        source_atomic_column: "geographic_area.geographic_area_code"
      - logical_name: "Birth Date"
        physical_name: "birth_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày sinh NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.birth_dt"
      - logical_name: "Practice Status Code"
        physical_name: "practice_status_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trạng thái hành nghề — Classification Value (scheme: PRACTITIONER_PRACTICE_STATUS)"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.practice_status_code"
      - logical_name: "Practice Status Name"
        physical_name: "practice_status_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Bổ sung 2026-08) Tên trạng thái hành nghề — ETL-derived: denormalize từ Classification (scheme: PRACTITIONER_PRACTICE_STATUS) tại thời điểm populate"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_nm"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.src_stm_code"

  - id: "DTM-sp_license_certificate_type_dim"
    logical_name: "SP License Certificate Type Dimension"
    datamart_table: "sp_license_certificate_type_dim"
    table_type: "dim"
    module: "NHNCK"
    status: "approved"
    reuse_status: "new"
    description: "Loại CCHN (Môi giới, Phân tích, QLQ...) — Fundamental entity riêng, không phải Classification Value. SCD4A (current state). Grain: 1 loại CCHN. Atomic nguồn sp_license_certificate_type (NHNCK.CERTIFICATES, DataModel/working/Atomic)."
    source_atomic:
      - "sp_license_certificate_type"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Certificate Type Dimension Id"
        physical_name: "certificate_tp_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: sp_license_certificate_type (NHNCK.CERTIFICATES)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Certificate Type Code"
        physical_name: "certificate_tp_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "BK"
        description: "(Sửa 2026-08) BK — mã loại CCHN, dùng để join từ Fact/Operational"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.sp_license_certificate_tp_code"
      - logical_name: "Certificate Type Name"
        physical_name: "certificate_tp_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên loại CCHN (VD: Môi giới, Phân tích, QLQ)"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.certificate_tp_nm"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.src_stm_code"

  - id: "DTM-cl_dim"
    logical_name: "Classification Dimension"
    datamart_table: "cl_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Danh mục phân loại — toàn bộ từ bảng cl_value Atomic. PK surrogate cl_dim_id. BK: (schema_code, cl_code). Conformed Dim. Grain: 1 giá trị phân loại per scheme."
    source_atomic:
      - "cl_value"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Classification Dimension Id"
        physical_name: "cl_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cl_value (toàn bộ Classification Value)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Schema Code"
        physical_name: "schema_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã scheme; BK: (schema_code, cl_code)"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.schema_code"
      - logical_name: "Schema Name"
        physical_name: "schema_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên scheme phân loại"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.schema_nm"
      - logical_name: "Classification Code"
        physical_name: "cl_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã giá trị phân loại; BK: (schema_code, cl_code)"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_code"
      - logical_name: "Classification Name"
        physical_name: "cl_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên giá trị phân loại"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_nm"
      - logical_name: "Classification Name English"
        physical_name: "cl_nm_english"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Bổ sung 2026-08) Tên giá trị phân loại (tiếng Anh)"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_nm_english"
      - logical_name: "Classification Description"
        physical_name: "cl_description"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Bổ sung 2026-08) Diễn giải chi tiết ý nghĩa giá trị phân loại"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.cl_description"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived từ cl_value"
        source_atomic_table: "cl_value"
        source_atomic_column: "cl_value.src_stm_code"

  - id: "DTM-fct_practitioner_license_certificate_snpst"
    logical_name: "Fact Practitioner License Certificate Snapshot"
    datamart_table: "fct_practitioner_license_certificate_snpst"
    table_type: "fact"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "Snapshot CCHN theo tháng — đếm CCHN còn hiệu lực/bị thu hồi/cấp mới per NHN. Grain: 1 CCHN × 1 tháng snapshot."
    source_atomic:
      - "sp_license_certificate_document"
      - "sp_license_decision_document"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Practitioner Dimension Id"
        physical_name: "practitioner_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Securities Practitioner Dimension"
        description: "FK NHN — lookup qua practitioner_code"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_code"
      - logical_name: "Issue Date Dimension Id"
        physical_name: "issue_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "(Sửa 2026-08: đổi nguồn từ Application sang Certificate Document) FK ngày cấp CCHN — từ sp_license_certificate_document.issue_dt"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.issue_dt"
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "FK ngày snapshot tháng — ETL runtime date"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: null
      - logical_name: "Certificate Type Dimension Id"
        physical_name: "certificate_tp_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → SP License Certificate Type Dimension"
        description: "FK loại CCHN — lookup sp_license_certificate_type_dim qua certificate_tp_code"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_tp_code"
      - logical_name: "License Certificate Document Code"
        physical_name: "license_certificate_document_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "DD"
        description: "DD — BK bản ghi cấp/thu hồi CCHN (degenerate key, 1 dòng Fact = 1 bản ghi); KHÔNG dùng làm đơn vị đếm KPI — xem Certificate Number"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_document_code"
      - logical_name: "Certificate Number"
        physical_name: "certificate_nbr"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "DD"
        description: "DD — business key CCHN thật (số CCHN nghiệp vụ); đơn vị đếm COUNT(DISTINCT ...) cho các KPI đếm số CCHN — 1 CCHN có thể có nhiều License Certificate Document Code qua các lần cấp/thu hồi/cấp lại"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_document_code"
      - logical_name: "Is Reissue Indicator"
        physical_name: "is_reissue_indicator"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "(Sửa 2026-08, review `/datamart-review`) ETL-derived: Y nếu Decision Type Code = '3' (Cấp lại); N nếu = '1' (Cấp mới); NULL nếu chưa có quyết định — join qua Issue Decision (đúng theo BA cập nhật Certificate_Records.ISSUE_DECISION_ID = DECISIONS.ID, filter DECISION_TYPE_ID; đổi từ REVOCATION_DECISION_ID, xem O_NHNCK_29). LƯU Ý: cố ý dùng LEFT JOIN (không INNER JOIN như SQL tham khảo BA) vì cột này nằm trên Fact dùng chung cho nhiều KPI khác (K_NHNCK_11/17/18/19...) — INNER JOIN ngay tại đây sẽ loại các Certificate không match khỏi TOÀN BỘ Fact, ảnh hưởng các KPI không liên quan. Tại K_NHNCK_2a/2b, filter is_reissue_indicator = 'N'/'Y' ở Detail Mapping tự loại NULL — tương đương INNER JOIN đúng ngay tại 2 KPI cần, không ảnh hưởng KPI khác."
        source_atomic_table: "sp_license_decision_document"
        source_atomic_column: "sp_license_decision_document.decision_tp_code"
      - logical_name: "Certificate Issue Date"
        physical_name: "certificate_issue_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "(Sửa 2026-08: đổi nguồn từ Application sang Certificate Document — đúng theo BA CERTIFICATE_RECORDS.ISSUE_DATE) Ngày cấp CCHN"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.issue_dt"
      - logical_name: "Revocation Date"
        physical_name: "revocation_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày thu hồi CCHN — NULL nếu chưa thu hồi"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.revocation_dt"
      - logical_name: "Decision Type Code"
        physical_name: "decision_tp_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Loại quyết định thu hồi/hủy CCHN — Classification Value (scheme: LICENSE_CERTIFICATE_DECISION_TYPE): 2=Thu hồi, 6=Hủy CCHN; NULL nếu chưa có quyết định"
