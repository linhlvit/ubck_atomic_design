    source_atomic:
      - "sc_alert_violation"
      - "sc_alert_indicator"
    modules_using:
      - "QLKD"
    columns:
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK ngày snapshot D. Driving Table: Securities Company Alert Violation (sc_alert_violation) — nguồn track draft DataModel/working/Atomic/lld/SCMS/lld_SCMS_SC_FIRM_ALERT_VIOLATION.yaml, chưa approved. ETL filter khi populate: ROW_NUMBER() OVER (PARTITION BY Securities_Company_Id ORDER BY Processing_Date DESC) = 1 AND TRUNC(Processing_Date) = D — lấy bản ghi cảnh báo mới nhất per CTCK per ngày."
        source_atomic_table: "sc_alert_violation"
        source_atomic_column: "sc_alert_violation.processing_dt"
      - logical_name: "Securities Company Dimension Id"
        physical_name: "securities_company_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK CTCK."
        source_atomic_table: "sc_alert_violation"
        source_atomic_column: "sc_alert_violation.sc_code"
      - logical_name: "Indicator Code"
        physical_name: "indicator_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: "DD"
        description: "Loại giấy phép — phân biệt Nhóm 5 (DUY_TRI_DKCP_GPKD) / Nhóm 6 (DUY_TRI_DKCP_CTCK_PHAI_SINH) / Nhóm 7 (DUY_TRI_DKCP_CTCKPS_BU_TRU) trên cùng 1 Fact. JOIN Securities Company Alert Indicator ON sc_alert_indicator.sc_alert_ind_id = sc_alert_violation.sc_alert_ind_id AND sc_alert_indicator.src_stm_code = 'SCMS_ALERT_INDICATOR'."
        source_atomic_table: "sc_alert_indicator"
        source_atomic_column: "sc_alert_indicator.ind_code"
      - logical_name: "Severity Level"
        physical_name: "severity_level"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: "DD"
        description: "Mức duy trì điều kiện cấp phép: 1=Đang duy trì tốt; 2=Gần đến giới hạn duy trì; 3=Không duy trì điều kiện cấp phép. Lấy từ Securities Company Alert Indicator (data_domain Small Counter, đúng ngữ nghĩa numeric 1/2/3) — KHÔNG lấy từ Securities Company Alert Violation.Severity_Level (data_domain Text, nhãn văn bản tự do, LLD draft ghi có thể trùng Violation_Severity_Code). JOIN Securities Company Alert Indicator ON sc_alert_indicator.sc_alert_ind_id = sc_alert_violation.sc_alert_ind_id AND sc_alert_indicator.src_stm_code = 'SCMS_ALERT_INDICATOR'."
        source_atomic_table: "sc_alert_indicator"
        source_atomic_column: "sc_alert_indicator.severity_level"

