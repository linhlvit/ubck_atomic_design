        nullable: true
        key: ""
        description: "Mã trạng thái hành nghề (scheme: PRACTICE_STATUS)"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.practice_st_code"
      - logical_name: "Practice Status Name"
        physical_name: "practice_st_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên trạng thái hành nghề — ETL-derived denormalize từ Classification (scheme: PRACTICE_STATUS)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_nm"
      - logical_name: "Active Certificate Type Code"
        physical_name: "actv_ctf_tp_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Loại CCHN hiện tại (scheme: CERTIFICATE_TYPE) — CCHN rcrd_st_code = '1'"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.ctf_tp_code"
      - logical_name: "Active Certificate Type Name"
        physical_name: "actv_ctf_tp_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên loại CCHN hiện tại — ETL-derived denormalize từ Classification (scheme: CERTIFICATE_TYPE)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_nm"
      - logical_name: "Active Certificate Number"
        physical_name: "actv_ctf_nbr"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Số CCHN hiện tại — CCHN rcrd_st_code = '1'"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.ctf_nbr"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
