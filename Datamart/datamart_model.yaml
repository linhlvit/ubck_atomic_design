    module: "QLCB"
    status: "draft"
    reuse_status: "new"
    description: "[CẬP NHẬT 2026-09-10] Hồ sơ chào bán/phát hành CK đã duyệt (APPROVAL_STATUS_CD='APPROVED') và đã có kết quả huy động (INNER JOIN Result) — tổng giá trị cấp phép/huy động theo ngành, kỳ. Grain: 1 hồ sơ chào bán × 1 ngày snapshot (ETL full-scan hàng ngày để Total Collected Amount luôn phản ánh đúng kết quả huy động mới nhất; NVL(Certificate Date, Official Letter Date) giữ vai trò Chiều/slicer)."
    source_atomic:
      - "pc_securities_offering"
      - "pc_securities_offering_plan"
      - "pc_securities_offering_result"
      - "public_company"
    modules_using:
      - "QLCB"
    columns:
      - logical_name: "Securities Offering Code"
        physical_name: "securities_offering_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: ""
        description: "[CẬP NHẬT 2026-09-10] Driving Table: Public Company Securities Offering — BK đợt chào bán, degenerate dimension dùng để tra cứu. Driving filter: WHERE pc_securities_offering.deleted_ind = 0 AND pc_securities_offering.approval_status_code = 'APPROVED' AND EXISTS (SELECT 1 FROM pc_securities_offering_result r WHERE r.pc_securities_offering_id = pc_securities_offering.pc_securities_offering_id AND r.deleted_ind = 0) AND EXISTS (SELECT 1 FROM pc_securities_offering_plan p WHERE p.pc_securities_offering_id = pc_securities_offering.pc_securities_offering_id AND p.offering_method_code NOT IN (6,7,8,10) AND p.deleted_ind = 0) — áp dụng cho toàn bộ Fact. Đổi từ LEFT JOIN Result sang bắt buộc tồn tại Result (INNER JOIN theo BA) và bổ sung filter approval_status_code/offering_method_code (trước đây không có)"
        source_atomic_table: "pc_securities_offering"
        source_atomic_column: "pc_securities_offering.pc_securities_offering_code"
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
