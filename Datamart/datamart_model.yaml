    reuse_status: "new"
    description: "Snapshot giá trị mua/bán của NĐTNN theo mã CK và toàn thị trường theo ngày — grain 1 mã CK × 1 ngày giao dịch (ETL pre-aggregate SUM Execution Value theo Foreign Investor Type Code)"
    source_atomic:
      - "securities_trade"
    modules_using:
      - "NDTNN"
    columns:
      - logical_name: "Trade Date Dimension Id"
        physical_name: "trade_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Calendar Date Dimension — LOOKUP qua Calendar Date"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.trade_dt"
      - logical_name: "Securities Dimension Id"
        physical_name: "securities_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK"
        description: "FK → Securities Dimension — LOOKUP qua Symbol (BK)"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.security_symbol_code"
      - logical_name: "Public Company Dimension Id"
        physical_name: "public_company_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: true
        key: "FK"
        description: "FK → Public Company Dimension (bảng dùng chung GSDC/QLCB/NDTNN) — LOOKUP qua mã CK (Equity Ticker Symbol, BK có sẵn của public_company_dim); nullable=true — không phải mọi mã CK trên Securities Trade đều là công ty đại chúng có Business Line (CW/derivative/ETF...) — bổ sung Nhóm 2 (partial)"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.security_symbol_code"
      - logical_name: "Foreign Buy Value"
        physical_name: "foreign_buy_val"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: false
        key: "DD"
        description: "Cơ sở K_NDTNN_1 — SUM Execution Value phía mua, lọc Foreign Investor Type Code <> '00' (khác '00' = có yếu tố nước ngoài) GROUP BY Trade Date + Symbol"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.execution_val"
      - logical_name: "Foreign Sell Value"
        physical_name: "foreign_sell_val"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: false
        key: "DD"
        description: "Cơ sở K_NDTNN_2 — SUM Execution Value phía bán, lọc Foreign Investor Type Code <> '00' GROUP BY Trade Date + Symbol"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.execution_val"
      - logical_name: "Total Market Value"
        physical_name: "total_market_val"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: false
        key: "DD"
        description: "Cơ sở K_NDTNN_3 — SUM Execution Value toàn bộ giao dịch (không lọc theo Investor Type) GROUP BY Trade Date + Symbol"
        source_atomic_table: "securities_trade"
        source_atomic_column: "securities_trade.execution_val"

