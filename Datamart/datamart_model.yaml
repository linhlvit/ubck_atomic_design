      - logical_name: "Index PE"
        physical_name: "idx_pe"
        data_domain: "Percentage"
        data_type: "decimal(10,2)"
        nullable: true
        key: ""
        description: "[MỚI 2026-09-19, review Nhóm 6] P/E CỦA CHỈ SỐ (khác K_GSTT_58 — P/E TỪNG MÃ, dùng cho Nhóm 7/9/11/13/15/17/19/21/32/33, đã xác nhận qua cột Độ chi tiết = 'Mã CK' ở các Nhóm đó). Nhóm 6 riêng có Độ chi tiết = 'Danh mục chỉ số - theo giờ' + Mô tả BA 'Vốn hóa CỦA CHỈ SỐ / LNST CỦA CHỈ SỐ' + SQL tham khảo SUM/SUM GROUP BY marketCode — = SUM(Vốn hóa TOÀN BỘ mã trong rổ) / SUM(LNST TTM từng mã) — [SỬA 2026-09-19, theo yêu cầu trực tiếp — bỏ CASE WHEN NOT NULL] bỏ điều kiện lọc 'CÓ LNST TTM' ở tử số theo yêu cầu trực tiếp; tử số nay là tổng vốn hóa cả rổ không điều kiện, mẫu số vẫn chỉ cộng LNST TTM của mã nào có dữ liệu (NULL tự động bị SUM bỏ qua), GROUP BY Index Code + Trading Date — tính sẵn trên Fact Index Constituent Snapshot (cùng cơ chế idx_market_cap). GIÁ TRỊ LẶP LẠI trên mọi dòng Symbol cùng Index+Date — TUYỆT ĐỐI KHÔNG SUM/AVG lại cột này theo Symbol, dùng MAX()/ANY_VALUE() GROUP BY Index Code, Trading Date hoặc SELECT DISTINCT (không thể suy ra P/E của rổ từ AVG các P/E từng mã)."
        source_atomic_table: "fr_value"
        source_atomic_column: "fr_value.data_val"
      - logical_name: "Index PB"
        physical_name: "idx_pb"
        data_domain: "Percentage"
        data_type: "decimal(10,2)"
        nullable: true
        key: ""
        description: "[MỚI 2026-09-19, review Nhóm 6] P/B CỦA CHỈ SỐ (khác K_GSTT_59 — P/B TỪNG MÃ, dùng cho Nhóm 7/9/11/13/15/17/19/21/32/33, đã xác nhận qua cột Độ chi tiết = 'Mã CK' ở các Nhóm đó). Nhóm 6 riêng có Độ chi tiết = 'Danh mục chỉ số - theo giờ' + Mô tả BA 'Vốn hóa CỦA CHỈ SỐ / VCSH CỦA CHỈ SỐ' + SQL tham khảo SUM/SUM GROUP BY marketCode — = SUM(Vốn hóa TOÀN BỘ mã trong rổ) / SUM(VCSH từng mã) — [SỬA 2026-09-19, theo yêu cầu trực tiếp — bỏ CASE WHEN NOT NULL] bỏ điều kiện lọc 'CÓ VCSH' ở tử số theo yêu cầu trực tiếp; tử số nay là tổng vốn hóa cả rổ không điều kiện, mẫu số vẫn chỉ cộng VCSH của mã nào có dữ liệu (NULL tự động bị SUM bỏ qua), GROUP BY Index Code + Trading Date — tính sẵn trên Fact Index Constituent Snapshot (cùng cơ chế idx_market_cap). GIÁ TRỊ LẶP LẠI trên mọi dòng Symbol cùng Index+Date — TUYỆT ĐỐI KHÔNG SUM/AVG lại cột này theo Symbol, dùng MAX()/ANY_VALUE() GROUP BY Index Code, Trading Date hoặc SELECT DISTINCT (không thể suy ra P/B của rổ từ AVG các P/B từng mã)."
        source_atomic_table: "fr_value"
        source_atomic_column: "fr_value.data_val"
      - logical_name: "Index EPS"
        physical_name: "idx_eps"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: true
        key: ""
        description: "[MỚI 2026-09-19, review Nhóm 6] EPS CỦA CHỈ SỐ (khác K_GSTT_60 — EPS TỪNG MÃ, dùng cho Nhóm 7/9/11/13/15/17/19/21/32/33). Mô tả BA: 'Tổng lợi nhuận sau thuế / Tổng Khối lượng cổ phiếu lưu hành' = SUM(LNST TTM) / SUM(Số CP lưu hành) của TOÀN BỘ mã CK thành viên rổ chỉ số, GROUP BY Index Code + Trading Date. **Lưu ý (xem O_GSTT_24):** SQL tham khảo BA cho dòng EPS (STT 6, dòng 98) là bản sao SQL của P/E/P/B (không có cột eps_chi_so riêng) — không rõ mẫu số (Tổng Số CP lưu hành) có cần loại trừ các mã KHÔNG có LNST TTM giống P/E/P/B hay không. Tạm implement theo đúng nghĩa đen Mô tả (SUM không lọc) — cần BA xác nhận lại. GIÁ TRỊ LẶP LẠI trên mọi dòng Symbol cùng Index+Date — TUYỆT ĐỐI KHÔNG SUM/AVG lại theo Symbol."
        source_atomic_table: "fr_value"
        source_atomic_column: "fr_value.data_val"
      - logical_name: "Index Prior Market Cap"
        physical_name: "idx_prior_market_cap"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: true
        key: ""
        description: "[SỬA 2026-09-19, review Nhóm 24] Tổng vốn hóa TOÀN RỔ chỉ số tại phiên giao dịch LIỀN TRƯỚC (T-1) — LAG(Index Market Cap) OVER (PARTITION BY Index Code ORDER BY Trading Date), giá trị T-1 lưu sẵn trên dòng T (cùng pattern `fct_market_index_snpst.prior_index`). Mẫu số đúng của trọng số K_GSTT_74 (xem `fct_stock_portfolio_snpst.prior_market_cap` — lý do sửa như nhau, xem ghi chú tại đó)."
        source_atomic_table: "index_constituent_snapshot"
