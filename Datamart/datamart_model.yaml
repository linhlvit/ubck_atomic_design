      - logical_name: "Nationality Code"
        physical_name: "nat_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Mã quốc tịch NHN"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.nat_code"
      - logical_name: "Nationality Name"
        physical_name: "nat_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên quốc tịch — ETL-derived denormalize từ Classification (scheme: NATIONALITY)"
