        physical_name: "idx_prior_free_float_market_cap"
        data_domain: "Currency Amount"
        data_type: "decimal(23,2)"
        nullable: true
        key: ""
        description: "[SỬA 2026-09-19, review Nhóm 24] Tổng vốn hóa tự do chuyển nhượng TOÀN RỔ chỉ số tại phiên giao dịch LIỀN TRƯỚC (T-1) — LAG(Index Free Float Market Cap) OVER (PARTITION BY Index Code ORDER BY Trading Date), giá trị T-1 lưu sẵn trên dòng T (cùng pattern `fct_market_index_snpst.prior_index`). Mẫu số đúng của trọng số K_GSTT_76 (xem `fct_stock_portfolio_snpst.prior_free_float_market_cap` — lý do sửa như nhau, xem ghi chú tại đó)."
        source_atomic_table: "index_constituent_snapshot"
        source_atomic_column: "index_constituent_snapshot.index_code / trading_dt"

