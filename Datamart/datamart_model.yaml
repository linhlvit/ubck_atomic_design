schema_type: datamart_model
schema_version: "1.0"

# ============================================================
# DATAMART MODEL — Registry schema cross-module
# ============================================================
# Mục đích: nguồn sự thật duy nhất về schema của mọi Datamart entity.
# Khi module B partial thêm cột vào bảng của module A
# → cập nhật file này → schema trong model luôn là phiên bản đầy đủ nhất.
#
# QUY TẮC GHI:
#   - id: "DTM-{datamart_table}" — unique cross-module, không thay đổi sau khi tạo
#   - datamart_table: snake_case — không đổi sau khi ghi lần đầu
#   - source_atomic_table và source_atomic_column: luôn cùng độ dài list, 1-1 theo index
#   - source_atomic_column: format "table.column"; null nếu Generated
#   - Ghi vào file này SAU KHI human approve merge master (Phase 1 LLD)
#
# FIELDS entity-level:
#   id, logical_name, datamart_table, table_type, module, status,
#   reuse_status, description, source_atomic, modules_using, columns
#
# FIELDS column-level:
#   logical_name, physical_name, data_domain, data_type, nullable,
#   key, description, source_atomic_table, source_atomic_column
#
# table_type  : dim / fact / operational
# module      : tên module viết HOA (NHNCK, PTTT, ...) hoặc SHARED
# status      : draft / approved
# reuse_status: new / reuse / partial
# key         : PK / NK / FK → <Dim> / DD / "" (trống)
# ============================================================

entities:

  - id: "DTM-cdr_dt_dim"
    logical_name: "Calendar Date Dimension"
    datamart_table: "cdr_dt_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Lịch ngày — năm/quý/tháng/ngày lễ. Conformed Dim dùng chung toàn Datamart. Grain: 1 ngày."
    source_atomic:
      - "cdr_dt"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Calendar Date Dimension Id"
        physical_name: "cdr_dt_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cdr_dt"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt_id"
      - logical_name: "Calendar Date"
        physical_name: "cdr_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: false
        key: "NK"
        description: "NK — ngày lịch dùng để join từ Fact"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Year"
        physical_name: "yr"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Năm (YYYY)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Quarter"
        physical_name: "qtr"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Quý (1–4)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Month"
        physical_name: "mth"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Tháng (1–12)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Day Of Week"
        physical_name: "day_of_wk"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Thứ trong tuần (1=Chủ nhật, 7=Thứ bảy)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Is Weekend"
        physical_name: "is_weekend"
        data_domain: "Boolean"
        data_type: "boolean"
        nullable: false
        key: ""
        description: "TRUE nếu là ngày cuối tuần (thứ 7 hoặc CN)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Holiday Flag"
        physical_name: "hol_f"
        data_domain: "Boolean"
        data_type: "boolean"
        nullable: true
        key: ""
        description: "Cờ ngày lễ — TRUE nếu là ngày nghỉ lễ"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.hol_f"
      - logical_name: "Holiday Name"
        physical_name: "hol_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên ngày lễ — NULL nếu không phải ngày lễ"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.hol_nm"

  - id: "DTM-scr_prac_dim"
    logical_name: "Securities Practitioner Dimension"
    datamart_table: "scr_prac_dim"
    table_type: "dim"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng thái hành nghề. SCD4A (current state). Grain: 1 NHN."
    source_atomic:
      - "scr_prac"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Securities Practitioner Dimension Id"
        physical_name: "scr_prac_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: scr_prac (NHNCK.PROFESSIONALS)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Practitioner Code"
        physical_name: "prac_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã NHN, dùng để join từ Fact"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.scr_prac_code"
      - logical_name: "Full Name"
        physical_name: "full_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Họ tên đầy đủ NHN"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.full_nm"
      - logical_name: "Education Level Code"
        physical_name: "ed_lvl_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trình độ học vấn — Classification Value (scheme: EDUCATION_LEVEL)"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.ed_lvl_code"
      - logical_name: "Nationality Code"
        physical_name: "nat_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Mã quốc tịch NHN"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.nat_code"
      - logical_name: "Date Of Birth"
        physical_name: "brth_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày sinh NHN"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.brth_dt"
      - logical_name: "Practice Status Code"
        physical_name: "practice_st_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trạng thái hành nghề — Classification Value (scheme: PRACTICE_STATUS)"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.practice_st_code"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.src_stm_code"

  - id: "DTM-cls_dim"
    logical_name: "Classification Dimension"
    datamart_table: "cls_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Danh mục phân loại — toàn bộ từ bảng cv Atomic. PK surrogate cl_dim_id. BK: (scm_code, cl_code). Conformed Dim. Grain: 1 giá trị phân loại per scheme."
    source_atomic:
      - "cv"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Classification Dimension Id"
        physical_name: "cl_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cv (toàn bộ Classification Value)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Scheme Code"
        physical_name: "scm_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã scheme; BK: (scm_code, cl_code)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.scm_code"
      - logical_name: "Scheme Name"
        physical_name: "scm_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên scheme phân loại"
        source_atomic_table: "cv"
        source_atomic_column: "cv.scm_nm"
      - logical_name: "Classification Code"
        physical_name: "cl_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã giá trị phân loại; BK: (scm_code, cl_code)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_code"
      - logical_name: "Classification Name"
        physical_name: "cl_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên giá trị phân loại"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_nm"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived từ cv"
        source_atomic_table: "cv"
        source_atomic_column: "cv.src_stm_code"

  - id: "DTM-fct_prac_license_ctf_snpst"
    logical_name: "Fact Practitioner License Certificate Snapshot"
    datamart_table: "fct_prac_license_ctf_snpst"
    table_type: "fact"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "Snapshot CCHN theo tháng — đếm CCHN còn hiệu lực/bị thu hồi/cấp mới per NHN. Grain: 1 CCHN × 1 tháng snapshot."
    source_atomic:
      - "scr_prac_license_ctf_doc"
      - "scr_prac_license_ap"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Practitioner Dimension Id"
        physical_name: "prac_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Securities Practitioner Dimension"
        description: "FK NHN — lookup qua prac_code"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.scr_prac_code"
      - logical_name: "Issue Date Dimension Id"
        physical_name: "issu_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "FK ngày cấp CCHN — từ scr_prac_license_ap.issu_dt"
        source_atomic_table: "scr_prac_license_ap"
        source_atomic_column: "scr_prac_license_ap.issu_dt"
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "FK ngày snapshot tháng — ETL runtime date"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Certificate Type Classification Dimension Id"
        physical_name: "ctf_tp_cl_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Classification Dimension"
        description: "FK loại CCHN — lookup cls_dim (scheme: CERTIFICATE_TYPE)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.ctf_tp_code"
      - logical_name: "Certificate Status Classification Dimension Id"
        physical_name: "ctf_st_cl_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Classification Dimension"
        description: "FK trạng thái CCHN — lookup cls_dim (scheme: CERTIFICATE_STATUS)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.rcrd_st_code"
      - logical_name: "License Certificate Document Code"
        physical_name: "license_ctf_doc_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "DD"
        description: "DD — BK CCHN; đơn vị đếm COUNT(DISTINCT ...)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.scr_prac_license_ctf_doc_code"
      - logical_name: "Certificate Type Code"
        physical_name: "ctf_tp_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: ""
        description: "Loại CCHN — dư thừa để filter nhanh (scheme: CERTIFICATE_TYPE)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.ctf_tp_code"
      - logical_name: "Certificate Status Code"
        physical_name: "ctf_st_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: ""
        description: "Trạng thái CCHN — dư thừa để filter nhanh (scheme: CERTIFICATE_STATUS)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.rcrd_st_code"
      - logical_name: "Allow Reissue Indicator"
        physical_name: "alw_reissue_ind"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "Cho phép cấp lại CCHN (Y/N)"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.reissuance_allowed_cnt"
      - logical_name: "Is Reissue Indicator"
        physical_name: "is_reissue_ind"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "ETL-derived: Y nếu Application Type IN ('1','2','3'); N nếu = '0'"
        source_atomic_table: "scr_prac_license_ap"
        source_atomic_column: "scr_prac_license_ap.ap_tp_code"
      - logical_name: "Certificate Issue Date"
        physical_name: "ctf_issu_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày cấp CCHN — từ scr_prac_license_ap.issu_dt"
        source_atomic_table: "scr_prac_license_ap"
        source_atomic_column: "scr_prac_license_ap.issu_dt"
      - logical_name: "Revocation Date"
        physical_name: "revocation_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày thu hồi CCHN — NULL nếu chưa thu hồi"
        source_atomic_table: "scr_prac_license_ctf_doc"
        source_atomic_column: "scr_prac_license_ctf_doc.revocation_dt"
      - logical_name: "Decision Type Code"
        physical_name: "dcsn_tp_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Loại quyết định thu hồi/hủy CCHN — Classification Value (scheme: DECISION_TYPE): 2=Thu hồi, 6=Hủy CCHN; NULL nếu chưa có quyết định"
        source_atomic_table: "scr_prac_license_dcsn_doc"
        source_atomic_column: "scr_prac_license_dcsn_doc.dcsn_tp_code"

  - id: "DTM-opr_prac_360_profile"
