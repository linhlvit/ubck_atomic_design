        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.src_stm_code"
  - id: "DTM-fct_prac_dly_snpst"
    logical_name: "Fact Practitioner Daily Snapshot"
    datamart_table: "fct_prac_dly_snpst"
    table_type: "fact"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "Snapshot NHN theo ngày — tuổi, cờ có CCHN active, cờ có vi phạm active. Grain: 1 NHN × 1 ngày snapshot."
