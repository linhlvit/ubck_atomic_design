        description: "Ngày sinh NHN — NULL nếu chỉ có năm sinh"
        source_atomic_table: "scr_prac"
        source_atomic_column: "scr_prac.brth_dt"
      - logical_name: "Age"
        physical_name: "age"
        data_domain: "Small Counter"
