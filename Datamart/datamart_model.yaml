schema_type: datamart_model
schema_version: "1.0"

# ============================================================
# DATAMART MODEL — Registry schema cross-module
# ============================================================
# Mục đích: nguồn sự thật duy nhất về schema của mọi Datamart entity.
# Khi module B partial thêm cột vào bảng của module A
# → cập nhật file này → schema trong model luôn là phiên bản đầy đủ nhất.
#
# QUY TẮC GHI:
#   - id: "DTM-{datamart_table}" — unique cross-module, không thay đổi sau khi tạo
#   - datamart_table: snake_case — không đổi sau khi ghi lần đầu
#   - source_atomic_table và source_atomic_column: luôn cùng độ dài list, 1-1 theo index
#   - source_atomic_column: format "table.column"; null nếu Generated
#   - Ghi vào file này SAU KHI human approve merge master (Phase 1 LLD)
#
# FIELDS entity-level:
#   id, logical_name, datamart_table, table_type, module, status,
#   reuse_status, description, source_atomic, modules_using, columns
#
# FIELDS column-level:
#   logical_name, physical_name, data_domain, data_type, nullable,
#   key, description, source_atomic_table, source_atomic_column
#
# table_type  : dim / fact / operational
# module      : tên module viết HOA (NHNCK, PTTT, ...) hoặc SHARED
# status      : draft / approved
# reuse_status: new / reuse / partial
# key         : PK / NK / FK → <Dim> / DD / "" (trống)
# ============================================================

entities:

  - id: "DTM-cdr_dt_dim"
    logical_name: "Calendar Date Dimension"
    datamart_table: "cdr_dt_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Lịch ngày — năm/quý/tháng/ngày nghỉ. Conformed Dim dùng chung toàn Datamart. Grain: 1 ngày."
    source_atomic:
      - "cdr_dt"
    modules_using:
      - "NHNCK"
      - "GSDC"
    columns:
      - logical_name: "Calendar Date Dimension Id"
        physical_name: "cdr_dt_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cdr_dt"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt_id"
      - logical_name: "Calendar Date"
        physical_name: "cdr_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: false
        key: "NK"
        description: "NK — ngày lịch dùng để join từ Fact"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Year"
        physical_name: "year"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Năm (YYYY)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Quarter"
        physical_name: "quarter"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Quý (1–4)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Month"
        physical_name: "month"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Tháng (1–12)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Day Of Week"
        physical_name: "day_of_week"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: false
        key: ""
        description: "Thứ trong tuần (1=Chủ nhật, 7=Thứ bảy)"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Is Weekend"
        physical_name: "is_weekend"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "(Sửa 2026-07-17) Y nếu là ngày cuối tuần (thứ 7 hoặc CN), N nếu không"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.cdr_dt"
      - logical_name: "Holiday Flag"
        physical_name: "holiday_flag"
        data_domain: "Indicator"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Sửa 2026-07-20) Cờ đánh dấu ngày nghỉ — Y nếu là ngày nghỉ, N nếu không. Chỉ đánh dấu nghỉ/không nghỉ, không phân biệt loại nghỉ. Atomic cdr_dt hiện chỉ có Holiday Flag (hol_f — public holiday); ETL tạm map trực tiếp, chờ Atomic bổ sung nếu cần phân biệt thêm loại ngày nghỉ khác"
        source_atomic_table: "cdr_dt"
        source_atomic_column: "cdr_dt.hol_f"

  - id: "DTM-securities_practitioner_dim"
    logical_name: "Securities Practitioner Dimension"
    datamart_table: "securities_practitioner_dim"
    table_type: "dim"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng thái hành nghề. SCD4A (current state). Grain: 1 NHN."
    source_atomic:
      - "securities_practitioner"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Securities Practitioner Dimension Id"
        physical_name: "securities_practitioner_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: securities_practitioner (NHNCK.PROFESSIONALS)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Practitioner Code"
        physical_name: "practitioner_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã NHN, dùng để join từ Fact"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.sp_code"
      - logical_name: "Full Name"
        physical_name: "full_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Họ tên đầy đủ NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.full_nm"
      - logical_name: "Education Level Code"
        physical_name: "education_level_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trình độ học vấn — Classification Value (scheme: EDUCATION_LEVEL)"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.education_level_code"
      - logical_name: "Nationality Code"
        physical_name: "nationality_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Mã quốc tịch NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.nationality_code"
      - logical_name: "Date Of Birth"
        physical_name: "birth_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày sinh NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.birth_dt"
      - logical_name: "Practice Status Code"
        physical_name: "practice_status_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trạng thái hành nghề — Classification Value (scheme: PRACTITIONER_PRACTICE_STATUS)"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.practice_status_code"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.src_stm_code"

  - id: "DTM-sp_license_certificate_type_dim"
    logical_name: "SP License Certificate Type Dimension"
    datamart_table: "sp_license_certificate_type_dim"
    table_type: "dim"
    module: "NHNCK"
    status: "approved"
    reuse_status: "new"
    description: "Loại CCHN (Môi giới, Phân tích, QLQ...) — Fundamental entity riêng, không phải Classification Value. SCD4A (current state). Grain: 1 loại CCHN. Atomic nguồn sp_license_certificate_type (NHNCK.CERTIFICATES, DataModel/working/Atomic)."
    source_atomic:
      - "sp_license_certificate_type"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Certificate Type Dimension Id"
        physical_name: "certificate_tp_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: sp_license_certificate_type (NHNCK.CERTIFICATES)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Certificate Type Code"
        physical_name: "certificate_tp_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã loại CCHN, dùng để join từ Fact/Operational"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.sp_license_certificate_type_code"
      - logical_name: "Certificate Type Name"
        physical_name: "certificate_tp_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên loại CCHN (VD: Môi giới, Phân tích, QLQ)"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.certificate_nm"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived"
        source_atomic_table: "sp_license_certificate_type"
        source_atomic_column: "sp_license_certificate_type.src_stm_code"

  - id: "DTM-cl_dim"
    logical_name: "Classification Dimension"
    datamart_table: "cl_dim"
    table_type: "dim"
    module: "SHARED"
    status: "draft"
    reuse_status: "new"
    description: "Danh mục phân loại — toàn bộ từ bảng cv Atomic. PK surrogate cl_dim_id. BK: (scm_code, cl_code). Conformed Dim. Grain: 1 giá trị phân loại per scheme."
    source_atomic:
      - "cv"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Classification Dimension Id"
        physical_name: "cl_dim_id"
        data_domain: "Surrogate Key"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: cv (toàn bộ Classification Value)"
        source_atomic_table: null
        source_atomic_column: null
      - logical_name: "Scheme Code"
        physical_name: "scm_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã scheme; BK: (scm_code, cl_code)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.scm_code"
      - logical_name: "Scheme Name"
        physical_name: "scm_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên scheme phân loại"
        source_atomic_table: "cv"
        source_atomic_column: "cv.scm_nm"
      - logical_name: "Classification Code"
        physical_name: "cl_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "NK"
        description: "NK — mã giá trị phân loại; BK: (scm_code, cl_code)"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_code"
      - logical_name: "Classification Name"
        physical_name: "cl_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên giá trị phân loại"
        source_atomic_table: "cv"
        source_atomic_column: "cv.cl_nm"
      - logical_name: "Source System Code"
        physical_name: "src_stm_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã hệ thống nguồn — ETL-derived từ cv"
        source_atomic_table: "cv"
        source_atomic_column: "cv.src_stm_code"

  - id: "DTM-fct_practitioner_license_certificate_snpst"
    logical_name: "Fact Practitioner License Certificate Snapshot"
    datamart_table: "fct_practitioner_license_certificate_snpst"
    table_type: "fact"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "Snapshot CCHN theo tháng — đếm CCHN còn hiệu lực/bị thu hồi/cấp mới per NHN. Grain: 1 CCHN × 1 tháng snapshot."
    source_atomic:
      - "sp_license_certificate_document"
      - "securities_practitioner_license_application"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Practitioner Dimension Id"
        physical_name: "practitioner_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Securities Practitioner Dimension"
        description: "FK NHN — lookup qua practitioner_code"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_code"
      - logical_name: "Issue Date Dimension Id"
        physical_name: "issue_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "FK ngày cấp CCHN — từ securities_practitioner_license_ap.issue_dt"
        source_atomic_table: "securities_practitioner_license_application"
        source_atomic_column: "securities_practitioner_license_application.issue_dt"
      - logical_name: "Snapshot Date Dimension Id"
        physical_name: "snpst_dt_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → Calendar Date Dimension"
        description: "FK ngày snapshot tháng — ETL runtime date"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: null
      - logical_name: "Certificate Type Dimension Id"
        physical_name: "certificate_tp_dim_id"
        data_domain: "Surrogate Dimension Key"
        data_type: "string"
        nullable: false
        key: "FK → SP License Certificate Type Dimension"
        description: "FK loại CCHN — lookup sp_license_certificate_type_dim qua sp_license_certificate_type_code"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_type_code"
      - logical_name: "License Certificate Document Code"
        physical_name: "license_certificate_document_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "DD"
        description: "DD — BK CCHN; đơn vị đếm COUNT(DISTINCT ...)"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_document_code"
      - logical_name: "Certificate Type Code"
        physical_name: "certificate_tp_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: ""
        description: "Mã loại CCHN — dư thừa để filter/display nhanh không cần join (= CERTIFICATES.CERTIFICATE_CODE)"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.sp_license_certificate_type_code"
      - logical_name: "Is Reissue Indicator"
        physical_name: "is_reissue_indicator"
        data_domain: "Indicator"
        data_type: "string"
        nullable: false
        key: ""
        description: "ETL-derived: Y nếu Application Type IN ('1','2','3'); N nếu = '0'"
        source_atomic_table: "securities_practitioner_license_application"
        source_atomic_column: "securities_practitioner_license_application.application_tp_code"
      - logical_name: "Certificate Issue Date"
        physical_name: "certificate_issue_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày cấp CCHN — từ securities_practitioner_license_ap.issue_dt"
        source_atomic_table: "securities_practitioner_license_application"
        source_atomic_column: "securities_practitioner_license_application.issue_dt"
      - logical_name: "Revocation Date"
        physical_name: "revocation_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày thu hồi CCHN — NULL nếu chưa thu hồi"
        source_atomic_table: "sp_license_certificate_document"
        source_atomic_column: "sp_license_certificate_document.revocation_dt"
      - logical_name: "Decision Type Code"
        physical_name: "decision_tp_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Loại quyết định thu hồi/hủy CCHN — Classification Value (scheme: LICENSE_CERTIFICATE_DECISION_TYPE): 2=Thu hồi, 6=Hủy CCHN; NULL nếu chưa có quyết định"
        source_atomic_table: "sp_license_decision_document"
        source_atomic_column: "sp_license_decision_document.decision_tp_code"

  - id: "DTM-opr_practitioner_360_profile"
    logical_name: "Operational Practitioner 360 Profile"
    datamart_table: "opr_practitioner_360_profile"
    table_type: "operational"
    module: "NHNCK"
    status: "draft"
    reuse_status: "new"
    description: "Hồ sơ 360° NHN — latest state. Lookup 1 NHN: họ tên, tuổi, quốc tịch, CCCD, nơi công tác, CCHN hiện tại, trạng thái. Grain: 1 NHN."
    source_atomic:
      - "securities_practitioner"
      - "ip_alt_identn"
      - "sp_organization_employment_report"
      - "sp_license_certificate_type"
      - "cv"
    modules_using:
      - "NHNCK"
    columns:
      - logical_name: "Practitioner Code"
        physical_name: "practitioner_code"
        data_domain: "Text"
        data_type: "string"
        nullable: false
        key: "PK"
        description: "PK — Driving: securities_practitioner (NHNCK.PROFESSIONALS + NHNCK.PROFESSIONAL_HISTORIES). Grain: 1 NHN latest state"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.sp_code"
      - logical_name: "Full Name"
        physical_name: "full_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Họ tên đầy đủ NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.full_nm"
      - logical_name: "Birth Date"
        physical_name: "birth_dt"
        data_domain: "Date"
        data_type: "date"
        nullable: true
        key: ""
        description: "Ngày sinh NHN — NULL nếu chỉ có năm sinh"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.birth_dt"
      - logical_name: "Age"
        physical_name: "age"
        data_domain: "Small Counter"
        data_type: "int"
        nullable: true
        key: ""
        description: "Tuổi NHN tại thời điểm populate — ETL-derived: YEAR({etl_date}) − COALESCE(YEAR(securities_practitioner.birth_dt), securities_practitioner.birth_year)"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.birth_dt / birth_year"
      - logical_name: "Nationality Code"
        physical_name: "nationality_code"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Mã quốc tịch NHN"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.nationality_code"
      - logical_name: "Nationality Name"
        physical_name: "nationality_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên quốc tịch — ETL-derived: denormalize từ Geographic Area tại thời điểm populate"
        source_atomic_table: "geographic_area"
        source_atomic_column: "geographic_area.geographic_area_nm"
      - logical_name: "Identification Number"
        physical_name: "identification_nbr"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Số CCCD/Hộ chiếu NHN — lấy bản ghi identification_tp_code IN ('CCCD','PASSPORT')"
        source_atomic_table: "ip_alternative_identification"
        source_atomic_column: "ip_alternative_identification.identification_nbr"
      - logical_name: "Workplace"
        physical_name: "workplace_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "(Sửa 2026-07-20) Nơi công tác hiện tại — lấy từ báo cáo tổ chức mới nhất (MAX Report Date ≤ ETL date), không phải PROFESSIONALS.WORKPLACE"
        source_atomic_table: "sp_organization_employment_report"
        source_atomic_column: "sp_organization_employment_report.practitioner_workplace_at_rpt"
      - logical_name: "Practice Status Code"
        physical_name: "practice_status_code"
        data_domain: "Classification Value"
        data_type: "string"
        nullable: true
        key: ""
        description: "Trạng thái hành nghề — Classification Value (scheme: PRACTITIONER_PRACTICE_STATUS): 0=Chưa HN, 1=Đang HN, 2=Thu hồi cấp lại, 3=Thu hồi không cấp lại, 4=Có thời hạn"
        source_atomic_table: "securities_practitioner"
        source_atomic_column: "securities_practitioner.practice_status_code"
      - logical_name: "Practice Status Name"
        physical_name: "practice_status_nm"
        data_domain: "Text"
        data_type: "string"
        nullable: true
        key: ""
        description: "Tên trạng thái hành nghề — ETL-derived: denormalize từ Classification (scheme: PRACTITIONER_PRACTICE_STATUS) tại thời điểm populate"
