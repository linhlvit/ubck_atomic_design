schema_type: datamart_model
schema_version: "1.0"

# ============================================================
# DATAMART MODEL — Registry schema cross-module
# ============================================================
# Mục đích: nguồn sự thật duy nhất về schema của mọi Datamart entity.
# Khi module B partial thêm cột vào bảng của module A
# → cập nhật file này → schema trong model luôn là phiên bản đầy đủ nhất.
#
# QUY TẮC GHI:
#   - id: "DTM-{datamart_table}" — unique cross-module, không thay đổi sau khi tạo
#   - datamart_table: snake_case — không đổi sau khi ghi lần đầu
#   - source_atomic_table và source_atomic_column: luôn cùng độ dài list, 1-1 theo index
#   - source_atomic_column: format "table.column"; null nếu Generated
#   - Ghi vào file này SAU KHI human approve merge master (Phase 1 LLD)
#
# FIELDS entity-level:
#   id, logical_name, datamart_table, table_type, module, status,
#   reuse_status, description, source_atomic, modules_using, columns
#
# FIELDS column-level:
#   logical_name, physical_name, data_domain, data_type, nullable,
#   key, description, source_atomic_table, source_atomic_column
#
# table_type  : dim / fact / operational
# module      : tên module viết HOA (NHNCK, PTTT, ...) hoặc SHARED
# status      : draft / approved
# reuse_status: new / reuse / partial
# key         : PK / NK / FK → <Dim> / DD / "" (trống)
# ============================================================

entities: []
