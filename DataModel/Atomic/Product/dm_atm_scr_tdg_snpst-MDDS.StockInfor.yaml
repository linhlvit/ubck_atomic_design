schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-scr_tdg_snpst-MDDS.StockInfor
  logical_name: Security Trading Snapshot
  physical_name: scr_tdg_snpst
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Product
  bcv_concept: "[Product] Financial Market Instrument"
  table_type: Fact Snapshot
  etl_pattern: Fact Snapshot
  source: MDDS
  description: |
    Snapshot trạng thái giao dịch của một công cụ tài chính (cổ phiếu, chứng quyền, hợp đồng phái sinh, chứng chỉ quỹ) tại một thời điểm trong ngày giao dịch, bao gồm giá, sổ lệnh, NĐTNN và thông tin đặc thù theo loại instrument.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-MDDS-StockInfor

attributes:
  - name: Security Trading Snapshot Id
    physical_name: scr_tdg_snpst_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: MDDS
    source_table: StockInfor
    source_column: null
    comment: "PK surrogate. BCV: [Product] Financial Market Instrument. Snapshot trạng thái giao dịch của 1 mã CK tại 1 thời điểm."
    classification_context: "Source System Code = 'MDDS_STOCKINFOR'"
    etl_derived_value: null

  - name: Security Trading Snapshot Code
    physical_name: scr_tdg_snpst_code
