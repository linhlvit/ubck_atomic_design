    physical_name: securities_trade_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: HNX
    source_table: TRADE_BOOK
    source_column: HNX.TRADE_BOOK.TRADE_NUMBER
    comment: "PK surrogate. BCV: \"[Transaction] Financial Market Transaction\". Khớp lệnh thành công trên HNX — mỗi trade là 1 bản ghi Fact Append. Hash: hash_id('HNX_TRADE_BOOK', TRADE_NUMBER) — hash từ Business Key (cột TRADE_NUMBER)."
    classification_context: null
    etl_derived_value: null

