schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-security_match_log-MDDS.JAD_TRANSLOG
  logical_name: Security Match Log
  physical_name: security_match_log
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Transaction
  bcv_concept: "[Transaction] Financial Market Transaction"
  table_type: Fact Append
  etl_pattern: Fact Append
  source: MDDS
  description: |
    Log từng lần khớp lệnh (tick-by-tick) của cổ phiếu niêm yết trong ngày giao dịch, bao gồm giá khớp, khối lượng khớp, chiều giao dịch chủ động, và lũy kế khối lượng/giá trị từ đầu ngày.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-MDDS-JAD_TRANSLOG

