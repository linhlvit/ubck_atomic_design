    data_type: string
    nullable: false
    is_primary_key: true
    source_system: OrderTrade
    source_table: Trade_HNX
    source_column: null
    comment: "PK surrogate. BCV: \"[Transaction] Financial Market Transaction\". Khớp lệnh thành công trên HNX — mỗi trade là 1 bản ghi Fact Append."
    classification_context: "Source System Code = 'ORDERTRADE_TRADE_HNX'"
    etl_derived_value: null

