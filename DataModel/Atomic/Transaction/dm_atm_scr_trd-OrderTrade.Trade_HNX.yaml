  bcv_core_object: Transaction
  bcv_concept: "[Transaction] Financial Market Transaction"
  table_type: Fact Append
  etl_pattern: Fact Append
  source: OrderTrade
  description: |
    Từng lần khớp lệnh thành công trên HOSE và HNX. Mỗi dòng = 1 Trade ID. Lưu đồng thời thông tin bên mua và bên bán trong cùng 1 row. FK-BK về Securities Order qua buy/sell_scr_ordr_code.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-OrderTrade-Trade_HNX

