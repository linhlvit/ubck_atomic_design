schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-scr_mtch_log-MDDS.TransLog
  logical_name: Security Match Log
  physical_name: scr_mtch_log
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Transaction
  bcv_concept: "[Transaction] Financial Market Transaction"
  table_type: Fact Append
  etl_pattern: Fact Append
  source: MDDS
  description: |
    Log từng lần khớp lệnh (tick-by-tick) của cổ phiếu niêm yết trong ngày giao dịch, bao gồm giá khớp, khối lượng khớp, chiều giao dịch chủ động, và lũy kế khối lượng/giá trị từ đầu ngày.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-MDDS-TransLog

attributes:
  - name: Security Match Log Id
    physical_name: scr_mtch_log_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: MDDS
    source_table: TransLog
    source_column: null
    comment: "PK surrogate. BCV: [Transaction] Financial Market Transaction. 1 tick khớp lệnh CK."
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Security Match Log Code
    physical_name: scr_mtch_log_code
    business_meaning: ID unique cho từng lần khớp — PK bảng nguồn. BK.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.Id
    comment: BK chính. PK nguồn Id — unique per lần khớp lệnh.
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM."
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: MDDS.TransLog

  - name: Symbol
    physical_name: symb
    business_meaning: Mã chứng khoán.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.symbol
    comment: "Denormalized join key với Security Trading Snapshot — D-02 quyết định không tạo FK surrogate."
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Trading Date
    physical_name: tdg_dt
    business_meaning: Ngày giao dịch.
    data_domain: Date
    data_type: date
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.tradingdate
    comment: Nguồn lưu dạng string — ETL cần parse sang date. Denormalized join key với Security Trading Snapshot.
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Match Time
    physical_name: mtch_tm
    business_meaning: Thời gian khớp.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.formattedTime
    comment: Nguồn lưu dạng string — giữ Text vì format chưa chuẩn hóa. Cần profile trước khi convert sang Timestamp.
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Sequence Message
    physical_name: seq_msg
    business_meaning: Sequence tín hiệu của sở.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.sequenceMsg
    comment: Metadata kỹ thuật từ Sở — giữ để traceability và deduplication.
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Trade Direction Code
    physical_name: trd_drc_code
    business_meaning: Chiều mua/bán chủ động.
    data_domain: Classification Value
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.lastColor
    comment: "Scheme: MDDS_TRADE_DIRECTION. Cùng scheme với StockInfor.lastcolor."
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Change Color Code
    physical_name: chg_color_code
    business_meaning: Indicator tăng/giảm so với giá tham chiếu.
    data_domain: Classification Value
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.changeColor
    comment: "Scheme: MDDS_PRICE_CHANGE_COLOR. Cùng pattern với lastColor (MDDS_TRADE_DIRECTION) — indicator chiều giá so với tham chiếu."
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Match Price
    physical_name: mtch_prc
    business_meaning: Giá khớp.
    data_domain: Currency Amount
    data_type: decimal(23,2)
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.formattedMatchPrice
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Match Volume
    physical_name: mtch_vol
    business_meaning: Khối lượng khớp.
    data_domain: Small Counter
    data_type: int
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.formattedVol
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Accumulated Volume
    physical_name: acm_vol
    business_meaning: Tổng khối lượng khớp lũy kế trong ngày (lô chẵn).
    data_domain: Small Counter
    data_type: int
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.formattedAccVol
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Accumulated Value
    physical_name: acm_val
    business_meaning: Tổng giá trị khớp lũy kế trong ngày (lô chẵn).
    data_domain: Currency Amount
    data_type: decimal(23,2)
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.formattedAccVal
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Total Buy Volume
    physical_name: tot_buy_vol
    business_meaning: Tổng khối lượng mua chủ động.
    data_domain: Small Counter
    data_type: int
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.totalBuyVol
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Total Sell Volume
    physical_name: tot_sell_vol
    business_meaning: Tổng khối lượng bán chủ động.
    data_domain: Small Counter
    data_type: int
    nullable: false
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.totalSellVol
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null

  - name: Board Id
    physical_name: board_id
    business_meaning: "Board của mã, mặc định G1."
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: MDDS
    source_table: TransLog
    source_column: MDDS.JAD_TRANSLOG.boardID
    comment: null
    classification_context: "Source System Code = 'MDDS_TRANSLOG'"
    etl_derived_value: null
