schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-securities_trade-HOSE.TRADE_BOOK
  logical_name: Securities Trade
  physical_name: securities_trade
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Transaction
  bcv_concept: "[Transaction] Financial Market Transaction"
  table_type: Fact Append
  etl_pattern: Fact Append
  source: HOSE
  description: |
    Sổ khớp chi tiết trên sàn HNX và HOSE: mỗi bản ghi là 1 lần khớp thành công với thị trường, bảng giao dịch, mã chứng khoán, giá, khối lượng, giá trị khớp và đồng thời thông tin bên mua và bên bán (thành viên, tài khoản, loại nhà đầu tư, giá/khối lượng lệnh), kèm số hiệu lệnh để liên kết về sổ lệnh.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-HOSE-TRADE_BOOK

attributes:
  - name: Securities Trade Id
    physical_name: securities_trade_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: HOSE
    source_table: TRADE_BOOK
    source_column: HOSE.TRADE_BOOK.TRADE_NO
    comment: "PK surrogate. BCV: \"[Transaction] Financial Market Transaction\". Khớp lệnh thành công trên HOSE — mỗi trade là 1 bản ghi Fact Append. Hash: hash_id('HOSE_TRADE_BOOK', TRADE_NO) — hash từ Business Key (cột TRADE_NO)."
    classification_context: null
    etl_derived_value: null

  - name: Securities Trade Code
    physical_name: securities_trade_code
    business_meaning: "Số thứ tự giao dịch khớp lệnh được ghi nhận trên hệ thống Sàn trong ngày, theo từng mã chứng khoán (Trade ID / BK). BK."
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: HOSE
    source_table: TRADE_BOOK
    source_column: HOSE.TRADE_BOOK.TRADE_NO
    comment: BK chính. Mã định danh nghiệp vụ duy nhất của Securities Trade; nguồn HOSE.TRADE_BOOK.TRADE_NO.
    classification_context: null
    etl_derived_value: null

