    comment: "ETL-derived: concat(FORM_CODE, COLUMN_CODE, ROW_INDEX, PERIOD_TP, PERIOD_VAL, PERIOD_YEAR) từ ODS COMPLIANCE_REPORT_VALUE (PERIOD_VAL, PERIOD_YEAR là int — ETL cast sang string) — BK theo quyết định Data Modeler 2026-11-17 (thay SUBMISSION_DT của quyết định 2026-11-16). PERIOD_TP/PERIOD_VAL/PERIOD_YEAR là thành phần BK nên NOT NULL — cần profile dữ liệu xác nhận không NULL (kỳ YEARLY có thể không có PERIOD_VAL) và unique trước go-live (2 đơn vị nộp cùng biểu mẫu cùng kỳ sẽ trùng BK — HLD Tier2 T2-01)."
