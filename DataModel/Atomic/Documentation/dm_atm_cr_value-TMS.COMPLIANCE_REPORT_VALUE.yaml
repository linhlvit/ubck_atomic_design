    data_type: string
    nullable: false
    is_primary_key: true
    source_system: TMS
    source_table: COMPLIANCE_REPORT_VALUE
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Regulatory Information\". Hash: hash_id('TMS_COMPLIANCE_REPORT_VALUE', FORM_CODE || COLUMN_CODE || ROW_INDEX || PERIOD_TP || PERIOD_VAL || PERIOD_YEAR)."
