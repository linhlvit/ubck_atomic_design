  source: TMS
  description: |
    Giá trị đã nộp của từng cột (ô) trong biểu mẫu báo cáo tuân thủ — 1 dòng = 1 cột của 1 dòng dữ liệu trong 1 lần nộp, kèm kỳ báo cáo, loại người nộp, thời điểm và tên file tải lên. Nguồn ODS, không có BRD.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-TMS-COMPLIANCE_REPORT_VALUE

