    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: ITEM_VALUE
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Regulatory Information\". Hash: hash_id('FMS_ITEM_VALUE', ITEM_ID || REPORT_LOG_ID || ROW_ORDER)."
    classification_context: null
    etl_derived_value: null

