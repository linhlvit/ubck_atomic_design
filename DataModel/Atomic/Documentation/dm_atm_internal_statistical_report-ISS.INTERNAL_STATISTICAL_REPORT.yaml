schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-internal_statistical_report-ISS.INTERNAL_STATISTICAL_REPORT
  logical_name: Internal Statistical Report
  physical_name: internal_statistical_report
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Form Documentation"
  table_type: Classification
  etl_pattern: Upsert
  source: ISS
  description: |
    Báo cáo định kỳ ISS (thống kê nội bộ UBCKNN). Grain = 1 ô × 1 lần nộp × 1 kỳ báo cáo. Dữ liệu flatten đến từng ô biểu mẫu (cell-level), hỗ trợ cả 3 layout: MIXED / COLUMN_BASED / ROW_BASED. BK composite: report_code || sheet_nm || field_code || row_index || origin_dt_val.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-ISS-INTERNAL_STATISTICAL_REPORT

