schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-fr_template-IDS.FORMS
  logical_name: Financial Report Template
  physical_name: fr_template
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Form Document"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: IDS
  description: |
    Template/form dùng để công bố thông tin (CBTT): xác định cấu trúc, phiên bản, và hệ thống phân cấp form qua self-reference. Đổi tên từ "Disclosure Form Definition" (2026-08-05, theo yêu cầu tường minh Data Modeler). LƯU Ý: "Disclosure Form Definition Notification Recipient" và "Disclosure Form Definition Violation Template" chưa đổi tên theo — vi phạm rule#8 (entity con chứa tên entity cha) cho tới khi Data Modeler xác nhận đổi tên 2 entity này.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-FORMS

attributes:
  - name: Financial Report Template Id
    physical_name: fr_template_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: IDS
    source_table: FORMS
    source_column: null
    comment: "PK surrogate. Hash: hash_id('IDS.FORMS', FORM_CD). BCV: \"[Documentation] Form Document\". Đổi tên entity 2026-08-05."
    classification_context: null
    etl_derived_value: null

  - name: Financial Report Template Code
    physical_name: fr_template_code
    business_meaning: Mã form. BK duy nhất — Id hash từ trường này.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: FORMS
    source_column: IDS.FORMS.FORM_CD
    comment: "BK chính (mã nghiệp vụ). Thay thế Code kỹ thuật (ID) + Unique Key cũ — gộp còn 1 trường Code duy nhất. Cần profile dữ liệu nguồn xác nhận NOT NULL/unique trước go-live."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
