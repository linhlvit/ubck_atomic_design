    physical_name: fmr_sheet_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: SHEET
    source_column: null
    comment: "PK surrogate. Hash: hash_id('FMS_SHEET', ID). BCV: \"[Documentation] Form Document\"."
    classification_context: null
    etl_derived_value: null

  - name: Fund Management Report Sheet Code
    physical_name: fmr_sheet_code
