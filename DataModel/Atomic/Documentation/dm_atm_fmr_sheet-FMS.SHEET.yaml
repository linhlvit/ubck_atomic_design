    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: SHEET
    source_column: FMS.SHEET.ID
    comment: "BK chính — ID nguồn (RAW(16), chuyển hex string). Không dùng cột CODE làm BK — CODE giữ ở Sheet Short Code."
