    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: FIR_STRUCTURE
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Form Document\" — cùng concept entity cha. Hash: hash_id('FIMS_FIR_STRUCTURE', SHEET_ID || INDICATOR_UID)."
    classification_context: null
    etl_derived_value: null

