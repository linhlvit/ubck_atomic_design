    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: TTHC
    source_table: AP_DOCUMENT
    source_column: null
    comment: "PK surrogate. BCV: \"[Business Activity] Case\". Hash: hash_id('TTHC_AP_DOCUMENT', AP_DOCUMENT_ID). Nguồn thực: ContentItemIndex.ContentItemId (ContentType = 'HoSoTTHC')."
    classification_context: null
    etl_derived_value: null

