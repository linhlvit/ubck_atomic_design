schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ap_document-TTHC.AP_DOCUMENT
  logical_name: Administrative Procedure Document
  physical_name: ap_document
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Documentation"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: TTHC
  description: |
    Business Activity Case — hồ sơ thủ tục hành chính UBCKNN, entity trung tâm chứa metadata phân loại, thời gian xử lý, lệ phí, snapshot thành phần hồ sơ và eform. Nguồn ODS từ JOIN TTHC.DOCUMENT + TTHC.CONTENTITEMINDEX, lọc ContentType = 'HoSoTTHC'.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-TTHC-AP_DOCUMENT

