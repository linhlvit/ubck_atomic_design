  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Regulatory Report"
  table_type: Classification
  etl_pattern: Upsert
  source: IDS
  description: |
    Giá trị từng ô số liệu/chuỗi trong báo cáo định kỳ (tháng/quý/năm/bán niên) của CTĐC theo hàng/cột template, liên kết đến bản ghi nộp báo cáo. Cùng vai trò với "Financial Report Value" (DATA) nhưng cho họ template Unstructured Financial Report/Row/Column (REP_FORMS/REP_ROW/REP_COLUMN) thay vì Financial Report Catalog/Row/Column. Domain Prefix "Unstructured Financial Report" mở rộng từ 3 sang 4 entity — cần Data Modeler xác nhận (xem IDS_HLD_Overview.md 7e #24, IDS_HLD_Tier4.md 6f T4-04). Thiết kế mới (2026-09-05). Table Type Fundamental → Classification (2026-09-15, theo yêu cầu tường minh Data Modeler) — xem IDS_HLD_Overview.md 7e.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-REP_DATA

