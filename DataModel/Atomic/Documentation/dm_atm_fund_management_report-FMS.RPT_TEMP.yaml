    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.CODE
    comment: "Cột CODE nguồn giữ dạng Text thường — không phải BK (BK = hash từ ID theo quyết định Data Modeler)."
