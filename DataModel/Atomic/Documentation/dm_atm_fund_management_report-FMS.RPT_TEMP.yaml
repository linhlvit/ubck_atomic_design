    data_domain: Surrogate Key
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.FTYPE_ID
    comment: "FK target: cl_fms_fund_type.cl_fms_fund_tp_id. Hash: hash_id('FMS_FUND_TYPE', FTYPE_ID). Cùng pattern lld_FMS_FUNDS.FTYPE_ID."
    classification_context: null
    etl_derived_value: null

  - name: Classification FMS Fund Type Code
    physical_name: cl_fms_fund_tp_code
    business_meaning: Mã loại quỹ đầu tư.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.FTYPE_ID
    comment: "Lookup pair: cl_fms_fund_type.cl_fms_fund_tp_code. Pair with Classification FMS Fund Type Id."
    classification_context: null
    etl_derived_value: null

  - name: Report Group Code
    physical_name: rpt_group_code
