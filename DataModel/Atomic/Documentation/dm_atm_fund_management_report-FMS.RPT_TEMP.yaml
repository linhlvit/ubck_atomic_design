    data_type: int
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.VERSION
    comment: "Nguồn NUMBER(18,2) — ETL cast sang int. Cần profile xem có phiên bản thập phân (1.5...) không; nếu có cần đổi domain."
    classification_context: null
    etl_derived_value: null

