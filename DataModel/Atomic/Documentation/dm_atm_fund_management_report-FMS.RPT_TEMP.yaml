    classification_context: null
    etl_derived_value: null

  - name: Disclosure Required Indicator
    physical_name: disclosure_required_ind
    business_meaning: "Cờ báo cáo cần công bố thông tin: 1=Cần CBTT, 0=Không."
    data_domain: Small Counter
    data_type: int
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.REQUIRE_DISCLOSURE
    comment: "Giá trị 1 → true; 0 → false. Nguồn NUMBER(1,0) — cùng pattern IDS fr_value.Cell Enabled Indicator."
    classification_context: null
    etl_derived_value: null

  - name: Description
    physical_name: description
    business_meaning: Mô tả chi tiết.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.DESCRIPTION
