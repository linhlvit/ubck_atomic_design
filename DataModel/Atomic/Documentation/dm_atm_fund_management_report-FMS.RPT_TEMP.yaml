schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-fund_management_report-FMS.RPT_TEMP
  logical_name: Fund Management Report
  physical_name: fund_management_report
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Form Document"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: FMS
  description: |
    Biểu mẫu báo cáo mà thành viên thị trường (công ty QLQ, quỹ đầu tư, đại lý...) phải nộp: tên, cơ sở pháp lý, loại báo cáo, phiên bản, cấu hình import/eForm. Entity gốc của nhóm báo cáo; chỉ tham chiếu danh mục Classification FMS Fund Type.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FMS-RPT_TEMP

attributes:
  - name: Fund Management Report Id
    physical_name: fmr_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: RPT_TEMP
    source_column: null
    comment: "PK surrogate. Hash: hash_id('FMS_RPT_TEMP', ID). BCV: \"[Documentation] Form Document\"."
    classification_context: null
    etl_derived_value: null

  - name: Fund Management Report Code
    physical_name: fmr_code
    business_meaning: Khóa chính của bản ghi (UUID dạng RAW(16)). BK.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.ID
    comment: "BK chính — ID nguồn (RAW(16), chuyển hex string). Không dùng cột CODE làm BK — CODE giữ ở Report Short Code."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'FMS_RPT_TEMP'"
    etl_derived_value: FMS_RPT_TEMP

  - name: Fund Management Report Name
    physical_name: fmr_nm
    business_meaning: Tên hiển thị chính của biểu mẫu báo cáo.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.ITEM_NAME
    comment: null
    classification_context: null
    etl_derived_value: null

  - name: Legal Basis
    physical_name: legal_basis
    business_meaning: Cơ sở pháp lý của biểu mẫu báo cáo (tên thông tư/nghị định).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.LEGAL_BASIS
    comment: null
    classification_context: null
    etl_derived_value: null

  - name: Fund Management Report Type Code
    physical_name: fmr_tp_code
    business_meaning: "Loại báo cáo: 1=Báo cáo định kỳ, 2=Báo cáo bất thường, 3=Báo cáo theo yêu cầu, 4=Báo cáo khác."
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: RPT_TEMP
    source_column: FMS.RPT_TEMP.REPORT_TYPE
