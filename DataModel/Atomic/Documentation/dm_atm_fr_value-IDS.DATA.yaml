schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-fr_value-IDS.DATA
  logical_name: Financial Report Value
  physical_name: fr_value
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Regulatory Report"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: IDS
  description: |
    Giá trị từng ô số liệu trong báo cáo tài chính của CTĐC theo kỳ: mã hàng, mã cột, giá trị, năm/quý báo cáo. FK trực tiếp đến Public Company và Financial Report Catalog. Đổi tên từ "Public Company Financial Report Value" + Table Type Fact Append → Fundamental (2026-08-05, theo yêu cầu tường minh Data Modeler). Khôi phục scope 2026-08-05 — xem IDS_HLD_Overview.md 7e #15/#16.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-DATA

attributes:
  - name: Financial Report Value Id
    physical_name: fr_val_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: IDS
    source_table: DATA
    source_column: null
    comment: "PK surrogate. Hash: hash_id('IDS.DATA', ID). BCV: \"[Documentation] Regulatory Report\"."
    classification_context: null
    etl_derived_value: null

  - name: Financial Report Value Code
    physical_name: fr_val_code
    business_meaning: Khóa chính. BK của entity — map từ PK bảng nguồn (không có cột mã nghiệp vụ riêng).
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: DATA
    source_column: IDS.DATA.ID
    comment: BK chính. PK nguồn NUMBER(19) tự tăng — mirror pattern public_company.Public Company Code (không có business code riêng).
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: DATA
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'IDS_DATA'"
    etl_derived_value: IDS_DATA

