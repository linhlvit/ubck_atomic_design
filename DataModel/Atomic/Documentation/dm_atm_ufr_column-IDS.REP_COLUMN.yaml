  etl_pattern: SCD2
  source: IDS
  description: |
    Định nghĩa từng cột trong template báo cáo định kỳ. Đổi tên từ "Periodic Report Form Column Template" (2026-08-05, theo yêu cầu tường minh Data Modeler) — xem 7e #15. Bổ sung table_type/entity_physical_name (trước đây để trống) và đổi BCV Concept từ "[Condition] Form Definition" (term không tồn tại trong knowledge/terms.csv) sang "[Documentation] Form Document" (2026-08-13, theo yêu cầu tường minh Data Modeler) — xem IDS_HLD_Overview.md 7e #21. Đổi Domain Prefix từ "Financial Report" sang "Unstructured Financial Report" (2026-08-27, theo yêu cầu tường minh Data Modeler — chỉ áp dụng 3 entity REP_FORMS/REP_ROW/REP_COLUMN) — xem IDS_HLD_Overview.md 7e #22. Bỏ chữ "Sub" khỏi tên entity/field (2026-08-27, theo yêu cầu tường minh Data Modeler) — xem 7e #23. Bỏ chữ "Template" khỏi tên (entity_physical_name ufr_column_template → ufr_column) và Table Type Fundamental → Relative (2026-09-15, theo yêu cầu tường minh Data Modeler) — xem IDS_HLD_Overview.md 7e.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-REP_COLUMN

