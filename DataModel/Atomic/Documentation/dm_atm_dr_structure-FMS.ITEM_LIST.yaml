    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: ITEM_LIST
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Form Document\". Hash: hash_id('FMS_ITEM_LIST', ITEM_ID)."
    classification_context: null
    etl_derived_value: null

  - name: Dynamic Report Structure Code
    physical_name: dr_structure_code
