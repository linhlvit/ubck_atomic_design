  etl_pattern: SCD4A
  source: IDS
  description: |
    Định nghĩa từng cột trong template báo cáo tài chính: mã cột, tên, kỳ tham chiếu (hiện tại/kỳ trước). Khôi phục scope 2026-08-05 (xem IDS_HLD_Overview.md 7e #15) — tên bỏ chữ "Form" so với thiết kế trước đây. Đổi BCV Concept từ "[Condition] Form Definition" (term không tồn tại trong knowledge/terms.csv) sang "[Documentation] Form Document" (2026-08-13, theo yêu cầu tường minh Data Modeler) — xem IDS_HLD_Overview.md 7e #21.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-RCOL

