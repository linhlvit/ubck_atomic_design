    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: RCOL
    source_column: IDS.RCOL.COL_CD
    comment: "BK chính (mã nghiệp vụ). Thay thế Code kỹ thuật (ID) — loại bỏ ID khỏi model hoàn toàn. Cần profile dữ liệu nguồn xác nhận NOT NULL/unique trước go-live."
    classification_context: null
    etl_derived_value: null

