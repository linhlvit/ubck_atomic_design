    physical_name: fr_column_template_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: IDS
    source_table: RCOL
    source_column: null
    comment: "PK surrogate. Hash: hash_id('IDS.RCOL', COL_CD). BCV: \"[Documentation] Form Document\"."
    classification_context: null
    etl_derived_value: null

