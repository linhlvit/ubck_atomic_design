schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-fr_row_template-IDS.RROW
  logical_name: Financial Report Row Template
  physical_name: fr_row_template
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Form Document"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: IDS
  description: |
    Định nghĩa từng hàng trong template báo cáo tài chính: mã hàng, tên, cấp phân cấp, công thức tổng hợp. Khôi phục scope 2026-08-05 (xem IDS_HLD_Overview.md 7e #15) — tên bỏ chữ "Form" so với thiết kế trước đây.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-RROW

attributes:
  - name: Financial Report Row Template Id
    physical_name: fr_row_template_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: IDS
    source_table: RROW
    source_column: null
    comment: "PK surrogate. Hash: hash_id('IDS.RROW', ROW_CD). BCV: \"[Documentation] Form Document\"."
    classification_context: null
    etl_derived_value: null

  - name: Financial Report Row Template Code
    physical_name: fr_row_template_code
    business_meaning: Lưu mã tự sinh của chỉ tiêu hàng. Quy tắc r+sequence. BK duy nhất — Id hash từ trường này.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: RROW
    source_column: IDS.RROW.ROW_CD
    comment: "BK chính (mã nghiệp vụ tự sinh). Thay thế Code kỹ thuật (ID) — loại bỏ ID khỏi model hoàn toàn. Cần profile dữ liệu nguồn xác nhận NOT NULL/unique trước go-live."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
