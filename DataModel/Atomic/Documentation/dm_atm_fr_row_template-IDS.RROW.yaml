    comment: "Lookup pair: fr_catalog.fr_catalog_code. Pair with Financial Report Catalog Id. Giá trị lấy từ IDS.REPORT_CATALOG.REPORT_CD sau ETL crosswalk — chi tiết xem comment Financial Report Catalog Id."
