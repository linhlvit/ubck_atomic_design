    business_meaning: "Trạng thái hồ sơ — parse từ trường CONTENT (JSON) tại tầng ODS. Chỉ áp dụng cho content item thuộc nghiệp vụ hồ sơ chào bán/thủ tục hành chính có theo dõi trạng thái xử lý; NULL cho các ContentType không liên quan (LandingPage, TinTuc, BaoCao, Fragment...)."
