schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ap_document-TTHC.DOCUMENT
  logical_name: Administrative Procedure Document
  physical_name: ap_document
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Documentation"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: TTHC
  description: |
    Documentation — nội dung JSON gốc của content item hiện hành trong hệ thống TTHC (Orchard Core), lưu toàn bộ dữ liệu chi tiết đã serialize của hồ sơ/trang/tin/báo cáo hành chính.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-TTHC-DOCUMENT

attributes:
  - name: Administrative Procedure Document Id
    physical_name: ap_document_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: TTHC
    source_table: DOCUMENT
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Documentation\". Nội dung JSON gốc của 1 content item hiện hành. Hash: hash_id('TTHC.DOCUMENT', ID)."
    classification_context: null
    etl_derived_value: null

  - name: Administrative Procedure Document Code
    physical_name: ap_document_code
    business_meaning: "Khóa chính (tự tăng) của bảng nguồn. BK — nguồn không có mã nghiệp vụ độc lập nào khác (TYPE là discriminator kỹ thuật, CONTENT là blob JSON, VERSION là optimistic-lock counter thay đổi theo update) — dùng PK kỹ thuật làm BK duy nhất, theo đúng pattern đã dùng cho KNT.INVOICE_DETAIL."
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: TTHC
    source_table: DOCUMENT
    source_column: TTHC.DOCUMENT.ID
    comment: BK chính. PK nguồn.
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: TTHC
    source_table: DOCUMENT
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM."
    classification_context: "Source System Code = 'TTHC_DOCUMENT'"
    etl_derived_value: TTHC_DOCUMENT

  - name: Record Type Code
    physical_name: record_tp_code
    business_meaning: "Bộ phân biệt loại bản ghi. Discriminator kiểu serialize .NET của Orchard Document store (VD: ContentItemRecord) — trường kỹ thuật hệ thống, không phải phân loại nghiệp vụ (xem TTHC_HLD_Tier1.md T1-02/6d)."
