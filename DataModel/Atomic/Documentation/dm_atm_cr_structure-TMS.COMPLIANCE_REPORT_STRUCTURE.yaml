schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-cr_structure-TMS.COMPLIANCE_REPORT_STRUCTURE
  logical_name: Compliance Report Structure
  physical_name: cr_structure
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Documentation
  bcv_concept: "[Documentation] Form Document"
  table_type: Relative
  etl_pattern: SCD2
  source: TMS
  description: |
    Cấu trúc cột (chỉ tiêu) của biểu mẫu báo cáo tuân thủ — 1 dòng = 1 cột của 1 biểu mẫu, kèm mã và tên biểu mẫu, mã phụ lục, trạng thái, phiên bản và thứ tự, mã, nhãn cột. Nguồn ODS, không có BRD.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-TMS-COMPLIANCE_REPORT_STRUCTURE

attributes:
  - name: Compliance Report Structure Id
    physical_name: cr_structure_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: TMS
    source_table: COMPLIANCE_REPORT_STRUCTURE
    source_column: null
    comment: "PK surrogate. BCV: \"[Documentation] Form Document\". Hash: hash_id('TMS_COMPLIANCE_REPORT_STRUCTURE', FORM_CODE || COLUMN_CODE)."
    classification_context: null
    etl_derived_value: null

  - name: Compliance Report Structure Code
    physical_name: cr_structure_code
    business_meaning: "Mã nghiệp vụ cột chỉ tiêu của biểu mẫu = FORM_CODE || COLUMN_CODE. BK."
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: TMS
    source_table: COMPLIANCE_REPORT_STRUCTURE
    source_column: "TMS.COMPLIANCE_REPORT_STRUCTURE.FORM_CODE, TMS.COMPLIANCE_REPORT_STRUCTURE.COLUMN_CODE"
    comment: "ETL-derived: concat(FORM_CODE, COLUMN_CODE) từ ODS COMPLIANCE_REPORT_STRUCTURE — BK theo quyết định Data Modeler 2026-11-16 (không gồm TEMPLATE_CODE). Cần profile dữ liệu xác nhận NOT NULL/unique trước go-live: FORM_CODE phải duy nhất trên mọi template, COLUMN_CODE không lặp trong header đầu tiên."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: TMS
    source_table: COMPLIANCE_REPORT_STRUCTURE
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'TMS_COMPLIANCE_REPORT_STRUCTURE'"
    etl_derived_value: TMS_COMPLIANCE_REPORT_STRUCTURE

  - name: Template Code
    physical_name: template_code
    business_meaning: "Mã phụ lục báo cáo (VD: PL01_W, PL01_M, PL02_D)."
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: TMS
    source_table: COMPLIANCE_REPORT_STRUCTURE
    source_column: TMS.COMPLIANCE_REPORT_STRUCTURE.TEMPLATE_CODE
    comment: "Mã phụ lục từ COMPLIANCE_REPORT_TEMPLATE.TEMPLATE_CODE (ODS đã join). Không FK tới template vì template ngoài scope (HLD T1-01); không thuộc khóa hash."
    classification_context: null
    etl_derived_value: null

  - name: Form Code
    physical_name: form_code
    business_meaning: "Mã biểu mẫu (VD: PL01_W_F01)."
    data_domain: Text
    data_type: string
    nullable: false
