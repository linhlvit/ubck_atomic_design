    data_domain: Indicator
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: TTHC
    source_table: CONTENTITEMINDEX
    source_column: TTHC.CONTENTITEMINDEX.LATEST
    comment: "Indicator: nguồn NUMBER(38,0) 1=mới nhất/0=không. Theo Table Type Fundamental (dedup ETL theo LATEST=1 — xem D-06), mọi dòng trên Atomic dự kiến luôn = 1; giữ lại trường này theo yêu cầu người thiết kế để trace/audit, dù có thể trở thành hằng số trên Atomic."
    classification_context: null
    etl_derived_value: null

  - name: Content Type Code
