schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-geographic_area-ECAT.REGION
  logical_name: Geographic Area
  physical_name: geographic_area
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Location
  bcv_concept: "[Location] Geographic Area"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: ECAT
  description: |
    Đơn vị địa lý dùng làm FK tham chiếu: quốc gia/quốc tịch (COUNTRY), vùng/miền (REGION), tỉnh/thành phố mới/cũ (PROVINCE/PROVINCE_OLD), quận/huyện cũ (DISTRICT_OLD), phường/xã mới/cũ (WARD/WARD_OLD). Phân biệt bằng geographic_area_type_code. Hỗ trợ song song bộ danh mục pre- và post-sáp nhập hành chính 2025.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-ECAT-REGION

attributes:
  - name: Geographic Area Id
    physical_name: geographic_area_id
    business_meaning: Id tự sinh (surrogate key)
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: ECAT
    source_table: REGION
    source_column: null
    comment: "PK surrogate. Hash: hash_id('ECAT_REGION', CODE). BCV: \"Geographic Area\" (Location)."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã nguồn dữ liệu
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. BK. Hardcode."
    classification_context: "Source System Code = 'ECAT_REGION'"
    etl_derived_value: ECAT_REGION

  - name: Geographic Area Type Code
    physical_name: geographic_area_tp_code
    business_meaning: Phân loại vùng địa lý — Vùng/miền
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: null
    comment: null
    classification_context: "GEOGRAPHIC_AREA_TYPE=REGION"
    etl_derived_value: REGION

  - name: Geographic Area Code
    physical_name: geographic_area_code
    business_meaning: Mã vùng/miền nghiệp vụ (do ECAT quản lý). BK duy nhất — Id hash từ trường này.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: ECAT.REGION.CODE
    comment: "BK chính (mã nghiệp vụ). Thay thế Code kỹ thuật (STABLE_ID) — gộp còn 1 trường Code duy nhất. Cần profile dữ liệu nguồn xác nhận NOT NULL/unique trước go-live."
    classification_context: null
    etl_derived_value: null

  - name: Geographic Area Name
    physical_name: geographic_area_nm
    business_meaning: Tên vùng/miền
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: ECAT.REGION.NAME
    comment: REGION chỉ có 1 cột NAME (không có NAME_VN/NAME_EN như COUNTRY).
    classification_context: null
    etl_derived_value: null

  - name: Parent Geographic Area Id
    physical_name: parent_geographic_area_id
    business_meaning: FK đến quốc gia cha
    data_domain: Surrogate Key
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: ECAT.REGION.COUNTRY_ID
    comment: "FK target: geographic_area.geographic_area_id. Parent là COUNTRY. Resolve: join COUNTRY_ID → ECAT.COUNTRY.ID để lấy CODE, rồi hash_id('ECAT_COUNTRY', CODE_CHA)."
    classification_context: null
    etl_derived_value: null

  - name: Parent Geographic Area Code
    physical_name: parent_geographic_area_code
    business_meaning: Mã quốc gia cha
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: ECAT
    source_table: REGION
    source_column: ECAT.REGION.COUNTRY_ID
    comment: "Lookup pair: geographic_area.geographic_area_code. Pair with Parent Geographic Area Id."
    classification_context: null
    etl_derived_value: null
