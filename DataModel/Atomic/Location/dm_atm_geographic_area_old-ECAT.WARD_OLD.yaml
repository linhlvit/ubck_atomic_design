  source: ECAT
  description: |
    Đơn vị địa lý lịch sử (pre-2025) — tỉnh/thành phố cũ (PROVINCE_OLD), quận/huyện cũ (DISTRICT_OLD, cấp bị bỏ sau sáp nhập), phường/xã cũ (WARD_OLD). Tách riêng khỏi Geographic Area vì cấu trúc phân cấp 3 cấp khác với 2 cấp hiện hành. Chỉ phục vụ tra cứu lịch sử, có FK cross-entity sang Geographic Area (anchor Region + successor mapping sau sáp nhập).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-ECAT-WARD_OLD

