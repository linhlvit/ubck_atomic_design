    is_primary_key: true
    source_system: OrderTrade
    source_table: Order_HOSE
    source_column: null
    comment: "PK surrogate. BCV: \"[Communication] Financial Market Order\". Lệnh chứng khoán phát sinh từ hệ thống KRX — mỗi event lệnh (mới/sửa/hủy) là 1 bản ghi Fact Append."
