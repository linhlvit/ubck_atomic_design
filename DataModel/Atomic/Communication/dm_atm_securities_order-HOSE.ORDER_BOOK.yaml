schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-securities_order-HOSE.ORDER_BOOK
  logical_name: Securities Order
  physical_name: securities_order
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Communication
  bcv_concept: "[Communication] Financial Market Order"
  table_type: Fact Append
  etl_pattern: Fact Append
  source: HOSE
  description: |
    Sổ lệnh chi tiết trên sàn HNX và HOSE: mỗi bản ghi là 1 event lệnh (mới/sửa/hủy) với thị trường, bảng giao dịch, mã chứng khoán, thời điểm nhận lệnh, thành viên, tài khoản, loại và điều kiện lệnh, giá, khối lượng, trạng thái và các thuộc tính đặc thù (Iceberg, Stop order, báo giá RFQ).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-HOSE-ORDER_BOOK

attributes:
