    physical_name: securities_order_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: HOSE
    source_table: ORDER_BOOK
    source_column: HOSE.ORDER_BOOK.ORDER_ID
    comment: "PK surrogate. BCV: \"[Communication] Financial Market Order\". Lệnh chứng khoán phát sinh từ hệ thống KRX — mỗi event lệnh (mới/sửa/hủy) là 1 bản ghi Fact Append. Hash: hash_id('HOSE_ORDER_BOOK', ORDER_ID) — hash từ Business Key (cột ORDER_ID)."
    classification_context: null
    etl_derived_value: null

