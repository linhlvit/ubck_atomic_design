schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-cl_business_line-IDS.CATEGORIES
  logical_name: Classification Business Line
  physical_name: cl_business_line
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Common
  bcv_concept: "[Common] Industry Classification"
  table_type: Relative
  etl_pattern: SCD2
  source: IDS
  description: |
    Danh mục ngành nghề kinh doanh 2 cấp (cấp 1 + cấp 2), self-referencing qua Parent Business Line. Gộp từ ECAT.BUSINESS_LINE_LEVEL_1 + BUSINESS_LINE_LEVEL_2 theo quy tắc "Gộp entity khi hợp lý" (CLAUDE.md #10). Table Type = Relative theo quyết định tường minh của Data Modeler (khác rule mặc định Common→Classification Value) — xem ECAT_HLD_Tier1.md T1-07. Tên bỏ tiền tố nguồn (ECAT) theo rule đặt tên Classification mới (CLAUDE.md #7). Bổ sung nguồn IDS.CATEGORIES (shared entity) theo quyết định tường minh Data Modeler (2026-07-17) — IDS.CATEGORIES và ECAT.BUSINESS_LINE_LEVEL_1/2 xác nhận cùng 1 concept nghiệp vụ, xem IDS_HLD_Tier1.md T1-13 / IDS_HLD_Overview.md mục 7e #12.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-IDS-CATEGORIES

attributes:
  - name: Classification Business Line Id
    physical_name: cl_business_line_id
    business_meaning: Id tự sinh (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: IDS
    source_table: CATEGORIES
    source_column: null
    comment: "PK surrogate. Hash: hash_id('IDS.CATEGORIES', INDUSTRY_CD). BCV Term: \"Industry Classification\" (Common). Shared entity với ECAT.BUSINESS_LINE_LEVEL_1/2."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. BK. Hardcode."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: IDS.CATEGORIES

  - name: Classification Business Line Level Code
    physical_name: cl_business_line_level_code
    business_meaning: Phân biệt cấp ngành nghề — Cấp 1 hoặc Cấp 2.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: IDS.CATEGORIES.PARENT_ID
    comment: "Scheme: ECAT_BUSINESS_LINE_LEVEL (dùng chung với ECAT — shared entity). IDS.CATEGORIES không tách 2 bảng theo cấp như ECAT — level suy ra động từ PARENT_ID IS NULL (Cấp 1) / PARENT_ID IS NOT NULL (Cấp 2), khác cơ chế derive-từ-tên-bảng của ECAT. Xem IDS_HLD_Tier1.md T1-13."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: "PARENT_ID IS NULL=LEVEL_1;PARENT_ID IS NOT NULL=LEVEL_2"

  - name: Classification Business Line Code
    physical_name: cl_business_line_code
    business_meaning: Mã ngành nghề. BK duy nhất — Id hash từ trường này.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: IDS.CATEGORIES.INDUSTRY_CD
    comment: "BK chính (mã nghiệp vụ), nhất quán pattern Classification Business Line Code trên ECAT (dùng CODE nguồn, không dùng ID kỹ thuật). Cần profile dữ liệu nguồn xác nhận NOT NULL/unique trước go-live."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: null

  - name: Classification Business Line Name
    physical_name: cl_business_line_nm
    business_meaning: Tên ngành nghề.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: IDS.CATEGORIES.INDUSTRY_NAME
