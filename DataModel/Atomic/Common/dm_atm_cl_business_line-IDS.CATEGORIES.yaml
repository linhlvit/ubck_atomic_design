    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: null

  - name: Parent Classification Business Line Id
    physical_name: parent_cl_business_line_id
    business_meaning: "FK đến ngành nghề cấp 1 cha (self-ref, Mã cha). NULL cho cấp 1 — cấp cao nhất."
    data_domain: Surrogate Key
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: IDS.CATEGORIES.PARENT_ID
    comment: "FK target: cl_business_line.cl_business_line_id. PARENT_ID lưu ID kỹ thuật của bản ghi cha (không phải INDUSTRY_CD) — PHẢI join: PARENT_ID = IDS.CATEGORIES.ID để lấy INDUSTRY_CD của cha, rồi hash_id('IDS.CATEGORIES', INDUSTRY_CD_CHA). NULL khi PARENT_ID nguồn NULL (bản ghi cấp 1)."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: null

  - name: Parent Classification Business Line Code
    physical_name: parent_cl_business_line_code
    business_meaning: Mã ngành nghề cấp 1 cha.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: IDS
    source_table: CATEGORIES
    source_column: IDS.CATEGORIES.PARENT_ID
    comment: "Lookup pair: cl_business_line.cl_business_line_code. Pair with Parent Classification Business Line Id. Giá trị lấy qua join (xem Parent Classification Business Line Id). NULL cho cấp 1."
    classification_context: "Source System Code = 'IDS_CATEGORIES'"
    etl_derived_value: null

