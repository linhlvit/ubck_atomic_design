ldm:
  id: ATM-cl_value-AUDIT.LOOKUP_VALUES
  logical_name: Classification Value
  physical_name: cl_value
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Common
  bcv_concept: "[Classification] Common"
  table_type: Relative
  etl_pattern: SCD2
  source: AUDIT
  description: |
    Classification Common — danh mục dùng chung TTHC, tổng hợp toàn bộ giá trị phân loại từ Orchard Core ContentItem. ContentType = schema_code (nhóm scheme); ContentItemId = cl_code (BK). 10 scheme: TRANG_THAI_HO_SO, LOAI_HO_SO, LINH_VUC_TTHC, MUC_DO_TTHC, KENH_TIEP_NHAN, CO_QUAN_XU
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-AUDIT-LOOKUP_VALUES

attributes:
  - name: Classification Code
    physical_name: cl_code
    business_meaning: Mã giá trị phân loại. Mã giá trị của danh mục (LOOKUP_CD).
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: AUDIT
    source_table: LOOKUP_VALUES
    source_column: AUDIT.LOOKUP_VALUES.LOOKUP_CD
    comment: BK chính (kết hợp Schema Code tạo BK duy nhất). VARCHAR2 — giữ nguyên dạng text.
    classification_context: null
    etl_derived_value: null

  - name: Schema Code
    physical_name: schema_code
    business_meaning: Mã loại phân loại (scheme). BK phụ.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: AUDIT
    source_table: LOOKUP_VALUES
    source_column: AUDIT.LOOKUP_VALUES.LOOKUP_GROUP
    comment: "Xử lí CASE WHEN LOOKUP_GROUP = 'AF_TARGET_TYPE' THEN 'AUDIT.AF_TARGET_TYPE' WHEN LOOKUP_GROUP = 'AF_AUTHORITY' THEN 'AUDIT.AF_AUTHORITY' WHEN LOOKUP_GROUP = 'POSITION' THEN 'AUDIT.POSITION' WHEN LOOKUP_GROUP = 'AF_STATUS' THEN 'AUDIT.AF_STATUS' WHEN LOOKUP_GROUP = 'PROFILE_APPROVAL_STATUS' THEN 'AUDIT.PROFILE_APPROVAL_STATUS' WHEN LOOKUP_GROUP = 'AF_AUDITOR_STATUS' THEN 'AUDIT.AF_AUDITOR_STATUS' WHEN LOOKUP_GROUP = 'AF_INSPECTION_RESULT' THEN 'AUDIT.AF_INSPECTION_RESULT' WHEN LOOKUP_GROUP = 'AF_ACTION_TYPE' THEN 'AUDIT.AF_ACTION_TYPE' WHEN LOOKUP_GROUP = 'AF_AUDIT_ACTION' THEN 'AUDIT.AF_AUDIT_ACTION' WHEN LOOKUP_GROUP = 'AF_INSPECTION_UNIT' THEN 'AUDIT.AF_INSPECTION_UNIT' WHEN LOOKUP_GROUP = 'AF_NEXT_YEAR_PROCESSING' THEN 'AUDIT.AF_NEXT_YEAR_PROCESSING' ELSE NULL END."
    classification_context: null
    etl_derived_value: null

  - name: Schema Name
    physical_name: schema_nm
    business_meaning: Tên loại phân loại.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: AUDIT
    source_table: LOOKUP_VALUES
    source_column: AUDIT.LOOKUP_VALUES.LOOKUP_GROUP
    comment: "Xử lí CASE WHEN LOOKUP_GROUP = 'AF_TARGET_TYPE' THEN 'AUDIT - Danh mục loại đối tượng áp dụng' WHEN LOOKUP_GROUP = 'AF_AUTHORITY' THEN 'AUDIT - Danh mục cơ quan có thẩm quyền' WHEN LOOKUP_GROUP = 'POSITION' THEN 'AUDIT - Danh mục chức vụ' WHEN LOOKUP_GROUP = 'AF_STATUS' THEN 'AUDIT - Danh mục trạng thái công ty kiểm toán' WHEN LOOKUP_GROUP = 'PROFILE_APPROVAL_STATUS' THEN 'AUDIT - Danh mục trạng thái phê duyệt hồ sơ' WHEN LOOKUP_GROUP = 'AF_AUDITOR_STATUS' THEN 'AUDIT - Danh mục trạng thái kiểm toán viên' WHEN LOOKUP_GROUP = 'AF_INSPECTION_RESULT' THEN 'AUDIT - Danh mục kết quả thanh tra/kiểm tra' WHEN LOOKUP_GROUP = 'AF_ACTION_TYPE' THEN 'AUDIT - Danh mục loại hành động' WHEN LOOKUP_GROUP = 'AF_AUDIT_ACTION' THEN 'AUDIT - Danh mục loại hình thức xử lý vi phạm' WHEN LOOKUP_GROUP = 'AF_INSPECTION_UNIT' THEN 'AUDIT - Danh mục đơn vị thanh tra/kiểm tra' WHEN LOOKUP_GROUP = 'AF_NEXT_YEAR_PROCESSING' THEN 'AUDIT - Danh mục hướng xử lý xem xét năm sau' ELSE NULL END."
    classification_context: null
    etl_derived_value: null

