    physical_name: cl_ecat_ap_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: ECAT
    source_table: ADMINISTRATIVE_PROCEDURE
    source_column: null
    comment: "PK surrogate. Hash: hash_id('ECAT_ADMINISTRATIVE_PROCEDURE', CODE)."
    classification_context: null
    etl_derived_value: null

  - name: Classification ECAT Administrative Procedure Code
    physical_name: cl_ecat_ap_code
    business_meaning: Mã thủ tục hành chính (TTHC). BK.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: ECAT
    source_table: ADMINISTRATIVE_PROCEDURE
    source_column: ECAT.ADMINISTRATIVE_PROCEDURE.CODE
    comment: "BK của entity. Nguồn VARCHAR2(80) — cần profile xác nhận NOT NULL/unique trước go-live (Code đóng vai trò BK). Nguồn có versioning (ID theo từng version): ETL chọn 1 dòng hiện hành cho mỗi CODE (DELETED = 0, EFFECTIVE = 1, VERSION lớn nhất), tránh trùng hash Id."
    classification_context: null
    etl_derived_value: null

