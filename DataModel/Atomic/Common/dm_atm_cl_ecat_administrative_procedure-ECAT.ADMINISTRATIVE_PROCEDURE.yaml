schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-cl_ecat_administrative_procedure-ECAT.ADMINISTRATIVE_PROCEDURE
  logical_name: Classification ECAT Administrative Procedure
  physical_name: cl_ecat_administrative_procedure
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Common
  bcv_concept: "[Common] Classification"
  table_type: Relative
  etl_pattern: SCD2
  source: ECAT
  description: |
    Danh mục thủ tục hành chính (TTHC) của hệ thống danh mục dùng chung ECAT, gồm mã, tên, lĩnh vực, nhóm, mức độ, trình tự và cách thức thực hiện, thời gian giải quyết, lệ phí, cơ quan có thẩm quyền và căn cứ pháp lý; BK = CODE nguồn.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-ECAT-ADMINISTRATIVE_PROCEDURE

attributes:
