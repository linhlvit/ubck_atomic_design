schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-cl_business_transaction-SCMS.CAT_BUSINESS_LINE
  logical_name: Classification Business Transaction
  physical_name: cl_business_transaction
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Common
  bcv_concept: "[Common] Business Line"
  table_type: Classification
  etl_pattern: Upsert
  source: SCMS
  description: |
    Danh mục nghiệp vụ kinh doanh chứng khoán được UBCKNN cấp phép cho CTCK (môi giới, tự doanh, bảo lãnh phát hành, tư vấn đầu tư, quản lý quỹ...) — mã, tên, vốn pháp định tối thiểu theo quy định pháp luật cho từng nghiệp vụ. Nâng cấp từ Classification Value (scheme SCMS_BUSINESS_LINE) lên entity thật. Đổi tên từ "Classification SCMS Business Line" theo yêu cầu tường minh của Data Modeler (bỏ tiền tố nguồn + đổi BCV Term hiển thị thành "Business Transaction"); BCV Concept giữ nguyên [Common] Business Line do không tìm thấy BCV Term "Business Transaction" khớp hơn trong knowledge/terms.csv. Xem SCMS_HLD_Overview.md #55 / 7e #16.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-CAT_BUSINESS_LINE

