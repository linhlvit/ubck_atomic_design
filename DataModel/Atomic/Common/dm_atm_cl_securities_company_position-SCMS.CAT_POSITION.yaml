    source_table: CAT_POSITION
    source_column: SCMS.CAT_POSITION.POSITION_CODE
    comment: "BK chính. Nguồn NVARCHAR2(50) — cần profile dữ liệu xác nhận NOT NULL/unique trước go-live (Code đóng vai trò BK và là đầu vào hash Id)."
    classification_context: null
    etl_derived_value: null

