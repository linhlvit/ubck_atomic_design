    nullable: false
    is_primary_key: true
    source_system: SCMS
    source_table: CAT_POSITION
    source_column: SCMS.CAT_POSITION.POSITION_CODE
    comment: "PK surrogate. BCV: \"[Common] Position\". Danh mục chức vụ nhân sự CTCK. Hash: hash_id('SCMS_CAT_POSITION', POSITION_CODE)."
    classification_context: null
    etl_derived_value: null

