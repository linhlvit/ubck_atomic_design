  status: draft
  bcv_core_object: Common
  bcv_concept: "[Common] Position"
  table_type: Relative
  etl_pattern: SCD2
  source: SCMS
  description: |
    Danh mục chức vụ nhân sự CTCK — mã, tên, nhóm chức vụ và các cờ phân loại (người đại diện, thành viên Ban lãnh đạo, giám đốc chi nhánh/PGD/VPĐD). Nâng cấp từ Classification Value (scheme SCMS_POSITION_TYPE) lên entity thật theo yêu cầu Data Modeler (2026-10-08).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-CAT_POSITION

