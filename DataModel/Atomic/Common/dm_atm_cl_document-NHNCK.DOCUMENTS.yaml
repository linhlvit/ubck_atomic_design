schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-cl_document-NHNCK.DOCUMENTS
  logical_name: Classification Document
  physical_name: cl_document
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Common
  bcv_concept: "[Common] Document"
  table_type: Relative
  etl_pattern: SCD2
  source: NHNCK
  description: |
    Danh mục các loại tài liệu/hồ sơ cần nộp trong quy trình cấp chứng chỉ hành nghề chứng khoán (NHNCK).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-NHNCK-DOCUMENTS

attributes:
  - name: Classification Document Id
    physical_name: cl_document_id
    business_meaning: Id tự sinh (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: NHNCK
    source_table: DOCUMENTS
    source_column: NHNCK.DOCUMENTS.ID
    comment: "PK surrogate. BCV: [Common] Document. Hash: hash_id('NHNCK.DOCUMENTS', ID)."
    classification_context: "Source System Code = 'NHNCK_DOCUMENTS'"
    etl_derived_value: null

  - name: Classification Document Code
    physical_name: cl_document_code
    business_meaning: Mã tài liệu — BK của entity.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: NHNCK
    source_table: DOCUMENTS
    source_column: NHNCK.DOCUMENTS.DOCUMENT_CODE
    comment: BK chính. Mã định danh duy nhất trong danh mục tài liệu.
    classification_context: "Source System Code = 'NHNCK_DOCUMENTS'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: NHNCK
    source_table: DOCUMENTS
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'NHNCK_DOCUMENTS'"
    etl_derived_value: NHNCK.DOCUMENTS

  - name: Classification Document Name
    physical_name: cl_document_nm
    business_meaning: Tên tài liệu.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: NHNCK
    source_table: DOCUMENTS
    source_column: NHNCK.DOCUMENTS.DOCUMENT_NAME
