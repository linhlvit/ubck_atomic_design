    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: STATUS
    source_column: FMS.STATUS.CODE
    comment: "BK duy nhất của entity. Nguồn nullable (unique khi có giá trị) — cần profile dữ liệu xác nhận NOT NULL/unique trước go-live vì Code đóng vai trò BK và đầu vào hash Id."
    classification_context: null
    etl_derived_value: null

