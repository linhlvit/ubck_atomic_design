    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: STATUS
    source_column: null
    comment: "PK surrogate. Hash: hash_id('FMS_STATUS', CODE). BCV: \"[Common] Involved Party Life Cycle Status\" (không có term trần \"Status\" trong Common). Danh mục trạng thái hoạt động của thành viên thị trường."
    classification_context: null
    etl_derived_value: null

