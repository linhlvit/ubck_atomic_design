  version: "1.0"
  status: approved
  bcv_core_object: Common
  bcv_concept: "[Common] Involved Party Life Cycle Status"
  table_type: Relative
  etl_pattern: SCD2
  source: FMS
  description: |
    Danh mục trạng thái hoạt động của thành viên thị trường (công ty QLQ, quỹ, ngân hàng lưu ký, đại lý...) kèm loại đối tượng áp dụng và cờ phải nộp báo cáo. Promote từ Classification Value (scheme FMS_OPERATION_STATUS, nay deprecated) lên entity riêng; BK = mã nghiệp vụ CODE.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FMS-STATUS

