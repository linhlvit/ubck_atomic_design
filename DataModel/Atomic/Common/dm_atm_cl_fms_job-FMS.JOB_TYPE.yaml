  logical_name: Classification FMS Job
  physical_name: cl_fms_job
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Common
  bcv_concept: "[Common] Position"
  table_type: Relative
  etl_pattern: SCD2
  source: FMS
  description: |
    Danh mục chức danh/vị trí công việc áp dụng cho nhân sự công ty QLQ, kèm loại chức vụ (JOB_TYPE) denormalize vào cùng entity. **[SỬA 2026-10-02]** Đổi tên từ Classification FMS Position; gộp JOBS + JOB_TYPE, chỉ map ID, ITEM_NAME, JOB_TYPE_ID (JOBS) và ID, ITEM_NAME (JOB_TYPE). Được FK từ Fund Management Company Employee X Classification FMS Job Relationship (Tier 3).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FMS-JOB_TYPE

attributes:
