    physical_name: cl_fms_job_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FMS
    source_table: JOB_TYPE
    source_column: null
    comment: "PK surrogate dùng chung với lld_FMS_JOBS.yaml (hash_id('FMS_JOBS', JOBS.ID)). Hash: hash_id('FMS_JOB_TYPE', ID)."
    classification_context: null
    etl_derived_value: null

  - name: Classification FMS Job Code
    physical_name: cl_fms_job_code
    business_meaning: Khóa chính của bản ghi loại chức danh (UUID dạng RAW(16)).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FMS
    source_table: JOB_TYPE
    source_column: FMS.JOB_TYPE.ID
    comment: "Khóa nối với JOBS.JOB_TYPE_ID (join JOBS.JOB_TYPE_ID = JOB_TYPE.ID)."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FMS
    source_table: JOB_TYPE
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
