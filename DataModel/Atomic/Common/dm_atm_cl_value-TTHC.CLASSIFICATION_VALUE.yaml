    nullable: false
    is_primary_key: true
    source_system: TTHC
    source_table: CLASSIFICATION_VALUE
    source_column: TTHC.CLASSIFICATION_VALUE.SCHEMA_CODE
    comment: "BK phụ — kết hợp Schema Code + Classification Code tạo BK duy nhất. Nguồn thực: ContentItemIndex.ContentType. Ví dụ: 'TrangThaiHoSo', 'LoaiHoSo', 'LinhVucTTHC', 'MucDoTTHC', 'KenhTiepNhan', 'CoQuanXuLy', 'LoaiDoiTuongNop', 'DichVuChuyenPhat', 'TinhThanh', 'QuanHuyen'."
