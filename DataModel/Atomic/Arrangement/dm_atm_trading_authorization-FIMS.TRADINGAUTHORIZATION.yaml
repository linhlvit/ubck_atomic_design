  bcv_core_object: Arrangement
  bcv_concept: "[Arrangement] Authority Arrangement"
  table_type: Relative
  etl_pattern: SCD2
  source: FIMS
  description: |
    Hợp đồng ủy quyền giao dịch — nhà đầu tư nước ngoài ủy quyền cho người đại diện giao dịch hành động thay mặt. Ghi nhận loại đối tượng áp dụng, công ty quản lý quỹ/công ty chứng khoán liên quan, loại hình ủy quyền, trạng thái, thời hạn hiệu lực và tệp đính kèm.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FIMS-TRADINGAUTHORIZATION

