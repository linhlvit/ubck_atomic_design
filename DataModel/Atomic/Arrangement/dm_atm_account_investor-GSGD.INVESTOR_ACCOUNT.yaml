  bcv_core_object: Arrangement
  bcv_concept: "[Arrangement] Trading Account Arrangement"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: GSGD
  description: |
    Tài khoản giao dịch chứng khoán của nhà đầu tư trong hệ thống GSGD (nguồn gốc VSDC). Gộp thông tin cơ bản (định danh, loại hình NĐT, trạng thái, người/ngày nhận ủy quyền) và thông tin mở rộng liên hệ/ngân hàng vào 1 entity duy nhất. Số CCCD (Identity Number) FK sang Individual (nguồn NHNCK.IDENTITY_INFO_C06S).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-GSGD-INVESTOR_ACCOUNT

