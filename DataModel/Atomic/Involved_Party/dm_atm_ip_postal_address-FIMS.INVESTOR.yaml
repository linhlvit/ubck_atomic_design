    source_table: INVESTOR
    source_column: FIMS.WARD_NEW.Code
    comment: "Lookup pair: geographic_area.geographic_area_code. Pair with Ward Id. Giá trị lấy từ FIMS.WARD_NEW.Code sau ETL crosswalk — chi tiết xem comment Ward Id."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null
