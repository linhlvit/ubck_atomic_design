schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ip_postal_address-FIMS.INVESTOR
  logical_name: Involved Party Postal Address
  physical_name: ip_postal_address
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Involved Party
  bcv_concept: Shared Entity
  table_type: Fundamental
  etl_pattern: SCD4A
  source: FIMS
  description: |
    Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FIMS-INVESTOR

attributes:
  - name: Involved Party Id
    physical_name: ip_id
    business_meaning: Khóa đại diện (surrogate key) của shared entity; cùng giá trị với Foreign Investor Id.
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.TransactionCode
    comment: "Surrogate Key của shared entity. Hash: hash_id('FIMS_INVESTOR', TransactionCode)."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Involved Party Code
    physical_name: ip_code
    business_meaning: Mã Foreign Investor.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.TransactionCode
    comment: "Mã nghiệp vụ của đối tượng IP, lấy trực tiếp từ FIMS.INVESTOR"
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: FIMS_INVESTOR

  - name: Address Type Code
    physical_name: adr_tp_code
    business_meaning: Loại địa chỉ.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: INVESTOR
    source_column: null
    comment: "Scheme: IP_ADDR_TYPE. Nguồn chỉ có 1 loại địa chỉ (trụ sở/văn phòng) — hardcode HEAD_OFFICE."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: HEAD_OFFICE

  - name: Address Value
    physical_name: adr_val
    business_meaning: Địa chỉ trụ sở/văn phòng.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.Address
    comment: null
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Province Id
    physical_name: province_id
    business_meaning: FK đến Geographic Area cấp Tỉnh/Thành phố.
    data_domain: Surrogate Key
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.ProvinceId
    comment: "FK target: geographic_area.geographic_area_id (geographic_area_tp_code = 'PROVINCE'). Cần ETL crosswalk sang FIMS.PROVINCE_NEW: INVESTOR.ProvinceId = PROVINCE_NEW.Id để xác nhận Code sau đó hash_id('ECAT_PROVINCE_NEW', Code) | Chưa xác nhận value set khớp danh mục ECAT — cần profile dữ liệu trước go-live."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Province Code
    physical_name: province_code
    business_meaning: Mã Tỉnh/Thành phố (Code của Geographic Area).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.PROVINCE_NEW.Code
    comment: "Lookup pair: geographic_area.geographic_area_code. Pair with Province Id. Giá trị lấy từ FIMS.PROVINCE_NEW.Code sau ETL crosswalk — chi tiết xem comment Province Id."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Ward Id
    physical_name: ward_id
    business_meaning: FK đến Geographic Area cấp Phường/Xã.
    data_domain: Surrogate Key
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.WardId
    comment: "FK target: geographic_area.geographic_area_id (geographic_area_tp_code = 'WARD'). Cần ETL crosswalk sang FIMS.WARD_NEW: INVESTOR.WardId = WARD_NEW.Id để xác nhận Code sau đó hash_id('ECAT_WARD_NEW', Code) | Chưa xác nhận value set khớp danh mục ECAT — cần profile dữ liệu trước go-live."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Address Type Code = 'HEAD_OFFICE'"
    etl_derived_value: null

  - name: Ward Code
    physical_name: ward_code
    business_meaning: Mã Phường/Xã (Code của Geographic Area).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
