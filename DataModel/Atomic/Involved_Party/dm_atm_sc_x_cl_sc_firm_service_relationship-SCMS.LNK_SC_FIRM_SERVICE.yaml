  logical_name: Securities Company X Classification Securities Company Firm Service Relationship
  physical_name: sc_x_cl_sc_firm_service_relationship
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Involved Party
  bcv_concept: "[Involved Party] Broker Dealer"
  table_type: Relative
  etl_pattern: SCD2
  source: SCMS
  description: |
    Danh mục số giấy phép dịch vụ chứng khoán hiện hành theo từng CTCK (FK Securities Company + Classification Securities Company Firm Service), gồm số giấy phép và ngày hiệu lực/hết hiệu lực. Khác dữ liệu với Securities Company Licensed Service (hồ sơ đăng ký/thu hồi dịch vụ) — xem 7e #4. Tái dùng BCV Concept của entity cha Securities Company. Tên đổi theo cascade khi parent Classification Securities Company Firm Service đổi tên 2026-09-16.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-LNK_SC_FIRM_SERVICE

attributes:
  - name: Securities Company Id
    physical_name: sc_id
    business_meaning: "FK -> sc_firm_info: Công ty chứng khoán liên quan."
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: SCMS
    source_table: LNK_SC_FIRM_SERVICE
    source_column: SCMS.LNK_SC_FIRM_SERVICE.SC_FIRM_INFO_ID
    comment: "FK target: securities_company.sc_id. Cần ETL crosswalk sang SCMS.SC_FIRM_INFO: LNK_SC_FIRM_SERVICE.SC_FIRM_INFO_ID = SC_FIRM_INFO.ID để xác nhận CODE sau đó hash_id('SCMS.SC_FIRM_INFO', CODE) | Composite PK cùng Classification Securities Company Firm Service Id — entity không có Id/Code riêng, business key = cặp (SC_FIRM_INFO_ID, SERVICE_ID) theo quyết định Data Modeler (2026-09-15)."
    classification_context: null
    etl_derived_value: null

  - name: Securities Company Code
    physical_name: sc_code
    business_meaning: Mã Công ty chứng khoán.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: LNK_SC_FIRM_SERVICE
    source_column: SCMS.SC_FIRM_INFO.CODE
    comment: "Lookup pair: securities_company.securities_company_code. Pair with Securities Company Id. Giá trị lấy từ SCMS.SC_FIRM_INFO.CODE sau ETL crosswalk — chi tiết xem comment Securities Company Id."
    classification_context: null
