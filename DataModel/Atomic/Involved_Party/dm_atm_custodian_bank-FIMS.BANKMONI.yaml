schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-custodian_bank-FIMS.BANKMONI
  logical_name: Custodian Bank
  physical_name: custodian_bank
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Involved Party
  bcv_concept: "[Involved Party] Organization"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: FIMS
  description: |
    Ngân hàng lưu ký giám sát (LKGS) được chỉ định để lưu giữ tài sản quỹ và giám sát hoạt động công ty QLQ. Ghi nhận tên, mã, địa chỉ và thông tin liên hệ.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FIMS-BANKMONI

attributes:
  - name: Custodian Bank Id
    physical_name: custodian_bank_id
    business_meaning: Khóa đại diện (surrogate key).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: BANKMONI
    source_column: null
    comment: "PK surrogate. BCV: \"[Involved Party] Organization\". Ngân hàng lưu ký, giám sát tài sản quỹ đầu tư và giám sát hoạt động công ty QLQ. Hash: hash_id('FIMS_BANKMONI', Id)."
    classification_context: null
    etl_derived_value: null

  - name: Custodian Bank Code
    physical_name: custodian_bank_code
    business_meaning: Khóa chính của bản ghi (ID số tự tăng). BK.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: BANKMONI
    source_column: FIMS.BANKMONI.Id
    comment: "BK chính. Nguồn không có cột mã nghiệp vụ riêng — dùng Id nguồn làm BK (cùng pattern FMS.BANK_MONI). Nguồn lưu NUMBER(18,2) — ETL cần convert sang string, bỏ phần thập phân .00."
    classification_context: null
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: BANKMONI
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
