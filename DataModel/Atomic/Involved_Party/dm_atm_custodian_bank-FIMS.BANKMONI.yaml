    etl_derived_value: FIMS_BANKMONI

  - name: Classification FIMS Status Id
    physical_name: cl_fims_status_id
    business_meaning: "FK -> STATUS: Trạng thái hoạt động của đối tượng (bảng danh mục STATUS)."
