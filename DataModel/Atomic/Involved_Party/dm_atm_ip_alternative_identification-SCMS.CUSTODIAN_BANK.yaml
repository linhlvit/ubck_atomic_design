schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ip_alternative_identification-SCMS.CUSTODIAN_BANK
  logical_name: Involved Party Alternative Identification
  physical_name: ip_alternative_identification
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Involved Party
  bcv_concept: Shared Entity
  table_type: Fundamental
  etl_pattern: SCD4A
  source: SCMS
  description: |
    Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ 1 nguồn.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-CUSTODIAN_BANK

attributes:
  - name: Involved Party Id
    physical_name: ip_id
    business_meaning: FK đến Securities Company Custodian Bank.
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: CUSTODIAN_BANK
    source_column: SCMS.CUSTODIAN_BANK.ID
    comment: "FK target: sc_custodian_bank.sc_custodian_bank_id. Shared entity — không có PK surrogate riêng. Hash: hash_id('SCMS.CUSTODIAN_BANK', ID)."
    classification_context: "Source System Code = 'SCMS_CUSTODIAN_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Involved Party Code
    physical_name: ip_code
    business_meaning: Mã Securities Company Custodian Bank.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: CUSTODIAN_BANK
    source_column: SCMS.CUSTODIAN_BANK.ID
    comment: "Lookup pair: sc_custodian_bank.sc_custodian_bank_code. Pair with Involved Party Id."
    classification_context: "Source System Code = 'SCMS_CUSTODIAN_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: CUSTODIAN_BANK
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
