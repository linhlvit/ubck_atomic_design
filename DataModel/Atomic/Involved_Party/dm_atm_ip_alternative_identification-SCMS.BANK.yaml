schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ip_alternative_identification-SCMS.BANK
  logical_name: Involved Party Alternative Identification
  physical_name: ip_alternative_identification
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Involved Party
  bcv_concept: Shared Entity
  table_type: Fundamental
  etl_pattern: SCD4A
  source: SCMS
  description: |
    Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ 1 nguồn.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-BANK

attributes:
  - name: Involved Party Id
    physical_name: ip_id
    business_meaning: FK đến Securities Company Depositary Bank.
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: SCMS.BANK.ID
    comment: "FK target: sc_depositary_bank.sc_depositary_bank_id. Shared entity. Hash: hash_id('SCMS.BANK', ID)."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Involved Party Code
    physical_name: ip_code
    business_meaning: Mã Securities Company Depositary Bank.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: SCMS.BANK.ID
    comment: "Lookup pair: sc_depositary_bank.sc_depositary_bank_code. Pair with Involved Party Id."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM. Hardcode."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: SCMS.BANK

  - name: Identification Type Code
    physical_name: identification_tp_code
    business_meaning: "Loại giấy tờ định danh tổ chức: ENTERPRISE_CODE=Mã số doanh nghiệp; TAX_CODE=Mã số thuế; OPERATION_LICENSE=Giấy phép hoạt động ngân hàng; BIZ_REG_CERT=Giấy chứng nhận đăng ký kinh doanh."
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: null
    comment: "Scheme: IP_ALT_ID_TYPE. ETL pivot: ENTERPRISE_CODE→ENTERPRISE_CODE; TAX_CODE→TAX_CODE; OPERATION_LICENSE_NUMBER→OPERATION_LICENSE; BUSINESS_REG_CERT_NUMBER→BIZ_REG_CERT."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Previous Identification Number
    physical_name: previous_identification_nbr
    business_meaning: Số CMND cũ (trước khi đổi sang CCCD).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: null
    comment: Lưu lại để tra cứu lịch sử giấy tờ.
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Identification Number
    physical_name: identification_nbr
    business_meaning: Số giấy tờ định danh của ngân hàng theo từng loại.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: "SCMS.BANK.ENTERPRISE_CODE, SCMS.BANK.TAX_CODE, SCMS.BANK.OPERATION_LICENSE_NUMBER, SCMS.BANK.BUSINESS_REG_CERT_NUMBER"
    comment: "ETL pivot: ENTERPRISE_CODE→row ENTERPRISE_CODE; TAX_CODE→row TAX_CODE; OPERATION_LICENSE_NUMBER→row OPERATION_LICENSE; BUSINESS_REG_CERT_NUMBER→row BIZ_REG_CERT."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Identification Issue Date
    physical_name: identification_issue_dt
    business_meaning: Ngày cấp giấy tờ (áp dụng cho OPERATION_LICENSE và BIZ_REG_CERT).
    data_domain: Date
    data_type: date
    nullable: true
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: "SCMS.BANK.LICENSE_ISSUE_DATE, SCMS.BANK.BUSINESS_REG_CERT_DATE"
    comment: "ETL pivot: LICENSE_ISSUE_DATE→row OPERATION_LICENSE; BUSINESS_REG_CERT_DATE→row BIZ_REG_CERT. NULL cho ENTERPRISE_CODE và TAX_CODE."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Identification Issue Place
    physical_name: identification_issue_place
    business_meaning: Tên cơ quan cấp (áp dụng cho OPERATION_LICENSE).
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: SCMS
    source_table: BANK
    source_column: SCMS.BANK.LICENSE_ISSUER
    comment: "ETL pivot: LICENSE_ISSUER→row OPERATION_LICENSE. NULL cho ENTERPRISE_CODE, TAX_CODE, BIZ_REG_CERT."
    classification_context: "Source System Code = 'SCMS_BANK' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null
