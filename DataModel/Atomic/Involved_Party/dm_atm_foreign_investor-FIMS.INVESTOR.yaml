schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-foreign_investor-FIMS.INVESTOR
  logical_name: Foreign Investor
  physical_name: foreign_investor
  layer: Atomic
  version: "1.0"
  status: draft
  bcv_core_object: Involved Party
  bcv_concept: "[Involved Party] Individual"
  table_type: Fundamental
  etl_pattern: SCD4A
  source: FIMS
  description: |
    Nhà đầu tư nước ngoài (cá nhân và tổ chức) được UBCKNN quản lý tại Việt Nam. Ghi nhận loại đối tượng (cá nhân/tổ chức), mã giao dịch VSDC, thông tin nhân thân/doanh nghiệp, tài khoản lưu ký và trạng thái hoạt động. Tách IP Postal Address + IP Electronic Address + IP Alt Identification (bổ sung 2026-07-19 khi thiết kế LLD).
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FIMS-INVESTOR

