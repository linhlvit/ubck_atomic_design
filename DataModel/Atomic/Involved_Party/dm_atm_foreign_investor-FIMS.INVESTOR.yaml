    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: INVESTOR
    source_column: null
    comment: "PK surrogate. BCV: \"[Involved Party] Individual\". Nhà đầu tư nước ngoài (cá nhân/tổ chức) đăng ký hoạt động tại Việt Nam. Hash: hash_id('FIMS.INVESTOR', TransactionCode)."
    classification_context: "Source System Code = 'FIMS_INVESTOR'"
    etl_derived_value: null

