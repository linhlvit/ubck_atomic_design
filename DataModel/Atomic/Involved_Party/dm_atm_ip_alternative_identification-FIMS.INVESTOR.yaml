    data_domain: Date
    data_type: date
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.IdDate
    comment: null
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Identification Issue Place
    physical_name: identification_issue_place
    business_meaning: Nơi cấp giấy tờ định danh.
    data_domain: Text
    data_type: string
    nullable: true
