schema_type: data_model
schema_version: "1.0"

ldm:
  id: ATM-ip_alternative_identification-FIMS.INVESTOR
  logical_name: Involved Party Alternative Identification
  physical_name: ip_alternative_identification
  layer: Atomic
  version: "1.0"
  status: approved
  bcv_core_object: Involved Party
  bcv_concept: Shared Entity
  table_type: Fundamental
  etl_pattern: SCD4A
  source: FIMS
  description: |
    Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ 1 nguồn.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-FIMS-INVESTOR

attributes:
  - name: Involved Party Id
    physical_name: ip_id
    business_meaning: FK đến Foreign Investor (Involved Party).
    data_domain: Surrogate Key
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.TransactionCode
    comment: "FK target: foreign_investor.foreign_investor_id. Hash: hash_id('FIMS.INVESTOR', TransactionCode)."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Involved Party Code
    physical_name: ip_code
    business_meaning: Mã Foreign Investor.
    data_domain: Text
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.TransactionCode
    comment: "Lookup pair: foreign_investor.foreign_investor_code. Pair with Involved Party Id."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Source System Code
    physical_name: src_stm_code
    business_meaning: Mã hệ thống nguồn dữ liệu.
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: null
    comment: "Scheme: SOURCE_SYSTEM."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: FIMS.INVESTOR

  - name: Identification Type Code
    physical_name: identification_tp_code
    business_meaning: "Loại giấy tờ tùy thân/pháp lý (CMND/CCCD/Hộ chiếu với NĐT cá nhân, Giấy phép/Mã số DN với NĐT tổ chức)."
    data_domain: Classification Value
    data_type: string
    nullable: false
    is_primary_key: true
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.ObjectType
    comment: "Scheme: IP_ALT_ID_TYPE. (source) — type xác định tại ETL dựa theo ObjectType (1=cá nhân → NATIONAL_ID/CITIZEN_ID/PASSPORT, 2=tổ chức → ENTERPRISE_CODE), không có cột type riêng biệt trong nguồn. Cần profile dữ liệu để xác nhận loại giấy tờ thực tế của NĐT cá nhân (nguồn không phân biệt CMND cũ/CCCD/Hộ chiếu)."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

  - name: Identification Number
    physical_name: identification_nbr
    business_meaning: Số CMND/CCCD/Hộ chiếu/Giấy phép.
    data_domain: Text
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: FIMS.INVESTOR.IdNo
    comment: null
