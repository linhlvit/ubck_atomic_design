  - name: Identification Type Code
    physical_name: identification_tp_code
    business_meaning: "Loại giấy tờ định danh: OPERATION_LICENSE=Giấy phép thành lập và hoạt động (UBCKNN); ESTABLISHMENT_LICENSE=Giấy phép thành lập; TAX_CODE=Mã số thuế; ENTERPRISE_CODE=Mã số doanh nghiệp; CERTIFICATE=Số chứng nhận (generic); CUSTODIAN_CERT=Chứng nhận lưu ký; CUSTODIAN_MEMBER_CERT=Chứng nhận thành viên lưu ký."
    data_domain: Classification Value
    data_type: string
    nullable: true
    is_primary_key: false
    source_system: FIMS
    source_table: INVESTOR
    source_column: null
    comment: "Scheme: IP_ALT_ID_TYPE. ETL map từ NUMBER: 1=NATIONAL_ID, 2=CITIZEN_ID, 3=PASSPORT. // Scheme: IP_ALT_ID_TYPE. ETL pivot: ENTERPRISE_CODE→ENTERPRISE_CODE; TAX_CODE→TAX_CODE; OPERATION_LICENSE_NUMBER→OPERATION_LICENSE; BUSINESS_REG_CERT_NUMBER→BIZ_REG_CERT. // Scheme: IP_ALT_ID_TYPE. ETL pivot 7 loại: BUSINESS_LICENSE_NUMBER→OPERATION_LICENSE; FOUNDATION_LICENSE_NUMBER→ESTABLISHMENT_LICENSE; TAX_CODE→TAX_CODE; ENTERPRISE_CODE→ENTERPRISE_CODE; CERTIFICATE_NUMBER→CERTIFICATE; CUSTODIAN_CERT_NUMBER→CUSTODIAN_CERT; CUSTODIAN_MEMBER_CERT_NUMBER→CUSTODIAN_MEMBER_CERT. // Scheme: IP_ALT_ID_TYPE. ETL pivot: LICENSE_NUMBER→OPERATION_LICENSE; ENTERPRISE_CODE→ENTERPRISE_CODE; TAX_CODE→TAX_CODE. // Scheme: IP_ALT_ID_TYPE. ETL pivot: BUSINESS_LICENSE_NUMBER→OPERATION_LICENSE; OFFICE_BUSINESS_LICENSE→ESTABLISHMENT_LICENSE. // Scheme: IP_ALT_ID_TYPE. ETL pivot: LICENSE_NUMBER→OPERATION_LICENSE; ENTERPRISE_CODE→ENTERPRISE_CODE; TAX_CODE→TAX_CODE; BUSINESS_REG_CERT→BIZ_REG_CERT. // Scheme: IP_ALT_ID_TYPE. ETL pivot: ESTABLISHMENT_LICENSE→ESTABLISHMENT_LICENSE; BUSINESS_REG_CERT_NUMBER→BIZ_REG_CERT. // Scheme: IP_ALT_ID_TYPE. (source) — type lấy động từ nguồn. ETL map: 1=NATIONAL_ID;2=CITIZEN_ID;3=PASSPORT;4=ENTERPRISE_CODE. // Scheme: IP_ALT_ID_TYPE (source). Nguồn có cột type động qua lookup (LOOKUP_GROUP = 'IDENTITY TYPE') — ETL map value runtime."
    classification_context: "Source System Code = 'FIMS_INVESTOR' | Identification Type Code = '(SOURCE)'"
    etl_derived_value: null

