    data_type: string
    nullable: false
    is_primary_key: false
    source_system: NHNCK
    source_table: UNITS
    source_column: NHNCK.UNITS.ID
    comment: "FK target: ra_organization_unit.ra_ou_id. Shared entity — không có PK surrogate riêng. Nguồn IP Postal Address chính là NHNCK.UNITS (cùng dòng dữ liệu với Regulatory Authority Organization Unit, không cần crosswalk qua bảng khác) nên chỉ cần đổi cơ sở hash: hash_id('NHNCK.UNITS', UNIT_CODE) | Trước đây hash trực tiếp theo ID (ID kỹ thuật) gây sai lệch với Id của bảng main (hash từ UNIT_CODE) — đã sửa 2026-07-27."
