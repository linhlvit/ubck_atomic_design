  bcv_core_object: Involved Party
  bcv_concept: "[Involved Party] Branch"
  table_type: Relative
  etl_pattern: SCD2
  source: SCMS
  description: |
    Đơn vị tổ chức nước ngoài trực thuộc CTCK hoạt động tại Việt Nam: chi nhánh CTCK nước ngoài (SC_FIRM_FOREIGN_BRANCH, org_unit_type_code = FOREIGN_BRANCH) và văn phòng đại diện CTCK nước ngoài (SC_FIRM_FOREIGN_REP_OFFICE, org_unit_type_code = FOREIGN_REP_OFFICE). Ghi nhận thông tin công ty mẹ, quốc gia, vốn được cấp, số giấy phép, thời hạn hoạt động và trạng thái pháp lý.
  owner:
    steward: username@ubck.com.vn
    data_modeler: username@fssc.com.vn
  references:
    brd: BRD-SRC-SCMS-SC_FIRM_FOREIGN_BRANCH

