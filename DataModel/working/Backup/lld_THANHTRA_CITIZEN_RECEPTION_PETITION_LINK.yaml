  notes: "Bảng mới (DDL UAT cập nhật 2026-09) — thay thế cột PETITION_ID (nay DEPRECATED, giữ lại trên CITIZEN_RECEPTION chỉ để tương thích ngược) — xem THANHTRA_HLD_Tier2.md mục T2-05. Domain Prefix rỗng vì entity link/relationship thuần bắc cầu 2 domain (Citizen Reception + Petition), cùng cơ chế `{A} X {B} Relationship` đã dùng cho Penalty Decision X Violation Record Relationship. KHÔNG áp dụng pattern composite-PK 'pure link' của Rule 3e vì bảng nguồn có SORT_ORDER — business attribute riêng ngoài 2 FK — nên vẫn cần Id/Code riêng cho entity (theo đúng ngoại lệ ghi trong Rule 3e: entity `_x_` có thêm business attribute riêng vẫn cần Id/Code vì có identity độc lập ngoài cặp FK). Code lấy trực tiếp từ ID kỹ thuật (không có mã nghiệp vụ riêng). Audit block loại trừ khỏi Atomic — mirror quyết định đã áp dụng cho toàn bộ phân hệ THANHTRA (xem pending_design.yaml)."
