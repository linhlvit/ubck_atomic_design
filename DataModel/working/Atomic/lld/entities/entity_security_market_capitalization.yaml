consolidation_notes:
- "Entity gộp từ 2 bảng nguồn cùng cấu trúc (HNX.MARKET_CAPITALIZATION_STX / _UPX) thay cho bảng gộp cũ HNX.MARKET_CAPITALIZATION."
- "Average Price: chỉ có ở _UPX → nullable=true; dòng từ _STX để NULL."
- "Không có cột phân biệt thị trường (Data Modeler 2026-11-18): sàn chỉ phân biệt qua bảng nguồn / Source System Code. BK = TICKER_SYMBOL + DS_SNPST_DT, giả định một mã chỉ niêm yết ở một sàn trong cùng kỳ — nếu một mã xuất hiện ở cả 2 bảng cùng ngày, Id trùng."
- "Id hash dùng literal theo từng bảng nguồn (HNX_MARKET_CAPITALIZATION_STX / _UPX) — ETL cần áp đúng theo bảng đang nạp."
- "Kiểu nguồn rộng hơn thiết kế (giá DECIMAL(24,6), giá trị DECIMAL(30,6), tỷ lệ DECIMAL(30,18)) → ETL cần ROUND/CAST về decimal(23,2) / decimal(5,2); cần profile dữ liệu trước go-live."
