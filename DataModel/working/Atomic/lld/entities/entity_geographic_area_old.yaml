consolidation_notes:
- "Entity mới — tách riêng khỏi Geographic Area theo yêu cầu Data Modeler vì cấu trúc\
  \ phân cấp cũ (3 cấp: Tỉnh cũ → Quận/huyện cũ → Phường/xã cũ) khác cấu trúc hiện\
  \ hành (2 cấp: Tỉnh mới → Phường/xã mới). Chỉ phục vụ tra cứu lịch sử, không phát\
  \ sinh instance mới sau sáp nhập hành chính 2025."
- "DISTRICT_OLD không có cột EFFECTIVE/DELETED_REASON/NAME_EN/DISPLAY_LABEL đầy đủ\
  \ như PROVINCE_OLD/WARD_OLD — source_mappings null cho các attribute tương ứng (riêng\
  \ DISPLAY_LABEL DISTRICT_OLD có, chỉ thiếu EFFECTIVE/DELETED_REASON/NAME_EN)."
- "2 FK cross-entity sang Geographic Area (không phải self-ref nội bộ): Region Geographic\
  \ Area Id/Code (anchor — chỉ PROVINCE_OLD) và Successor Geographic Area Id/Code\
  \ (successor mapping sau sáp nhập — PROVINCE_OLD→PROVINCE_NEW, WARD_OLD→WARD_NEW;\
  \ DISTRICT_OLD không có successor vì cấp quận/huyện bị bỏ hoàn toàn)."
