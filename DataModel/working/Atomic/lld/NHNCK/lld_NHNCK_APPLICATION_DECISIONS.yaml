  notes: "[MỚI 2026-09-12] Bảng nguồn chỉ có 3 cột: ID (PK kỹ thuật, không map — xem\
    \ pending_design.yaml), APPLICATION_ID (FK), DECISION_ID (FK) — pure junction,\
