    \ entity DECISIONS\". ĐẢO NGƯỢC quyết định đó (2026-09-12, yêu cầu Data Modeler)\
    \ — thiết kế thành entity link/relationship riêng theo pattern \"_x_\" (rule 3e\
    \ atomic-lld-design/SKILL.md), mirror `lld_NHNCK_APPLICATION_GROUP_MEMBERS.yaml`\
    \ và `lld_FMS_JOB_TL_PRO.yaml`: PK composite 2 FK Id (Decision Document Id + License\
    \ Application Id), không có Id/Code riêng của entity. BCV Concept tái dùng từ\
    \ entity cha Decision Document (Tier 1). Đặt Decision Document lên trước trong\
    \ tên entity — 1 quyết định bao gồm nhiều hồ sơ CCHN (phía Many là Application)."
