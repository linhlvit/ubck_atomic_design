  notes: "STATUS (nguồn) nay đã map thành \"Status Code\" (2026-08-17) — chính sách\
    \ cũ (2026-07-07) không map RECORD_TYPE/RECORD_STATUS chỉ áp dụng cho cột mang\
    \ tính kỹ thuật thuần túy; cột STATUS này mang ý nghĩa nghiệp vụ rõ ràng nên map\
    \ Classification Value. ID không map — PK kỹ thuật, BK dùng Code (map từ ID).\
    \ DECISION_NUMBER — đã xác nhận trùng lặp thuần với DECISIONS.DECISION_NUMBER\
    \ (resolve NHNCK_HLD_Tier2.md 6f #6, 2026-08-14), loại khỏi Atomic attribute,\
    \ xem pending_design.yaml. FK Decision Id/Code đã sửa sang crosswalk hash theo\
    \ DECISION_NUMBER (đồng bộ với đổi BK trên lld_NHNCK_DECISIONS.yaml). SIGNED_BY\
    \ khai báo NVARCHAR2(255) trong CSDL nguồn dù BRD ghi 'FK -> USERS' — khác kiểu\
    \ dữ liệu NUMBER thường thấy ở các FK Officer khác (VD APPLICATIONS.ASSIGNEE_ID)\
    \ — giả định cột lưu trực tiếp USERNAME thay vì ID kỹ thuật, cần Data Modeler\
    \ xác nhận trước go-live."
