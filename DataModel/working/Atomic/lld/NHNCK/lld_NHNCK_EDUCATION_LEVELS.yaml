  notes: "Đưa vào scope (2026-09-11) theo yêu cầu Data Modeler — trước đây out_of_scope\
    \ (không có scope_reason cụ thể trong brd_NHNCK.yaml). HLD Tier1 6d đã dự kiến\
    \ trước đó (scheme EDUCATIONAL_LEVEL, dùng bởi Securities Practitioner.Education\
    \ Level Code). Map trực tiếp vào Fundamental entity dùng chung Classification\
    \ Value (cl_value), mirror pattern lld_NHNCK_APPLICATION_STATUSES.yaml / lld_NHNCK_DEPARTMENTS.yaml\
    \ / lld_NHNCK_POSITIONS.yaml. Nguồn KHÔNG có cột CODE riêng (chỉ có ID kỹ thuật\
    \ + LEVEL_NAME). Scheme: NHNCK.EDUCATION_LEVELS (Schema Code literal, đăng ký\
    \ trong classification_schemes.yaml) — phân biệt với scheme FK-reference EDUCATIONAL_LEVEL\
    \ đã có sẵn (dùng bởi Education Level Code trên Securities Practitioner). File\
    \ này là Level 1 LLD; cần chạy Level 2 consolidation (generate_entity_consolidation.py)\
    \ gộp vào entity_cl_value.yaml cùng các source khác trước khi generate ra DataModel/Atomic.\
    \ 4 cột ds_* không thiết kế ở đây — ETL job tự quản lý (SCD, không map từ cột\
    \ nguồn). **[SỬA 2026-09-11]** cl_code đổi từ LEVEL_NAME sang ID theo yêu cầu\
    \ tường minh Data Modeler — CHỆCH khỏi rule 3e chung của dự án (PK kỹ thuật không\
    \ map vào BK) và khác với giá trị đã xác nhận qua profile dữ liệu trước đó (note\
    \ scheme EDUCATIONAL_LEVEL: \"cl_code lưu trực tiếp bằng tên tiếng Việt\"). Rủi\
    \ ro: nếu đã có bản ghi cl_value thật export từ trước dùng LEVEL_NAME làm khóa,\
    \ đổi sang ID sẽ tạo BK không khớp (không phải cùng 1 tập giá trị) — cần Data\
    \ Modeler xác nhận lại việc này trước go-live, đặc biệt nếu Gold/Datamart đã tham\
    \ chiếu cl_code theo tên cũ."
