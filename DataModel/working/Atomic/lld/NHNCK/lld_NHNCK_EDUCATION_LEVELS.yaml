    \ convert sang string. [SỬA 2026-09-11] Dùng ID (PK kỹ thuật) làm mã phân loại\
    \ theo yêu cầu tường minh Data Modeler — chệch khỏi rule 3e chung (PK kỹ thuật\
    \ không map vào BK) và khác với giá trị đã xác nhận qua profile dữ liệu trước\
    \ đó (LEVEL_NAME). Cần xác nhận lại trước go-live nếu đã có dữ liệu cl_value export\
