  notes: "[MỚI 2026-08-15] Trước đây đánh out_of_scope (Application Config) — đảo\
    \ lại theo quyết định Data Modeler: quan hệ này xác định chuyên môn nào bắt buộc\
    \ cho từng loại CCHN, kèm attribute nghiệp vụ riêng (SORT_ORDER/DOCUMENT_TYPE/IS_REQUIRED)\
    \ ngoài 2 FK — không phải pure junction rỗng, giữ làm entity Relative riêng (không\
    \ denormalize ARRAY). Theo pattern entity link \"_x_\" đã chuẩn hóa trong dự án:\
    \ KHÔNG có cặp Id/Code riêng của entity — PK là composite 2 FK Id (Securities\
    \ Practitioner License Certificate Type Id + Classification Specialization Id).\
    \ ID (nguồn) không map. Domain Prefix rỗng vì entity bắc cầu 2 domain khác nhau\
    \ (Securities Practitioner + Classification), không thuộc riêng nhóm nào. DOCUMENT_TYPE\
    \ không có FK note trong BRD — đăng ký Classification Value tạm NHNCK_CERT_SPEC_DOCUMENT_TYPE\
    \ (modeler_defined, values: [] — xem NHNCK_HLD_Tier2.md 6d/6f#7, cần profile dữ\
    \ liệu trước go-live). Sửa 2026-08-20: Classification Specialization Id + Code\
    \ đổi thành 1 trường Classification Value \"Specialization Code\" (scheme SPECIALIZATION)\
    \ — do NHNCK.SPECIALIZATIONS revert về Classification Value, không còn là Atomic\
    \ entity riêng. Composite PK đổi thành (Securities Practitioner License Certificate\
    \ Type Id, Specialization Code) — vế Specialization không còn surrogate Id để\
    \ dùng."
