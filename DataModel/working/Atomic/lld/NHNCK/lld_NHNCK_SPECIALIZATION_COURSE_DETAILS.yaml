  notes: "Hạ về draft (2026-07-27) để sửa lỗi hash sai lệch trên FK \"Securities Practitioner\
    \ Professional Training Class Id\": trước đây hash trực tiếp theo SPECIALIZATION_COURSE_ID\
    \ (ID kỹ thuật), trong khi bảng main SPECIALIZATION_COURSES lại hash surrogate\
    \ Id của chính nó từ COURSE_CODE — 2 giá trị hash không khớp nhau. Đã sửa comment\
    \ sang crosswalk join SPECIALIZATION_COURSE_ID → SPECIALIZATION_COURSES.ID để\
    \ lấy COURSE_CODE trước khi hash, xem comment tại attribute đó. Sửa tiếp (2026-08-18):\
    \ SPECIALIZATION_ID trước đây map thành \"Specialization Type Code\" (Classification\
    \ Value, scheme SPECIALIZATION) — scheme này đã deprecate từ 2026-07-09 khi SPECIALIZATIONS\
    \ nâng cấp thành Atomic entity thật 'Classification Specialization' (cl_specialization).\
    \ Các bảng khác tiêu thụ SPECIALIZATIONS (APPLICATION_SPECIALIZATIONS, CERTIFICATE_SPECIALIZATIONS)\
    \ đã đổi sang FK Id+Code chuẩn nhưng SPECIALIZATION_COURSE_DETAILS bị bỏ sót —\
    \ nay sửa sang cặp Classification Specialization Id + Code, kèm crosswalk join\
    \ SPECIALIZATION_ID → SPECIALIZATIONS.ID để lấy SPECIALIZATION_CODE trước khi\
    \ hash (đồng bộ với lld_NHNCK_SPECIALIZATION_COURSES.yaml sửa cùng lượt). Hạ về\
    \ draft lại (2026-08-20): Classification Specialization Id + Code đổi thành 1\
    \ trường Classification Value \"Specialization Code\" (scheme SPECIALIZATION)\
    \ — do NHNCK.SPECIALIZATIONS revert về Classification Value, không còn là Atomic\
    \ entity riêng."
