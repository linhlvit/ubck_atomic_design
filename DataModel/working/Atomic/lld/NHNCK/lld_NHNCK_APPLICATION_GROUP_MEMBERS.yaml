    \ PK đã là composite của 2 FK. [SỬA 2026-08-15] Đổi lại BCV Concept từ \"[Documentation]\
    \ Gov. Registration Document\" (2026-08-14, lần 3) sang \"[Group] Group\" — theo\
    \ quyết định Data Modeler, tái dùng concept từ phía Application Group (đổi tên\
    \ entity đặt Group lên trước)."
