  notes: "Thiết kế mới (2026-09-10) theo DDL mới NHNCK_UAT_schema.txt — bảng outbox\
    \ đẩy kết quả xử lý hồ sơ ra Cổng Dịch vụ công quốc gia (MCĐT). Quyết định Data\
    \ Modeler: nguồn update tại chỗ (STATUS/ATTEMPTS/NEXT_RETRY_AT/LAST_ERROR đổi\
    \ theo từng lần gửi), Atomic thiết kế theo SCD2 (table_type: Relative) để lưu\
    \ lịch sử thay đổi trạng thái gửi — không overwrite. ds_etl_pcs_tms/ds_rcrd_eff_dt/ds_rcrd_end_dt\
    \ sẽ khai báo ở bước generate entity/Atomic YAML (xem reference/technical_fields.md\
    \ §SCD2), không khai báo ở Level-1 LLD này (theo pattern các file lld_NHNCK_*.yaml\
    \ khác — technical fields ds_* không xuất hiện ở Level-1). ID (PK kỹ thuật, auto-increment)\
    \ không map — nguồn không có mã nghiệp vụ riêng, Code hash từ chính ID (convert\
    \ NUMBER→string), mirror pattern lld_NHNCK_CERTIFICATE_RECORD_STATUS_HISTORIES.yaml.\
    \ BCV Concept \"Notification\" (Communication, id 8536 trong knowledge/terms.csv)\
    \ — tra cứu trước khi gán theo quy tắc BCV bắt buộc. Status Code: value set chưa\
    \ xác nhận qua DDL (không có enum/comment nguồn) — xem classification_schemes.yaml\
    \ scheme NHNCK.MCDT_RESULT_OUTBOX.STATUS, cần profile dữ liệu trước go-live."
