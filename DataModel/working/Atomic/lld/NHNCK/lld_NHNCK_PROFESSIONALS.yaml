  notes: "Hạ về draft (2026-07-24) để bổ sung các trường nghiệp vụ chưa thiết kế (phát\
    \ hiện qua post_check_source_coverage.py): AVATAR, PLACE_OF_BIRTH_COUNTRY/PROVINCE/DISTRICT_ID,\
    \ SSO_SYNCED, SSO_USER_ID. CURRENT_COUNTRY/PROVINCE/DISTRICT_ID bổ sung vào lld_NHNCK_PROFESSIONALS_IP_Postal_Address.yaml\
    \ (khối địa chỉ tạm trú, mirror pattern Individual/IDENTITY_INFO_C06S). STATUS\
    \ KHÔNG map — cùng field với RECORD_STATUS đã loại trừ theo chính sách Data Modeler\
    \ (2026-07-07), chỉ đổi tên qua DDL UAT remap 2026-07-15/20 — xem pending_design.yaml.\
    \ USERNAME/PASSWORD KHÔNG map — dữ liệu xác thực, không thiết kế Atomic (xem pending_design.yaml).\
    \ IDENTITY_NUMBER/IDENTITY_ISSUE_DATE/IDENTITY_ISSUE_PLACE/IDENTITY_TYPE/PERMANENT_ADDRESS/ADDRESS\
    \ ĐÃ map đúng (xem lld_NHNCK_PROFESSIONALS_IP_Alt_Identification.yaml / _IP_Postal_Address.yaml)\
    \ — post_check_source_coverage.py báo sai \"chưa map\" do 2 lỗi công cụ đã biết\
    \ trong aggregate_atomic.py (dedup context rỗng cho shared entity dùng chung tên\
    \ với source khác có addr_type; và source_columns nhiều giá trị bị nối chuỗi thay\
    \ vì tách dòng riêng) — không phải gap thiết kế thật, không cần sửa LLD."
