schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "NHNCK"
  source_table: "CERTIFICATE_RECORDS"
  atomic_entity: "Securities Practitioner License Certificate Document"
  entity_physical_name: "sp_license_certificate_document"
  bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Gov. Registration Document"
  table_type: "Fundamental"
  group: "T3"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Hạ về draft (2026-08-17, xác nhận tường minh bởi Data Modeler) để bổ sung\
    \ trường \"Status Code\" (cột nguồn STATUS — trước đây bị loại trừ theo chính\
    \ sách 2026-07-07, nay map Classification Value vì mang ý nghĩa nghiệp vụ rõ ràng).\
    \ Cần review/approve lại. Lịch sử trước: STATUS (nguồn) không map — cùng field\
    \ với RECORD_STATUS đã loại trừ theo chính sách Data Modeler (2026-07-07: không\
    \ thiết kế RECORD_TYPE/RECORD_STATUS trên bất kỳ bảng NHNCK nào), chỉ đổi tên\
    \ qua DDL UAT remap 2026-07-15/20. Xem pending_design.yaml (cập nhật lại source_column\
    \ 2026-07-24). Hạ về draft (2026-07-27) để sửa lỗi hash-mismatch FK \"Securities\
    \ Practitioner License Certificate Type Id\" — trước đây hash trực tiếp theo CERTIFICATE_ID\
    \ (ID kỹ thuật) thay vì Code của bảng đích (CERTIFICATE_CODE). Hạ lại về draft\
    \ (2026-08-14) để sửa lỗi hash-mismatch tương tự trên 3 FK Issue/Revocation/Cancellation\
    \ Securities Practitioner License Decision Document Id — trước đây hash trực tiếp\
    \ theo *_DECISION_ID (ID kỹ thuật) thay vì Code của bảng đích (DECISION_NUMBER),\
    \ đồng bộ với đổi BK trên lld_NHNCK_DECISIONS.yaml. [SỬA 2026-08-15] Đổi Business\
    \ Key của chính entity này từ CERTIFICATE_RECORDS.ID (khóa kỹ thuật) sang CERTIFICATE_RECORDS.CERTIFICATE_NUMBER\
    \ (mã CCHN thật) theo yêu cầu Data Modeler — attribute \"Certificate Number\"\
    \ riêng lẻ trước đây (cùng map CERTIFICATE_NUMBER) bị gộp vào Code, không giữ\
    \ trùng lặp. Đã crosswalk 5 file FK downstream đang hash theo CERTIFICATE_RECORD_ID/PREVIOUS_CERTIFICATE_RECORD_ID\
    \ (ID kỹ thuật) sang CERTIFICATE_NUMBER — xem lld_NHNCK_ORGANIZATION_REPORTS.yaml,\
    \ lld_NHNCK_APPLICATIONS.yaml, entity_sp_license_application.yaml, lld_NHNCK_CERTIFICATE_RECORD_GROUP_MEMBERS.yaml,\
    \ lld_NHNCK_CERTIFICATE_RECORD_STATUS_HISTORIES.yaml."
