  notes: "BCV Core Object gán Common theo quy tắc mặc định. Đây là danh mục các tài\
    \ liệu (catalog liệt kê từng loại hồ sơ/tài liệu cần nộp), không phải \"loại tài\
    \ liệu\" phân loại — đặt tên Classification Document, không phải Document Type.\
    \ Nâng cấp từ Classification Value (scheme DOCUMENT_TYPE) lên entity thật — xem\
    \ NHNCK_HLD_Overview.md 7e #9. RECORD_STATUS (nguồn) loại khỏi thiết kế — trùng\
    \ ý nghĩa với IS_ACTIVE (cả hai đều 1=hoạt động/0=không hoạt động), giữ IS_ACTIVE\
    \ làm chuẩn (đổi tên từ ACTIVE theo DDL UAT 2026-07-15). CREATED_AT/UPDATED_AT/CREATED_BY/UPDATED_BY\
    \ loại khỏi thiết kế — theo đúng quy ước NHNCK (xem lld_NHNCK_CERTIFICATES.yaml,\
    \ lld_NHNCK_PROFESSIONALS.yaml), không giữ dạng pending."
