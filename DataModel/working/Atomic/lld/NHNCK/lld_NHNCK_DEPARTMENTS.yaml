  notes: "Thiết kế lại (2026-09-11) theo yêu cầu Data Modeler — tách khỏi Atomic entity\
    \ \"Regulatory Authority Organization Unit\" (dùng chung với UNITS trước đây),\
    \ map trực tiếp vào Fundamental entity dùng chung Classification Value (cl_value),\
    \ mirror pattern lld_NHNCK_APPLICATION_STATUSES.yaml. Lý do: DEPARTMENTS chỉ có\
    \ CODE + NAME + DESCRIPTION mang ý nghĩa danh mục thuần, không có instance/lifecycle\
    \ data độc lập xứng đáng 1 entity Fundamental riêng. UNIT_ID (quan hệ cha là UNITS)\
    \ không map được vào cl_value (không có chỗ chứa quan hệ phân cấp) — xem pending_design.yaml.\
    \ Entity con lld_NHNCK_CERTIFICATE_DEPARTMENTS.yaml đã cập nhật FK tương ứng (Department\
    \ Code, Classification Value, thay cho cặp Id+Code cũ). Scheme: NHNCK.DEPARTMENTS\
    \ (đăng ký trong classification_schemes.yaml). File này là Level 1 LLD; cần chạy\
    \ Level 2 consolidation (generate_entity_consolidation.py) gộp vào entity_cl_value.yaml\
    \ cùng các source khác trước khi generate ra DataModel/Atomic. 4 cột ds_* không\
    \ thiết kế ở đây — ETL job tự quản lý (SCD, không map từ cột nguồn)."
