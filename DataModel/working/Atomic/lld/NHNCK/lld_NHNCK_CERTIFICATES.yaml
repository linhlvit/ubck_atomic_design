  notes: "Thiết kế mới (2026-07-07): trước đây NHNCK.CERTIFICATES chỉ tồn tại dưới\
    \ dạng Classification Value scheme rỗng (CERTIFICATE_TYPE/NHNCK_CERTIFICATE_TYPE,\
    \ đã xóa khỏi classification_schemes.yaml). Bảng có PROCESSING_DAYS/SORT_ORDER/\
    \ DESCRIPTION nên là entity concept thật (rule 11 CLAUDE.md), không phải reference\
    \ data set thuần. Là FK target cross-source cho IAM.USERS.PRACTICE_CERTIFICATE_TYPE_ID\
    \ (xem lld_IAM_USERS.yaml) và cho 5 file NHNCK retrofit (APPLICATIONS, CERTIFICATE_RECORDS,\
    \ EXAM_DETAILS, EXAM_SESSION_FEES, ORGANIZATION_REPORTS). Hạ lại design_status\
    \ approved → draft (2026-07-13): đổi pattern Id+Code+Unique Key → Id+Code (bỏ\
    \ Unique Key, Code nay = CERTIFICATE_CODE thay vì ID) — cần review/approve lại.\
    \ Các file downstream tham chiếu Code cũ (ID-based) cần rà soát riêng. STATUS\
    \ (nguồn) không map — cùng field với RECORD_STATUS đã loại trừ theo chính sách\
    \ Data Modeler (2026-07-07), chỉ đổi tên qua DDL UAT remap 2026-07-15/20. Xem\
    \ pending_design.yaml (cập nhật lại source_column 2026-07-24). Đổi tên attribute\
    \ Certificate Name → Certificate Type Name (2026-08-04), nhất quán với Datamart\
    \ SP License Certificate Type Dimension (đã dùng tên này từ trước) — physical_name\
    \ certificate_nm → certificate_tp_nm. Hạ design_status approved → draft do sửa\
    \ sau approve — cần review/approve lại."
