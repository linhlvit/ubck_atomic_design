  notes: "STATUS (nguồn) nay đã map thành \"Status Code\" (2026-08-18) — chính sách\
    \ cũ (2026-07-07) không map RECORD_TYPE/RECORD_STATUS chỉ áp dụng cho cột mang\
    \ tính kỹ thuật thuần túy; cột STATUS này mang ý nghĩa nghiệp vụ rõ ràng nên map\
    \ Classification Value. Khác với Sync Status Code (SYNC_STATUS, đồng bộ dữ liệu\
    \ — thiết kế riêng, không gộp chung). Khảo sát nghiệp vụ 2026-08-11: BK (Securities\
    \ Organization Reference Code) đổi map từ ID (PK kỹ thuật) sang ORGANIZATION_CODE\
    \ (mã nghiệp vụ) — Id hash lại theo ORGANIZATION_CODE; Organization Code (denormalized,\
    \ nay trùng lặp) đã loại bỏ, xem pending_design.yaml; Parent self-reference chuyển\
    \ sang crosswalk PARENT_ID → ID → ORGANIZATION_CODE."
