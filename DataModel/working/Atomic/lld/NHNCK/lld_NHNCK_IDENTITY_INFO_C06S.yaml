    \ để xác nhận USERNAME sau đó hash_id('IAM_USERS', USERNAME) | Đây là FK xác nhận\
    \ thực (không phải suy luận) — khác với CREATED_BY/UPDATED_BY audit chung đã loại\
    \ khỏi thiết kế (xem pending_design.yaml). Chưa xác nhận value set khớp danh mục\
    \ IAM.USERS — cần profile dữ liệu trước go-live."
