  notes: "STATUS (nguồn) không map — theo chính sách Data Modeler (2026-07-07): không\
    \ thiết kế Atomic attribute cho RECORD_TYPE/RECORD_STATUS trên bất kỳ bảng NHNCK\
    \ nào. Đổi tên từ \"Securities Practitioner License Certificate Group Member\"\
    \ sang pattern link/relationship \"_x_\" + Table Type Fundamental → Relative theo\
    \ quyết định Data Modeler (2026-08-14, lần 3). Theo quy tắc entity \"_x_\" (Bước\
    \ 3e skill atomic-lld-design): KHÔNG còn cặp Id/Code riêng của entity — PK là\
    \ composite 2 FK Id (License Certificate Document Id + License Certificate Group\
    \ Id). ID (nguồn) không map — không cần thiết vì PK đã là composite của 2 FK.\
    \ ADDED_DATE/ADDED_BY/IS_REISSUE/REVOCATION_REASON/ORDER_INDEX bỏ khỏi thiết kế\
    \ theo yêu cầu tường minh Data Modeler (2026-08-14) — chỉ giữ 2 cặp FK Id/Code\
    \ + Source System Code như các entity link khác (xem pending_design.yaml). Điểm\
    \ cần xác nhận REVOCATION_REASON ở NHNCK_HLD_Tier4.md 6f #5 theo đó không còn\
    \ áp dụng (field đã bỏ khỏi thiết kế). [SỬA 2026-08-15] Đổi lại BCV Concept từ\
    \ \"[Documentation] Gov. Registration Document\" (2026-08-14, lần 3) sang \"[Group]\
    \ Group\" — theo quyết định Data Modeler, tái dùng concept từ phía Certificate\
    \ Group (đổi tên entity đặt Group lên trước)."
