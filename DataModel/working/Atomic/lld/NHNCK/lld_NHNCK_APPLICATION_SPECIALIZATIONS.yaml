  notes: "Hạ về draft (2026-08-17, xác nhận tường minh bởi Data Modeler) để bổ sung\
    \ trường \"Appraisal Status Code\" (cột nguồn STATUS — trước đây bị loại trừ theo\
    \ chính sách 2026-07-07, nay map Classification Value vì mang ý nghĩa nghiệp vụ\
    \ 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động; dùng lại scheme APPRAISAL_STATUS\
    \ đã đăng ký sẵn cho đúng cột này, đổi tên thành NHNCK.APPLICATION_SPECIALIZATIONS.STATUS).\
    \ Cần review/approve lại. Lịch sử trước: design_status quay lại draft (2026-07-09)\
    \ — đổi Specialization Type Code thành Classification Specialization Code + thêm\
    \ FK Classification Specialization Id. Hạ về draft (2026-07-27) để sửa lỗi hash-mismatch\
    \ FK \"Securities Practitioner License Application Id\" và \"Classification Specialization\
    \ Id\" — trước đây hash trực tiếp theo ID kỹ thuật (APPLICATION_ID/SPECIALIZATION_ID)\
    \ thay vì Code của bảng đích (APPLICATION_CODE/SPECIALIZATION_CODE). Hạ về draft\
    \ lại (2026-08-20): Classification Specialization Id + Code đổi thành 1 trường\
    \ Classification Value \"Specialization Code\" (scheme SPECIALIZATION) — do NHNCK.SPECIALIZATIONS\
    \ revert về Classification Value, không còn là Atomic entity riêng."
