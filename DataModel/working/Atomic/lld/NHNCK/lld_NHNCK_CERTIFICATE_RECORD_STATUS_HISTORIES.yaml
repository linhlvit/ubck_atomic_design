  notes: "Đưa vào scope theo quyết định Data Modeler (2026-07-24) — trước đây loại\
    \ khỏi scope dạng Audit Log nguồn (xem NHNCK_HLD_Overview.md 7f cũ). Tái dùng\
    \ BCV concept của entity cha Securities Practitioner License Certificate Document\
    \ — không có BCV term riêng cho 'status history'. Mirror pattern Securities Practitioner\
    \ Reason Change History (PROFESSIONAL_HISTORIES). Bổ sung 2026-08-06 (giữ nguyên\
    \ approved, không hạ status): thêm attribute \"Data Date\" từ CREATED_AT — bảng\
    \ là Fact Append (insert-only), CREATED_AT trước đó bị loại trừ nhầm như audit\
    \ block thuần túy; mirror amendment đã áp dụng cho lld_NHNCK_ORGANIZATION_REPORTS.yaml.\
    \ Hạ về draft (2026-08-14) để sửa lỗi hash-mismatch FK \"Securities Practitioner\
    \ License Decision Document Id\" — trước đây hash trực tiếp theo DECISION_ID (ID\
    \ kỹ thuật) thay vì Code của bảng đích (DECISION_NUMBER), đồng bộ với đổi BK trên\
    \ lld_NHNCK_DECISIONS.yaml. Hạ lại về draft (2026-08-15) để sửa lỗi hash-mismatch\
    \ tương tự trên FK \"Securities Practitioner License Certificate Document Id\"\
    \ — trước đây hash trực tiếp theo CERTIFICATE_RECORD_ID (ID kỹ thuật) thay vì\
    \ Code của bảng đích (nay đổi từ ID sang CERTIFICATE_NUMBER, đồng bộ với đổi BK\
    \ trên lld_NHNCK_CERTIFICATE_RECORDS.yaml)."
