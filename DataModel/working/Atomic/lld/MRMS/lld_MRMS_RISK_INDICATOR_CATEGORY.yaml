  notes: "Map trực tiếp vào Fundamental entity dùng chung Classification Value (cl_value)\
    \ — không tạo Atomic entity riêng, theo quyết định Data Modeler (MRMS_HLD_Tier1.md\
    \ 6f T1-01), tham khảo pattern NHNCK (lld_NHNCK_APPLICATION_SOURCES.yaml/APPLICATION_STATUSES.yaml/DOCUMENTS.yaml/SPECIALIZATIONS.yaml,\
    \ revert 2026-08-20). Scheme: MRMS_RISK_INDICATOR_CATEGORY (đăng ký trong classification_schemes.yaml,\
    \ dùng bởi Risk Indicator Category Code trên lld_MRMS_RISK_INDICATOR.yaml). File\
    \ này là Level 1 LLD; cần chạy Level 2 consolidation (generate_entity_consolidation.py)\
    \ gộp vào entity_cl_value.yaml cùng các source khác trước khi generate ra DataModel/Atomic.\
    \ SET_CODE và STATUS không có chỗ trong schema chuẩn cl_value (chỉ Code/Name/Description)\
    \ — document pending_design.yaml, không map ở đây. Audit fields (CREATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_AT/UPDATED_BY_ID/UPDATED_BY_NAME/DELETED)\
    \ không thiết kế — cl_value không có audit fields nghiệp vụ, chỉ có ds_* (technical,\
    \ ETL job tự quản lý), theo convention NHNCK."
