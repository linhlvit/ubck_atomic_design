  notes: "Giá trị thực tế của chỉ tiêu rủi ro theo từng kỳ (ngày/tháng/quý/năm). Grain:\
    \ chỉ tiêu × kỳ. FK → Classification Risk Indicator (Tier 1). BCV Core Object/Concept\
    \ = Common/[Common] Classification theo chỉ đạo Data Modeler — xem MRMS_HLD_Tier2.md\
    \ 6a; khác thiết kế tham khảo LinhLV (Transaction/Fact Append). Nguồn không có\
    \ mã nghiệp vụ riêng biệt (không có cột CODE) — dùng PK kỹ thuật ID làm BK duy\
    \ nhất, theo pattern lld_KNT_TAX_REPORT_DETAIL.yaml. Bảng nguồn có 6/9 cột technical\
    \ bundle (thiếu STATUS, VERSION) — map bình thường theo Bước 2c, xem HLD 6f T2-03.\
    \ Business key cho Upsert (Risk Indicator Id + Period Type Code + Period Date)\
    \ — xem HLD 7e #1, T2-01."
