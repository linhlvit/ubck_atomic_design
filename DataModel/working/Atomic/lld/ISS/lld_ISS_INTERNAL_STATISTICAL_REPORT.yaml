  notes: "Báo cáo định kỳ ISS (thống kê nội bộ UBCKNN): ODS ods.uat_ISS_ods.INTERNAL_STATISTICAL_REPORT\
    \ → ATM Upsert theo BK (table_type Classification — quyết định Data Modeler 2026-10-07).\
    \ Grain = 1 ô × 1 lần nộp × 1 kỳ báo cáo. Dữ liệu flatten đến từng ô biểu mẫu\
    \ (cell-level), hỗ trợ cả 3 layout: MIXED / COLUMN_BASED / ROW_BASED. BK composite:\
    \ report_code || sheet_nm || field_code || row_index || origin_dt_val."
