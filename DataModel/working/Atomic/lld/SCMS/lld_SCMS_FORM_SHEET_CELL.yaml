schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "SCMS"
  source_table: "FORM_SHEET_CELL"
  atomic_entity: "Securities Company Report Sheet Cell"
  entity_physical_name: "sc_report_sheet_cell"
  bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Form Document"
  table_type: "Relative"
  group: "T4"
  design_status: "draft"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Ô dữ liệu (cell) cụ thể trong sheet biểu mẫu báo cáo — gắn chỉ tiêu (Securities\
    \ Company Report Indicator) vào đúng vị trí hàng/cột, kèm định dạng hiển thị và\
    \ công thức tính toán. Entity Tier 4 đầu tiên của SCMS. Đảo ngược quyết định loại-scope\
    \ trước đây (cascade từ FORM_REPORT đã loại, lý do đã lỗi thời) — xem SCMS_HLD_Overview.md\
    \ 7e #23, SCMS_HLD_Tier4.md 6a. Entity Id/Code (BK) hash trực tiếp theo ID kỹ\
    \ thuật nguồn (hash_id('SCMS_FORM_SHEET_CELL', ID)) — theo quyết định Data Modeler\
    \ 2026-09-16, cùng pattern đã áp dụng cho sc_report_sheet_row/sc_report_sheet_column,\
    \ vì CELL_CODE (giống ROW_CODE/COLUMN_CODE) chỉ unique trong phạm vi 1 sheet,\
    \ không phải BK toàn cục. CELL_CODE giữ lại dạng attribute nghiệp vụ thuần (\"\
    Cell Code\", không FK, không hash) để mô tả vị trí ô (VD A1/B2). FORM_SHEET_ID\
    \ cần crosswalk sang FORM_SHEET để lấy SHEET_CODE, không hash trực tiếp theo ID\
    \ kỹ thuật. FORM_SHEET_ROW_ID/FORM_SHEET_COLUMN_ID hash trực tiếp theo ID kỹ thuật\
    \ (không cần crosswalk) — theo quyết định Data Modeler 2026-09-16 đổi cách hash\
    \ của sc_report_sheet_row/sc_report_sheet_column sang ID kỹ thuật thay vì ROW_CODE/COLUMN_CODE\
    \ (2 mã này chỉ unique trong phạm vi 1 sheet). FORM_SHEET_CELL_INPUT_ID cũng cần\
    \ crosswalk sang FORM_INDICATOR_INPUT để lấy CODE. FORM_REPORT_ID trên bảng nguồn\
    \ là FK dư thừa (denormalize từ FORM_SHEET) — không model, xem Tier4 6f T4-03/pending_design.yaml.\
    \ INDICATOR_ID — 2 cột khả nghi cùng trỏ chỉ tiêu (INDICATOR_ID vs FORM_SHEET_CELL_INPUT_ID),\
    \ mô tả gốc BRD trống cho cả 2, không tagged FK — tạm giữ INDICATOR_ID dạng Text\
    \ denormalized (không FK), FORM_SHEET_CELL_INPUT_ID là FK chính theo tên cột khớp\
    \ trực tiếp \"CELL_INPUT\" — xem Tier4 6f T4-01, cần Data Modeler xác nhận khi\
    \ có thêm thông tin. TEMPLATE_FORM_REPORT_ID (FK điều kiện, chỉ có giá trị khi\
    \ ô hiển thị ngày gửi báo cáo) — giữ plain attribute, không model FK cứng, xem\
    \ Tier4 6f T4-02. Audit block (CREATED_BY/CREATED_AT/LAST_MODIFIED_BY/LAST_MODIFIED_AT/LAST_MODIFIED_AT_ALT)\
    \ loại bỏ theo convention SCMS — LAST_MODIFIED_AT_ALT là cột trùng lặp/lịch sử\
    \ không có mô tả gốc, loại cùng nhóm audit."
