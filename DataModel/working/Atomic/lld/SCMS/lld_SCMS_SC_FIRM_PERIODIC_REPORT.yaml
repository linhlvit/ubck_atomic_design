  notes: "Mỗi dòng = 1 lần nộp báo cáo định kỳ của CTCK lên UBCKNN. Grain: (SC_FIRM_INFO_ID,\
    \ FORM_REPORT_ID, REPORT_YEAR, PERIOD). Trạng thái vòng đời: 0=Chưa gửi→1=Đã gửi→2=Đã\
    \ duyệt; hoặc -1=Từ chối/3=Bị hủy. EFORM_DATA + CBTT_EFORM_DATA excluded (raw\
    \ JSON form payload). Audit: chỉ CREATED_AT + LAST_MODIFIED_AT — không có CREATED_BY/LAST_MODIFIED_BY;\
    \ APPROVED_BY/SENDER_ID/CANCELLED_BY → pending (SYS_USER out of scope). Hạ về\
    \ draft (2026-07-27) để sửa lỗi hash-mismatch FK Securities Company Id — trước\
    \ đây hash trực tiếp theo SC_FIRM_INFO_ID (ID kỹ thuật) thay vì CODE của bảng\
    \ đích."
