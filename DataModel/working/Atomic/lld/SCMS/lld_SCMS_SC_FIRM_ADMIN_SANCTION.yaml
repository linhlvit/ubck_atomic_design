    \ cho quyết định xử phạt). Mỗi dòng = 1 biện pháp xử lý. CONTENT (NCLOB) = nội\
    \ dung chi tiết biện pháp. BIEN_PHAP_KHAC_PHUC = biện pháp khắc phục (NVARCHAR2\
    \ 2000). AMOUNT = số tiền xử phạt (NUMBER 38 không có scale — integer-like, map\
    \ Currency Amount). Audit: CREATED_BY/AT + LAST_MODIFIED_BY/AT; nguồn DATE — widening\
    \ sang Timestamp."
