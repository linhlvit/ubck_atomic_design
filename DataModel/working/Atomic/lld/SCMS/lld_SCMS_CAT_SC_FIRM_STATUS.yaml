    \ Party dù match khá tốt) để nhất quán pattern NHNCK (Classification Application\
    \ Status/Document/Specialization). BK dùng SC_FIRM_STATUS_CODE (mã nghiệp vụ chuyên\
    \ biệt); surrogate Id hash từ ID kỹ thuật (nhất quán với entity tiêu thụ FK qua\
    \ giá trị ID). Theo chỉ đạo Data Modeler (2026-07-10): map 1:1 toàn bộ cột nghiệp\
    \ vụ, không tự loại trừ vì nghi trùng lặp — CODE/ITEM_NAME/ACTIVE map thành attribute\
    \ riêng (Item Code/Item Name/Active Indicator), không coi là trùng SC_FIRM_STATUS_CODE/SC_FIRM_STATUS_NAME/RECORD_STATUS.\
    \ Audit fields (CREATED_BY/CREATED_AT) loại bỏ theo convention SCMS (không FK\
    \ target hợp lệ, SYS_USER ngoài phạm vi Atomic)."
