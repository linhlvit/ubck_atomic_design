  notes: "Nâng cấp từ Classification Value (scheme SCMS_SC_FIRM_STATUS, nay deprecated)\
    \ lên entity thật — xem SCMS_HLD_Tier1.md 6f T1-05. BCV Core Object gán Common\
    \ theo chỉ đạo Data Modeler (không dùng Organization Life Cycle Status/Involved\
    \ Party dù match khá tốt) để nhất quán pattern NHNCK (Classification Application\
    \ Status/Document/Specialization). BK dùng SC_FIRM_STATUS_CODE (mã nghiệp vụ chuyên\
    \ biệt); surrogate Id hash trực tiếp từ SC_FIRM_STATUS_CODE (đổi từ hash theo\
    \ ID kỹ thuật sang hash theo Code — theo yêu cầu tường minh Data Modeler 2026-09-16,\
    \ đúng chuẩn mặc định CLAUDE.md #3/Bước 3e). Theo chỉ đạo Data Modeler (2026-07-10):\
    \ map 1:1 toàn bộ cột nghiệp vụ, không tự loại trừ vì nghi trùng lặp — CODE/ITEM_NAME/ACTIVE\
    \ map thành attribute riêng (Item Code/Item Name/Active Indicator), không coi\
    \ là trùng SC_FIRM_STATUS_CODE/SC_FIRM_STATUS_NAME/RECORD_STATUS. Audit fields\
    \ (CREATED_BY/CREATED_AT) loại bỏ theo convention SCMS (không FK target hợp lệ,\
    \ SYS_USER ngoài phạm vi Atomic)."
