  comment: "FK target: securities_company.sc_id. Shared entity — không có PK surrogate\
    \ riêng. Cần ETL crosswalk sang SCMS.SC_FIRM_INFO: SC_FIRM_INFO.ID = SC_FIRM_INFO.ID\
    \ để xác nhận CODE sau đó hash_id('SCMS.SC_FIRM_INFO', CODE) | Trước đây hash\
    \ trực tiếp theo ID (ID kỹ thuật) gây sai lệch với Id của bảng main (hash từ\
    \ CODE) — đã sửa sang crosswalk 2026-07-27."
