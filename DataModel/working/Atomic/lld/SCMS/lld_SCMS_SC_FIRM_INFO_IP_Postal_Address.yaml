  notes: "Shared entity IP Postal Address — extend từ SC_FIRM_INFO. Grain: 1 địa chỉ\
    \ trụ sở chính (HEAD_OFFICE). SC_FIRM_INFO có PROVINCE_ID (FK CAT_PROVINCE), DISTRICT_ID\
    \ (FK CAT_DISTRICT), WARD_ID (FK CAT_WARD) → map về Geographic Area FK pairs (Province/District/Ward\
    \ Id + Code). District/Ward Name denormalized thêm để tiện query không cần join\
    \ CAT_DISTRICT/CAT_WARD. Format đồng bộ theo chuẩn NHNCK."
