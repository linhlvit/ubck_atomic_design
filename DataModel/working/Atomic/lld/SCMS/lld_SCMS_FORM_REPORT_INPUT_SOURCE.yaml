  notes: "Ánh xạ biểu mẫu báo cáo gộp (canonical) sang nguồn đọc dữ liệu khai thác/cảnh\
    \ báo, kèm phạm vi kỳ áp dụng và độ ưu tiên khi trùng CTCK + kỳ báo cáo. Bảng\
    \ chưa được khảo sát vào BRD trước đây — cấu trúc cột trích từ DDL UAT (Source/DDL\
    \ UAT 1/SCMS_UAT_schema.txt), bổ sung BRD và thiết kế Atomic 2026-09-16 — xem\
    \ SCMS_HLD_Overview.md 7e #23, SCMS_HLD_Tier2.md 6a. Không có mã nghiệp vụ tự\
    \ nhiên trong nguồn — BK dùng ID kỹ thuật trực tiếp, cùng pattern Securities Company\
    \ Report Input Submission/Alert Run. CANONICAL_FORM_REPORT_ID/SOURCE_FORM_REPORT_ID\
    \ đều hash trực tiếp (Code của Securities Company Report = ID kỹ thuật nguồn)\
    \ — không cần crosswalk. Data change mode nguồn chưa xác định rõ (bảng mới khảo\
    \ sát từ DDL, không có thông tin ingestion) — cần Data Modeler/ETL xác nhận trước\
    \ go-live."
