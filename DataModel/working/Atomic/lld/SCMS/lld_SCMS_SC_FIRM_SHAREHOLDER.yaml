metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_SHAREHOLDER"
  atomic_entity: "Securities Company Shareholder"
  entity_physical_name: "securities_company_shareholder"
  bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Shareholder"
  table_type: "Relative"
  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Cổ đông của CTCK (cá nhân hoặc tổ chức). Mỗi dòng = 1 cổ đông. Địa chỉ tách\
    \ IP Postal (CURRENT_ADDRESS=CURRENT, HOUSEHOLD_REGISTRATION=HOUSEHOLD_REGISTRY).\
    \ Liên lạc tách IP Electronic (PHONE, EMAIL). Giấy tờ tách IP Alt Identification\
    \ (ID_NUMBER=NATIONAL_ID). SC_FIRM_PERSONNEL_ID: FK mềm đến Securities Company\
    \ Senior Personnel (nullable — cổ đông có thể không phải nhân sự cao cấp). PRACTITIONER_LEGACY_ID:\
    \ ID tham chiếu hệ thống cũ (legacy), lưu dạng Text. CONTROLLING_SHAREHOLDER:\
    \ NVARCHAR2(40) — tên/mã cổ đông kiểm soát, lưu dạng Text. SHAREHOLDER_ENTITY_TYPE:\
    \ phân loại cổ đông chi tiết hơn INDIVIDUAL. NATIONALITY_ID → pending. Audit:\
    \ CREATED_BY/AT + LAST_MODIFIED_BY/AT (canonical, TIMESTAMP(6))."
