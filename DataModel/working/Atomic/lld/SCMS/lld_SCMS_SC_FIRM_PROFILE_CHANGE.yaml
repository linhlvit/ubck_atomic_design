schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_PROFILE_CHANGE"
  atomic_entity: "Securities Company Profile Change"
  entity_physical_name: "sc_profile_change"
  bcv_core_object: "Event"
  bcv_concept: "[Event] Business Activity"
  table_type: "Fact Append"
  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Lịch sử thay đổi hồ sơ CTCK — mỗi dòng = 1 lần thay đổi. Fact Append (insert-only).\
    \ FK → Securities Company (SC_FIRM_INFO_ID). ENTITY_TYPE: loại đối tượng bị thay\
    \ đổi (CTCK/CHI_NHANH/PHONG_GIAO_DICH/VPDD/NHAN_SU/CO_DONG). ENTITY_ID: ID của\
    \ đối tượng (polymorphic — không resolve FK vì tuỳ ENTITY_TYPE). EVENT_TYPE_ID:\
    \ FK → CAT_EVENT_TYPE (out of scope → pending). BEFORE_INFO/AFTER_INFO (NCLOB):\
    \ snapshot text trước/sau thay đổi — lưu dạng Text (truncate risk ở Atomic nếu\
    \ quá dài, cần xác nhận). AFTER_DATA_JSON (NCLOB): JSON → EXCLUDED. SO_GP_QD_CV:\
    \ số giấy phép/quyết định/công văn. CO_VB_CHAP_THUAN: Boolean (có văn bản chấp\
    \ thuận). PERFORMED_BY: người thực hiện thay đổi → pending (SYS_USER). Không có\
    \ CREATED_AT/LAST_MODIFIED_AT — chỉ có EXECUTION_TIME là timestamp sự kiện."
