  notes: "Báo cáo định kỳ gửi bởi Văn phòng đại diện nước ngoài của CTCK lên cơ quan\
    \ quản lý. Cấu trúc giống hệt SC_FIRM_FOREIGN_BRANCH_PERIODIC_REPORT nhưng FK\
    \ về Securities Company Foreign Representative Office (T2) thay vì Foreign Branch.\
