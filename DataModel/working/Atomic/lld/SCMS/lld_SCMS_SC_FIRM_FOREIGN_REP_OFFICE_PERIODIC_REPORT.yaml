    \ Office (T2). EVENT_TYPE_ID: FK đến CAT_EVENT_TYPE nằm ngoài scope → pending.\
    \ CANCELLED_BY: FK đến SYS_USER nằm ngoài scope → pending. RECORD_STATUS → SCMS_REPORT_SUBMISSION_STATUS.\
    \ SUBMISSION_DEADLINE (DATE) + SUBMISSION_DEADLINE_AT (TIMESTAMP 0): map cả hai.\
    \ Bảng nguồn không có trường CREATED_AT/BY/LAST_MODIFIED — không có audit block\
    \ chuẩn."
