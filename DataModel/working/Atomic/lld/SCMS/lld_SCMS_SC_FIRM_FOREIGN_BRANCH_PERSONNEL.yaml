  notes: "SC_FIRM_FOREIGN_BRANCH_PERSONNEL → Securities Company Foreign Branch Personnel.\
    \ Nhân sự tại chi nhánh CTCK nước ngoài tại Việt Nam. Đưa lại vào scope Tier 2\
    \ sau khi resolve mâu thuẫn Append/SCD4A (SCMS_HLD_Overview.md mục 7e #10) — table_type\
    \ đổi thành Fundamental. FK đến Securities Company Foreign Branch. Có trường cá\
    \ nhân (NATIONAL_ID/ISSUE_PLACE/ID_ISSUED_DATE → IP Alt Identification; ADDRESS/PERMANENT_ADDRESS\
    \ → IP Postal Address; PHONE/EMAIL/DISCLOSURE_EMAIL → IP Electronic Address).\
    \ Nguồn chỉ có CREATED_AT — không có CREATED_BY/UPDATED_AT/UPDATED_BY (xem pending_design.yaml)."
