  notes: "6 bảng nguồn (SC_FIRM_BRANCH, SC_FIRM_REP_OFFICE, SC_FIRM_TRANSACTION_OFFICE,\
    \ SC_FIRM_DOMESTIC_REP_OFFICE, SC_FIRM_FOREIGN_REP_OFFICE, SC_FIRM_FOREIGN_REP_OFFICE_VN)\
    \ → 1 Atomic entity Securities Company Organization Unit. Organization Unit Type\
    \ Code (SCMS_ORG_UNIT_TYPE) phân biệt loại. SC_FIRM_BRANCH là BRANCH. ADDRESS/PHONE/FAX/EMAIL/WEBSITE\
    \ → lld_SCMS_SC_FIRM_BRANCH_IP_Postal_Address.yaml và lld_SCMS_SC_FIRM_BRANCH_IP_Electronic_Address.yaml.\
    \ RECORD_STATUS (0/1) khác BRANCH_STATUS (FK CAT_SC_FIRM_STATUS). NGAY_SUA/NGUOI_SUA_ID\
    \ là legacy duplicate của LAST_MODIFIED_AT/LAST_MODIFIED_BY — dùng canonical làm\
    \ source."
