  notes: "Quan hệ sở hữu của CTCK với các công ty liên quan (công ty mẹ, công ty con,\
    \ công ty liên kết, sở hữu trên 5%). Mỗi dòng = 1 quan hệ sở hữu của CTCK với\
    \ 1 tổ chức khác. COMPANY_NAME là tên tổ chức có quan hệ sở hữu (denormalized\
    \ text). REGISTERED_ADDRESS → IP Postal Address (1 loại: REGISTERED). ENTERPRISE_TYPE_ID:\
    \ pending (FK tới loại hình doanh nghiệp, ngoài scope). COUNTRY_ID: pending (FK\
    \ tới danh mục quốc gia, ngoài scope). OWNERSHIP_RATIO → Percentage. Audit: CREATED_BY/AT\
    \ + LAST_MODIFIED_BY/AT (canonical)."
