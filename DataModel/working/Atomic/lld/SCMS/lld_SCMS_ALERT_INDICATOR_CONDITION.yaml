  comment: "FK target: sc_alert_indicator.sc_alert_indicator_id. Cần ETL crosswalk\
    \ sang SCMS.ALERT_INDICATOR: ALERT_INDICATOR_CONDITION.ALERT_INDICATOR_ID = ALERT_INDICATOR.ID\
    \ để xác nhận ALERT_CODE sau đó hash_id('SCMS.ALERT_INDICATOR', ALERT_CODE) |\
    \ Trước đây hash trực tiếp theo ALERT_INDICATOR_ID (ID kỹ thuật) gây sai lệch\
    \ với Id của bảng main (hash từ ALERT_CODE) — đã sửa sang crosswalk 2026-07-27."
