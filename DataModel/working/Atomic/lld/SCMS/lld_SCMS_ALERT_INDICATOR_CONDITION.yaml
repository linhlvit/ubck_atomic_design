  notes: "Điều kiện kích hoạt cảnh báo cho từng chỉ tiêu cảnh báo. Mỗi dòng = 1 điều\
    \ kiện cụ thể cho 1 Alert Indicator. FK → ALERT_INDICATOR (T1 entity). NGAY_SUA/NGUOI_SUA_ID:\
    \ legacy audit fields (tiếng Việt) — bảng có cả bộ CREATED_AT/BY + LAST_MODIFIED_AT/BY\
    \ chuẩn lẫn legacy NGAY_SUA/NGUOI_SUA. Map cả hai. OPERATOR/OPERATOR_2: toán tử\
    \ so sánh (>, <, =...). GIA_TRI_SO_SANH (NUMBER no scale): giá trị so sánh nguyên.\
    \ SCORE/ITEM_VALUE/VALUE_2 (NUMBER 38,2): các giá trị số thập phân. SEVERITY →\
    \ SCMS_VIOLATION_SEVERITY. COMPARISON_VALUE_TYPE → SCMS_COMPARISON_VALUE_TYPE\
    \ (new). SORT_ORDER (NUMBER 10): thứ tự sắp xếp."
