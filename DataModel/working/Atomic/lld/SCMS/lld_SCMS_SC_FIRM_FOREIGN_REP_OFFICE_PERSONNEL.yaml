  notes: "SC_FIRM_FOREIGN_REP_OFFICE_PERSONNEL → Securities Company Foreign Representative\
    \ Office Personnel. Nhân sự tại VPĐD CTCK nước ngoài tại Việt Nam. Đưa lại vào\
    \ scope Tier 2 cùng lý do với Securities Company Foreign Branch Personnel (xem\
    \ SCMS_HLD_Overview.md mục 7e #10). FK đến Securities Company Organization Unit\
    \ (extend từ SC_FIRM_FOREIGN_REP_OFFICE). Có trường cá nhân (NATIONAL_ID/ISSUE_PLACE/ID_ISSUED_DATE\
    \ → IP Alt Identification; PERMANENT_ADDRESS → IP Postal Address; PHONE/EMAIL\
    \ → IP Electronic Address). Nguồn có đủ CREATED_BY/CREATED_AT/LAST_MODIFIED_BY/LAST_MODIFIED_AT\
    \ — map đủ audit block chuẩn."
