  notes: "SC_FIRM_FOREIGN_BRANCH → entity riêng Securities Company Foreign Branch\
    \ (entity name phân biệt trong prefix). BCV: [Involved Party] Branch — chi nhánh\
    \ CTCK nước ngoài hoạt động tại Việt Nam (khác Organization Unit là chi nhánh\
    \ nội địa). Có PARENT_COMPANY_* fields. LNK_SC_FIRM_FOREIGN_BRANCH_SERVICE (junction\
    \ dịch vụ) → denormalize thành Service Type Codes Array<Text>. FORM_DATA_JSON\
    \ loại khỏi scope. ADDRESS/PHONE/FAX/EMAIL → IP Postal + IP Electronic (không\
    \ có PROVINCE_ID nên chỉ Street Address text). ALLOCATED_CAPITAL → Currency Amount."
