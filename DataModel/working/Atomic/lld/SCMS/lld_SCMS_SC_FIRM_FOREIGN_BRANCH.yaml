  notes: "SC_FIRM_FOREIGN_BRANCH → Securities Company Foreign Organization Unit (gộp\
    \ cùng SC_FIRM_FOREIGN_REP_OFFICE, thiết kế tương tự Securities Company Organization\
    \ Unit; đổi từ entity riêng Securities Company Foreign Branch theo yêu cầu Data\
    \ Modeler 2026-10-10). Organization Unit Type Code hardcode: FOREIGN_BRANCH. BCV:\
    \ [Involved Party] Branch — chi nhánh CTCK nước ngoài hoạt động tại Việt Nam.\
    \ Có PARENT_COMPANY_* fields. RECORD_STATUS (nguồn mô tả: ID danh mục CAT_SC_FIRM_STATUS)\
    \ → Classification Securities Company Firm Status, crosswalk lấy SC_FIRM_STATUS_CODE\
    \ (trước đây map Record Status Code scheme SCMS_USAGE_STATUS). COUNTRY → FK Geographic\
    \ Area (COUNTRY), crosswalk qua SCMS.CAT_NATIONALITY. LNK_SC_FIRM_FOREIGN_BRANCH_SERVICE\
    \ → entity quan hệ riêng (không còn denormalize Array). FORM_DATA_JSON loại khỏi\
    \ scope. ADDRESS/PHONE/FAX/EMAIL → IP Postal + IP Electronic (không có PROVINCE_ID\
    \ nên chỉ Street Address text). ALLOCATED_CAPITAL → Currency Amount."
