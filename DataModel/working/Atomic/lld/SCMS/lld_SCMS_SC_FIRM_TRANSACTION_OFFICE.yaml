  notes: "SC_FIRM_TRANSACTION_OFFICE → Securities Company Organization Unit. Organization\
    \ Unit Type Code hardcode: TRANSACTION_OFFICE. FULL_NAME + TRANSACTION_OFFICE_NAME\
    \ là 2 tên cần xác nhận. SO_QUYET_DINH/NGAY_QUYET_DINH là tên cột cũ (Vietnamese)\
    \ cho quyết định; DECISION_NUMBER/DECISION_DATE là tên mới. SC_FIRM_TRANSACTION_ID\
    \ (mô tả rỗng) — có thể là self-ref nhưng không chắc. FORM_DATA_JSON loại khỏi\
    \ scope. NGAY_SUA/NGUOI_SUA_ID là legacy duplicate audit. ADDRESS/PHONE/FAX →\
    \ IP Postal + IP Electronic."
