  notes: "Nâng cấp từ Classification Value (scheme SCMS_POSITION_TYPE, nay deprecated)\
    \ lên entity thật theo yêu cầu Data Modeler (2026-10-08), cùng pattern Classification\
    \ Securities Company Firm Status. BCV Core Object gán Common, BCV Concept dùng\
    \ `[Common] Position` nhất quán Classification FMS Job (BCV term gần nhất `Employment\
    \ Position Type` id 11300, category Involved Party — không dùng để giữ nhất quán\
    \ pattern Classification-naming). BK dùng POSITION_CODE; surrogate Id hash trực\
    \ tiếp từ POSITION_CODE (theo yêu cầu Data Modeler). Chỉ map 8 cột theo chỉ đạo:\
    \ POSITION_GROUP, POSITION_CODE, POSITION_NAME, NOTE, REPRESENTATIVE, BOARD_MEMBER,\
    \ BRANCH_DIRECTOR, ECATALOG_ID. Không map ID (PK kỹ thuật), RECORD_STATUS, CREATED_BY,\
    \ CREATED_AT (audit loại bỏ theo convention SCMS — SYS_USER ngoài phạm vi Atomic)."
