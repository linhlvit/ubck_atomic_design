  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Kế hoạch kiểm tra/thanh tra CTCK. Mỗi dòng = 1 đợt kiểm tra/thanh tra. RECORD_TYPE:\
    \ loại hoạt động (KIEM_TRA/THANH_TRA → SCMS_INSPECTION_TYPE). FORM_TYPE và INSPECTION_TYPE\
    \ cùng values DINH_KY/DOT_XUAT — có thể trùng nhau, cần xác nhận sau khi profile;\
    \ map riêng cùng scheme SCMS_INSPECTION_FORM_TYPE. FROM_DATE/TO_DATE = thời gian\
    \ thực hiện đoàn kiểm tra. PERIOD_FROM_DATE/PERIOD_TO_DATE = giai đoạn được kiểm\
    \ tra. INSPECTION_TEAM_JSON (CLOB) excluded. CONCLUSION_SUMMARY và RECOMMENDATIONS\
    \ (NCLOB) = kết luận và kiến nghị. CONTENT (NCLOB) = nội dung kiểm tra. INSPECTOR_NAME\
    \ và TEAM_LEADER là tên denormalized. Audit: CREATED_BY/AT + LAST_MODIFIED_BY/AT;\
    \ nguồn DATE — widening sang Timestamp."
