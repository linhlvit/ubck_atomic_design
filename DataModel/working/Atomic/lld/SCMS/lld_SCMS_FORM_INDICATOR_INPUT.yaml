  notes: "Định nghĩa 1 chỉ tiêu/trường dữ liệu có thể gắn vào ô (cell) của biểu mẫu\
    \ báo cáo — mã, tên, kiểu dữ liệu, nguồn giá trị tham chiếu. Đảo ngược quyết định\
    \ loại-scope trước đây (cascade từ FORM_REPORT đã loại, lý do đã lỗi thời) — xem\
    \ SCMS_HLD_Overview.md 7e #23, SCMS_HLD_Tier1.md 6a/6f T1-14. BCV Core Object\
    \ = Documentation (không dùng Business Activity dù có tiền lệ Risk/Alert Indicator\
    \ trong SCMS) theo chỉ đạo Data Modeler. Table Type = Relative là NGOẠI LỆ tường\
    \ minh — bảng không có FK nghiệp vụ rõ ràng đến 1 Fundamental khác còn trong scope\
    \ (REFERENCE_CATALOG_ID→FORM_INDICATOR_REFERENCE_VALUE và FIELD_METADATA_ID→FORM_INDICATOR_FIELD_META\
    \ đều trỏ bảng ngoài scope), cùng pattern ngoại lệ đã ghi nhận cho Classification\
    \ Securities Company Event Type/Securities Company Report (xem Tier1 6f T1-07).\
    \ REFERENCE_CATALOG_ID/FIELD_METADATA_ID không model làm FK Atomic (bảng đích\
    \ ngoài scope) — giữ dạng Text denormalized, không resolve/hash, cùng pattern\
    \ Primary Source Api Id trên Securities Company Report. Audit block (CREATED_BY/CREATED_AT/UPDATED_BY/LAST_MODIFIED_AT)\
    \ loại bỏ theo convention SCMS (cùng quyết định áp dụng cho FORM_REPORT/CAT_EVENT_TYPE)."
