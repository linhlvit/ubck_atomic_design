  notes: "Cấu hình sâu (deep config) của biểu mẫu báo cáo (Securities Company Report)\
    \ — chỉ map 3 cột theo chỉ đạo Data Modeler (2026-10-06): ID, FORM_REPORT_ID,\
    \ SHEETS_JSON. 5 cột còn lại (EFORM_SCHEMA_JSON, EXCEL_CONFIG_JSON, EFORM_RUNTIME_MANIFEST_JSON,\
    \ CREATED_AT, LAST_MODIFIED_AT) chủ động không đưa lên Atomic. SHEETS_JSON (NCLOB)\
    \ lưu nguyên dạng text; nếu cần parse thành cấu trúc sheet phải xác nhận định\
    \ dạng JSON trước (tham chiếu entity Securities Company Report Sheet). Grain:\
    \ 1 dòng cấu hình / 1 biểu mẫu (cần xác nhận quan hệ 1:1 hay 1:N với FORM_REPORT).\
    \ BCV Documentation/Form Document như các entity FORM_SHEET*."
