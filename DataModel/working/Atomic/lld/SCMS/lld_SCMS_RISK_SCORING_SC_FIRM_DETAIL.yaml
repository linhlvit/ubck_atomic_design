  notes: "Chi tiết điểm từng chỉ tiêu rủi ro trong kỳ chấm điểm (CAMEL). Mỗi dòng\
    \ = 1 chỉ tiêu rủi ro trong 1 kỳ báo cáo của 1 CTCK. FKs: SC_FIRM_INFO_ID→Securities\
    \ Company (T1); RISK_INDICATOR_ID→Securities Company Risk Indicator (T1, status:\
    \ draft); RISK_SCORING_SCALE_ID→Securities Company Risk Indicator Scoring Scale\
    \ (T2, status: draft); RISK_REPORTING_PERIOD_ID→Securities Company Risk Reporting\
    \ Period (T1, status: draft). RISK_SCORING_SC_FIRM_ID (NUMBER 10): null key/desc\
    \ → tham chiếu mềm đến bản tổng hợp điểm (RISK_SCORING_SC_FIRM entity) — lưu dạng\
    \ Text. RISK_INDICATOR_GROUP_ID: FK đến RISK_INDICATOR_GROUP nằm ngoài scope →\
    \ pending. RECORD_TYPE (NVARCHAR2 20): nhóm CAMEL (C/A/M/E/L) → SCMS_CAMEL_GROUP_TYPE.\
    \ IMPLEMENTATION_METHOD (NUMBER 1): 1=Lấy từ QLRR chỉ tiêu; 0=Nhập tay. FORMULA_TEXT\
    \ (CLOB): văn bản mô tả công thức cho người dùng — giữ. FORMULA/SUM_FORMULA (CLOB):\
    \ công thức tính toán dạng code — EXCLUDED. Audit: canonical 6-attr (all BY pending)."
