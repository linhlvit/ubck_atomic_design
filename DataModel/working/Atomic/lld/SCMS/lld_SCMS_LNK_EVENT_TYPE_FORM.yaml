  notes: "Quy định biểu mẫu báo cáo nào bắt buộc nộp cho loại sự kiện nào, trong khoảng\
    \ thời gian nào (APPLICABLE_FROM/APPLICABLE_TO, REQUIRED). Đảo ngược quyết định\
    \ loại-scope trước đây (cascade từ FORM_REPORT đã loại, lý do đã lỗi thời) — xem\
    \ SCMS_HLD_Overview.md 7e #23, SCMS_HLD_Tier2.md 6a/6f T1-14. Đặt tên theo pattern\
    \ `_x_ Relationship` — tham khảo NHNCK APPLICATION_DECISIONS và tiền lệ SCMS LNK_SC_FIRM_SERVICE.\
    \ **[XÁC NHẬN 2026-09-16 — Data Modeler]** Không cần Id/Code riêng cho entity —\
    \ dùng composite PK 2 FK (cùng pattern LNK_SC_FIRM_SERVICE), không map ID kỹ thuật\
    \ nguồn thành BK riêng. Không có mã nghiệp vụ tự nhiên trong nguồn cho 2 FK — BK\
    \ = cặp (EVENT_TYPE_ID, FORM_REPORT_ID). EVENT_TYPE_ID hash trực tiếp (Classification\
    \ Securities Company Event Type Code = mã nghiệp vụ EVENT_TYPE_CODE, không phải\
    \ ID kỹ thuật — cần crosswalk). FORM_REPORT_ID hash trực tiếp (Code của Securities\
    \ Company Report = ID kỹ thuật nguồn) — không cần crosswalk. Không có cột audit\
    \ (CREATED_AT/CREATED_BY/UPDATED_AT/UPDATED_BY) trong nguồn."
