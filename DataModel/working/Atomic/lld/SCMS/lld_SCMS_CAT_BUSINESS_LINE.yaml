  notes: "Nâng cấp từ Classification Value (scheme SCMS_BUSINESS_LINE, nay deprecated)\
    \ lên entity thật — xem SCMS_HLD_Overview.md #55 và SCMS_HLD_Tier1.md 6f T1-09\
    \ / 7e #16. PK kỹ thuật ID loại khỏi model hoàn toàn — BK dùng BUSINESS_LINE_CODE,\
    \ Id hash từ chính BUSINESS_LINE_CODE theo rule 3e hiện hành (2026-07-13), khác\
    \ với Classification SCMS Firm Status (hash từ ID kỹ thuật, quyết định cũ trước\
    \ rule 3e). ID vẫn cần cho ETL resolve FK phía consumer đang lưu ID kỹ thuật.\
    \ SC_FIRM_LICENSED_PRACTITIONER.BUSINESS_LINE_ID đã đổi sang cặp FK Classification\
    \ SCMS Business Line Id+Code (xem lld_SCMS_SC_FIRM_LICENSED_PRACTITIONER.yaml).\
    \ Còn lại LNK_SC_FIRM_BUSINESS_LINE.BUSINESS_LINE_ID và LNK_PRACTITIONER_BUSINESS_LINE.BUSINESS_LINE_ID\
    \ (2 bảng junction riêng, chưa có LLD) cần thiết kế/đổi sang cặp FK Id+Code khi\
    \ thiết kế LLD Tier tiếp theo. CREATED_BY/CREATED_AT loại bỏ theo convention SCMS\
    \ đã áp dụng cho CAT_SC_FIRM_STATUS/CAT_SERVICE/ CAT_NATIONALITY (CREATED_BY không\
    \ có FK target hợp lệ, SYS_USER ngoài phạm vi Atomic) — xem pending_design.yaml.\
    \ RECORD_STATUS dùng scheme SCMS_CLASSIFICATION_BUSINESS_LINE_RECORD_STATUS đã\
    \ pre-đăng ký sẵn trong classification_schemes.yaml. LEGAL_CAPITAL (mô tả gốc\
    \ BRD trống) map theo mô tả nghiệp vụ tại HLD Overview #55 (\"vốn pháp định tối\
    \ thiểu theo quy định pháp luật\") — Currency Amount, cần profile xác nhận đơn\
    \ vị/scale trước go-live."
