metadata:
  source_system: "SCMS"
  source_table: "DISCLOSURE_SECURITIES_OFFERING_RESULT"
  atomic_entity: "Securities Company Disclosure Securities Offering Result"
  entity_physical_name: "sc_disclosure_securities_offering_result"
  bcv_core_object: "Event"
  bcv_concept: "[Event] Communication"
  table_type: "Relative"
  group: "T3"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: "2026-11-20"
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Kết quả/kế hoạch chào bán chứng khoán theo từng phương thức × đối tượng chào bán. Bảng ODS ods_scms_disclosure_securities_offering_result (không có BRD — bóc từ mảng JSON RESULT_JSON, fallback PLAN_JSON cho duKienTuNgay/duKienDenNgay, của SCMS.DISCLOSURE_SECURITIES_OFFERING; mọi trường JSON lưu STRING raw ở ODS, ép kiểu ở lớp Atomic). Mỗi dòng = 1 phần tử mảng; BK = id || pj_offering_target_code || pj_offering_method_code (đổi từ rj_ sang pj_ ngày 2026-11-20 theo Data Modeler) (Data Modeler 2026-11-19; code SQL do Data Modeler cung cấp chỉ tham khảo). [2026-11-20] Map lại theo DDL ODS + DDL Atomic (ddl_atm) mới của Data Modeler: (1) source_columns đồng bộ tên cột ODS hiện hành (offering_target_code, offering_method_code, par_value, expected_start_date/expected_end_date, foreign_investor_issuance_value); (2) Atomic tách 2 bộ cột theo JSON gốc — rj_* (result_json, 17 trường, nguồn ODS) và pj_* (plan_json, 9 trường) — attribute đặt tên logic 'RJ …'/'PJ …' (physical_name rj_*/pj_*, giữ nguyên tiền tố, không thêm dictionary viết tắt); (3) [cập nhật 2026-11-20 21:59] ODS DDL đã có đủ 17 cột rj_* + 9 cột pj_* — source_columns của 26 attribute rj_*/pj_* map 1-1 theo tên cột ODS (RJ_*/PJ_*; ODS đổi tên par_value, planned_price_amount, actual_price_amount, actual_value_amount, expected_*_date, foreign_investor_issuance_value); 9 attribute pj_* đã về draft; BK + hash Id lấy từ cột pj_ của ODS; pj_ không có cột ngày dự kiến; (4) data_type giữ theo Data Domain (decimal(23,2)/bigint/int) — khác DDL ATM (decimal(38,10)/decimal(38,0)), cần Data Modeler xác nhận. Hạ approved → draft do nội dung đổi. physical_name sinh theo quy tắc B. Cấu hình (Relative/SCD2, BCV Communication, Domain Prefix Securities Company) giống entity cha sc_disclosure_securities_offering. Technical fields ds_* không khai báo trong LLD — theo cùng convention entity cha (ETL macro SCD2 tự quản lý). ODS giữ thêm ds_snpst_dt/ds_etl_pcs_tms là cột kỹ thuật tầng ODS, không map lên Atomic."
