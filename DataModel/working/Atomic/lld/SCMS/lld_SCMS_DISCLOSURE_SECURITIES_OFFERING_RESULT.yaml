  notes: "Kết quả/kế hoạch chào bán chứng khoán theo từng phương thức × đối tượng chào bán. Bảng ODS ods_scms_disclosure_securities_offering_result (không có BRD — bóc từ mảng JSON RESULT_JSON, fallback PLAN_JSON cho duKienTuNgay/duKienDenNgay, của SCMS.DISCLOSURE_SECURITIES_OFFERING; mọi trường JSON lưu STRING raw ở ODS, ép kiểu ở lớp Atomic). Mỗi dòng = 1 phần tử mảng; BK = id || offering_target || offering_method (Data Modeler 2026-11-19; code SQL do Data Modeler cung cấp chỉ tham khảo). Tên cột đồng bộ theo DDL ODS (Data Modeler 2026-11-19), physical_name sinh theo quy tắc B. Cấu hình (Relative/SCD2, BCV Communication, Domain Prefix Securities Company) giống entity cha sc_disclosure_securities_offering. Technical fields ds_* không khai báo trong LLD — theo cùng convention entity cha (ETL macro SCD2 tự quản lý). ODS giữ thêm ds_snpst_dt/ds_etl_pcs_tms là cột kỹ thuật tầng ODS, không map lên Atomic."
