  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "SC_FIRM_LICENSED_PRACTITIONER → entity Fundamental độc lập, KHÔNG extend\
    \ entity Securities Practitioner (NHNCK.PROFESSIONALS). Sửa lại 2026-07-09 theo\
    \ yêu cầu Data Modeler — 2 bảng khác nguồn, khác BK, khác bộ thuộc tính nghiệp\
    \ vụ. Người hành nghề chứng khoán tại CTCK theo dữ liệu SCMS. SCMS thêm: quan\
    \ hệ với CTCK/đơn vị, trạng thái việc làm, xác minh CCHN với NHNCK, sync status.\
    \ Nhiều trường tiếng Việt (HOTEN, SOCMT, GIOITINH...) là legacy từ hệ thống cũ,\
    \ trùng với cột tiếng Anh mới hơn cùng bảng SCMS. NHN_ID là bridge tham chiếu\
    \ chéo hệ thống đến Securities Practitioner (NHNCK) — không phải PK chung, chỉ\
    \ là FK nullable khi đối chiếu được. Shared IP entities: DIACHITHUONGTRU/PERMANENT_ADDRESS\
    \ → IP Postal (2 types: PERMANENT, HOUSEHOLD_REGISTRY); DIENTHOAI/DIDONG/EMAIL\
    \ → IP Electronic; NATIONAL_ID/SOCMT → IP Alt Identification."
