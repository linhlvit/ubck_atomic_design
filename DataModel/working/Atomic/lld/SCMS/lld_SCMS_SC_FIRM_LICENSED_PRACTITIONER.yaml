schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_LICENSED_PRACTITIONER"
  atomic_entity: "Securities Company Practitioner"
  entity_physical_name: "sc_practitioner"
  bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual"
  table_type: "Fundamental"
  group: "T2"
  design_status: "draft"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "SC_FIRM_LICENSED_PRACTITIONER → entity Fundamental độc lập, KHÔNG extend\
    \ entity Securities Practitioner (NHNCK.PROFESSIONALS). Sửa lại 2026-07-09 theo\
    \ yêu cầu Data Modeler — 2 bảng khác nguồn, khác BK, khác bộ thuộc tính nghiệp\
    \ vụ. Người hành nghề chứng khoán tại CTCK theo dữ liệu SCMS. SCMS thêm: quan\
    \ hệ với CTCK/đơn vị, trạng thái việc làm, xác minh CCHN với NHNCK, sync status.\
    \ Nhiều trường tiếng Việt (HOTEN, SOCMT, GIOITINH...) là legacy từ hệ thống cũ,\
    \ trùng với cột tiếng Anh mới hơn cùng bảng SCMS. NHN_ID là bridge tham chiếu\
    \ chéo hệ thống đến Securities Practitioner (NHNCK) — không phải PK chung, chỉ\
    \ là FK nullable khi đối chiếu được. Shared IP entities: DIACHITHUONGTRU/PERMANENT_ADDRESS\
    \ → IP Postal (2 types: PERMANENT, HOUSEHOLD_REGISTRY); DIENTHOAI/DIDONG/EMAIL\
    \ → IP Electronic; NATIONAL_ID/SOCMT → IP Alt Identification. BUSINESS_LINE_ID\
    \ (nguồn VARCHAR2(100), list SERVICE_ID phân tách) map thành Array<Text> \"Licensed\
    \ Service Codes\" — KHÔNG thiết kế cặp Id/Code theo quyết định tường minh Data\
    \ Modeler (xem SCMS_HLD_Tier1.md 6f T1-11, 2026-09-12). CAT_BUSINESS_LINE (và\
    \ CAT_SERVICE) đã deprecated/gỡ bỏ LLD (2026-09-17) — gộp vào Classification Securities\
    \ Company Firm Service (CAT_SERVICE_LEGAL_CAPITAL). NATIONALITY_ID (2026-09-18):\
    \ đổi FK target từ cl_nationality sang geographic_area (type=COUNTRY), crosswalk\
    \ qua SCMS.CAT_NATIONALITY để lấy NATIONALITY_CODE trước khi hash_id('ECAT_COUNTRY',\
    \ ...) — nhất quán với pattern Nationality dùng ở NHNCK/FMS/GSGD."
