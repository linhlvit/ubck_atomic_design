  notes: "Lần nộp dữ liệu báo cáo đầu vào (eForm) gắn với 1 biểu mẫu báo cáo (Securities\
    \ Company Report). Đảo ngược quyết định loại-scope trước đây (nhóm UI Metadata)\
    \ — xem SCMS_HLD_Overview.md 7e #22, SCMS_HLD_Tier2.md 6a/6f T2-13/14/15. Không\
    \ có mã nghiệp vụ tự nhiên (chỉ có ID kỹ thuật) — BK dùng ID kỹ thuật trực tiếp,\
    \ cùng pattern với Securities Company Alert Run/Alert Violation. FORM_REPORT_ID\
    \ model đúng cặp FK chuẩn Id+Code (Rule 3 CLAUDE.md), nhất quán với LLD thật của\
    \ Securities Company Periodic/Adhoc/Disclosure Report (KHÔNG denormalize — đính\
    \ chính so với mô tả cũ ở Tier1 6f T1-08, xem Tier2 6f T2-13). REF_TYPE: mô tả\
    \ gốc BRD liệt kê 3 giá trị (REPORT/PROFILE/ALERT) nhưng Data Modeler xác nhận\
    \ dữ liệu thực tế chỉ có 2 giá trị BAO_CAO_DINH_KY/UNLINKED (2026-09-15) — dùng\
    \ scheme theo xác nhận thực tế, cần profile lại khi có điều kiện để đối chiếu\
    \ với mô tả BRD. REF_ID: soft pointer, không model FK cứng (polymorphic theo REF_TYPE,\
    \ nguồn không enforce) — xem Tier2 6f T2-14. FORM_VERSION_ID: pending, chưa xác\
    \ định bảng đích — xem Tier2 6f T2-15. Chỉ có CREATED_AT/LAST_MODIFIED_AT, không\
    \ có CREATED_BY/UPDATED_BY — không đủ bộ áp dụng Audit block chuẩn (Bước 3k),\
    \ map 2 attribute Timestamp đơn giản."
