  notes: "Người nội bộ (người có liên quan) của CTCK theo quy định CBTT — gắn với\
    \ nhân sự cao cấp (SENIOR_PERSONNEL_ID). Mỗi dòng = 1 mối quan hệ nội bộ. SENIOR_PERSONNEL_ID\
    \ là FK đến Securities Company Senior Personnel (cùng T2). ENTITY_TYPE phân biệt\
    \ CA_NHAN/TO_CHUC. Địa chỉ tách ra IP Postal Address (PERMANENT_ADDRESS). Liên\
    \ lạc tách ra IP Electronic Address (PHONE, EMAIL). Giấy tờ tách ra IP Alt Identification\
    \ (NATIONAL_ID). NATIONALITY_ID → pending (CAT_NATIONALITY ngoài scope). GENDER\
    \ → SCMS_GENDER (1=NAM, 2=NU). Audit: CREATED_BY/AT + LAST_MODIFIED_BY/AT (canonical)."
