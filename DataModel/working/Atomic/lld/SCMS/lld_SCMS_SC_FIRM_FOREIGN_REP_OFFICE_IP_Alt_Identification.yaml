  notes: "IP Alt Identification của Securities Company Foreign Representative Office\
    \ (VPDD nước ngoài tại VN). ETL tạo tối đa 3 rows per VPDD (skip nếu number NULL):\
    \ Row 1 OPERATION_LICENSE (LICENSE_NUMBER + LICENSE_DATE); Row 2 ENTERPRISE_CODE\
    \ (ENTERPRISE_CODE — không có ngày/nơi); Row 3 TAX_ID (TAX_CODE — không có ngày/nơi).\
    \ Mỗi loại là 1 block riêng — KHÔNG dùng pivot gộp chung 1 attribute (sửa 2026-07-24).\
    \ Lưu ý: PARENT_COMPANY_LICENSE và PARENT_LICENSE_DATE là giấy phép của công ty\
    \ mẹ nước ngoài, KHÔNG phải của VPDD tại VN — giữ nguyên ở bảng chính."
