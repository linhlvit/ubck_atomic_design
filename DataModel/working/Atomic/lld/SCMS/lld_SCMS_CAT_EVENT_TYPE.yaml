  notes: "Nâng cấp từ Classification Value (scheme SCMS_EVENT_TYPE, nay deprecated)\
    \ lên entity thật — xem SCMS_HLD_Tier1.md 6f T1-05. [ĐỔI TÊN 2026-09-16] Classification\
    \ Securities Company Event Type -> Classification Securities Company Event Type,\
    \ đối xứng tiền lệ Classification FMS Event Type — xem 7e #23. BCV Core Object\
    \ gán Common theo chỉ đạo Data Modeler (term BCV khớp mạnh `Event Type` id 9924,\
    \ category Event — không dùng, giữ Common để nhất quán pattern Classification-naming).\
    \ Table Type = Relative theo chỉ đạo tường minh (khác 3 entity Classification\
    \ cùng nhóm) — bảng không FK nghiệp vụ rõ ràng đến 1 Fundamental entity khác trong\
    \ scope hiện tại, xem 6f T1-07. BK dùng EVENT_TYPE_CODE; surrogate Id hash từ\
    \ ID kỹ thuật. Nhiều cột không có mô tả gốc (TARGET_ENTITY, EVENT_GROUP_ID, CYCLE,\
    \ FREQUENCY, SUBMISSION_METHOD, DEADLINE_CALCULATION_METHOD) — tạm gán Classification\
    \ Value/Text theo cấu trúc cột, cần profile dữ liệu trước ETL. EVENT_GROUP_ID\
    \ map 1:1 thành Event Group Code theo chỉ đạo Data Modeler (2026-07-10) — không\
    \ tạo cặp FK Id+Code vì chưa xác nhận bảng đích. Audit block (CREATED_BY/CREATED_AT/UPDATED_BY/UPDATED_AT)\
    \ loại bỏ theo convention SCMS."
