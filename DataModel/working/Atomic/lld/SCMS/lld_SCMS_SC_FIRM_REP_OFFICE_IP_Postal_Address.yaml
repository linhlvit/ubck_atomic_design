  notes: "IP Postal Address của Securities Company Organization Unit (type REP_OFFICE).\
    \ 1 row per VPDD với addr_type_code hardcode REP_OFFICE — đây là địa chỉ văn phòng\
    \ đại diện nội địa, không phải trụ sở chính CTCK. Có PROVINCE_ID (FK CAT_PROVINCE)\
    \ + DISTRICT_ID + WARD_ID — không có cột DISTRICT_NAME/WARD_NAME text riêng (khác\
    \ BRANCH). Format đồng bộ theo chuẩn NHNCK."
