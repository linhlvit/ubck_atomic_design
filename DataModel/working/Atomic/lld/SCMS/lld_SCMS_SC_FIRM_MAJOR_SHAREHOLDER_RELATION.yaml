  notes: "Quan hệ cổ đông lớn (sở hữu ≥5%) của CTCK. Mỗi dòng = 1 cổ đông lớn × 1\
    \ CTCK. SHAREHOLDER_ID → FK đến Securities Company Shareholder (SC_FIRM_SHAREHOLDER),\
    \ hash theo ID (BK của bảng đích). Địa chỉ tách ra IP Postal Address (ADDRESS).\
    \ Liên lạc tách ra IP Electronic Address (PHONE, EMAIL). Giấy tờ tách ra IP Alt\
    \ Identification (IDENTIFICATION_NUMBER, ISSUE_DATE, ISSUE_PLACE). NATIONALITY_ID\
    \ → FK Geographic Area (COUNTRY), crosswalk qua SCMS.CAT_NATIONALITY lấy NATIONALITY_CODE\
    \ rồi hash_id('ECAT_COUNTRY', code) — CAT_NATIONALITY chỉ là bảng trung gian ETL,\
    \ sẽ bị loại khỏi thiết kế sau. Audit: CREATED_AT + LAST_MODIFIED_AT only — bảng\
    \ nguồn không có CREATED_BY/LAST_MODIFIED_BY. Sửa 2026-10-07: SHAREHOLDER_ID thành\
    \ FK, ISSUE_DATE/ISSUE_PLACE chuyển sang shared entity, NATIONALITY_ID đổi target\
    \ cl_nationality → geographic_area."
