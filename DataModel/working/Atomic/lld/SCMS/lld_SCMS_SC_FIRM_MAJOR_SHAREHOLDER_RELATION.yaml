  notes: "Quan hệ cổ đông lớn (sở hữu ≥5%) của CTCK. Mỗi dòng = 1 cổ đông lớn × 1\
    \ CTCK. SHAREHOLDER_ID có trong nguồn nhưng KHÔNG phải FK constraint (key: null,\
    \ BRD ghi description trống) — chỉ lưu dạng reference, không dùng làm FK đến SC_FIRM_SHAREHOLDER.\
