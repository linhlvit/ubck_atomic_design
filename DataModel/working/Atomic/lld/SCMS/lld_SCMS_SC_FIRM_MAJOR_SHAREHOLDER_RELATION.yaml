    \ Address (PHONE, EMAIL). Giấy tờ tách ra IP Alt Identification (IDENTIFICATION_NUMBER).\
    \ NATIONALITY_ID → pending (CAT_NATIONALITY ngoài scope). Audit: CREATED_AT +\
    \ LAST_MODIFIED_AT only — bảng nguồn không có CREATED_BY/LAST_MODIFIED_BY."
