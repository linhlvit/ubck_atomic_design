  notes: "CUSTODIAN_BANK → Securities Company Custodian Bank. Ngân hàng lưu ký được\
    \ CTCK chỉ định. HLD gán BCV [Arrangement] Securities Service Agreement nhưng\
    \ BRD không có BANK_ID FK — CUSTODIAN_BANK lưu thông tin ngân hàng và thỏa thuận\
    \ lưu ký trong cùng 1 bảng (denormalized). BCV điều chỉnh về [Involved Party]\
    \ Custodian để phản ánh đúng grain. Ghi chú: T2-03 — cần xác nhận với team HLD\
    \ về BCV assignment và khả năng link với BANK entity T1. Có BANK_CATEGORY (1=Thanh\
    \ toán/2=Lưu ký/3=Cả hai — SCMS_BANK_CATEGORY). ADDRESS/PHONE/FAX/EMAIL/WEBSITE\
    \ → IP shared entities."
