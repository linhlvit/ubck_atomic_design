  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Sheet/trang cụ thể trong 1 biểu mẫu báo cáo (Securities Company Report)\
    \ — tiêu đề, khổ giấy, người ký, loại sheet. Đảo ngược quyết định loại-scope trước\
    \ đây (cascade từ FORM_REPORT đã loại, lý do đã lỗi thời) — xem SCMS_HLD_Overview.md\
    \ 7e #23, SCMS_HLD_Tier2.md 6a/6f T1-14. FORM_REPORT_ID hash trực tiếp (Code của\
    \ Securities Company Report = ID kỹ thuật nguồn, xem lld_SCMS_FORM_REPORT.yaml)\
    \ — không cần crosswalk. FORM_SHEET_ID (self-ref, mô tả gốc BRD trống) — mục đích\
    \ chưa xác nhận, cần Data Modeler xác nhận (xem pending_design.yaml), tạm map\
    \ dạng FK suy luận self-reference như PARENT_ID của Securities Company Report.\
    \ Audit block (CREATED_BY/CREATED_AT/LAST_MODIFIED_AT — chỉ có 3/4 cột, không\
    \ có UPDATED_BY riêng) loại bỏ theo convention SCMS. Entity Id/Code (BK) hash\
    \ trực tiếp theo ID kỹ thuật nguồn (hash_id('SCMS_FORM_SHEET', ID)) — theo quyết\
    \ định Data Modeler 2026-09-16, cùng pattern đã áp dụng cho sc_report_sheet_row/sc_report_sheet_column/sc_report_sheet_cell.\
    \ SHEET_CODE giữ lại dạng attribute nghiệp vụ thuần (\"Sheet Code\", không FK,\
    \ không hash). Self-reference FK (Parent Sheet Id/Code) đổi từ crosswalk qua SHEET_CODE\
    \ sang hash trực tiếp theo FORM_SHEET_ID (đồng bộ với thay đổi PK) — mọi FK ngoài\
    \ trỏ tới entity này (FORM_SHEET_ROW/COLUMN/CELL, FORM_ROW_HEADER) cũng đã cập\
    \ nhật tương ứng, không còn crosswalk."
