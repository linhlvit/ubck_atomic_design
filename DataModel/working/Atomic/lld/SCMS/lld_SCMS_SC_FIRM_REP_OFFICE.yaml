  notes: "SC_FIRM_REP_OFFICE → Securities Company Organization Unit. Organization\
    \ Unit Type Code hardcode: REP_OFFICE. FULL_NAME + OFFICE_NAME là 2 tên (cần xác\
    \ nhận có trùng không). SO_QUYET_DINH/NGAY_QUYET_DINH là cột quyết định tên cũ\
    \ (Vietnamese) — map vào Decision Number/Decision Date; DECISION_NUMBER/DECISION_DATE\
    \ là cột tên mới. FORM_DATA_JSON loại khỏi scope. ADDRESS/PHONE/FAX → shared entities\
    \ (IP Postal + IP Electronic). SC_FIRM_REP_OFFICE_ID là self-ref FK."
