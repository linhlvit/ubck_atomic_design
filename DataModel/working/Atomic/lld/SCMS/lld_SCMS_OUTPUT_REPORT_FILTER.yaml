  notes: "Cấu hình bộ lọc khả dụng khi khai thác 1 biểu mẫu báo cáo đầu ra — cho phép\
    \ chọn, giá trị mặc định, thứ tự hiển thị. Bảng chưa được khảo sát vào BRD trước\
    \ đây — cấu trúc cột trích từ DDL UAT (Source/DDL UAT 1/SCMS_UAT_schema.txt),\
    \ bổ sung BRD và thiết kế Atomic 2026-09-16 — xem SCMS_HLD_Overview.md 7e #23,\
    \ SCMS_HLD_Tier2.md 6a/6f T2-16. Không có mã nghiệp vụ tự nhiên trong nguồn —\
    \ BK dùng ID kỹ thuật trực tiếp, cùng pattern Securities Company Report Input\
    \ Submission/Alert Run. FORM_REPORT_ID hash trực tiếp (Code của Securities Company\
    \ Report = ID kỹ thuật nguồn) — không cần crosswalk. FILTER_CATALOG_ID (FK → CAT_FILTER)\
    \ — CAT_FILTER là bảng Code+Name thuần (ID/CODE/NAME/DESCRIPTION/ALLOW_MULTIPLE/SORT_ORDER),\
    \ reference data set theo Rule #11 CLAUDE.md, không thiết kế thành Atomic entity\
    \ riêng. Theo yêu cầu Data Modeler (2026-09-16), giá trị CAT_FILTER đã được insert\
    \ trực tiếp vào bảng Fundamental `cl_value` — đổi thiết kế từ denormalize Text\
    \ (quyết định tạm thời cũ, xem Tier2 6f T2-16) sang Classification Value thật:\
    \ crosswalk `FILTER_CATALOG_ID` sang `CAT_FILTER.ID` để lấy `CODE`, đổi tên attribute\
    \ `Filter Catalog Id` → `Filter Catalog Code`. Scheme `SCMS_CAT_FILTER` đăng ký\
    \ tại classification_schemes.yaml. Data change mode nguồn chưa xác định rõ (bảng\
    \ mới khảo sát từ DDL) — cần Data Modeler/ETL xác nhận trước go-live."
