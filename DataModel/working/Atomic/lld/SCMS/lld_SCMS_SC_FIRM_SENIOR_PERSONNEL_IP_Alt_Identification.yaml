  notes: "IP Alt Identification của Securities Company Senior Personnel. ETL tạo 2\
    \ rows per nhân sự: Row 1 — NATIONAL_ID (CCCD/CMND/Hộ chiếu hiện hành — canonical,\
    \ không có Issue Date/Place riêng trong nguồn); Row 2 — ID_NUMBER (CMND cũ — type\
    \ IDENTIFICATION, có ISSUE_DATE/ISSUE_PLACE đi kèm). Cần xác nhận team nếu NATIONAL_ID\
    \ cũng cần Issue Date/Place. Row 3 — PRACTITIONER_LICENSE (chứng chỉ hành nghề\
    \ chứng khoán): SECURITIES_LICENSE_NUMBER → Identification Number, SECURITIES_LICENSE_DATE\
    \ → Identification Issue Date (chuyển từ entity chính 2026-10-09; không có nơi\
    \ cấp trong nguồn). Format đồng bộ theo chuẩn NHNCK."
