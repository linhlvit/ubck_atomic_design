  design_status: "draft"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "BCV Term: Broker Dealer (Involved Party). Thực thể trung tâm CTCK. Grain\
    \ = 1 Involved Party → tách IP Postal Address và IP Electronic Address. Địa chỉ\
    \ → lld_SCMS_SC_FIRM_INFO_IP_Postal_Address.yaml. Liên lạc → lld_SCMS_SC_FIRM_INFO_IP_Electronic_Address.yaml.\
    \ SC_FIRM_INFO_ID là self-FK (không phải PK). COMPANY_TYPE_ID → FK đến CAT_COMPANY_TYPE\
    \ (Classification Value). PROVINCE_ID/DISTRICT_ID/WARD_ID → FK đến Geographic\
    \ Area (tách vào IP Postal Address). RECORD_STATUS/EVENT_TYPE_ID → migrated 2026-07-10\
    \ sang cặp FK Classification Firm Status Id/Code và Classification Event Type\
    \ Id/Code (không còn Classification Value đơn). BUSINESS_LICENSE/DECISION_NUMBER/LICENSE_EXPIRY_DATE\
    \ đã loại bỏ khỏi entity chính (đã capture qua IP Alt Identification, xem pending_design.yaml).\
    \ BUSINESS_LINES/ADDITIONAL_BUSINESS_LINES map 1:1 dạng Text (không parse ARRAY,\
    \ quyết định 2026-07-10 — trước đó denormalize từ LNK_SC_FIRM_BUSINESS_LINE dạng\
    \ Array<Text>). TOTAL_SHARES dùng domain đề xuất mới 'Quantity' (chờ duyệt). FORM_DATA_JSON\
    \ loại khỏi scope (raw form payload kỹ thuật)."
