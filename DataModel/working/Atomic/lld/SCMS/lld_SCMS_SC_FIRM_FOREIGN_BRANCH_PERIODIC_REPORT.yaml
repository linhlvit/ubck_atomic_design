  notes: "Báo cáo định kỳ gửi bởi Chi nhánh nước ngoài của CTCK lên cơ quan quản lý.\
    \ Mỗi dòng = 1 lần nộp báo cáo theo 1 kỳ/loại báo cáo. FK: SC_FIRM_FOREIGN_BRANCH_ID→Securities\
    \ Company Foreign Branch (T2). EVENT_TYPE_ID: FK đến CAT_EVENT_TYPE nằm ngoài\
    \ scope → pending. CANCELLED_BY: FK đến SYS_USER nằm ngoài scope → pending. RECORD_STATUS\
    \ (NUMBER 10): SCMS_REPORT_SUBMISSION_STATUS (0=Chưa gửi; 1=Đã gửi; 2=Đã duyệt;\
    \ -1=Từ chối; 3=Bị hủy). SUBMISSION_DEADLINE (DATE) + SUBMISSION_DEADLINE_AT (TIMESTAMP\
    \ 0): hai cột khác precision cùng ý nghĩa — map cả hai. DU_LIEU_EFORM (VARCHAR2\
    \ 4000): dữ liệu eForm text. REPORT_PERIOD (VARCHAR2 20): chu kỳ báo cáo (Ngày/Tuần/Tháng/Quý/Bán\
    \ niên/Năm). Bảng nguồn không có trường CREATED_AT/BY/LAST_MODIFIED — không có\
    \ audit block chuẩn. Sự kiện thay trạng thái được ghi nhận qua SENT_AT và CANCELLED_AT."
