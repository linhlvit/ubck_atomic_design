  notes: "Người liên quan của CTCK theo quy định CBTT/sở hữu. Khác INSIDER_RELATION\
    \ ở chỗ không gắn SENIOR_PERSONNEL_ID. Địa chỉ tách IP Postal (PERMANENT_ADDRESS=PERMANENT).\
    \ Liên lạc tách IP Electronic (PHONE, EMAIL). Giấy tờ tách IP Alt ID (IDENTIFICATION_NUMBER=NATIONAL_ID).\
    \ LEGAL_REPRESENTATIVE: VARCHAR2(500) nhưng mô tả nguồn ghi '1=Có, 0=Không' —\
    \ data type không khớp description; lưu dạng Text và ghi chú. POSITION_ID → pending\
    \ (FK CAT_POSITION ngoài scope). COUNTRY_ID → pending (FK CAT_COUNTRY ngoài scope).\
    \ Audit: CREATED_AT + CREATED_BY + LAST_MODIFIED_AT (bảng nguồn không có LAST_MODIFIED_BY)."
