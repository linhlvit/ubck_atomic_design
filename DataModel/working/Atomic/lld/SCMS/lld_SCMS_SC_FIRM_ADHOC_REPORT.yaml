schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_ADHOC_REPORT"
  atomic_entity: "Securities Company Adhoc Report"
  entity_physical_name: "sc_adhoc_report"
  bcv_core_object: "Business Activity"
  bcv_concept: "[Event] Transaction"
  table_type: "Relative"
  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Mỗi dòng = 1 báo cáo đột xuất/bất thường CTCK nộp lên UBCKNN. DETAIL_TYPE\
    \ phân loại: BAT_THUONG=Bất thường; THEO_YEU_CAU=Theo yêu cầu; KHAC=Khác. SC_FIRM_FOREIGN_BRANCH_ID\
    \ và BANK_ID: nullable FK cho báo cáo của chi nhánh/ngân hàng. EFORM_DATA + IMPORT_DATA_JSON\
    \ (đổi tên từ IMPORT_DU_LIEU_JSON) excluded (raw JSON payload). Audit: CREATED_AT\
    \ + LAST_MODIFIED_AT (không có CREATED_BY/LAST_MODIFIED_BY); CANCELLED_BY + SENDER_ID\
    \ → pending. Hạ về draft (2026-07-27) để sửa lỗi hash-mismatch FK Securities Company\
    \ Id — trước đây hash trực tiếp theo ID kỹ thuật thay vì CODE của bảng đích. FORM_REPORT_ID\
    \ (2026-09-17) nay model FK cứng sang Securities Company Report — hash trực tiếp\
    \ (Code=ID theo convention FORM_REPORT). FORM_VERSION_ID (2026-09-17, Data Modeler\
    \ xác nhận) là ID của FORM_REPORT tại thời điểm nộp (snapshot phiên bản đã dùng\
    \ khi nộp, có thể khác FORM_REPORT_ID nếu biểu mẫu có phiên bản mới hơn phát sinh\
    \ sau đó) — đổi tên thành \"Submitted Securities Company Report Id/Code\", cùng\
    \ target sc_report, hash trực tiếp tương tự. REPORT_INPUT_SUBMISSION_ID (2026-09-17)\
    \ nay model FK cứng sang Securities Company Report Input Submission — hash trực\
    \ tiếp (BK của REPORT_INPUT_SUBMISSION dùng ID kỹ thuật trực tiếp, không có mã\
    \ nghiệp vụ tự nhiên). Đối chiếu lại với DDL UAT thực tế (Source/DDL UAT 1/SCMS_UAT_schema.txt,\
    \ 2026-09-18) phát hiện SO_NGAY_GUI_MUON/HAN_GUI KHÔNG bị loại bỏ như ghi nhận\
    \ (sai) trước đó — thực chất chỉ ĐỔI TÊN thành LATE_SUBMISSION_DAYS/SUBMISSION_DEADLINE;\
    \ đã khôi phục Overdue Days/Submission Deadline Timestamp với source_columns cập\
    \ nhật theo tên mới. Cùng đợt đối chiếu phát hiện 1 chỉnh sửa trung gian (không\
    \ rõ nguồn gốc) đã xóa nhầm 4 attribute vẫn còn cột nguồn hợp lệ (Summary/Attachment\
    \ Path/Note/Cancellation Reason — SUMMARY/ATTACHMENT_PATH/NOTE/CANCELLATION_REASON\
    \ vẫn tồn tại trong DDL UAT) và làm hỏng 3 attribute Classification Value (Adhoc\
    \ Report Type Code/Signature Type Code/Report Submission Status Code bị đổi domain\
    \ sang Text hoặc sai cú pháp comment \"SCHEMA_CODE=...\" không khớp chuẩn dự án,\
    \ mất liên kết tới scheme đã đăng ký sẵn trong classification_schemes.yaml) — đã\
    \ khôi phục cả 4 attribute và sửa lại 3 Classification Value về đúng chuẩn (2026-09-18).\
    \ Bổ sung 2 cột mới phát sinh trong DDL UAT chưa có trong LLD: BANK_SCOPE (Depositary\
    \ Bank Scope Code, scheme SCMS_SC_FIRM_ADHOC_REPORT_BANK_SCOPE) và PREVIOUS_SUBMIT_STATUS\
    \ (Previous Report Submission Status Code, pending — tạm dùng chung scheme RECORD_STATUS,\
    \ cần Data Modeler xác nhận tập giá trị thực tế). Source/SCMS_Columns.csv vẫn chưa\
    \ cập nhật theo DDL UAT mới nhất (tên cột cũ SO_NGAY_GUI_MUON/HAN_GUI/IMPORT_DU_LIEU_JSON,\
    \ thiếu BANK_SCOPE/PREVIOUS_SUBMIT_STATUS) — cần chạy reconcile qua source-survey."
