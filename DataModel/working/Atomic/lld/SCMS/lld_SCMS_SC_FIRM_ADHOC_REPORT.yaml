  notes: "Mỗi dòng = 1 báo cáo đột xuất/bất thường CTCK nộp lên UBCKNN. DETAIL_TYPE\
    \ phân loại: BAT_THUONG=Bất thường; THEO_YEU_CAU=Theo yêu cầu; KHAC=Khác. SC_FIRM_FOREIGN_BRANCH_ID\
    \ và BANK_ID: nullable FK cho báo cáo của chi nhánh/ngân hàng. EFORM_DATA + IMPORT_DU_LIEU_JSON\
    \ excluded (raw JSON payload). Audit: CREATED_AT + LAST_MODIFIED_AT (không có\
    \ CREATED_BY/LAST_MODIFIED_BY); CANCELLED_BY + SENDER_ID → pending. Hạ về draft\
    \ (2026-07-27) để sửa lỗi hash-mismatch FK Securities Company Id — trước đây hash\
    \ trực tiếp theo ID kỹ thuật thay vì CODE của bảng đích."
