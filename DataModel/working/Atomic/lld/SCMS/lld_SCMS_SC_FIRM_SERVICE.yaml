  notes: "SC_FIRM_SERVICE → Securities Company Licensed Service. Dịch vụ chứng khoán\
    \ được UBCKNN cấp phép cho CTCK (đăng ký/thu hồi). Resolve open question 7e-04\
    \ (SCMS_HLD_Overview.md) — giữ SC_FIRM_SERVICE làm entity chính thức, loại LNK_SC_FIRM_SERVICE\
    \ (junction đơn giản hơn, thiếu vòng đời văn bản). BCV Core Object = Event, [Event]\
    \ Business Activity — theo đúng pattern đã implement cho SC_FIRM_ADMIN_PENALTY_DECISION/SC_FIRM_ADMIN_SANCTION.\
    \ SERVICE_ID → CAT_SERVICE dùng pattern Classification Value (scheme SCMS_SERVICE_TYPE,\
    \ đã có, chỉ 1 trường Code). DM_DICH_VU_ID nghi ngờ trùng SERVICE_ID — xem pending_design.yaml."
