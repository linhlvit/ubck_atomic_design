  notes: "SC_FIRM_SERVICE → Securities Company Licensed Service. Dịch vụ chứng khoán\
    \ được UBCKNN cấp phép cho CTCK (đăng ký/thu hồi). Xác nhận lại 7e-04 (SCMS_HLD_Overview.md,\
    \ 2026-07-07): SC_FIRM_SERVICE và LNK_SC_FIRM_SERVICE phản ánh 2 dữ liệu nghiệp\
    \ vụ khác nhau (không trùng) — SC_FIRM_SERVICE là hồ sơ đăng ký/thu hồi dịch vụ,\
    \ LNK_SC_FIRM_SERVICE là danh mục giấy phép hiện hành (giữ scope_status: pending,\
    \ thiết kế entity riêng sau). BCV Core Object = Event, [Event] Party Registration\
    \ (knowledge/terms.csv #9819 — formal granting of rights bởi authorized body cho\
    \ 1 Involved Party) — sát nghĩa hơn [Event] Business Activity dùng trước đây (pattern\
    \ mượn từ SC_FIRM_ADMIN_PENALTY_DECISION/SC_FIRM_ADMIN_SANCTION vốn là biện pháp\
    \ chế tài, khác bản chất). SERVICE_ID → CAT_SERVICE: cập nhật (HLD bổ sung SCMS\
    \ Tier1) — CAT_SERVICE đã nâng cấp thành Atomic entity thật 'Classification SCMS\
    \ Service' (table_type Classification), thay cho scheme SCMS_SERVICE_TYPE cũ (nay\
    \ deprecated). SERVICE_ID đổi từ single Classification Value code sang cặp FK\
    \ chuẩn Classification SCMS Service Id + Classification SCMS Service Code. DM_DICH_VU_ID\
    \ nghi ngờ trùng SERVICE_ID — xem pending_design.yaml."
