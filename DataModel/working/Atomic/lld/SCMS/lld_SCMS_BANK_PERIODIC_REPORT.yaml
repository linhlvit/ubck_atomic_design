  notes: "Mỗi dòng = 1 lần ngân hàng lưu ký nộp báo cáo định kỳ lên UBCKNN. Grain:\
    \ (BANK_ID, FORM_REPORT_ID, REPORT_YEAR, PERIOD). Thiết kế theo mẫu lld_SCMS_SC_FIRM_PERIODIC_REPORT.yaml\
    \ (cùng bộ cột vòng đời nộp báo cáo, thay SC_FIRM_INFO_ID bằng BANK_ID). Trạng\
    \ thái vòng đời RECORD_STATUS: 0=Chưa gửi, 1=Đã gửi, 2=Đã duyệt, -1=Từ chối, 3=Bị\
    \ hủy (dùng chung scheme SCMS_REPORT_SUBMISSION_STATUS với báo cáo CTCK, cùng\
    \ bộ giá trị). Audit CREATED_AT/LAST_MODIFIED_AT loại bỏ theo convention SCMS.\
    \ APPROVED_BY/SENDER_ID/CANCELLED_BY → pending (SYS_USER out of scope). Tên entity\
    \ theo chỉ đạo Data Modeler (2026-10-06): 'Securities Company Bank Periodic',\
    \ chứa trọn tên entity cha 'Securities Company Bank' (sau khi đổi tên từ 'Securities\
    \ Company Depositary Bank')."
