  notes: "Tổng hợp điểm rủi ro CTCK theo kỳ đánh giá (mô hình CAMEL). Grain = 1 CTCK\
    \ × 1 kỳ báo cáo → Fact Snapshot. FK: SC_FIRM_INFO_ID (FK cứng) → Securities Company;\
    \ RISK_REPORTING_PERIOD_ID (FK suy luận, T1) → Securities Company Risk Reporting\
    \ Period. RISK_SCORING_SC_FIRM_ID (key: null, không phải FK constraint) → lưu\
    \ dạng Text reference. PERIOD+REPORT_YEAR: kỳ và năm báo cáo (mô tả bổ sung cho\
    \ RISK_REPORTING_PERIOD_ID). Score fields (CAPITAL/ASSET/MANAGEMENT/EARNINGS/LIQUIDITY):\
    \ 5 nhóm CAMEL. INITIAL_RATING/PERIODIC_RATING → SCMS_RISK_RATING (A/B/C/D/E).\
    \ RECORD_STATUS → SCMS_USAGE_STATUS. Audit: CREATED_BY/AT + LAST_MODIFIED_BY/AT\
    \ canonical (all BY pending)."
