metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_ALERT_VIOLATION"
  atomic_entity: "Securities Company Alert Violation"
  entity_physical_name: "sc_alert_violation"
  bcv_core_object: "Event"
