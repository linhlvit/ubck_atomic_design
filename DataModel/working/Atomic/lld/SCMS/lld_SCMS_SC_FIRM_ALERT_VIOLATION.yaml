    \ báo vi phạm được tạo ra khi run alert. ENTITY_TYPE + ENTITY_ID là polymorphic\
    \ FK: CTCK → Securities Company; CN_NUOC_NGOAI → Securities Company Foreign Branch;\
    \ VPDD_NUOC_NGOAI → Securities Company Foreign Rep Office. ALERT_CONDITION_ID\
    \ và ALERT_RUN_ID: pending vì không có trong HLD scope. CONDITION là chuỗi logic\
    \ expression từ hệ thống — lưu dạng Text. Audit: CREATED_AT + CREATED_BY; không\
    \ có LAST_MODIFIED_BY/AT."
