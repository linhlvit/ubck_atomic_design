  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Vi phạm cảnh báo từ chỉ tiêu giám sát (Alert Indicator). Mỗi dòng = 1 cảnh\
    \ báo vi phạm được tạo ra khi run alert. ENTITY_TYPE + ENTITY_ID là polymorphic\
    \ FK: CTCK → Securities Company; CN_NUOC_NGOAI → Securities Company Foreign Branch;\
    \ VPDD_NUOC_NGOAI → Securities Company Foreign Rep Office. ALERT_CONDITION_ID:\
    \ pending vì không có trong HLD scope. ALERT_RUN_ID: resolved 2026-07-12 — FK\
    \ đến Securities Company Alert Run (xem lld_SCMS_ALERT_RUN.yaml). CONDITION là\
    \ chuỗi logic expression từ hệ thống — lưu dạng Text. Audit: CREATED_AT + CREATED_BY;\
    \ không có LAST_MODIFIED_BY/AT. Hạ về draft (2026-07-27) để sửa lỗi hash-mismatch\
    \ trên 3 FK (Securities Company Id, Securities Company Alert Indicator Id, Securities\
    \ Company Alert Run Id) — trước đây hash trực tiếp theo ID kỹ thuật thay vì Code\
    \ của bảng đích. Hạ về draft (2026-08-05) để đồng bộ DDL UAT mới (Source/DDL UAT\
    \ 1/SCMS_UAT_schema.txt): GIA_TRI_SO_SANH/GIA_TRI_THUC_TE xác nhận tên chính thức\
    \ là COMPARE_VALUE/ACTUAL_VALUE; widen data type trên CONDITION, NOTE, ALERT_YEAR,\
    \ REPORT_PERIOD, RESOLUTION_NOTE, VIOLATION_DESCRIPTION, ENTITY_TYPE; bổ sung\
    \ 5 cột mới PERIOD_TYPE, PERIOD_VALUE, ALERT_DATE, SEVERITY_LEVEL_ALT, STRING_RESULT_VALUE\
    \ (DDL không có mô tả nghiệp vụ — cần Data Modeler xác nhận, đặc biệt khả năng\
    \ trùng ý nghĩa với REPORT_PERIOD/REPORT_PERIOD_VALUE và SEVERITY_LEVEL/VIOLATION_SEVERITY)."
