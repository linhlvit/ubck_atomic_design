schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "SCMS"
  source_table: "FORM_REPORT"
  atomic_entity: "Securities Company Form Report"
  entity_physical_name: "sc_form_report"
  bcv_core_object: "Condition"
  bcv_concept: "[Condition] Regulatory Reporting Requirement"
  table_type: "Relative"
  group: "T1"
  design_status: "draft"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Đảo ngược quyết định loại-scope trước đây (form metadata) — xem SCMS_HLD_Tier1.md\
    \ 6f T1-06/T1-07. BCV Concept là term mới đề xuất (Regulatory Reporting Requirement,\
    \ type_of Criterion), chưa tồn tại sẵn trong knowledge/terms.csv — gần nhất là\
    \ Disclosure (Control Condition, id 9208), không dùng vì chỉ khớp phần CBTT. Table\
    \ Type = Relative theo chỉ đạo tường minh — bảng chỉ tự tham chiếu qua PARENT_ID/FORM_REPORT_ID/NEXT_FORM_ID,\
    \ không FK đến 1 Fundamental khác trong scope hiện tại. Theo chỉ đạo Data Modeler\
    \ (2026-07-10): vì bảng có ID, BK (Code) dùng trực tiếp ID kỹ thuật thay vì REPORT_CODE\
    \ — nhờ đó 3 cột tự tham chiếu (PARENT_ID/FORM_REPORT_ID/NEXT_FORM_ID, đều lưu\
    \ ID kỹ thuật của bản ghi đích) hash trực tiếp nhất quán, không cần self-join\
    \ resolve REPORT_CODE như bản thiết kế trước. REPORT_CODE nay map 1:1 thành attribute\
    \ nghiệp vụ riêng \"Report Code\" (không còn là BK). ACTIVE/SUMMARY/INPUT_REPORT\
    \ map 1:1 thành attribute riêng theo chỉ đạo — không loại trừ vì nghi trùng RECORD_STATUS/REPORT_STYLE.\
    \ SYS_FUNCTION_ID vẫn giữ pending (FK đến SYS_FUNCTION — ngoài phạm vi Atomic,\
    \ Operational/System; Data Modeler xác nhận giữ nguyên, sẽ xử lý khi phát triển\
    \ SYS_FUNCTION). Audit block (CREATED_BY/CREATED_AT/LAST_MODIFIED_BY/LAST_MODIFIED_AT)\
    \ loại bỏ theo convention SCMS (cùng quyết định đã áp dụng cho SC_FIRM_SERVICE)."
