  notes: "Quyết định xử phạt vi phạm hành chính đối với CTCK. Mỗi dòng = 1 quyết định\
    \ xử phạt. FINE_PAYMENT_DEADLINE lưu dạng VARCHAR2(200) thay vì DATE — ETL cần\
    \ giải thích format (có thể là text mô tả). VIOLATION_ACTS_JSON (CLOB) excluded.\
    \ REGISTERED_ADDRESS là địa chỉ CTCK tại thời điểm ra quyết định — lưu dạng denormalized\
    \ text (không tách IP Postal Address vì entity này không phải IP). Audit: CREATED_BY/AT\
    \ + LAST_MODIFIED_BY/AT (canonical). Nguồn data type DATE — widening sang Timestamp\
    \ cho audit fields."
