  notes: "SC_FIRM_SENIOR_PERSONNEL → Securities Company Senior Personnel. Nhân sự\
    \ cấp cao CTCK (Giám đốc, Phó GĐ, Kế toán trưởng...). FK đến SC_FIRM_INFO + có\
    \ thể thêm BRANCH/TRANSACTION_OFFICE/REP_OFFICE. Có trường cá nhân (CCCD/CMND\
    \ → IP Alt Identification; ADDRESS → IP Postal; PHONE/FAX/EMAIL/DISCLOSURE_EMAIL\
    \ → IP Electronic). Notes: (1) NATIONALITY_ID là canonical; DM_QUOC_TICH_ID là\
    \ legacy — cùng FK CAT_NATIONALITY; (2) PRACTICE_CERTIFICATE là legacy của SECURITIES_LICENSE\
    \ — cùng nghĩa; (3) STATUTORY_REPRESENTATIVE có thể trùng LEGAL_REPRESENTATIVE;\
    \ (4) START_DATE/END_DATE có thể trùng WORK_START_DATE/DISMISSAL_DATE — cần xác\
    \ nhận team; (5) POSITION_ID dạng NVARCHAR2 — có thể là code thay vì ID; (6) POSITION_IDS\
    \ (CLOB) — có thể là JSON array nhiều chức vụ. Hạ về draft (2026-07-27) để sửa\
    \ lỗi hash-mismatch FK Securities Company Id — trước đây hash trực tiếp theo\
    \ SC_FIRM_INFO_ID (ID kỹ thuật) thay vì CODE của bảng đích."
