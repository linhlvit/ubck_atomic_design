metadata:
  source_system: "SCMS"
  source_table: "SC_FIRM_SENIOR_PERSONNEL"
  atomic_entity: "Securities Company Senior Personnel"
  entity_physical_name: "sc_senior_personnel"
  bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Senior Officer"
  table_type: "Relative"
  group: "T2"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "SC_FIRM_SENIOR_PERSONNEL → Securities Company Senior Personnel. Nhân sự\
    \ cấp cao CTCK (Giám đốc, Phó GĐ, Kế toán trưởng...). FK đến SC_FIRM_INFO + có\
    \ thể thêm BRANCH/TRANSACTION_OFFICE/REP_OFFICE. Có trường cá nhân (CCCD/CMND\
    \ → IP Alt Identification; ADDRESS → IP Postal; PHONE/FAX/EMAIL/DISCLOSURE_EMAIL\
    \ → IP Electronic). Notes: (1) NATIONALITY_ID là canonical; DM_QUOC_TICH_ID là\
    \ legacy — không map; (2) PRACTICE_CERTIFICATE là legacy của SECURITIES_LICENSE\
    \ — cùng nghĩa; (3) STATUTORY_REPRESENTATIVE có thể trùng LEGAL_REPRESENTATIVE;\
    \ (4) START_DATE/END_DATE có thể trùng WORK_START_DATE/DISMISSAL_DATE — cần xác\
    \ nhận team; (5) POSITION_ID → FK Classification Securities Company Position,\
    \ crosswalk qua CAT_POSITION lấy POSITION_CODE (sửa 2026-10-09); SECURITIES_LICENSE_NUMBER/SECURITIES_LICENSE_DATE\
    \ → IP Alt Identification (type PRACTITIONER_LICENSE), chuyển 2026-10-09; (6)\
    \ POSITION_IDS (CLOB) — có thể là JSON array nhiều chức vụ. Hạ về draft (2026-07-27)\
    \ để sửa lỗi hash-mismatch FK Securities Company Id — trước đây hash trực tiếp\
    \ theo SC_FIRM_INFO_ID (ID kỹ thuật) thay vì CODE của bảng đích. Hạ về draft lần\
    \ 2 (2026-09-18): đổi FK target NATIONALITY_ID từ cl_nationality sang geographic_area\
    \ (type=COUNTRY), crosswalk qua SCMS.CAT_NATIONALITY để lấy NATIONALITY_CODE trước\
    \ khi hash_id('ECAT_COUNTRY', ...) — nhất quán với pattern Nationality dùng ở\
    \ NHNCK/FMS/GSGD."
