  notes: "BCV Term: Depositary Bank (Involved Party). Ngân hàng được CTCK dùng làm\
    \ đối tác thanh toán/lưu ký. Grain = 1 Involved Party → tách IP Postal Address\
    \ và IP Electronic Address. Địa chỉ → lld_SCMS_BANK_IP_Postal_Address.yaml. Liên\
    \ lạc → lld_SCMS_BANK_IP_Electronic_Address.yaml. BANK.CATEGORY — theo chỉ đạo\
    \ Data Modeler (2026-07-15): không phải Classification Value, map 1:1 dạng Text.\
    \ INPUT_REPORT_DATA — cờ kỹ thuật/nghiệp vụ, giữ dạng Boolean."
