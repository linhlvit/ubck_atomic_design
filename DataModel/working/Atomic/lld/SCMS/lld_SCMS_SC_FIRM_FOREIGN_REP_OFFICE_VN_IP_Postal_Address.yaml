  notes: "IP Postal Address của Securities Company Organization Unit (type FOREIGN_REP_OFFICE_VN).\
    \ SC_FIRM_FOREIGN_REP_OFFICE_VN có 2 địa chỉ riêng biệt: OFFICE_ADDRESS (địa chỉ\
    \ VPDD tại VN → FOREIGN_REP_OFFICE, vì đây là văn phòng đại diện của CTCK nước\
    \ ngoài, không phải trụ sở chính) và ADDRESS (địa chỉ công ty mẹ NN → PARENT_ADDRESS).\
    \ ETL tạo 2 rows per entity. Không có PROVINCE/DISTRICT/WARD FK. Format đồng bộ\
    \ theo chuẩn NHNCK (lặp block theo từng address type, tương tự pattern Electronic\
    \ Address của NHNCK.PROFESSIONALS)."
