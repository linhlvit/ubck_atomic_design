  notes: "Lần chạy batch hệ thống cảnh báo tự động kiểm tra ngưỡng vi phạm cho 1 chỉ\
    \ tiêu cảnh báo (ALERT_INDICATOR). Mỗi dòng = 1 lần thực thi insert-only. Đảo\
    \ ngược quyết định loại-scope trước đây — xem SCMS_HLD_Overview.md 7e #15 và SCMS_HLD_Tier2.md\
    \ 6f T2-08. ID (PK kỹ thuật) loại khỏi model — RUN_ID (mã định danh nghiệp vụ)\
    \ → Code (BK duy nhất), Id hash từ Code. Chỉ có CREATED_AT, không có CREATED_BY/UPDATED_AT/UPDATED_BY\
    \ — không đủ bộ để áp dụng Audit block chuẩn (Bước 3k). ALERT_TARGET_ENTITY map\
    \ 1:1 dạng Text theo yêu cầu Data Modeler — chưa xác nhận cùng domain với SC_FIRM_ALERT_VIOLATION.ENTITY_TYPE\
    \ (xem 6f T2-10). RECORD_STATUS → Classification Value scheme SCMS_ALERT_RUN_RECORD_STATUS\
    \ (0=Đang xử lý;1=Hoàn thành;-1=Lỗi;2=Bị huỷ). Resolve FK pending trên Securities\
    \ Company Alert Violation (Alert Run Id/Code)."
