  notes: "IP Alt Identification của Securities Company (CTCK). ETL tạo tối đa 7 rows\
    \ per CTCK (skip nếu number NULL): Row 1 OPERATION_LICENSE (BUSINESS_LICENSE_NUMBER\
    \ + BUSINESS_LICENSE_DATE + BUSINESS_LICENSE_ISSUER); Row 2 BUSINESS_LICENSE (FOUNDATION_LICENSE_NUMBER\
    \ + FOUNDATION_LICENSE_DATE + FOUNDATION_LICENSE_ISSUER — giấy phép thành lập,\
    \ tách biệt với giấy phép thành lập+hoạt động UBCKNN ở Row 1); Row 3 TAX_ID (TAX_CODE);\
    \ Row 4 ENTERPRISE_CODE (ENTERPRISE_CODE); Row 5 CERTIFICATE (CERTIFICATE_NUMBER\
    \ — generic, chưa rõ loại chứng nhận, cần profile thêm); Row 6 CUSTODIAN_CERT\
    \ (CUSTODIAN_CERT_NUMBER + CUSTODIAN_CERT_DATE); Row 7 CUSTODIAN_MEMBER_CERT (CUSTODIAN_MEMBER_CERT_NUMBER\
    \ + CUSTODIAN_MEMBER_CERT_DATE). Mỗi loại là 1 block riêng — KHÔNG dùng pivot\
    \ gộp chung 1 attribute (sửa 2026-07-24). Các trường giữ lại ở bảng chính: biz_license\
    \ (file path), fndtn_license_file_path, dcsn_nbr, license_expiry_dt, termntn_dcsn_nbr,\
    \ cstd_mmbr_code. Hạ về draft (2026-07-27) để sửa lỗi hash-mismatch FK Involved\
    \ Party Id — trước đây hash trực tiếp theo ID kỹ thuật thay vì CODE của bảng\
    \ đích."
