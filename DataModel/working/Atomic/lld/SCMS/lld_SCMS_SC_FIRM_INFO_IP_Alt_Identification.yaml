  notes: "IP Alt Identification của Securities Company (CTCK). ETL tạo tối đa 7 rows\
    \ per CTCK (skip nếu id_nbr NULL): Row 1 OPERATION_LICENSE (BUSINESS_LICENSE_NUMBER\
    \ + BUSINESS_LICENSE_DATE + BUSINESS_LICENSE_ISSUER); Row 2 ESTABLISHMENT_LICENSE\
    \ (FOUNDATION_LICENSE_NUMBER + FOUNDATION_LICENSE_DATE + FOUNDATION_LICENSE_ISSUER);\
    \ Row 3 TAX_CODE (TAX_CODE); Row 4 ENTERPRISE_CODE (ENTERPRISE_CODE); Row 5 CERTIFICATE\
    \ (CERTIFICATE_NUMBER — generic, chưa rõ loại chứng nhận); Row 6 CUSTODIAN_CERT\
    \ (CUSTODIAN_CERT_NUMBER + CUSTODIAN_CERT_DATE); Row 7 CUSTODIAN_MEMBER_CERT (CUSTODIAN_MEMBER_CERT_NUMBER\
    \ + CUSTODIAN_MEMBER_CERT_DATE). Các trường giữ lại ở bảng chính: biz_license\
    \ (file path), fndtn_license_file_path, dcsn_nbr, license_expiry_dt, termntn_dcsn_nbr,\
    \ cstd_mmbr_code."
