  notes: "Giao dịch chuyển nhượng cổ phần giữa hai cổ đông CTCK. Fact Append — mỗi\
    \ lần chuyển nhượng là 1 sự kiện. FKs: SC_FIRM_INFO_ID→Securities Company (T1);\
    \ TRANSFEROR_SHAREHOLDER_ID→Securities Company Shareholder (T2) vai trò Bên chuyển;\
    \ TRANSFEREE_SHAREHOLDER_ID→Securities Company Shareholder (T2) vai trò Bên nhận.\
    \ Hai FK đến cùng entity Securities Company Shareholder → dùng prefix Transferor/Transferee\
    \ để phân biệt. DOCUMENT_DATE (DATE): ngày của văn bản pháp lý; TRANSFER_DATE\
    \ (TIMESTAMP 6): ngày giờ chính xác của giao dịch chuyển nhượng. EVENT_TYPE_ID:\
    \ FK đến CAT_EVENT_TYPE nằm ngoài scope → pending. RECORD_STATUS → SCMS_USAGE_STATUS.\
    \ Audit: canonical 6-attr (bảng nguồn có đủ LAST_MODIFIED_AT/BY dù là Fact Append\
    \ — giữ nguyên để track corrections)."
