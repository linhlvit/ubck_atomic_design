  approved_by: null
  approved_at: null
  notes: "Sự kiện công bố thông tin (CBTT) của CTCK. Mỗi dòng = 1 lần gửi CBTT ra\
    \ hệ thống BA. RECORD_STATUS theo: 0=Chưa gửi/1=Đã gửi/-1=Lỗi. Liên kết với báo\
    \ cáo nguồn: PERIODIC_REPORT_ID hoặc SC_FIRM_ADHOC_REPORT_ID (tùy loại CBTT).\
    \ CORRECTION=1 nếu là tin đính chính. ORIGINAL_DISCLOSURE_ID là self-FK về bản\
    \ gốc. Audit: CREATED_BY/AT + UPDATED_BY/AT (tên cột UPDATED không phải LAST_MODIFIED).\
    \ APPROVED_BY/SENDER_ID/CANCELLED_BY → pending. EFORM_DATA excluded. LEGACY_FILEDATA\
    \ (BLOB) excluded."
