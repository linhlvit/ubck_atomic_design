  notes: "Thông tin chào bán chứng khoán CTCK công bố. Mỗi dòng = 1 đợt chào bán/phát\
    \ hành. OFFERING_TYPE phân loại đợt: 1=Công chúng/2=CP thường/3=Trả cổ tức CP/4=CTLC>100/5=CTLC<100/6=Đấu\
    \ giá/7=Riêng lẻ/8=Khác/9=CP hoán đổi/10=CB cổ đông lớn. Nhiều cột CW chỉ populate\
    \ khi SECURITIES_TYPE=CW; nhiều cột bond chỉ populate khi SECURITIES_TYPE=TP.\
    \ JSON fields excluded: RESULT_JSON, PLAN_JSON, CAPITAL_USE_PLAN, CAPITAL_USE_RESULT_JSON.\
    \ Legacy: NGAY_SUA/NGUOI_SUA_ID → legacy audit duplicates; LEGACY_FILEDATA (BLOB)\
    \ excluded. Audit canonical: CREATED_BY/AT + LAST_MODIFIED_BY/AT."
