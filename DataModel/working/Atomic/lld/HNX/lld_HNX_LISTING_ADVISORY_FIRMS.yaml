  notes: "Thiết kế 2026-11-26 từ DDL uat_hnx_stg.listing_advisory_firms (Source/HNX_UAT_schema.txt) + BRD/Source/HNX/brd_HNX_LISTING_ADVISORY_FIRMS.yaml. Tên entity/Core Object/table_type theo chỉ định Data Modeler (2026-11-26): Listing Advisory Firm, Involved Party, Fact Snapshot. BCV Term: Advising Involved Party (id 11142 — Involved Party Relationship trong đó Involved Party chủ thể tư vấn cho Involved Party đối tượng) — CTCK là bên tư vấn, tổ chức được tư vấn là bên nhận tư vấn. Domain Prefix: không có (cùng quy ước các entity HNX/VSDC/HOSE). Không đăng ký Classification Value scheme — mã số doanh nghiệp giữ Text. Id hash từ BK ghép (mã số DN CTCK + mã số DN tổ chức được tư vấn + số hợp đồng + mã kỳ báo cáo report_period — Data Modeler chỉ định 2026-11-27) — nguồn không có PK/ID kỹ thuật; BK không gồm ds_snpst_dt, mỗi kỳ báo cáo có Id riêng. Mã số doanh nghiệp của 2 bên giữ dạng Text denormalized, CHƯA tạo cặp FK Id+Code về Securities Company / Public Company vì BK của 2 entity đó không phải mã số doanh nghiệp (xem Điểm cần xác nhận trong HLD). Các cột kỹ thuật ds_snpst_dt/ds_etl_pcs_tms và 8 cột lineage staging (_batch_id, _source_*, _file_*, _row_number, _sheet_name) không khai báo trong LLD (cùng nguyên tắc Data Modeler 2026-10-19 / 2026-11-18) — ghi vào pending_design.yaml."
