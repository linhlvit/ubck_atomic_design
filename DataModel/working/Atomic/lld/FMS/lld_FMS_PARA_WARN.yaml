  notes: "[CẬP NHẬT 2026-07-06 theo HLD Tier1 revision] Đổi tên entity từ 'Warning\
    \ Parameter' → 'Member Warning Parameter' theo quyết định review: cấu trúc gần\
    \ trùng FIMS.PARAWARN nhưng GIỮ ENTITY RIÊNG cho FMS (không gộp với FIMS) — đặt\
    \ tên theo domain 'Member' dùng xuyên suốt FMS (Member Rating, Member Inspection...).\
    \ domain_prefix=Member Warning, dùng chung với Member Warning Condition (Tier\
    \ 2, nguồn CDT_WARN). Trước đây bị đưa nhầm vào HLD 7f nhóm Isolated — đã sửa\
    \ vì VIOLT có FK đến PARA_WARN. Được FK từ Fund Management Conduct Violation (VIOLT.PR_WID\
    \ — nay ở Tier 6, xem lld_FMS_VIOLT.yaml) và Member Warning Condition (CDT_WARN.PR_WID/OTHER_WID,\
    \ Tier 2). CREATED_BY, MODIFY_BY document trong pending_design.yaml."
