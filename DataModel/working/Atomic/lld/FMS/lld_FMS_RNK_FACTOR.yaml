  notes: "[SỬA LỖI — xem T1-05 ở FMS_HLD_Tier1.md] Đổi tên từ \"Member Rating Criterion\"\
    \ (sai, trùng tên FACTOR) → \"Member Rating Ranking Criterion\". KHÔNG có PARENT_ID\
    \ self-ref như thiết kế cũ từng gán nhầm. Domain prefix dùng chung với Member\
    \ Rating (Tier 2). [PHÁT HIỆN] Nguồn RNK_FACTOR KHÔNG có cột ID/PK kỹ thuật riêng\
    \ — chỉ có composite (RK_ID, FCTR_ID). BK phải do ETL sinh tổng hợp từ cặp (RK_ID,\
    \ FCTR_ID) thay vì map trực tiếp 1 cột nguồn (cùng pattern RNK_GR_FTOR, Tier 6).\
    \ [T7-03 — chờ xác nhận] Xác nhận WEIGHT ở entity này (theo tiêu chí) và WEIGHT\
    \ ở Member Rating Ranking Criterion Group (theo nhóm, RNK_GR_FTOR) độc lập nhau,\
    \ và Member Rating.TOTAL_SCORE (RANK, Tier 2) được tính từ tổng hợp 2 tầng này.\
    \ Không phải Involved Party — không tách shared entity. CREATED_BY, MODIFY_BY\
    \ document trong pending_design.yaml."
