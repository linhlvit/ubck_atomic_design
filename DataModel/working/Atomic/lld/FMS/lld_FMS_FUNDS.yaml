  notes: "Tách IP Alt Identification (ENTERPRISE_CODE, không có Postal/Electronic\
    \ do nguồn không có cột địa chỉ/liên lạc). Denormalize distribution_agent_ids\
    \ ARRAY<Struct> từ junction AGEN_FUNDS (đã xác nhận tồn tại trong BRD, 2 FK: AGENCY_ID\
    \ + FUND_ID). [PHÁT HIỆN] HLD Overview 7d còn nhắc bảng FNDSBMN (junction FUND↔BANK_MONI)\
    \ nhưng bảng này KHÔNG tồn tại trong BRD/Source/FMS đã khảo sát (không tìm thấy\
    \ brd_FMS_FNDSBMN.yaml, không có junction nào khác FK đến BANK_MONI ngoài SECURITIES/VIOLT)\
    \ — không thiết kế custodian_banks ARRAY, giữ nguyên FK đơn Custodian Bank Id/Code\
    \ từ cột BANK_ID trên chính FUNDS. Cần xác nhận lại HLD 7d. CREATED_BY, MODIFY_BY,\
    \ FILE_NAME/FILE_DATA, DELETED, DATA_MIGRATION, ID_DB_OLD document trong pending_design.yaml."
