  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "[CẬP NHẬT 2026-07-06 theo HLD Tier1 revision, T1-06/T1-03]: VIOLT đã RETIER\
    \ từ Tier 1 → Tier 6 (xem FMS_HLD_Tier6.md) sau khi đọc đủ FK khi thiết kế CDT_WARN\
    \ — FK đến Member Warning Parameter (Tier 1) + Member Warning Condition (Tier\
    \ 2) + 6 entity Tier 5 vượt quá phạm vi Tier 1. Grain vẫn 'chờ xác nhận' — xem\
    \ Tier6 6f. Grain dự kiến = 1 bản ghi cảnh báo/vi phạm gắn với ĐÚNG 1 thành viên\
    \ thị trường, xác định qua System Object Type Code (SYSTEM_OBJECT). 9 cặp FK đối\
    \ tượng (Fund Management Company/Investment Fund/Custodian Bank/Foreign Fund Management\
    \ Organization Unit/Securities Distribution Agent/Transfer Agent/Pension Service\
    \ Organization x2/Other Intermediary Organization/Pension Fund) đều nullable,\
    \ tại 1 thời điểm chỉ 1 cặp có giá trị — cùng pattern với Member Disclosure Announcement\
    \ (Tier 6). PR_WID FK đến Member Warning Parameter (PARA_WARN, Tier 1 — xem lld_FMS_PARA_WARN.yaml).\
    \ CDT_WID FK đến Member Warning Condition (CDT_WARN) — entity thiết kế ở Tier\
    \ 2, status=pending. USER_ID, RUN_BATCH_ID document trong pending_design.yaml.\
    \ File này thiết kế trước khi đến lượt Tier 6 trong quy trình tuần tự — giữ nguyên\
    \ cấu trúc FK đã xác định, cần review lại khi chính thức xử lý Tier 6."
