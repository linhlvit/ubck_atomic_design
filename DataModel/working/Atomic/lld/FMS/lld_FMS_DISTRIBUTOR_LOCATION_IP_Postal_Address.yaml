    \ sẽ tạo ra nhiều dòng shared entity trùng composite key (Involved Party Id +\
    \ Address Type Code = TRANSACTION_OFFICE) — cần Data Modeler xác nhận có chấp\
    \ nhận được không hay cần khóa tổ hợp khác (VD: thêm DISTRIBUTOR_LOCATION.ID vào\
    \ composite key thực tế dù không map thành attribute)."
