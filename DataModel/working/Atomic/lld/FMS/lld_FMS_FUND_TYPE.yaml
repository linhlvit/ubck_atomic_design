  notes: "[MỚI 2026-10-02] Promote từ Classification Value (scheme FMS_FUND_TYPE, nay deprecated). Không có cột CODE riêng — dùng ID làm BK (cùng pattern JOBS/MB_FUND). Theo quyết định Data Modeler chỉ map ID, ITEM_NAME, DESCRIPTION, IS_OPEN_FUND; RECORD_STATUS, DELETED, DATE_CREATED, DATE_MODIFIED, CREATED_BY, MODIFY_BY document trong pending_design.yaml. Entity tiêu thụ FUNDS.FTYPE_ID (Investment Fund) đổi sang cặp FK Id + Code. [MỚI 2026-10-27] Thêm CODE (DDL UAT mới) map 1-1 thành Sync Code (Text); BK giữ nguyên ID. [SỬA 2026-10-27] Đổi BK từ ID sang CODE (DDL UAT mới: CODE = mã loại hình quỹ eCAT dùng làm khóa đồng bộ FMS): Fund Type Code ← FUND_TYPE.CODE, Id = hash_id('FMS_FUND_TYPE', CODE). ID nguồn thành PK kỹ thuật, không map (pending_design). Bỏ attribute Sync Code thêm cùng ngày vì trùng Code. Consumer FUNDS.FTYPE_ID và RPT_TEMP.FTYPE_ID đã chuyển sang ETL crosswalk lấy CODE. Cần profile: CODE phải NOT NULL/unique trước go-live (nguồn khai báo nullable)."
