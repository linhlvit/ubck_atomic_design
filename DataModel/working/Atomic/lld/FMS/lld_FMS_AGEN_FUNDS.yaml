  notes: "[ĐẢO NGƯỢC 2026-07-19] Trước đây denormalize thành `distribution_agent_ids`\
    \ ARRAY<STRUCT> trên Investment Fund (Overview 7d cũ, xem lld_FMS_FUNDS.yaml)\
    \ — theo quyết định Data Modeler, chuyển thành entity Relative riêng. Bảng nguồn\
    \ chỉ có 2 FK (AGENCY_ID, FUND_ID) + DATA_MIGRATION (cờ migration kỹ thuật, không\
    \ map — document pending_design.yaml). Không có PK/ID kỹ thuật riêng, không có\
    \ audit fields. FUD_AG_AGT (mở rộng 4-FK) cần rà soát gộp/tách — xem Overview\
    \ 7e#19. Hạ về draft (2026-08-13) để bỏ cặp Id/Code riêng của entity — theo quyết\
    \ định Data Modeler, bảng \"_x_\" (link/relationship thuần) không cần surrogate\
    \ Id + BK Code riêng; PK là composite 2 FK (Investment Fund Id + Fund Distribution\
    \ Agent Id). [SỬA 2026-08-15] BCV Concept tạm \"[Arrangement] Investment Fund\"\
    \ (xem Overview 7e#20) không khớp với chính entity Investment Fund (đã là BCO\
    \ Involved Party, concept [Involved Party] Funds). Đổi BCO sang Involved Party,\
    \ tái dùng concept từ phía Fund Distribution Agent — [Involved Party] Organization\
    \ — và đổi tên entity đặt phía Agent lên trước theo quyết định Data Modeler."
