  notes: "Tách IP Postal Address (2 loại: FOREIGN_BRANCH + PARENT_ADDRESS) + IP Electronic\
    \ Address + IP Alt Identification (BUSINESS_LICENSE + OPERATING_LICENSE + TAX_ID).\
    \ NAT_ID là UUID FK thực sự đến FMS.NATIONAL — resolve bằng join NAT_ID → FMS.NATIONAL.ID\
    \ để lấy SNAME, rồi hash_id('ECAT.COUNTRY', SNAME) cho FK pair Country of Registration\
    \ Id/Code đến Geographic Area (theo yêu cầu Data Modeler 2026-07-24). Business\
    \ Registration Number (REG_NO) đẩy ra IP Alt Identification (IP_ALT_ID_TYPE=BUSINESS_LICENSE)\
    \ thay vì denormalized trên entity chính — theo yêu cầu Data Modeler (2026-07-24).\
    \ CREATED_BY, MODIFY_BY, FILE_DATA, DELETED, DATA_MIGRATION, ID_DB_OLD document\
    \ trong pending_design.yaml."
