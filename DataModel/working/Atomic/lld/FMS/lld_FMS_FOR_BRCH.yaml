  notes: "Tách IP Postal Address (2 loại: FOREIGN_BRANCH + PARENT_ADDRESS) + IP Electronic\
    \ Address + IP Alt Identification (OPERATING_LICENSE + TAX_ID). NAT_ID là UUID\
    \ FK thực sự đến FMS.NATIONAL (khác SECURITIES.NATIONAL dạng free text) — map\
    \ FK pair Country of Registration Id/Code đến Geographic Area. CREATED_BY, MODIFY_BY,\
    \ FILE_DATA, DELETED, DATA_MIGRATION, ID_DB_OLD document trong pending_design.yaml."
