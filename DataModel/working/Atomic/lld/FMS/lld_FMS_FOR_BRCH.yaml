  comment: "FK target: Geographic Area.Geographic Area Id. Nguồn Geographic Area đã\
    \ chuyển sang ECAT (FMS.NATIONAL ngừng thiết kế) — resolve bằng lookup giá trị:\
    \ đối chiếu mã/tên quốc gia NAT_ID với Geographic Area Business Code (ECAT.COUNTRY.CODE)\
    \ hoặc Name, không còn hash_id() trực tiếp theo FMS.NATIONAL. Cần crosswalk nếu\
    \ FMS không cùng chuẩn mã với ECAT."
