  notes: "[PHÁT HIỆN] HLD Tier3 6b/T3-01 mô tả FK TL_ID (kiêm nhiệm, nullable) đến\
    \ TL_PROFILES nhưng BRD columns thực tế của STF_FG_BRCH KHÔNG có cột TL_ID — chỉ\
    \ có JOBS_ID (khác JOBTYPE). Không tạo FK Fund Management Company Employee, cần\
    \ xác nhận lại HLD. Tách IP Postal Address + IP Electronic Address (EMAIL/EMAIL_PERSONAL)\
    \ + IP Alt Identification (NATIONAL_ID mặc định + PRACTICE_CERT_NO/PRACTICE_CERT_ISSUE_DATE\
    \ — đẩy ra shared entity 2026-07-19, dùng lại Scheme value IP_ALT_ID_TYPE=PRACTITIONER_LICENSE\
    \ thay vì tạo value mới, vì \"Chứng chỉ hành nghề (CCHN)\" đã có sẵn — xem lld_FMS_STF_FG_BRCH_IP_Alt_Identification.yaml).\
    \ CREATED_BY, MODIFY_BY, FILE_DATA, DELETED, DATA_MIGRATION document trong pending_design.yaml."
