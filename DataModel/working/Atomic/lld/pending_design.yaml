    reason: "BK dùng UnitCode thay Id — Id là PK kỹ thuật, không có giá trị nghiệp vụ riêng. Out-of-scope."
    action: "Xác nhận out-of-scope — không map, không cần SKIP_COLUMNS toàn cục vì PK này đặc thù NHNCK"

  - source_system: "SCMS"
    source_table: "SC_FIRM_LICENSED_PRACTITIONER"
    source_column: "PERMANENT_ADDRESS"
    description: "Địa chỉ thường trú (cột tiếng Anh)"
    reason: "Giá trị trùng lặp với DIACHITHUONGTRU (cột tiếng Việt, cùng ý nghĩa 'địa chỉ thường trú'). Đã chọn DIACHITHUONGTRU làm primary source cho IP Postal Address row PERMANENT."
    action: "Đã capture qua DIACHITHUONGTRU (trùng giá trị). Cần profile dữ liệu để xác nhận 2 cột luôn đồng nhất trước khi loại bỏ hẳn PERMANENT_ADDRESS khỏi phạm vi ETL."

  - source_system: "SCMS"
    source_table: "SC_FIRM_BRANCH"
    source_column: "PHONE_NUMBER"
    description: "Số điện thoại chi nhánh (cột legacy)"
    reason: "Giá trị trùng lặp với PHONE — PHONE đã được chọn làm cột canonical cho IP Electronic Address type PHONE."
    action: "Đã capture qua PHONE (trùng giá trị). Không map PHONE_NUMBER — out-of-scope."

  - source_system: "SCMS"
    source_table: "SC_FIRM_FOREIGN_BRANCH_PERSONNEL"
    source_column: "CREATED_BY, LAST_MODIFIED_AT, LAST_MODIFIED_BY"
    description: "Audit fields chuẩn (created_by/updated_at/updated_by)"
    reason: "Nguồn chỉ có CREATED_AT — không có CREATED_BY, LAST_MODIFIED_AT, LAST_MODIFIED_BY. Không đủ audit block 6-attribute chuẩn theo Bước 3k skill atomic-lld-design."
    action: "Không map Created By/Updated By/Updated Timestamp — cột không tồn tại trong nguồn. Created Timestamp (từ CREATED_AT) ban đầu có map nhưng sau đó cũng bị loại — xem entry audit block bên dưới (loại bỏ toàn bộ audit block khỏi SCMS)."

  - source_system: "SCMS"
    source_table: "SC_FIRM_FOREIGN_BRANCH_PERSONNEL"
    source_column: "BRANCH_HEAD_USER_ID"
    description: "Cờ/FK trưởng chi nhánh"
    reason: "Tên cột gợi ý FK đến User (SYS_USER) nhưng data type là NUMBER(1) — không phù hợp làm surrogate key FK, khớp hơn với cờ boolean. Mô tả gốc BRD trống, chưa xác nhận được ý nghĩa thực sự."
    action: "Tạm map thành 'Branch Head Indicator' (Boolean) trong lld_SCMS_SC_FIRM_FOREIGN_BRANCH_PERSONNEL.yaml. Cần xác nhận với BA trước khi approve."

  - source_system: "SCMS"
    source_table: "SC_FIRM_FOREIGN_BRANCH_PERSONNEL"
    source_column: "POSITION_JSON"
    description: "Chi tiết chức vụ dạng CLOB"
    reason: "Nguồn CLOB không rõ format — có thể là JSON object/array nhiều chức vụ kiêm nhiệm, tương tự POSITION_IDS của SC_FIRM_SENIOR_PERSONNEL."
    action: "Tạm map thành Text nguyên dạng (Position Json). Cần profile dữ liệu để xác nhận format JSON trước khi cân nhắc denormalize thành Array<Struct>."

  - source_system: "SCMS"
    source_table: "SC_FIRM_FOREIGN_BRANCH_PERSONNEL"
    source_column: "NATIONALITY"
    description: "Quốc tịch nhân sự"
    reason: "Mô tả gốc BRD ghi 'mã hoặc tên quốc gia' — không rõ nguồn lưu code chuẩn hóa hay free-text tên quốc gia. Securities Company Senior Personnel có scheme SCMS_NATIONALITY (FK NATIONALITY_ID dạng NUMBER) nhưng cột NATIONALITY ở đây là VARCHAR2(200), khác cấu trúc."
    action: "Tạm map Text denormalized. Cần profile dữ liệu để xác nhận có nên chuẩn hóa theo scheme SCMS_NATIONALITY hay giữ denormalized."

  - source_system: "SCMS"
    source_table: "SC_FIRM_FOREIGN_REP_OFFICE_PERSONNEL"
    source_column: "POSITION_JSON"
    description: "Chi tiết chức vụ dạng VARCHAR2(4000)"
    reason: "Tương tự SC_FIRM_FOREIGN_BRANCH_PERSONNEL.POSITION_JSON — format chưa xác nhận."
    action: "Tạm map thành Text nguyên dạng (Position Json). Cần profile dữ liệu để xác nhận format JSON."

  - source_system: "SCMS"
