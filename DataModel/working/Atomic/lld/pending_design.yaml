    reason: "Tương tự SC_FIRM_FOREIGN_BRANCH_PERSONNEL.NATIONALITY — không rõ mã hay tên quốc gia."
    action: "Tạm map Text denormalized. Cần profile dữ liệu để xác nhận chuẩn hóa."

