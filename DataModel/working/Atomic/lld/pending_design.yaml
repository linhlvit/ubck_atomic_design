entries:
  - source_system: "ECAT"
    source_table: "BUSINESS_LINE_LEVEL_2"
    source_column: "PARENT_LINE_VERSION_ID"
    description: "Id phiên bản của bản ghi cha (business_line_level_1) — theo Source/ECAT_Columns.csv, trỏ tới BUSINESS_LINE_LEVEL_1.ID (version-specific), khác PARENT_LINE_ID (trỏ tới BUSINESS_LINE_LEVEL_1.STABLE_ID)."
    reason: "Trùng lặp về mặt nghiệp vụ với PARENT_LINE_ID — Atomic chỉ cần 1 FK parent duy nhất, dùng STABLE_ID (BK) làm chuẩn resolve theo quyết định T1-05/T1-08 (ECAT_HLD_Tier1.md). PARENT_LINE_VERSION_ID là con trỏ kỹ thuật đến 1 version cụ thể của bản ghi cha — không cần thiết khi Atomic không lưu vết version-specific ID."
    action: "Không map. Parent Classification ECAT Business Line Id/Code đã resolve qua PARENT_LINE_ID (xem lld_ECAT_BUSINESS_LINE_LEVEL_2.yaml)."

  - source_system: "SCMS"
    source_table: "SC_FIRM_REP_OFFICE"
    source_column: "SO_QUYET_DINH"
    description: "Số quyết định cấp phép/chấp thuận văn phòng (cột tiếng Việt cũ)"
    reason: "Giá trị 1-1 với DECISION_NUMBER (cột tiếng Việt cũ, trùng ý nghĩa). Map primary từ DECISION_NUMBER theo quyết định người thiết kế 2026-07-10."
    action: "Đã capture qua DECISION_NUMBER → attribute 'Decision Number'. Không map SO_QUYET_DINH riêng."

  - source_system: "SCMS"
    source_table: "SC_FIRM_REP_OFFICE"
    source_column: "NGAY_QUYET_DINH"
    description: "Ngày ban hành quyết định (cột tiếng Việt cũ)"
    reason: "Giá trị 1-1 với DECISION_DATE (cột tiếng Việt cũ, trùng ý nghĩa). Map primary từ DECISION_DATE theo quyết định người thiết kế 2026-07-10."
    action: "Đã capture qua DECISION_DATE → attribute 'Decision Date'. Không map NGAY_QUYET_DINH riêng."

