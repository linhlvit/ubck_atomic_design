    reason: "Xác nhận trùng lặp thuần với sp_license_decision_document.decision_nbr (entity cha, ← DECISIONS.DECISION_NUMBER) — resolve NHNCK_HLD_Tier2.md 6f #6 (2026-08-14; cập nhật 2026-11-07 khi BK của DECISIONS đổi lại sang ID, số quyết định nằm ở decision_nbr)."
    action: "Loại bỏ attribute 'Decision Number At Attachment' — giữ FK Decision Id + Decision Code (nay là ID kỹ thuật DECISION_ID) làm liên kết duy nhất; số quyết định lấy qua join tới decision_nbr của entity cha."

