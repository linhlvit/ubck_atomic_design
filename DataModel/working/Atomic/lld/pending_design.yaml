    reason: "Mô tả gốc BRD không rõ ràng ('xem thêm tài liệu đặc tả SCMS'). Nghi ngờ là cột legacy trùng ý nghĩa với SERVICE_ID (cùng FK CAT_SERVICE) — cả 2 đều NUMBER(10)."
    action: "Không map — SERVICE_ID đã chọn làm cột canonical cho Service Code. Cần xác nhận với BA nếu DM_DICH_VU_ID thực sự trùng SERVICE_ID hay có ý nghĩa khác trước khi loại bỏ hẳn khỏi phạm vi ETL."

