  notes: "Luồng báo cáo động FIMS: STG RPTMEMBER ⋈ RPTVALUES (RPTVALUES.MebId = RPTMEMBER.Id,\
    \ trạng thái đã nộp 2/3/5) + tra TgtId → indicator_uid và FK đối tượng → object_type/object_id\
    \ → ODS FIR_VALUE (tên ODS cũ FACT_REPORT_CELL, partition ngay_nop) → ATM Upsert\
    \ theo BK (table_type Classification — quyết định Data Modeler 2026-09-30). Grain\
    \ = 1 ô × 1 lần nộp × 1 dòng động. Thay entity cũ Report Import Value. Không thiết\
    \ kế technical fields ds_* và cột kỹ thuật ODS (_source_system, _loaded_at) theo\
    \ quyết định Data Modeler 2026-09-30 (ngoại lệ so với reference/technical_fields.md)\
    \ — xem 7e-16 HLD Overview."
