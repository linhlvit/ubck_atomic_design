  notes: "Luồng báo cáo động FIMS: STG SHEET → parse JSON CellsMeta/SectionsMeta/DataLabel\
    \ (+ cấu hình đè fims_row_overrides/) → ODS FIR_STRUCTURE (tên ODS cũ DIM_INDICATOR,\
    \ ghi đè toàn bộ mỗi lần chạy) → ATM SCD2. Grain = 1 ô template trong 1 sheet.\
    \ mirror_of_uid lọc tại bước ODS → ATM. Không thiết kế technical fields ds_* và\
    \ cột kỹ thuật ODS (_source_system, _loaded_at) theo quyết định Data Modeler 2026-09-30\
    \ (ngoại lệ so với reference/technical_fields.md) — xem 7e-16 HLD Overview."
