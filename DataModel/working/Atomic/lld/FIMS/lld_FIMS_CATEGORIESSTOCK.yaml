  notes: "[MỚI 2026-10-28] Theo yêu cầu Data Modeler: CATEGORIESSTOCK thành entity riêng (Fact Append, [Arrangement] Investment Arrangement), đảo quyết định gộp vào Foreign Investor Securities Account (entity đã gỡ khỏi HLD 2026-10-21). HLD: FIMS_HLD_Tier2.md (T2-07). Grain = 1 NĐT NN × 1 CTCK × 1 lần ghi nhận. Domain Prefix rỗng (`Foreign Investor` không thuộc danh sách curated); entity_physical_name = full words. Nguồn không có mã nghiệp vụ riêng nên BK = ID nguồn (cùng pattern FIMS.SECURITIESCOMPANY/BANKMONI); vì insert-only nhiều lần ghi nhận cho cùng ID, Id lặp lại giữa các lần chạy, phân biệt bằng ds_etl_pcs_tms. ID, DELETED, DateCreated, CreatedBy, DateModified, ModifyBy, IsSynced document trong pending_design.yaml. Chưa chốt (T2-07): (a) ETL append mọi lần hay chỉ khi QUANTITY/RATE đổi; (b) SECID NVARCHAR2(100) lệch kiểu SECURITIESCOMPANY.ID NUMBER(18,2); (c) QUANTITY/RATE tổng tại CTCK hay theo mã; (d) cặp (INVESID, SECID) duy nhất khi DELETED=0 không."
