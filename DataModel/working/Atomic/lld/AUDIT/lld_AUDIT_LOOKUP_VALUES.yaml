  status: "draft"
  source_columns:
  - "AUDIT.LOOKUP_VALUES.LOOKUP_GROUP"
  comment: "Xử lí CASE WHEN LOOKUP_GROUP = 'AF_TARGET_TYPE' THEN 'AUDIT - Danh mục loại đối tượng áp dụng' WHEN LOOKUP_GROUP = 'AF_AUTHORITY' THEN 'AUDIT - Danh mục cơ quan có thẩm quyền' WHEN LOOKUP_GROUP = 'POSITION' THEN 'AUDIT - Danh mục chức vụ' WHEN LOOKUP_GROUP = 'AF_STATUS' THEN 'AUDIT - Danh mục trạng thái công ty kiểm toán' WHEN LOOKUP_GROUP = 'PROFILE_APPROVAL_STATUS' THEN 'AUDIT - Danh mục trạng thái phê duyệt hồ sơ' WHEN LOOKUP_GROUP = 'AF_AUDITOR_STATUS' THEN 'AUDIT - Danh mục trạng thái kiểm toán viên' WHEN LOOKUP_GROUP = 'AF_INSPECTION_RESULT' THEN 'AUDIT - Danh mục kết quả thanh tra/kiểm tra' WHEN LOOKUP_GROUP = 'AF_ACTION_TYPE' THEN 'AUDIT - Danh mục loại hành động' WHEN LOOKUP_GROUP = 'AF_AUDIT_ACTION' THEN 'AUDIT - Danh mục loại hình thức xử lý vi phạm' WHEN LOOKUP_GROUP = 'AF_INSPECTION_UNIT' THEN 'AUDIT - Danh mục đơn vị thanh tra/kiểm tra' WHEN LOOKUP_GROUP = 'AF_NEXT_YEAR_PROCESSING' THEN 'AUDIT - Danh mục hướng xử lý xem xét năm sau' ELSE NULL END."
  classification_context: null
  etl_derived_value: null
