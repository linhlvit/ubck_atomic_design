  notes: "Map vào Fundamental entity dùng chung Classification Value (cl_value), không giữ entity riêng — cùng pattern NHNCK/TTHC. Bảng AUDIT.LOOKUP_VALUES chứa nhiều nhóm danh mục (cột LOOKUP_GROUP); mỗi nhóm = 1 scheme (schema_code). Điều kiện lọc áp dụng cho cả bảng nguồn: LOOKUP_GROUP IN ('AF_TARGET_TYPE', 'AF_AUTHORITY', 'POSITION', 'AF_STATUS', 'PROFILE_APPROVAL_STATUS', 'AF_AUDITOR_STATUS', 'AF_INSPECTION_RESULT', 'AF_ACTION_TYPE', 'AF_AUDIT_ACTION', 'AF_INSPECTION_UNIT', 'AF_NEXT_YEAR_PROCESSING'). Mapping LOOKUP_GROUP → schema_code/schema_nm xử lí bằng CASE WHEN ghi ở comment của 2 attribute tương ứng (theo sql.txt, Data Modeler cung cấp); LOOKUP_GROUP không nằm trong CASE → NULL. schema_nm: Data Modeler giao AI điền theo ý nghĩa nhóm; nhóm không rõ nghĩa để trống (không có WHEN): AF_AUDIT_ACTION. Value set khớp chuẩn: scheme đã đăng ký ở classification_schemes.yaml theo SCHEMA_CODE=AUDIT.* — không đăng ký thêm ở lượt này. Cần chạy Level 2 consolidation (generate_entity_consolidation.py) gộp vào entity_cl_value.yaml trước khi generate ra DataModel/Atomic. 4 cột ds_* không thiết kế ở đây — ETL job tự quản lý (SCD). Các cột nguồn còn lại ghi trong pending_design.yaml."
