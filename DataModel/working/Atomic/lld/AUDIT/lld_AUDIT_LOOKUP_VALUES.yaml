  comment: "Xử lí CASE WHEN LOOKUP_GROUP = 'AF_TARGET_TYPE' THEN 'AUDIT.AF_TARGET_TYPE' WHEN LOOKUP_GROUP = 'AF_AUTHORITY' THEN 'AUDIT.AF_AUTHORITY' WHEN LOOKUP_GROUP = 'POSITION' THEN 'AUDIT.POSITION' WHEN LOOKUP_GROUP = 'AF_STATUS' THEN 'AUDIT.AF_STATUS' WHEN LOOKUP_GROUP = 'PROFILE_APPROVAL_STATUS' THEN 'AUDIT.PROFILE_APPROVAL_STATUS' WHEN LOOKUP_GROUP = 'AF_AUDITOR_STATUS' THEN 'AUDIT.AF_AUDITOR_STATUS' WHEN LOOKUP_GROUP = 'AF_INSPECTION_RESULT' THEN 'AUDIT.AF_INSPECTION_RESULT' WHEN LOOKUP_GROUP = 'AF_ACTION_TYPE' THEN 'AUDIT.AF_ACTION_TYPE' WHEN LOOKUP_GROUP = 'AF_AUDIT_ACTION' THEN 'AUDIT.AF_AUDIT_ACTION' WHEN LOOKUP_GROUP = 'AF_INSPECTION_UNIT' THEN 'AUDIT.AF_INSPECTION_UNIT' WHEN LOOKUP_GROUP = 'AF_NEXT_YEAR_PROCESSING' THEN 'AUDIT.AF_NEXT_YEAR_PROCESSING' ELSE NULL END."
