  notes: "Source thực tế: parse Document.Content->>'ThongTinNhanHoSoTuBuuChinh'\
    \ tại tầng ODS → bảng ODS AP_DOCUMENT_POSTAL_RECEIPT. Chỉ tồn tại bản ghi khi\
    \ AP_DOCUMENT.return_method_code = 2 — nếu = 0 hoặc 1, key ThongTinNhanHoSoTuBuuChinh\
    \ thường vắng mặt hoàn toàn trong JSON nguồn (không phải rỗng {}, confirmed\
    \ trên mẫu dữ liệu thực). AP_DOCUMENT_POSTAL_RECEIPT_ID = ContentItemId của\
    \ content item bưu chính (KHÁC với AP_DOCUMENT_ID). Schema thiết kế cho phép 1-N\
    \ (FK AP_DOCUMENT_ID không unique) để mở đường lưu lịch sử đổi địa chỉ về sau;\
    \ dữ liệu quan sát thực tế là 1-1. Một số trường chỉ thấy ở schema cũ:\
    \ postal_code, district_code, note — schema mới có thể NULL hoặc không\
    \ có field trong JSON."
