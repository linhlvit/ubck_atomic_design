    description: "Khóa chính (tự tăng) của bảng nguồn. BK — nguồn không có mã nghiệp vụ độc lập nào khác (TYPE là discriminator kỹ thuật, CONTENT là blob JSON, VERSION là optimistic-lock counter thay đổi theo update) — dùng PK kỹ thuật làm BK duy nhất, theo đúng pattern đã dùng cho KNT.INVOICE_DETAIL."
