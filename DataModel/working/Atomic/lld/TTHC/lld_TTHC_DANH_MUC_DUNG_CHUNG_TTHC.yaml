  notes: "Nguồn: Orchard Core ContentItem — mỗi giá trị danh mục dùng chung là\
    \ một ContentItem riêng. ODS DANH_MUC_DUNG_CHUNG_TTHC tổng hợp toàn bộ các\
    \ ContentType phân loại vào một bảng. ContentType = schema_code (phân loại\
    \ nhóm danh mục); ContentItemId = cl_code (mã giá trị, dùng làm BK trong\
    \ các entity TTHC khác). Nguồn thực: JOIN TTHC.DOCUMENT + TTHC.CONTENTITEMINDEX\
    \ (lọc ContentType thuộc danh sách scheme TTHC). 4 cột ds_* (ds_rcrd_st/\
    \ ds_rcrd_eff_dt/ds_rcrd_end_dt/ds_etl_pcs_tms) không thiết kế ở đây —\
    \ ETL job tự quản lý (SCD). Schemes sử dụng trong phân hệ TTHC:\
    \ TRANG_THAI_HO_SO, LOAI_HO_SO, LINH_VUC_TTHC, MUC_DO_TTHC, KENH_TIEP_NHAN,\
    \ CO_QUAN_XU_LY, LOAI_DOI_TUONG_NOP, DICH_VU_CHUYEN_PHAT, TINH_THANH,\
    \ QUAN_HUYEN — mỗi scheme là một ContentType riêng trên Orchard Core."
