  notes: "Atomic đọc từ ODS table CL_VALUE_TTHC. ODS table được tổng hợp tại tầng\
    \ ODS qua JOIN TTHC.DOCUMENT + TTHC.CONTENTITEMINDEX (Document.Id =\
    \ ContentItemIndex.DocumentId), lọc ContentType thuộc danh sách 10 scheme TTHC\
    \ — mỗi bản ghi ContentItemIndex phù hợp điều kiện lọc tương ứng một giá trị\
    \ danh mục. Lineage cột: ContentItemIndex.ContentItemId → cl_code (BK chính,\
    \ dùng làm FK trong các entity TTHC khác); ContentItemIndex.ContentType →\
    \ schema_code (mã nhóm phân loại); ContentItemIndex.DisplayText → cl_nm (tên\
    \ hiển thị tiếng Việt); Document.Content->{ContentType}->'MoTa'->'Text' →\
    \ description (mô tả chi tiết). 4 cột ds_* (ds_rcrd_st/ds_rcrd_eff_dt/\
    \ ds_rcrd_end_dt/ds_etl_pcs_tms) không thiết kế ở đây — ETL job tự quản lý\
    \ (SCD). Schemes sử dụng trong phân hệ TTHC: TRANG_THAI_HO_SO, LOAI_HO_SO,\
    \ LINH_VUC_TTHC, MUC_DO_TTHC, KENH_TIEP_NHAN, CO_QUAN_XU_LY,\
    \ LOAI_DOI_TUONG_NOP, DICH_VU_CHUYEN_PHAT, TINH_THANH, QUAN_HUYEN — mỗi\
    \ scheme là một ContentType riêng trên Orchard Core."
