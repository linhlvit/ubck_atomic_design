  notes: "Source thực tế: parse Document.Content->>'DoiTuongNopHoSo' tại tầng ODS\
    \ → bảng ODS DOI_TUONG_NOP_HO_SO. PK ghép (ho_so_id, doi_tuong_nop_ho_so_id)\
    \ — cùng doi_tuong_nop_ho_so_id (ContentItemId đối tượng) có thể xuất hiện\
    \ trong nhiều hồ sơ khác nhau, nên không hash từ doi_tuong_nop_ho_so_id đơn\
    \ lẻ. Hai phiên bản schema (ranh giới 07/02/2025–30/05/2025): schema cũ —\
    \ đối tượng nộp lưu đầy đủ trong bag nhúng tại root JSON, ten_hien_thi/dia_chi/\
    \ so_dien_thoai/email lấy trực tiếp từ bag; schema mới — HoSoTTHC chỉ còn\
    \ field tham chiếu ContentItemIds, không còn bag nhúng đầy đủ, email lấy từ\
    \ HoSoTTHC.DoiTuongNopHoSoEmail, SoDienThoai lấy từ HoSoTTHC.SoDienThoai.\
    \ Cảnh báo mục 3.2 bàn giao: ID tham chiếu (ContentItemIds trong HoSoTTHC)\
    \ và bag nhúng tại root là 2 nguồn ĐỘC LẬP, có thể lệch nhau — ETL phải so\
    \ khớp ID để gán vai_tro chính xác, không giả định 2 nguồn luôn khớp."
