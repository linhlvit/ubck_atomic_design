schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "TTHC"
  source_table: "AP_DOCUMENT"
  atomic_entity: "Administrative Procedure Document"
  entity_physical_name: "ap_document"
  bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Documentation"
  table_type: "Fundamental"
  group: "T1"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "ODS table AP_DOCUMENT được tổng hợp từ JOIN TTHC.DOCUMENT + TTHC.CONTENTITEMINDEX\
    \ (Document.Id = ContentItemIndex.DocumentId), lọc ContentType = 'HoSoTTHC',\
    \ parse Document.Content (JSON) tại tầng ODS. Atomic đọc từ ODS. Hai phiên bản\
    \ schema (ranh giới 07/02/2025–30/05/2025): schema cũ có bag DoiTuongNopHoSo\
    \ nhúng đầy đủ ở root, field 'Ngaytiepnhan' (chữ thường), ThanhPhanHoSo dùng\
    \ CoKhong/FileDinhKem/Yeucaubosung; schema mới không còn bag nhúng (chỉ còn\
    \ field tham chiếu ContentItemIds), field 'NgayTiepNhan' (PascalCase),\
    \ ThanhPhanHoSo dùng DaNop/Ma/ThuTuHienThi/DanhMucThanhPhanHoSo, thêm\
    \ DoiTuongNopHoSoEmail. eform lưu nguyên JSONB vì cấu trúc thay đổi hoàn toàn\
    \ theo ContentType con (Eform1, Eform17, Eform75, Eform76A, Eform85, ...) —\
    \ không ép cột cứng. return_method_code = 2 → có bản ghi\
    \ ap_document_postal_receipt liên kết; = 0 hoặc 1 → key\
    \ ThongTinNhanHoSoTuBuuChinh có thể vắng mặt hoàn toàn trong JSON (không\
    \ phải rỗng — xem mục 3.3 bàn giao). Dấu hiệu dữ liệu test/seed: Owner/\
    \ Author = null, Published = false, Eform rỗng dạng gốc."
