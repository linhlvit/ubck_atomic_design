  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Entity link/relationship thuần giữa Penalty Decision (T4) và Violation Record\
    \ (T3) — giữ làm entity Relative riêng thay vì denormalize ARRAY, theo quyết định\
    \ Data Modeler tại HLD (xem THANHTRA_HLD_Tier5.md mục 6a, THANHTRA_HLD_Overview.md\
    \ mục 7d): bảng nguồn có VERSION/DELETED phản ánh vòng đời gắn/gỡ liên kết độc\
    \ lập, không chỉ là quan hệ tĩnh. Theo cơ chế bảng link đã chuẩn hóa (SKILL.md\
    \ atomic-lld-design mục 3e, áp dụng từ lld_FMS_AGEN_FUNDS.yaml/lld_FMS_FUND_TL_PRO.yaml/lld_FMS_JOB_TL_PRO.yaml):\
    \ KHÔNG có cặp Id/Code riêng của entity — PK là composite trên 2 FK Id (Penalty\
    \ Decision Id + Violation Record Id). Domain Prefix rỗng vì entity bắc cầu 2 domain\
    \ khác nhau, không thuộc riêng nhóm nào — entity_physical_name giữ full words,\
    \ không viết tắt qua \"pd\". Quan hệ chi tiết hơn (biên bản nào gắn với hành vi/đối\
    \ tượng cụ thể nào trong quyết định) đã có sẵn qua PENALTY_DECISION_SUBJECT_BEHAVIOR.VIOLATION_RECORD_ID\
    \ (T6) — entity này chỉ phản ánh liên kết tổng quát ở mức header quyết định↔biên\
    \ bản. Audit block (CREATED_AT/LAST_MODIFIED_AT/CREATED_BY/LAST_MODIFIED_BY) và\
    \ VERSION/DELETED loại trừ khỏi Atomic — mirror quyết định đã áp dụng cho toàn\
    \ bộ phân hệ THANHTRA (xem pending_design.yaml, cùng lý do đã áp dụng cho PENALTY_DECISION/PENALTY_DECISION_CIRCUMSTANCE:\
    \ Created/Updated By là FK cross-source đến NHNCK.USERS chưa ổn định). [SỬA 2026-08-15]\
    \ Đổi tên entity thêm suffix \"Relationship\" cho nhất quán với các entity link\
    \ \"_x_\" khác trong dự án (VD Fund Management Company Employee X Investment Fund\
    \ Relationship) — theo yêu cầu Data Modeler. Hạ về draft do đổi tên/physical_name."
