  notes: "Bảng mới (DDL UAT cập nhật 2026-09) — Hình thức xử phạt bổ sung theo hành\
    \ vi trên QĐ xử phạt VPHC, cho phép 1 hành vi có N hình thức xử phạt bổ sung.\
    \ Domain Prefix rỗng vì entity link/relationship thuần bắc cầu Penalty Decision\
    \ Subject Behavior (T6) và Penalty Type (T1) — cross-tier FK bình thường, cùng\
    \ pattern PENALTY_DECISION_SUBJECT_BEHAVIOR đang dùng cho FK tới Penalty Type.\
    \ Bảng nguồn chỉ có 2 FK, không có business attribute nào khác (thỏa điều kiện\
    \ 'pure link' — Rule 3e atomic-lld-design) → PK composite trên 2 FK Id, KHÔNG\
    \ có cặp Id/Code riêng cho entity, cùng cơ chế đã áp dụng cho Penalty Decision\
    \ X Violation Record Relationship (PENALTY_DECISION_VIOLATION_RECORD cũng có ID\
    \ kỹ thuật riêng trong nguồn nhưng vẫn dùng composite PK, không tạo Id/Code riêng,\
    \ do không có business attribute nào khác ngoài 2 FK). Cân nhắc quan hệ với cột\
    \ SUPPLEMENTARY_PENALTY (CLOB, free-text) hiện có trên PENALTY_DECISION_SUBJECT_BEHAVIOR\
    \ — DDL KHÔNG đánh dấu DEPRECATED cột này, xem THANHTRA_HLD_Tier6.md mục T6-03:\
    \ giữ nguyên SUPPLEMENTARY_PENALTY trên Atomic, chưa loại bỏ, chờ Data Modeler\
    \ xác nhận có trùng lặp/mâu thuẫn không. Audit block + PK kỹ thuật ID loại trừ\
    \ khỏi Atomic — mirror quyết định đã áp dụng cho toàn bộ phân hệ THANHTRA (xem\
    \ pending_design.yaml)."
