  notes: "Hồ sơ xử lý vi phạm hành chính (VPHC). Grain: 1 dòng = 1 hồ sơ VPHC. Cả\
    \ 2 FK đoàn đều nullable — case có thể phát sinh từ COMPLAINT/MEDIA/OTHER. Hạ\
    \ về draft (2026-08-07) để bổ sung SOURCE_UNIT_ID — phát hiện qua post_check_source_coverage.py.\
    \ Không dùng crosswalk sang NHNCK.UNITS vì Source Category Code có giá trị STOCK_EXCHANGE/VSDC/OTHER_SUPERVISION\
    \ (đơn vị ngoài UBCKNN) song song INTERNAL_UNIT — SOURCE_UNIT_ID polymorphic theo\
    \ Source Category Code, không đảm bảo luôn trỏ NHNCK.UNITS như các UNIT_ID khác\
    \ của THANHTRA."
