schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "THANHTRA"
  source_table: "VIOLATION_RECORD"
  atomic_entity: "Violation Record"
  entity_physical_name: "violation_record"
  bcv_core_object: "Business Activity"
  bcv_concept: "[Business Activity] Conduct Violation"
  table_type: "Fundamental"
  group: "T3"
  design_status: "draft"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Biên bản vi phạm hành chính (VPHC). FK đến INSPECTION_TEAM và EXAMINATION_TEAM là suy luận (không formal FK trong BRD) — cả 2 nullable. Grain: 1 dòng = 1 biên bản VPHC. BK nullable khi status=DRAFT. Hạ về draft (2026-08-07) để bổ sung RECORD_NUMBER/RECORDER_UNIT_ID/RECEIPT_STATUS/VIEWED_AT/DOWNLOADED_AT/UPLOADED_SIGNED_AT/ASSIGNED_SIGNER_NAME/ASSIGNED_SIGNER_ID/ASSIGNED_LEADER_SIGNER_ID/ASSIGNED_LEADER_SIGNER_NAME/CREATED_BY_BAN_ROLE/SIGNING_FLOW — phát hiện qua post_check_source_coverage.py. RECORDER_UNIT_ID mô tả nguồn ghi \"(eCAT)\" — TBD, cần Data Modeler/BA xác nhận ý nghĩa (tương tự NHNCK.DEPARTMENTS.ECATALOG_ID). Bổ sung cột mới từ DDL UAT (2026-09): Email Sent Timestamp/SMS Sent Timestamp (EMAIL_SENT_AT/SMS_SENT_AT) — cùng pattern per-channel notification timestamp đã dùng ở lld_THANHTRA_PENALTY_DECISION_SUBJECT.yaml, khác với Sent Timestamp (SENT_AT) hiện có là mốc gửi biên bản chung. Sửa lỗi FK identity_and_access_management_user (2026-09): Signed By/First Signed By/Forwarded By Officer Code trước đây source_columns lặp lại chính cột ID kỹ thuật (SIGNED_BY/FIRST_SIGNED_BY/FORWARDED_BY) — đã sửa sang crosswalk IAM.USERS.USERNAME đúng chuẩn. Assigned Signer/Assigned Leader Signer Officer Code trước đây map nhầm giá trị Name (ASSIGNED_SIGNER_NAME/ASSIGNED_LEADER_SIGNER_NAME) vào field đặt tên Code — đã tách đúng thành attribute Name riêng + thêm Code thật qua crosswalk USERNAME."
