    \ xử phạt chính (1:1), không biểu diễn được quan hệ N:N 'hình thức xử phạt bổ\
    \ sung' theo hành vi vi phạm (mô tả cột PENALTY_TYPE_ID nguồn) — nên giữ thành\
    \ entity link riêng. Bảng nguồn chỉ có 2 FK + audit/technical (thỏa 'pure link'\
    \ — Rule 3e atomic-lld-design) → PK composite trên 2 FK Id, KHÔNG có cặp Id/Code\
    \ riêng cho entity. Domain Prefix rỗng (không có cụm curated trong rule_domain_prefix_abbreviations.csv\
    \ khớp 'Violation Behavior'). Cả 2 FK đều là ID kỹ thuật nên cần ETL crosswalk\
    \ sang CODE của bảng cha trước khi hash_id(). Audit block (CREATED_AT/BY, LAST_MODIFIED_AT/BY),\
    \ VERSION, DELETED và PK kỹ thuật ID loại trừ khỏi Atomic — mirror quyết định\
    \ toàn phân hệ THANHTRA (xem pending_design.yaml). Cần đồng bộ HLD (Overview 7a/7d/7f,\
    \ Tier 3) và atomic_entities.yaml sau khi Data Modeler duyệt."
