  notes: "Thiết kế theo mẫu PENALTY_DECISION_SUBJECT_BEHAVIOR_SUPPLEMENTARY. Thay\
    \ đổi so với HLD cũ (7d: pure junction denormalize vào Violation Behavior qua\
