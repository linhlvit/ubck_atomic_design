  notes: "Gộp với IDS.VIOLATION_REPORT vào cùng entity Violation Report per HLD Tier3\
    \ xác nhận (mục 6/7a). Nguồn không có PK nghiệp vụ rõ ràng — cột RN_ (row number,\
    \ PK kỹ thuật) bị loại (xem pending_design.yaml); dùng cột ID (NUMBER(19,0), không\
    \ đánh dấu PK trong BRD nhưng đóng vai trò tương đương ID của VIOLATION_REPORT)\
    \ làm BK. Financial Report Template Id/Code (đổi tên từ Disclosure Form Definition\
    \ Id/Code, 2026-08-05) nay hash trực tiếp từ FORM_CD (mã nghiệp vụ có sẵn tại\
    \ bảng này) thay vì join qua FORMS_ID kỹ thuật — theo yêu cầu Data Modeler (2026-07-14);\
    \ FORMS_ID không còn dùng, xem pending_design.yaml. Attribute Code Snapshot (từng\
    \ denormalize FORM_CD) đã xóa — trùng lặp với Code chính thức. Đổi tên entity\
    \ từ \"Public Company Violation Report\" (2026-08-05, theo yêu cầu tường minh\
    \ Data Modeler)."
