    \ của VIOLATION_REPORT) làm BK. Disclosure Form Definition Id/Code nay hash trực\
    \ tiếp từ FORM_CD (mã nghiệp vụ có sẵn tại bảng này) thay vì join qua FORMS_ID\
    \ kỹ thuật — theo yêu cầu Data Modeler (2026-07-14); FORMS_ID không còn dùng,\
    \ xem pending_design.yaml. Attribute Disclosure Form Definition Code Snapshot\
    \ (từng denormalize FORM_CD) đã xóa — trùng lặp với Code chính thức."
