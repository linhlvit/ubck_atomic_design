  notes: "3 loại giấy tờ/chứng chỉ của kiểm toán viên (Involved Party Individual),\
    \ theo yêu cầu Data Modeler (2026-09-05, phát hiện AF_AUDITOR_PROFILES là bảng\
    \ IP nhưng thiếu thiết kế shared entity — trước đây giữ denormalized tại lld_IDS_AF_AUDITOR_PROFILES.yaml):\
    \ CITIZEN_ID (Số CCCD, từ IDENTITY_NO — nguồn mô tả rõ là CCCD nên KHÔNG dùng\
    \ default NATIONAL_ID như AF_LEGAL_REPRESENTATIVE), PRACTITIONER_LICENSE (Số GCN\
    \ đăng ký hành nghề kiểm toán, từ PRACTICE_CERT_NO/PRACTICE_CERT_ISSUE_DATE),\
    \ AUDITOR_CERTIFICATE (Số chứng chỉ kiểm toán viên, từ AUDIT_CERT_NO/AUDIT_CERT_ISSUE_DATE\
    \ — value mới bổ sung vào classification_schemes.yaml scheme IP_ALT_ID_TYPE).\
    \ Header (Involved Party Id/Code/Source System Code) chỉ xuất hiện 1 lần — đúng\
    \ chuẩn shared entity dùng chung dự án (xem lld_SCMS_SC_FIRM_INFO_IP_Alt_Identification.yaml)."
