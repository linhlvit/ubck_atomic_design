  notes: "ID kỹ thuật loại khỏi model — COL_CD (mã cột) → Financial Report Column\
    \ Template Code (BK duy nhất), Id hash từ Code. Audit block (CREATED_BY/CREATED_DATE/UPDATED_BY/UPDATED_DATE)\
    \ loại bỏ — mirror quyết định đã áp dụng cho toàn phân hệ IDS (xem pending_design.yaml,\
    \ lld_IDS_REPORT_CATALOG.yaml). Table Type = Fundamental theo quyết định tường\
    \ minh Data Modeler (HLD Tier2.md 6a, 2026-08-05) dù còn FK đến Financial Report\
    \ Catalog — khớp pattern override đã áp dụng cho nhiều entity Tier 2/3 khác trong\
    \ dự án."
