  notes: "Shared entity với SCMS.AUDIT_FIRM (cùng atomic_entity Audit Firm, xem lld_SCMS_AUDIT_FIRM.yaml)\
    \ — cần Level 2 Entity Consolidation sau khi cả 2 nguồn approved. ADDRESS →\
    \ Involved Party Postal Address (1 địa chỉ, type HEAD_OFFICE — khớp pattern SCMS).\
    \ PHONE_NO/FAX_NO/WEBSITE → Involved Party Electronic Address (không có EMAIL\
    \ tại nguồn IDS, khác SCMS có thêm kênh EMAIL). BUSINESS_REG_NO/ELIGIBILITY_CERT_NO\
    \ → Involved Party Alternative Identification (2 block: BUSINESS_LICENSE,\
    \ BUSINESS_ELIGIBILITY_LICENSE — theo yêu cầu Data Modeler, xem pending_design.yaml).\
    \ ID kỹ thuật (auto-increment) loại khỏi model — AUDIT_FIRM_CD (mã nghiệp vụ)\
    \ → Audit Firm Code (BK duy nhất), Id hash từ Code. Thiết kế lại theo DDL\
    \ Source/DDL UAT 1/GMS_AUDIT_UAT_schema.txt (bảng AF_PROFILES đã bị xóa khỏi\
    \ manifest ở commit 7759ecfc — phục hồi + cập nhật chuẩn hash gạch dưới hiện tại)."
