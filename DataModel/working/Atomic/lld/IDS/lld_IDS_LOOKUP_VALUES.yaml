ORT_ROW/COL_TYPE' WHEN LOOKUP_GROUP = 'REPORT_SCOPE' THEN 'IDS.REPORT_SCOPE_TYPE' WHEN LOOKUP_GROUP = 'REPORT_PERIOD_TYPE' THEN 'IDS.REPORT_PERIOD_TYPE' WHEN LOOKUP_GROUP = 'FINANCIAL_STATEMENT_COMPONENT' THEN 'IDS.FINANCIAL_STATEMENT_COMPONENT_TYPE' WHEN LOOKUP_GROUP = 'RF_C_DATA_TYPE' THEN 'IDS.RF_C_DATA_TYPE' WHEN LOOKUP_GROUP = 'RF_R_DATA_TYPE' THEN 'IDS.RF_R_DATA_TYPE' WHEN LOOKUP_GROUP = 'SO_OFFERING_METHOD' THEN 'IDS.SO_OFFERING_METHOD' WHEN LOOKUP_GROUP = 'SO_DISTRIBUTION_METHOD' THEN 'IDS.SO_DISTRIBUTION_METHOD' WHEN LOOKUP_GROUP = 'SO_SECURITY_TYPE' THEN 'IDS.SO_SECURITY_TYPE' WHEN LOOKUP_GROUP = 'RESTRICTION_TYPE' THEN 'IDS.RESTRICTION_TYPE' WHEN LOOKUP_GROUP = 'PUB_COM_LISTING_ACTION_TYPE' THEN 'IDS.STOCK_LISTING_ACTION_TYPE' WHEN LOOKUP_GROUP = 'EXCHANGE' THEN 'IDS.EXCHANGE_CODE' WHEN LOOKUP_GROUP = 'QUARTER_CODE' THEN 'IDS.PERIOD_QUARTER_TYPE' WHEN LOOKUP_GROUP = 'VIOLATION_STATUS' THEN 'IDS.VIOLATION_SUBMISSION_STATUS' WHEN LOOKUP_GROUP = 'VIOLATION_TYPE' THEN 'IDS.VIOLATION_REPORT_TYPE' WHEN LOOKUP_GROUP = 'VIOLATION_SUBTYPE' THEN 'IDS.VIOLATION_REPORT_SUBTYPE' WHEN LOOKUP_GROUP = 'VIOLATION_TRIGGER_POINT' THEN 'IDS.VIOLATION_TRIGGER_POINT' WHEN LOOKUP_GROUP = 'DAY_TYPE' THEN 'IDS.DAY_TYPE' ELSE NULL END."
