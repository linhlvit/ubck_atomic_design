 WHEN LOOKUP_GROUP = 'RELATIONSHIP_TYPE' THEN 'IDS - Danh mục loại quan hệ' WHEN LOOKUP_GROUP = 'IDENTITY_TYPE' THEN 'IDS - Danh mục loại giấy tờ định danh' WHEN LOOKUP_GROUP = 'ENTITY_TYPE' THEN 'IDS - Danh mục loại hình thực thể pháp lý' WHEN LOOKUP_GROUP = 'EDUCATION_LEVEL' THEN 'IDS - Danh mục trình độ học vấn' WHEN LOOKUP_GROUP = 'REPORT_ROW_TYPE' THEN 'IDS - Danh mục loại hàng trong báo cáo tài chính' WHEN LOOKUP_GROUP = 'REPORT_SCOPE' THEN 'IDS - Danh mục phạm vi báo cáo' WHEN LOOKUP_GROUP = 'REPORT_PERIOD_TYPE' THEN 'IDS - Danh mục loại kỳ báo cáo' WHEN LOOKUP_GROUP = 'FINANCIAL_STATEMENT_COMPONENT' THEN 'IDS - Danh mục thành phần báo cáo tài chính' WHEN LOOKUP_GROUP = 'RF_C_DATA_TYPE' THEN 'IDS - Danh mục kiểu dữ liệu của cột trong báo cáo tài chính' WHEN LOOKUP_GROUP = 'RF_R_DATA_TYPE' THEN 'IDS - Danh mục kiểu dữ liệu của hàng trong báo cáo tài chính' WHEN LOOKUP_GROUP = 'SO_OFFERING_METHOD' THEN 'IDS - Danh mục phương thức chào bán' WHEN LOOKUP_GROUP = 'SO_DISTRIBUTION_METHOD' THEN 'IDS - Danh mục phương thức phân phối' WHEN LOOKUP_GROUP = 'SO_SECURITY_TYPE' THEN 'IDS - Danh mục loại chứng khoán' WHEN LOOKUP_GROUP = 'RESTRICTION_TYPE' THEN 'IDS - Danh mục loại đối tượng hạn chế' WHEN LOOKUP_GROUP = 'PUB_COM_LISTING_ACTION_TYPE' THEN 'IDS - Danh mục loại hành động niêm yết của công ty đại chúng' WHEN LOOKUP_GROUP = 'EXCHANGE' THEN 'IDS - Danh mục sàn giao dịch' WHEN LOOKUP_GROUP = 'QUARTER_CODE' THEN 'IDS - Danh mục quý' WHEN LOOKUP_GROUP = 'VIOLATION_STATUS' THEN 'IDS - Danh mục trạng thái gửi báo cáo vi phạm' WHEN LOOKUP_GROUP = 'VIOLATION_TYPE' THEN 'IDS - Danh mục loại báo cáo vi phạm' WHEN LOOKUP_GROUP = 'VIOLATION_SUBTYPE' THEN 'IDS - Danh mục loại hạng mục của báo cáo vi phạm' WHEN LOOKUP_GROUP = 'VIOLATION_TRIGGER_POINT' THEN 'IDS - Danh mục thời điểm kích hoạt vi phạm' WHEN LOOKUP_GROUP = 'DAY_TYPE' THEN 'IDS - Danh mục loại ngày' ELSE NULL END."
