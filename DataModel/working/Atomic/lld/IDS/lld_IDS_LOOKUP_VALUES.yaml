  notes: "Map vào Fundamental entity dùng chung Classification Value (cl_value), không giữ entity riêng — cùng pattern NHNCK/TTHC. Bảng IDS.LOOKUP_VALUES chứa nhiều nhóm danh mục (cột LOOKUP_GROUP); mỗi nhóm = 1 scheme (schema_code). Điều kiện lọc áp dụng cho cả bảng nguồn: LOOKUP_GROUP IN ('NEWS_APPROVAL_STATUS', 'NEWS_TYPE', 'ENTITY_ROLE_TYPE', 'INSPECTION_TYPE', 'INSPECTION_MODE', 'PENALIZED_SUBJECT_TYPE', 'POSITION', 'ENTERPRISE_TYPE', 'FINANCIAL_STATEMENT_TYPE', 'SECURITIES_TYPE', 'EQUITY_LISTING_EXCH', 'STATUS_IDS', 'PUBLIC_COMPANY_FORM', 'PUBLIC_COM_TYPE', 'SO_APPROVAL_STATUS', 'COMPANY_RELATIONSHIP_TYPE', 'SHAREHOLDER_TYPE', 'SO_ADMINISTRATIVE_PROCEDURE', 'SO_ADMINISTRATIVE_STATUS', 'SO_TRANSACTION_TYPE', 'RC_TYPE', 'SUB_NEWS_TYPE', 'FORM_GROUP', 'REPORT_TYPE', 'RELATIONSHIP_TYPE', 'IDENTITY_TYPE', 'ENTITY_TYPE', 'EDUCATION_LEVEL', 'REPORT_ROW_TYPE', 'REPORT_SCOPE', 'REPORT_PERIOD_TYPE', 'FINANCIAL_STATEMENT_COMPONENT', 'RF_C_DATA_TYPE', 'RF_R_DATA_TYPE', 'SO_OFFERING_METHOD', 'SO_DISTRIBUTION_METHOD', 'SO_SECURITY_TYPE', 'RESTRICTION_TYPE', 'PUB_COM_LISTING_ACTION_TYPE', 'EXCHANGE', 'QUARTER_CODE', 'VIOLATION_STATUS', 'VIOLATION_TYPE', 'VIOLATION_SUBTYPE', 'VIOLATION_TRIGGER_POINT', 'DAY_TYPE'). Mapping LOOKUP_GROUP → schema_code/schema_nm xử lí bằng CASE WHEN ghi ở comment của 2 attribute tương ứng (theo sql.txt, Data Modeler cung cấp); LOOKUP_GROUP không nằm trong CASE → NULL. schema_nm: Data Modeler giao AI điền theo ý nghĩa nhóm; nhóm không rõ nghĩa để trống (không có WHEN): RF_C_DATA_TYPE, RF_R_DATA_TYPE. Value set khớp chuẩn: scheme đã đăng ký ở classification_schemes.yaml theo SCHEMA_CODE=IDS.* — không đăng ký thêm ở lượt này. Cần chạy Level 2 consolidation (generate_entity_consolidation.py) gộp vào entity_cl_value.yaml trước khi generate ra DataModel/Atomic. 4 cột ds_* không thiết kế ở đây — ETL job tự quản lý (SCD). Các cột nguồn còn lại ghi trong pending_design.yaml."
