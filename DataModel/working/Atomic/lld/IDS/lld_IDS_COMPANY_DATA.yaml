schema_type: "lld_source_table"
schema_version: "2.0"
metadata:
  source_system: "IDS"
  source_table: "COMPANY_DATA"
  atomic_entity: "Public Company Report Submission"
  entity_physical_name: "pc_report_submission"
  bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Regulatory Report"
  table_type: "Fundamental"
  group: "T3"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: "hoang.truong"
  approved_at: "2026-08-26"
  notes: "ID kỹ thuật là BK duy nhất (không có cột mã nghiệp vụ riêng — mirror pattern\
    \ Public Company/lld_IDS_COMPANY_PROFILES.yaml) → Public Company Report Submission\
    \ Code, Id hash từ Code. Audit block (CREATED_BY/CREATED_DATE/UPDATED_BY/UPDATED_DATE)\
    \ loại bỏ — mirror quyết định đã áp dụng cho toàn phân hệ IDS (xem pending_design.yaml).\
    \ Table Type = Fundamental theo quyết định tường minh Data Modeler, khớp quyết\
    \ định lịch sử trước khi loại scope (HLD Overview 7e #13, 2026-07-23) — xem 7e\
    \ #15. ĐÃ BỔ SUNG (2026-08-08) 11 cột từng thiếu so với DDL thực tế (xem HLD Tier2.md\
    \ 6f T2-12 — BRD/IDS_Columns.csv đã reconcile trước đó): ALERT_AUDIT, SYSTEM_CD,\
    \ CLOSE_DATE, SECURITIES_OFFERING_ID (FK → pc_securities_offering, hash trực tiếp),\
    \ DISCLOSURE_TYPE (Scheme IDS_DISCLOSURE_TYPE), LEGAL_ENTITY_ID (FK → legal_entity,\
    \ hash trực tiếp), COMPANY_TENDER_OFFER_ID (FK → pc_tender_offer, hash trực tiếp),\
    \ COMPANY_TREASURY_SHARE_ID (FK → pc_treasury_share_transaction, hash trực tiếp\
    \ — sửa lại 2026-08-09 từ chỗ hash nhầm vào pc_treasury_stock_activity do entity\
    \ thật COMPANY_TREASURY_SHARES chưa được thiết kế lúc đó, xem Tier2.md 6f T2-17),\
    \ APPROVER_USER_ID/APPROVER_USER_NAME (mirror pattern Approver User Id/Code/Name\
    \ Snapshot đã dùng ở lld_IDS_SECURITIES_OFFERING_RESULT.yaml, status=pending do\
    \ chưa xác nhận join key IAM.USERS), FLATTENED_FLG. 2 cột SYSTEM_CD và CLOSE_DATE\
    \ không có mô tả nguồn (blank cả IDS_Columns.csv lẫn DDL UAT) — ý nghĩa suy luận,\
    \ cần Data Modeler xác nhận trước go-live (xem comment từng attribute). CHƯA XỬ\
    \ LÝ (2026-08-08): Data Modeler xác nhận bump Tier 2→3 (khớp lịch sử thiết kế\
    \ cũ trước khi loại scope) do nay có FK đến Public Company Securities Offering\
    \ (Tier 3). group đổi T2→T3; entity đã chuyển từ IDS_HLD_Tier2.md (6a + 6f T2-12)\
    \ sang IDS_HLD_Tier3.md; manifest.yaml đồng bộ group=T3. design_status revert\
    \ về draft để chờ review lại toàn bộ (không chỉ 11 cột mới)."
