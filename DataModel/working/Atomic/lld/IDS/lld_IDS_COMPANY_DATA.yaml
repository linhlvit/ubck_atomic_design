  approved_by: null
  approved_at: null
  notes: "ID kỹ thuật là BK duy nhất (không có cột mã nghiệp vụ riêng — mirror pattern\
    \ Public Company/lld_IDS_COMPANY_PROFILES.yaml) → Public Company Report Submission\
    \ Code, Id hash từ Code. BRD hiện tại (brd_IDS_COMPANY_DATA.yaml, 30 cột) thiếu\
    \ 11 cột đã có trên DDL thực tế (Source/DDL UAT 1/GMS_IDS_UAT_schema.txt, 41 cột):\
    \ ALERT_AUDIT, SYSTEM_CD, CLOSE_DATE, SECURITIES_OFFERING_ID (FK), DISCLOSURE_TYPE,\
    \ LEGAL_ENTITY_ID (FK), COMPANY_TENDER_OFFER_ID (FK), COMPANY_TREASURY_SHARE_ID\
    \ (FK), APPROVER_USER_ID, APPROVER_USER_NAME, FLATTENED_FLG — thiết kế lần này\
    \ chỉ dùng cột đã có trong BRD (xem HLD Tier2.md 6f T2-12). Khuyến nghị chạy source-survey\
    \ reconcile trước khi entity này chuyển sang approved — 4 FK thiếu có thể đưa\
    \ entity lên Tier 3. Audit block (CREATED_BY/CREATED_DATE/UPDATED_BY/UPDATED_DATE)\
    \ loại bỏ — mirror quyết định đã áp dụng cho toàn phân hệ IDS (xem pending_design.yaml).\
    \ Table Type = Fundamental theo quyết định tường minh Data Modeler, khớp quyết\
    \ định lịch sử trước khi loại scope (HLD Overview 7e #13, 2026-07-23) — xem 7e\
    \ #15."
