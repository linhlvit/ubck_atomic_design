metadata:
  source_system: "IDS"
  source_table: "REP_DATA"
  atomic_entity: "Unstructured Financial Report Value"
  entity_physical_name: "ufr_value"
  bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Regulatory Report"
  table_type: "Classification"
  group: "T4"
  design_status: "approved"
  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "ID kỹ thuật là BK duy nhất (không có cột mã nghiệp vụ riêng — mirror pattern\
    \ fr_value/lld_IDS_DATA.yaml) → Unstructured Financial Report Value Code, Id hash\
    \ từ Code. Cùng vai trò với Financial Report Value (DATA, T2) nhưng cho họ REP_FORMS/REP_ROW/REP_COLUMN\
    \ (Unstructured Financial Report/Row/Column) thay vì REPORT_CATALOG/RROW/RCOL.\
    \ Khác với DATA.ROW_CD/COL_CD (denormalized text, không phải FK), REP_DATA.REP_ROW_ID/REP_COL_ID\
    \ lưu đúng ID kỹ thuật của REP_ROW/REP_COLUMN — mà chính ID kỹ thuật đó lại là\
    \ BK (Code) của 2 entity này (quyết định Data Modeler 2026-08-27, xem lld_IDS_REP_ROW.yaml/lld_IDS_REP_COLUMN.yaml)\
    \ → hash trực tiếp, không cần crosswalk qua bảng danh mục. Tương tự REP_FORM_ID\
    \ → unstructured_financial_report (BK cũng là ID kỹ thuật REP_FORMS). Audit block\
    \ (CREATED_BY/CREATED_DATE/UPDATED_BY/UPDATED_DATE)\
    \ loại bỏ — mirror quyết định đã áp dụng cho toàn phân hệ IDS (xem pending_design.yaml).\
    \ Domain Prefix \"Unstructured Financial Report\" mở rộng từ 3 sang 4 entity (quyết\
    \ định 2026-08-27 trước đây ghi rõ chỉ áp dụng REP_FORMS/REP_ROW/REP_COLUMN) —\
    \ cần Data Modeler xác nhận (xem IDS_HLD_Overview.md 7e #24, IDS_HLD_Tier4.md\
    \ 6f T4-04). Legal Entity Id/Public Company Report Submission Id là soft-FK (không\
    \ tagged key:FK trong BRD) — cần Data Modeler xác nhận constraint thực tế tại\
    \ nguồn và ý nghĩa nghiệp vụ khi Legal Entity Id cùng khác NULL với Public Company\
    \ Id (xem IDS_HLD_Tier4.md 6f T4-05/T4-06). Data Value chọn domain Currency Amount\
    \ để nhất quán với fr_value.Data Value (mirror pattern), dù mô tả nguồn không\
    \ xác nhận là tiền tệ (\"cả số; tỷ lệ\") — đã xác nhận đúng (Data Modeler 2026-09-05).\
    \ Nullable áp dụng chung: null khi kiểu dữ liệu là Text (giá trị thật lưu ở Text\
    \ Value), và có thể null cả khi kiểu là Number nếu ô báo cáo bị bỏ trống — không\
    \ giới hạn duy nhất ở trường hợp Text. ĐẢO NGƯỢC 2026-09-15 (theo yêu cầu tường\
    \ minh Data Modeler): Table Type Fundamental → Classification; bỏ chữ \"Template\"\
    \ khỏi tên các FK attribute trỏ tới REP_FORMS/REP_ROW/REP_COLUMN (3 cặp Id/Code),\
    \ theo đúng việc đổi tên 3 entity đó (xem atomic_entities.yaml)."
