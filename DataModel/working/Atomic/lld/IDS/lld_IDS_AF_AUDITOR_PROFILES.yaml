  notes: "Grain = Involved Party (Individual) — theo Bước 4, tách IDENTITY_NO, PRACTICE_CERT_NO/ISSUE_DATE,\
    \ AUDIT_CERT_NO/ISSUE_DATE ra shared entity Involved Party Alternative Identification\
    \ (3 block: CITIZEN_ID, PRACTITIONER_LICENSE, AUDITOR_CERTIFICATE — xem lld_IDS_AF_AUDITOR_PROFILES_IP_Alt_Identification.yaml).\
    \ Trước đây giữ denormalized do nhầm lẫn \"không có type-code scheme\" — IDENTITY_NO\
    \ mô tả rõ là CCCD (không ambiguous như AF_LEGAL_REPRESENTATIVE), PRACTICE_CERT_NO/AUDIT_CERT_NO\
    \ là 2 loại giấy tờ/chứng chỉ khác nhau nên đều xác định được type. Sửa 2026-09-05."
