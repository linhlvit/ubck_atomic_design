  version: "1.0"
  designed_by: null
  designed_at: null
  reviewed_by: null
  reviewed_at: null
  approved_by: null
  approved_at: null
  notes: "Promote từ Classification Value (scheme IDS_INDUSTRY_CATEGORY, nay deprecated)\
    \ lên Atomic entity thật — xem IDS_HLD_Tier1.md 6f T1-06/T1-07/T1-09. Table Type\
    \ = Relative theo quyết định tường minh của Data Modeler (khác rule mặc định Common→Classification\
    \ Value), cùng pattern Classification ECAT Business Line (ECAT) và Disclosure\
    \ Form Definition (IDS.FORMS) — cả 2 đều self-referencing cùng Tier 1. Self-reference\
    \ PARENT_ID lưu ID kỹ thuật của bản ghi cha (không phải INDUSTRY_CD) — ETL phải\
    \ join PARENT_ID → IDS.CATEGORIES.ID để lấy INDUSTRY_CD cha rồi hash, giống pattern\
    \ IDS.FORMS.PARENT_ID. PK kỹ thuật ID loại khỏi model hoàn toàn — chỉ dùng nội\
    \ bộ để resolve self-reference (xem pending_design.yaml). BK dùng INDUSTRY_CD\
    \ (mã nghiệp vụ), Id hash từ chính INDUSTRY_CD theo rule 3e hiện hành (2026-07-13)\
    \ — khác với Classification SCMS Firm Status (hash từ ID kỹ thuật, quyết định\
    \ cũ trước rule 3e). CREATED_DATE/UPDATED_DATE/CREATED_BY/UPDATED_BY loại bỏ hoàn\
    \ toàn khỏi Atomic entity — mirror quyết định \"loại bỏ audit block khỏi Atomic\
    \ entity phân hệ IDS\" đã áp dụng cho toàn bộ lld_IDS_*.yaml khác (xem remove_ids_audit_block.py\
    \ + pending_design.yaml), KHÔNG dùng pattern Cross-source FK IAM User pending\
    \ như EVALUATIONS.APPROVED_BY/NOTIFICATIONS.LOGIN_ID (business role field, không\
    \ phải generic audit block). SYSTEM_CD (T1-08, mô tả gốc trống) dùng lại scheme\
    \ IDS_SYSTEM_CD đã đăng ký từ IDS.FORMS.SYSTEM_CD — cùng ý nghĩa (hệ thống con\
    \ trong IDS), chưa xác nhận giá trị thực tế. ACTIVE_FLG (mô tả gốc \"Chọn\") và\
    \ STATUS_FLG (mô tả gốc rõ 1=Active/0=Inactive) map 1:1 thành 2 Boolean riêng\
    \ — tên cột và mô tả không khớp nhau (ACTIVE_FLG tên gợi ý active nhưng mô tả\
    \ là cờ chọn UI, STATUS_FLG tên gợi ý trạng thái nhưng mô tả rõ active/inactive)\
    \ — không coi là trùng lặp, cần Data Modeler xác nhận ý nghĩa ACTIVE_FLG trước\
    \ go-live (bổ sung Điểm cần xác nhận T1-10)."
