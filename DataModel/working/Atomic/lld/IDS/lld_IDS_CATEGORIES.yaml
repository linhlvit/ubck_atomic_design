  notes: "Shared entity với ECAT.BUSINESS_LINE_LEVEL_1/BUSINESS_LINE_LEVEL_2 (đã có,\
    \ xem lld_ECAT_BUSINESS_LINE_LEVEL_1.yaml/_2.yaml) — gộp theo quyết định tường\
    \ minh của Data Modeler (2026-07-17), xem IDS_HLD_Tier1.md T1-13 / IDS_HLD_Overview.md\
    \ mục 7e #12. Khác ECAT (2 bảng tách theo cấp), IDS.CATEGORIES gộp cả 2 cấp trong\
    \ 1 bảng, tự tham chiếu qua PARENT_ID — cấp (Level 1/2) suy ra từ PARENT_ID IS\
    \ NULL/NOT NULL thay vì tên bảng nguồn. BK dùng INDUSTRY_CD (mã nghiệp vụ), Id\
    \ hash từ chính INDUSTRY_CD — nhất quán pattern ECAT. Loại bỏ khỏi mapping: ID\
    \ (PK kỹ thuật, chỉ dùng nội bộ để resolve self-ref PARENT_ID → INDUSTRY_CD, không\
    \ map — xem pending_design.yaml). Audit block (CREATED_BY/CREATED_DATE/UPDATED_BY/UPDATED_DATE)\
    \ loại bỏ hoàn toàn khỏi Atomic — mirror quyết định đã áp dụng cho REPORT_CATALOG/REPORT_EXTENSIONS\
    \ (IDS) và SCMS, xem pending_design.yaml."
