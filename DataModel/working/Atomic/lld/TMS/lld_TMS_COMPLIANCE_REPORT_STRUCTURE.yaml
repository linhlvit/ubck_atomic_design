  notes: "Bảng ODS (không có BRD — phát sinh từ tầng ODS theo yêu cầu Data Modeler 2026-11-15, nguồn 'TMS.xlsx' + note_logic_ods_tms_report_cho_atomic_20261111.md; chỉnh 2026-11-16). Không có DDL trong Source/*.txt nên data type nguồn không khai báo — cần profile trước ETL; domain chọn theo ý nghĩa mô tả cột. Chỉ map cột 'Map? = có' trong TMS.xlsx. Không thiết kế technical fields ds_* và cột kỹ thuật ODS theo tiền lệ ODS-origin FMS 2026-11-07 (chờ Data Modeler xác nhận, HLD TMS Tier1 T1-12). Grain: 1 dòng = 1 cột (chỉ tiêu) của 1 biểu mẫu báo cáo tuân thủ (luồng: STG compliance_report_form_template ⋈ compliance_report_template, bung dòng header đầu tiên của table_header_layout → ODS ods_tms_report, truncate + insert toàn bộ mỗi lần chạy → ATM SCD2). Hash_id = hash(FORM_CODE, COLUMN_CODE) theo quyết định Data Modeler 2026-11-16 (không gồm TEMPLATE_CODE). Table Type = Relative theo TMS.xlsx dù chưa có FK Atomic (HLD T1-08)."
