  notes: "Bảng ODS (không có BRD — phát sinh từ tầng ODS theo yêu cầu Data Modeler 2026-11-15, nguồn 'TMS.xlsx' + note_logic_ods_tms_report_cho_atomic_20261111.md; chỉnh 2026-11-16). Không có DDL trong Source/*.txt nên data type nguồn không khai báo — cần profile trước ETL; domain chọn theo ý nghĩa mô tả cột. Chỉ map cột 'Map? = có' trong TMS.xlsx. Không thiết kế technical fields ds_* và cột kỹ thuật ODS theo tiền lệ ODS-origin FMS 2026-11-07 (chờ Data Modeler xác nhận, HLD TMS Tier1 T1-12). Grain: 1 dòng = 1 giá trị của 1 cột (ô) trong 1 dòng dữ liệu của 1 lần nộp (luồng: STG compliance_report_data ⋈ compliance_report_form ⋈ compliance_report_master ⋈ compliance_report_form_template, bung ROW_DATA → ODS ods_tms_report_value, truncate + insert toàn bộ mỗi lần chạy → ATM Upsert theo hash_id). Hash_id = hash(FORM_CODE, COLUMN_CODE, ROW_INDEX, SUBMISSION_DT) theo quyết định Data Modeler 2026-11-16; khóa không có đơn vị nộp/kỳ báo cáo nên 2 lần nộp cùng biểu mẫu trong cùng ngày sẽ trùng hash (HLD Tier2 T2-01). Table Type = Classification theo TMS.xlsx (ETL Upsert theo hash_id, tiền lệ FMS dr_value; HLD T2-02)."
