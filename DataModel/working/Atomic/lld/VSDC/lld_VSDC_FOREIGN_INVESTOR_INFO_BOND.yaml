  notes: "Thiết kế lại 2026-11-22: bảng nguồn VSDC.FOREIGN_INVESTOR_INFO đã tách thành 4 bảng theo loại chứng khoán (FOREIGN_INVESTOR_INFO_BOND / _FUND_CERTIFICATE / _OTHER_SECURITIES / _STOCK; DDL PROD prod_staging.vsdc_stg) — cả 4 cùng map vào entity Foreign Ownership Information (giữ nguyên tên entity, table_type, BCV so với LLD cũ). Mapping theo for_vsdc.txt. Nguồn: BRD/Source/VSDC/brd_VSDC_FOREIGN_INVESTOR_INFO_FOREIGN_INVESTOR_INFO_BOND.yaml. Domain Prefix: không có (Data Modeler 2026-10-18). Không đăng ký Classification Value scheme cho 3 phân hệ VSDC/HNX/HOSE — các cột phân loại giữ Text. Id hash từ Business Key (mã chứng khoán của bảng nguồn tương ứng); BK không gồm kỳ báo cáo nên Id lặp lại giữa các kỳ snapshot. Các cột kỹ thuật ds_snpst_dt/ds_etl_pcs_tms và metadata nạp file (_batch_id, _source_*, _file_*, _row_number, _sheet_name) không khai báo trong LLD; ghi vào pending_design.yaml. Entity gộp 4 bảng nguồn — phân biệt qua src_stm_code; cột chỉ có ở 1 bảng nguồn sẽ NULL ở các bảng còn lại, union tại bước Entity Consolidation. Cột REMAINING_SHARES_FOREIGN_CAN_HOLD của bảng cũ không còn ở nguồn và không có trong for_vsdc.txt → bỏ attribute Remaining Foreign Holding Quantity."
