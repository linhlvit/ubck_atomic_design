    \ — xem ECAT_HLD_Tier1.md). Loại bỏ khỏi mapping: ID (chỉ dùng nội bộ để resolve\
    \ FK, không map — BK dùng STABLE_ID), IDX_* (không phải cột thật), CREATED_AT/UPDATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_BY_ID/UPDATED_BY_NAME\
    \ (audit kỹ thuật), OLD_ID (con trỏ kỹ thuật). Giữ 1:1 (không gộp): EFFECTIVE/ACTIVE/DELETED\
    \ (3 indicator riêng), VERSION, DISPLAY_LABEL, ACTIVE_REASON, DELETED_REASON."
