  notes: "Thiết kế lại (regenerate) 2026-07-18 sau khi đối chiếu Source/ECAT_Columns.csv\
    \ bản cập nhật (reconcile) — phát hiện DISTRICT_OLD thực ra CÓ cột EFFECTIVE và\
    \ DELETED_REASON (bản khảo sát trước đây ghi nhận nhầm là thiếu 2 cột này), cùng\
    \ cột mới ID_SYNC (loại trừ, kỹ thuật lineage BTC sync). Quận/huyện cũ (pre-2025)\
    \ — cấp hành chính bị bỏ hoàn toàn sau sáp nhập, không có successor tương ứng\
    \ ở Geographic Area hiện hành. DISTRICT_OLD vẫn không có cột NAME_EN (khác PROVINCE_OLD/WARD_OLD).\
    \ Loại bỏ: ID/STABLE_ID/OLD_ID/ID_SYNC (kỹ thuật, BK dùng CODE), IDX_* (không\
    \ phải cột thật, xem pending_design.yaml), PROVINCE_OLD_VERSION_ID (cache version\
    \ kỹ thuật, xem pending_design.yaml). CREATED_AT/UPDATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_BY_ID/UPDATED_BY_NAME\
    \ map vào audit block chuẩn — FK Staff Id/Code status=pending vì Regulatory Authority\
    \ Staff (ECAT.UBCK_STAFF) là Tier 3, chưa thiết kế."
