    \ riêng. Loại bỏ: ID/STABLE_ID/OLD_ID/ID_SYNC (kỹ thuật, BK dùng CODE), IDX_*\
    \ (không phải cột thật, xem pending_design.yaml), REGION_VERSION_ID/COUNTRY_VERSION_ID\
    \ (cache version kỹ thuật, xem pending_design.yaml). CREATED_AT/UPDATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_BY_ID/UPDATED_BY_NAME\
    \ map vào audit block chuẩn — FK Staff Id/Code status=pending vì Regulatory Authority\
    \ Staff (ECAT.UBCK_STAFF) là Tier 3, chưa thiết kế."
