  notes: "Gộp với BUSINESS_LINE_LEVEL_1 thành 1 Atomic entity self-referencing \"\
    Classification Business Line\" (ECAT_HLD_Tier1.md, T1-07). LEVEL_2 là cấp con\
    \ — Parent Business Line Id/Code map từ PARENT_LINE_ID (theo Source/ECAT_Columns.csv:\
    \ PARENT_LINE_ID lưu trực tiếp STABLE_ID của bản ghi cha — \"Stable Id ngành nghề\
    \ cấp 1\", không cần join qua ID như REGION.COUNTRY_ID). PARENT_LINE_VERSION_ID\
    \ (lưu ID phiên bản kỹ thuật cụ thể của bản ghi cha, không phải STABLE_ID) loại\
    \ khỏi mapping — resolve điểm T1-08, xem pending_design.yaml. BK dùng CODE (mã\
    \ nghiệp vụ), không dùng ID/STABLE_ID. Loại bỏ khỏi mapping: ID (chỉ dùng nội\
    \ bộ để resolve FK, không map), OLD_ID (con trỏ kỹ thuật), CREATED_AT/UPDATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_BY_ID/UPDATED_BY_NAME\
    \ (audit kỹ thuật, cùng cách xử lý với COUNTRY/REGION). Giữ 1:1 (không gộp): EFFECTIVE/ACTIVE/DELETED\
    \ (3 indicator riêng — theo T1-04, nhất quán COUNTRY/REGION), VERSION, DISPLAY_LABEL,\
    \ ACTIVE_REASON, DELETED_REASON."
