  notes: "[MỚI 2026-10-29] Theo yêu cầu Data Modeler: thiết kế ECAT.ADMINISTRATIVE_PROCEDURE (Danh mục Thủ tục hành chính - TTHC) thành entity Classification ECAT Administrative Procedure, cùng pattern Classification ECAT Department. Map toàn bộ cột nghiệp vụ; loại trừ PK kỹ thuật, cột versioning, cờ trạng thái và audit (ghi trong pending_design.yaml, chờ Data Modeler xác nhận — xem HLD Tier1 mục 6f T1-07). Nguồn có cơ chế version (ID theo từng version, STABLE_ID xuyên version): BK = CODE, ETL chỉ nạp dòng hiện hành (DELETED = 0, EFFECTIVE = 1, VERSION lớn nhất theo CODE). FEE_UNIT_CURRENCY_ID là FK suy luận (fk_src: inferred) tới CURRENCY.ID — cần Data Modeler xác nhận. Các bảng con ADMINISTRATIVE_PROCEDURE_COMPONENT / _COMPONENT_MAPPING vẫn ngoài scope."
