  notes: "Tỉnh/thành phố cũ (pre-2025) — đỉnh của phân cấp Geographic Area Old, không\
    \ có parent nội bộ (Parent Geographic Area Old Id luôn NULL). Có 2 FK cross-entity\
    \ sang Geographic Area: Region Geographic Area Id/Code (anchor lên Region — Region/Country\
    \ dùng chung cho cả 2 hệ cũ/mới, không có bản \"_OLD\" riêng) và Successor Geographic\
    \ Area Id/Code (map sang PROVINCE_NEW tương ứng sau sáp nhập 2025). COUNTRY_ID\
    \ trên bảng nguồn denormalized qua REGION_ID — không map riêng. Loại bỏ: ID, IDX_*,\
    \ CREATED_AT/UPDATED_AT/CREATED_BY_*/UPDATED_BY_*, OLD_ID, REGION_VERSION_ID/COUNTRY_VERSION_ID/PROVINCE_NEW_VERSION_ID\
    \ (cache version kỹ thuật)."
