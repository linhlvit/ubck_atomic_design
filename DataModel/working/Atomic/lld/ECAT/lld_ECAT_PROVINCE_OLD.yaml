  notes: "Thiết kế lại (regenerate) 2026-07-18 sau khi đối chiếu Source/ECAT_Columns.csv bản cập nhật (reconcile) — phát hiện cột mới ID_SYNC (loại trừ, kỹ thuật lineage BTC sync). Tỉnh/thành phố cũ (pre-2025) — đỉnh của phân cấp Geographic Area Old, không có parent nội bộ (Parent Geographic Area Old Id luôn NULL). Có 2 FK cross-entity sang Geographic Area: Region Geographic Area Id/Code (anchor lên Region — Region/Country dùng chung cho cả 2 hệ cũ/mới, không có bản \"_OLD\" riêng) và Successor Geographic Area Id/Code (map sang PROVINCE_NEW tương ứng sau sáp nhập 2025). COUNTRY_ID trên bảng nguồn denormalized qua REGION_ID — không map riêng. Loại bỏ: ID/STABLE_ID/OLD_ID/ID_SYNC (kỹ thuật, BK dùng CODE), IDX_* (không phải cột thật, xem pending_design.yaml), REGION_VERSION_ID/COUNTRY_VERSION_ID/PROVINCE_NEW_VERSION_ID (cache version kỹ thuật, xem pending_design.yaml). [2026-11-13] Theo yêu cầu Data Modeler: bỏ thiết kế các cột EFFECTIVE, ACTIVE, DELETED, EFFECTIVE_START_DATE, EFFECTIVE_END_DATE, CREATED_BY_ID, CREATED_BY_NAME, UPDATED_BY_ID, UPDATED_BY_NAME khỏi Atomic (ghi trong pending_design.yaml); bỏ luôn 6 attribute audit-by Staff Id/Code/Name (Created/Updated); giữ Created/Updated Timestamp. [2026-11-13] Theo yêu cầu Data Modeler (đợt 2): bỏ thiết kế thêm các cột ACTIVE_REASON, DELETED_REASON, CREATED_AT, UPDATED_AT khỏi Atomic (ghi trong pending_design.yaml). [2026-11-13] Theo yêu cầu Data Modeler (đợt 3): bỏ thiết kế thêm cột VERSION khỏi Atomic (ghi trong pending_design.yaml)."
