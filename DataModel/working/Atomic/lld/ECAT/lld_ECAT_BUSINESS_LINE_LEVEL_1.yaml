  notes: "Gộp với BUSINESS_LINE_LEVEL_2 thành 1 Atomic entity self-referencing \"\
    Classification Business Line\" (ECAT_HLD_Tier1.md, T1-07 — Table Type = Relative\
    \ theo quyết định tường minh của Data Modeler, không theo rule mặc định Common→Classification\
    \ Value). LEVEL_1 là cấp cao nhất — Parent Business Line Id/Code = NULL. BK dùng\
    \ CODE (mã nghiệp vụ, không dùng ID/STABLE_ID) — nhất quán với Geographic Area\
    \ (COUNTRY/REGION) cùng Tier 1. Loại bỏ khỏi mapping: ID (chỉ dùng nội bộ để resolve\
    \ FK, không map), OLD_ID (con trỏ kỹ thuật), CREATED_AT/UPDATED_AT/CREATED_BY_ID/CREATED_BY_NAME/UPDATED_BY_ID/UPDATED_BY_NAME\
    \ (audit kỹ thuật, cùng cách xử lý với COUNTRY/REGION). Giữ 1:1 (không gộp): EFFECTIVE/ACTIVE/DELETED\
    \ (3 indicator riêng — theo T1-04, nhất quán COUNTRY/REGION), VERSION, DISPLAY_LABEL,\
    \ ACTIVE_REASON, DELETED_REASON."
