schema_type: "atomic_entities"
schema_version: "1.0"
entities:
- bcv_core_object: "Business Activity"
  bcv_concept: "[Business Activity] Conduct Violation"
  atomic_entity: "Securities Practitioner Conduct Violation"
  table_type: "Fundamental"
  description: "Vi phạm pháp luật hoặc hành chính của người hành nghề chứng khoán\
    \ được ghi nhận kèm quyết định xử lý. Mỗi dòng = 1 sự kiện vi phạm insert-only.\
    \ FK đến Practitioner và Decision."
  source_table: "NHNCK.VIOLATIONS"
  status: "approved"
- bcv_core_object: "Business Activity"
  bcv_concept: "[Business Activity] Business Activity"
  atomic_entity: "Securities Practitioner Professional Training Class Enrollment"
  table_type: "Fundamental"
  description: "Đăng ký tham gia và kết quả học tập của người hành nghề tại một khóa\
    \ đào tạo chuyên môn. Ghi nhận điểm thi, kết quả đạt/không đạt và trạng thái ghi\
    \ danh."
  source_table: "NHNCK.SPECIALIZATION_COURSE_DETAILS"
  status: "approved"
- bcv_core_object: "Communication"
  bcv_concept: "[Communication] Financial Market Order"
  atomic_entity: "Securities Order"
  table_type: "Fact Append"
  description: "Toàn bộ lifecycle của từng lệnh giao dịch chứng khoán trên HOSE và\
    \ HNX. Mỗi dòng = 1 event lệnh (new/modify/cancel). Gộp ORDER_BOOK_HOSE + ORDER_BOOK_HNX,\
    \ phân biệt qua market_id_code và src_stm_code."
  source_table: "ORDERTRADE.ORDER_BOOK_HOSE, ORDERTRADE.ORDER_BOOK_HNX"
  status: "approved"
- bcv_core_object: "Communication"
  bcv_concept: "[Communication] Assessment"
  atomic_entity: "Securities Practitioner Qualification Examination Assessment"
  table_type: "Fundamental"
  description: "Đợt thi sát hạch cấp CCHN do UBCKNN tổ chức. Ghi nhận thời gian đăng\
    \ ký và thi, địa điểm, hình thức nộp hồ sơ, quyết định công nhận kết quả và phí\
    \ thi."
  source_table: "NHNCK.EXAM_SESSIONS"
  status: "approved"
- bcv_core_object: "Communication"
  bcv_concept: "[Communication] Assessment"
  atomic_entity: "Securities Practitioner Qualification Examination Assessment Result"
  table_type: "Fundamental"
  description: "Kết quả thi sát hạch của từng thí sinh trong một đợt thi. Ghi nhận\
    \ điểm thi luật, điểm chuyên môn, kết quả từng phần và kết quả tổng thể. FK đến\
    \ Exam Assessment và Practitioner."
  source_table: "NHNCK.EXAM_DETAILS"
  status: "approved"
- bcv_core_object: "Condition"
  bcv_concept: "[Condition] Financial Charge"
  atomic_entity: "Securities Practitioner Qualification Examination Assessment Fee"
  table_type: "Fundamental"
  description: "Biểu phí thi sát hạch quy định cho từng loại CCHN trong từng đợt thi\
    \ (Condition). Phân biệt với License Application Fee là phí thực tế thu từng hồ\
    \ sơ (Transaction)."
  source_table: "NHNCK.EXAM_SESSION_FEES"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Gov. Registration Document"
  atomic_entity: "Securities Practitioner License Application"
  table_type: "Fundamental"
  description: "Hồ sơ đăng ký chứng chỉ hành nghề chứng khoán. Ghi nhận loại đăng\
    \ ký, loại hồ sơ, trạng thái, ngày nộp, CCHN liên quan và kết quả thi. FK đến\
    \ Practitioner và Officer phụ trách."
  source_table: "NHNCK.APPLICATIONS"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Education Certificate"
  atomic_entity: "Securities Practitioner License Application Education Certificate\
    \ Document"
  table_type: "Fundamental"
  description: "Chứng chỉ hoặc bằng chuyên môn đào tạo đính kèm trong hồ sơ đăng ký\
    \ CCHN. Ghi nhận loại chuyên môn, file đính kèm, trạng thái thẩm định và cán bộ\
    \ thẩm định."
  source_table: "NHNCK.APPLICATION_SPECIALIZATIONS"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Gov. Registration Document"
  atomic_entity: "Securities Practitioner License Application Re-Exam Request"
  table_type: "Fundamental"
  description: "Liên kết theo dõi chu trình thi lại — hồ sơ gốc, kết quả thi trượt\
    \ và hồ sơ đăng ký thi lại mới (nullable nếu chưa nộp). FK đến License Application\
    \ (×2) và Exam Assessment Result."
  source_table: "NHNCK.APPLICATION_RE_EXAMS"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Gov. Registration Document"
  atomic_entity: "Securities Practitioner License Certificate Document"
  table_type: "Fundamental"
  description: "Chứng chỉ hành nghề chứng khoán được cấp cho người hành nghề. Ghi\
    \ nhận số CCHN, loại, ngày cấp, trạng thái và 3 quyết định liên quan (cấp/thu\
    \ hồi/hủy). FK đến Practitioner."
  source_table: "NHNCK.CERTIFICATE_RECORDS"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Gov. Registration Document"
  atomic_entity: "Securities Practitioner License Decision Document"
  table_type: "Fundamental"
  description: "Quyết định hành chính do UBCKNN ban hành liên quan đến CCHN — cấp,\
    \ thu hồi, hủy CCHN hoặc công nhận kết quả thi. Ghi nhận số quyết định, loại,\
    \ ngày ký và người ký."
  source_table: "NHNCK.DECISIONS"
  status: "approved"
- bcv_core_object: "Documentation"
  bcv_concept: "[Documentation] Employer Registration"
  atomic_entity: "Securities Practitioner Organization Employment Report"
  table_type: "Fact Append"
  description: "Báo cáo của tổ chức về tình trạng làm việc của người hành nghề. Mỗi\
    \ dòng = 1 lần nộp báo cáo insert-only. Ghi nhận loại báo cáo, trạng thái làm\
    \ việc, chức vụ và ngày báo cáo."
  source_table: "NHNCK.ORGANIZATION_REPORTS"
  status: "approved"
- bcv_core_object: "Event"
  bcv_concept: "[Event] Training Course"
  atomic_entity: "Securities Practitioner Professional Training Class"
  table_type: "Fundamental"
  description: "Khóa học chuyên môn bổ sung kiến thức cho người hành nghề chứng khoán.\
    \ Master entity của khóa học — ghi nhận mã, tên, loại chuyên môn, thời gian và\
    \ địa điểm thi."
  source_table: "NHNCK.SPECIALIZATION_COURSES"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "Shared Entity"
  atomic_entity: "Involved Party Alternative Identification"
  table_type: "Fundamental"
  description: "Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ\
    \ chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ\
    \ 1 nguồn."
  source_table: "NHNCK.PROFESSIONALS, IAM.USERS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "Shared Entity"
  atomic_entity: "Involved Party Electronic Address"
  table_type: "Fundamental"
  description: "Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).\
    \ Mỗi dòng = 1 kênh liên lạc từ 1 nguồn."
  source_table: "NHNCK.UNITS, NHNCK.ORGANIZATIONS, NHNCK.USERS, NHNCK.PROFESSIONALS,\
    \ IAM.USERS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "Shared Entity"
  atomic_entity: "Involved Party Postal Address"
  table_type: "Fundamental"
  description: "Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường\
    \ trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn."
  source_table: "NHNCK.UNITS, NHNCK.ORGANIZATIONS, NHNCK.PROFESSIONALS, IAM.USERS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual"
  atomic_entity: "Regulatory Authority Officer"
  table_type: "Fundamental"
  description: "Cán bộ, chuyên viên UBCKNN có tài khoản trong hệ thống NHNCK. Ghi\
    \ nhận thông tin nhân sự, đơn vị/phòng ban phụ trách và trạng thái tài khoản.\
    \ Không lưu thông tin xác thực (PASSWORD)."
  source_table: "NHNCK.USERS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Organization"
  atomic_entity: "Regulatory Authority Organization Unit"
  table_type: "Fundamental"
  description: "Đơn vị và phòng ban thuộc UBCKNN — cấu trúc cây self-referencing DEPARTMENT\
    \ → UNIT. Phân biệt bằng Organization Unit Type Code (ETL-derived). Dùng chung\
    \ làm FK tổ chức nội bộ."
  source_table: "NHNCK.UNITS, NHNCK.DEPARTMENTS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Organization"
  atomic_entity: "Securities Organization Reference"
  table_type: "Fundamental"
  description: "Tổ chức tham gia thị trường chứng khoán được UBCKNN quản lý (CTCK,\
    \ QLQ, Ngân hàng, v.v.). Ghi nhận mã tổ chức, tên, loại hình, vốn điều lệ và trạng\
    \ thái hoạt động."
  source_table: "NHNCK.ORGANIZATIONS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual"
  atomic_entity: "Securities Practitioner"
  table_type: "Fundamental"
  description: "Người hành nghề chứng khoán được UBCKNN quản lý. Ghi nhận thông tin\
    \ nhân thân và trạng thái hành nghề."
  source_table: "NHNCK.PROFESSIONALS, NHNCK.PROFESSIONAL_HISTORIES"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual Employment Status"
  atomic_entity: "Securities Practitioner Employment Status"
  table_type: "Fundamental"
  description: "Giai đoạn làm việc của người hành nghề tại một tổ chức chứng khoán.\
    \ Ghi nhận tổ chức, chức vụ, phòng ban, ngày bắt đầu và ngày kết thúc (NULL =\
    \ đang làm việc)."
  source_table: "NHNCK.PROFESSIONAL_WORK_HISTORIES"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual Employment Status"
  atomic_entity: "Securities Practitioner License Application Employment Experience"
  table_type: "Fundamental"
  description: "Kinh nghiệm làm việc khai báo trong hồ sơ đăng ký CCHN. Ghi nhận tổ\
    \ chức, thời gian làm việc, chức vụ, phòng ban, số BHXH và thông tin hợp đồng\
    \ lao động."
  source_table: "NHNCK.APPLICATION_EXPERIENCES"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual"
  atomic_entity: "Securities Practitioner License Application Snapshot"
  table_type: "Fundamental"
  description: "Snapshot thông tin nhân thân của người đăng ký tại thời điểm nộp hồ\
    \ sơ. Denormalize toàn bộ trường định danh, địa chỉ và liên lạc từ Practitioner.\
    \ Loại bỏ USERNAME/PASSWORD."
  source_table: "NHNCK.APPLICATION_PROFESSIONALS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Individual Employment Status"
  atomic_entity: "Securities Practitioner Professional Training History"
  table_type: "Fundamental"
  description: "Lịch sử đào tạo và bồi dưỡng của người hành nghề chứng khoán. Ghi\
    \ nhận thời gian, địa điểm đào tạo, chuyên ngành, khen thưởng và kỷ luật. FK đến\
    \ Practitioner."
  source_table: "NHNCK.PROFESSIONAL_TRAININGS"
  status: "approved"
- bcv_core_object: "Involved Party"
  bcv_concept: "[Involved Party] Involved Party Relationship"
  atomic_entity: "Securities Practitioner Related Party"
  table_type: "Fundamental"
  description: "Quan hệ thân nhân của người hành nghề chứng khoán. Ghi nhận loại quan\
    \ hệ, họ tên, năm sinh, địa chỉ, nghề nghiệp và số giấy tờ định danh của người\
    \ thân."
  source_table: "NHNCK.PROFESSIONAL_RELATIONSHIPS"
  status: "approved"
- bcv_core_object: "Location"
  bcv_concept: "[Location] Geographic Area"
  atomic_entity: "Geographic Area"
  table_type: "Fundamental"
  description: "Đơn vị địa lý dùng làm FK tham chiếu: quốc gia/quốc tịch (COUNTRY),\
    \ vùng/miền (REGION), tỉnh/thành phố mới/cũ (PROVINCE/PROVINCE_OLD), quận/huyện\
    \ cũ (DISTRICT_OLD), phường/xã mới/cũ (WARD/WARD_OLD). Phân biệt bằng geographic_area_type_code.\
    \ Hỗ trợ song song bộ danh mục pre- và post-sáp nhập hành chính 2025."
  source_table: "NHNCK.COUNTRIES, NHNCK.PROVINCES, NHNCK.DISTRICTS"
  status: "approved"
- bcv_core_object: "Transaction"
  bcv_concept: "[Event] Transaction"
  atomic_entity: "Securities Practitioner License Application Fee"
  table_type: "Fundamental"
  description: "Phí thực tế phát sinh cho hồ sơ đăng ký CCHN — phí nộp hồ sơ, phí\
    \ cấp CCHN (Transaction). Có lifecycle riêng qua trạng thái thanh toán. Phân biệt\
    \ với Examination Assessment Fee (Condition)."
  source_table: "NHNCK.APPLICATION_FEES"
  status: "approved"
- bcv_core_object: "Transaction"
  bcv_concept: "[Transaction] Financial Market Transaction"
  atomic_entity: "Securities Trade"
  table_type: "Fact Append"
  description: "Từng lần khớp lệnh thành công trên HOSE và HNX. Mỗi dòng = 1 Trade\
    \ ID. Lưu đồng thời thông tin bên mua và bên bán trong cùng 1 row. FK-BK về Securities\
    \ Order qua buy/sell_scr_ordr_code."
  source_table: "ORDERTRADE.TRADE_BOOK_HOSE, ORDERTRADE.TRADE_BOOK_HNX"
  status: "approved"
- bcv_core_object: "Transaction"
  bcv_concept: "[Transaction] Financial Market Transaction"
  atomic_entity: "Security Match Log"
  table_type: "Fact Append"
  description: "Log từng lần khớp lệnh (tick-by-tick) của cổ phiếu niêm yết trong\
    \ ngày giao dịch, bao gồm giá khớp, khối lượng khớp, chiều giao dịch chủ động,\
    \ và lũy kế khối lượng/giá trị từ đầu ngày."
  source_table: "MDDS.TransLog"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Citizen Reception"
  table_type: ""
  description: "Ghi nhận buổi tiếp công dân tại UBCKNN: ngày tiếp, cán bộ tiếp, loại\
    \ đối tượng, nội dung tóm tắt, liên kết hồ sơ đơn thư nếu có."
  source_table: "ThanhTra.CITIZEN_RECEPTION"
  status: "draft"
- bcv_core_object: "Product"
  bcv_concept: "[Product] Financial Market Instrument"
  atomic_entity: "Corporate Bond Trading Snapshot"
  table_type: "Fact Snapshot"
  description: "Snapshot trạng thái giao dịch của trái phiếu doanh nghiệp niêm yết\
    \ tại sàn HNX tại một thời điểm, bao gồm giá khớp, order book thỏa thuận Outright,\
    \ thông tin đặc thù trái phiếu (kỳ hạn, lãi suất, coupon, mệnh giá, ngày phát\
    \ hành/đáo hạn)."
  source_table: "MDDS.CorpBondInfor"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Examination Annual Plan Target"
  table_type: ""
  description: "Danh sách đối tượng được đưa vào kế hoạch kiểm tra hàng năm, phân\
    \ loại theo loại đơn vị (công ty chứng khoán, quản lý quỹ, công ty đại chúng)."
  source_table: "ThanhTra.EXAMINATION_ANNUAL_PLAN_TARGET"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Examination Result Notice"
  table_type: ""
  description: "Thông báo kết quả kiểm tra chính thức: số công văn, ngày ban hành\
    \ và công bố, đối tượng kiểm tra, nội dung kết quả, kiến nghị và trạng thái thực\
    \ hiện."
  source_table: "ThanhTra.EXAMINATION_RESULT_NOTICE"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Examination Result Notice Remedial"
  table_type: ""
  description: "Từng biện pháp khắc phục yêu cầu trong thông báo kết quả kiểm tra:\
    \ nội dung chi tiết biện pháp khắc phục theo từng kết quả kiểm tra."
  source_table: "ThanhTra.EXAMINATION_RESULT_NOTICE_REMEDIAL"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Examination Team Member"
  table_type: ""
  description: "Danh sách thành viên đoàn kiểm tra: ID người dùng, tên và vai trò\
    \ trong đoàn (trưởng đoàn, kiểm tra viên, thư ký...)."
  source_table: "ThanhTra.EXAMINATION_TEAM_MEMBER"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Examination Team Target"
  table_type: ""
  description: "Danh sách đối tượng được kiểm tra trong đoàn cụ thể: 7 loại đơn vị/cá\
    \ nhân, mã tham chiếu trong hệ thống nguồn, tên đối tượng."
  source_table: "ThanhTra.EXAMINATION_TEAM_TARGET"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Identity and Access Management User"
  table_type: ""
  description: "Người dùng hệ thống IAM — thể nhân (cán bộ UBCK, cán bộ CTCK, chuyên\
    \ gia) có tài khoản đăng nhập hệ thống nghiệp vụ, tích hợp Keycloak. Lưu thông\
    \ tin danh tính, tổ chức, chứng chỉ hành nghề và người đại diện."
  source_table: "IAM.USERS"
  status: "draft"
- bcv_core_object: "Group"
  bcv_concept: "[Group] Share Index"
  atomic_entity: "Index Constituent Snapshot"
  table_type: "Fact Snapshot"
  description: "Snapshot thành phần rổ chỉ số thị trường theo ngày giao dịch — mỗi\
    \ dòng ghi nhận một cặp mã chỉ số và mã chứng khoán có mặt trong rổ chỉ số tại\
    \ ngày giao dịch tương ứng."
  source_table: "MDDS.CSIDXInfor"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Inspection Annual Plan Target"
  table_type: ""
  description: "Danh sách đối tượng được đưa vào kế hoạch thanh tra hàng năm, phân\
    \ loại theo loại đơn vị (công ty chứng khoán, quản lý quỹ, công ty đại chúng)."
  source_table: "ThanhTra.INSPECTION_ANNUAL_PLAN_TARGET"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Inspection Conclusion"
  table_type: ""
  description: "Kết luận thanh tra chính thức: số kết luận, ngày ban hành và công\
    \ bố, đối tượng thanh tra, nội dung kết luận, kiến nghị, trạng thái thực hiện\
    \ kiến nghị."
  source_table: "ThanhTra.INSPECTION_CONCLUSION"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Inspection Conclusion Remedial"
  table_type: ""
  description: "Từng biện pháp khắc phục yêu cầu trong kết luận thanh tra: nội dung\
    \ chi tiết từng kiến nghị cần thực hiện."
  source_table: "ThanhTra.INSPECTION_CONCLUSION_REMEDIAL"
  status: "draft"
- bcv_core_object: ""
  bcv_concept: ""
  atomic_entity: "Inspection Post Processing"
