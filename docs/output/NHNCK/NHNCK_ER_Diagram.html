<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>NHNCK ER Diagram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f7;display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;min-width:220px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;z-index:10}
#sidebar h1{font-size:14px;font-weight:700;padding:14px 16px 10px;color:#1e293b;border-bottom:1px solid #f1f5f9}
#search{margin:10px 12px;padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;outline:none;width:calc(100% - 24px)}
#search:focus{border-color:#6366f1}
#stats{padding:6px 16px;font-size:11px;color:#64748b;border-bottom:1px solid #f1f5f9}
#groups{overflow-y:auto;flex:1;padding:8px 0}
.grp-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;border:none;background:none;cursor:pointer;font-size:12px;color:#374151;text-align:left;transition:background .15s}
.grp-btn:hover{background:#f8fafc}
.grp-btn.active{background:#f0f2f7;font-weight:600}
.grp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.grp-count{margin-left:auto;font-size:11px;color:#94a3b8}
#controls{padding:10px 12px;border-top:1px solid #f1f5f9;display:flex;gap:6px}
.ctrl-btn{flex:1;padding:6px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;font-size:11px;cursor:pointer;color:#374151}
.ctrl-btn:hover{background:#f8fafc;border-color:#94a3b8}
#scope-toggle{padding:4px 12px;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;font-size:11px;align-items:center;color:#64748b}
#scope-toggle label{display:flex;align-items:center;gap:4px;cursor:pointer}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:#f0f2f7}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0}
#svg-layer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.card{position:absolute;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;width:220px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transition:box-shadow .15s,border-color .15s;user-select:none}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card.selected{border-color:#6366f1;box-shadow:0 4px 20px rgba(99,102,241,.25)}
.card.dimmed{opacity:.25}
.card.out-scope{border-style:dashed;border-color:#cbd5e1;opacity:.7}
.card-head{padding:8px 10px 6px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:5px}
.card-name{font-size:12px;font-weight:700;color:#1e293b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-comment{font-size:10px;color:#64748b;padding:3px 10px 4px;border-bottom:1px solid #f8fafc;line-height:1.4;min-height:20px}
.badge{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:600;color:#fff;flex-shrink:0}
.badge-scope{background:#94a3b8}.badge-brd{background:#2563eb}
.card-cols{max-height:160px;overflow-y:auto;padding:3px 0}
.col-row{display:flex;align-items:baseline;gap:5px;padding:1px 10px;font-size:11px;color:#374151;line-height:1.5}
.col-key{font-size:10px;width:14px;flex-shrink:0;color:#94a3b8}
.col-name{font-weight:500;flex-shrink:0}
.col-desc{color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.fk-line{stroke:#94a3b8;stroke-width:1.5;fill:none;transition:stroke .15s}
.fk-line.highlighted{stroke:#6366f1;stroke-width:2.5}
.fk-arrow{fill:#94a3b8;transition:fill .15s}
.fk-arrow.highlighted{fill:#6366f1}
</style>
</head>

NS","tc":"ID"},{"ft":"VERIFY_APPLICATION_STATUSES","fc":"STATUS_ID","tt":"APPLICATION_STATUSES","tc":"ID"},{"ft":"VERIFY_APPLICATION_STATUSES","fc":"PREV_STATUS_ID","tt":"APPLICATION_STATUSES","tc":"ID"},{"ft":"VERIFY_APPLICATION_STATUSES","fc":"VERIFIED_BY","tt":"USERS","tc":"ID"},{"ft":"VIOLATIONS","fc":"PROFESSIONAL_ID","tt":"PROFESSIONALS","tc":"ID"},{"ft":"VIOLATIONS","fc":"DECISION_ID","tt":"DECISIONS","tc":"ID"}]};

const GROUP_MAP = Object.fromEntries(GROUPS.map(g=>[g.key,g]));

// ── State ────────────────────────────────────────────────────────────────────
let positions = {};
let selectedTable = null;
let currentGroup = 'all';
let showOutScope = true;
let transform = {x:0, y:0, scale:1};
let savedLayout = null;

const STORAGE_KEY = 'nhnck_er_layout';
try { savedLayout = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}
if (savedLayout) positions = savedLayout.positions || {};

// ── DOM refs ─────────────────────────────────────────────────────────────────
const canvas    = document.getElementById('canvas');
const svgLayer  = document.getElementById('svg-layer');
const wrap      = document.getElementById('canvas-wrap');
const statsDiv  = document.getElementById('stats');
const searchEl  = document.getElementById('search');
const showOutEl = document.getElementById('show-out');

// ── Visible tables ───────────────────────────────────────────────────────────
function visibleTables() {
  const q = searchEl.value.trim().toLowerCase();
  return RAW.tables.filter(t => {
    if (!showOutScope && t.scope === 'out_of_scope') return false;
    if (currentGroup !== 'all' && t.group !== currentGroup) return false;
    if (q && !t.name.toLowerCase().includes(q) && !t.comment.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Force layout ─────────────────────────────────────────────────────────────
function forceLayout(tbls) {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const N = tbls.length;
  if (!N) return;

  const CARD_W = 240, CARD_H = 200;
  const cols = Math.ceil(Math.sqrt(N * W / H));
  const rows = Math.ceil(N / cols);
  const gx = Math.max(CARD_W + 40, W / cols);
  const gy = Math.max(CARD_H + 40, H / rows);

  // Initial grid positions for tables without saved position
  tbls.forEach((t, i) => {
    if (!positions[t.name]) {
      const c = i % cols, r = Math.floor(i / cols);
      positions[t.name] = {
        x: 40 + c * gx + (Math.random()-0.5)*30,
        y: 40 + r * gy + (Math.random()-0.5)*30
      };
    }
  });

  // Simple force iterations
  const names = tbls.map(t=>t.name);
  const fkSet = new Set(RAW.fks.map(f=>f.ft+':'+f.tt).concat(RAW.fks.map(f=>f.tt+':'+f.ft)));

  for (let iter=0; iter<80; iter++) {
    const forces = {};
    names.forEach(n => forces[n] = {x:0,y:0});

    // Repulsion
    for (let i=0; i<names.length; i++) for (let j=i+1; j<names.length; j++) {
      const a=positions[names[i]], b=positions[names[j]];
      const dx=b.x-a.x, dy=b.y-a.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const rep = 20000/(dist*dist);
      const fx=dx/dist*rep, fy=dy/dist*rep;
      forces[names[i]].x -= fx; forces[names[i]].y -= fy;
      forces[names[j]].x += fx; forces[names[j]].y += fy;
    }

    // Attraction for FK-connected
    RAW.fks.forEach(fk => {
      if (!positions[fk.ft]||!positions[fk.tt]) return;
      if (!names.includes(fk.ft)||!names.includes(fk.tt)) return;
      const a=positions[fk.ft],b=positions[fk.tt];
      const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
      const att=dist>300?0.08:0;
      forces[fk.ft].x+=dx*att; forces[fk.ft].y+=dy*att;
      forces[fk.tt].x-=dx*att; forces[fk.tt].y-=dy*att;
    });

    const alpha = 1-iter/80;
    names.forEach(n => {
      positions[n].x = Math.max(10, Math.min(W*3, positions[n].x + forces[n].x*alpha*0.3));
      positions[n].y = Math.max(10, Math.min(H*3, positions[n].y + forces[n].y*alpha*0.3));
    });
  }
}

// ── Render cards ──────────────────────────────────────────────────────────────
function renderCards() {
  canvas.innerHTML = '';
  const tbls = visibleTables();

  tbls.forEach(t => {
    const pos = positions[t.name] || {x:100,y:100};
    const gc  = (GROUP_MAP[t.group]||{color:'#94a3b8'}).color;

    const div = document.createElement('div');
    div.className = 'card' + (t.scope==='out_of_scope'?' out-scope':'');
    div.dataset.name = t.name;
    div.style.cssText = `left:${pos.x}px;top:${pos.y}px`;

    const badgeScope = t.scope==='out_of_scope'
      ? `<span class="badge badge-scope">out</span>` : '';
    const badgeBrd = t.brd ? `<span class="badge badge-brd">BRD</span>` : '';

    const colsHtml = t.cols.map(c => {
      const icon = c.key==='PK'?'🔑':c.key==='FK'?'🔗':c.key==='PK/FK'?'🔑':'&nbsp;';
      return `<div class="col-row">
        <span class="col-key">${icon}</span>
        <span class="col-name">${c.name}</span>
        <span class="col-desc">${c.desc}</span>
      </div>`;
    }).join('');

    div.innerHTML = `
      <div class="card-head">
        <span class="grp-dot" style="background:${gc}"></span>
        <span class="card-name" title="${t.name}">${t.name}</span>
        ${badgeBrd}${badgeScope}
      </div>
      <div class="card-comment">${t.comment||''}</div>
      <div class="card-cols">${colsHtml}</div>`;

    // Click to select
    div.addEventListener('click', e => { e.stopPropagation(); selectTable(t.name); });

    // Drag
    let dragging=false, ox=0, oy=0;
    div.addEventListener('mousedown', e => {
      if (e.button!==0) return;
      dragging=true; ox=e.clientX-pos.x*transform.scale; oy=e.clientY-pos.y*transform.scale;
      div.style.zIndex=100;
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      positions[t.name].x = (e.clientX-ox)/transform.scale;
      positions[t.name].y = (e.clientY-oy)/transform.scale;
      div.style.left=positions[t.name].x+'px';
      div.style.top =positions[t.name].y+'px';
      drawLines();
    });
    document.addEventListener('mouseup', ()=>{ if(dragging){ dragging=false; div.style.zIndex=''; saveLayout(); } });

    canvas.appendChild(div);
  });

  updateStats(tbls);
  drawLines();
}

// ── FK Lines ──────────────────────────────────────────────────────────────────
function drawLines() {
  svgLayer.innerHTML = '';
  const tbls = new Set(visibleTables().map(t=>t.name));
  const CARD_W = 220;

  RAW.fks.forEach(fk => {
    if (!tbls.has(fk.ft)||!tbls.has(fk.tt)) return;
    const a=positions[fk.ft], b=positions[fk.tt];
    if (!a||!b) return;

    const tx=transform.x, ty=transform.y, sc=transform.scale;
    const x1=(a.x+CARD_W/2)*sc+tx, y1=(a.y+60)*sc+ty;
    const x2=(b.x+CARD_W/2)*sc+tx, y2=(b.y+60)*sc+ty;
    const cx1=x1+(x2-x1)*0.4, cy1=y1;
    const cx2=x1+(x2-x1)*0.6, cy2=y2;

    const isHL = selectedTable && (fk.ft===selectedTable||fk.tt===selectedTable);
    const clr  = isHL?'#6366f1':'#cbd5e1';
    const sw   = isHL?2.5:1.5;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`);
    path.setAttribute('stroke',clr);
    path.setAttribute('stroke-width',sw);
    path.setAttribute('fill','none');
    path.setAttribute('opacity', isHL?'1':'0.5');

    // Arrow
    const dx=x2-cx2, dy=y2-cy2, angle=Math.atan2(dy,dx);
    const al=8;
    const ax1=x2-al*Math.cos(angle-0.4), ay1=y2-al*Math.sin(angle-0.4);
    const ax2=x2-al*Math.cos(angle+0.4), ay2=y2-al*Math.sin(angle+0.4);
    const arrow=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arrow.setAttribute('points',`${x2},${y2} ${ax1},${ay1} ${ax2},${ay2}`);
    arrow.setAttribute('fill',clr);
    arrow.setAttribute('opacity',isHL?'1':'0.5');

    // Tooltip
    const title=document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent=`${fk.ft}.${fk.fc} → ${fk.tt}.${fk.tc}`;
    path.appendChild(title);

    svgLayer.appendChild(path);
    svgLayer.appendChild(arrow);
  });
}

// ── Select table ──────────────────────────────────────────────────────────────
function selectTable(name) {
  if (selectedTable===name) { selectedTable=null; }
  else { selectedTable=name; }
  document.querySelectorAll('.card').forEach(c => {
    const n=c.dataset.name;
    c.classList.remove('selected','dimmed');
    if (selectedTable) {
      if (n===selectedTable) c.classList.add('selected');
      else {
        const connected=RAW.fks.some(f=>(f.ft===selectedTable&&f.tt===n)||(f.tt===selectedTable&&f.ft===n));
        if (!connected) c.classList.add('dimmed');
      }
    }
  });
  drawLines();
}

// ── Pan & Zoom ────────────────────────────────────────────────────────────────
let panning=false, panStart={x:0,y:0};
wrap.addEventListener('mousedown', e=>{ if(e.button===1||(e.button===0&&e.altKey)){ panning=true; panStart={x:e.clientX-transform.x,y:e.clientY-transform.y}; e.preventDefault(); } });
document.addEventListener('mousemove', e=>{ if(!panning) return; transform.x=e.clientX-panStart.x; transform.y=e.clientY-panStart.y; applyTransform(); });
document.addEventListener('mouseup',  ()=>{ panning=false; });
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect=wrap.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const delta=e.deltaY>0?0.9:1.1;
  transform.scale=Math.min(3,Math.max(0.15,transform.scale*delta));
  transform.x=mx-(mx-transform.x)*delta;
  transform.y=my-(my-transform.y)*delta;
  applyTransform();
  drawLines();
},{passive:false});
wrap.addEventListener('click', e=>{ if(e.target===wrap||e.target===canvas){ selectedTable=null; document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected','dimmed')); drawLines(); } });

function applyTransform() {
  canvas.style.transform=`translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`;
  svgLayer.style.width=svgLayer.style.height='100%';
}

// ── Fit view ──────────────────────────────────────────────────────────────────
function fitView() {
  const tbls=visibleTables();
  if (!tbls.length) return;
  const CARD_W=220,CARD_H=250;
  const xs=tbls.map(t=>(positions[t.name]||{x:0}).x);
  const ys=tbls.map(t=>(positions[t.name]||{y:0}).y);
  const minX=Math.min(...xs),maxX=Math.max(...xs)+CARD_W;
  const minY=Math.min(...ys),maxY=Math.max(...ys)+CARD_H;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const sc=Math.min(0.95,Math.min(W/(maxX-minX+80),H/(maxY-minY+80)));
  transform.scale=sc;
  transform.x=(W-(maxX+minX)*sc)/2;
  transform.y=(H-(maxY+minY)*sc)/2;
  applyTransform();
  drawLines();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(tbls) {
  const total=tbls.length;
  const inScope=tbls.filter(t=>t.scope==='in_scope').length;
  const fkLinked=tbls.filter(t=>t.fk_linked).length;
  const brdCount=tbls.filter(t=>t.brd).length;
  statsDiv.textContent=`${total} bảng · ${inScope} in-scope · ${brdCount} BRD · ${fkLinked} có FK`;

  // Group counts
  const gcnt={};
  RAW.tables.forEach(t=>{ gcnt[t.group]=(gcnt[t.group]||0)+1; });
  document.getElementById('cnt-all').textContent=RAW.tables.length;
  GROUPS.forEach(g=>{ const el=document.getElementById('cnt-'+g.key); if(el) el.textContent=gcnt[g.key]||0; });
}

// ── Sidebar group buttons ──────────────────────────────────────────────────────
document.querySelectorAll('.grp-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentGroup=btn.dataset.group;
    document.querySelectorAll('.grp-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedTable=null;
    // Reset positions for newly visible tables that don't have positions
    const tbls=visibleTables();
    const need=tbls.filter(t=>!positions[t.name]);
    if (need.length) forceLayout(tbls);
    renderCards();
    setTimeout(fitView,50);
  });
});

// ── Search ────────────────────────────────────────────────────────────────────
searchEl.addEventListener('input', ()=>{ renderCards(); });

// ── Show out-scope toggle ──────────────────────────────────────────────────────
showOutEl.addEventListener('change', ()=>{ showOutScope=showOutEl.checked; renderCards(); });

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-layout').addEventListener('click', ()=>{
  const tbls=visibleTables();
  tbls.forEach(t=>delete positions[t.name]);
  forceLayout(tbls);
  renderCards();
  setTimeout(fitView,50);
});
document.getElementById('btn-fit').addEventListener('click', fitView);
document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob=new Blob([JSON.stringify({positions},null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'nhnck_layout.json'});
  a.click();
});

// ── Save layout ───────────────────────────────────────────────────────────────
function saveLayout() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({positions})); } catch(e){}
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  const tbls=visibleTables();
  const need=tbls.filter(t=>!positions[t.name]);
  if (need.length) forceLayout(tbls);
  renderCards();
  setTimeout(fitView,100);
}

init();
</script>
