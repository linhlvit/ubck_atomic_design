<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f7;display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;min-width:200px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sidebar h2{padding:12px 16px;font-size:14px;font-weight:700;border-bottom:1px solid #e2e8f0;color:#1e293b}
#search{padding:8px 12px;border:none;border-bottom:1px solid #e2e8f0;outline:none;font-size:13px;width:100%}
#stats{padding:8px 14px;font-size:11px;color:#64748b;border-bottom:1px solid #e2e8f0;display:flex;gap:12px}
#group-list{overflow-y:auto;flex:1;padding:6px 0}
.g-item{padding:7px 14px;cursor:pointer;font-size:12px;border-left:3px solid transparent;user-select:none;display:flex;align-items:center;gap:8px}
.g-item:hover{background:#f8fafc}
.g-item.active{background:#eff6ff;border-left-color:#4f46e5;font-weight:600}
.g-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.g-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-count{font-size:10px;color:#94a3b8;background:#f1f5f9;border-radius:10px;padding:1px 6px}
#main{flex:1;position:relative;overflow:hidden}
#toolbar{position:absolute;top:10px;left:10px;display:flex;gap:8px;z-index:10}
.tb-btn{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;color:#374151}
.tb-btn:hover{background:#f8fafc}
#canvas-wrap{width:100%;height:100%;position:relative;overflow:hidden;cursor:grab}
#canvas-wrap.grabbing{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0}
#svg-layer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.card{position:absolute;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);border:1px solid #e2e8f0;min-width:200px;max-width:300px;user-select:none;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.15)}
.card.selected{border-color:#4f46e5;box-shadow:0 0 0 2px #c7d2fe}
.card.dimmed{opacity:.3}
.card-head{padding:10px 12px 8px;border-radius:10px 10px 0 0}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600;color:#fff}
.badge-brd{background:#16a34a}
.badge-group{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500}
.card-name{font-size:13px;font-weight:700;color:#1e293b;word-break:break-all}
.card-comment{font-size:11px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-cols{border-top:1px solid #f1f5f9;padding:6px 0;max-height:200px;overflow-y:auto}
.col-row{display:flex;align-items:center;gap:5px;padding:2px 12px;font-size:11px;color:#374151}
.col-row.brd-col{background:#fef9c3}
.col-row:hover{background:#f8fafc}
.col-icon{font-size:10px;width:14px;flex-shrink:0}
.col-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-desc{font-size:10px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
/* FK tooltip */
#fk-tooltip{position:fixed;background:rgba(30,41,59,.9);color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;pointer-events:none;display:none;z-index:100;white-space:nowrap}
</style>

// ── Card creation ──────────────────────────────────────────────────────────────
function createCard(t) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.table = t.name;
  const color = groupColors[t.group] || '#888';
  const brdBadge = t.brd ? `<span class="badge badge-brd">BRD</span>` : '';
  const gBadge = `<span class="badge badge-group" style="background:${color}20;color:${color}">${t.group.split(' ')[0]}</span>`;
  const cols = (t.cols || []).map(c => {
    const icon = c.key === 'PK' ? '🔑' : c.key === 'FK' || c.key === 'PK/FK' ? '🔗' : '';
    const brdCls = c.brd ? ' brd-col' : '';
    const brdDot = c.brd ? '<span style="color:#16a34a;font-size:9px">●</span>' : '';
    return `<div class="col-row${brdCls}"><span class="col-icon">${icon}</span><span class="col-name">${c.name}</span><span class="col-desc">${c.desc||''}</span>${brdDot}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="card-head" style="background:${color}15;border-bottom:2px solid ${color}40">
      <div class="card-badges">${brdBadge}${gBadge}</div>
      <div class="card-name">${t.name}</div>
      <div class="card-comment" title="${t.comment}">${t.comment}</div>
    </div>
    <div class="card-cols">${cols}</div>`;

  // Drag
  let dragging = false, ox = 0, oy = 0;
  el.addEventListener('mousedown', e => {
    if (e.target.closest('.card-cols')) return;
    dragging = true;
    ox = e.clientX - positions[t.name].x * transform.scale;
    oy = e.clientY - positions[t.name].y * transform.scale;
    el.style.zIndex = 100;
    e.stopPropagation();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    positions[t.name].x = (e.clientX - ox) / transform.scale;
    positions[t.name].y = (e.clientY - oy) / transform.scale;
    applyPos(t.name);
    drawLines();
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; el.style.zIndex = ''; }
  });

  el.addEventListener('click', e => {
    e.stopPropagation();
    if (!dragging) selectTable(t.name);
  });

  return el;
}

// ── Canvas ─────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const svgLayer = document.getElementById('svg-layer');

tables.forEach(t => {
  const el = createCard(t);
  canvas.appendChild(el);
  cardEls[t.name] = el;
  positions[t.name] = {x: 0, y: 0};
  el.style.display = 'none';
});

function applyPos(name) {
  const el = cardEls[name];
  const p = positions[name];
  el.style.transform = `translate(${p.x}px,${p.y}px)`;
}

// ── Pan & Zoom ─────────────────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
let panning = false, px0 = 0, py0 = 0, tx0 = 0, ty0 = 0;

wrap.addEventListener('mousedown', e => {
  if (e.target !== wrap && e.target !== canvas && e.target !== svgLayer) return;
  panning = true;
  px0 = e.clientX; py0 = e.clientY;
  tx0 = transform.x; ty0 = transform.y;
  wrap.classList.add('grabbing');
  selectedTable = null;
  clearSelection();
});
document.addEventListener('mousemove', e => {
  if (!panning) return;
  transform.x = tx0 + e.clientX - px0;
  transform.y = ty0 + e.clientY - py0;
  applyTransform();
});
document.addEventListener('mouseup', () => { panning = false; wrap.classList.remove('grabbing'); });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.85 : 1.15;
  const ns = Math.min(3, Math.max(0.1, transform.scale * delta));
  transform.x = mx - (mx - transform.x) * ns / transform.scale;
  transform.y = my - (my - transform.y) * ns / transform.scale;
  transform.scale = ns;
  applyTransform();
}, {passive: false});

function applyTransform() {
  canvas.style.transform = `translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`;
  svgLayer.style.transform = `translate(${transform.x}px,${transform.y}px) scale(${transform.scale})`;
  svgLayer.style.transformOrigin = '0 0';
}

// ── FK Lines ───────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('fk-tooltip');

function getCardCenter(name) {
  const el = cardEls[name];
  const p = positions[name];
  return {x: p.x + el.offsetWidth / 2, y: p.y + el.offsetHeight / 2};
}

function getCardEdge(name, toPoint) {
  const el = cardEls[name];
  const p = positions[name];
  const cx = p.x + el.offsetWidth / 2, cy = p.y + el.offsetHeight / 2;
  const dx = toPoint.x - cx, dy = toPoint.y - cy;
  const w2 = el.offsetWidth / 2, h2 = el.offsetHeight / 2;
  const scaleX = Math.abs(dx) > 0 ? w2 / Math.abs(dx) : Infinity;
  const scaleY = Math.abs(dy) > 0 ? h2 / Math.abs(dy) : Infinity;
  const scale = Math.min(scaleX, scaleY);
  return {x: cx + dx * scale, y: cy + dy * scale};
}

function drawLines() {
  svgLayer.innerHTML = '';
  const visSet = new Set(visibleTables.map(t => t.name));
  const selNeighbors = selectedTable ? new Set(
    fks.filter(f => f.ft === selectedTable || f.tt === selectedTable).flatMap(f => [f.ft, f.tt])
  ) : null;

  fks.forEach(fk => {
    if (!visSet.has(fk.ft) || !visSet.has(fk.tt)) return;
    const from = getCardCenter(fk.ft);
    const to = getCardCenter(fk.tt);
    const fe = getCardEdge(fk.ft, to);
    const te = getCardEdge(fk.tt, from);
    const dx = te.x - fe.x, dy = te.y - fe.y;
    const cx1 = fe.x + dx * 0.4, cy1 = fe.y;
    const cx2 = te.x - dx * 0.4, cy2 = te.y;
    const highlighted = selectedTable && (fk.ft === selectedTable || fk.tt === selectedTable);
    const dimmed = selectedTable && !highlighted;
    const color = highlighted ? '#4f46e5' : '#94a3b8';
    const opacity = dimmed ? 0.15 : 0.7;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${fe.x},${fe.y} C${cx1},${cy1} ${cx2},${cy2} ${te.x},${te.y}`);
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', highlighted ? 2 : 1.2);
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', opacity);
    path.setAttribute('marker-end', `url(#arrow-${highlighted?'hi':'lo'})`);
    path.style.pointerEvents = 'stroke';
    path.style.cursor = 'pointer';
    path.addEventListener('mouseenter', e => {
      tooltip.style.display = 'block';
      tooltip.textContent = `${fk.ft}.${fk.fc} → ${fk.tt}.${fk.tc}`;
    });
    path.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 28) + 'px';
    });
    path.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    svgLayer.appendChild(path);
  });

  // Arrow markers
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  ['hi', 'lo'].forEach(k => {
    const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    m.setAttribute('id', `arrow-${k}`);
    m.setAttribute('markerWidth', '8'); m.setAttribute('markerHeight', '8');
    m.setAttribute('refX', '6'); m.setAttribute('refY', '3');
    m.setAttribute('orient', 'auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', '0,0 0,6 8,3');
    poly.setAttribute('fill', k === 'hi' ? '#4f46e5' : '#94a3b8');
    m.appendChild(poly);
    defs.appendChild(m);
  });
  svgLayer.insertBefore(defs, svgLayer.firstChild);
}

// ── Layout ─────────────────────────────────────────────────────────────────────
function forceLayout(tbls, iterations=300) {
  const names = tbls.map(t => t.name);
  const nameSet = new Set(names);
  const W = 280, H_BASE = 250;
  const REPEL = 18000, ATTRACT = 0.06, DAMP = 0.85;
  const vx = {}, vy = {};
  names.forEach(n => { vx[n] = 0; vy[n] = 0; });

  // Init positions in a grid
  const cols = Math.ceil(Math.sqrt(names.length));
  names.forEach((n, i) => {
    if (positions[n].x === 0 && positions[n].y === 0) {
      positions[n] = {x: (i % cols) * 340 + Math.random() * 20, y: Math.floor(i / cols) * 340 + Math.random() * 20};
    }
  });

  for (let iter = 0; iter < iterations; iter++) {
    const fx = {}, fy = {};
    names.forEach(n => { fx[n] = 0; fy[n] = 0; });

    // Repulsion
    for (let i = 0; i < names.length; i++) {
      for (let j = i + 1; j < names.length; j++) {
        const a = names[i], b = names[j];
        let dx = positions[b].x - positions[a].x;
        let dy = positions[b].y - positions[a].y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const f = REPEL / (dist * dist);
        fx[a] -= dx/dist*f; fy[a] -= dy/dist*f;
        fx[b] += dx/dist*f; fy[b] += dy/dist*f;
      }
    }

    // Attraction on FK edges
    fks.forEach(fk => {
      if (!nameSet.has(fk.ft) || !nameSet.has(fk.tt)) return;
      let dx = positions[fk.tt].x - positions[fk.ft].x;
      let dy = positions[fk.tt].y - positions[fk.ft].y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const ideal = W * 1.8;
      const f = ATTRACT * (dist - ideal);
      fx[fk.ft] += dx/dist*f; fy[fk.ft] += dy/dist*f;
      fx[fk.tt] -= dx/dist*f; fy[fk.tt] -= dy/dist*f;
    });

    // Apply
    names.forEach(n => {
      vx[n] = (vx[n] + fx[n]) * DAMP;
      vy[n] = (vy[n] + fy[n]) * DAMP;
      positions[n].x += vx[n];
      positions[n].y += vy[n];
      if (positions[n].x < 10) positions[n].x = 10;
      if (positions[n].y < 10) positions[n].y = 10;
    });
  }

  // Shelf for isolated nodes
  const connected = new Set(fks.filter(f => nameSet.has(f.ft) && nameSet.has(f.tt)).flatMap(f => [f.ft, f.tt]));
  const isolated = names.filter(n => !connected.has(n));
  let sx = 20, sy = 0;
  // Find max y of connected nodes
  const connectedNames = names.filter(n => connected.has(n));
  if (connectedNames.length) {
    sy = Math.max(...connectedNames.map(n => positions[n].y + 260)) + 40;
  }
  isolated.forEach((n, i) => {
    positions[n] = {x: sx, y: sy};
    sx += 250;
    if (sx > 1800) { sx = 20; sy += 200; }
  });
}

function fitView(tbls) {
  if (!tbls.length) return;
  const rect = wrap.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  tbls.forEach(t => {
    const el = cardEls[t.name];
    const p = positions[t.name];
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + el.offsetWidth);
    maxY = Math.max(maxY, p.y + el.offsetHeight);
  });
  const padX = 60, padY = 60;
  const scaleX = (W - padX*2) / (maxX - minX || 1);
  const scaleY = (H - padY*2) / (maxY - minY || 1);
  transform.scale = Math.min(Math.min(scaleX, scaleY), 1);
  transform.x = padX - minX * transform.scale;
  transform.y = padY - minY * transform.scale;
  applyTransform();
}

function setVisible(tbls, doLayout=true) {
  visibleTables = tbls;
  tables.forEach(t => {
    cardEls[t.name].style.display = 'none';
  });
  tbls.forEach(t => {
    cardEls[t.name].style.display = '';
    applyPos(t.name);
  });
  if (doLayout) {
    // Reset positions for newly shown tables
    tbls.forEach(t => { positions[t.name] = {x: 0, y: 0}; });
    forceLayout(tbls);
    tbls.forEach(t => applyPos(t.name));
  }
  requestAnimationFrame(() => {
    fitView(tbls);
    drawLines();
  });
  updateStats();
}

function updateStats() {
  const brdCount = visibleTables.filter(t => t.brd).length;
  const fkCount = fks.filter(f => visibleTables.find(t=>t.name===f.ft) && visibleTables.find(t=>t.name===f.tt)).length;
  document.getElementById('stat-show').textContent = visibleTables.length + ' bảng';
  document.getElementById('stat-brd').textContent = brdCount + ' BRD';
  document.getElementById('stat-fk').textContent = fkCount + ' FK';
}

// ── Selection ──────────────────────────────────────────────────────────────────
function clearSelection() {
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('selected', 'dimmed');
  });
  drawLines();
}

function selectTable(name) {
  selectedTable = name;
  const neighbors = new Set(fks
    .filter(f => f.ft === name || f.tt === name)
    .flatMap(f => [f.ft, f.tt]));
  neighbors.add(name);
  visibleTables.forEach(t => {
    const el = cardEls[t.name];
    el.classList.remove('selected', 'dimmed');
    if (t.name === name) el.classList.add('selected');
    else if (!neighbors.has(t.name)) el.classList.add('dimmed');
  });
  drawLines();
}

function selectGroup(g, el) {
  document.querySelectorAll('.g-item').forEach(x => x.classList.remove('active'));
  if (activeGroup === g) {
    activeGroup = null;
    setVisible(tables, true);
    return;
  }
  activeGroup = g;
  el.classList.add('active');
  const filtered = tables.filter(t => t.group === g);
  setVisible(filtered, true);
  selectedTable = null;
  clearSelection();
}

// ── Buttons ────────────────────────────────────────────────────────────────────
document.getElementById('btn-all').onclick = () => {
  document.querySelectorAll('.g-item').forEach(x => x.classList.remove('active'));
  activeGroup = null;
  setVisible(tables, true);
  selectedTable = null;
  clearSelection();
};
document.getElementById('btn-layout').onclick = () => {
  if (!visibleTables.length) return;
  visibleTables.forEach(t => { positions[t.name] = {x: 0, y: 0}; });
  forceLayout(visibleTables);
  visibleTables.forEach(t => applyPos(t.name));
  requestAnimationFrame(() => { fitView(visibleTables); drawLines(); });
};
document.getElementById('btn-fit').onclick = () => {
  fitView(visibleTables);
};
document.getElementById('canvas-wrap').onclick = e => {
  if (e.target === wrap || e.target === canvas || e.target === svgLayer) {
    selectedTable = null;
    clearSelection();
  }
};

// ── Init ───────────────────────────────────────────────────────────────────────
// Show "Quản lý CTCK" group first, then show all
setVisible(tables, true);
</script>
