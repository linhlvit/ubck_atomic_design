source: ORDERTRADE
description: "Sổ lệnh và Sổ khớp HOSE & HNX — dữ liệu giao dịch chứng khoán từ hệ thống KRX"
brd_entries:
  # UID-01 — Lệnh giao dịch (Order Lifecycle)
  - brd_id: BRD-SRC-ORDERTRADE-ORDER_BOOK_HOSE
    brd_name: "Design Atomic từ nguồn ORDERTRADE bảng ORDER_BOOK_HOSE"
    type: Theo Source
    ba_email: username@fssc.com.vn
    steward_email: username@ubck.com.vn
    content:
      table_meaning: "Sổ lệnh HOSE — ghi nhận toàn bộ lifecycle của từng lệnh giao dịch trên sàn HOSE (cổ phiếu / trái phiếu / repo). Mỗi bản ghi là một event: lệnh mới / sửa / hủy. Đối tượng trung tâm của phân hệ ORDERTRADE."
      functional_group: "UID-01 Lệnh giao dịch (Order Lifecycle)"
      scope_status: in_scope
      scope_reason: null
      table: ORDER_BOOK_HOSE
      related_tables:
        - table: ORDER_BOOK_HNX
          relation: "Gộp chung entity Securities Order — phân biệt bằng market_id"
        - table: TRADE_BOOK_HOSE
          relation: "1-N — khớp lệnh phát sinh từ lệnh này (FK qua Order Accept #)"
      notes: null
      data_volume_hint: null
      refresh_frequency: null
      ingestion:
        data_change_mode: Append
        filter_logic: "order_date = {etl_date}"
        filter_note: "Sổ lệnh HOSE — append theo ngày giao dịch, mỗi event lệnh mới/sửa/hủy"

  - brd_id: BRD-SRC-ORDERTRADE-ORDER_BOOK_HNX
    brd_name: "Design Atomic từ nguồn ORDERTRADE bảng ORDER_BOOK_HNX"
    type: Theo Source
    ba_email: username@fssc.com.vn
    steward_email: username@ubck.com.vn
    content:
      table_meaning: "Sổ lệnh HNX — tương đương ORDER_BOOK_HOSE nhưng cho sàn HNX (cổ phiếu niêm yết / UPCOM / TPCP / TP DN / phái sinh). Có thêm tính năng Iceberg order và Stop order theo chuẩn KRX."
      functional_group: "UID-01 Lệnh giao dịch (Order Lifecycle)"
      scope_status: in_scope
      scope_reason: null
      table: ORDER_BOOK_HNX
      related_tables:
        - table: ORDER_BOOK_HOSE
          relation: "Gộp chung entity Securities Order — phân biệt bằng market_id"
        - table: TRADE_BOOK_HNX
          relation: "1-N — khớp lệnh phát sinh từ lệnh này (FK qua Order Reception Number)"
      notes: null
      data_volume_hint: null
      refresh_frequency: null
      ingestion:
        data_change_mode: Append
        filter_logic: "order_date = {etl_date}"
        filter_note: "Sổ lệnh HNX — append theo ngày giao dịch"

  # UID-02 — Khớp lệnh (Trade Execution)
  - brd_id: BRD-SRC-ORDERTRADE-TRADE_BOOK_HOSE
    brd_name: "Design Atomic từ nguồn ORDERTRADE bảng TRADE_BOOK_HOSE"
    type: Theo Source
    ba_email: username@fssc.com.vn
    steward_email: username@ubck.com.vn
    content:
      table_meaning: "Sổ khớp HOSE — ghi nhận từng giao dịch khớp thành công trên HOSE. Mỗi bản ghi chứa đồng thời thông tin bên mua và bên bán. 1 Order có thể tạo ra nhiều Trade (khớp dần)."
      functional_group: "UID-02 Khớp lệnh (Trade Execution)"
      scope_status: in_scope
      scope_reason: null
      table: TRADE_BOOK_HOSE
      related_tables:
        - table: ORDER_BOOK_HOSE
          relation: "FK (Buy side) Buy - Order Accept # → Securities Order lệnh mua"
        - table: ORDER_BOOK_HOSE
          relation: "FK (Sell side) Sell - Order Accept # → Securities Order lệnh bán"
        - table: TRADE_BOOK_HNX
          relation: "Gộp chung entity Securities Trade — phân biệt bằng market_id"
      notes: null
      data_volume_hint: null
      refresh_frequency: null
      ingestion:
        data_change_mode: Append
        filter_logic: "trade_date = {etl_date}"
        filter_note: "Sổ khớp HOSE — append theo ngày khớp lệnh"

  - brd_id: BRD-SRC-ORDERTRADE-TRADE_BOOK_HNX
    brd_name: "Design Atomic từ nguồn ORDERTRADE bảng TRADE_BOOK_HNX"
    type: Theo Source
    ba_email: username@fssc.com.vn
    steward_email: username@ubck.com.vn
    content:
      table_meaning: "Sổ khớp HNX — tương đương TRADE_BOOK_HOSE nhưng cho sàn HNX. Bổ sung trường Spread trade legs (Execution Price of Spread First/Second) cho giao dịch phái sinh/repo có 2 vế."
      functional_group: "UID-02 Khớp lệnh (Trade Execution)"
      scope_status: in_scope
      scope_reason: null
      table: TRADE_BOOK_HNX
      related_tables:
        - table: ORDER_BOOK_HNX
          relation: "FK (Buy side) Buy Order Reception Number → Securities Order lệnh mua"
        - table: ORDER_BOOK_HNX
          relation: "FK (Sell side) Sell Order Reception Number → Securities Order lệnh bán"
        - table: TRADE_BOOK_HOSE
          relation: "Gộp chung entity Securities Trade — phân biệt bằng market_id"
      notes: null
      data_volume_hint: null
      refresh_frequency: null
      ingestion:
        data_change_mode: Append
        filter_logic: "trade_date = {etl_date}"
        filter_note: "Sổ khớp HNX — append theo ngày khớp lệnh"
