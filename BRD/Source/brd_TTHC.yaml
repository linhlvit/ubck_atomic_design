- brd_id: BRD-SRC-TTHC-WORKFLOWINDEX
  brd_name: Design Atomic từ nguồn TTHC bảng WORKFLOWINDEX
  type: Theo Source
  ba_email: username@fssc.com.vn
  steward_email: username@ubck.com.vn
  content:
    table_meaning: Workflow instance xét duyệt hồ sơ chào bán — ghi nhận từng lần chạy quy trình (WorkflowId, WorkflowStatus, CreatedUtc) gắn với hồ sơ qua CorrelationId
    functional_group: UID-02 Quy trình xét duyệt hồ sơ
    scope_status: out_of_scope
    scope_reason: null
    table: WORKFLOWINDEX
    related_tables:
    - table: CONTENTITEMINDEX
      relation: N-1 — hồ sơ chào bán gắn với workflow (qua CorrelationId = ContentItemId, chờ xác nhận T2-01)
    - table: WORKFLOWTYPEINDEX
      relation: N-1 — loại workflow (Classification Value scheme TTHC_WORKFLOW_TYPE)
    notes: 'Map vào Application Review Workflow (Business Activity/Status Review). ETL filter theo WorkflowTypeId tương ứng luồng xét duyệt chào bán — pending T2-02. Pending T2-01: xác nhận CorrelationId = ContentItemId hồ sơ. WorkflowTypeIndex đẩy vào Classification Value (D-07).'
    data_volume_hint: null
    refresh_frequency: daily
    ingestion:
      data_change_mode: Append
      filter_logic: CreatedUtc >= {etl_date}
      filter_note: Workflow instance xét duyệt — append theo ngày khởi tạo workflow
- brd_id: BRD-SRC-TTHC-DOCUMENT
  brd_name: Design Atomic từ nguồn TTHC bảng DOCUMENT
  type: Theo Source
  ba_email: username@fssc.com.vn
  steward_email: username@ubck.com.vn
  content:
    table_meaning: Raw JSON gốc của toàn bộ ContentItem — cột Content chứa JSON serialize toàn bộ nội dung chi tiết
    functional_group: UID-01 Hồ sơ chào bán chứng khoán
    scope_status: in_scope
    scope_reason: Bảng cần Parsing
    table: DOCUMENT
    related_tables:
    - table: CONTENTITEMINDEX
      relation: 1-N — Document được ContentItemIndex trỏ tới qua DocumentId
    - table: TMP_CII_ID_REMAP
      relation: 1-N — Bảng tmp cii id remap
    notes: '2026-09-30: Nguồn JSON (Content) được parse tại ODS TTHC (ODS_TTHC_DESCRIPTION.md) — ghép với ContentItemIndex để dựng AP_DOCUMENT (→ Administrative Procedure Document, parse HoSoTTHC) và AP_DOCUMENT_APPLICANT (→ Administrative Procedure Document Applicant, parse DoiTuongNopHoSo). Atomic không đọc Content JSON thô trực tiếp. Xem TTHC_HLD_Overview.md D-07.'
    data_volume_hint: null
    refresh_frequency: daily
    ingestion:
      data_change_mode: Update
      filter_logic: UpdatedAt >= {etl_date}
      filter_note: 'Cập nhật theo UPDATEDAT — VERSION là optimistic lock, bản ghi bị sửa tại chỗ trước khi publish. 2026-08-21: đổi từ Append sang Update — khớp Table Type Fundamental, đã giải quyết T1-01 (xem TTHC_HLD_Tier1.md D-06).'
