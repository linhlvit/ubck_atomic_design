source: TTHC
description: Quản lý thủ tục hành chính — Hệ thống tiếp nhận và xử lý hồ sơ đăng ký chào bán / phát hành chứng khoán theo mô hình EAV (Orchard Core / SQLite)
brd_entries:
- brd_id: BRD-SRC-TTHC-CONTENTITEMINDEX
  brd_name: Design Atomic từ nguồn TTHC bảng CONTENTITEMINDEX
  type: Theo Source
  ba_email: username@fssc.com.vn
  steward_email: username@ubck.com.vn
  content:
    table_meaning: Hồ sơ đăng ký chào bán / phát hành chứng khoán và kết quả xét duyệt (GCN / văn bản từ chối) — toàn bộ lưu trong cùng bảng ContentItemIndex, phân biệt bởi ContentType (Latest=1, Published=1)
    functional_group: UID-01 Hồ sơ chào bán chứng khoán
    scope_status: in_scope
    scope_reason: Bảng cần Parsing
    table: CONTENTITEMINDEX
    related_tables:
    - table: DOCUMENT
      relation: N-1 — nội dung JSON gốc của content item (qua DocumentId)
    - table: TEXTFIELDINDEX
      relation: 1-N — field dạng text của hồ sơ Eform (qua ContentItemId)
    - table: HTMLFIELDINDEX
      relation: 1-N — field dạng HTML của hồ sơ Eform
    - table: MULTITEXTFIELDINDEX
      relation: 1-N — field dạng đa văn bản của hồ sơ Eform
    - table: LINKFIELDINDEX
      relation: 1-N — field dạng liên kết của hồ sơ Eform
    - table: NUMERICFIELDINDEX
      relation: 1-N — field dạng số của hồ sơ Eform
    - table: DATEFIELDINDEX
      relation: 1-N — field dạng ngày của hồ sơ Eform
    - table: DATETIMEFIELDINDEX
      relation: 1-N — field dạng ngày giờ của hồ sơ Eform
    - table: TIMEFIELDINDEX
      relation: 1-N — field dạng giờ của hồ sơ Eform
    - table: BOOLEANFIELDINDEX
      relation: 1-N — field dạng boolean của hồ sơ Eform
    - table: CONTENTPICKERFIELDINDEX
      relation: 1-N — field dạng content picker của hồ sơ Eform
    - table: USERPICKERFIELDINDEX
      relation: 1-N — field dạng user picker của hồ sơ Eform
    - table: WORKFLOWINDEX
      relation: 1-N — workflow instance xét duyệt gắn với hồ sơ (qua CorrelationId)
    notes: '2026-09-30: Bảng staging trung tâm của luồng ODS TTHC (ODS_TTHC_DESCRIPTION.md) — cung cấp dữ liệu cho cả 3 bảng ODS: CLASSIFICATION_VALUE (UNION ALL theo ContentType danh mục → Classification Value), AP_DOCUMENT_APPLICANT (ContentItemId/DisplayText đối tượng nộp → Administrative Procedure Document Applicant), AP_DOCUMENT (ContentType = ''HoSoTTHC'' → Administrative Procedure Document). Entity ''Administrative Procedure Content Item Index'' (thiết kế 2026-08-21) đã bị loại bỏ; scheme generic TTHC_CONTENT_TYPE không còn dùng. Xem TTHC_HLD_Overview.md D-07.'
    data_volume_hint: null
    refresh_frequency: daily
    ingestion:
      data_change_mode: Update
      filter_logic: ModifiedUtc >= {etl_date}
      filter_note: 'Cập nhật theo thời điểm sửa đổi cuối (MODIFIEDUTC) — bắt cả bản ghi mới tạo và bản ghi bị cập nhật (đổi LATEST/PUBLISHED khi có phiên bản mới). 2026-08-21: đổi từ Append sang Update — khớp Table Type Fundamental (xem TTHC_HLD_Tier2.md D-06).'
- brd_id: BRD-SRC-TTHC-TEXTFIELDINDEX
  brd_name: Design Atomic từ nguồn TTHC bảng TEXTFIELDINDEX
  type: Theo Source
  ba_email: username@fssc.com.vn
  steward_email: username@ubck.com.vn
  content:
    table_meaning: Trường văn bản đơn (text, input-url, radios) của tờ khai Eform đã index — gộp vào Application Eform Field Value
    functional_group: UID-01 Hồ sơ chào bán chứng khoán
    scope_status: out_of_scope
    scope_reason: null
    table: TEXTFIELDINDEX
    related_tables:
    - table: CONTENTITEMINDEX
      relation: N-1 — hồ sơ Eform chứa field này (qua ContentItemId)
    notes: Gộp cùng 10 bảng *FieldIndex khác thành entity Application Eform Field Value (Fact Append). ETL UNION ALL 11 bảng, aggregate GROUP BY ContentItemId. field_data_type_code = TEXT (ETL derived). Xem D-04.
    data_volume_hint: null
    refresh_frequency: daily
    ingestion:
      data_change_mode: Append
      filter_logic: ContentItemId IN (SELECT ContentItemId FROM ContentItemIndex WHERE CreatedUtc >= '{etl_date}')
      filter_note: Field text Eform — append theo ContentItemIndex cha cùng ngày
