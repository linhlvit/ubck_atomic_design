    related_tables:
    - table: TAX_REGISTRATION_INFO
      relation: Liên kết ngầm qua TAX_CODE — không có PK/FK vật lý, không có ID tự sinh
    notes: Không tạo Atomic entity riêng — grain = 1 địa chỉ theo loại của 1 taxpayer, map thẳng vào shared entity IP Postal Address (ADDRESS/WARD/DISTRICT/PROVINCE/COUNTRY theo TYPE) + IP Electronic Address (EMAIL/FAX/WEBSITE/PHONE).
    data_volume_hint: null
    refresh_frequency: null
    ingestion:
      data_change_mode: Update
      filter_logic: null
      filter_note: null
