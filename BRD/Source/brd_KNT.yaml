      relation: 1-N — Hàng đợi xử lý đối chiếu thông tin công ty (worker, retry, trạng thái)
    - table: COMPANY_INFO
      relation: '1-N — Thông tin công ty tham gia thị trường chứng khoán gửi sang Cục Thuế: tên, MST, loại công ty, vốn, người đại diện, thông tin niêm yết'
    - table: DATA_RECONCILIATION_OUTBOUND
      relation: 1-N — Outbound reconciliation packet log from SSC (msg_id, packet_code)
    - table: HIGH_RISK_ENTERPRISE
      relation: '1-N — Danh sách doanh nghiệp rủi ro cao về thuế do Cục Thuế cung cấp: MST, tên, địa chỉ, cơ quan thuế quản lý, năm đánh giá'
    - table: INFO_REQUEST_DETAIL
      relation: '1-N — Chi tiết yêu cầu thông tin từ Cục Thuế gửi UBCKNN: tên yêu cầu, MST, trạng thái xử lý'
    - table: REPORT_COMPARISON_HEADER
      relation: 1-N — Header đối chiếu BCTC 1 dòng / MST + kỳ khai + mã tờ khai — phục vụ list
    - table: SSC_PENALTY
      relation: '1-N — Thông tin xử phạt vi phạm hành chính trong lĩnh vực chứng khoán của UBCKNN gửi Cục Thuế: số QĐ, đối tượng, hành vi, tiền phạt'
    - table: SSC_REPORT
      relation: 1-N — Báo cáo tài chính của đơn vị do UBCKNN tổng hợp từ phân hệ IDS/SCMS/FMS để gửi Cục Thuế và Bộ Tài chính
    - table: TAX_ENFORCEMENT_DEBT
      relation: '1-N — Thông tin quyết định cưỡng chế nợ thuế do Cục Thuế ban hành: phương thức cưỡng chế, số tiền, tài sản kê biên'
    - table: TAX_ENFORCEMENT_INVOICE
      relation: '1-N — Thông tin quyết định cưỡng chế ngừng sử dụng hóa đơn do Cục Thuế ban hành: số QĐ, đối tượng bị cưỡng chế, thời gian hiệu lực'
    - table: TAX_REGISTRATION_INFO
      relation: '1-N — Thông tin đăng ký thuế do Cục Thuế cung cấp: địa chỉ, vốn điều lệ, người đại diện, trạng thái hoạt động, tạm ngừng kinh doanh'
    - table: TAX_REPORT
      relation: '1-N — Báo cáo tài chính do Cục Thuế cung cấp cho UBCKNN: thông tin tờ khai, kỳ kê khai, MST, thông tin kiểm toán'
    - table: TAX_VIOLATION_HANDLING
      relation: '1-N — Thông tin xử lý vi phạm pháp luật về thuế do Cục Thuế cung cấp: số QĐ xử lý, tên đối tượng, kỳ thanh tra, tiền phạt'
