- brd_id: BRD-SRC-KNT-TAX_REPORT
  brd_name: Design Atomic từ nguồn KNT bảng TAX_REPORT
  type: Theo Source
  ba_email: huy.pham@fssc.com.vn
  steward_email: username@ubck.com.vn
  content:
    table_meaning: 'Báo cáo tài chính do Cục Thuế cung cấp cho UBCKNN: thông tin tờ khai, kỳ kê khai, MST, thông tin kiểm toán'
    functional_group: KNT-02 Báo cáo tài chính từ Tổng cục Thuế
    scope_status: in_scope
    scope_reason: Chờ thiết kế LLD
    table: TAX_REPORT
    related_tables:
    - table: TAX_REPORT_DETAIL
      relation: FK con — chi tiết từng chỉ tiêu báo cáo
