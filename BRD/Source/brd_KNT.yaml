      relation: Liên kết ngầm qua TAX_CODE — doanh nghiệp nộp báo cáo
    - table: AUDIT_FIRM
      relation: Liên kết ngầm qua AUDIT_FIRM_TAX_CODE — tổ chức kiểm toán (out of scope hiện tại)
    - table: AUDITOR
      relation: Liên kết ngầm qua AUDITOR_CODE — kiểm toán viên (out of scope hiện tại)
    - table: MSG_PACKET
      relation: FK reference — gói tin truyền nhận (out of scope)
    - table: REPORT_COMPARISON
      relation: '1-N — Kết quả đối chiếu dữ liệu báo cáo tài chính giữa UBCKNN và Cục Thuế: so sánh từng chỉ tiêu theo gói tin'
    - table: REPORT_COMPARISON_HEADER
      relation: 1-N — Header đối chiếu BCTC 1 dòng / MST + kỳ khai + mã tờ khai — phục vụ list
    notes: null
    data_volume_hint: null
    refresh_frequency: null
    ingestion:
      data_change_mode: Append
      filter_logic: CREATED_AT >= {etl_date}
      filter_note: Mỗi lần nộp tờ khai (kể cả bổ sung — xem ATTEMPT_COUNT) là 1 bản ghi mới — append khi nhận gói tin
