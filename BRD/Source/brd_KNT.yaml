schema_type: brd_source
schema_version: '1.0'
source: KNT
description: "Dữ liệu trao đổi giữa UBCKNN và Tổng cục Thuế (Cơ quan Thuế): đăng ký thuế, báo cáo tài chính, cưỡng chế nợ/hóa đơn, xử lý vi phạm pháp luật về thuế, doanh nghiệp rủi ro cao."
brd_entries:
  # ─── KNT-01 Quản lý thông tin đăng ký thuế ───────────────────────────────

  - brd_id: BRD-SRC-KNT-TAX_REGISTRATION_INFO
    brd_name: "Design Atomic từ nguồn KNT bảng TAX_REGISTRATION_INFO"
    type: Theo Source
    ba_email: huy.pham@fssc.com.vn
    steward_email: username@ubck.com.vn
    content:
      table_meaning: "Thông tin đăng ký thuế do Cục Thuế cung cấp: địa chỉ, vốn điều lệ, người đại diện, trạng thái hoạt động, tạm ngừng kinh doanh"
      functional_group: "KNT-01 Quản lý thông tin đăng ký thuế"
      scope_status: out_of_scope
      scope_reason: "Chờ thiết kế LLD"
      table: TAX_REGISTRATION_INFO
      related_tables:
        - table: TAX_REG_REPRESENTATIVE
          relation: "FK con — người đại diện/chủ hộ kinh doanh"
        - table: TAX_REG_ADDRESS_TYPE
          relation: "Liên kết ngầm qua TAX_CODE — chi tiết địa chỉ theo loại"
        - table: TAX_REG_BUSINESS_LINE
          relation: "Liên kết ngầm qua TAX_CODE — danh sách ngành nghề kinh doanh"
        - table: MSG_PACKET
          relation: "FK reference — gói tin truyền nhận (out of scope)"
      notes: "Grain = 1 Involved Party (1 doanh nghiệp/hộ kinh doanh). Có trường địa chỉ (HQ_ADDRESS, BUSINESS_*) và liên lạc (PHONE/FAX/BUSINESS_EMAIL) → tách IP Postal Address / IP Electronic Address theo rule 5."
      data_volume_hint: null
      refresh_frequency: null
      ingestion:
        data_change_mode: Update
        filter_logic: null
        filter_note: null

