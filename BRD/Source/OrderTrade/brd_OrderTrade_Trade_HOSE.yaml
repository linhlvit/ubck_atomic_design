schema_type: brd_source_columns
source: OrderTrade
table: Trade_HOSE
bronze_table: TRADE_HOSE
description: "Sổ khớp HOSE — mỗi bản ghi là 1 lần khớp lệnh thành công trên HOSE. Lưu đồng thời thông tin bên mua và bên bán trong cùng 1 row. 1 Order có thể tạo ra nhiều Trade (khớp dần)"
scope_status: in_scope

columns:
  - name: trade_date
    data_type: "date"
    nullable: false
    key: null
    description: "Ngày giao dịch theo thị trường chứng khoán"

  - name: market_id
    data_type: "varchar(10)"
    nullable: false
    key: null
    description: "Mã thị trường chứng khoán"
    values: "STO=HoSE Stock; BDO=HoSE Bond; RPO=HoSE Repo; STX=HNX Stock; UPX=HNX UPCOM; BDX=HNX Gov Bond; DVX=HNX Derivatives; HCX=HNX Corp Bond"

  - name: symbol
    data_type: "varchar(20)"
    nullable: false
    key: null
    description: "Mã chứng khoán"

  - name: currency
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Đơn vị tiền tệ"

  - name: board_type
    data_type: "varchar(5)"
    nullable: false
    key: null
    description: "Loại bảng giao dịch"
    values: "G1=Main; G2=Pre open; G3=Post closing; G4=Odd lot; G7=Buy-in; G8=Sell-out; T1=Negotiation regular; T2=Negotiation pre; T3=Negotiation post; T4=Negotiation regular odd lot; T6=Negotiation post odd lot; R1=Negotiation Repo"

  - name: trade_no
    data_type: "varchar(20)"
    nullable: false
    key: PK
    description: "Số thứ tự giao dịch khớp lệnh được ghi nhận trên hệ thống Sàn trong ngày, theo từng mã chứng khoán (Trade ID / BK)"

  - name: trade_time
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Thời gian diễn ra giao dịch khớp lệnh"

  - name: session
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phiên giao dịch"
    values: "00=Pre-market; 10=ATO; 11=ATO extension; 20=Continuous shifted; 21=Continuous extension; 25=Buy-In; 30=ATC; 40=Continuous; 50=Pre off-hour; 60=Post off-hour receipt; 65=Post off-hours; 70=Post off-hour call auction; 80=Unit trading; 90=Trading halt; 99=Market closing"

  - name: exec_price
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá khớp lệnh thực tế của giao dịch"

  - name: exec_price_vs_ltp
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Chênh lệch giữa giá khớp lệnh và giá khớp gần nhất của mã chứng khoán"

  - name: exec_vol
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng khớp lệnh"

  - name: exec_val
    data_type: "decimal(22,4)"
    nullable: true
    key: null
    description: "Tổng giá trị giao dịch của lệnh khớp"

  - name: exec_ltp
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá khớp gần nhất của mã chứng khoán trên thị trường (Last Traded Price)"

  - name: exec_new_high_low_price
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Đánh dấu nếu lệnh tạo giá khớp cao nhất hoặc thấp nhất mới trong ngày"

  - name: buy_order_date
    data_type: "date"
    nullable: true
    key: null
    description: "Ngày đặt lệnh mua"

  - name: buy_order_time
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Thời gian đặt lệnh mua"

  - name: buy_order_accept_no
    data_type: "varchar(20)"
    nullable: true
    key: FK
    fk_note: "FK-BK → Order_HOSE.order_accept_no (Buy side)"
    description: "Số thứ tự của lệnh mua được ghi nhận trên hệ thống Sàn trong ngày giao dịch"

  - name: buy_brk_id
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã/số công ty chứng khoán thực hiện giao dịch mua"

  - name: buy_brk_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên công ty chứng khoán thực hiện giao dịch mua"

  - name: buy_pin
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Mã PIN của tài khoản mua"

  - name: buy_acct_no
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Mã/Số tài khoản giao dịch mua của nhà đầu tư"

  - name: buy_acct_holder_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên tài khoản giao dịch mua của nhà đầu tư"

  - name: buy_client_house_cls_code
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại lệnh khách hàng/công ty tự doanh của lệnh mua"
    values: "10=Client trade; 30=House trade"

  - name: buy_investor_type
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Phân loại nhà đầu tư của lệnh mua (raw từ HOSE)"
    values: "1000/8000=Cá nhân; 7000=NĐT NN; 3000=Quỹ; 5000=CTCK; 4000=Ngân hàng; 6000=Tổ chức khác"

  - name: buy_foreign_investor_type
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại đầu tư nước ngoài của lệnh mua"
    values: "00=Not Foreigner; 10=Foreigner Residence; 20=Foreigner Non-residence"

  - name: buy_order_price
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá đặt mua"

  - name: buy_order_vol
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng đặt mua"

  - name: buy_trader_no
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã/số định danh người thực hiện đặt mua"

  - name: buy_trader_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên người thực hiện đặt mua"

  - name: buy_ref_seq_no
    data_type: "varchar(30)"
    nullable: true
    key: null
    description: "Số tham chiếu theo thứ tự đặt mua trong ngày"

  - name: sell_order_date
    data_type: "date"
    nullable: true
    key: null
    description: "Ngày đặt lệnh bán"

  - name: sell_order_time
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Thời gian đặt lệnh bán"

  - name: sell_order_accept_no
    data_type: "varchar(20)"
    nullable: true
    key: FK
    fk_note: "FK-BK → Order_HOSE.order_accept_no (Sell side)"
    description: "Số thứ tự của lệnh bán được ghi nhận trên hệ thống Sàn trong ngày giao dịch"

  - name: sell_brk_id
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã/số công ty chứng khoán thực hiện giao dịch bán"

  - name: sell_brk_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên công ty chứng khoán thực hiện giao dịch bán"

  - name: sell_pin
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Mã PIN của tài khoản bán"

  - name: sell_acct_no
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Mã/Số tài khoản giao dịch bán của nhà đầu tư"

  - name: sell_acct_holder_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên tài khoản giao dịch bán của nhà đầu tư"

  - name: sell_client_house_cls_code
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại lệnh khách hàng/công ty tự doanh của lệnh bán"
    values: "10=Client trade; 30=House trade"

  - name: sell_investor_type
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Phân loại nhà đầu tư của lệnh bán (raw từ HOSE)"
    values: "1000/8000=Cá nhân; 7000=NĐT NN; 3000=Quỹ; 5000=CTCK; 4000=Ngân hàng; 6000=Tổ chức khác"

  - name: sell_foreign_investor_type
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại đầu tư nước ngoài của lệnh bán"
    values: "00=Not Foreigner; 10=Foreigner Residence; 20=Foreigner Non-residence"

  - name: sell_order_price
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá đặt bán"

  - name: sell_order_vol
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng đặt bán"

  - name: sell_trader_no
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã/số định danh người thực hiện đặt bán"

  - name: sell_trader_name
    data_type: "varchar(255)"
    nullable: true
    key: null
    description: "Tên người thực hiện đặt bán"

  - name: sell_ref_seq_no
    data_type: "varchar(30)"
    nullable: true
    key: null
    description: "Số tham chiếu theo thứ tự đặt bán trong ngày"
