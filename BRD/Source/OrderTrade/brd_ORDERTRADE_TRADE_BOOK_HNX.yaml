schema_type: brd_source_columns
source: ORDERTRADE
table: HNX_TRADE_BOOK
bronze_table: HNX_TRADE_BOOK
description: "Sổ khớp HNX — mỗi bản ghi là 1 lần khớp lệnh thành công trên HNX. Tương đương Trade_HOSE nhưng bổ sung Spread trade legs (Exec Price Spread First/Second) cho phái sinh/repo có 2 vế, và Quote Request Code cho RFQ"
scope_status: in_scope

columns:
  - name: TRADE_DATE
    data_type: "date"
    nullable: false
    key: null
    description: "Ngày giao dịch của trade"

  - name: MARKET_ID
    data_type: "varchar(10)"
    nullable: false
    key: null
    description: "Mã thị trường chứng khoán"
    values: "STO=HoSE Stock; BDO=HoSE Bond; RPO=HoSE Repo; STX=HNX Stock; UPX=HNX UPCOM; BDX=HNX Gov Bond; DVX=HNX Derivatives; HCX=HNX Corp Bond"

  - name: BOARD_ID
    data_type: "varchar(5)"
    nullable: false
    key: null
    description: "Loại bảng giao dịch"
    values: "G1=Main; G2=Pre open; G3=Post closing; G4=Odd lot; G7=Buy-in; G8=Sell-out; T1=Negotiation regular; T2=Negotiation pre; T3=Negotiation post; T4=Negotiation regular odd lot; T6=Negotiation post odd lot; R1=Negotiation Repo"

  - name: ISSUE_CODE
    data_type: "varchar(20)"
    nullable: false
    key: null
    description: "Mã định danh của loại chứng khoán đang được giao dịch (unique)"

  - name: TRADE_NO
    data_type: "varchar(20)"
    nullable: false
    key: PK
    description: "ID của giao dịch — dùng làm unique key, audit, tracking trade (BK)"

  - name: TRADE_TIME
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Thời điểm giao dịch xảy ra"

  - name: TRADE_PRICE
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá khớp của giao dịch"

  - name: TRADE_QTY
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng giao dịch"

  - name: SESSION_ID
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Mã phiên giao dịch"
    values: "00=Pre-market; 10=ATO; 11=ATO extension; 20=Continuous shifted; 21=Continuous extension; 25=Buy-In; 30=ATC; 40=Continuous; 50=Pre off-hour; 60=Post off-hour receipt; 65=Post off-hours; 70=Post off-hour call auction; 80=Unit trading; 90=Trading halt; 99=Market closing"

  - name: SELL_REPLACE_CANCEL_CLS_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Loại hành động sửa/hủy của lệnh bên bán"

  - name: SELL_MEMBER_NO
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã định danh công ty chứng khoán thực hiện lệnh bán"

  - name: SELL_ACCT_NO
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Số tài khoản giao dịch của khách hàng thực hiện lệnh bán"

  - name: SELL_ORDER_TYPE_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Loại lệnh của phía bán"
    values: "1=Market; 2=Limit; 3=Stop Market; 4=Stop Limit; X=Same side limit; Y=Contrary side limit"

  - name: SELL_ORDER_CONDITION_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Điều kiện hiệu lực và cách xử lý của lệnh bán"
    values: "0=FAS; 1=GTC; 2=ATO; 3=FAK; 4=FOK; 6=GTD; 7=ATC; 9=MTL"

  - name: SELL_CLIENT_HOUSE_CLS
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Lệnh bán của khách hàng hay tự doanh"
    values: "10=Client trade; 30=House trade"

  - name: SELL_INVESTOR_CLS_CODE
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Phân loại nhà đầu tư bán theo loại hình tổ chức/cá nhân (raw từ HNX)"
    values: "1000=Securities/Futures company; 2000=Insurance; 3000=Asset mgmt/Investment; 3100=Private fund; 4000=Bank; 5000=General finance; 6000=Pension/Fund; 7000=Country/International org; 7100=Misc corporation; 8000=Individual"

  - name: SELL_ORDER_QTY
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng đặt bán"

  - name: SELL_ORDER_PRICE
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá đặt bán"

  - name: BUY_MEMBER_NO
    data_type: "varchar(20)"
    nullable: true
    key: null
    description: "Mã/số công ty chứng khoán thực hiện giao dịch mua"

  - name: BUY_REPLACE_CANCEL_CLS_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Loại hành động sửa/hủy của lệnh bên mua"

  - name: BUY_ACCT_NO
    data_type: "varchar(50)"
    nullable: true
    key: null
    description: "Mã tài khoản thực hiện giao dịch mua"

  - name: BUY_ORDER_TYPE_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Loại lệnh mua"
    values: "1=Market; 2=Limit; 3=Stop Market; 4=Stop Limit; X=Same side limit; Y=Contrary side limit"

  - name: BUY_ORDER_CONDITION_CODE
    data_type: "varchar(1)"
    nullable: true
    key: null
    description: "Điều kiện thực hiện lệnh mua"
    values: "0=FAS; 1=GTC; 2=ATO; 3=FAK; 4=FOK; 6=GTD; 7=ATC; 9=MTL"

  - name: BUY_CLIENT_HOUSE_CLS
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Lệnh mua của khách hàng hay tự doanh"
    values: "10=Client trade; 30=House trade"

  - name: BUY_INVESTOR_CLS_CODE
    data_type: "varchar(10)"
    nullable: true
    key: null
    description: "Phân loại nhà đầu tư mua theo loại hình tổ chức/cá nhân (raw từ HNX)"
    values: "1000=Securities/Futures company; 2000=Insurance; 3000=Asset mgmt/Investment; 3100=Private fund; 4000=Bank; 5000=General finance; 6000=Pension/Fund; 7000=Country/International org; 7100=Misc corporation; 8000=Individual"

  - name: BUY_ORDER_QTY
    data_type: "bigint"
    nullable: true
    key: null
    description: "Khối lượng đặt mua"

  - name: BUY_ORDER_PRICE
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá đặt mua"

  - name: MSG_SEQ
    data_type: "bigint"
    nullable: true
    key: null
    description: "Số thứ tự message trong luồng dữ liệu (tăng dần từ 1)"

  - name: SELL_ORDER_RECEPTION_NO
    data_type: "varchar(20)"
    nullable: true
    key: FK
    fk_note: "FK-BK → HNX_ORDER_BOOK.order_reception_no (Sell side)"
    description: "Số định danh của lệnh bán tại thời điểm hệ thống KRX tiếp nhận"

  - name: BUY_ORDER_RECEPTION_NO
    data_type: "varchar(20)"
    nullable: true
    key: FK
    fk_note: "FK-BK → HNX_ORDER_BOOK.order_reception_no (Buy side)"
    description: "Số định danh của lệnh mua tại thời điểm hệ thống KRX tiếp nhận"

  - name: SELL_QUOTE_REQUEST_CODE
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Mã loại yêu cầu báo giá của bên bán (HNX RFQ)"
    values: "1=Request; 2=Cancel; 3=Confirm; 4=Reject"

  - name: BUY_QUOTE_REQUEST_CODE
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Mã loại yêu cầu báo giá của bên mua (HNX RFQ)"
    values: "1=Request; 2=Cancel; 3=Confirm; 4=Reject"

  - name: EXEC_PRICE_SPREAD_FIRST
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá khớp của leg thứ nhất trong spread trade (HNX-only: phái sinh/repo 2 vế)"

  - name: EXEC_PRICE_SPREAD_SECOND
    data_type: "decimal(18,4)"
    nullable: true
    key: null
    description: "Giá khớp của leg thứ hai trong spread trade (HNX-only: phái sinh/repo 2 vế)"

  - name: SELL_FOREIGN_INVESTOR_TYPE_CODE
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại loại hình nhà đầu tư nước ngoài tham gia giao dịch bán"
    values: "00=Not Foreigner; 10=Foreigner Residence; 20=Foreigner Non-residence"

  - name: BUY_FOREIGN_INVESTOR_TYPE_CODE
    data_type: "varchar(5)"
    nullable: true
    key: null
    description: "Phân loại loại hình nhà đầu tư nước ngoài tham gia giao dịch mua"
    values: "00=Not Foreigner; 10=Foreigner Residence; 20=Foreigner Non-residence"
