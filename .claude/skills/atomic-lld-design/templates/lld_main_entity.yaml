    description: "Khóa đại diện (surrogate key)."
    data_domain: Surrogate Key
    nullable: false
    is_primary_key: true
    status: draft
    source_columns: []
    comment: "PK surrogate. BCV: \"{BCV Concept}\". {Mô tả ngắn entity}."
    classification_context: null
    etl_derived_value: null

  # ── BUSINESS KEY ────────────────────────────────────────────────────
  - attribute_name: "{Entity Name} Code"
    physical_name: "{entity_physical_name}_code"
    description: "{Mô tả gốc từ nguồn}. BK."
    data_domain: Text
    nullable: false
    is_primary_key: false
    status: draft
    source_columns:
      - "{SOURCE}.{schema}.{TABLE}.{PK_COLUMN}"
    comment: "BK chính. PK nguồn."
    classification_context: null
    etl_derived_value: null

  # ── SOURCE SYSTEM CODE ──────────────────────────────────────────────
  - attribute_name: Source System Code
    physical_name: src_stm_code
    description: "Mã hệ thống nguồn dữ liệu."
    data_domain: Classification Value
    nullable: false
    is_primary_key: false
    status: draft
    source_columns: []
    comment: "Scheme: SOURCE_SYSTEM."
    classification_context: "SOURCE_SYSTEM={SOURCE}.{TABLE}"
    etl_derived_value: "{SOURCE}.{TABLE}"

