# Quy tắc: (1) CẤM thêm mục mới vào file này để "cho qua" — sửa cột trong Detail Mapping/HLD; (2) khi sửa xong một mục, GỠ khỏi đây trong cùng lượt
# (lint cảnh báo nếu còn); (3) chủ xử lý: Data Modeler của từng phân hệ. Một số mục có thể là false positive (VD hậu tố `_i` ký hiệu mẫu trong công thức,
