schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ivsm_fnd_ctf_tfr-FMS.TRANSFERMBF
  logical_name: Mapping Atomic - Investment Fund Certificate Transfer – source FMS.TRANSFERMBF
  physical_name: ivsm_fnd_ctf_tfr
  dm_ref: ATM-ivsm_fnd_ctf_tfr-FMS.TRANSFERMBF
  brd_ref: BRD-SRC-FMS-TRANSFERMBF
target:
  namespace: atm
  physical_name: ivsm_fnd_ctf_tfr
  etl_handle: Fact Append
  description: Giao dịch mua/bán chứng chỉ quỹ của nhà đầu tư thành viên. Ghi nhận
    số lượng và giá giao dịch theo từng quỹ.
input:
- source_type: physical_table
  namespace: ods
  table_name: TRANSFERMBF
  alias: tr
  select_fields: Id, FndId, MBFId, TransDate, Quantity, Price, TransType, DateCreated,
    DateModified
  filter: created_at = {etl_date}
relationship: []
mapping_columns:
- target_column: ivsm_fnd_ivsr_cptl_tfr_id
  transformation: '{hash_id}(''FMS_TRANSFERMBF'', tr.Id)'
  data_type: string
  description: Khóa đại diện cho giao dịch chuyển nhượng phần vốn góp quỹ.
  target_attr_name: Investment Fund Investor Capital Transfer Id
- target_column: ivsm_fnd_ivsr_cptl_tfr_code
  transformation: tr.Id
  data_type: string
  description: Mã định danh giao dịch. Map từ PK bảng nguồn.
  target_attr_name: Investment Fund Investor Capital Transfer Code
- target_column: src_stm_code
  transformation: '''FMS_TRANSFERMBF'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: ivsm_fnd_id
  transformation: '{hash_id}(''FMS_FUNDS'', tr.FndId)'
  data_type: string
  description: FK đến quỹ đầu tư có phần vốn chuyển nhượng.
  target_attr_name: Investment Fund Id
- target_column: ivsm_fnd_code
  transformation: tr.FndId
  data_type: string
  description: Mã quỹ đầu tư.
  target_attr_name: Investment Fund Code
- target_column: ivsm_fnd_ivsr_mbr_id
  transformation: '{hash_id}(''FMS_MBFUND'', tr.MBFId)'
  data_type: string
  description: FK đến quan hệ góp vốn của NĐT trong quỹ.
  target_attr_name: Investment Fund Investor Membership Id
- target_column: ivsm_fnd_ivsr_mbr_code
  transformation: tr.MBFId
  data_type: string
  description: Mã quan hệ góp vốn.
  target_attr_name: Investment Fund Investor Membership Code
- target_column: tfr_dt
  transformation: tr.TransDate
  data_type: date
  description: Ngày thực hiện chuyển nhượng phần vốn.
  target_attr_name: Transfer Date
- target_column: tfr_qty
  transformation: tr.Quantity
  data_type: decimal(23,2)
  description: Số lượng phần vốn chuyển nhượng.
  target_attr_name: Transfer Quantity
- target_column: tfr_prc
  transformation: tr.Price
  data_type: decimal(23,2)
  description: Giá chuyển nhượng (VNĐ/phần vốn).
  target_attr_name: Transfer Price
- target_column: tfr_tp_code
  transformation: tr.TransType
  data_type: string
  description: Loại giao dịch chuyển nhượng.
  target_attr_name: Transfer Type Code
- target_column: crt_tms
  transformation: tr.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: tr.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
