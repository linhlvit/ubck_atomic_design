schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-fnd_mgt_conduct_vln-FMS.VIOLT
  logical_name: Mapping Atomic - Fund Management Conduct Violation – source FMS.VIOLT
  physical_name: fnd_mgt_conduct_vln
  dm_ref: ATM-fnd_mgt_conduct_vln-FMS.VIOLT
  brd_ref: BRD-SRC-FMS-VIOLT
target:
  namespace: atm
  physical_name: fnd_mgt_conduct_vln
  etl_handle: Fact Append
  description: Vi phạm pháp luật hoặc hành chính của công ty quản lý quỹ hoặc quỹ
    đầu tư. Ghi nhận loại vi phạm và trạng thái xử lý.
input:
- source_type: physical_table
  namespace: ods
  table_name: VIOLT
  alias: vi
  select_fields: Id, SecId, FndId, ViolType, ViolContent, ViolDate, ViolStatus, Note,
    DateCreated, DateModified
  filter: created_at = {etl_date}
relationship: []
mapping_columns:
- target_column: fnd_mgt_conduct_vln_id
  transformation: '{hash_id}(''FMS_VIOLT'', vi.Id)'
  data_type: string
  description: Khóa đại diện cho hành vi vi phạm quản lý quỹ.
  target_attr_name: Fund Management Conduct Violation Id
- target_column: fnd_mgt_conduct_vln_code
  transformation: vi.Id
  data_type: string
  description: Mã định danh vi phạm. Map từ PK bảng nguồn.
  target_attr_name: Fund Management Conduct Violation Code
- target_column: src_stm_code
  transformation: '''FMS_VIOLT'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', vi.SecId)'
  data_type: string
  description: FK đến công ty QLQ vi phạm (nullable).
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: vi.SecId
  data_type: string
  description: Mã công ty QLQ.
  target_attr_name: Fund Management Company Code
- target_column: ivsm_fnd_id
  transformation: '{hash_id}(''FMS_FUNDS'', vi.FndId)'
  data_type: string
  description: FK đến quỹ đầu tư liên quan vi phạm (nullable).
  target_attr_name: Investment Fund Id
- target_column: ivsm_fnd_code
  transformation: vi.FndId
  data_type: string
  description: Mã quỹ đầu tư.
  target_attr_name: Investment Fund Code
- target_column: vln_tp_code
  transformation: vi.ViolType
  data_type: string
  description: Loại vi phạm.
  target_attr_name: Violation Type Code
- target_column: vln_cntnt
  transformation: vi.ViolContent
  data_type: string
  description: Nội dung mô tả vi phạm.
  target_attr_name: Violation Content
- target_column: vln_dt
  transformation: vi.ViolDate
  data_type: date
  description: Ngày xác định vi phạm.
  target_attr_name: Violation Date
- target_column: vln_st_code
  transformation: vi.ViolStatus
  data_type: string
  description: Trạng thái xử lý vi phạm.
  target_attr_name: Violation Status Code
- target_column: note
  transformation: vi.Note
  data_type: string
  description: Ghi chú bổ sung về vi phạm.
  target_attr_name: Note
- target_column: crt_tms
  transformation: vi.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: vi.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
