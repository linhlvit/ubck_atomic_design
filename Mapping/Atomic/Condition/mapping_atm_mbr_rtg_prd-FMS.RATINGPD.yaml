schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-mbr_rtg_prd-FMS.RATINGPD
  logical_name: Mapping Atomic - Member Rating Period – source FMS.RATINGPD
  physical_name: mbr_rtg_prd
  dm_ref: ATM-mbr_rtg_prd-FMS.RATINGPD
  brd_ref: BRD-SRC-FMS-RATINGPD
target:
  namespace: atm
  physical_name: mbr_rtg_prd
  etl_handle: SCD4A
  description: Kỳ đánh giá xếp loại định kỳ cho các thành viên thị trường (công ty
    quản lý quỹ). Xác định phạm vi thời gian áp dụng tiêu chí chấm điểm.
input:
- source_type: physical_table
  namespace: ods
  table_name: RATINGPD
  alias: ra
  select_fields: Id, PeriodName, StartDate, EndDate, IsActive, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: mbr_rtg_prd_id
  transformation: '{hash_id}(''FMS_RATINGPD'', ra.Id)'
  data_type: string
  description: Khóa đại diện cho kỳ đánh giá xếp loại.
  target_attr_name: Member Rating Period Id
- target_column: mbr_rtg_prd_code
  transformation: ra.Id
  data_type: string
  description: Mã định danh kỳ đánh giá. Map từ PK bảng nguồn.
  target_attr_name: Member Rating Period Code
- target_column: src_stm_code
  transformation: '''FMS_RATINGPD'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: mbr_rtg_prd_nm
  transformation: ra.PeriodName
  data_type: string
  description: Tên kỳ đánh giá xếp loại.
  target_attr_name: Member Rating Period Name
- target_column: rtg_prd_strt_dt
  transformation: ra.StartDate
  data_type: date
  description: Ngày bắt đầu kỳ đánh giá.
  target_attr_name: Rating Period Start Date
- target_column: rtg_prd_end_dt
  transformation: ra.EndDate
  data_type: date
  description: Ngày kết thúc kỳ đánh giá.
  target_attr_name: Rating Period End Date
- target_column: is_actv_f
  transformation: ra.IsActive
  data_type: boolean
  description: Kỳ đánh giá đang hoạt động.
  target_attr_name: Is Active Flag
- target_column: crt_tms
  transformation: ra.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: ra.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
