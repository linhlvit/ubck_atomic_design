schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-rtg_criterion-FMS.RNKFACTOR
  logical_name: Mapping Atomic - Rating Criterion – source FMS.RNKFACTOR
  physical_name: rtg_criterion
  dm_ref: ATM-rtg_criterion-FMS.RNKFACTOR
  brd_ref: BRD-SRC-FMS-RNKFACTOR
target:
  namespace: atm
  physical_name: rtg_criterion
  etl_handle: SCD4A
  description: Tiêu chí chấm điểm đánh giá xếp loại thành viên thị trường. Lưu tên
    tiêu chí và điểm tối đa/trọng số. Có cấu trúc cha/con.
input:
- source_type: physical_table
  namespace: ods
  table_name: RNKFACTOR
  alias: rn
  select_fields: Id, Name, ParentId, MaxScore, Weight, IsActive, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: rtg_criterion_id
  transformation: '{hash_id}(''FMS_RNKFACTOR'', rn.Id)'
  data_type: string
  description: Khóa đại diện cho nhân tố chấm điểm đánh giá.
  target_attr_name: Rating Criterion Id
- target_column: rtg_criterion_code
  transformation: rn.Id
  data_type: string
  description: Mã định danh nhân tố. Map từ PK bảng nguồn.
  target_attr_name: Rating Criterion Code
- target_column: src_stm_code
  transformation: '''FMS_RNKFACTOR'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: rtg_criterion_nm
  transformation: rn.Name
  data_type: string
  description: Tên nhân tố chấm điểm.
  target_attr_name: Rating Criterion Name
- target_column: prn_rtg_criterion_id
  transformation: '{hash_id}(''FMS_RNKFACTOR'', rn.ParentId)'
  data_type: string
  description: FK tự thân — nhân tố cha.
  target_attr_name: Parent Rating Criterion Id
- target_column: prn_rtg_criterion_code
  transformation: rn.ParentId
  data_type: string
  description: Mã nhân tố cha.
  target_attr_name: Parent Rating Criterion Code
- target_column: max_scor
  transformation: rn.MaxScore
  data_type: decimal(5,2)
  description: Điểm tối đa của nhân tố.
  target_attr_name: Max Score
- target_column: wght
  transformation: rn.Weight
  data_type: decimal(5,2)
  description: Trọng số của nhân tố trong tổng điểm.
  target_attr_name: Weight
- target_column: is_actv_f
  transformation: rn.IsActive
  data_type: boolean
  description: Nhân tố đang được áp dụng.
  target_attr_name: Is Active Flag
- target_column: crt_tms
  transformation: rn.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: rn.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
