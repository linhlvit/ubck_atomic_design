schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-rpt_prd-FMS.RPTPERIOD
  logical_name: Mapping Atomic - Reporting Period – source FMS.RPTPERIOD
  physical_name: rpt_prd
  dm_ref: ATM-rpt_prd-FMS.RPTPERIOD
  brd_ref: BRD-SRC-FMS-RPTPERIOD
target:
  namespace: atm
  physical_name: rpt_prd
  etl_handle: SCD4A
  description: Kỳ báo cáo định kỳ (ngày/tuần/tháng/quý/bán niên/năm) mà thành viên
    thị trường phải nộp báo cáo lên UBCKNN.
input:
- source_type: physical_table
  namespace: ods
  table_name: RPTPERIOD
  alias: rp
  select_fields: Id, PeriodName, PeriodType, IsActive, CreatedBy, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: rpt_prd_id
  transformation: '{hash_id}(''FMS_RPTPERIOD'', rp.Id)'
  data_type: string
  description: Khóa đại diện cho kỳ báo cáo.
  target_attr_name: Reporting Period Id
- target_column: rpt_prd_code
  transformation: rp.Id
  data_type: string
  description: Mã định danh kỳ báo cáo. Map từ PK bảng nguồn.
  target_attr_name: Reporting Period Code
- target_column: src_stm_code
  transformation: '''FMS_RPTPERIOD'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: rpt_prd_nm
  transformation: rp.PeriodName
  data_type: string
  description: Tên kỳ báo cáo.
  target_attr_name: Reporting Period Name
- target_column: rpt_prd_tp_code
  transformation: rp.PeriodType
  data_type: string
  description: Kiểu kỳ báo cáo (tháng/quý/năm...).
  target_attr_name: Reporting Period Type Code
- target_column: is_actv_f
  transformation: rp.IsActive
  data_type: boolean
  description: Kỳ báo cáo đang hoạt động.
  target_attr_name: Is Active Flag
- target_column: crt_by
  transformation: rp.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: rp.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: rp.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
- target_column: selfset_prd_id
  transformation: '{hash_id}(''FMS_RPTPERIOD'', rp.)'
  data_type: string
  description: FK đến kỳ báo cáo do cán bộ UB tự thiết lập (SELFSETPD). Nullable.
  target_attr_name: Self-set Period Id
- target_column: selfset_prd_code
  transformation: 'null'
  data_type: string
  description: Mã kỳ báo cáo tự thiết lập.
  target_attr_name: Self-set Period Code
- target_column: rpt_tpl_id
  transformation: '{hash_id}(''FIMS_RPTTEMP'', rp.)'
  data_type: string
  description: FK đến biểu mẫu báo cáo áp dụng cho kỳ này.
  target_attr_name: Report Template Id
- target_column: rpt_tpl_code
  transformation: 'null'
  data_type: string
  description: Mã biểu mẫu báo cáo.
  target_attr_name: Report Template Code
- target_column: subm_ddln_dt
  transformation: 'null'
  data_type: date
  description: Thời hạn gửi báo cáo muộn nhất (áp dụng cho kỳ ngày/tuần).
  target_attr_name: Submission Deadline Date
- target_column: subm_ddln_wk
  transformation: 'null'
  data_type: int
  description: Thời hạn gửi báo cáo muộn nhất (tuần).
  target_attr_name: Submission Deadline Week
- target_column: repeat_itrv
  transformation: 'null'
  data_type: int
  description: Lặp lại sau bao nhiêu đơn vị kỳ.
  target_attr_name: Repeat Interval
- target_column: counting_strt_dt
  transformation: 'null'
  data_type: date
  description: Ngày bắt đầu tính hạn nộp báo cáo.
  target_attr_name: Counting Start Date
- target_column: is_wrk_day_ind
  transformation: 'null'
  data_type: string
  description: 'Đơn vị tính hạn nộp: 0: Ngày lịch 1: Ngày làm việc.'
  target_attr_name: Is Working Day Indicator
- target_column: submit_wi_dys
  transformation: 'null'
  data_type: int
  description: Số ngày/ngày làm việc được phép gửi báo cáo.
  target_attr_name: Submit Within Days
- target_column: lcs_code
  transformation: 'null'
  data_type: string
  description: 'Trạng thái: 0: Không sử dụng 1: Sử dụng.'
  target_attr_name: Life Cycle Status Code
- target_column: dsc
  transformation: 'null'
  data_type: string
  description: Ghi chú.
  target_attr_name: Description
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
