schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-dscr_ivsm_ac-FMS.INVESACC
  logical_name: Mapping Atomic - Discretionary Investment Account – source FMS.INVESACC
  physical_name: dscr_ivsm_ac
  dm_ref: ATM-dscr_ivsm_ac-FMS.INVESACC
  brd_ref: BRD-SRC-FMS-INVESACC
target:
  namespace: atomic
  physical_name: dscr_ivsm_ac
  etl_handle: SCD4A
  description: Tài khoản đầu tư ủy thác — hợp đồng dịch vụ quản lý danh mục tài chính
    giữa nhà đầu tư ủy thác và công ty quản lý quỹ.
input:
- source_type: physical_table
  namespace: ods
  table_name: INVESACC
  alias: in
  select_fields: '*'
  filter: null
relationship: []
mapping_columns:
- target_column: dscr_ivsm_ac_id
  transformation: '{hash_id}(''FMS_INVESACC'', in.Id)'
  data_type: string
  description: Khóa đại diện cho hợp đồng ủy thác quản lý danh mục.
  target_attr_name: Discretionary Investment Account Id
- target_column: dscr_ivsm_ac_code
  transformation: in.Id
  data_type: string
  description: Mã định danh tài khoản ủy thác. Map từ PK bảng nguồn.
  target_attr_name: Discretionary Investment Account Code
- target_column: src_stm_code
  transformation: '''FMS_INVESACC'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: dscr_ivsm_ivsr_id
  transformation: '{hash_id}(''FMS_INVESACC'', in.InvesId)'
  data_type: string
  description: FK đến nhà đầu tư ủy thác.
  target_attr_name: Discretionary Investment Investor Id
- target_column: dscr_ivsm_ivsr_code
  transformation: in.InvesId
  data_type: string
  description: Mã nhà đầu tư ủy thác.
  target_attr_name: Discretionary Investment Investor Code
- target_column: ac_nbr
  transformation: in.Account
  data_type: string
  description: Số tài khoản ủy thác.
  target_attr_name: Account Number
- target_column: ac_plc
  transformation: in.AccPlace
  data_type: string
  description: Nơi lưu ký tài khoản.
  target_attr_name: Account Place
- target_column: ctr_nbr
  transformation: in.ContractNo
  data_type: string
  description: Số hợp đồng ủy thác quản lý danh mục.
  target_attr_name: Contract Number
- target_column: cmmt_cptl_amt
  transformation: in.ActScale
  data_type: decimal(23,2)
  description: Quy mô vốn ủy thác cam kết (VNĐ).
  target_attr_name: Committed Capital Amount
- target_column: act_cptl_amt
  transformation: in.AdScale
  data_type: decimal(23,2)
  description: Quy mô vốn ủy thác thực tế (VNĐ).
  target_attr_name: Actual Capital Amount
- target_column: mgt_fee_rate
  transformation: in.ManagerFee
  data_type: decimal(5,2)
  description: Phí quản lý theo điều khoản hợp đồng (%).
  target_attr_name: Management Fee Rate
- target_column: lcs_code
  transformation: in.Status
  data_type: string
  description: Trạng thái hợp đồng ủy thác.
  target_attr_name: Life Cycle Status Code
- target_column: rpt_dt
  transformation: in.DateReport
  data_type: date
  description: Ngày báo cáo.
  target_attr_name: Report Date
- target_column: crt_by
  transformation: in.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: in.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: in.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/rules/transformation_rules.yaml
final_filter: []
