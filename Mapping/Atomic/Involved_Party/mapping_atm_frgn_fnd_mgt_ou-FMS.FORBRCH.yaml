schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-frgn_fnd_mgt_ou-FMS.FORBRCH
  logical_name: Mapping Atomic - Foreign Fund Management Organization Unit – source
    FMS.FORBRCH
  physical_name: frgn_fnd_mgt_ou
  dm_ref: ATM-frgn_fnd_mgt_ou-FMS.FORBRCH
  brd_ref: BRD-SRC-FMS-FORBRCH
target:
  namespace: atm
  physical_name: frgn_fnd_mgt_ou
  etl_handle: SCD4A
  description: Văn phòng đại diện hoặc chi nhánh của công ty quản lý quỹ nước ngoài
    tại Việt Nam được UBCKNN chấp thuận hoạt động.
input:
- source_type: physical_table
  namespace: ods
  table_name: FORBRCH
  alias: fo
  select_fields: Id, Name, EnName, Status, EndDate, ChangeLicense, ChangeLicenseDate,
    ChangeNote, CreatedBy, DateCreated, DateModified
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: FGBUSINESS
  alias: fg_raw
  select_fields: ForbrchId, BuId
  filter: null
  note: Pure junction — denormalize thành ARRAY
- source_type: derived_cte
  namespace: null
  table_name: fg_raw
  alias: fg
  select_fields: ForbrchId, COLLECT_LIST(NAMED_STRUCT('bsn_tp_codes', BuId)) AS bsn_tp_codes
  filter: GROUP BY ForbrchId
relationship:
- main_alias: fo
  join_type: LEFT JOIN
  join_alias: fg
  join_on: fo.Id = fg.ForbrchId
mapping_columns:
- target_column: frgn_fnd_mgt_ou_id
  transformation: '{hash_id}(''FMS_FORBRCH'', fo.Id)'
  data_type: string
  description: Khóa đại diện cho VPĐD/CN công ty QLQ nước ngoài tại VN.
  target_attr_name: Foreign Fund Management Organization Unit Id
- target_column: frgn_fnd_mgt_ou_code
  transformation: fo.Id
  data_type: string
  description: Mã định danh VPĐD/CN QLQ NN. Map từ PK bảng nguồn.
  target_attr_name: Foreign Fund Management Organization Unit Code
- target_column: src_stm_code
  transformation: '''FMS_FORBRCH'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: frgn_fnd_mgt_ou_nm
  transformation: fo.Name
  data_type: string
  description: Tên VPĐD/CN công ty QLQ nước ngoài tại VN.
  target_attr_name: Foreign Fund Management Organization Unit Name
- target_column: frgn_fnd_mgt_ou_en_nm
  transformation: fo.EnName
  data_type: string
  description: Tên tiếng Anh VPĐD/CN.
  target_attr_name: Foreign Fund Management Organization Unit English Name
- target_column: practice_st_code
  transformation: fo.Status
  data_type: string
  description: Trạng thái hoạt động.
  target_attr_name: Practice Status Code
- target_column: end_dt
  transformation: fo.EndDate
  data_type: date
  description: Ngày chấm dứt hoạt động.
  target_attr_name: End Date
- target_column: chg_license_nbr
  transformation: fo.ChangeLicense
  data_type: string
  description: Số giấy phép điều chỉnh gần nhất.
  target_attr_name: Change License Number
- target_column: chg_license_dt
  transformation: fo.ChangeLicenseDate
  data_type: date
  description: Ngày cấp giấy phép điều chỉnh.
  target_attr_name: Change License Date
- target_column: chg_note
  transformation: fo.ChangeNote
  data_type: string
  description: Nội dung thay đổi theo giấy phép điều chỉnh.
  target_attr_name: Change Note
- target_column: bsn_tp_codes
  transformation: fg.bsn_tp_codes
  data_type: array<string>
  description: Danh sách mã ngành nghề kinh doanh.
  target_attr_name: Business Type Codes
- target_column: crt_by
  transformation: fo.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: fo.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: fo.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
