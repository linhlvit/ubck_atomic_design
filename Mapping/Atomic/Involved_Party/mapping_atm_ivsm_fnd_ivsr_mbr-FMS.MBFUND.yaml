schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ivsm_fnd_ivsr_mbr-FMS.MBFUND
  logical_name: Mapping Atomic - Investment Fund Investor Membership – source FMS.MBFUND
  physical_name: ivsm_fnd_ivsr_mbr
  dm_ref: ATM-ivsm_fnd_ivsr_mbr-FMS.MBFUND
  brd_ref: BRD-SRC-FMS-MBFUND
target:
  namespace: atm
  physical_name: ivsm_fnd_ivsr_mbr
  etl_handle: SCD4A
  description: Quan hệ thành viên của nhà đầu tư trong một quỹ đầu tư. Lưu tỷ lệ vốn
    góp và trạng thái tham gia.
input:
- source_type: physical_table
  namespace: ods
  table_name: MBFUND
  alias: mb
  select_fields: Id, FndId, InvesId, Capital, Ratio, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: ivsm_fnd_ivsr_mbr_id
  transformation: '{hash_id}(''FMS_MBFUND'', mb.Id)'
  data_type: string
  description: Khóa đại diện cho quan hệ góp vốn của NĐT vào quỹ.
  target_attr_name: Investment Fund Investor Membership Id
- target_column: ivsm_fnd_ivsr_mbr_code
  transformation: mb.Id
  data_type: string
  description: Mã định danh quan hệ góp vốn. Map từ PK bảng nguồn.
  target_attr_name: Investment Fund Investor Membership Code
- target_column: src_stm_code
  transformation: '''FMS_MBFUND'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: ivsm_fnd_id
  transformation: '{hash_id}(''FMS_FUNDS'', mb.FndId)'
  data_type: string
  description: FK đến quỹ đầu tư.
  target_attr_name: Investment Fund Id
- target_column: ivsm_fnd_code
  transformation: mb.FndId
  data_type: string
  description: Mã quỹ đầu tư.
  target_attr_name: Investment Fund Code
- target_column: dscr_ivsm_ivsr_id
  transformation: '{hash_id}(''FMS_INVES'', mb.InvesId)'
  data_type: string
  description: FK đến nhà đầu tư.
  target_attr_name: Discretionary Investment Investor Id
- target_column: dscr_ivsm_ivsr_code
  transformation: mb.InvesId
  data_type: string
  description: Mã nhà đầu tư.
  target_attr_name: Discretionary Investment Investor Code
- target_column: cptl_amt
  transformation: mb.Capital
  data_type: decimal(23,2)
  description: Số vốn góp của NĐT vào quỹ (VNĐ).
  target_attr_name: Capital Amount
- target_column: own_rto
  transformation: mb.Ratio
  data_type: decimal(5,2)
  description: Tỷ lệ sở hữu của NĐT trong quỹ (%).
  target_attr_name: Ownership Ratio
- target_column: crt_tms
  transformation: mb.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: mb.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
