schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alt_identn-FMS.FORBRCH
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.FORBRCH
  physical_name: ip_alt_identn
  dm_ref: ATM-ip_alt_identn-FMS.FORBRCH
  brd_ref: BRD-SRC-FMS-FORBRCH
target:
  namespace: atm
  physical_name: ip_alt_identn
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: FORBRCH
  alias: fo
  select_fields: Id, ChangeLicense, ChangeLicenseDate
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_FORBRCH'', fo.Id)'
  data_type: string
  description: FK đến Foreign Fund Management Organization Unit.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: fo.Id
  data_type: string
  description: Mã VPĐD/CN QLQ NN.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_FORBRCH'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identn_tp_code
  transformation: '''BUSINESS_LICENSE'''
  data_type: string
  description: Loại giấy tờ — giấy phép điều chỉnh.
  target_attr_name: Identification Type Code
- target_column: identn_nbr
  transformation: fo.ChangeLicense
  data_type: string
  description: Số giấy phép điều chỉnh gần nhất.
  target_attr_name: Identification Number
- target_column: issu_dt
  transformation: fo.ChangeLicenseDate
  data_type: date
  description: Ngày cấp giấy phép điều chỉnh.
  target_attr_name: Issue Date
- target_column: issu_ahr_nm
  transformation: 'null'
  data_type: string
  description: Cơ quan cấp giấy phép thành lập
  target_attr_name: Issuing Authority Name
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
