schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-FMS.BRANCHES
  logical_name: Mapping Staging – source FMS.BRANCHES
  physical_name: stg_fms_branches
  dm_ref: null
  brd_ref: BRD-SRC-FMS-BRANCHES
target:
  namespace: stg
  physical_name: stg_fms_branches
  etl_handle: Fact Snapshot
  description: Danh sách CN/VPĐD công ty QLQ trong nước
input:
- source_type: physical_table
  namespace: src
  table_name: BRANCHES
  alias: bran
  select_fields: Id, SecId, Name, Address, Telephone, Fax, BrType, BrIdowner, Decision,
    DecisionDate, Status, StopDate, TLId, TLName, VoucherNo, VoucherDate, Deleted,
    IsDataMigration, FileData, FileName, Content, DesChange, Description, CreatedBy,
    DateCreated, DateModified, ModifyBy
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: HEX(bran.Id)
  data_type: string
  description: Mã ID CN/VPĐD công ty QLQ trong nước (PK)
  target_attr_name: null
- target_column: secid
  transformation: HEX(bran.SecId)
  data_type: string
  description: Mã ID công ty QLQ. FK → SECURITIES.Id
  target_attr_name: null
- target_column: name
  transformation: bran.Name
  data_type: string
  description: Tên chi nhánh/VPĐD
  target_attr_name: null
- target_column: address
  transformation: bran.Address
  data_type: string
  description: Địa chỉ
  target_attr_name: null
- target_column: telephone
  transformation: bran.Telephone
  data_type: string
  description: Điện thoại
  target_attr_name: null
- target_column: fax
  transformation: bran.Fax
  data_type: string
  description: Số Fax
  target_attr_name: null
- target_column: brtype
  transformation: bran.BrType
  data_type: decimal(22,0)
  description: 1 = CN công ty QLQ trong nước; 4 = VPĐD QLQ trong nước
  target_attr_name: null
- target_column: bridowner
  transformation: bran.BrIdowner
  data_type: string
  description: Chi nhánh/VPĐD cha/con
  target_attr_name: null
- target_column: decision
  transformation: bran.Decision
  data_type: string
  description: Giấy phép thành lập
  target_attr_name: null
- target_column: decisiondate
  transformation: bran.DecisionDate
  data_type: date
  description: Ngày cấp giấy phép
  target_attr_name: null
- target_column: status
  transformation: bran.Status
  data_type: decimal(22,0)
  description: Mã ID trạng thái. FK → STATUS.Id
  target_attr_name: null
- target_column: stopdate
  transformation: bran.StopDate
  data_type: date
  description: Ngày đóng cửa
  target_attr_name: null
- target_column: tlid
  transformation: HEX(bran.TLId)
  data_type: string
  description: Mã ID người đại diện. FK → TLProfiles.Id
  target_attr_name: null
- target_column: tlname
  transformation: bran.TLName
  data_type: string
  description: Tên người đại diện
  target_attr_name: null
- target_column: voucherno
  transformation: bran.VoucherNo
  data_type: string
  description: Số GP/QĐ/CV sửa đổi
  target_attr_name: null
- target_column: voucherdate
  transformation: bran.VoucherDate
  data_type: date
  description: Ngày chấp thuận
  target_attr_name: null
- target_column: deleted
  transformation: bran.Deleted
  data_type: boolean
  description: Trạng thái bản ghi
  target_attr_name: null
- target_column: isdatamigration
  transformation: bran.IsDataMigration
  data_type: boolean
  description: 1 = Dữ liệu đổ từ hệ thống cũ; 0 = Dữ liệu mới
  target_attr_name: null
- target_column: filedata
  transformation: bran.FileData
  data_type: string
  description: File đính kèm
  target_attr_name: null
- target_column: filename
  transformation: bran.FileName
  data_type: string
  description: Tên file đính kèm
  target_attr_name: null
- target_column: content
  transformation: bran.Content
  data_type: string
  description: Nghiệp vụ kinh doanh
  target_attr_name: null
- target_column: deschange
  transformation: bran.DesChange
  data_type: string
  description: Lý do sửa đổi
  target_attr_name: null
- target_column: description
  transformation: bran.Description
  data_type: string
  description: Ghi chú
  target_attr_name: null
- target_column: createdby
  transformation: bran.CreatedBy
  data_type: string
  description: Người tạo
  target_attr_name: null
- target_column: datecreated
  transformation: bran.DateCreated
  data_type: date
  description: Ngày tạo
  target_attr_name: null
- target_column: datemodified
  transformation: bran.DateModified
  data_type: date
  description: Ngày sửa
  target_attr_name: null
- target_column: modifyby
  transformation: bran.ModifyBy
  data_type: string
  description: Người sửa
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
