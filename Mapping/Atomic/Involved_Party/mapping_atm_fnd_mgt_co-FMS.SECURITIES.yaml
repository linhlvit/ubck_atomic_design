schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-fnd_mgt_co-FMS.SECURITIES
  logical_name: Mapping Atomic - Fund Management Company – source FMS.SECURITIES
  physical_name: fnd_mgt_co
  dm_ref: ATM-fnd_mgt_co-FMS.SECURITIES
  brd_ref: BRD-SRC-FMS-SECURITIES
target:
  namespace: atm
  physical_name: fnd_mgt_co
  etl_handle: SCD4A
  description: Công ty quản lý quỹ đầu tư chứng khoán trong nước được UBCKNN cấp phép
    hoạt động. Lưu thông tin pháp lý và hoạt động của công ty.
input:
- source_type: physical_table
  namespace: ods
  table_name: SECURITIES
  alias: secu
  select_fields: Id, Name, ShortName, EnName, Status, SecCapital, Dorf, Decision,
    DecisionDate, ActiveDate, StopDate, CreatedBy, DateCreated, DateModified
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: SECBUSINES
  alias: se_bu_raw
  select_fields: SecuritieId, BuId
  filter: null
  note: Pure junction — denormalize thành ARRAY
- source_type: derived_cte
  namespace: null
  table_name: se_bu_raw
  alias: se_bu
  select_fields: SecuritieId, COLLECT_LIST(NAMED_STRUCT('bsn_tp_codes', BuId)) AS
    bsn_tp_codes
  filter: GROUP BY SecuritieId
relationship:
- main_alias: secu
  join_type: LEFT JOIN
  join_alias: se_bu
  join_on: secu.Id = se_bu.SecuritieId
mapping_columns:
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', secu.Id)'
  data_type: string
  description: Khóa đại diện cho công ty quản lý quỹ trong nước.
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: secu.Id
  data_type: string
  description: Mã định danh công ty QLQ. Map từ PK bảng nguồn.
  target_attr_name: Fund Management Company Code
- target_column: src_stm_code
  transformation: '''FMS_SECURITIES'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: fnd_mgt_co_nm
  transformation: secu.Name
  data_type: string
  description: Tên đầy đủ công ty QLQ trong nước.
  target_attr_name: Fund Management Company Name
- target_column: fnd_mgt_co_shrt_nm
  transformation: secu.ShortName
  data_type: string
  description: Tên viết tắt công ty QLQ.
  target_attr_name: Fund Management Company Short Name
- target_column: fnd_mgt_co_en_nm
  transformation: secu.EnName
  data_type: string
  description: Tên tiếng Anh công ty QLQ.
  target_attr_name: Fund Management Company English Name
- target_column: practice_st_code
  transformation: secu.Status
  data_type: string
  description: Trạng thái hoạt động của công ty QLQ.
  target_attr_name: Practice Status Code
- target_column: charter_cptl_amt
  transformation: secu.SecCapital
  data_type: decimal(23,2)
  description: Vốn điều lệ công ty QLQ (VNĐ).
  target_attr_name: Charter Capital Amount
- target_column: dorf_ind
  transformation: secu.Dorf
  data_type: string
  description: Loại hình trong/ngoài nước. 1=Trong nước; 0=Nước ngoài.
  target_attr_name: Dorf Indicator
- target_column: license_dcsn_nbr
  transformation: secu.Decision
  data_type: string
  description: Số quyết định/giấy phép thành lập.
  target_attr_name: License Decision Number
- target_column: license_dcsn_dt
  transformation: secu.DecisionDate
  data_type: date
  description: Ngày cấp phép.
  target_attr_name: License Decision Date
- target_column: actv_dt
  transformation: secu.ActiveDate
  data_type: date
  description: Ngày bắt đầu hoạt động.
  target_attr_name: Active Date
- target_column: stop_dt
  transformation: secu.StopDate
  data_type: date
  description: Ngày ngừng hoạt động.
  target_attr_name: Stop Date
- target_column: bsn_tp_codes
  transformation: se_bu.bsn_tp_codes
  data_type: array<string>
  description: Danh sách mã ngành nghề kinh doanh.
  target_attr_name: Business Type Codes
- target_column: crt_by
  transformation: secu.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: secu.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: secu.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
- target_column: cty_of_rgst_id
  transformation: '{hash_id}(''FIMS_NATIONAL'', secu.)'
  data_type: string
  description: FK đến quốc gia đăng ký của công ty QLQ.
  target_attr_name: Country of Registration Id
- target_column: cty_of_rgst_code
  transformation: 'null'
  data_type: string
  description: Mã quốc gia đăng ký.
  target_attr_name: Country of Registration Code
- target_column: lcs_code
  transformation: 'null'
  data_type: string
  description: Trạng thái hoạt động. ID lấy từ bảng STATUS.
  target_attr_name: Life Cycle Status Code
- target_column: director_nm
  transformation: 'null'
  data_type: string
  description: Tên Tổng giám đốc (denormalized).
  target_attr_name: Director Name
- target_column: depst_ctf_nbr
  transformation: 'null'
  data_type: string
  description: Chứng nhận lưu ký — thông tin bổ sung của FIMS không có trong FMS.SECURITIES.
  target_attr_name: Depository Certificate Number
- target_column: co_tp_codes
  transformation: secu.co_tp_codes
  data_type: array<string>
  description: Danh sách mã loại hình doanh nghiệp. Từ bảng junction FUNDCOMTYPE.
  target_attr_name: Company Type Codes
- target_column: dsc
  transformation: 'null'
  data_type: string
  description: Ghi chú.
  target_attr_name: Description
- target_column: co_tp_code
  transformation: 'null'
  data_type: string
  description: Loại hình công ty.
  target_attr_name: Company Type Code
- target_column: fnd_tp_code
  transformation: 'null'
  data_type: string
  description: Loại quỹ (áp dụng cho quỹ đầu tư).
  target_attr_name: Fund Type Code
- target_column: bsn_license_nbr
  transformation: 'null'
  data_type: string
  description: Số giấy phép kinh doanh.
  target_attr_name: Business License Number
- target_column: webst
  transformation: 'null'
  data_type: string
  description: Website chính thức.
  target_attr_name: Website
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
