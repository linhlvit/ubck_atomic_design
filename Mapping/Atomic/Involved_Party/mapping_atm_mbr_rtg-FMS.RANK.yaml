schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-mbr_rtg-FMS.RANK
  logical_name: Mapping Atomic - Member Rating – source FMS.RANK
  physical_name: mbr_rtg
  dm_ref: ATM-mbr_rtg-FMS.RANK
  brd_ref: BRD-SRC-FMS-RANK
target:
  namespace: atm
  physical_name: mbr_rtg
  etl_handle: SCD4A
  description: Kết quả xếp loại của một công ty quản lý quỹ trong một kỳ đánh giá.
    Ghi nhận điểm tổng hợp và hạng xếp loại.
input:
- source_type: physical_table
  namespace: ods
  table_name: RANK
  alias: rank
  select_fields: Id, SecId, RatingPdId, TotalScore, RankValue, RankClass, DateCreated,
    DateModified
  filter: created_at = to_date("etl_date", 'yyyy-MM-dd')
relationship: []
mapping_columns:
- target_column: mbr_rtg_id
  transformation: '{hash_id}(''FMS_RANK'', rank.Id)'
  data_type: string
  description: Khóa đại diện cho kết quả xếp hạng thành viên.
  target_attr_name: Member Rating Id
- target_column: mbr_rtg_code
  transformation: rank.Id
  data_type: string
  description: Mã định danh kết quả xếp hạng. Map từ PK bảng nguồn.
  target_attr_name: Member Rating Code
- target_column: src_stm_code
  transformation: '''FMS_RANK'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', rank.SecId)'
  data_type: string
  description: FK đến công ty QLQ được xếp hạng.
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: rank.SecId
  data_type: string
  description: Mã công ty QLQ được xếp hạng.
  target_attr_name: Fund Management Company Code
- target_column: mbr_rtg_prd_id
  transformation: '{hash_id}(''FMS_RATINGPD'', rank.RatingPdId)'
  data_type: string
  description: FK đến kỳ đánh giá xếp loại.
  target_attr_name: Member Rating Period Id
- target_column: mbr_rtg_prd_code
  transformation: rank.RatingPdId
  data_type: string
  description: Mã kỳ đánh giá xếp loại.
  target_attr_name: Member Rating Period Code
- target_column: tot_scor
  transformation: rank.TotalScore
  data_type: decimal(5,2)
  description: Tổng điểm đánh giá.
  target_attr_name: Total Score
- target_column: rank_val
  transformation: rank.RankValue
  data_type: int
  description: Giá trị xếp hạng (thứ tự).
  target_attr_name: Rank Value
- target_column: rank_clss_code
  transformation: rank.RankClass
  data_type: string
  description: Xếp loại kết quả đánh giá.
  target_attr_name: Rank Class Code
- target_column: crt_tms
  transformation: rank.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: rank.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
