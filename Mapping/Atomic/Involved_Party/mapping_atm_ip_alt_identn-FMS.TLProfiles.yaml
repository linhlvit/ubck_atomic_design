schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alt_identn-FMS.TLProfiles
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.TLProfiles
  physical_name: ip_alt_identn
  dm_ref: ATM-ip_alt_identn-FMS.TLProfiles
  brd_ref: BRD-SRC-FMS-TLProfiles
target:
  namespace: atm
  physical_name: ip_alt_identn
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: TLProfiles
  alias: tl
  select_fields: Id, IdNo
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_TLProfiles'', tl.Id)'
  data_type: string
  description: FK đến Fund Management Company Key Person.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: tl.Id
  data_type: string
  description: Mã nhân sự công ty QLQ.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_TLProfiles'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identn_tp_code
  transformation: '''CITIZEN_ID'''
  data_type: string
  description: Loại giấy tờ định danh cá nhân.
  target_attr_name: Identification Type Code
- target_column: identn_nbr
  transformation: tl.IdNo
  data_type: string
  description: Số giấy tờ định danh.
  target_attr_name: Identification Number
- target_column: issu_dt
  transformation: 'null'
  data_type: date
  description: Ngày cấp CCCD/Hộ chiếu.
  target_attr_name: Issue Date
- target_column: issu_ahr_nm
  transformation: 'null'
  data_type: string
  description: Nơi cấp CCCD/Hộ chiếu.
  target_attr_name: Issuing Authority Name
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
