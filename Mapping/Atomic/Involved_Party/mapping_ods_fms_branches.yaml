  target_attr_name: null
- target_column: description
  transformation: bran.description
  data_type: string
  description: Ghi chú
  target_attr_name: null
- target_column: createdby
  transformation: bran.createdby
  data_type: string
  description: Người tạo
  target_attr_name: null
- target_column: datecreated
  transformation: bran.datecreated
  data_type: date
  description: Ngày tạo
  target_attr_name: null
- target_column: datemodified
  transformation: bran.datemodified
  data_type: date
  description: Ngày sửa
  target_attr_name: null
- target_column: modifyby
