schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alt_identn-FMS.BRANCHES
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.BRANCHES
  physical_name: ip_alt_identn
  dm_ref: ATM-ip_alt_identn-FMS.BRANCHES
  brd_ref: BRD-SRC-FMS-BRANCHES
target:
  namespace: atm
  physical_name: ip_alt_identn
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: BRANCHES
  alias: bran
  select_fields: Id, Decision, DecisionDate
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_BRANCHES'', bran.Id)'
  data_type: string
  description: FK đến Fund Management Company Organization Unit.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: bran.Id
  data_type: string
  description: Mã CN/VPĐD công ty QLQ.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_BRANCHES'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identn_tp_code
  transformation: '''ESTABLISHMENT_DECISION'''
  data_type: string
  description: Loại giấy tờ — quyết định thành lập CN/VPĐD.
  target_attr_name: Identification Type Code
- target_column: identn_nbr
  transformation: bran.Decision
  data_type: string
  description: Số quyết định thành lập CN/VPĐD.
  target_attr_name: Identification Number
- target_column: issu_dt
  transformation: bran.DecisionDate
  data_type: date
  description: Ngày cấp quyết định thành lập.
  target_attr_name: Issue Date
- target_column: issu_ahr_nm
  transformation: 'null'
  data_type: string
  description: Cơ quan ban hành quyết định thành lập
  target_attr_name: Issuing Authority Name
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
