schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-fnd_mgt_co_key_psn-FMS.TLProfiles
  logical_name: Mapping Atomic - Fund Management Company Key Person – source FMS.TLProfiles
  physical_name: fnd_mgt_co_key_psn
  dm_ref: ATM-fnd_mgt_co_key_psn-FMS.TLProfiles
  brd_ref: BRD-SRC-FMS-TLProfiles
target:
  namespace: atm
  physical_name: fnd_mgt_co_key_psn
  etl_handle: SCD4A
  description: Nhân sự chủ chốt của công ty quản lý quỹ (giám đốc/chuyên gia đầu tư/người
    được ủy quyền). Lưu thông tin cá nhân và chứng chỉ hành nghề.
input:
- source_type: physical_table
  namespace: ods
  table_name: TLProfiles
  alias: tl
  select_fields: Id, SecId, FullName, BirthDate, NatId, JobTypeId, IsLegal, IsCBTT,
    CreatedBy, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: fnd_mgt_co_key_psn_id
  transformation: '{hash_id}(''FMS_TLProfiles'', tl.Id)'
  data_type: string
  description: Khóa đại diện cho nhân sự chủ chốt công ty QLQ.
  target_attr_name: Fund Management Company Key Person Id
- target_column: fnd_mgt_co_key_psn_code
  transformation: tl.Id
  data_type: string
  description: Mã định danh nhân sự. Map từ PK bảng nguồn.
  target_attr_name: Fund Management Company Key Person Code
- target_column: src_stm_code
  transformation: '''FMS_TLPROFILES'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', tl.SecId)'
  data_type: string
  description: FK đến công ty QLQ.
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: tl.SecId
  data_type: string
  description: Mã công ty QLQ.
  target_attr_name: Fund Management Company Code
- target_column: full_nm
  transformation: tl.FullName
  data_type: string
  description: Họ và tên đầy đủ nhân sự.
  target_attr_name: Full Name
- target_column: brth_dt
  transformation: tl.BirthDate
  data_type: date
  description: Ngày sinh.
  target_attr_name: Birth Date
- target_column: nat_code
  transformation: tl.NatId
  data_type: string
  description: Quốc tịch.
  target_attr_name: Nationality Code
- target_column: job_tp_code
  transformation: tl.JobTypeId
  data_type: string
  description: Loại chức vụ.
  target_attr_name: Job Type Code
- target_column: is_lgl_rprs_ind
  transformation: tl.IsLegal
  data_type: string
  description: Cờ đánh dấu người đại diện pháp luật.
  target_attr_name: Is Legal Representative Indicator
- target_column: is_dscl_rprs_ind
  transformation: tl.IsCBTT
  data_type: string
  description: Cờ đánh dấu đại diện công bố thông tin (CBTT).
  target_attr_name: Is Disclosure Representative Indicator
- target_column: crt_by
  transformation: tl.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: tl.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: tl.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
