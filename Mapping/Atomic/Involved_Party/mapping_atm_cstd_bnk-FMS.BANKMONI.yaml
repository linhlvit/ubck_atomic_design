schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-cstd_bnk-FMS.BANKMONI
  logical_name: Mapping Atomic - Custodian Bank – source FMS.BANKMONI
  physical_name: cstd_bnk
  dm_ref: ATM-cstd_bnk-FMS.BANKMONI
  brd_ref: BRD-SRC-FMS-BANKMONI
target:
  namespace: atm
  physical_name: cstd_bnk
  etl_handle: SCD4A
  description: Ngân hàng lưu ký giám sát tài sản quỹ đầu tư chứng khoán được UBCKNN
    chấp thuận. Chịu trách nhiệm lưu giữ và giám sát tài sản của quỹ.
input:
- source_type: physical_table
  namespace: ods
  table_name: BANKMONI
  alias: ba_mo
  select_fields: Id, Name, ShortName, Status, CreatedBy, DateCreated, DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: cstd_bnk_id
  transformation: '{hash_id}(''FMS_BANKMONI'', ba_mo.Id)'
  data_type: string
  description: Khóa đại diện cho ngân hàng lưu ký giám sát.
  target_attr_name: Custodian Bank Id
- target_column: cstd_bnk_code
  transformation: ba_mo.Id
  data_type: string
  description: Mã định danh ngân hàng LKGS. Map từ PK bảng nguồn.
  target_attr_name: Custodian Bank Code
- target_column: src_stm_code
  transformation: '''FMS_BANKMONI'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: cstd_bnk_nm
  transformation: ba_mo.Name
  data_type: string
  description: Tên đầy đủ ngân hàng lưu ký giám sát.
  target_attr_name: Custodian Bank Name
- target_column: cstd_bnk_shrt_nm
  transformation: ba_mo.ShortName
  data_type: string
  description: Tên viết tắt ngân hàng LKGS.
  target_attr_name: Custodian Bank Short Name
- target_column: practice_st_code
  transformation: ba_mo.Status
  data_type: string
  description: Trạng thái hoạt động.
  target_attr_name: Practice Status Code
- target_column: crt_by
  transformation: ba_mo.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: ba_mo.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: ba_mo.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
- target_column: cty_of_rgst_id
  transformation: '{hash_id}(''FIMS_NATIONAL'', ba_mo.)'
  data_type: string
  description: FK đến quốc gia đăng ký của ngân hàng LKGS.
  target_attr_name: Country of Registration Id
- target_column: cty_of_rgst_code
  transformation: 'null'
  data_type: string
  description: Mã quốc gia đăng ký.
  target_attr_name: Country of Registration Code
- target_column: cstd_bnk_en_nm
  transformation: 'null'
  data_type: string
  description: Tên tiếng Anh.
  target_attr_name: Custodian Bank English Name
- target_column: charter_cptl_amt
  transformation: 'null'
  data_type: decimal(23,2)
  description: Vốn điều lệ (VNĐ). Thông tin bổ sung của FIMS không có trong FMS.BANKMONI.
  target_attr_name: Charter Capital Amount
- target_column: lcs_code
  transformation: 'null'
  data_type: string
  description: Trạng thái hoạt động. ID lấy từ bảng STATUS.
  target_attr_name: Life Cycle Status Code
- target_column: director_nm
  transformation: 'null'
  data_type: string
  description: Tên Tổng giám đốc (denormalized).
  target_attr_name: Director Name
- target_column: depst_ctf_nbr
  transformation: 'null'
  data_type: string
  description: Chứng nhận lưu ký — thông tin bổ sung của FIMS không có trong FMS.BANKMONI.
  target_attr_name: Depository Certificate Number
- target_column: dsc
  transformation: 'null'
  data_type: string
  description: Ghi chú.
  target_attr_name: Description
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
