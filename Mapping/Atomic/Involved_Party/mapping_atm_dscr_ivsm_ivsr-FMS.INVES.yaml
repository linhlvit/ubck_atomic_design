schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-dscr_ivsm_ivsr-FMS.INVES
  logical_name: Mapping Atomic - Discretionary Investment Investor – source FMS.INVES
  physical_name: dscr_ivsm_ivsr
  dm_ref: ATM-dscr_ivsm_ivsr-FMS.INVES
  brd_ref: BRD-SRC-FMS-INVES
target:
  namespace: atm
  physical_name: dscr_ivsm_ivsr
  etl_handle: SCD4A
  description: Nhà đầu tư ủy thác — cá nhân hoặc tổ chức giao tài sản cho công ty
    quản lý quỹ quản lý theo hợp đồng ủy thác đầu tư.
input:
- source_type: physical_table
  namespace: ods
  table_name: INVES
  alias: in
  select_fields: Id, Name, Dorf, NatId, StoId, RelationShip, SecId, CreatedBy, DateCreated,
    DateModified
  filter: null
relationship: []
mapping_columns:
- target_column: dscr_ivsm_ivsr_id
  transformation: '{hash_id}(''FMS_INVES'', in.Id)'
  data_type: string
  description: Khóa đại diện cho nhà đầu tư ủy thác.
  target_attr_name: Discretionary Investment Investor Id
- target_column: dscr_ivsm_ivsr_code
  transformation: in.Id
  data_type: string
  description: Mã định danh nhà đầu tư ủy thác. Map từ PK bảng nguồn.
  target_attr_name: Discretionary Investment Investor Code
- target_column: src_stm_code
  transformation: '''FMS_INVES'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: ivsr_nm
  transformation: in.Name
  data_type: string
  description: Tên nhà đầu tư ủy thác (cá nhân hoặc tổ chức).
  target_attr_name: Investor Name
- target_column: dorf_ind
  transformation: in.Dorf
  data_type: string
  description: Loại hình trong/ngoài nước. 1=Trong nước; 0=Nước ngoài.
  target_attr_name: Dorf Indicator
- target_column: nat_code
  transformation: in.NatId
  data_type: string
  description: Quốc tịch nhà đầu tư.
  target_attr_name: Nationality Code
- target_column: stockholder_tp_code
  transformation: in.StoId
  data_type: string
  description: Loại hình nhà đầu tư/cổ đông.
  target_attr_name: Stockholder Type Code
- target_column: rltnp_tp_code
  transformation: in.RelationShip
  data_type: string
  description: Mối quan hệ cổ đông với tổ chức liên quan.
  target_attr_name: Relationship Type Code
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', in.SecId)'
  data_type: string
  description: FK đến công ty QLQ đang nhận ủy thác.
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: in.SecId
  data_type: string
  description: Mã công ty QLQ đang nhận ủy thác.
  target_attr_name: Fund Management Company Code
- target_column: crt_by
  transformation: in.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: in.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: in.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
