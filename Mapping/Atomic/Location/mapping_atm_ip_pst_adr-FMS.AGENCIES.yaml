schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_pst_adr-FMS.AGENCIES
  logical_name: Mapping Atomic - Involved Party Postal Address – source FMS.AGENCIES
  physical_name: ip_pst_adr
  dm_ref: ATM-ip_pst_adr-FMS.AGENCIES
  brd_ref: BRD-SRC-FMS-AGENCIES
target:
  namespace: atm
  physical_name: ip_pst_adr
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: AGENCIES
  alias: agen
  select_fields: Id, Address
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_AGENCIES'', agen.Id)'
  data_type: string
  description: FK đến Fund Distribution Agent.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: agen.Id
  data_type: string
  description: Mã đại lý phân phối quỹ.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_AGENCIES'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: '''HEAD_OFFICE'''
  data_type: string
  description: Loại địa chỉ.
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: agen.Address
  data_type: string
  description: Địa chỉ trụ sở đại lý phân phối quỹ.
  target_attr_name: Address Value
- target_column: prov_id
  transformation: '{hash_id}(''FIMS_NATIONAL'', agen.)'
  data_type: string
  description: FK đến tỉnh/thành phố trụ sở.
  target_attr_name: Province Id
- target_column: prov_code
  transformation: 'null'
  data_type: string
  description: Mã tỉnh/thành (provinces).
  target_attr_name: Province Code
- target_column: dstc_nm
  transformation: 'null'
  data_type: string
  description: Quận/huyện trụ sở.
  target_attr_name: District Name
- target_column: ward_nm
  transformation: 'null'
  data_type: string
  description: Phường/xã trụ sở.
  target_attr_name: Ward Name
- target_column: geo_id
  transformation: '{hash_id}(''FIMS_NATIONAL'', agen.)'
  data_type: string
  description: FK đến tỉnh/thành phố đặt trụ sở chi nhánh.
  target_attr_name: Geographic Area Id
- target_column: geo_code
  transformation: 'null'
  data_type: string
  description: Mã tỉnh/thành phố đặt trụ sở chi nhánh.
  target_attr_name: Geographic Area Code
- target_column: adr_dtl
  transformation: 'null'
  data_type: string
  description: Địa chỉ văn phòng đại diện.
  target_attr_name: Address Detail
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
