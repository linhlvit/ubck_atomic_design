schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-mbr_prd_rpt-FMS.RPTMEMBER
  logical_name: Mapping Atomic - Member Periodic Report – source FMS.RPTMEMBER
  physical_name: mbr_prd_rpt
  dm_ref: ATM-mbr_prd_rpt-FMS.RPTMEMBER
  brd_ref: BRD-SRC-FMS-RPTMEMBER
target:
  namespace: atm
  physical_name: mbr_prd_rpt
  etl_handle: Fact Append
  description: Báo cáo định kỳ do thành viên thị trường nộp lên UBCKNN theo từng kỳ
    báo cáo. Ghi nhận trạng thái nộp và thời hạn.
input:
- source_type: physical_table
  namespace: ods
  table_name: RPTMEMBER
  alias: rp
  select_fields: Id, SecId, FndId, BkMId, FrBrId, RptId, PrdId, IsImport, RptName,
    ContentSummary, ReportType, Type, PeriodType, YearValue, DayReport, DeadlineSend,
    DateSubmitted, Status, CreatedBy, DateCreated, DateModified
  filter: created_at >= {data_date}
relationship: []
mapping_columns:
- target_column: mbr_prd_rpt_id
  transformation: '{hash_id}(''FMS_RPTMEMBER'', rp.Id)'
  data_type: string
  description: Khóa đại diện cho báo cáo định kỳ thành viên.
  target_attr_name: Member Periodic Report Id
- target_column: mbr_prd_rpt_code
  transformation: rp.Id
  data_type: string
  description: Mã định danh báo cáo. Map từ PK bảng nguồn.
  target_attr_name: Member Periodic Report Code
- target_column: src_stm_code
  transformation: '''FMS_RPTMEMBER'''
  data_type: string
  description: Mã nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: fnd_mgt_co_id
  transformation: '{hash_id}(''FMS_SECURITIES'', rp.SecId)'
  data_type: string
  description: FK đến công ty QLQ nộp báo cáo (nullable).
  target_attr_name: Fund Management Company Id
- target_column: fnd_mgt_co_code
  transformation: rp.SecId
  data_type: string
  description: Mã công ty QLQ.
  target_attr_name: Fund Management Company Code
- target_column: ivsm_fnd_id
  transformation: '{hash_id}(''FMS_FUNDS'', rp.FndId)'
  data_type: string
  description: FK đến quỹ đầu tư nộp báo cáo (nullable).
  target_attr_name: Investment Fund Id
- target_column: ivsm_fnd_code
  transformation: rp.FndId
  data_type: string
  description: Mã quỹ đầu tư.
  target_attr_name: Investment Fund Code
- target_column: cstd_bnk_id
  transformation: '{hash_id}(''FMS_BANKMONI'', rp.BkMId)'
  data_type: string
  description: FK đến ngân hàng LKGS nộp báo cáo (nullable).
  target_attr_name: Custodian Bank Id
- target_column: cstd_bnk_code
  transformation: rp.BkMId
  data_type: string
  description: Mã ngân hàng LKGS.
  target_attr_name: Custodian Bank Code
- target_column: frgn_fnd_mgt_ou_id
  transformation: '{hash_id}(''FMS_FORBRCH'', rp.FrBrId)'
  data_type: string
  description: FK đến VPĐD/CN QLQ NN nộp báo cáo (nullable).
  target_attr_name: Foreign Fund Management Organization Unit Id
- target_column: frgn_fnd_mgt_ou_code
  transformation: rp.FrBrId
  data_type: string
  description: Mã VPĐD/CN QLQ NN.
  target_attr_name: Foreign Fund Management Organization Unit Code
- target_column: rpt_tpl_id
  transformation: '{hash_id}(''FIMS_RPTTEMP'', rp.RptId)'
  data_type: string
  description: FK đến biểu mẫu báo cáo.
  target_attr_name: Report Template Id
- target_column: rpt_tpl_code
  transformation: rp.RptId
  data_type: string
  description: Mã biểu mẫu báo cáo.
  target_attr_name: Report Template Code
- target_column: rpt_prd_id
  transformation: '{hash_id}(''FMS_RPTPERIOD'', rp.PrdId)'
  data_type: string
  description: FK đến kỳ báo cáo.
  target_attr_name: Reporting Period Id
- target_column: rpt_prd_code
  transformation: rp.PrdId
  data_type: string
  description: Mã kỳ báo cáo.
  target_attr_name: Reporting Period Code
- target_column: is_impr_ind
  transformation: rp.IsImport
  data_type: string
  description: 'Là báo cáo có import: 1-Có; 2-Không.'
  target_attr_name: Is Import Indicator
- target_column: rpt_nm
  transformation: rp.RptName
  data_type: string
  description: Tên báo cáo.
  target_attr_name: Report Name
- target_column: cntnt_smy
  transformation: rp.ContentSummary
  data_type: string
  description: Tóm tắt nội dung báo cáo.
  target_attr_name: Content Summary
- target_column: rpt_tp_code
  transformation: rp.ReportType
  data_type: string
  description: 'Loại báo cáo: định kỳ hoặc bất thường.'
  target_attr_name: Report Type Code
- target_column: rpt_mbr_tp_code
  transformation: rp.Type
  data_type: string
  description: Loại thành viên nộp báo cáo.
  target_attr_name: Reporting Member Type Code
- target_column: rpt_prd_tp_code
  transformation: rp.PeriodType
  data_type: string
  description: Kiểu kỳ báo cáo (tháng/quý/năm).
  target_attr_name: Reporting Period Type Code
- target_column: yr_val
  transformation: rp.YearValue
  data_type: string
  description: Năm báo cáo.
  target_attr_name: Year Value
- target_column: day_rpt
  transformation: rp.DayReport
  data_type: int
  description: Ngày trong kỳ báo cáo.
  target_attr_name: Day Report
- target_column: subm_ddln_dt
  transformation: rp.DeadlineSend
  data_type: date
  description: Thời hạn nộp báo cáo.
  target_attr_name: Submission Deadline Date
- target_column: subm_dt
  transformation: rp.DateSubmitted
  data_type: date
  description: Ngày nộp báo cáo thực tế.
  target_attr_name: Submission Date
- target_column: rpt_subm_st_code
  transformation: rp.Status
  data_type: string
  description: Trạng thái nộp báo cáo.
  target_attr_name: Report Submission Status Code
- target_column: crt_by
  transformation: rp.CreatedBy
  data_type: string
  description: Người tạo bản ghi.
  target_attr_name: Created By
- target_column: crt_tms
  transformation: rp.DateCreated
  data_type: timestamp
  description: Ngày tạo bản ghi.
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: rp.DateModified
  data_type: timestamp
  description: Ngày cập nhật bản ghi.
  target_attr_name: Updated Timestamp
- target_column: scr_co_id
  transformation: '{hash_id}(''FIMS_SECURITIESCOMPANY'', rp.)'
  data_type: string
  description: FK đến công ty chứng khoán gửi báo cáo.
  target_attr_name: Securities Company Id
- target_column: scr_co_code
  transformation: 'null'
  data_type: string
  description: Mã công ty chứng khoán.
  target_attr_name: Securities Company Code
- target_column: rpt_subm_shd_id
  transformation: '{hash_id}(''SCMS_BM_BAO_CAO_DINH_KY'', rp.)'
  data_type: string
  description: FK đến định kỳ gửi báo cáo.
  target_attr_name: Report Submission Schedule Id
- target_column: rpt_subm_shd_code
  transformation: 'null'
  data_type: string
  description: Mã định kỳ gửi báo cáo.
  target_attr_name: Report Submission Schedule Code
- target_column: dsc
  transformation: 'null'
  data_type: string
  description: Mô tả lần gửi.
  target_attr_name: Description
- target_column: rsn
  transformation: 'null'
  data_type: string
  description: Lý do gửi (áp dụng gửi lại).
  target_attr_name: Reason
- target_column: re_subm_rsn
  transformation: 'null'
  data_type: string
  description: Lý do gửi lại.
  target_attr_name: Re Submission Reason
- target_column: attch_file
  transformation: 'null'
  data_type: string
  description: Tệp đính kèm.
  target_attr_name: Attachment File
- target_column: rpt_dt
  transformation: 'null'
  data_type: date
  description: Ngày số liệu báo cáo.
  target_attr_name: Report Date
- target_column: subm_tms
  transformation: 'null'
  data_type: timestamp
  description: Thời điểm gửi chính xác.
  target_attr_name: Submission Timestamp
- target_column: is_del_ind
  transformation: 'null'
  data_type: string
  description: 'Cờ xóa tạm: 1-Xóa; 0-Không xóa.'
  target_attr_name: Is Deleted Indicator
- target_column: subm_st_code
  transformation: 'null'
  data_type: string
  description: 'Trạng thái lần gửi: 4-Đã gửi; 5-Yêu cầu gửi lại; 6-Đã gửi lại.'
  target_attr_name: Submission Status Code
- target_column: vrsn
  transformation: 'null'
  data_type: string
  description: Phiên bản báo cáo.
  target_attr_name: Version
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
