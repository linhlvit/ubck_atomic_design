schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.APPLICATION_HISTORIES
  logical_name: Mapping Staging – source NHNCK.APPLICATION_HISTORIES
  physical_name: application_histories
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-APPLICATION_HISTORIES
target:
  namespace: stg
  physical_name: application_histories
  etl_handle: Fact Snapshot
  description: Lịch sử xử lý hồ sơ CCHN (chuyển trạng thái)
input:
- source_type: physical_table
  namespace: src
  table_name: APPLICATION_HISTORIES
  alias: ap_hi
  select_fields: ID, APPLICATION_ID, STATUS_ID, TITLE, DESCRIPTION, CREATED_AT, SENDER_ID,
    RECEIVER_ID, RECEIVER_NAME, REJECTED, FEEDBACK, UPDATED_AT, CREATED_BY, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: ap_hi.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: ap_hi.APPLICATION_ID
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: status_id
  transformation: ap_hi.STATUS_ID
  data_type: int
  description: 'FK -> APPLICATION_STATUSES: Trạng thái hồ sơ hiện tại'
  target_attr_name: null
- target_column: title
  transformation: ap_hi.TITLE
  data_type: string
  description: Tiêu đề/tên hồ sơ hoặc nhóm
  target_attr_name: null
- target_column: description
  transformation: ap_hi.DESCRIPTION
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: created_at
  transformation: ap_hi.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: sender_id
  transformation: ap_hi.SENDER_ID
  data_type: int
  description: 'FK -> USERS: Người gửi hành động xử lý'
  target_attr_name: null
- target_column: receiver_id
  transformation: ap_hi.RECEIVER_ID
  data_type: int
  description: 'FK -> USERS: Người nhận/tiếp nhận hành động xử lý'
  target_attr_name: null
- target_column: receiver_name
  transformation: ap_hi.RECEIVER_NAME
  data_type: string
  description: Tên người nhận (snapshot tại thời điểm xử lý)
  target_attr_name: null
- target_column: rejected
  transformation: ap_hi.REJECTED
  data_type: int
  description: 'Cờ hồ sơ bị trả lại: 1=Bị trả lại, 0=Không'
  target_attr_name: null
- target_column: feedback
  transformation: ap_hi.FEEDBACK
  data_type: string
  description: Phản hồi/nhận xét của cán bộ xử lý (NCLOB)
  target_attr_name: null
- target_column: updated_at
  transformation: ap_hi.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_by
  transformation: ap_hi.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ap_hi.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
