schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.DECISIONS
  logical_name: Mapping Staging – source NHNCK.DECISIONS
  physical_name: decisions
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-DECISIONS
target:
  namespace: stg
  physical_name: decisions
  etl_handle: Fact Snapshot
  description: Danh mục các quyết định hành chính
input:
- source_type: physical_table
  namespace: src
  table_name: DECISIONS
  alias: deci
  select_fields: ID, DECISION_NUMBER, TITLE, REFERENCE, DECISION_CONTENT, SIGNED_DATE,
    SIGNATORY, POSITION, DECISION_UNIT, FILE_NAME, FILE_PATH, CREATED_AT, CREATED_BY,
    UPDATED_AT, DECISION_TYPE_ID, RECORD_STATUS, CONTENT, ACTIVE, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: deci.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: decision_number
  transformation: deci.DECISION_NUMBER
  data_type: string
  description: 'Số quyết định hành chính (VD: 123/QĐ-UBCK)'
  target_attr_name: null
- target_column: title
  transformation: deci.TITLE
  data_type: string
  description: Tiêu đề/tên hồ sơ hoặc nhóm
  target_attr_name: null
- target_column: reference
  transformation: deci.REFERENCE
  data_type: string
  description: Trích dẫn căn cứ pháp lý của quyết định
  target_attr_name: null
- target_column: decision_content
  transformation: deci.DECISION_CONTENT
  data_type: string
  description: Nội dung đầy đủ của quyết định (NCLOB)
  target_attr_name: null
- target_column: signed_date
  transformation: deci.SIGNED_DATE
  data_type: date
  description: Ngày ký ban hành quyết định
  target_attr_name: null
- target_column: signatory
  transformation: deci.SIGNATORY
  data_type: string
  description: Họ tên người ký quyết định
  target_attr_name: null
- target_column: position
  transformation: deci.POSITION
  data_type: string
  description: Chức vụ/vị trí đảm nhiệm
  target_attr_name: null
- target_column: decision_unit
  transformation: deci.DECISION_UNIT
  data_type: string
  description: 'Đơn vị ban hành quyết định (VD: Ủy ban Chứng khoán Nhà nước)'
  target_attr_name: null
- target_column: file_name
  transformation: deci.FILE_NAME
  data_type: string
  description: Tên file sao lưu hoặc file đính kèm
  target_attr_name: null
- target_column: file_path
  transformation: deci.FILE_PATH
  data_type: string
  description: Đường dẫn file lưu trữ (chứng từ thanh toán, văn bản...)
  target_attr_name: null
- target_column: created_at
  transformation: deci.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: deci.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: deci.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: decision_type_id
  transformation: deci.DECISION_TYPE_ID
  data_type: int
  description: 'Loại quyết định: 1=Cấp mới chứng chỉ, 2=Thu hồi chứng chỉ, 3=Cấp lại
    chứng chỉ, 4=Công nhận KQ thi sát hạch, 5=Xử lý vi phạm NHNCK, 6=Hủy chứng chỉ
    hành nghề, 7=Khác'
  target_attr_name: null
- target_column: record_status
  transformation: deci.RECORD_STATUS
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: content
  transformation: deci.CONTENT
  data_type: string
  description: Nội dung của thông báo/thư điện tử/bổ sung hồ sơ
  target_attr_name: null
- target_column: active
  transformation: deci.ACTIVE
  data_type: int
  description: 'Cờ đang kích hoạt/hiệu lực: 1=Đang dùng, 0=Vô hiệu'
  target_attr_name: null
- target_column: updated_by
  transformation: deci.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
