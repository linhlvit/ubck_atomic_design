schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.PROCEDURES
  logical_name: Mapping Staging – source NHNCK.PROCEDURES
  physical_name: procedures
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-PROCEDURES
target:
  namespace: stg
  physical_name: procedures
  etl_handle: Fact Snapshot
  description: Thủ tục hành chính cấp CCHN
input:
- source_type: physical_table
  namespace: src
  table_name: PROCEDURES
  alias: proc
  select_fields: ID, PROCEDURE_TYPE, IMAGE, TITLE, CONTENT, PROCESSING_TIME, TARGET_AUDIENCE,
    IMPLEMENTING_AGENCY, OUTCOME, FEE, REQUIREMENTS, CREATED_AT, CREATED_BY, UPDATED_AT,
    RECORD_STATUS, FEATURED, REASON, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: proc.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: procedure_type
  transformation: proc.PROCEDURE_TYPE
  data_type: int
  description: 'Loại thủ tục: 1=Cấp mới CCHN, 2=Cấp lại CCHN, 3=Thu hồi CCHN...'
  target_attr_name: null
- target_column: image
  transformation: proc.IMAGE
  data_type: string
  description: Đường dẫn ảnh minh họa thủ tục
  target_attr_name: null
- target_column: title
  transformation: proc.TITLE
  data_type: string
  description: Tiêu đề/tên hồ sơ hoặc nhóm
  target_attr_name: null
- target_column: content
  transformation: proc.CONTENT
  data_type: string
  description: Nội dung của thông báo/thư điện tử/bổ sung hồ sơ
  target_attr_name: null
- target_column: processing_time
  transformation: proc.PROCESSING_TIME
  data_type: string
  description: Thời gian xử lý theo quy định (NCLOB mô tả)
  target_attr_name: null
- target_column: target_audience
  transformation: proc.TARGET_AUDIENCE
  data_type: string
  description: Đối tượng áp dụng thủ tục
  target_attr_name: null
- target_column: implementing_agency
  transformation: proc.IMPLEMENTING_AGENCY
  data_type: string
  description: Cơ quan thực hiện thủ tục hành chính
  target_attr_name: null
- target_column: outcome
  transformation: proc.OUTCOME
  data_type: string
  description: Kết quả đầu ra của thủ tục (NCLOB)
  target_attr_name: null
- target_column: fee
  transformation: proc.FEE
  data_type: string
  description: 'Số tiền phí (đơn vị: VNĐ)'
  target_attr_name: null
- target_column: requirements
  transformation: proc.REQUIREMENTS
  data_type: string
  description: Yêu cầu điều kiện để thực hiện thủ tục (NCLOB)
  target_attr_name: null
- target_column: created_at
  transformation: proc.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: proc.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: proc.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: record_status
  transformation: proc.RECORD_STATUS
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: featured
  transformation: proc.FEATURED
  data_type: int
  description: 'Cờ nổi bật/được đánh dấu quan trọng: 1=Nổi bật, 0=Bình thường'
  target_attr_name: null
- target_column: reason
  transformation: proc.REASON
  data_type: string
  description: Lý do thực hiện thao tác hoặc thay đổi
  target_attr_name: null
- target_column: updated_by
  transformation: proc.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
