schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.COUNTRIES
  logical_name: Mapping Staging – source NHNCK.COUNTRIES
  physical_name: countries
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-COUNTRIES
target:
  namespace: stg
  physical_name: countries
  etl_handle: Fact Snapshot
  description: Danh mục quốc gia/quốc tịch
input:
- source_type: physical_table
  namespace: src
  table_name: COUNTRIES
  alias: coun
  select_fields: ID, COUNTRY_CODE, COUNTRY_NAME, DEFAULT_FLAG, CREATED_AT, CREATED_BY,
    UPDATED_AT, RECORD_STATUS, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: coun.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: country_code
  transformation: coun.COUNTRY_CODE
  data_type: string
  description: Mã quốc gia theo chuẩn ISO 3166-1 alpha-2
  target_attr_name: null
- target_column: country_name
  transformation: coun.COUNTRY_NAME
  data_type: string
  description: Tên quốc gia/vùng lãnh thổ
  target_attr_name: null
- target_column: default_flag
  transformation: coun.DEFAULT_FLAG
  data_type: int
  description: 'Cờ là mẫu/giá trị mặc định: 1=Mặc định, 0=Không phải mặc định'
  target_attr_name: null
- target_column: created_at
  transformation: coun.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: coun.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: coun.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: record_status
  transformation: coun.RECORD_STATUS
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: updated_by
  transformation: coun.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
