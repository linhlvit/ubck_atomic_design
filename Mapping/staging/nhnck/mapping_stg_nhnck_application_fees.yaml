schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.APPLICATION_FEES
  logical_name: Mapping Staging – source NHNCK.APPLICATION_FEES
  physical_name: application_fees
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-APPLICATION_FEES
target:
  namespace: stg
  physical_name: application_fees
  etl_handle: Fact Snapshot
  description: Phí thanh toán liên quan đến hồ sơ
input:
- source_type: physical_table
  namespace: src
  table_name: APPLICATION_FEES
  alias: ap_fe
  select_fields: ID, APPLICATION_ID, PROFESSIONAL_ID, FEE_TYPE, CONTENT, NOTE, RECORD_STATUS,
    REQUEST_DATE, PAYMENT_DATE, EXPIRY_DATE, FEE, FILE_PATH, CREATED_BY, CREATED_AT,
    UPDATED_BY, UPDATED_AT
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: ap_fe.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: ap_fe.APPLICATION_ID
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: professional_id
  transformation: ap_fe.PROFESSIONAL_ID
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: fee_type
  transformation: ap_fe.FEE_TYPE
  data_type: int
  description: 'Loại phí: 1=Phí thi, 2=Phí phúc khảo, 3=Phí cấp chứng chỉ'
  target_attr_name: null
- target_column: content
  transformation: ap_fe.CONTENT
  data_type: string
  description: Nội dung của thông báo/thư điện tử/bổ sung hồ sơ
  target_attr_name: null
- target_column: note
  transformation: ap_fe.NOTE
  data_type: string
  description: Ghi chú bổ sung
  target_attr_name: null
- target_column: record_status
  transformation: ap_fe.RECORD_STATUS
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: request_date
  transformation: ap_fe.REQUEST_DATE
  data_type: date
  description: Ngày yêu cầu nộp phí
  target_attr_name: null
- target_column: payment_date
  transformation: ap_fe.PAYMENT_DATE
  data_type: date
  description: Ngày thực tế thanh toán phí
  target_attr_name: null
- target_column: expiry_date
  transformation: ap_fe.EXPIRY_DATE
  data_type: date
  description: Ngày hết hạn thanh toán phí
  target_attr_name: null
- target_column: fee
  transformation: ap_fe.FEE
  data_type: decimal(18,2)
  description: 'Số tiền phí (đơn vị: VNĐ)'
  target_attr_name: null
- target_column: file_path
  transformation: ap_fe.FILE_PATH
  data_type: string
  description: Đường dẫn file lưu trữ (chứng từ thanh toán, văn bản...)
  target_attr_name: null
- target_column: created_by
  transformation: ap_fe.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: created_at
  transformation: ap_fe.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ap_fe.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: updated_at
  transformation: ap_fe.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
