schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.SIGNATURE_LOGS
  logical_name: Mapping Staging – source NHNCK.SIGNATURE_LOGS
  physical_name: signature_logs
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-SIGNATURE_LOGS
target:
  namespace: stg
  physical_name: signature_logs
  etl_handle: Fact Snapshot
  description: Nhật ký ký số hồ sơ/CCHN
input:
- source_type: physical_table
  namespace: src
  table_name: SIGNATURE_LOGS
  alias: si_lo
  select_fields: ID, APPLICATION_ID, CERTIFICATE_RECORD_ID, SIGNED_BY, SIGNED_AT,
    RECORD_TYPE, HASH, CER_PATH, CREATED_AT, UPDATED_AT, CREATED_BY, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: si_lo.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: si_lo.APPLICATION_ID
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: certificate_record_id
  transformation: si_lo.CERTIFICATE_RECORD_ID
  data_type: int
  description: 'FK -> CERTIFICATE_RECORDS: Bản ghi CCHN trong sổ đăng bộ'
  target_attr_name: null
- target_column: signed_by
  transformation: si_lo.SIGNED_BY
  data_type: int
  description: 'FK -> USERS: Người thực hiện ký số'
  target_attr_name: null
- target_column: signed_at
  transformation: si_lo.SIGNED_AT
  data_type: date
  description: Thời điểm ký số tài liệu/hồ sơ
  target_attr_name: null
- target_column: record_type
  transformation: si_lo.RECORD_TYPE
  data_type: int
  description: Loại/phân loại của bản ghi
  target_attr_name: null
- target_column: hash
  transformation: si_lo.HASH
  data_type: string
  description: Giá trị hash của tài liệu đã được ký số
  target_attr_name: null
- target_column: cer_path
  transformation: si_lo.CER_PATH
  data_type: string
  description: Đường dẫn file chứng chỉ số dùng để ký
  target_attr_name: null
- target_column: created_at
  transformation: si_lo.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: si_lo.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_by
  transformation: si_lo.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: si_lo.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
