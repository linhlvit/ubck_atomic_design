schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-STG-NHNCK.EXAM_DETAILS
  logical_name: Mapping Staging – source NHNCK.EXAM_DETAILS
  physical_name: exam_details
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-EXAM_DETAILS
target:
  namespace: stg
  physical_name: exam_details
  etl_handle: Fact Snapshot
  description: Kết quả các kỳ thi sát hạch
input:
- source_type: physical_table
  namespace: src
  table_name: EXAM_DETAILS
  alias: ex_de
  select_fields: ID, PROFESSIONAL_ID, CERTIFICATE_ID, EXAM_SESSION_ID, SEQUENCE_NUMBER,
    EXAM_NUMBER, LAW_SCORE, LAW_RESULT, SPECIALIZATION_SCORE, SPECIALIZATION_RESULT,
    RESULT, NOTE, CREATED_AT, UPDATED_AT, CREATED_BY, UPDATED_BY, APPLICATION_ID
  filter: null
relationship: []
mapping_columns:
- target_column: id
  transformation: ex_de.ID
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: professional_id
  transformation: ex_de.PROFESSIONAL_ID
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: certificate_id
  transformation: ex_de.CERTIFICATE_ID
  data_type: int
  description: 'FK -> CERTIFICATES: Loại chứng chỉ hành nghề'
  target_attr_name: null
- target_column: exam_session_id
  transformation: ex_de.EXAM_SESSION_ID
  data_type: int
  description: 'FK -> EXAM_SESSIONS: Đợt thi sát hạch liên quan'
  target_attr_name: null
- target_column: sequence_number
  transformation: ex_de.SEQUENCE_NUMBER
  data_type: int
  description: Số thứ tự dự thi của NHNCK trong đợt thi
  target_attr_name: null
- target_column: exam_number
  transformation: ex_de.EXAM_NUMBER
  data_type: string
  description: Số báo danh thi sát hạch
  target_attr_name: null
- target_column: law_score
  transformation: ex_de.LAW_SCORE
  data_type: int
  description: Điểm phần thi pháp luật chứng khoán
  target_attr_name: null
- target_column: law_result
  transformation: ex_de.LAW_RESULT
  data_type: int
  description: 'Kết quả phần thi pháp luật: -1=Không thi, 0=Không đạt, 1=Đạt'
  target_attr_name: null
- target_column: specialization_score
  transformation: ex_de.SPECIALIZATION_SCORE
  data_type: int
  description: Điểm phần thi chuyên ngành
  target_attr_name: null
- target_column: specialization_result
  transformation: ex_de.SPECIALIZATION_RESULT
  data_type: int
  description: 'Kết quả phần thi chuyên ngành: -1=Không thi, 0=Không đạt, 1=Đạt'
  target_attr_name: null
- target_column: result
  transformation: ex_de.RESULT
  data_type: int
  description: 'Kết quả thi: -1=Không thi, 0=Không đạt, 1=Đạt'
  target_attr_name: null
- target_column: note
  transformation: ex_de.NOTE
  data_type: string
  description: Ghi chú bổ sung
  target_attr_name: null
- target_column: created_at
  transformation: ex_de.CREATED_AT
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: ex_de.UPDATED_AT
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_by
  transformation: ex_de.CREATED_BY
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ex_de.UPDATED_BY
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: application_id
  transformation: ex_de.APPLICATION_ID
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
