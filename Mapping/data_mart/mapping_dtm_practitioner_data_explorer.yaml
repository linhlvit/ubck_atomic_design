schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-practitioner_data_explorer
  logical_name: Bảng tra cứu flat CCHN toàn thị trường — 1 CCHN per NHN, toàn bộ trạng
    thái. Slicer Loại hình và Trạng thái filter tại query time. Dùng cho Tab DATA
    EXPLORER.
  physical_name: practitioner_data_explorer
  dm_ref: DTM-practitioner_data_explorer
  brd_ref: BRD-DTM-NHNCK
target:
  namespace: dtm
  physical_name: practitioner_data_explorer
  etl_handle: SCD4A
  description: Bảng tra cứu flat CCHN toàn thị trường — 1 CCHN per NHN, toàn bộ trạng
    thái. Slicer Loại hình và Trạng thái filter tại query time. Dùng cho Tab DATA
    EXPLORER.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_hstr
  alias: at_sc_pr_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_Professionals'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ctf_doc_hstr
  alias: at_sc_pr_li_ct_do_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'CERTIFICATE_TYPE'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv_2
  select_fields: '*'
  filter: scm_code = 'CERTIFICATE_STATUS'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_org_emp_rpt_hstr
  alias: at_sc_pr_or_em_rp_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_org_refr_hstr
  alias: at_sc_or_re_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_ct_do_hs
  join_on: at_sc_pr_li_ct_do_hs.prac_id = at_sc_pr_hs.prac_id
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_pr_li_ct_do_hs.ctf_tp_code
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_cv_2
  join_on: at_cv_2.cl_code = at_sc_pr_li_ct_do_hs.ctf_st_code
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_or_em_rp_hs
  join_on: at_sc_pr_or_em_rp_hs.prac_id = at_sc_pr_hs.prac_id AND at_sc_pr_or_em_rp_hs.tmt_dt
    IS NULL
  description: ''
- main_alias: at_sc_pr_or_em_rp_hs
  join_type: LEFT JOIN
  join_alias: at_sc_or_re_hs
  join_on: at_sc_or_re_hs.scr_org_refr_id = at_sc_pr_or_em_rp_hs.scr_org_id
  description: ''
mapping_columns:
- target_column: practitioner_id
  transformation: at_sc_pr_hs.prac_id
  data_type: string
  target_attr_name: ''
  description: Surrogate PK — Atomic Id
- target_column: practitioner_code
  transformation: at_sc_pr_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: BK NHN
- target_column: license_ctf_doc_code
  transformation: at_sc_pr_li_ct_do_hs.license_ctf_doc_code
  data_type: string
  target_attr_name: ''
  description: BK CCHN
- target_column: full_nm
  transformation: at_sc_pr_hs.full_nm
  data_type: string
  target_attr_name: ''
  description: Họ và tên NHN
- target_column: ctf_nbr
  transformation: at_sc_pr_li_ct_do_hs.ctf_nbr
  data_type: string
  target_attr_name: ''
  description: Số CCHN
- target_column: ctf_tp_code
  transformation: at_sc_pr_li_ct_do_hs.ctf_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Mã loại CCHN — Scheme: CERTIFICATE_TYPE. Dùng cho slicer'
- target_column: ctf_tp_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên loại CCHN — ETL denormalize từ Classification (scheme: CERTIFICATE_TYPE)'
- target_column: ctf_st_code
  transformation: at_sc_pr_li_ct_do_hs.ctf_st_code
  data_type: string
  target_attr_name: ''
  description: 'Mã trạng thái CCHN — Scheme: CERTIFICATE_STATUS. Dùng cho slicer'
- target_column: ctf_st_nm
  transformation: at_cv_2.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên trạng thái CCHN — ETL denormalize từ Classification (scheme: CERTIFICATE_STATUS)'
- target_column: ctf_issu_dt
  transformation: at_sc_pr_li_ct_do_hs.ctf_issu_dt
  data_type: date
  target_attr_name: ''
  description: Ngày cấp CCHN
- target_column: crn_org_nm
  transformation: at_sc_or_re_hs.org_nm
  data_type: string
  target_attr_name: ''
  description: Tên tổ chức hiện tại — join Securities Organization Reference theo
    OrganizationReport mới nhất có Termination Date = NULL
- target_column: src_stm_code
  transformation: at_sc_pr_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu — scheme: SOURCE_SYSTEM. Filter: WHERE src_stm_code
    = ''NHNCK_Professionals'''
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
