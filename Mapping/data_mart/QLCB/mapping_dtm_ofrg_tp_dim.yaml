schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-ofrg_tp_dim
  logical_name: Loại hình chào bán — map từ ContentType TTHC qua CV TTHC_CONTENT_TYPE.
    11 giá trị ContentType → 11 nhãn loại hình.
  physical_name: ofrg_tp_dim
  dm_ref: DTM-ofrg_tp_dim
  brd_ref: BRD-DTM-QLCB
target:
  namespace: dtm
  physical_name: ofrg_tp_dim
  etl_handle: SCD4A
  description: Loại hình chào bán — map từ ContentType TTHC qua CV TTHC_CONTENT_TYPE.
    11 giá trị ContentType → 11 nhãn loại hình.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_ofrg_ap_hstr
  alias: at_sc_of_ap_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'TTHC_ContentItemIndex'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'TTHC_CONTENT_TYPE'
  description: ''
relationship:
- main_alias: at_sc_of_ap_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_of_ap_hs.cntnt_tp_code
  description: ''
mapping_columns:
- target_column: ofrg_tp_dim_id
  transformation: hash_id('TTHC_ContentItemIndex', cntnt_tp_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: cntnt_tp_code
  transformation: at_sc_of_ap_hs.cntnt_tp_code
  data_type: string
  target_attr_name: ''
  description: Natural Key — TTHC ContentType code, ETL join từ at_sc_of_ap_hs.cntnt_tp_code
    để resolve Surrogate Key
- target_column: ofrg_tp_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: Tên loại hình chào bán (tiếng Việt) — map từ ContentType qua CV scheme
    TTHC_CONTENT_TYPE
- target_column: scr_tp_code
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: 'Loại CK tương ứng với loại hình chào bán — Classification Value (scheme:
    TTHC_SECURITY_TYPE)'
- target_column: workflow_f
  transformation: NULL  -- PENDING
  data_type: boolean
  target_attr_name: ''
  description: Có qua workflow xét duyệt không — false với Eform 16 (Bonus) và Eform
    17 (ESOP báo cáo kết quả)
- target_column: src_stm_code
  transformation: at_sc_of_ap_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức TTHC_ContentItemIndex.
    Driving table: at_sc_of_ap_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
