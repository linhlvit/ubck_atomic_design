schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-idy_cgy_dim
  logical_name: Nhóm ngành — ETL-derived Conformed Dim từ Public Company.category_l1/l2_id.
    Tái sử dụng cross-module.
  physical_name: idy_cgy_dim
  dm_ref: DTM-idy_cgy_dim
  brd_ref: BRD-DTM-QLCB
target:
  namespace: dtm
  physical_name: idy_cgy_dim
  etl_handle: SCD4A
  description: Nhóm ngành — ETL-derived Conformed Dim từ Public Company.category_l1/l2_id.
    Tái sử dụng cross-module.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_hstr
  alias: at_pb_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'IDS_company_profiles'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'ECAT_INDUSTRY_LV1'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv_2
  select_fields: '*'
  filter: scm_code = 'ECAT_INDUSTRY_LV2'
  description: ''
relationship:
- main_alias: at_pb_co_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_pb_co_hs.idy_cgy_level1_code
  description: ''
- main_alias: at_pb_co_hs
  join_type: LEFT JOIN
  join_alias: at_cv_2
  join_on: at_cv.cl_code = at_pb_co_hs.idy_cgy_level2_code
  description: ''
mapping_columns:
- target_column: idy_cgy_dim_id
  transformation: hash_id('IDS_company_profiles', idy_cgy_level1_code, idy_cgy_level2_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: idy_cgy_level1_code
  transformation: at_pb_co_hs.idy_cgy_level1_code
  data_type: string
  target_attr_name: ''
  description: Mã ngành cấp 1 (NK, composite) — IDS.company_detail.category_l1_id
- target_column: idy_cgy_level1_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên ngành cấp 1 — Classification Value (scheme: ECAT_INDUSTRY_LV1)'
- target_column: idy_cgy_level2_code
  transformation: at_pb_co_hs.idy_cgy_level2_code
  data_type: string
  target_attr_name: ''
  description: Mã ngành cấp 2 (NK, composite) — IDS.company_detail.category_l2_id
- target_column: idy_cgy_level2_nm
  transformation: at_cv_2.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên ngành cấp 2 — Classification Value (scheme: ECAT_INDUSTRY_LV2)'
- target_column: src_stm_code
  transformation: at_pb_co_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu. Driving table: at_pb_co_hs (Industry Category ETL-derived
    từ Public Company). Nguồn chính thức: IDS_company_profiles.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
