schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_pblc_co_fnc_sumry_snpst
  logical_name: 'Fact Periodic Snapshot tài chính tổng hợp: 1 row per CTDC per kỳ
    báo cáo (năm × quý). Pivot 13 chỉ tiêu tài chính chính từ Atomic tall format.
    Phục vụ MH2 và MH4.'
  physical_name: fct_pblc_co_fnc_sumry_snpst
  dm_ref: DTM-fct_pblc_co_fnc_sumry_snpst
  brd_ref: BRD-DTM-GSDC
target:
  namespace: dtm
  physical_name: fct_pblc_co_fnc_sumry_snpst
  etl_handle: Fact Snapshot
  description: 'Fact Periodic Snapshot tài chính tổng hợp: 1 row per CTDC per kỳ báo
    cáo (năm × quý). Pivot 13 chỉ tiêu tài chính chính từ Atomic tall format. Phục
    vụ MH2 và MH4.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_rpt_subm
  alias: at_pb_co_rp_su
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_hstr
  alias: at_pb_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_row_tpl_hstr
  alias: at_fn_rp_ro_tp_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_row_tpl_hstr
  alias: at_fn_rp_ro_tp_hs_2
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND row_dsc_clmn_code = '411'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_row_tpl_hstr
  alias: at_fn_rp_ro_tp_hs_3
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND row_dsc_clmn_code = '140'
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_pblc_co_dim_hstr
  alias: dt_pb_co_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_fnc_rpt_val
  alias: pblc_co_fnc_rpt_val
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: Tall format BCTC values — pivot source cho 13 chỉ tiêu tài chính.
relationship:
- main_alias: at_pb_co_rp_su
  join_type: INNER JOIN
  join_alias: at_pb_co_hs
  join_on: at_pb_co_hs.pblc_co_code = at_pb_co_rp_su.pblc_co_code
  description: ''
- main_alias: at_pb_co_rp_su
  join_type: LEFT JOIN
  join_alias: dt_pb_co_di_hs
  join_on: dt_pb_co_di_hs.pblc_co_code = at_pb_co_rp_su.pblc_co_code AND at_pb_co_rp_su.subm_dt
    BETWEEN dt_pb_co_di_hs.eff_dt AND dt_pb_co_di_hs.expiry_dt
  description: ''
- main_alias: at_pb_co_rp_su
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.dt = at_pb_co_rp_su.subm_ddln_dt
  description: ''
- main_alias: at_pb_co_rp_su
  join_type: LEFT JOIN
  join_alias: pblc_co_fnc_rpt_val
  join_on: pblc_co_fnc_rpt_val.pblc_co_rpt_subm_id = at_pb_co_rp_su.pblc_co_rpt_subm_id
  description: Pivot source — tall format BCTC values, filter per column trong transformation.
mapping_columns:
- target_column: pblc_co_dim_id
  transformation: dt_pb_co_di_hs.pblc_co_dim_id
  data_type: string
  target_attr_name: ''
  description: FK CTDC — resolve qua NK pblc_co_code từ pblc_co_rpt_subm.
- target_column: rpt_period_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK ngày kỳ báo cáo — dùng subm_ddln_dt làm anchor ngày cuối kỳ.
- target_column: rpt_yr
  transformation: at_pb_co_rp_su.rpt_yr
  data_type: int
  target_attr_name: ''
  description: Năm báo cáo — degenerate dimension.
- target_column: rpt_qtr
  transformation: at_pb_co_rp_su.rpt_qtr
  data_type: int
  target_attr_name: ''
  description: Quý báo cáo — degenerate dimension.
- target_column: eqty_listing_exg_code
  transformation: at_pb_co_hs.eqty_listing_exg_code
  data_type: string
  target_attr_name: ''
  description: 'Sàn niêm yết — denormalized từ Public Company cho filter nhanh. Classification
    Value (scheme: EQUITY_LISTING_EXCHANGE).'
- target_column: entp_tp_code
  transformation: at_pb_co_hs.entp_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại hình DN — denormalized từ Public Company. Classification Value
    (scheme: ENTERPRISE_TYPE).'
- target_column: idy_cgy_level1_code
  transformation: at_pb_co_hs.idy_cgy_level1_code
  data_type: string
  target_attr_name: ''
  description: 'Ngành kinh tế cấp 1 — denormalized từ Public Company. Classification
    Value (scheme: INDUSTRY_CATEGORY_LV1).'
- target_column: subm_dt
  transformation: at_pb_co_rp_su.subm_dt
  data_type: date
  target_attr_name: ''
  description: Ngày nộp BCTC thực tế — dùng tính tỷ lệ nộp đúng hạn.
- target_column: subm_ddln_dt
  transformation: at_pb_co_rp_su.subm_ddln_dt
  data_type: date
  target_attr_name: ''
  description: Hạn nộp BCTC — dùng tính tỷ lệ nộp đúng hạn.
- target_column: total_ast_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Tổng tài sản cuối kỳ — row_dsc_clmn_code IN ('270' dn/bh, '300' td),
    clmn_code='1', BCDKT.
- target_column: total_ast_prior_period_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Tổng tài sản đầu kỳ — row_dsc_clmn_code IN ('270','300'), clmn_code='2',
    BCDKT.
- target_column: total_liab_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Nợ phải trả cuối kỳ — row_dsc_clmn_code IN ('300' dn/bh, '400' td),
    clmn_code='1', BCDKT.
- target_column: eqty_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn chủ sở hữu cuối kỳ — row_dsc_clmn_code IN ('400' dn/bh, '500' td),
    clmn_code='1', BCDKT.
- target_column: eqty_prior_period_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn chủ sở hữu đầu kỳ — row_dsc_clmn_code IN ('400','500'), clmn_code='2',
    BCDKT.
- target_column: charter_cptl_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn điều lệ — row_dsc_clmn_code='411' (tất cả loại hình), clmn_code='1',
    BCDKT.
- target_column: net_prft_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Lợi nhuận sau thuế — row_dsc_clmn_code IN ('60' dn/bh, '21' td), clmn_code='1',
    BCKQKD.
- target_column: net_prft_ytd_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: LNST dồn tích YTD — row_dsc_clmn_code IN ('421' dn/bh, '450' td), clmn_code='1',
    BCDKT.
- target_column: pre_tax_prft_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Lợi nhuận kế toán trước thuế — row_dsc_clmn_code IN ('50' dn/bh, '17'
    td), clmn_code='1', BCKQKD.
- target_column: invt_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Hàng tồn kho — row_dsc_clmn_code='140' (chỉ dn/bh), clmn_code='1',
    BCDKT.
- target_column: rev_amt
  transformation: pblc_co_fnc_rpt_val.data_val
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Doanh thu thuần — row_dsc_clmn_code IN ('10' dn/bh, '03' td), clmn_code='1',
    BCKQKD.
- target_column: rcvb_amt
  transformation: SUM(pblc_co_fnc_rpt_val.data_val)
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Phải thu (ngắn hạn + dài hạn) — SUM data_val WHERE row_dsc_clmn_code
    IN ('130','210') dn/bh / '251' td, clmn_code='1', BCDKT. ETL sum 2 row per CTDC
    per kỳ với dn/bh.
- target_column: cash_eqvl_amt
  transformation: SUM(pblc_co_fnc_rpt_val.data_val)
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Tiền và tương đương tiền — row_dsc_clmn_code='110' dn/bh / SUM('110','120')
    td, clmn_code='1', BCDKT.
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
