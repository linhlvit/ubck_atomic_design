schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_pblc_co_fnc_rpt_val
  logical_name: 'Fact Event chi tiết BCTC: 1 row per CTDC per kỳ per Row_Code per
    Column_Code. Lưu nguyên tall format từ Atomic. Phục vụ MH3 Data Explorer và STT
    39.'
  physical_name: fct_pblc_co_fnc_rpt_val
  dm_ref: DTM-fct_pblc_co_fnc_rpt_val
  brd_ref: BRD-DTM-GSDC
target:
  namespace: dtm
  physical_name: fct_pblc_co_fnc_rpt_val
  etl_handle: Fact Append
  description: 'Fact Event chi tiết BCTC: 1 row per CTDC per kỳ per Row_Code per Column_Code.
    Lưu nguyên tall format từ Atomic. Phục vụ MH3 Data Explorer và STT 39.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_fnc_rpt_val
  alias: at_pb_co_fn_rp_va
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_rpt_subm
  alias: at_pb_co_rp_su
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_ctlg_hstr
  alias: at_fn_rp_ct_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_pblc_co_dim_hstr
  alias: dt_pb_co_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_fnc_rpt_ctlg_dim_hstr
  alias: dt_fn_rp_ct_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_pb_co_fn_rp_va
  join_type: INNER JOIN
  join_alias: at_pb_co_rp_su
  join_on: at_pb_co_rp_su.pblc_co_rpt_subm_id = at_pb_co_fn_rp_va.pblc_co_rpt_subm_id
  description: ''
- main_alias: at_pb_co_rp_su
  join_type: LEFT JOIN
  join_alias: dt_pb_co_di_hs
  join_on: dt_pb_co_di_hs.pblc_co_code = at_pb_co_rp_su.pblc_co_code AND at_pb_co_rp_su.subm_dt
    BETWEEN dt_pb_co_di_hs.eff_dt AND dt_pb_co_di_hs.expiry_dt
  description: ''
- main_alias: at_pb_co_rp_su
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.dt = at_pb_co_rp_su.subm_ddln_dt
  description: ''
- main_alias: at_pb_co_fn_rp_va
  join_type: INNER JOIN
  join_alias: at_fn_rp_ct_hs
  join_on: at_fn_rp_ct_hs.fnc_rpt_ctlg_id = at_pb_co_fn_rp_va.fnc_rpt_ctlg_id
  description: ''
- main_alias: at_fn_rp_ct_hs
  join_type: LEFT JOIN
  join_alias: dt_fn_rp_ct_di_hs
  join_on: dt_fn_rp_ct_di_hs.fnc_rpt_ctlg_bsn_code = at_fn_rp_ct_hs.fnc_rpt_ctlg_bsn_code
    AND dt_fn_rp_ct_di_hs.row_code = at_pb_co_fn_rp_va.row_code AND dt_fn_rp_ct_di_hs.clmn_code
    = at_pb_co_fn_rp_va.clmn_code
  description: ''
mapping_columns:
- target_column: pblc_co_dim_id
  transformation: dt_pb_co_di_hs.pblc_co_dim_id
  data_type: string
  target_attr_name: ''
  description: FK CTDC — resolve từ at_pb_co_rp_su.pblc_co_code qua NK.
- target_column: rpt_period_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK ngày báo cáo.
- target_column: fnc_rpt_ctlg_dim_id
  transformation: dt_fn_rp_ct_di_hs.fnc_rpt_ctlg_dim_id
  data_type: string
  target_attr_name: ''
  description: 'FK catalog dimension — composite NK: fnc_rpt_ctlg_bsn_code + row_code
    + clmn_code.'
- target_column: rpt_yr
  transformation: at_pb_co_fn_rp_va.rpt_yr
  data_type: int
  target_attr_name: ''
  description: Năm báo cáo — degenerate dimension.
- target_column: rpt_qtr
  transformation: at_pb_co_fn_rp_va.rpt_qtr
  data_type: int
  target_attr_name: ''
  description: Quý báo cáo — degenerate dimension.
- target_column: data_val
  transformation: at_pb_co_fn_rp_va.data_val
  data_type: string
  target_attr_name: ''
  description: Giá trị chỉ tiêu BCTC — lưu dạng string theo Atomic; cast tại query
    layer khi cần numeric.
- target_column: cell_tp_code
  transformation: at_pb_co_fn_rp_va.cell_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại ô dữ liệu BCTC — Classification Value (scheme: CELL_TYPE).'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
