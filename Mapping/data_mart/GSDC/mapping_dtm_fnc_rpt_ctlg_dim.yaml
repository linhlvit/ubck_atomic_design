schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fnc_rpt_ctlg_dim
  logical_name: 'Chiều danh mục BCTC cross-tab: 1 row per (báo cáo × dòng × cột).
    Composite NK gồm Financial_Report_Catalog_Business_Code + Row_Code + Column_Code.'
  physical_name: fnc_rpt_ctlg_dim
  dm_ref: DTM-fnc_rpt_ctlg_dim
  brd_ref: BRD-DTM-GSDC
target:
  namespace: dtm
  physical_name: fnc_rpt_ctlg_dim
  etl_handle: SCD4A
  description: 'Chiều danh mục BCTC cross-tab: 1 row per (báo cáo × dòng × cột). Composite
    NK gồm Financial_Report_Catalog_Business_Code + Row_Code + Column_Code.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_ctlg_hstr
  alias: at_fn_rp_ct_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'IDS_report_catalog'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_row_tpl_hstr
  alias: at_fn_rp_ro_tp_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnc_rpt_clmn_tpl_hstr
  alias: at_fn_rp_cl_tp_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_fn_rp_ct_hs
  join_type: INNER JOIN
  join_alias: at_fn_rp_ro_tp_hs
  join_on: at_fn_rp_ro_tp_hs.fnc_rpt_ctlg_id = at_fn_rp_ct_hs.fnc_rpt_ctlg_id
  description: ''
- main_alias: at_fn_rp_ct_hs
  join_type: INNER JOIN
  join_alias: at_fn_rp_cl_tp_hs
  join_on: at_fn_rp_cl_tp_hs.fnc_rpt_ctlg_id = at_fn_rp_ct_hs.fnc_rpt_ctlg_id
  description: ''
mapping_columns:
- target_column: fnc_rpt_ctlg_dim_id
  transformation: hash_id('IDS_report_catalog', fnc_rpt_ctlg_bsn_code, row_code, clmn_code)
  data_type: string
  target_attr_name: ''
  description: 'Surrogate key ETL generated. Composite NK: Financial_Report_Catalog_Business_Code
    + Row_Code + Column_Code. Driving: at_fn_rp_ct_hs.'
- target_column: fnc_rpt_ctlg_bsn_code
  transformation: at_fn_rp_ct_hs.fnc_rpt_ctlg_bsn_code
  data_type: string
  target_attr_name: ''
  description: Mã nghiệp vụ báo cáo — phần 1 của composite NK.
- target_column: row_code
  transformation: at_fn_rp_ro_tp_hs.row_code
  data_type: string
  target_attr_name: ''
  description: 'Mã dòng BCTC — phần 2 của composite NK. ETL: INNER JOIN fnc_rpt_row_tpl
    ON fnc_rpt_row_tpl.fnc_rpt_ctlg_id = at_fn_rp_ct_hs.fnc_rpt_ctlg_id.'
- target_column: clmn_code
  transformation: at_fn_rp_cl_tp_hs.clmn_code
  data_type: string
  target_attr_name: ''
  description: 'Mã cột BCTC — phần 3 của composite NK. ETL: INNER JOIN fnc_rpt_clmn_tpl
    ON fnc_rpt_clmn_tpl.fnc_rpt_ctlg_id = at_fn_rp_ct_hs.fnc_rpt_ctlg_id.'
- target_column: fnc_rpt_ctlg_nm
  transformation: at_fn_rp_ct_hs.fnc_rpt_ctlg_nm
  data_type: string
  target_attr_name: ''
  description: Tên báo cáo tài chính.
- target_column: entp_tp_code
  transformation: at_fn_rp_ct_hs.entp_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại hình DN áp dụng báo cáo — Classification Value (scheme: ENTERPRISE_TYPE).'
- target_column: rpt_drc_tp_code
  transformation: at_fn_rp_ct_hs.rpt_drc_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Chiều báo cáo (input/output) — Classification Value (scheme: REPORT_DIRECTION_TYPE).'
- target_column: actv_f
  transformation: at_fn_rp_ct_hs.actv_f
  data_type: boolean
  target_attr_name: ''
  description: Cờ báo cáo đang hoạt động.
- target_column: row_nm
  transformation: at_fn_rp_ro_tp_hs.row_nm
  data_type: string
  target_attr_name: ''
  description: Tên dòng chỉ tiêu BCTC.
- target_column: row_dsc_clmn_code
  transformation: at_fn_rp_ro_tp_hs.row_dsc_clmn_code
  data_type: string
  target_attr_name: ''
  description: Mã hiển thị dòng chỉ tiêu (=row_desc trong BA SQL) — dùng làm filter
    chính cho Fact Financial Report Value.
- target_column: row_indx
  transformation: at_fn_rp_ro_tp_hs.row_indx
  data_type: int
  target_attr_name: ''
  description: Thứ tự hiển thị dòng trong báo cáo.
- target_column: clmn_nm
  transformation: at_fn_rp_cl_tp_hs.clmn_nm
  data_type: string
  target_attr_name: ''
  description: Tên cột chỉ tiêu BCTC.
- target_column: clmn_indx
  transformation: at_fn_rp_cl_tp_hs.clmn_indx
  data_type: int
  target_attr_name: ''
  description: Thứ tự hiển thị cột trong báo cáo.
- target_column: src_stm_code
  transformation: at_fn_rp_ct_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: Mã hệ thống nguồn — forward-compatibility filter.
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
