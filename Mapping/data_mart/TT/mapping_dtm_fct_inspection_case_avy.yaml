schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_inspection_case_avy
  logical_name: 'Event vụ việc TT/KT — 1 row per hồ sơ × đối tượng. Đếm hồ sơ dùng
    COUNT(DISTINCT Inspection_Case_Code). Date key: Received Date (xem O_TT_3)'
  physical_name: fct_inspection_case_avy
  dm_ref: DTM-fct_inspection_case_avy
  brd_ref: BRD-DTM-TT
target:
  namespace: dtm
  physical_name: fct_inspection_case_avy
  etl_handle: Fact Append
  description: 'Event vụ việc TT/KT — 1 row per hồ sơ × đối tượng. Đếm hồ sơ dùng
    COUNT(DISTINCT Inspection_Case_Code). Date key: Received Date (xem O_TT_3)'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_insp_dcsn_sbj
  alias: at_in_dc_sb
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_insp_case
  alias: at_in_ca
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: inline_cte
  namespace: ''
  table_name: ''
  alias: latest_ccl
  select_fields: SELECT insp_case_id, vln_tp_code, ROW_NUMBER() OVER (PARTITION BY
    insp_case_id ORDER BY conclusion_seq_nbr DESC) AS rn FROM atm_insp_case_conclusion
  filter: ''
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cl_dim_hstr
  alias: dt_cl_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_in_dc_sb
  join_type: INNER JOIN
  join_alias: at_in_ca
  join_on: at_in_ca.insp_dcsn_id = at_in_dc_sb.insp_dcsn_id
  description: ''
- main_alias: at_in_ca
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.dt = at_in_ca.rcvd_dt
  description: ''
- main_alias: at_in_ca
  join_type: LEFT JOIN
  join_alias: latest_ccl
  join_on: latest_ccl.insp_case_id = at_in_ca.insp_case_id AND latest_ccl.rn = 1
  description: ''
- main_alias: latest_ccl
  join_type: LEFT JOIN
  join_alias: dt_cl_di_hs
  join_on: dt_cl_di_hs.scm_code = 'TT_VIOLATION_TYPE' AND dt_cl_di_hs.cl_code = latest_ccl.vln_tp_code
  description: ''
mapping_columns:
- target_column: rcvd_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch — ETL lookup từ Inspection Case.Received Date. ThanhTra.TT_HO_SO.NGAY_NHAN_HO_SO
- target_column: sbj_cgy_dim_id
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: FK phân loại đối tượng — ETL-derived từ Inspection Decision Subject.Subject
    Reference Id (polymorphic → DM_CONG_TY_CK/QLQ/DC/DM_DOI_TUONG_KHAC). 6 giá trị
    tạm thời — xem O_TT_4
- target_column: vln_tp_dim_id
  transformation: dt_cl_di_hs.cl_dim_id
  data_type: string
  target_attr_name: ''
  description: FK loại hành vi vi phạm — ETL join Inspection Case Conclusion (lấy
    kết luận mới nhất theo MAX Conclusion Sequence Number) → map vln_tp_code → Classification
    Dimension. ThanhTra.TT_KET_LUAN.HANH_VI_VI_PHAM_ID. NULL khi hồ sơ chưa có kết
    luận.
- target_column: inspection_case_code
  transformation: at_in_ca.insp_case_code
  data_type: string
  target_attr_name: ''
  description: 'PK nguồn dùng làm degenerate key hồ sơ trên Fact. COUNT(DISTINCT)
    để đếm hồ sơ. ThanhTra.TT_HO_SO.ID. Driving table: at_in_dc_sb.'
- target_column: inspection_dcsn_sbj_code
  transformation: at_in_dc_sb.insp_dcsn_sbj_code
  data_type: string
  target_attr_name: ''
  description: PK nguồn của đối tượng trong quyết định — composite grain key cùng
    Inspection Case Code. ThanhTra.TT_QUYET_DINH_DOI_TUONG.ID
- target_column: inspection_tp_code
  transformation: at_in_ca.insp_tp_code
  data_type: string
  target_attr_name: ''
  description: Loại hình THANH_TRA / KIEM_TRA — bộ lọc phân biệt TT vs KT. ThanhTra.TT_HO_SO.LOAI_HINH
- target_column: case_st_code
  transformation: at_in_ca.case_st_code
  data_type: string
  target_attr_name: ''
  description: Trạng thái hồ sơ — filter HOAN_THANH / không HOAN_THANH. ThanhTra.TT_HO_SO.TRANG_THAI_ID
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
