schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_pny_dcsn
  logical_name: 'Event quyết định xử phạt — 1 row per GS_VAN_BAN_XU_LY. Date key:
    Violation Report Date. Xem O_TT_8 (Violation Type) và O_TT_9 (Penalty Subject
    Category)'
  physical_name: fct_pny_dcsn
  dm_ref: DTM-fct_pny_dcsn
  brd_ref: BRD-DTM-TT
target:
  namespace: dtm
  physical_name: fct_pny_dcsn
  etl_handle: Fact Append
  description: 'Event quyết định xử phạt — 1 row per GS_VAN_BAN_XU_LY. Date key: Violation
    Report Date. Xem O_TT_8 (Violation Type) và O_TT_9 (Penalty Subject Category)'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_surveil_nfrc_dcsn
  alias: at_su_nf_dc
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_su_nf_dc
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.dt = at_su_nf_dc.vln_rpt_dt
  description: ''
mapping_columns:
- target_column: vln_rpt_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch — ETL lookup từ Surveillance Enforcement Decision.Violation
    Report Date. ThanhTra.GS_VAN_BAN_XU_LY.NGAY_BIEN_BAN
- target_column: pny_sbj_cgy_dim_id
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: 'FK phân loại đối tượng bị xử phạt — ETL-derived, field Silver nguồn
    chưa xác định. 4 giá trị: TO_CHUC_KHAC/CTKT/GIAO_DICH_NDT/CA_NHAN — chờ O_TT_9'
- target_column: vln_tp_dim_id
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: FK loại hành vi vi phạm — field Silver nguồn chưa xác định. Dùng chung
    scheme TT_VIOLATION_TYPE với Tab TT/KT — xem O_TT_8
- target_column: pny_dcsn_code
  transformation: at_su_nf_dc.surveil_nfrc_dcsn_code
  data_type: string
  target_attr_name: ''
  description: PK nguồn dùng làm degenerate key quyết định xử phạt. COUNT(DISTINCT)
    để đếm QĐ. ThanhTra.GS_VAN_BAN_XU_LY.ID
- target_column: tot_pny_amt
  transformation: at_su_nf_dc.tot_pny_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Tổng tiền phạt (đơn vị VNĐ) — presentation layer chia /1_000_000_000
    → tỷ VNĐ hoặc /1_000_000 → triệu VNĐ. ThanhTra.GS_VAN_BAN_XU_LY.TONG_SO_TIEN_PHAT
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
