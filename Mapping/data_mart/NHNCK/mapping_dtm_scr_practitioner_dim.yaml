schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-securities_practitioner_dim
  logical_name: Mapping Datamart - Securities Practitioner Dimension
  physical_name: securities_practitioner_dim
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: securities_practitioner_dim
  etl_handle: SCD4A
  description: NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng
    thái hành nghề. SCD4A (current state).
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_hstr
  alias: at_sc_pr_hs
  select_fields: prac_code, full_nm, birth_dt, education_level_code, practice_status_code,
    src_stm_code
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_Professionals'
  description: Driving table.
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: cl_nm, cl_code
  filter: scm_code = 'EDUCATIONAL_LEVEL'
  description: LEFT JOIN — denormalize tên trình độ học vấn, không lọc dữ liệu.
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv_2
  select_fields: cl_nm, cl_code
  filter: scm_code = 'PRACTITIONER_PRACTICE_STATUS'
  description: LEFT JOIN — denormalize tên trạng thái hành nghề, không lọc dữ liệu.
relationship:
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_pr_hs.education_level_code
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_cv_2
  join_on: at_cv_2.cl_code = at_sc_pr_hs.practice_status_code
  description: ''
mapping_columns:
- target_column: securities_practitioner_dim_id
  transformation: generate_surrogate_key()
  data_type: string
  target_attr_name: ''
  description: Surrogate key — SCD4A (current state)
- target_column: practitioner_code
  transformation: at_sc_pr_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: BK — mã NHN, dùng để join từ Fact
- target_column: full_nm
  transformation: at_sc_pr_hs.full_nm
  data_type: string
  target_attr_name: ''
  description: Họ và tên NHN
- target_column: education_level_code
  transformation: at_sc_pr_hs.education_level_code
  data_type: string
  target_attr_name: ''
  description: 'Trình độ học vấn — Classification Value (scheme: EDUCATIONAL_LEVEL)'
- target_column: education_level_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên trình độ học vấn — ETL denormalize từ Classification (scheme: EDUCATIONAL_LEVEL)'
- target_column: nationality_code
  transformation: at_sc_pr_hs.nationality_code
  data_type: string
  target_attr_name: ''
  description: Mã quốc tịch NHN
- target_column: birth_dt
  transformation: at_sc_pr_hs.birth_dt
  data_type: date
  target_attr_name: ''
  description: Ngày sinh NHN
- target_column: practice_status_code
  transformation: at_sc_pr_hs.practice_status_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái hành nghề — Classification Value (scheme: PRACTITIONER_PRACTICE_STATUS)'
- target_column: practice_status_nm
  transformation: at_cv_2.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên trạng thái hành nghề — ETL denormalize từ Classification (scheme: PRACTITIONER_PRACTICE_STATUS)'
- target_column: src_stm_code
  transformation: at_sc_pr_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu — scheme: SOURCE_SYSTEM. Filter: WHERE src_stm_code
    = ''NHNCK_Professionals'''
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
