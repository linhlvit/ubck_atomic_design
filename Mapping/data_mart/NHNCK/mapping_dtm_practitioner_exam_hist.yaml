schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-practitioner_exam_hist
  logical_name: Mapping Datamart - Practitioner Exam History
  physical_name: practitioner_exam_hist
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: practitioner_exam_hist
  etl_handle: SCD4A
  description: 'Lịch sử thi sát hạch — toàn bộ lần thi per NHN: đợt thi, ngày thi,
    điểm luật, điểm chuyên môn, kết quả, số quyết định công bố.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_qualf_exam_ases_rslt_hstr
  alias: at_sc_pr_qu_ex_as_rs_hs
  select_fields: prac_code, examination_assessment_result_code, law_score, specialization_score,
    law_result_code, specialization_result_code, overall_result_code, src_stm_code,
    sp_qualification_examination_assessment_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_EXAM_DETAILS'
  description: Driving table.
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_qualf_exam_ases_hstr
  alias: at_sc_pr_qu_ex_as_hs
  select_fields: assessment_nm, rpt_year, examination_session_nbr, examination_start_dt,
    examination_end_dt, sp_qualification_examination_assessment_id, sp_license_decision_document_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_EXAM_SESSIONS'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs
  select_fields: decision_nbr, decision_signed_dt, sp_license_decision_document_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_DECISIONS'
  description: INNER JOIN — chỉ giữ lại lần thi đã có quyết định công bố kết quả
    (theo BA, xem O_NHNCK_8/HLD K_NHNCK_62).
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: cl_nm, cl_code
  filter: scm_code = 'EXAM_RESULT'
  description: LEFT JOIN — denormalize tên kết quả thi, không lọc dữ liệu. Dùng
    chung 3 lần (Law/Specialization/Overall) qua 3 alias riêng.
relationship:
- main_alias: at_sc_pr_qu_ex_as_rs_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_qu_ex_as_hs
  join_on: at_sc_pr_qu_ex_as_hs.sp_qualification_examination_assessment_id = at_sc_pr_qu_ex_as_rs_hs.sp_qualification_examination_assessment_id
  description: ''
- main_alias: at_sc_pr_qu_ex_as_hs
  join_type: INNER JOIN
  join_alias: at_sc_pr_li_dc_do_hs
  join_on: at_sc_pr_li_dc_do_hs.sp_license_decision_document_id = at_sc_pr_qu_ex_as_hs.sp_license_decision_document_id
  description: INNER JOIN có chủ đích — lọc chỉ lần thi đã có quyết định công bố.
- main_alias: at_sc_pr_qu_ex_as_rs_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_pr_qu_ex_as_rs_hs.law_result_code
  description: Denormalize Law Result Name.
- main_alias: at_sc_pr_qu_ex_as_rs_hs
  join_type: LEFT JOIN
  join_alias: at_cv_2
  join_on: at_cv_2.cl_code = at_sc_pr_qu_ex_as_rs_hs.specialization_result_code
  description: Denormalize Specialization Result Name — alias riêng cùng bảng atm_cv,
    filter scm_code = 'EXAM_RESULT'.
- main_alias: at_sc_pr_qu_ex_as_rs_hs
  join_type: LEFT JOIN
  join_alias: at_cv_3
  join_on: at_cv_3.cl_code = at_sc_pr_qu_ex_as_rs_hs.overall_result_code
  description: Denormalize Overall Result Name — alias riêng cùng bảng atm_cv, filter
    scm_code = 'EXAM_RESULT'.
mapping_columns:
- target_column: practitioner_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: PK composite (NHN)
- target_column: examination_assessment_result_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.examination_assessment_result_code
  data_type: string
  target_attr_name: ''
  description: PK kết quả thi
- target_column: assessment_nm
  transformation: at_sc_pr_qu_ex_as_hs.assessment_nm
  data_type: string
  target_attr_name: ''
  description: Tên đợt thi
- target_column: rpt_year
  transformation: at_sc_pr_qu_ex_as_hs.rpt_year
  data_type: int
  target_attr_name: ''
  description: Năm báo cáo đợt thi
- target_column: examination_session_nbr
  transformation: at_sc_pr_qu_ex_as_hs.examination_session_nbr
  data_type: int
  target_attr_name: ''
  description: Kỳ thi trong năm
- target_column: examination_period
  transformation: CONCAT(at_sc_pr_qu_ex_as_hs.rpt_year, '_', at_sc_pr_qu_ex_as_hs.examination_session_nbr)
  data_type: string
  target_attr_name: ''
  description: Kỳ thi dạng chuỗi hiển thị (VD "2025_1")
- target_column: examination_start_dt
  transformation: at_sc_pr_qu_ex_as_hs.examination_start_dt
  data_type: date
  target_attr_name: ''
  description: Ngày bắt đầu thi
- target_column: examination_end_dt
  transformation: at_sc_pr_qu_ex_as_hs.examination_end_dt
  data_type: date
  target_attr_name: ''
  description: Ngày kết thúc thi
- target_column: law_score
  transformation: at_sc_pr_qu_ex_as_rs_hs.law_score
  data_type: string
  target_attr_name: ''
  description: Điểm thi pháp luật — Text do có thể là 'Vắng'/'Miễn thi'
- target_column: specialization_score
  transformation: at_sc_pr_qu_ex_as_rs_hs.specialization_score
  data_type: string
  target_attr_name: ''
  description: Điểm thi chuyên môn
- target_column: law_result_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.law_result_code
  data_type: string
  target_attr_name: ''
  description: 'Kết quả thi pháp luật — scheme: EXAM_RESULT'
- target_column: law_result_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên kết quả thi pháp luật — ETL denormalize từ Classification (scheme: EXAM_RESULT)'
- target_column: specialization_result_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.specialization_result_code
  data_type: string
  target_attr_name: ''
  description: 'Kết quả thi chuyên môn — scheme: EXAM_RESULT'
- target_column: specialization_result_nm
  transformation: at_cv_2.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên kết quả thi chuyên môn — ETL denormalize từ Classification (scheme: EXAM_RESULT)'
- target_column: overall_result_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.overall_result_code
  data_type: string
  target_attr_name: ''
  description: 'Kết quả tổng hợp — scheme: EXAM_RESULT'
- target_column: overall_result_nm
  transformation: at_cv_3.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên kết quả tổng hợp — ETL denormalize từ Classification (scheme: EXAM_RESULT)'
- target_column: decision_nbr
  transformation: at_sc_pr_li_dc_do_hs.decision_nbr
  data_type: string
  target_attr_name: ''
  description: Số quyết định công bố kết quả — INNER JOIN, chỉ giữ lần thi đã có
    quyết định
- target_column: decision_signed_dt
  transformation: at_sc_pr_li_dc_do_hs.decision_signed_dt
  data_type: date
  target_attr_name: ''
  description: Ngày ký quyết định công bố — cùng INNER JOIN với Decision Number
- target_column: src_stm_code
  transformation: at_sc_pr_qu_ex_as_rs_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức NHNCK_EXAM_DETAILS.
    Driving table: at_sc_pr_qu_ex_as_rs_hs.'
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
