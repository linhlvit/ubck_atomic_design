schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-practitioner_vln_hist
  logical_name: Mapping Datamart - Practitioner Violation History
  physical_name: practitioner_vln_hist
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: practitioner_vln_hist
  etl_handle: SCD4A
  description: 'Lịch sử vi phạm — toàn bộ vi phạm per NHN: loại vi phạm, nội dung,
    trạng thái, số quyết định xử phạt.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_conduct_vln_hstr
  alias: at_sc_pr_co_vl_hs
  select_fields: prac_code, conduct_vln_code, vln_note, src_stm_code, conduct_vln_tp_code,
    vln_st_code, license_dcsn_doc_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_Violations'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: cl_nm, cl_code
  filter: scm_code = 'CONDUCT_VIOLATION_TYPE'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv_2
  select_fields: cl_nm, cl_code
  filter: scm_code = 'VIOLATION_STATUS'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs
  select_fields: dcsn_nbr, signing_dt, license_dcsn_doc_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_sc_pr_co_vl_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_pr_co_vl_hs.conduct_vln_tp_code
  description: ''
- main_alias: at_sc_pr_co_vl_hs
  join_type: LEFT JOIN
  join_alias: at_cv_2
  join_on: at_cv_2.cl_code = at_sc_pr_co_vl_hs.vln_st_code
  description: ''
- main_alias: at_sc_pr_co_vl_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_dc_do_hs
  join_on: at_sc_pr_li_dc_do_hs.license_dcsn_doc_id = at_sc_pr_co_vl_hs.license_dcsn_doc_id
  description: ''
mapping_columns:
- target_column: practitioner_code
  transformation: at_sc_pr_co_vl_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: PK composite (NHN)
- target_column: conduct_vln_code
  transformation: at_sc_pr_co_vl_hs.conduct_vln_code
  data_type: string
  target_attr_name: ''
  description: PK vi phạm
- target_column: conduct_vln_tp_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên loại vi phạm — ETL denormalize từ Classification (scheme: CONDUCT_VIOLATION_TYPE)'
- target_column: vln_note
  transformation: at_sc_pr_co_vl_hs.vln_note
  data_type: string
  target_attr_name: ''
  description: Nội dung vi phạm
- target_column: vln_st_nm
  transformation: at_cv_2.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên trạng thái vi phạm — ETL denormalize từ Classification (scheme:
    VIOLATION_STATUS)'
- target_column: dcsn_nbr
  transformation: at_sc_pr_li_dc_do_hs.dcsn_nbr
  data_type: string
  target_attr_name: ''
  description: Số quyết định xử phạt — join qua DecisionId
- target_column: dcsn_issu_dt
  transformation: at_sc_pr_li_dc_do_hs.signing_dt
  data_type: date
  target_attr_name: ''
  description: Ngày ban hành quyết định
- target_column: src_stm_code
  transformation: at_sc_pr_co_vl_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức NHNCK_Violations. Driving
    table: at_sc_pr_co_vl_hs.'
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
