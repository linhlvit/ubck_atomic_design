schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_practitioner_license_certificate_snpst
  logical_name: Mapping Datamart - Fact Practitioner License Certificate Snapshot
  physical_name: fct_practitioner_license_certificate_snpst
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: fct_practitioner_license_certificate_snpst
  etl_handle: Fact Snapshot
  description: Periodic Snapshot tháng — 1 CCHN × 1 tháng. Phục vụ KPI đếm CCHN theo
    trạng thái, loại hình, cấp mới, thu hồi.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ctf_doc_hstr
  alias: at_sc_pr_li_ct_do_hs
  select_fields: sp_license_certificate_document_code, certificate_nbr, sp_license_certificate_tp_code,
    issue_dt, revocation_dt, sp_code, issue_sp_license_decision_document_id, revocation_sp_license_decision_document_id,
    cancellation_sp_license_decision_document_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: Driving table — grain 1 CCHN (bản ghi) × 1 tháng snapshot.
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs_issue
  select_fields: sp_license_decision_document_id, decision_tp_code, src_stm_code
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_DECISIONS'
  description: LEFT JOIN theo issue_sp_license_decision_document_id — derive Is_Reissue_Indicator.
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs_revok
  select_fields: sp_license_decision_document_id, decision_tp_code, src_stm_code
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_DECISIONS'
  description: LEFT JOIN theo revocation_sp_license_decision_document_id.
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs_cncl
  select_fields: sp_license_decision_document_id, decision_tp_code, src_stm_code
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_DECISIONS'
  description: LEFT JOIN theo cancellation_sp_license_decision_document_id.
- source_type: physical_table
  namespace: dtm
  table_name: dtm_securities_practitioner_dim_hstr
  alias: dt_sc_pr_di_hs
  select_fields: securities_practitioner_dim_id, practitioner_code, eff_dt, expiry_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_sp_license_certificate_type_dim_hstr
  alias: dt_sp_li_ct_tp_di_hs
  select_fields: certificate_type_dim_id, certificate_tp_code, eff_dt, expiry_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: cdr_dt_dim_id, full_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs_2
  select_fields: cdr_dt_dim_id, full_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: LOOKUP riêng cho Issue Date Dimension Id — cùng bảng cdr_dt_dim với
    alias khác cho Snapshot Date.
relationship:
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_sc_pr_di_hs
  join_on: dt_sc_pr_di_hs.practitioner_code = at_sc_pr_li_ct_do_hs.sp_code AND at_sc_pr_li_ct_do_hs.issue_dt
    BETWEEN dt_sc_pr_di_hs.eff_dt AND dt_sc_pr_di_hs.expiry_dt
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_sp_li_ct_tp_di_hs
  join_on: dt_sp_li_ct_tp_di_hs.certificate_tp_code = at_sc_pr_li_ct_do_hs.sp_license_certificate_tp_code
    AND at_sc_pr_li_ct_do_hs.issue_dt BETWEEN dt_sp_li_ct_tp_di_hs.eff_dt AND dt_sp_li_ct_tp_di_hs.expiry_dt
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs_2
  join_on: dt_cd_dt_di_hs_2.full_dt = at_sc_pr_li_ct_do_hs.issue_dt
  description: Issue Date Dimension Id.
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.full_dt = {etl_date}
  description: Snapshot Date Dimension Id.
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_dc_do_hs_issue
  join_on: at_sc_pr_li_dc_do_hs_issue.sp_license_decision_document_id = at_sc_pr_li_ct_do_hs.issue_sp_license_decision_document_id
  description: Cố ý LEFT JOIN (không INNER như SQL tham khảo BA) — cột Is_Reissue_Indicator
    dùng chung nhiều KPI khác, INNER ở đây sẽ loại nhầm dòng Fact khỏi các KPI không
    liên quan. Filter is_reissue_indicator = 'N'/'Y' tại K_NHNCK_2a/2b tự loại NULL,
    tương đương INNER đúng tại 2 KPI cần (xem O_NHNCK_20/29).
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_dc_do_hs_revok
  join_on: at_sc_pr_li_dc_do_hs_revok.sp_license_decision_document_id = at_sc_pr_li_ct_do_hs.revocation_sp_license_decision_document_id
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_dc_do_hs_cncl
  join_on: at_sc_pr_li_dc_do_hs_cncl.sp_license_decision_document_id = at_sc_pr_li_ct_do_hs.cancellation_sp_license_decision_document_id
  description: ''
mapping_columns:
- target_column: practitioner_dim_id
  transformation: dt_sc_pr_di_hs.securities_practitioner_dim_id
  data_type: string
  target_attr_name: ''
  description: FK NHN
- target_column: issue_dt_dim_id
  transformation: dt_cd_dt_di_hs_2.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK ngày cấp CCHN — từ sp_license_certificate_document.issue_dt (Sửa
    2026-08, đổi nguồn từ Application sang Certificate Document)
- target_column: snpst_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch ngày snapshot — ETL generated theo ngày chạy
- target_column: certificate_tp_dim_id
  transformation: dt_sp_li_ct_tp_di_hs.certificate_type_dim_id
  data_type: string
  target_attr_name: ''
  description: FK loại CCHN — (Sửa 2026-08) đã bỏ Certificate_Type_Code trực tiếp
    trên Fact, chỉ giữ FK sang Dimension
- target_column: license_certificate_document_code
  transformation: at_sc_pr_li_ct_do_hs.sp_license_certificate_document_code
  data_type: string
  target_attr_name: ''
  description: DD — BK bản ghi cấp/thu hồi CCHN (degenerate key, 1 dòng Fact = 1
    bản ghi); KHÔNG dùng làm đơn vị đếm KPI
- target_column: certificate_nbr
  transformation: at_sc_pr_li_ct_do_hs.certificate_nbr
  data_type: string
  target_attr_name: ''
  description: DD — business key CCHN thật; đơn vị đếm COUNT(DISTINCT ...) cho các
    KPI đếm số CCHN (xem O_NHNCK_30)
- target_column: is_reissue_indicator
  transformation: CASE WHEN at_sc_pr_li_dc_do_hs_issue.decision_tp_code = '3' THEN
    'Y' WHEN at_sc_pr_li_dc_do_hs_issue.decision_tp_code = '1' THEN 'N' ELSE NULL
    END
  data_type: string
  target_attr_name: ''
  description: 'ETL-derived Y/N: Y nếu Decision Type Code = 3 (Cấp lại); N nếu =
    1 (Cấp mới); NULL nếu chưa có quyết định — xem O_NHNCK_20/29'
- target_column: certificate_issue_dt
  transformation: at_sc_pr_li_ct_do_hs.issue_dt
  data_type: date
  target_attr_name: ''
  description: Ngày cấp CCHN — (Sửa 2026-08) đổi nguồn từ Application sang Certificate
    Document
- target_column: revocation_dt
  transformation: at_sc_pr_li_ct_do_hs.revocation_dt
  data_type: date
  target_attr_name: ''
  description: Ngày thu hồi — NULL = chưa thu hồi
- target_column: decision_tp_code
  transformation: COALESCE(at_sc_pr_li_dc_do_hs_revok.decision_tp_code, at_sc_pr_li_dc_do_hs_cncl.decision_tp_code)
  data_type: string
  target_attr_name: ''
  description: 'Loại quyết định thu hồi/hủy CCHN — scheme: LICENSE_CERTIFICATE_DECISION_TYPE
    (2=Thu hồi, 6=Hủy CCHN); NULL nếu chưa có quyết định. Phục vụ filter K_NHNCK_3/6/7/8'
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
