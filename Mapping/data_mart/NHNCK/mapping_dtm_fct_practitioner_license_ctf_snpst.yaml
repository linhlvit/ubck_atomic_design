schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_practitioner_license_ctf_snpst
  logical_name: Mapping Datamart - Fact Practitioner License Certificate Snapshot
  physical_name: fct_practitioner_license_ctf_snpst
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: fct_practitioner_license_ctf_snpst
  etl_handle: Fact Snapshot
  description: Periodic Snapshot tháng — 1 CCHN × 1 tháng. Phục vụ KPI đếm CCHN theo
    trạng thái, loại hình, cấp mới, thu hồi.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ctf_doc_hstr
  alias: at_sc_pr_li_ct_do_hs
  select_fields: license_ctf_doc_code, ctf_tp_code, ctf_st_code, alw_reissue_ind,
    revocation_dt, license_ctf_doc_id, prac_code, ctf_issu_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ap_hstr
  alias: at_sc_pr_li_ap_hs
  select_fields: issu_dt, license_ctf_doc_id, ap_tp_code, NEW, N, Y
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ap_hstr
  alias: at_sc_pr_li_ap_hs_2
  select_fields: issu_dt, license_ctf_doc_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_scr_practitioner_dim_hstr
  alias: dt_sc_pr_di_hs
  select_fields: practitioner_dim_id, practitioner_code, eff_dt, expiry_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: cdr_dt_dim_id, full_dt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_ap_hs_2
  join_on: at_sc_pr_li_ap_hs_2.license_ctf_doc_id = at_sc_pr_li_ct_do_hs.license_ctf_doc_id
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_sc_pr_di_hs
  join_on: dt_sc_pr_di_hs.practitioner_code = at_sc_pr_li_ct_do_hs.prac_code AND at_sc_pr_li_ct_do_hs.ctf_issu_dt
    BETWEEN dt_sc_pr_di_hs.eff_dt AND dt_sc_pr_di_hs.expiry_dt
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: INNER JOIN
  join_alias: at_sc_pr_li_ap_hs
  join_on: at_sc_pr_li_ap_hs_2.license_ctf_doc_id = at_sc_pr_li_ct_do_hs.license_ctf_doc_id
  description: ''
- main_alias: at_sc_pr_li_ap_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.full_dt = at_sc_pr_li_ap_hs.issu_dt
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.full_dt = {etl_date}
  description: ''
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: license_ap_agg
  join_on: license_ap_agg.license_ctf_doc_id = at_sc_pr_li_ct_do_hs.license_ctf_doc_id
  description: ''
mapping_columns:
- target_column: practitioner_dim_id
  transformation: dt_sc_pr_di_hs.practitioner_dim_id
  data_type: string
  target_attr_name: ''
  description: FK NHN
- target_column: issu_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch ngày cấp CCHN
- target_column: snpst_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch ngày snapshot — ETL generated theo ngày chạy
- target_column: license_ctf_doc_code
  transformation: at_sc_pr_li_ct_do_hs.license_ctf_doc_code
  data_type: string
  target_attr_name: ''
  description: DD — BK CCHN
- target_column: ctf_tp_code
  transformation: at_sc_pr_li_ct_do_hs.ctf_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại CCHN — Scheme: CERTIFICATE_TYPE'
- target_column: ctf_st_code
  transformation: at_sc_pr_li_ct_do_hs.ctf_st_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái CCHN — Scheme: CERTIFICATE_STATUS'
- target_column: alw_reissue_ind
  transformation: at_sc_pr_li_ct_do_hs.alw_reissue_ind
  data_type: boolean
  target_attr_name: ''
  description: Cho phép cấp lại
- target_column: is_reissue_ind
  transformation: license_ap_agg.is_reissue_ind
  data_type: string
  target_attr_name: ''
  description: 'ETL-derived Y/N: N nếu ap_tp_code=Hồ sơ cấp mới; Y nếu ap_tp_code
    ∈ {Hồ sơ cấp lại do thu hồi / hỏng mất / thay đổi thông tin}'
- target_column: ctf_issu_dt
  transformation: at_sc_pr_li_ap_hs_2.issu_dt
  data_type: date
  target_attr_name: ''
  description: Ngày cấp CCHN — từ Applications.IssueDate (BA v2 xác nhận)
- target_column: revocation_dt
  transformation: at_sc_pr_li_ct_do_hs.revocation_dt
  data_type: date
  target_attr_name: ''
  description: Ngày thu hồi — NULL = chưa thu hồi
final_filter: []
join_agg_ctes:
- cte_alias: license_ap_agg
  source_alias: at_sc_pr_li_ap_hs
  group_key: license_ctf_doc_id
  agg_columns:
  - target_col: is_reissue_ind
    expression: CASE WHEN MAX(CASE WHEN ap_tp_code = 'NEW' THEN 1 ELSE 0 END) = 1
      THEN 'N' ELSE 'Y' END
    data_type: string
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
