schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-practitioner_data_explorer
  logical_name: Mapping Datamart - Practitioner Data Explorer
  physical_name: practitioner_data_explorer
  dm_ref: null
  brd_ref: null
target:
  namespace: dtm
  physical_name: practitioner_data_explorer
  etl_handle: SCD4A
  description: Bảng tra cứu flat CCHN toàn thị trường — 1 NHN × 1 CCHN (bao gồm cả
    NHN chưa có CCHN nào, cột CCHN NULL), toàn bộ trạng thái. Slicer Loại hình và
    Trạng thái filter tại query time. Dùng cho Tab DATA EXPLORER.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_hstr
  alias: at_sc_pr_hs
  select_fields: prac_code, full_nm, src_stm_code, prac_id, practice_status_code
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_Professionals'
  description: Driving table — toàn bộ NHN, kể cả chưa có CCHN.
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_ctf_doc_hstr
  alias: at_sc_pr_li_ct_do_hs
  select_fields: license_ctf_doc_code, ctf_nbr, ctf_tp_code, ctf_issu_dt, prac_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: LEFT JOIN — không giới hạn số dòng, fan-out N CCHN/NHN.
- source_type: physical_table
  namespace: atm
  table_name: atm_sp_license_certificate_type
  alias: at_sp_li_ct_tp
  select_fields: sp_license_certificate_tp_code, certificate_tp_nm
  filter: ''
  description: LEFT JOIN theo Certificate Type Code để lấy tên loại CCHN.
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: cl_nm, cl_code
  filter: scm_code = 'PRACTITIONER_PRACTICE_STATUS'
  description: Denormalize tên trạng thái hành nghề NHN (không phải trạng thái CCHN).
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_org_emp_rpt_hstr
  alias: at_sc_pr_or_em_rp_hs
  select_fields: prac_id, tmt_dt, scr_org_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_org_refr_hstr
  alias: at_sc_or_re_hs
  select_fields: org_nm, scr_org_refr_id
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ip_alt_identn
  alias: at_ip_alt_id
  select_fields: ip_id, identification_tp_code, src_stm_code
  filter: src_stm_code = 'NHNCK_PROFESSIONALS'
  description: LEFT JOIN theo prac_id (= ip_id) để lấy loại giấy tờ định danh.
relationship:
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_ct_do_hs
  join_on: at_sc_pr_li_ct_do_hs.prac_id = at_sc_pr_hs.prac_id
  description: Driving = Practitioner — NHN chưa có CCHN vẫn giữ 1 dòng, cột Certificate
    NULL.
- main_alias: at_sc_pr_li_ct_do_hs
  join_type: LEFT JOIN
  join_alias: at_sp_li_ct_tp
  join_on: at_sp_li_ct_tp.sp_license_certificate_tp_code = at_sc_pr_li_ct_do_hs.ctf_tp_code
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_sc_pr_hs.practice_status_code
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_or_em_rp_hs
  join_on: at_sc_pr_or_em_rp_hs.prac_id = at_sc_pr_hs.prac_id AND at_sc_pr_or_em_rp_hs.tmt_dt
    IS NULL
  description: ''
- main_alias: at_sc_pr_or_em_rp_hs
  join_type: LEFT JOIN
  join_alias: at_sc_or_re_hs
  join_on: at_sc_or_re_hs.scr_org_refr_id = at_sc_pr_or_em_rp_hs.scr_org_id
  description: ''
- main_alias: at_sc_pr_hs
  join_type: LEFT JOIN
  join_alias: at_ip_alt_id
  join_on: at_ip_alt_id.ip_id = at_sc_pr_hs.prac_id
  description: ''
mapping_columns:
- target_column: practitioner_code
  transformation: at_sc_pr_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: PK (1/2, documentation-only — không enforce constraint vật lý).
    Driving Practitioner — grain 1 NHN × 1 CCHN, bao gồm NHN chưa có CCHN
- target_column: license_certificate_document_code
  transformation: at_sc_pr_li_ct_do_hs.license_ctf_doc_code
  data_type: string
  target_attr_name: ''
  description: PK (2/2, documentation-only). NULL khi NHN chưa có CCHN nào — chấp
    nhận NULL trên cột PK logical, không enforce constraint vật lý
- target_column: full_nm
  transformation: at_sc_pr_hs.full_nm
  data_type: string
  target_attr_name: ''
  description: Họ và tên NHN
- target_column: certificate_nbr
  transformation: at_sc_pr_li_ct_do_hs.ctf_nbr
  data_type: string
  target_attr_name: ''
  description: Số CCHN
- target_column: certificate_tp_code
  transformation: at_sc_pr_li_ct_do_hs.ctf_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Mã loại hình hành nghề (= CERTIFICATES.CERTIFICATE_CODE) — slicer
    Loại hình filter trên cột này'
- target_column: certificate_tp_nm
  transformation: at_sp_li_ct_tp.certificate_tp_nm
  data_type: string
  target_attr_name: ''
  description: Tên loại hình hành nghề (= CERTIFICATES.CERTIFICATE_NAME)
- target_column: practice_status_code
  transformation: at_sc_pr_hs.practice_status_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái hành nghề (scheme: PRACTITIONER_PRACTICE_STATUS: 0=Chưa
    hành nghề, 1=Đang hành nghề, 2=Thu hồi có cấp lại, 3=Thu hồi không cấp lại) —
    slicer Trạng thái filter trên cột này'
- target_column: practice_status_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên trạng thái hành nghề — ETL denormalize từ Classification (scheme:
    PRACTITIONER_PRACTICE_STATUS)'
- target_column: issue_dt
  transformation: at_sc_pr_li_ct_do_hs.ctf_issu_dt
  data_type: date
  target_attr_name: ''
  description: Ngày cấp CCHN
- target_column: current_organization_nm
  transformation: at_sc_or_re_hs.org_nm
  data_type: string
  target_attr_name: ''
  description: Tên tổ chức hiện tại — join Securities Organization Reference theo
    OrganizationReport mới nhất có Termination Date = NULL
- target_column: identification_tp_code
  transformation: at_ip_alt_id.identification_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại giấy tờ định danh (scheme: IP_ALT_ID_TYPE) — NULL nếu chưa có
    giấy tờ'
- target_column: src_stm_code
  transformation: at_sc_pr_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu — scheme: SOURCE_SYSTEM. Filter: WHERE src_stm_code
    = ''NHNCK_Professionals'''
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
