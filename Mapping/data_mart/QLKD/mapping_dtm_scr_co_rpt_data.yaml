schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-scr_co_rpt_data
  logical_name: Báo cáo biểu mẫu định kỳ EAV — 1 chỉ tiêu × 1 kỳ × 1 CTCK × 1 biểu
    mẫu
  physical_name: scr_co_rpt_data
  dm_ref: DTM-scr_co_rpt_data
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: scr_co_rpt_data
  etl_handle: SCD4A
  description: Báo cáo biểu mẫu định kỳ EAV — 1 chỉ tiêu × 1 kỳ × 1 CTCK × 1 biểu
    mẫu
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_rpt_ind_val
  alias: at_mb_rp_in_va
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship: []
mapping_columns:
- target_column: rpt_data_id
  transformation: 'hash_id(''scr_co_rpt_data_id'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: mbr_prd_rpt_code
  transformation: at_mb_pr_rp.mbr_prd_rpt_code
  data_type: string
  target_attr_name: ''
  description: Mã báo cáo định kỳ — business key
- target_column: scr_co_code
  transformation: at_mb_pr_rp.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK
- target_column: rpt_tpl_code
  transformation: at_mb_rp_in_va.rpt_tpl_code
  data_type: string
  target_attr_name: ''
  description: Mã biểu mẫu báo cáo
- target_column: rpt_tp_code
  transformation: at_mb_pr_rp.rpt_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại báo cáo (scheme: SCMS_REPORT_TYPE)'
- target_column: rpt_prd_tp_code
  transformation: at_mb_pr_rp.rpt_prd_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Kỳ báo cáo (scheme: SCMS_REPORT_PERIOD_TYPE)'
- target_column: yr_val
  transformation: at_mb_pr_rp.yr_val
  data_type: string
  target_attr_name: ''
  description: Năm kỳ báo cáo
- target_column: rpt_dt
  transformation: at_mb_pr_rp.rpt_dt
  data_type: date
  target_attr_name: ''
  description: Ngày số liệu báo cáo
- target_column: submission_dt
  transformation: at_mb_pr_rp.subm_dt
  data_type: date
  target_attr_name: ''
  description: Ngày nộp thực tế
- target_column: submission_ddln_dt
  transformation: at_mb_pr_rp.subm_ddln_dt
  data_type: date
  target_attr_name: ''
  description: Hạn nộp
- target_column: rpt_ind_code
  transformation: at_mb_rp_in_va.rpt_ind_code
  data_type: string
  target_attr_name: ''
  description: Mã chỉ tiêu danh mục (DM_CHI_TIEU)
- target_column: rpt_tpl_ind_code
  transformation: at_mb_rp_in_va.rpt_tpl_ind_code
  data_type: string
  target_attr_name: ''
  description: Mã chỉ tiêu trong biểu mẫu (BM_BAO_CAO_CT)
- target_column: row_nm
  transformation: at_mb_rp_in_va.row_nm
  data_type: string
  target_attr_name: ''
  description: Tên hàng chỉ tiêu (denormalized)
- target_column: clmn_nm
  transformation: at_mb_rp_in_va.clmn_nm
  data_type: string
  target_attr_name: ''
  description: Tên cột chỉ tiêu (denormalized)
- target_column: shet_nm
  transformation: at_mb_rp_in_va.shet_nm
  data_type: string
  target_attr_name: ''
  description: Tên sheet báo cáo (denormalized)
- target_column: val
  transformation: at_mb_rp_in_va.val
  data_type: string
  target_attr_name: ''
  description: Giá trị chỉ tiêu (Text — kiểu thực tế phụ thuộc KIEU_DU_LIEU)
- target_column: row_seq
  transformation: at_mb_rp_in_va.row_seq
  data_type: int
  target_attr_name: ''
  description: Số thứ tự dòng (cho chỉ tiêu lặp)
- target_column: vrsn
  transformation: at_mb_rp_in_va.vrsn
  data_type: string
  target_attr_name: ''
  description: Phiên bản báo cáo
- target_column: src_stm_code
  transformation: at_mb_pr_rp.src_stm_code WHERE at_mb_pr_rp.src_stm_code IN ('FMS_RPTMEMBER','SCMS_BC_THANH_VIEN')
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter 2 nguồn chính thức FMS_RPTMEMBER + SCMS_BC_THANH_VIEN.
    Driving table: at_mb_pr_rp.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
