schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_scr_co_bsn_tp_snpst
  logical_name: Periodic Snapshot nghiệp vụ CTCK (FIMS) — 1 CTCK × 1 nghiệp vụ × 1
    ngày
  physical_name: fct_scr_co_bsn_tp_snpst
  dm_ref: DTM-fct_scr_co_bsn_tp_snpst
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: fct_scr_co_bsn_tp_snpst
  etl_handle: Fact Snapshot
  description: Periodic Snapshot nghiệp vụ CTCK (FIMS) — 1 CTCK × 1 nghiệp vụ × 1
    ngày
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_bsn_tp_dim_hstr
  alias: at_bs_tp_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_bsn_tp_hstr
  alias: at_sc_co_bs_tp_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_scr_co_dim_hstr
  alias: dt_sc_co_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_bs_tp_di_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.cdr_dt = at_sc_co_bs_tp_hs.snpst_dt
  description: ''
- main_alias: at_bs_tp_di_hs
  join_type: LEFT JOIN
  join_alias: dt_sc_co_di_hs
  join_on: dt_sc_co_di_hs.scr_co_code = at_sc_co_bs_tp_hs.scr_co_code AND at_sc_co_bs_tp_hs.snpst_dt
    BETWEEN dt_sc_co_di_hs.eff_dt AND dt_sc_co_di_hs.expiry_dt
  description: ''
- main_alias: at_bs_tp_di_hs
  join_type: LEFT JOIN
  join_alias: at_bs_tp_di_hs
  join_on: at_bs_tp_di_hs.bsn_tp_code = at_sc_co_bs_tp_hs.bsn_tp_code AND at_sc_co_bs_tp_hs.snpst_dt
    BETWEEN at_bs_tp_di_hs.eff_dt AND at_bs_tp_di_hs.expiry_dt
  description: ''
mapping_columns:
- target_column: snpst_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch — ETL lookup
- target_column: scr_co_dim_id
  transformation: dt_sc_co_di_hs.scr_co_dim_id
  data_type: string
  target_attr_name: ''
  description: FK CTCK — ETL lookup
- target_column: bsn_tp_dim_id
  transformation: at_bs_tp_di_hs.bsn_tp_dim_id
  data_type: string
  target_attr_name: ''
  description: FK nghiệp vụ — ETL lookup
- target_column: bsn_cgy_code
  transformation: CASE WHEN at_bs_tp_di_hs.bsn_tp_code IN ('MGIOI','BLANH','TUVAN','TDOANH')
    THEN 'NGHIEP_VU' ELSE NULL END
  data_type: string
  target_attr_name: ''
  description: CASE WHEN Business Type Dimension.Business Type Code IN ('MGIOI','BLANH','TUVAN','TDOANH')
    THEN 'NGHIEP_VU' ELSE NULL END
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
