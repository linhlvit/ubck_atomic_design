schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-scr_co_ou_prfl
  logical_name: CN/PGD/VPĐD của CTCK — tên, địa chỉ, ngày thành lập
  physical_name: scr_co_ou_prfl
  dm_ref: DTM-scr_co_ou_prfl
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: scr_co_ou_prfl
  etl_handle: SCD4A
  description: CN/PGD/VPĐD của CTCK — tên, địa chỉ, ngày thành lập
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_ou_hstr
  alias: at_sc_co_ou_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship: []
mapping_columns:
- target_column: ou_prfl_id
  transformation: 'hash_id(''scr_co_ou_prfl_id'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: scr_co_ou_code
  transformation: at_sc_co_ou_hs.scr_co_ou_code
  data_type: string
  target_attr_name: ''
  description: Mã đơn vị trực thuộc — business key
- target_column: scr_co_code
  transformation: at_sc_co_ou_hs.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK
- target_column: ou_nm
  transformation: at_sc_co_ou_hs.ou_nm
  data_type: string
  target_attr_name: ''
  description: Tên CN/PGD/VPĐD
- target_column: ou_tp_code
  transformation: at_sc_co_ou_hs.ou_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại đơn vị: BRANCH/TRANSACTION_OFFICE/REP_OFFICE'
- target_column: adr
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN ip_pst_adr ON
    ip_pst_adr.ip_id = at_sc_co_ou_hs.ip_id'
  data_type: string
  target_attr_name: ''
  description: Địa chỉ CN/PGD/VPĐD — SCMS.CTCK_CHI_NHANH.DIA_CHI (hoặc CTCK_PHONG_GIAO_DICH,
    CTCK_VP_DAI_DIEN), lấy qua Involved Party Postal Address.Address Value. Phục vụ
    K_QLKD_108 (BA STT 37)
- target_column: estb_dt
  transformation: at_sc_co_ou_hs.dcsn_dt
  data_type: date
  target_attr_name: ''
  description: Ngày thành lập/khai trương
- target_column: lcs_code
  transformation: at_sc_co_ou_hs.lcs_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái (scheme: LIFE_CYCLE_STATUS)'
- target_column: bsn_sctr_nm
  transformation: at_sc_co_ou_hs.bsn_sctr_nm
  data_type: string
  target_attr_name: ''
  description: Tên lĩnh vực nghiệp vụ (text tự do — xem O_QLKD_12)
- target_column: src_stm_code
  transformation: CASE WHEN at_sc_co_ou_hs.ou_tp_code = 'BRANCH' THEN 'SCMS_CTCK_CHI_NHANH'
    WHEN at_sc_co_ou_hs.ou_tp_code = 'TRANSACTION_OFFICE' THEN 'SCMS_CTCK_PHONG_GIAO_DICH'
    WHEN at_sc_co_ou_hs.ou_tp_code = 'REP_OFFICE' THEN 'SCMS_CTCK_VP_DAI_DIEN' END
  data_type: string
  target_attr_name: ''
  description: CASE WHEN at_sc_co_ou_hs.ou_tp_code = 'BRANCH' THEN 'SCMS_CTCK_CHI_NHANH'
    WHEN at_sc_co_ou_hs.ou_tp_code = 'TRANSACTION_OFFICE' THEN 'SCMS_CTCK_PHONG_GIAO_DICH'
    WHEN at_sc_co_ou_hs.ou_tp_code = 'REP_OFFICE' THEN 'SCMS_CTCK_VP_DAI_DIEN' END
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
