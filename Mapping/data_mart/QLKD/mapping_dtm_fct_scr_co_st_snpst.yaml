schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_scr_co_st_snpst
  logical_name: Periodic Snapshot tình trạng CTCK — 1 CTCK × 1 ngày
  physical_name: fct_scr_co_st_snpst
  dm_ref: DTM-fct_scr_co_st_snpst
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: fct_scr_co_st_snpst
  etl_handle: Fact Snapshot
  description: Periodic Snapshot tình trạng CTCK — 1 CTCK × 1 ngày
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_hstr
  alias: at_sc_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_scr_co_dim_hstr
  alias: dt_sc_co_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_sc_co_hs
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.cdr_dt = at_sc_co_hs.snpst_dt
  description: ''
- main_alias: at_sc_co_hs
  join_type: LEFT JOIN
  join_alias: dt_sc_co_di_hs
  join_on: dt_sc_co_di_hs.scr_co_code = at_sc_co_hs.scr_co_code AND at_sc_co_hs.snpst_dt
    BETWEEN dt_sc_co_di_hs.eff_dt AND dt_sc_co_di_hs.expiry_dt
  description: ''
mapping_columns:
- target_column: snpst_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch — ETL lookup
- target_column: scr_co_dim_id
  transformation: dt_sc_co_di_hs.scr_co_dim_id
  data_type: string
  target_attr_name: ''
  description: FK CTCK — ETL lookup
- target_column: co_st_code
  transformation: at_sc_co_hs.co_st_code
  data_type: string
  target_attr_name: ''
  description: Trạng thái CTCK
- target_column: is_list_ind
  transformation: at_sc_co_hs.is_list_ind
  data_type: string
  target_attr_name: ''
  description: Cờ niêm yết
- target_column: charter_cptl_amt
  transformation: at_sc_co_hs.charter_cptl_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn điều lệ
- target_column: ind_val_amt
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN mbr_rpt_ind_val
    ON mbr_rpt_ind_val.mbr_prd_rpt_id '
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Giá trị chỉ tiêu
- target_column: rpt_ind_code
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN mbr_rpt_ind_val
    ON mbr_rpt_ind_val.mbr_prd_rpt_id '
  data_type: string
  target_attr_name: ''
  description: Mã chỉ tiêu — xem O_QLKD_1
- target_column: rpt_dt
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN mbr_rpt_ind_val
    ON mbr_rpt_ind_val.mbr_prd_rpt_id '
  data_type: date
  target_attr_name: ''
  description: Ngày số liệu báo cáo
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
