schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_scr_co_fnc_stc_snpst
  logical_name: Periodic Snapshot chỉ tiêu BCTC — 1 CTCK × 1 chỉ tiêu × 1 kỳ
  physical_name: fct_scr_co_fnc_stc_snpst
  dm_ref: DTM-fct_scr_co_fnc_stc_snpst
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: fct_scr_co_fnc_stc_snpst
  etl_handle: Fact Snapshot
  description: Periodic Snapshot chỉ tiêu BCTC — 1 CTCK × 1 chỉ tiêu × 1 kỳ
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_rpt_ind_val
  alias: at_mb_rp_in_va
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_scr_co_dim_hstr
  alias: dt_sc_co_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_rpt_ind_dim_hstr
  alias: dt_rp_in_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_mb_pr_rp
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.cdr_dt = at_mb_pr_rp.rpt_dt
  description: ''
- main_alias: at_mb_pr_rp
  join_type: LEFT JOIN
  join_alias: dt_sc_co_di_hs
  join_on: dt_sc_co_di_hs.scr_co_code = at_mb_pr_rp.scr_co_code AND at_mb_pr_rp.rpt_dt
    BETWEEN dt_sc_co_di_hs.eff_dt AND dt_sc_co_di_hs.expiry_dt
  description: ''
- main_alias: at_mb_pr_rp
  join_type: LEFT JOIN
  join_alias: dt_rp_in_di_hs
  join_on: dt_rp_in_di_hs.rpt_ind_code = at_mb_rp_in_va.rpt_ind_code AND at_mb_pr_rp.rpt_dt
    BETWEEN dt_rp_in_di_hs.eff_dt AND dt_rp_in_di_hs.expiry_dt
  description: ''
mapping_columns:
- target_column: rpt_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK lịch — ETL lookup
- target_column: scr_co_dim_id
  transformation: dt_sc_co_di_hs.scr_co_dim_id
  data_type: string
  target_attr_name: ''
  description: FK CTCK — ETL lookup
- target_column: rpt_ind_dim_id
  transformation: dt_rp_in_di_hs.rpt_ind_dim_id
  data_type: string
  target_attr_name: ''
  description: FK chỉ tiêu — ETL lookup
- target_column: rpt_tpl_code
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN at_mb_rp_in_va
    ON at_mb_rp_in_va.mbr_prd_rpt_id '
  data_type: string
  target_attr_name: ''
  description: Mã biểu mẫu (DD)
- target_column: rpt_prd_tp_code
  transformation: at_mb_pr_rp.rpt_prd_tp_code
  data_type: string
  target_attr_name: ''
  description: Kỳ báo cáo
- target_column: ind_val_amt
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN at_mb_rp_in_va
    ON at_mb_rp_in_va.mbr_prd_rpt_id '
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Giá trị chỉ tiêu
- target_column: vrsn
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN at_mb_rp_in_va
    ON at_mb_rp_in_va.mbr_prd_rpt_id '
  data_type: string
  target_attr_name: ''
  description: Phiên bản báo cáo
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
