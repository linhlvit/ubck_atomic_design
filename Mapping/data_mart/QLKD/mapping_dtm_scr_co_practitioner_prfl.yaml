  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter 2 nguồn chính thức SCMS_CTCK_NGUOI_HANH_NGHE_CK
    + NHNCK_Professionals. Driving table: at_sc_pr_hs.'
