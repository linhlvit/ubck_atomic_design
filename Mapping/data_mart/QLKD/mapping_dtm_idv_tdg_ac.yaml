schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-idv_tdg_ac
  logical_name: Tài khoản giao dịch CK cá nhân mở tại CTCK
  physical_name: idv_tdg_ac
  dm_ref: DTM-idv_tdg_ac
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: idv_tdg_ac
  etl_handle: SCD4A
  description: Tài khoản giao dịch CK cá nhân mở tại CTCK
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_shrhlr_hstr
  alias: at_sc_co_sh_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'SCMS_CTCK_CO_DONG'
  description: ''
relationship: []
mapping_columns:
- target_column: tdg_ac_id
  transformation: 'hash_id(''SCMS_CTCK_CO_DONG'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: idv_prfl_id
  transformation: 'NULL'
  data_type: string
  target_attr_name: ''
  description: FK đến Individual Profile (ETL derived)
- target_column: scr_co_shrhlr_id
  transformation: at_sc_co_sh_hs.scr_co_shrhlr_id
  data_type: string
  target_attr_name: ''
  description: Silver surrogate Id cổ đông — join key
- target_column: scr_co_code
  transformation: at_sc_co_sh_hs.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK nơi mở TK
- target_column: tdg_ac_nbr
  transformation: at_sc_co_sh_hs.tdg_ac_nbr
  data_type: string
  target_attr_name: ''
  description: Số tài khoản giao dịch CK
- target_column: shrhlr_nm
  transformation: at_sc_co_sh_hs.shrhlr_nm
  data_type: string
  target_attr_name: ''
  description: Tên chủ tài khoản
- target_column: src_stm_code
  transformation: at_sc_co_sh_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức SCMS_CTCK_CO_DONG. Driving
    table: at_sc_co_sh_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
