schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-idv_rel_p_ntw
  logical_name: Mạng lưới người liên quan — gia đình + DN niêm yết nodes
  physical_name: idv_rel_p_ntw
  dm_ref: DTM-idv_rel_p_ntw
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: idv_rel_p_ntw
  etl_handle: SCD4A
  description: Mạng lưới người liên quan — gia đình + DN niêm yết nodes
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_shrhlr_rel_p_hstr
  alias: at_sc_co_sh_re_p_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_shrhlr_rel_p / scr_prac_hstr
  alias: at_sc_co_sh_re_p _pr_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_rel_ent
  alias: at_pb_co_re_en
  select_fields: '*'
  filter: ds_record_status = 1
  description: ''
relationship:
- main_alias: at_sc_co_sh_re_p_hs
  join_type: LEFT JOIN
  join_alias: at_sc_co_sh_re_p_hs / scr_prac
  join_on: at_sc_co_sh_re_p_hs / scr_prac.scr_co_shrhlr_rel_p_id = at_sc_co_sh_re_p_hs.scr_co_shrhlr_rel_p_id
  description: ''
mapping_columns:
- target_column: rel_p_ntw_id
  transformation: 'hash_id(''idv_rel_p_ntw_id'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: idv_prfl_id
  transformation: 'NULL'
  data_type: string
  target_attr_name: ''
  description: FK đến Individual Profile (ETL derived)
- target_column: rel_p_full_nm
  transformation: at_sc_co_sh_re_p_hs.rel_p_full_nm
  data_type: string
  target_attr_name: ''
  description: Tên người liên quan
- target_column: rltnp_tp_code
  transformation: at_sc_co_sh_re_p_hs.rltnp_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Mối quan hệ (scheme: SCMS_SHAREHOLDER_RELATION_TYPE / NHNCK)'
- target_column: rel_p_identity_refr_code
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN ip_alt_identn
    ON ip_alt_identn.ip_id = scr_co_shrh'
  data_type: string
  target_attr_name: ''
  description: CMND/CCCD người liên quan
- target_column: rel_p_job_pos_nm
  transformation: at_sc_co_sh_re_p_hs.rel_p_job_pos_nm
  data_type: string
  target_attr_name: ''
  description: Chức vụ/nghề nghiệp người liên quan (text)
- target_column: shr_qty
  transformation: at_sc_co_sh_re_p_hs.shr_qty
  data_type: int
  target_attr_name: ''
  description: Số CP người liên quan nắm giữ
- target_column: shr_rto
  transformation: at_sc_co_sh_re_p_hs.shr_rto
  data_type: decimal(5,2)
  target_attr_name: ''
  description: Tỷ lệ sở hữu — xem O_QLKD_15
- target_column: src_stm_code
  transformation: CASE WHEN at_sc_co_sh_re_p_hs.src_stm_code IS NOT NULL THEN at_sc_co_sh_re_p_hs.src_stm_code
    WHEN scr_prac.src_stm_code IS NOT NULL THEN scr_prac.src_stm_code ELSE NULL END
  data_type: string
  target_attr_name: ''
  description: CASE WHEN source = Securities Company Shareholder Related Party THEN
    'SCMS' WHEN source = Securities Practitioner THEN 'NHNCK' ELSE NULL END
- target_column: pblc_co_code
  transformation: at_pb_co_re_en.pblc_co_code
  data_type: string
  target_attr_name: ''
  description: Mã DN niêm yết node (từ Public Company Related Entity)
- target_column: pblc_co_nm
  transformation: at_pb_co_re_en.rel_ent_nm
  data_type: string
  target_attr_name: ''
  description: Tên DN niêm yết node
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
