schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-idv_wrk_hist
  logical_name: Lịch sử công tác CTCK — 1 cá nhân × 1 lần bổ nhiệm × 1 CTCK
  physical_name: idv_wrk_hist
  dm_ref: DTM-idv_wrk_hist
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: idv_wrk_hist
  etl_handle: SCD4A
  description: Lịch sử công tác CTCK — 1 cá nhân × 1 lần bổ nhiệm × 1 CTCK
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_snr_psn_hstr
  alias: at_sc_co_sn_ps_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'SCMS_CTCK_NHAN_SU_CAO_CAP'
  description: ''
relationship: []
mapping_columns:
- target_column: wrk_hist_id
  transformation: 'hash_id(''SCMS_CTCK_NHAN_SU_CAO_CAP'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: idv_prfl_id
  transformation: 'NULL'
  data_type: string
  target_attr_name: ''
  description: FK đến Individual Profile (ETL derived)
- target_column: scr_co_snr_psn_id
  transformation: at_sc_co_sn_ps_hs.scr_co_snr_psn_id
  data_type: string
  target_attr_name: ''
  description: Silver surrogate Id — join key
- target_column: scr_co_code
  transformation: at_sc_co_sn_ps_hs.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK công tác
- target_column: pos_tp_code
  transformation: at_sc_co_sn_ps_hs.pos_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Chức vụ (scheme: SCMS_POSITION_TYPE)'
- target_column: emp_strt_dt
  transformation: at_sc_co_sn_ps_hs.crt_tms
  data_type: date
  target_attr_name: ''
  description: Ngày bắt đầu công tác — tạm dùng Created Timestamp, xem O_QLKD_16
- target_column: resignation_dt
  transformation: at_sc_co_sn_ps_hs.resignation_dt
  data_type: date
  target_attr_name: ''
  description: Ngày thôi việc — NULL = đang công tác
- target_column: is_crn_ind
  transformation: CASE WHEN at_sc_co_sn_ps_hs.resignation_dt IS NULL THEN true ELSE
    false END
  data_type: string
  target_attr_name: ''
  description: CASE WHEN Securities Company Senior Personnel.Resignation Date IS NULL
    THEN true ELSE false END
- target_column: src_stm_code
  transformation: at_sc_co_sn_ps_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức SCMS_CTCK_NHAN_SU_CAO_CAP.
    Driving table: at_sc_co_sn_ps_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
