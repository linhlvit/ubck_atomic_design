    ON mbr_rpt_ind_val.mbr_prd_rpt_id '
  data_type: string
  target_attr_name: ''
  description: Mã chỉ tiêu
- target_column: row_nm
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN mbr_rpt_ind_val
    ON mbr_rpt_ind_val.mbr_prd_rpt_id '
  data_type: string
  target_attr_name: ''
