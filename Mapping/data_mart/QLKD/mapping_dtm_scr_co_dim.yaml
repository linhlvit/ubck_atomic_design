schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-scr_co_dim
  logical_name: CTCK — tên, mã, trạng thái, vốn điều lệ, niêm yết (SCD2)
  physical_name: scr_co_dim
  dm_ref: DTM-scr_co_dim
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: scr_co_dim
  etl_handle: SCD4A
  description: CTCK — tên, mã, trạng thái, vốn điều lệ, niêm yết (SCD2)
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_co_hstr
  alias: at_sc_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship: []
mapping_columns:
- target_column: scr_co_dim_id
  transformation: hash_id('scr_co_dim_id', scr_co_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: scr_co_code
  transformation: at_sc_co_hs.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK
- target_column: scr_co_nm
  transformation: at_sc_co_hs.scr_co_nm
  data_type: string
  target_attr_name: ''
  description: Tên đầy đủ
- target_column: scr_co_shrt_nm
  transformation: at_sc_co_hs.scr_co_shrt_nm
  data_type: string
  target_attr_name: ''
  description: Tên viết tắt
- target_column: co_st_code
  transformation: at_sc_co_hs.co_st_code
  data_type: string
  target_attr_name: ''
  description: Trạng thái CTCK
- target_column: is_list_ind
  transformation: at_sc_co_hs.is_list_ind
  data_type: string
  target_attr_name: ''
  description: Cờ niêm yết
- target_column: stk_exg_nm
  transformation: at_sc_co_hs.stk_exg_nm
  data_type: string
  target_attr_name: ''
  description: Tên sàn niêm yết
- target_column: charter_cptl_amt
  transformation: at_sc_co_hs.charter_cptl_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn điều lệ
- target_column: src_stm_code
  transformation: at_sc_co_hs.src_stm_code WHERE at_sc_co_hs.src_stm_code IN ('FIMS_SECURITIESCOMPANY','SCMS_CTCK_THONG_TIN')
  data_type: string
  target_attr_name: ''
  description: Mã hệ thống nguồn — FIMS + SCMS (không filter ThanhTra)
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
