schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-rpt_ind_dim
  logical_name: Chỉ tiêu báo cáo — mã, tên, hàng/cột/sheet biểu mẫu
  physical_name: rpt_ind_dim
  dm_ref: DTM-rpt_ind_dim
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: rpt_ind_dim
  etl_handle: SCD4A
  description: Chỉ tiêu báo cáo — mã, tên, hàng/cột/sheet biểu mẫu
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_rpt_ind_val
  alias: at_mb_rp_in_va
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND src_stm_code = 'SCMS_BC_BAO_CAO_GT'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'SCMS_REPORT_TEMPLATE'
  description: ''
relationship:
- main_alias: at_mb_rp_in_va
  join_type: INNER JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_mb_rp_in_va.rpt_tpl_code
  description: ''
mapping_columns:
- target_column: rpt_ind_dim_id
  transformation: hash_id('SCMS_BC_BAO_CAO_GT', rpt_ind_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: rpt_ind_code
  transformation: at_mb_rp_in_va.rpt_ind_code
  data_type: string
  target_attr_name: ''
  description: Mã chỉ tiêu
- target_column: rpt_tpl_code
  transformation: at_mb_rp_in_va.rpt_tpl_code
  data_type: string
  target_attr_name: ''
  description: Mã biểu mẫu
- target_column: rpt_tpl_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: lookup Member Report Indicator Value.Report Template Code → Report
    Template Name từ bảng danh mục biểu mẫu
- target_column: shet_nm
  transformation: at_mb_rp_in_va.shet_nm
  data_type: string
  target_attr_name: ''
  description: Tên sheet
- target_column: row_nm
  transformation: at_mb_rp_in_va.row_nm
  data_type: string
  target_attr_name: ''
  description: Tên hàng
- target_column: clmn_nm
  transformation: at_mb_rp_in_va.clmn_nm
  data_type: string
  target_attr_name: ''
  description: Tên cột
- target_column: src_stm_code
  transformation: at_mb_rp_in_va.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức SCMS_BC_BAO_CAO_GT. Driving
    table: at_mb_rp_in_va.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
