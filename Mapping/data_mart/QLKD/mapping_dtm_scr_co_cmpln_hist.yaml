schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-scr_co_cmpln_hist
  logical_name: Lịch sử tuân thủ & vi phạm CTCK — BC định kỳ + thanh tra
  physical_name: scr_co_cmpln_hist
  dm_ref: DTM-scr_co_cmpln_hist
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: scr_co_cmpln_hist
  etl_handle: SCD4A
  description: Lịch sử tuân thủ & vi phạm CTCK — BC định kỳ + thanh tra
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_insp_case
  alias: at_in_ca
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship: []
mapping_columns:
- target_column: cmpln_hist_id
  transformation: 'hash_id(''scr_co_cmpln_hist_id'')  -- TODO: add NK columns'
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: scr_co_code
  transformation: at_mb_pr_rp.scr_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTCK — ETL join key cho filter
- target_column: rpt_tpl_code
  transformation: at_mb_pr_rp.rpt_tpl_code
  data_type: string
  target_attr_name: ''
  description: Mã biểu mẫu
- target_column: rpt_prd_yr
  transformation: at_mb_pr_rp.yr_val
  data_type: int
  target_attr_name: ''
  description: Năm kỳ
- target_column: submission_dt
  transformation: at_mb_pr_rp.subm_dt
  data_type: date
  target_attr_name: ''
  description: Ngày nộp thực tế
- target_column: submission_ddln_dt
  transformation: at_mb_pr_rp.subm_ddln_dt
  data_type: date
  target_attr_name: ''
  description: Hạn nộp
- target_column: submission_st_code
  transformation: at_mb_pr_rp.subm_st_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái nộp (scheme: SCMS_SUBMISSION_STATUS)'
- target_column: sbj_org_shrt_nm
  transformation: at_in_ca.sbj_org_shrt_nm
  data_type: string
  target_attr_name: ''
  description: Tên viết tắt CTCK từ Inspection Case — text match filter, xem O_QLKD_13
- target_column: inspection_tp_code
  transformation: at_in_ca.insp_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại hình thanh/kiểm tra (scheme: TT_PLAN_TYPE)'
- target_column: case_nm
  transformation: at_in_ca.case_nm
  data_type: string
  target_attr_name: ''
  description: Tên hồ sơ thanh tra/kiểm tra
- target_column: conclusion_doc_nbr
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN insp_case_conclusion
    ON insp_case_conclusion.insp_'
  data_type: string
  target_attr_name: ''
  description: Số QĐ kết luận xử phạt
- target_column: signing_dt
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN insp_case_conclusion
    ON insp_case_conclusion.insp_'
  data_type: date
  target_attr_name: ''
  description: Ngày ký kết luận
- target_column: pny_tp_code
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN insp_case_conclusion
    ON insp_case_conclusion.insp_'
  data_type: string
  target_attr_name: ''
  description: 'Hình thức xử phạt (scheme: TT_PENALTY_TYPE)'
- target_column: pny_amt
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN insp_case_conclusion
    ON insp_case_conclusion.insp_'
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Số tiền phạt (VND)
- target_column: conclusion_st_code
  transformation: 'NULL  -- TODO: join_atomic parse failed: LEFT JOIN insp_case_conclusion
    ON insp_case_conclusion.insp_'
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái kết luận (scheme: TT_CASE_STATUS)'
- target_column: src_stm_code
  transformation: at_mb_pr_rp.src_stm_code WHERE at_mb_pr_rp.src_stm_code IN ('FMS_RPTMEMBER','SCMS_BC_THANH_VIEN')
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter 2 nguồn chính thức FMS_RPTMEMBER + SCMS_BC_THANH_VIEN
    (driving table: at_mb_pr_rp). at_in_ca là join phụ, không phải driving.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
