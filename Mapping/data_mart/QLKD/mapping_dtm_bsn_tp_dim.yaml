schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-bsn_tp_dim
  logical_name: Nghiệp vụ CTCK (FIMS_BUSINESS_TYPE) — môi giới/bảo lãnh/tư vấn/tự
    doanh (SCD2)
  physical_name: bsn_tp_dim
  dm_ref: DTM-bsn_tp_dim
  brd_ref: BRD-DTM-QLKD
target:
  namespace: dtm
  physical_name: bsn_tp_dim
  etl_handle: SCD4A
  description: Nghiệp vụ CTCK (FIMS_BUSINESS_TYPE) — môi giới/bảo lãnh/tư vấn/tự doanh
    (SCD2)
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: ''
  description: ''
relationship: []
mapping_columns:
- target_column: bsn_tp_dim_id
  transformation: hash_id('bsn_tp_dim_id', bsn_tp_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key ETL generated
- target_column: bsn_tp_code
  transformation: at_cv.cl_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nghiệp vụ — Classification Value (scheme: FIMS_BUSINESS_TYPE)'
- target_column: bsn_tp_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên nghiệp vụ — Classification Value (scheme: FIMS_BUSINESS_TYPE)'
- target_column: bsn_cgy_code
  transformation: CASE WHEN at_cv.cl_code IN ('MGIOI','BLANH','TUVAN','TDOANH') THEN
    'NGHIEP_VU' ELSE NULL END
  data_type: string
  target_attr_name: ''
  description: 'CASE WHEN at_cv.cl_code IN (''MGIOI'',''BLANH'',''TUVAN'',''TDOANH'')
    THEN ''NGHIEP_VU'' ELSE NULL END (scheme: FIMS_BUSINESS_TYPE)'
- target_column: src_stm_code
  transformation: at_cv.src_stm_code WHERE at_cv.scm_code = 'FIMS_BUSINESS_TYPE'
  data_type: string
  target_attr_name: ''
  description: Mã hệ thống nguồn
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
