schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-scr_practitioner_dim
  logical_name: NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng
    thái hành nghề. SCD2.
  physical_name: scr_practitioner_dim
  dm_ref: DTM-scr_practitioner_dim
  brd_ref: BRD-DTM-NHNCK
target:
  namespace: dtm
  physical_name: scr_practitioner_dim
  etl_handle: SCD4A
  description: NHN — mã định danh, họ tên, ngày sinh, trình độ, quốc tịch, trạng thái
    hành nghề. SCD2.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_hstr
  alias: at_sc_pr_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'NHNCK_Professionals'
  description: ''
relationship: []
mapping_columns:
- target_column: practitioner_dim_id
  transformation: hash_id('NHNCK_Professionals', practitioner_code)
  data_type: string
  target_attr_name: ''
  description: Surrogate key SCD2
- target_column: practitioner_code
  transformation: at_sc_pr_hs.prac_code
  data_type: string
  target_attr_name: ''
  description: Mã định danh NHN — NK dùng để join ETL
- target_column: full_nm
  transformation: at_sc_pr_hs.full_nm
  data_type: string
  target_attr_name: ''
  description: Họ và tên NHN
- target_column: dob
  transformation: at_sc_pr_hs.dob
  data_type: date
  target_attr_name: ''
  description: Ngày sinh đầy đủ
- target_column: ed_lvl_code
  transformation: at_sc_pr_hs.ed_lvl_code
  data_type: string
  target_attr_name: ''
  description: 'Trình độ học vấn — Scheme: EDUCATION_LEVEL'
- target_column: nationality_code
  transformation: at_sc_pr_hs.nat_code
  data_type: string
  target_attr_name: ''
  description: 'Quốc tịch — Scheme: NATIONALITY'
- target_column: identity_refr_code
  transformation: at_sc_pr_hs.id_refr_code
  data_type: string
  target_attr_name: ''
  description: Mã định danh giấy tờ tùy thân
- target_column: practice_st_code
  transformation: at_sc_pr_hs.practice_st_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái hành nghề — Scheme: PRACTICE_STATUS'
- target_column: src_stm_code
  transformation: at_sc_pr_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu — scheme: SOURCE_SYSTEM. Filter: WHERE src_stm_code
    = ''NHNCK_Professionals'''
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
