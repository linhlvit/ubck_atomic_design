schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-practitioner_exam_hist
  logical_name: 'Lịch sử thi sát hạch — toàn bộ lần thi per NHN: đợt thi, ngày thi,
    điểm luật, điểm chuyên môn, kết quả, số quyết định công bố.'
  physical_name: practitioner_exam_hist
  dm_ref: DTM-practitioner_exam_hist
  brd_ref: BRD-DTM-NHNCK
target:
  namespace: dtm
  physical_name: practitioner_exam_hist
  etl_handle: SCD4A
  description: 'Lịch sử thi sát hạch — toàn bộ lần thi per NHN: đợt thi, ngày thi,
    điểm luật, điểm chuyên môn, kết quả, số quyết định công bố.'
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_qualf_exam_ases_rslt
  alias: at_sc_pr_qu_ex_as_rs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND src_stm_code = 'NHNCK_ExamDetails'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_qualf_exam_ases
  alias: at_sc_pr_qu_ex_as
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_scr_prac_license_dcsn_doc_hstr
  alias: at_sc_pr_li_dc_do_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_sc_pr_qu_ex_as_rs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_qu_ex_as
  join_on: at_sc_pr_qu_ex_as.exam_ases_id = at_sc_pr_qu_ex_as_rs.exam_ases_id
  description: ''
- main_alias: at_sc_pr_qu_ex_as_rs
  join_type: LEFT JOIN
  join_alias: at_sc_pr_li_dc_do_hs
  join_on: at_sc_pr_li_dc_do_hs.license_dcsn_doc_id = at_sc_pr_qu_ex_as.license_dcsn_doc_id
  description: ''
mapping_columns:
- target_column: practitioner_id
  transformation: at_sc_pr_qu_ex_as_rs.prac_id
  data_type: string
  target_attr_name: ''
  description: Surrogate PK — Atomic Id
- target_column: practitioner_code
  transformation: at_sc_pr_qu_ex_as_rs.prac_code
  data_type: string
  target_attr_name: ''
  description: BK NHN
- target_column: exam_ases_rslt_code
  transformation: at_sc_pr_qu_ex_as_rs.exam_ases_rslt_code
  data_type: string
  target_attr_name: ''
  description: BK kết quả thi
- target_column: ssn_nm
  transformation: at_sc_pr_qu_ex_as.ssn_nm
  data_type: string
  target_attr_name: ''
  description: Tên đợt thi
- target_column: exam_strt_dt
  transformation: at_sc_pr_qu_ex_as.exam_strt_dt
  data_type: date
  target_attr_name: ''
  description: Ngày thi
- target_column: law_scor
  transformation: at_sc_pr_qu_ex_as_rs.law_scor
  data_type: string
  target_attr_name: ''
  description: Điểm pháp luật — Text do có thể là 'Vắng'/'Miễn thi'
- target_column: specialization_scor
  transformation: at_sc_pr_qu_ex_as_rs.specialization_scor
  data_type: string
  target_attr_name: ''
  description: Điểm chuyên môn
- target_column: exam_rslt_code
  transformation: at_sc_pr_qu_ex_as_rs.exam_rslt_code
  data_type: string
  target_attr_name: ''
  description: 'Kết quả tổng — Scheme: EXAMINATION_RESULT'
- target_column: dcsn_nbr
  transformation: at_sc_pr_li_dc_do_hs.dcsn_nbr
  data_type: string
  target_attr_name: ''
  description: Số quyết định công bố kết quả — join từ ExamSessions.DecisionId
- target_column: dcsn_issu_dt
  transformation: at_sc_pr_li_dc_do_hs.signing_dt
  data_type: date
  target_attr_name: ''
  description: Ngày ban hành quyết định công bố
- target_column: src_stm_code
  transformation: at_sc_pr_qu_ex_as_rs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức NHNCK_ExamDetails. Driving
    table: at_sc_pr_qu_ex_as_rs.'
final_filter: []
join_agg_ctes: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
