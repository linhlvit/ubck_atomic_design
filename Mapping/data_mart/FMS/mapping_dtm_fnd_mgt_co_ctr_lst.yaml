schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fnd_mgt_co_ctr_lst
  logical_name: Bảng con drill-down danh sách HĐ UTDM per CTQLQ ← FMS.INVESACC + FMS.INVES
  physical_name: fnd_mgt_co_ctr_lst
  dm_ref: DTM-fnd_mgt_co_ctr_lst
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: fnd_mgt_co_ctr_lst
  etl_handle: SCD4A
  description: Bảng con drill-down danh sách HĐ UTDM per CTQLQ ← FMS.INVESACC + FMS.INVES
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_dscr_ivsm_ac_hstr
  alias: at_ds_iv_ac_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'FMS_INVESACC'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_dscr_ivsm_ivsr_hstr
  alias: at_ds_iv_iv_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_rpt_impr_val_hstr
  alias: at_rp_im_va_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship:
- main_alias: at_ds_iv_ac_hs
  join_type: LEFT JOIN
  join_alias: at_ds_iv_iv_hs
  join_on: at_ds_iv_iv_hs.dscr_ivsm_ivsr_id = at_ds_iv_ac_hs.dscr_ivsm_ivsr_id
  description: ''
- main_alias: at_ds_iv_iv_hs
  join_type: LEFT JOIN
  join_alias: at_rp_im_va_hs
  join_on: at_rp_im_va_hs.fnd_mgt_co_id = at_ds_iv_iv_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_rp_im_va_hs
  join_type: INNER JOIN
  join_alias: at_mb_pr_rp
  join_on: at_mb_pr_rp.mbr_prd_rpt_id = at_rp_im_va_hs.mbr_prd_rpt_id AND at_mb_pr_rp.rpt_subm_st_code
    IN ('SUBMITTED','LATE')
  description: ''
mapping_columns:
- target_column: fnd_mgt_co_id
  transformation: at_ds_iv_iv_hs.fnd_mgt_co_id
  data_type: string
  target_attr_name: ''
  description: PK component 1 — FK về Fund Management Company Profile (drill anchor)
- target_column: dscr_ivsm_ac_id
  transformation: at_ds_iv_ac_hs.dscr_ivsm_ac_id
  data_type: string
  target_attr_name: ''
  description: PK component 2 — Surrogate PK Atomic HĐ UTDM
- target_column: dscr_ivsm_ac_code
  transformation: at_ds_iv_ac_hs.dscr_ivsm_ac_code
  data_type: string
  target_attr_name: ''
  description: Mã tài khoản UTDM (Business Key) — FMS.INVESACC.Id
- target_column: ac_nbr
  transformation: at_ds_iv_ac_hs.ac_nbr
  data_type: string
  target_attr_name: ''
  description: Số tài khoản UTDM ← FMS.INVESACC.Account
- target_column: ctr_nbr
  transformation: at_ds_iv_ac_hs.ctr_nbr
  data_type: string
  target_attr_name: ''
  description: Số HĐ UTDM ← FMS.INVESACC.ContractNo
- target_column: ivsr_nm
  transformation: at_ds_iv_iv_hs.ivsr_nm
  data_type: string
  target_attr_name: ''
  description: Tên nhà đầu tư ← FMS.INVES.Name
- target_column: ivsr_obj_tp_code
  transformation: at_ds_iv_iv_hs.stockholder_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại NĐT (cá nhân/tổ chức) — scheme: FMS_STOCKHOLDER_TYPE'
- target_column: trst_mkt_val
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Giá trị TT HĐ UTDM từ RPTVALUES — pending O_FMS_1
- target_column: ctr_strt_dt
  transformation: at_ds_iv_ac_hs.rpt_dt
  data_type: date
  target_attr_name: ''
  description: Ngày bắt đầu HĐ UTDM ← FMS.INVESACC.DateReport (proxy)
- target_column: rpt_prd_code
  transformation: at_rp_im_va_hs.rpt_prd_code ORDER BY at_mb_pr_rp.day_rpt DESC LIMIT
    1
  data_type: string
  target_attr_name: ''
  description: Mã kỳ BC tương ứng GTTT
- target_column: src_stm_code
  transformation: at_ds_iv_ac_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức FMS_INVESACC. Driving
    table: at_ds_iv_ac_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
