  namespace: ''
  table_name: ivsm_fnd
  alias: iv_fn
  select_fields: COUNT(ivsm_fnd_id) AS tot_fnd_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
