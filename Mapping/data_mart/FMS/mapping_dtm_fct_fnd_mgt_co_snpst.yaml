schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fct_fnd_mgt_co_snpst
  logical_name: Thống kê thị trường — grain 1 snapshot toàn TT × 1 tháng. COUNT db
    + AUM BC (PENDING O_FMS_1)
  physical_name: fct_fnd_mgt_co_snpst
  dm_ref: DTM-fct_fnd_mgt_co_snpst
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: fct_fnd_mgt_co_snpst
  etl_handle: Fact Snapshot
  description: Thống kê thị trường — grain 1 snapshot toàn TT × 1 tháng. COUNT db
    + AUM BC (PENDING O_FMS_1)
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: dtm
  table_name: dtm_cdr_dt_dim_hstr
  alias: dt_cd_dt_di_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnd_mgt_co_hstr
  alias: at_fn_mg_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: scalar_cte
  namespace: ''
  table_name: fnd_mgt_co
  alias: fn_mg_co
  select_fields: COUNT(fnd_mgt_co_id) AS actv_co_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND lcs_code = 'ACTIVE'
  description: 'Scalar measure: actv_co_cnt'
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsm_fnd_hstr
  alias: at_iv_fn_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: scalar_cte
  namespace: ''
  table_name: ivsm_fnd
  alias: iv_fn
  select_fields: COUNT(ivsm_fnd_id) AS ivsm_fnd_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: 'Scalar measure: ivsm_fnd_cnt'
- source_type: scalar_cte
  namespace: ''
  table_name: ivsm_fnd
  alias: iv_fn_2
  select_fields: COUNT(ivsm_fnd_id) AS retmt_fnd_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND fnd_tp_code = 'QUY_HUUTRI'
  description: 'Scalar measure: retmt_fnd_cnt'
- source_type: physical_table
  namespace: atm
  table_name: atm_frgn_fnd_mgt_ou_hstr
  alias: at_fr_fn_mg_ou_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: scalar_cte
  namespace: ''
  table_name: frgn_fnd_mgt_ou
  alias: fr_fn_mg_ou
  select_fields: COUNT(frgn_fnd_mgt_ou_id) AS frgn_ou_rep_ofc_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND practice_st_code = 'ACTIVE'
    AND array_contains(bsn_tp_codes, 'VPDD')
  description: 'Scalar measure: frgn_ou_rep_ofc_cnt'
- source_type: scalar_cte
  namespace: ''
  table_name: frgn_fnd_mgt_ou
  alias: fr_fn_mg_ou_2
  select_fields: COUNT(frgn_fnd_mgt_ou_id) AS frgn_ou_brch_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND practice_st_code = 'ACTIVE'
    AND array_contains(bsn_tp_codes, 'CHI_NHANH')
  description: 'Scalar measure: frgn_ou_brch_cnt'
- source_type: physical_table
  namespace: atm
  table_name: atm_fnd_dstr_agnt_hstr
  alias: at_fn_ds_ag_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: scalar_cte
  namespace: ''
  table_name: fnd_dstr_agnt
  alias: fn_ds_ag
  select_fields: COUNT(fnd_dstr_agnt_id) AS dstr_agnt_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND practice_st_code = 'ACTIVE'
  description: 'Scalar measure: dstr_agnt_cnt'
- source_type: physical_table
  namespace: atm
  table_name: atm_rpt_impr_val_hstr
  alias: at_rp_im_va_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: scalar_cte
  namespace: ''
  table_name: rpt_impr_val
  alias: rp_im_va
  select_fields: SUM(CAST(val AS decimal)) AS tot_aum_amt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND rpt_id = '<rpt_id>' AND
    rpt_shet_id = '<rpt_shet_id>' AND rpt_trgt_id = 'AUM_ROW'
  description: 'Scalar measure: tot_aum_amt'
- source_type: scalar_cte
  namespace: ''
  table_name: rpt_impr_val
  alias: rp_im_va_2
  select_fields: SUM(CAST(val AS int)) AS tot_dscr_ctr_cnt
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND rpt_trgt_id = '180101'
  description: 'Scalar measure: tot_dscr_ctr_cnt'
relationship:
- main_alias: at_mb_pr_rp
  join_type: LEFT JOIN
  join_alias: dt_cd_dt_di_hs
  join_on: dt_cd_dt_di_hs.cdr_dt_id = at_mb_pr_rp.day_rpt
  description: ''
mapping_columns:
- target_column: snpst_dt_dim_id
  transformation: dt_cd_dt_di_hs.cdr_dt_dim_id
  data_type: string
  target_attr_name: ''
  description: FK ngày snapshot — lookup qua at_mb_pr_rp.day_rpt, filter SUBMITTED/LATE
- target_column: actv_co_cnt
  transformation: fn_mg_co.actv_co_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT CTQLQ Life Cycle Status = đang hoạt động tại tháng snapshot
- target_column: ivsm_fnd_cnt
  transformation: iv_fn.ivsm_fnd_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT quỹ đầu tư tất cả loại hình tại tháng snapshot
- target_column: retmt_fnd_cnt
  transformation: iv_fn_2.retmt_fnd_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT quỹ hưu trí tại tháng snapshot
- target_column: frgn_ou_rep_ofc_cnt
  transformation: fr_fn_mg_ou.frgn_ou_rep_ofc_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT VPĐD CTQLQ nước ngoài tại VN
- target_column: frgn_ou_brch_cnt
  transformation: fr_fn_mg_ou_2.frgn_ou_brch_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT Chi nhánh CTQLQ nước ngoài tại VN
- target_column: dstr_agnt_cnt
  transformation: fn_ds_ag.dstr_agnt_cnt
  data_type: int
  target_attr_name: ''
  description: COUNT đại lý phân phối CCQ tại tháng snapshot
- target_column: tot_aum_amt
  transformation: rp_im_va.tot_aum_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Tổng AUM toàn thị trường từ BC RPTVALUES — pending O_FMS_1
- target_column: tot_dscr_ctr_cnt
  transformation: rp_im_va_2.tot_dscr_ctr_cnt
  data_type: int
  target_attr_name: ''
  description: Tổng số HĐ UTDM toàn thị trường từ BC RPTVALUES mã 180101 — pending
    O_FMS_1
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
