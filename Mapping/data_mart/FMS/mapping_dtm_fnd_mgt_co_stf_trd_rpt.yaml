schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fnd_mgt_co_stf_trd_rpt
  logical_name: Báo cáo GD nhân viên CTQLQ — K_FMS_68–72 READY. K_FMS_73–77 sổ lệnh
    PENDING O_FMS_11 (GSGD không có Silver)
  physical_name: fnd_mgt_co_stf_trd_rpt
  dm_ref: DTM-fnd_mgt_co_stf_trd_rpt
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: fnd_mgt_co_stf_trd_rpt
  etl_handle: SCD4A
  description: Báo cáo GD nhân viên CTQLQ — K_FMS_68–72 READY. K_FMS_73–77 sổ lệnh
    PENDING O_FMS_11 (GSGD không có Silver)
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_fnd_mgt_co_key_psn_hstr
  alias: at_fn_mg_co_ke_ps_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'FMS_TLProfiles'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ip_alt_identn_hstr
  alias: at_ip_al_id_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsr_tdg_ac_hstr
  alias: at_iv_td_ac_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_fn_mg_co_ke_ps_hs
  join_type: LEFT JOIN
  join_alias: at_ip_al_id_hs
  join_on: at_ip_al_id_hs.ip_id = at_fn_mg_co_ke_ps_hs.fnd_mgt_co_key_psn_id AND at_ip_al_id_hs.identn_tp_code
    IN ('CITIZEN_ID','PASSPORT')
  description: ''
- main_alias: at_ip_al_id_hs
  join_type: LEFT JOIN
  join_alias: at_iv_td_ac_hs
  join_on: at_iv_td_ac_hs.id_nbr = at_ip_al_id_hs.identn_nbr
  description: ''
mapping_columns:
- target_column: fnd_mgt_co_id
  transformation: at_fn_mg_co_ke_ps_hs.fnd_mgt_co_id
  data_type: string
  target_attr_name: ''
  description: PK component 1 — FK Atomic CTQLQ
- target_column: fnd_mgt_co_key_psn_id
  transformation: at_fn_mg_co_ke_ps_hs.fnd_mgt_co_key_psn_id
  data_type: string
  target_attr_name: ''
  description: PK component 2 — Surrogate PK nhân viên CTQLQ
- target_column: fnd_mgt_co_key_psn_code
  transformation: at_fn_mg_co_ke_ps_hs.fnd_mgt_co_key_psn_code
  data_type: string
  target_attr_name: ''
  description: Mã nhân viên CTQLQ (Business Key) — FMS.TLProfiles.Id
- target_column: full_nm
  transformation: at_fn_mg_co_ke_ps_hs.full_nm
  data_type: string
  target_attr_name: ''
  description: Họ tên nhân viên ← FMS.TLProfiles.FullName
- target_column: job_tp_code
  transformation: at_fn_mg_co_ke_ps_hs.job_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Chức danh nhân viên — scheme: FMS_JOB_TYPE'
- target_column: identn_nbr
  transformation: at_ip_al_id_hs.identn_nbr
  data_type: string
  target_attr_name: ''
  description: Số CCCD/HC nhân viên — join key sang GSGD ← FMS.TLProfiles.IdAdd
- target_column: ivsr_tdg_ac_code
  transformation: at_iv_td_ac_hs.ivsr_tdg_ac_code
  data_type: string
  target_attr_name: ''
  description: Mã TK GDCK ← GSGD.investor_account.account_code — join qua identity_number
    = identn_nbr
- target_column: scr_co_code
  transformation: LEFT(at_iv_td_ac_hs.ivsr_tdg_ac_code, 4)
  data_type: string
  target_attr_name: ''
  description: Mã CTCK — ETL parse từ 4–5 ký tự đầu Investor_Trading_Account_Code
    — cần xác nhận ETL team
- target_column: txn_dt
  transformation: NULL  -- PENDING
  data_type: date
  target_attr_name: ''
  description: Ngày giao dịch — PENDING O_FMS_11 (VSDC)
- target_column: txn_mthd_code
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: Phương thức giao dịch — PENDING O_FMS_11
- target_column: ord_side_code
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: Lệnh mua/bán — PENDING O_FMS_11
- target_column: scr_code
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: Mã chứng khoán — PENDING O_FMS_11
- target_column: ord_qty
  transformation: NULL  -- PENDING
  data_type: int
  target_attr_name: ''
  description: Số lượng CK — PENDING O_FMS_11
- target_column: src_stm_code
  transformation: at_fn_mg_co_ke_ps_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức FMS_TLProfiles. Driving
    table: at_fn_mg_co_ke_ps_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
