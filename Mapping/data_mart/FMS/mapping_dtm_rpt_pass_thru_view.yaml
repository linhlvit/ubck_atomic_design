schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-rpt_pass_thru_view
  logical_name: Pass-through báo cáo — grain 1 CTQLQ/Quỹ × 1 mẫu BC × 1 kỳ × 1 dòng
    chỉ tiêu. Row Name PENDING O_FMS_1
  physical_name: rpt_pass_thru_view
  dm_ref: DTM-rpt_pass_thru_view
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: rpt_pass_thru_view
  etl_handle: SCD4A
  description: Pass-through báo cáo — grain 1 CTQLQ/Quỹ × 1 mẫu BC × 1 kỳ × 1 dòng
    chỉ tiêu. Row Name PENDING O_FMS_1
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_rpt_impr_val_hstr
  alias: at_rp_im_va_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'FMS_RPTVALUES'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_fnd_mgt_co_hstr
  alias: at_fn_mg_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsm_fnd_hstr
  alias: at_iv_fn_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship:
- main_alias: at_rp_im_va_hs
  join_type: LEFT JOIN
  join_alias: at_fn_mg_co_hs
  join_on: at_fn_mg_co_hs.fnd_mgt_co_id = at_rp_im_va_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_rp_im_va_hs
  join_type: LEFT JOIN
  join_alias: at_iv_fn_hs
  join_on: at_iv_fn_hs.ivsm_fnd_id = at_rp_im_va_hs.ivsm_fnd_id
  description: ''
- main_alias: at_rp_im_va_hs
  join_type: INNER JOIN
  join_alias: at_mb_pr_rp
  join_on: at_mb_pr_rp.mbr_prd_rpt_id = at_rp_im_va_hs.mbr_prd_rpt_id
  description: ''
mapping_columns:
- target_column: fnd_mgt_co_id
  transformation: at_rp_im_va_hs.fnd_mgt_co_id
  data_type: string
  target_attr_name: ''
  description: PK component 1 — Surrogate key CTQLQ
- target_column: ivsm_fnd_id
  transformation: at_rp_im_va_hs.ivsm_fnd_id
  data_type: string
  target_attr_name: ''
  description: PK component 2 — Surrogate key quỹ (null nếu BC CTQLQ)
- target_column: rpt_tpl_code
  transformation: at_rp_im_va_hs.rpt_id
  data_type: string
  target_attr_name: ''
  description: PK component 3 — Mã biểu mẫu BC
- target_column: rpt_prd_code
  transformation: at_rp_im_va_hs.rpt_prd_code
  data_type: string
  target_attr_name: ''
  description: PK component 4 — Mã kỳ báo cáo
- target_column: row_code
  transformation: at_rp_im_va_hs.rpt_trgt_id
  data_type: string
  target_attr_name: ''
  description: PK component 5 — Mã dòng chỉ tiêu (TgtId)
- target_column: fnd_mgt_co_code
  transformation: at_rp_im_va_hs.fnd_mgt_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTQLQ — denormalized
- target_column: fnd_mgt_co_nm
  transformation: at_fn_mg_co_hs.fnd_mgt_co_nm
  data_type: string
  target_attr_name: ''
  description: Tên CTQLQ — denormalized từ FMS.SECURITIES
- target_column: ivsm_fnd_code
  transformation: at_rp_im_va_hs.ivsm_fnd_code
  data_type: string
  target_attr_name: ''
  description: Mã quỹ — denormalized
- target_column: ivsm_fnd_nm
  transformation: at_iv_fn_hs.ivsm_fnd_nm
  data_type: string
  target_attr_name: ''
  description: Tên quỹ — denormalized từ FMS.FUNDS
- target_column: rpt_tpl_nm
  transformation: at_mb_pr_rp.rpt_nm
  data_type: string
  target_attr_name: ''
  description: Tên biểu mẫu BC — lookup từ Member Periodic Report
- target_column: rpt_prd_lbl
  transformation: at_mb_pr_rp.yr_val
  data_type: string
  target_attr_name: ''
  description: 'Nhãn kỳ BC hiển thị — hiện lấy yr_val (năm). Cần BA xác nhận: có cần
    bổ sung prd_val + prd_tp_code để tạo label đầy đủ (vd: "T3/2025") không'
- target_column: rpt_dt
  transformation: at_mb_pr_rp.rpt_dt
  data_type: date
  target_attr_name: ''
  description: Ngày nộp BC — từ Member Periodic Report
- target_column: row_nm
  transformation: NULL  -- PENDING
  data_type: string
  target_attr_name: ''
  description: Tên dòng chỉ tiêu — pending O_FMS_1 (lookup từ mapping sheet/template)
- target_column: cell_val
  transformation: CAST(at_rp_im_va_hs.val AS decimal)
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Giá trị chỉ tiêu (numeric) ← FMS.RPTVALUES.Values
- target_column: cell_txt_val
  transformation: at_rp_im_va_hs.val
  data_type: string
  target_attr_name: ''
  description: Giá trị chỉ tiêu dạng text (nguyên bản) ← FMS.RPTVALUES.Values
- target_column: data_unit
  transformation: at_rp_im_va_hs.fmt_data_tp_code
  data_type: string
  target_attr_name: ''
  description: Đơn vị dữ liệu ← FMS.RPTVALUES.FormatDataType
- target_column: src_stm_code
  transformation: at_rp_im_va_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức FMS_RPTVALUES. Driving
    table: at_rp_im_va_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
