schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-ivsm_fnd_prfl
  logical_name: Hồ sơ quỹ — latest state per quỹ. NAV/LN PENDING O_FMS_1
  physical_name: ivsm_fnd_prfl
  dm_ref: DTM-ivsm_fnd_prfl
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: ivsm_fnd_prfl
  etl_handle: SCD4A
  description: Hồ sơ quỹ — latest state per quỹ. NAV/LN PENDING O_FMS_1
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsm_fnd_hstr
  alias: at_iv_fn_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'FMS_FUNDS'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsm_fnd_ctf_tfr
  alias: at_iv_fn_ct_tf
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_rpt_impr_val_hstr
  alias: at_rp_im_va_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship:
- main_alias: at_iv_fn_hs
  join_type: LEFT JOIN
  join_alias: at_rp_im_va_hs
  join_on: at_rp_im_va_hs.ivsm_fnd_id = at_iv_fn_hs.ivsm_fnd_id
  description: ''
- main_alias: at_rp_im_va_hs
  join_type: INNER JOIN
  join_alias: at_mb_pr_rp
  join_on: at_mb_pr_rp.mbr_prd_rpt_id = at_rp_im_va_hs.mbr_prd_rpt_id AND at_mb_pr_rp.rpt_subm_st_code
    IN ('SUBMITTED','LATE')
  description: ''
- main_alias: at_iv_fn_hs
  join_type: LEFT JOIN
  join_alias: at_iv_fn_ct_tf
  join_on: at_iv_fn_ct_tf.ivsm_fnd_id = at_iv_fn_hs.ivsm_fnd_id
  description: ''
mapping_columns:
- target_column: ivsm_fnd_id
  transformation: at_iv_fn_hs.ivsm_fnd_id
  data_type: string
  target_attr_name: ''
  description: Surrogate PK Atomic — FMS.FUNDS
- target_column: ivsm_fnd_code
  transformation: at_iv_fn_hs.ivsm_fnd_code
  data_type: string
  target_attr_name: ''
  description: Mã quỹ (Business Key) — FMS.FUNDS.Id
- target_column: fnd_mgt_co_id
  transformation: at_iv_fn_hs.fnd_mgt_co_id
  data_type: string
  target_attr_name: ''
  description: FK Atomic về CTQLQ quản lý quỹ
- target_column: fnd_shrt_nm
  transformation: at_iv_fn_hs.ivsm_fnd_shrt_nm
  data_type: string
  target_attr_name: ''
  description: Tên viết tắt quỹ
- target_column: fnd_nm
  transformation: at_iv_fn_hs.ivsm_fnd_nm
  data_type: string
  target_attr_name: ''
  description: Tên đầy đủ quỹ
- target_column: fnd_tp_code
  transformation: at_iv_fn_hs.fnd_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại hình quỹ — scheme: FMS_FUND_TYPE'
- target_column: practice_st_code
  transformation: at_iv_fn_hs.practice_st_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái hoạt động quỹ — scheme: FMS_OPERATION_STATUS'
- target_column: fnd_cptl_amt
  transformation: at_iv_fn_hs.fnd_cptl_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn điều lệ quỹ (VNĐ)
- target_column: rpt_prd_code
  transformation: at_rp_im_va_hs.rpt_prd_code ORDER BY at_mb_pr_rp.day_rpt DESC LIMIT
    1
  data_type: string
  target_attr_name: ''
  description: Mã kỳ BC gần nhất
- target_column: fnd_nav_amt
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: NAV quỹ kỳ BC gần nhất từ RPTVALUES — pending O_FMS_1
- target_column: net_prft_amt
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: LN gốc từ RPTVALUES — pending O_FMS_1
- target_column: outst_unit_cnt
  transformation: SUM(at_iv_fn_ct_tf.tfr_qty) WHERE at_iv_fn_ct_tf.tfr_tp_code = 'MUA'
    AND at_iv_fn_ct_tf.ivsm_fnd_id = at_iv_fn_hs.ivsm_fnd_id - SUM(at_iv_fn_ct_tf.tfr_qty)
    WHERE at_iv_fn_ct_tf.tfr_tp_code = 'BAN' AND at_iv_fn_ct_tf.ivsm_fnd_id = at_iv_fn_hs.ivsm_fnd_id
  data_type: decimal(23,2)
  target_attr_name: ''
  description: KL CCQ lưu hành — reuse từ Investment Fund Certificate Transfer (O_FMS_7)
- target_column: src_stm_code
  transformation: at_iv_fn_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức FMS_FUNDS. Driving table:
    at_iv_fn_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
