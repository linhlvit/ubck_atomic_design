schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-fnd_mgt_co_prfl
  logical_name: Hồ sơ CTQLQ — latest state per CTQLQ. AUM/Vốn CSH/LN PENDING O_FMS_1,
    O_FMS_4
  physical_name: fnd_mgt_co_prfl
  dm_ref: DTM-fnd_mgt_co_prfl
  brd_ref: BRD-DTM-FMS
target:
  namespace: dtm
  physical_name: fnd_mgt_co_prfl
  etl_handle: SCD4A
  description: Hồ sơ CTQLQ — latest state per CTQLQ. AUM/Vốn CSH/LN PENDING O_FMS_1,
    O_FMS_4
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_fnd_mgt_co_hstr
  alias: at_fn_mg_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'FMS_SECURITIES'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_ivsm_fnd_hstr
  alias: at_iv_fn_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_dscr_ivsm_ivsr_hstr
  alias: at_ds_iv_iv_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_dscr_ivsm_ac_hstr
  alias: at_ds_iv_ac_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_rtg_hstr
  alias: at_mb_rt_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_rtg_prd_hstr
  alias: at_mb_rt_pr_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_rpt_impr_val_hstr
  alias: at_rp_im_va_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_mbr_prd_rpt
  alias: at_mb_pr_rp
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date}
  description: ''
relationship:
- main_alias: at_fn_mg_co_hs
  join_type: LEFT JOIN
  join_alias: at_iv_fn_hs
  join_on: at_iv_fn_hs.fnd_mgt_co_id = at_fn_mg_co_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_fn_mg_co_hs
  join_type: LEFT JOIN
  join_alias: at_ds_iv_iv_hs
  join_on: at_ds_iv_iv_hs.fnd_mgt_co_id = at_fn_mg_co_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_ds_iv_iv_hs
  join_type: LEFT JOIN
  join_alias: at_ds_iv_ac_hs
  join_on: at_ds_iv_ac_hs.dscr_ivsm_ivsr_id = at_ds_iv_iv_hs.dscr_ivsm_ivsr_id
  description: ''
- main_alias: at_fn_mg_co_hs
  join_type: LEFT JOIN
  join_alias: at_mb_rt_hs
  join_on: at_mb_rt_hs.fnd_mgt_co_id = at_fn_mg_co_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_mb_rt_hs
  join_type: INNER JOIN
  join_alias: at_mb_rt_pr_hs
  join_on: at_mb_rt_pr_hs.mbr_rtg_prd_id = at_mb_rt_hs.mbr_rtg_prd_id AND at_mb_rt_pr_hs.rtg_prd_end_dt
    <= '<ETL Date>'
  description: ''
- main_alias: at_fn_mg_co_hs
  join_type: LEFT JOIN
  join_alias: at_rp_im_va_hs
  join_on: at_rp_im_va_hs.fnd_mgt_co_id = at_fn_mg_co_hs.fnd_mgt_co_id
  description: ''
- main_alias: at_rp_im_va_hs
  join_type: INNER JOIN
  join_alias: at_mb_pr_rp
  join_on: at_mb_pr_rp.mbr_prd_rpt_id = at_rp_im_va_hs.mbr_prd_rpt_id AND at_mb_pr_rp.rpt_subm_st_code
    IN ('SUBMITTED','LATE')
  description: ''
mapping_columns:
- target_column: fnd_mgt_co_id
  transformation: at_fn_mg_co_hs.fnd_mgt_co_id
  data_type: string
  target_attr_name: ''
  description: Surrogate PK Atomic — FMS.SECURITIES
- target_column: co_code
  transformation: at_fn_mg_co_hs.fnd_mgt_co_code
  data_type: string
  target_attr_name: ''
  description: Mã CTQLQ (Business Key) — FMS.SECURITIES.Id
- target_column: co_shrt_nm
  transformation: at_fn_mg_co_hs.fnd_mgt_co_shrt_nm
  data_type: string
  target_attr_name: ''
  description: Tên viết tắt CTQLQ
- target_column: co_nm
  transformation: at_fn_mg_co_hs.fnd_mgt_co_nm
  data_type: string
  target_attr_name: ''
  description: Tên đầy đủ CTQLQ
- target_column: lcs_code
  transformation: at_fn_mg_co_hs.lcs_code
  data_type: string
  target_attr_name: ''
  description: 'Trạng thái hoạt động — scheme: LIFE_CYCLE_STATUS'
- target_column: charter_cptl_amt
  transformation: at_fn_mg_co_hs.charter_cptl_amt
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn điều lệ CTQLQ (VNĐ) ← FMS.SECURITIES.SecCapital
- target_column: ivsm_fnd_cnt
  transformation: COUNT(at_iv_fn_hs.ivsm_fnd_id)
  data_type: int
  target_attr_name: ''
  description: Số quỹ thuộc CTQLQ — LEFT JOIN ivsm_fnd qua fnd_mgt_co_id (1-N)
- target_column: dscr_ctr_cnt
  transformation: COUNT(at_ds_iv_ac_hs.dscr_ivsm_ac_id)
  data_type: int
  target_attr_name: ''
  description: 'Số HĐ UTDM thuộc CTQLQ — multi-hop: at_fn_mg_co_hs → dscr_ivsm_ivsr
    → dscr_ivsm_ac (1-N-N)'
- target_column: tot_aum_amt
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: AUM per CTQLQ từ RPTVALUES — pending O_FMS_1
- target_column: net_prft_amt
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Lợi nhuận per CTQLQ từ RPTVALUES BCTC — pending O_FMS_1 + O_FMS_4
- target_column: eqty_amt
  transformation: NULL  -- PENDING
  data_type: decimal(23,2)
  target_attr_name: ''
  description: Vốn CSH per CTQLQ từ RPTVALUES mã 400 — pending O_FMS_4
- target_column: rank_clss_code
  transformation: at_mb_rt_hs.rank_clss_code (ORDER BY at_mb_rt_pr_hs.rtg_prd_end_dt
    DESC LIMIT 1)
  data_type: string
  target_attr_name: ''
  description: Xếp loại CAMEL A/B/C — kỳ đánh giá gần nhất ≤ thời điểm ETL
- target_column: tot_scor
  transformation: at_mb_rt_hs.tot_scor (ORDER BY at_mb_rt_pr_hs.rtg_prd_end_dt DESC
    LIMIT 1)
  data_type: decimal(5,2)
  target_attr_name: ''
  description: Điểm CAMEL — kỳ đánh giá gần nhất ≤ thời điểm ETL
- target_column: rpt_prd_code
  transformation: at_rp_im_va_hs.rpt_prd_code ORDER BY at_mb_pr_rp.day_rpt DESC LIMIT
    1
  data_type: string
  target_attr_name: ''
  description: Mã kỳ BC dùng làm tham chiếu (từ RPTVALUES)
- target_column: rtg_prd_end_dt
  transformation: at_mb_rt_pr_hs.rtg_prd_end_dt (ORDER BY at_mb_rt_pr_hs.rtg_prd_end_dt
    DESC LIMIT 1)
  data_type: date
  target_attr_name: ''
  description: Ngày kết thúc kỳ xếp loại gần nhất — để user biết kỳ rating đang hiển
    thị
- target_column: src_stm_code
  transformation: at_fn_mg_co_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã nguồn dữ liệu — scheme: SOURCE_SYSTEM. Filter: WHERE src_stm_code
    = ''FMS_SECURITIES'''
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
