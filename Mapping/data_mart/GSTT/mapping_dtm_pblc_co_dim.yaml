schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-pblc_co_dim
  logical_name: Dimension ngành kinh tế cổ phiếu (10 ngành IDS cấp 1) — slicer Ngành.
    SCD Type 4A. Driving = pblc_co.
  physical_name: pblc_co_dim
  dm_ref: DTM-pblc_co_dim
  brd_ref: BRD-DTM-GSTT
target:
  namespace: dtm
  physical_name: pblc_co_dim
  etl_handle: SCD4A
  description: Dimension ngành kinh tế cổ phiếu (10 ngành IDS cấp 1) — slicer Ngành.
    SCD Type 4A. Driving = pblc_co.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_hstr
  alias: at_pb_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'IDS_company_profiles'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'IDS_INDUSTRY_CATEGORY'
  description: ''
relationship:
- main_alias: at_pb_co_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_pb_co_hs.idy_cgy_level1_code
  description: ''
mapping_columns:
- target_column: indy_dim_id
  transformation: hash_id('IDS_company_profiles', eqty_ticker)
  data_type: string
  target_attr_name: ''
  description: Surrogate key — ETL generated. Driving = at_pb_co_hs.
- target_column: eqty_ticker
  transformation: at_pb_co_hs.eqty_ticker
  data_type: string
  target_attr_name: ''
  description: Mã cổ phiếu niêm yết — join anchor ETL từ Fact qua Symbol. Chỉ load
    CTĐC có Equity Ticker.
- target_column: idy_cgy_level1_code
  transformation: at_pb_co_hs.idy_cgy_level1_code
  data_type: string
  target_attr_name: ''
  description: 'Mã ngành kinh tế cấp 1 (10 ngành IDS) — slicer Ngành. Scheme: IDS_INDUSTRY_CATEGORY.'
- target_column: idy_cgy_level1_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: Tên ngành kinh tế cấp 1 — hiển thị slicer Ngành.
- target_column: src_stm_code
  transformation: at_pb_co_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức IDS company_profiles (CTĐC
    có eqty_ticker) để đảm bảo forward-compatible khi Atomic bổ sung nguồn. Driving
    table: at_pb_co_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
