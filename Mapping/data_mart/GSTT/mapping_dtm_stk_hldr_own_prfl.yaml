schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-stk_hldr_own_prfl
  logical_name: Bảng Tác nghiệp — thông tin sở hữu và người nội bộ theo cổ đông /
    công ty đại chúng. Phục vụ STT 47 (Nhóm 28). Driving = stk_hldr.
  physical_name: stk_hldr_own_prfl
  dm_ref: DTM-stk_hldr_own_prfl
  brd_ref: BRD-DTM-GSTT
target:
  namespace: dtm
  physical_name: stk_hldr_own_prfl
  etl_handle: SCD4A
  description: Bảng Tác nghiệp — thông tin sở hữu và người nội bộ theo cổ đông / công
    ty đại chúng. Phục vụ STT 47 (Nhóm 28). Driving = stk_hldr.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_stk_hldr_hstr
  alias: at_st_hl_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1 AND src_stm_code = 'IDS_stock_holders'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_stk_cntl_hstr
  alias: at_st_cn_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
relationship:
- main_alias: at_st_hl_hs
  join_type: LEFT JOIN
  join_alias: at_st_cn_hs
  join_on: at_st_cn_hs.stk_hldr_id = at_st_hl_hs.stk_hldr_id
  description: ''
mapping_columns:
- target_column: stk_hldr_id
  transformation: at_st_hl_hs.stk_hldr_id
  data_type: string
  target_attr_name: ''
  description: Surrogate PK — lấy trực tiếp từ at_st_hl_hs.stk_hldr_id. Driving =
    at_st_hl_hs.
- target_column: stk_hldr_code
  transformation: at_st_hl_hs.stk_hldr_code
  data_type: string
  target_attr_name: ''
  description: Business key cổ đông — ETL debug anchor.
- target_column: pblc_co_id
  transformation: at_st_hl_hs.pblc_co_id
  data_type: string
  target_attr_name: ''
  description: FK đến công ty đại chúng — filter theo mã CK.
- target_column: pblc_co_code
  transformation: at_st_hl_hs.pblc_co_code
  data_type: string
  target_attr_name: ''
  description: Mã công ty đại chúng — slicer Mã CK.
- target_column: shrhlr_nm
  transformation: at_st_hl_hs.shrhlr_nm
  data_type: string
  target_attr_name: ''
  description: Tên cổ đông (cá nhân hoặc tổ chức) — K_GSTT_123.
- target_column: ent_tp_code
  transformation: at_st_hl_hs.ent_tp_code
  data_type: string
  target_attr_name: ''
  description: 'Loại hình cổ đông (cá nhân/tổ chức) — slicer Loại. Scheme: IDS_ENTITY_TYPE.'
- target_column: own_qty
  transformation: at_st_hl_hs.own_qty
  data_type: int
  target_attr_name: ''
  description: Số CP đang sở hữu — K_GSTT_124.
- target_column: own_rto
  transformation: at_st_hl_hs.own_rto
  data_type: decimal(5,2)
  target_attr_name: ''
  description: Tỷ lệ sở hữu (%) — K_GSTT_125.
- target_column: tradable_shr_qty
  transformation: at_st_hl_hs.tradable_shr_qty
  data_type: int
  target_attr_name: ''
  description: Số CP được phép giao dịch.
- target_column: frgn_hldr_f
  transformation: at_st_hl_hs.frgn_hldr_f
  data_type: boolean
  target_attr_name: ''
  description: Cờ cổ đông nước ngoài — K_GSTT_126.
- target_column: major_hldr_f
  transformation: at_st_hl_hs.major_hldr_f
  data_type: boolean
  target_attr_name: ''
  description: Cờ cổ đông lớn (≥5%) — K_GSTT_127.
- target_column: insider_hldr_f
  transformation: at_st_hl_hs.insider_hldr_f
  data_type: boolean
  target_attr_name: ''
  description: Cờ người nội bộ — filter sở hữu nội bộ STT 47.
- target_column: pos_codes
  transformation: at_st_hl_hs.pos_codes
  data_type: string
  target_attr_name: ''
  description: Danh sách mã chức vụ người nội bộ (delimited) — K_GSTT_128.
- target_column: rstd_shr_qty
  transformation: SUM(at_st_cn_hs.rstd_shr_qty)
  data_type: int
  target_attr_name: ''
  description: Số CP bị hạn chế chuyển nhượng — từ stk_cntl. LEFT JOIN vì 1 cổ đông
    có thể không có hạn chế.
- target_column: own_dt
  transformation: at_st_hl_hs.own_dt
  data_type: date
  target_attr_name: ''
  description: Ngày cập nhật tỷ lệ sở hữu.
- target_column: src_stm_code
  transformation: at_st_hl_hs.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức IDS stock_holders để đảm
    bảo forward-compatible khi Atomic bổ sung nguồn. Driving table: at_st_hl_hs.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
