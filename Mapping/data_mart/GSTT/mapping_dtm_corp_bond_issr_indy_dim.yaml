schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-DTM-corp_bond_issr_indy_dim
  logical_name: Dimension ngành kinh tế TPDN (10 ngành IDS cấp 1) — slicer Ngành TPDN.
    SCD Type 4A. Driving = corp_bond_tdg_snpst, join sang pblc_co qua bond_ticker.
  physical_name: corp_bond_issr_indy_dim
  dm_ref: DTM-corp_bond_issr_indy_dim
  brd_ref: BRD-DTM-GSTT
target:
  namespace: dtm
  physical_name: corp_bond_issr_indy_dim
  etl_handle: SCD4A
  description: Dimension ngành kinh tế TPDN (10 ngành IDS cấp 1) — slicer Ngành TPDN.
    SCD Type 4A. Driving = corp_bond_tdg_snpst, join sang pblc_co qua bond_ticker.
input:
- source_type: physical_table
  namespace: atm
  table_name: atm_corp_bond_tdg_snpst
  alias: at_co_bo_td_sn
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND src_stm_code = 'MDDS_CorpBondInfor'
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_pblc_co_hstr
  alias: at_pb_co_hs
  select_fields: '*'
  filter: ds_snpst_dt = {etl_date} AND ds_rcrd_st = 1
  description: ''
- source_type: physical_table
  namespace: atm
  table_name: atm_cv
  alias: at_cv
  select_fields: '*'
  filter: scm_code = 'IDS_INDUSTRY_CATEGORY'
  description: ''
relationship:
- main_alias: at_co_bo_td_sn
  join_type: LEFT JOIN
  join_alias: at_pb_co_hs
  join_on: at_pb_co_hs.bond_ticker = at_co_bo_td_sn.symb
  description: ''
- main_alias: at_pb_co_hs
  join_type: LEFT JOIN
  join_alias: at_cv
  join_on: at_cv.cl_code = at_pb_co_hs.idy_cgy_level1_code
  description: ''
mapping_columns:
- target_column: corp_bond_issr_indy_dim_id
  transformation: hash_id('MDDS_CorpBondInfor', bond_ticker)
  data_type: string
  target_attr_name: ''
  description: Surrogate key — ETL generated. Driving = at_co_bo_td_sn.
- target_column: bond_ticker
  transformation: at_co_bo_td_sn.symb
  data_type: string
  target_attr_name: ''
  description: Mã trái phiếu — join anchor ETL. Dùng join chain sang pblc_co để lấy
    ngành.
- target_column: idy_cgy_level1_code
  transformation: at_pb_co_hs.idy_cgy_level1_code
  data_type: string
  target_attr_name: ''
  description: 'Mã ngành TPDN cấp 1 — slicer Ngành cho Nhóm 2. Scheme: IDS_INDUSTRY_CATEGORY.
    Join: at_co_bo_td_sn.symb → pblc_co.bond_ticker.'
- target_column: idy_cgy_level1_nm
  transformation: at_cv.cl_nm
  data_type: string
  target_attr_name: ''
  description: 'Tên ngành TPDN cấp 1. Join: at_co_bo_td_sn.symb → pblc_co.bond_ticker
    → cv (scheme IDS_INDUSTRY_CATEGORY).'
- target_column: src_stm_code
  transformation: at_co_bo_td_sn.src_stm_code
  data_type: string
  target_attr_name: ''
  description: 'Mã hệ thống nguồn — filter nguồn chính thức MDDS CorpBondInfor để
    đảm bảo forward-compatible khi Atomic bổ sung nguồn. Driving table: at_co_bo_td_sn.'
final_filter: []
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
