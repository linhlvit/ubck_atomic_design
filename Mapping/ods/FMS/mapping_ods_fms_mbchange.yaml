  data_type: string
  description: Người tạo
  target_attr_name: null
- target_column: datecreated
  transformation: mb.datecreated
  data_type: date
  description: Ngày tạo
  target_attr_name: null
- target_column: datemodified
  transformation: mb.datemodified
