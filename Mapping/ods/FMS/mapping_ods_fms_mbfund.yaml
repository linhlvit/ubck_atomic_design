  select_fields: id, fndid, invesid, capital, ratio, deleted, datecreated, datemodified
  filter: ds_snpst_dt = to_date("etl_date", 'yyyy-MM-dd')
relationship: []
mapping_columns:
- target_column: id
  transformation: mb.id
