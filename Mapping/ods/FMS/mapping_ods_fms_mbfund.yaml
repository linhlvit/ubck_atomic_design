  description: Mã ID nhà đầu tư quỹ (PK)
  target_attr_name: null
- target_column: fndid
  transformation: mb.fndid
  data_type: string
  description: Mã ID quỹ đầu tư. FK → FUNDS.Id
  target_attr_name: null
- target_column: invesid
  transformation: mb.invesid
  data_type: string
