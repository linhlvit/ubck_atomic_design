schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.CERTIFICATE_RECORDS
  logical_name: Mapping ODS – source NHNCK.CERTIFICATE_RECORDS
  physical_name: certificate_records
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-CERTIFICATE_RECORDS
target:
  namespace: ods
  physical_name: certificate_records
  etl_handle: Fact Snapshot
  description: Chứng chỉ hành nghề được cấp
input:
- source_type: physical_table
  namespace: stg
  table_name: CERTIFICATE_RECORDS
  alias: ce_re
  select_fields: id, certificate_id, professional_id, issue_decision_id, revocation_decision_id,
    certificate_number, issue_date, revocation_date, revocation_reason, record_status,
    description, created_at, created_by, allow_reissue, professional_full_name, updated_at,
    process_status, cer_path, cancellation_decision_id, conversion_status, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ce_re.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: certificate_id
  transformation: ce_re.certificate_id
  data_type: int
  description: 'FK -> CERTIFICATES: Loại chứng chỉ hành nghề'
  target_attr_name: null
- target_column: professional_id
  transformation: ce_re.professional_id
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: issue_decision_id
  transformation: ce_re.issue_decision_id
  data_type: int
  description: 'FK -> DECISIONS: Quyết định cấp CCHN'
  target_attr_name: null
- target_column: revocation_decision_id
  transformation: ce_re.revocation_decision_id
  data_type: int
  description: 'FK -> DECISIONS: Quyết định thu hồi CCHN'
  target_attr_name: null
- target_column: certificate_number
  transformation: ce_re.certificate_number
  data_type: string
  description: Số CCHN cấp cho NHNCK
  target_attr_name: null
- target_column: issue_date
  transformation: ce_re.issue_date
  data_type: date
  description: Ngày cấp CCHN
  target_attr_name: null
- target_column: revocation_date
  transformation: ce_re.revocation_date
  data_type: date
  description: Ngày thu hồi CCHN
  target_attr_name: null
- target_column: revocation_reason
  transformation: ce_re.revocation_reason
  data_type: string
  description: Lý do thu hồi CCHN
  target_attr_name: null
- target_column: record_status
  transformation: ce_re.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: description
  transformation: ce_re.description
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: created_at
  transformation: ce_re.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: ce_re.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: allow_reissue
  transformation: ce_re.allow_reissue
  data_type: int
  description: Số lần được phép cấp lại CCHN (0=không được cấp lại)
  target_attr_name: null
- target_column: professional_full_name
  transformation: ce_re.professional_full_name
  data_type: string
  description: Họ tên người hành nghề tại thời điểm cấp CCHN (snapshot)
  target_attr_name: null
- target_column: updated_at
  transformation: ce_re.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: process_status
  transformation: ce_re.process_status
  data_type: int
  description: 'Trạng thái quy trình xử lý CCHN: 1=Đã cấp, 2=Đã ký nháy, 3=Đã ký,
    4=Đã trả'
  target_attr_name: null
- target_column: cer_path
  transformation: ce_re.cer_path
  data_type: string
  description: Đường dẫn file chứng chỉ số dùng để ký
  target_attr_name: null
- target_column: cancellation_decision_id
  transformation: ce_re.cancellation_decision_id
  data_type: int
  description: 'FK -> DECISIONS: Quyết định hủy bỏ CCHN'
  target_attr_name: null
- target_column: conversion_status
  transformation: ce_re.conversion_status
  data_type: int
  description: 'Trạng thái chuyển đổi CCHN điện tử: 1=Chứng chỉ giấy, 2=Chờ chuyển
    đổi điện tử, 3=Chứng chỉ số'
  target_attr_name: null
- target_column: updated_by
  transformation: ce_re.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
