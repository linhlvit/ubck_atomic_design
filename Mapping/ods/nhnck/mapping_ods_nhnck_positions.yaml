schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.POSITIONS
  logical_name: Mapping ODS – source NHNCK.POSITIONS
  physical_name: positions
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-POSITIONS
target:
  namespace: ods
  physical_name: positions
  etl_handle: Fact Snapshot
  description: Chức vụ trong tổ chức
input:
- source_type: physical_table
  namespace: stg
  table_name: POSITIONS
  alias: posi
  select_fields: id, position_name, description, created_at, created_by, updated_at,
    active, record_status, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: posi.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: position_name
  transformation: posi.position_name
  data_type: string
  description: Tên chức vụ tại thời điểm công tác (snapshot)
  target_attr_name: null
- target_column: description
  transformation: posi.description
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: created_at
  transformation: posi.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: posi.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: posi.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: active
  transformation: posi.active
  data_type: int
  description: 'Cờ đang kích hoạt/hiệu lực: 1=Đang dùng, 0=Vô hiệu'
  target_attr_name: null
- target_column: record_status
  transformation: posi.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: updated_by
  transformation: posi.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
