schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.APPLICATION_DOCUMENT_HISTORIES
  logical_name: Mapping ODS – source NHNCK.APPLICATION_DOCUMENT_HISTORIES
  physical_name: application_document_histories
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-APPLICATION_DOCUMENT_HISTORIES
target:
  namespace: ods
  physical_name: application_document_histories
  etl_handle: Fact Snapshot
  description: Lịch sử thẩm định từng tài liệu trong hồ sơ
input:
- source_type: physical_table
  namespace: stg
  table_name: APPLICATION_DOCUMENT_HISTORIES
  alias: ap_do_hi
  select_fields: id, application_id, document_id, invalid, incomplete, description,
    record_status, created_at, updated_by, updated_at, created_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ap_do_hi.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: ap_do_hi.application_id
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: document_id
  transformation: ap_do_hi.document_id
  data_type: int
  description: 'FK -> DOCUMENTS: Loại tài liệu yêu cầu'
  target_attr_name: null
- target_column: invalid
  transformation: ap_do_hi.invalid
  data_type: int
  description: 'Cờ tài liệu không hợp lệ (không đúng quy định): 1=Không hợp lệ, 0=Hợp
    lệ'
  target_attr_name: null
- target_column: incomplete
  transformation: ap_do_hi.incomplete
  data_type: int
  description: 'Cờ tài liệu không đầy đủ/thiếu thông tin: 1=Không đầy đủ, 0=Đầy đủ'
  target_attr_name: null
- target_column: description
  transformation: ap_do_hi.description
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: record_status
  transformation: ap_do_hi.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: created_at
  transformation: ap_do_hi.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ap_do_hi.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: updated_at
  transformation: ap_do_hi.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_by
  transformation: ap_do_hi.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
