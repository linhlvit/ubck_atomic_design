schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.APPLICATION_SUPPLEMENTS
  logical_name: Mapping ODS – source NHNCK.APPLICATION_SUPPLEMENTS
  physical_name: application_supplements
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-APPLICATION_SUPPLEMENTS
target:
  namespace: ods
  physical_name: application_supplements
  etl_handle: Fact Snapshot
  description: Thông tin bổ sung hồ sơ CCHN
input:
- source_type: physical_table
  namespace: stg
  table_name: APPLICATION_SUPPLEMENTS
  alias: ap_su
  select_fields: id, application_id, supplement_date, content, supplemented_by, created_at,
    updated_at, created_by, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ap_su.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: ap_su.application_id
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: supplement_date
  transformation: ap_su.supplement_date
  data_type: date
  description: Ngày nộp bổ sung hồ sơ
  target_attr_name: null
- target_column: content
  transformation: ap_su.content
  data_type: string
  description: Nội dung của thông báo/thư điện tử/bổ sung hồ sơ
  target_attr_name: null
- target_column: supplemented_by
  transformation: ap_su.supplemented_by
  data_type: int
  description: 'FK -> USERS/PROFESSIONALS: Người nộp bổ sung hồ sơ (cán bộ hoặc NHNCK)'
  target_attr_name: null
- target_column: created_at
  transformation: ap_su.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: ap_su.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_by
  transformation: ap_su.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ap_su.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
