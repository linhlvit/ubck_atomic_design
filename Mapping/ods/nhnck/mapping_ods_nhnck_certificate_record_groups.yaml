schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.CERTIFICATE_RECORD_GROUPS
  logical_name: Mapping ODS – source NHNCK.CERTIFICATE_RECORD_GROUPS
  physical_name: certificate_record_groups
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-CERTIFICATE_RECORD_GROUPS
target:
  namespace: ods
  physical_name: certificate_record_groups
  etl_handle: Fact Snapshot
  description: Nhóm chứng chỉ hành nghề
input:
- source_type: physical_table
  namespace: stg
  table_name: CERTIFICATE_RECORD_GROUPS
  alias: ce_re_gr
  select_fields: id, group_name, description, record_status, record_type, decision_id,
    group_created_date, group_completed_date, notes, certificate_record_count, created_at,
    created_by, updated_at, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ce_re_gr.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: group_name
  transformation: ce_re_gr.group_name
  data_type: string
  description: Tên nhóm hồ sơ/CCHN (do cán bộ đặt khi tạo nhóm xử lý)
  target_attr_name: null
- target_column: description
  transformation: ce_re_gr.description
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: record_status
  transformation: ce_re_gr.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: record_type
  transformation: ce_re_gr.record_type
  data_type: int
  description: Loại/phân loại của bản ghi
  target_attr_name: null
- target_column: decision_id
  transformation: ce_re_gr.decision_id
  data_type: int
  description: 'FK -> DECISIONS: Quyết định hành chính liên quan đến nhóm'
  target_attr_name: null
- target_column: group_created_date
  transformation: ce_re_gr.group_created_date
  data_type: date
  description: Ngày tạo nhóm hồ sơ/CCHN
  target_attr_name: null
- target_column: group_completed_date
  transformation: ce_re_gr.group_completed_date
  data_type: date
  description: Ngày hoàn thành xử lý nhóm hồ sơ/CCHN
  target_attr_name: null
- target_column: notes
  transformation: ce_re_gr.notes
  data_type: string
  description: Ghi chú bổ sung
  target_attr_name: null
- target_column: certificate_record_count
  transformation: ce_re_gr.certificate_record_count
  data_type: int
  description: Số lượng bản ghi CCHN trong nhóm
  target_attr_name: null
- target_column: created_at
  transformation: ce_re_gr.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: ce_re_gr.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: ce_re_gr.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: updated_by
  transformation: ce_re_gr.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
