schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.SPECIALIZATIONS
  logical_name: Mapping ODS – source NHNCK.SPECIALIZATIONS
  physical_name: specializations
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-SPECIALIZATIONS
target:
  namespace: ods
  physical_name: specializations
  etl_handle: Fact Snapshot
  description: Danh mục chuyên môn/chứng chỉ chuyên môn
input:
- source_type: physical_table
  namespace: stg
  table_name: SPECIALIZATIONS
  alias: spec
  select_fields: id, specialization_code, specialization_name, reference, created_at,
    created_by, updated_at, active, original_data, record_status, mcdt_code, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: spec.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: specialization_code
  transformation: spec.specialization_code
  data_type: string
  description: Mã chuyên ngành CCHN (mã định danh duy nhất)
  target_attr_name: null
- target_column: specialization_name
  transformation: spec.specialization_name
  data_type: string
  description: 'Tên chuyên ngành CCHN (VD: Phân tích đầu tư, Quản lý quỹ...)'
  target_attr_name: null
- target_column: reference
  transformation: spec.reference
  data_type: string
  description: Trích dẫn căn cứ pháp lý của quyết định
  target_attr_name: null
- target_column: created_at
  transformation: spec.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: spec.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: spec.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: active
  transformation: spec.active
  data_type: int
  description: 'Cờ đang kích hoạt/hiệu lực: 1=Đang dùng, 0=Vô hiệu'
  target_attr_name: null
- target_column: original_data
  transformation: spec.original_data
  data_type: int
  description: 'Cờ dữ liệu gốc của hệ thống (không được xóa): 1=Dữ liệu gốc, 0=Người
    dùng tạo'
  target_attr_name: null
- target_column: record_status
  transformation: spec.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: mcdt_code
  transformation: spec.mcdt_code
  data_type: string
  description: Mã chuyên ngành trên hệ thống Cổng DVC quốc gia (MCĐT)
  target_attr_name: null
- target_column: updated_by
  transformation: spec.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
