schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.EDUCATION_LEVELS
  logical_name: Mapping ODS – source NHNCK.EDUCATION_LEVELS
  physical_name: education_levels
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-EDUCATION_LEVELS
target:
  namespace: ods
  physical_name: education_levels
  etl_handle: Fact Snapshot
  description: Danh mục trình độ học vấn
input:
- source_type: physical_table
  namespace: stg
  table_name: EDUCATION_LEVELS
  alias: ed_le
  select_fields: id, level_name, description, displayed, original_data, record_status,
    updated_at, created_at, created_by, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ed_le.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: level_name
  transformation: ed_le.level_name
  data_type: string
  description: Tên trình độ học vấn (Trung cấp, Cao đẳng, Đại học, Thạc sĩ, Tiến sĩ...)
  target_attr_name: null
- target_column: description
  transformation: ed_le.description
  data_type: string
  description: Mô tả chi tiết
  target_attr_name: null
- target_column: displayed
  transformation: ed_le.displayed
  data_type: int
  description: 'Cờ hiển thị trên giao diện người dùng: 1=Hiển thị, 0=Ẩn'
  target_attr_name: null
- target_column: original_data
  transformation: ed_le.original_data
  data_type: int
  description: 'Cờ dữ liệu gốc của hệ thống (không được xóa): 1=Dữ liệu gốc, 0=Người
    dùng tạo'
  target_attr_name: null
- target_column: record_status
  transformation: ed_le.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: updated_at
  transformation: ed_le.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: created_at
  transformation: ed_le.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: ed_le.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: ed_le.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
