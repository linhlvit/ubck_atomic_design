schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.PROVINCES
  logical_name: Mapping ODS – source NHNCK.PROVINCES
  physical_name: provinces
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-PROVINCES
target:
  namespace: ods
  physical_name: provinces
  etl_handle: Fact Snapshot
  description: Danh mục tỉnh/thành phố
input:
- source_type: physical_table
  namespace: stg
  table_name: PROVINCES
  alias: prov
  select_fields: id, country_id, province_code, province_name, created_at, created_by,
    updated_at, record_status, record_type, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: prov.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: country_id
  transformation: prov.country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia liên quan'
  target_attr_name: null
- target_column: province_code
  transformation: prov.province_code
  data_type: string
  description: Mã tỉnh/thành phố theo chuẩn quốc gia
  target_attr_name: null
- target_column: province_name
  transformation: prov.province_name
  data_type: string
  description: Tên tỉnh/thành phố trực thuộc trung ương
  target_attr_name: null
- target_column: created_at
  transformation: prov.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: prov.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: prov.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: record_status
  transformation: prov.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: record_type
  transformation: prov.record_type
  data_type: int
  description: Loại/phân loại của bản ghi
  target_attr_name: null
- target_column: updated_by
  transformation: prov.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
