schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.APPLICATION_PROFESSIONALS
  logical_name: Mapping ODS – source NHNCK.APPLICATION_PROFESSIONALS
  physical_name: application_professionals
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-APPLICATION_PROFESSIONALS
target:
  namespace: ods
  physical_name: application_professionals
  etl_handle: Fact Snapshot
  description: Snapshot thông tin cá nhân người đăng ký tại thời điểm nộp hồ sơ
input:
- source_type: physical_table
  namespace: stg
  table_name: APPLICATION_PROFESSIONALS
  alias: ap_pr
  select_fields: id, application_id, professional_id, organization_id, nationality_id,
    education_level_id, registration_type, username, password, full_name, first_name,
    avatar, birth_date, birth_year, gender, permanent_country_id, permanent_province_id,
    permanent_district_id, permanent_address, current_country_id, current_province_id,
    current_district_id, place_of_birth, address, identity_number, identity_issue_date,
    identity_issue_place, phone_number, mobile_number, email, workplace, created_at,
    created_by, updated_at, updated_by, record_status, identity_type, position, department,
    previous_identity_number
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ap_pr.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: application_id
  transformation: ap_pr.application_id
  data_type: int
  description: 'FK -> APPLICATIONS: Hồ sơ CCHN liên quan'
  target_attr_name: null
- target_column: professional_id
  transformation: ap_pr.professional_id
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: organization_id
  transformation: ap_pr.organization_id
  data_type: int
  description: 'FK -> ORGANIZATIONS: Tổ chức kinh doanh CK sử dụng NHNCK'
  target_attr_name: null
- target_column: nationality_id
  transformation: ap_pr.nationality_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc tịch của người hành nghề'
  target_attr_name: null
- target_column: education_level_id
  transformation: ap_pr.education_level_id
  data_type: int
  description: 'FK -> EDUCATION_LEVELS: Trình độ học vấn'
  target_attr_name: null
- target_column: registration_type
  transformation: ap_pr.registration_type
  data_type: int
  description: 'Nguồn tiếp nhận hồ sơ: 0=MCĐT/cổng DVC, 1=Nhập tay (MANUAL)'
  target_attr_name: null
- target_column: username
  transformation: ap_pr.username
  data_type: string
  description: Tên đăng nhập vào hệ thống
  target_attr_name: null
- target_column: password
  transformation: ap_pr.password
  data_type: string
  description: Mật khẩu đã mã hóa (bcrypt hash)
  target_attr_name: null
- target_column: full_name
  transformation: ap_pr.full_name
  data_type: string
  description: Họ và tên đầy đủ của người hành nghề
  target_attr_name: null
- target_column: first_name
  transformation: ap_pr.first_name
  data_type: string
  description: Tên đệm và tên riêng (tên gọi) của người hành nghề
  target_attr_name: null
- target_column: avatar
  transformation: ap_pr.avatar
  data_type: string
  description: Đường dẫn/URL ảnh đại diện của người hành nghề
  target_attr_name: null
- target_column: birth_date
  transformation: ap_pr.birth_date
  data_type: date
  description: Ngày sinh (trong bản ghi vi phạm, snapshot tại thời điểm ghi)
  target_attr_name: null
- target_column: birth_year
  transformation: ap_pr.birth_year
  data_type: string
  description: Năm sinh (lưu dạng chuỗi, dùng khi chỉ biết năm không có ngày tháng)
  target_attr_name: null
- target_column: gender
  transformation: ap_pr.gender
  data_type: int
  description: 'Giới tính: 0=Nam, 1=Nữ'
  target_attr_name: null
- target_column: permanent_country_id
  transformation: ap_pr.permanent_country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_province_id
  transformation: ap_pr.permanent_province_id
  data_type: int
  description: 'FK -> PROVINCES: Tỉnh/thành phố địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_district_id
  transformation: ap_pr.permanent_district_id
  data_type: int
  description: 'FK -> DISTRICTS: Quận/huyện địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_address
  transformation: ap_pr.permanent_address
  data_type: string
  description: Địa chỉ cụ thể theo thường trú (số nhà, đường, phường/xã...)
  target_attr_name: null
- target_column: current_country_id
  transformation: ap_pr.current_country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia địa chỉ tạm trú hiện tại'
  target_attr_name: null
- target_column: current_province_id
  transformation: ap_pr.current_province_id
  data_type: int
  description: 'FK -> PROVINCES: Tỉnh/thành phố địa chỉ tạm trú'
  target_attr_name: null
- target_column: current_district_id
  transformation: ap_pr.current_district_id
  data_type: int
  description: 'FK -> DISTRICTS: Quận/huyện địa chỉ tạm trú'
  target_attr_name: null
- target_column: place_of_birth
  transformation: ap_pr.place_of_birth
  data_type: string
  description: Nơi sinh của người hành nghề
  target_attr_name: null
- target_column: address
  transformation: ap_pr.address
  data_type: string
  description: Địa chỉ trụ sở tổ chức (NCLOB)
  target_attr_name: null
- target_column: identity_number
  transformation: ap_pr.identity_number
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu của người hành nghề
  target_attr_name: null
- target_column: identity_issue_date
  transformation: ap_pr.identity_issue_date
  data_type: date
  description: Ngày cấp CMND/CCCD/Hộ chiếu
  target_attr_name: null
- target_column: identity_issue_place
  transformation: ap_pr.identity_issue_place
  data_type: string
  description: Nơi cấp CMND/CCCD/Hộ chiếu
  target_attr_name: null
- target_column: phone_number
  transformation: ap_pr.phone_number
  data_type: string
  description: Số điện thoại cố định
  target_attr_name: null
- target_column: mobile_number
  transformation: ap_pr.mobile_number
  data_type: string
  description: Số điện thoại di động
  target_attr_name: null
- target_column: email
  transformation: ap_pr.email
  data_type: string
  description: Địa chỉ email liên lạc
  target_attr_name: null
- target_column: workplace
  transformation: ap_pr.workplace
  data_type: string
  description: Nơi làm việc hiện tại (tên tổ chức kinh doanh CK)
  target_attr_name: null
- target_column: created_at
  transformation: ap_pr.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: ap_pr.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: ap_pr.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: updated_by
  transformation: ap_pr.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: record_status
  transformation: ap_pr.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: identity_type
  transformation: ap_pr.identity_type
  data_type: int
  description: 'Loại giấy tờ định danh: 1=CMND, 2=CCCD, 3=Hộ chiếu'
  target_attr_name: null
- target_column: position
  transformation: ap_pr.position
  data_type: string
  description: Chức vụ/vị trí đảm nhiệm
  target_attr_name: null
- target_column: department
  transformation: ap_pr.department
  data_type: string
  description: Phòng ban công tác
  target_attr_name: null
- target_column: previous_identity_number
  transformation: ap_pr.previous_identity_number
  data_type: string
  description: Số CMND cũ (trước khi đổi sang CCCD)
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
