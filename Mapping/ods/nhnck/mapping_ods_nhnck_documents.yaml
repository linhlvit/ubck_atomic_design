schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.DOCUMENTS
  logical_name: Mapping ODS – source NHNCK.DOCUMENTS
  physical_name: documents
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-DOCUMENTS
target:
  namespace: ods
  physical_name: documents
  etl_handle: Fact Snapshot
  description: Danh mục tài liệu liên quan đến hồ sơ hoặc chứng chỉ
input:
- source_type: physical_table
  namespace: stg
  table_name: DOCUMENTS
  alias: docu
  select_fields: id, document_code, document_name, reference, created_at, created_by,
    updated_at, active, original_data, sort_order, record_status, mcdt_code, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: docu.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: document_code
  transformation: docu.document_code
  data_type: string
  description: Mã tài liệu (mã định danh duy nhất trong danh mục)
  target_attr_name: null
- target_column: document_name
  transformation: docu.document_name
  data_type: string
  description: Tên tài liệu (snapshot tại thời điểm nộp hồ sơ)
  target_attr_name: null
- target_column: reference
  transformation: docu.reference
  data_type: string
  description: Trích dẫn căn cứ pháp lý của quyết định
  target_attr_name: null
- target_column: created_at
  transformation: docu.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: docu.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: docu.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: active
  transformation: docu.active
  data_type: int
  description: 'Cờ đang kích hoạt/hiệu lực: 1=Đang dùng, 0=Vô hiệu'
  target_attr_name: null
- target_column: original_data
  transformation: docu.original_data
  data_type: int
  description: 'Cờ dữ liệu gốc của hệ thống (không được xóa): 1=Dữ liệu gốc, 0=Người
    dùng tạo'
  target_attr_name: null
- target_column: sort_order
  transformation: docu.sort_order
  data_type: int
  description: Thứ tự sắp xếp hiển thị (số nhỏ hơn hiển thị trước)
  target_attr_name: null
- target_column: record_status
  transformation: docu.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: mcdt_code
  transformation: docu.mcdt_code
  data_type: string
  description: Mã chuyên ngành trên hệ thống Cổng DVC quốc gia (MCĐT)
  target_attr_name: null
- target_column: updated_by
  transformation: docu.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
