  description: Chi tiết người tham gia khóa học chuyên môn
input:
- source_type: physical_table
  namespace: stg
  table_name: SPECIALIZATION_COURSE_DETAILS
  alias: sp_co_de
  select_fields: id, specialization_course_id, professional_id, exam_number, full_name,
    birth_date, permanent_country_id, permanent_province_id, permanent_district_id,
    place_of_birth, identity_type, identity_number, identity_issue_date, identity_issue_place,
    created_at, created_by, updated_at, updated_by, description, exam_score, result,
    record_status, note, specialization_id, assignee_id
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: sp_co_de.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: specialization_course_id
  transformation: sp_co_de.specialization_course_id
  data_type: int
  description: 'FK -> SPECIALIZATION_COURSES: Lớp học chứng chỉ chuyên môn'
  target_attr_name: null
- target_column: professional_id
  transformation: sp_co_de.professional_id
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: exam_number
  transformation: sp_co_de.exam_number
  data_type: string
  description: Số báo danh thi sát hạch
  target_attr_name: null
- target_column: full_name
  transformation: sp_co_de.full_name
  data_type: string
  description: Họ và tên đầy đủ của người hành nghề
  target_attr_name: null
- target_column: birth_date
  transformation: sp_co_de.birth_date
  data_type: date
  description: Ngày sinh (trong bản ghi vi phạm, snapshot tại thời điểm ghi)
  target_attr_name: null
- target_column: permanent_country_id
  transformation: sp_co_de.permanent_country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_province_id
  transformation: sp_co_de.permanent_province_id
  data_type: int
