schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.SPECIALIZATION_COURSE_DETAILS
  logical_name: Mapping ODS – source NHNCK.SPECIALIZATION_COURSE_DETAILS
  physical_name: specialization_course_details
