schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.CERTIFICATE_RECORD_LOGS
  logical_name: Mapping ODS – source NHNCK.CERTIFICATE_RECORD_LOGS
  physical_name: certificate_record_logs
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-CERTIFICATE_RECORD_LOGS
target:
  namespace: ods
  physical_name: certificate_record_logs
  etl_handle: Fact Snapshot
  description: Nhật ký chứng chỉ hành nghề
input:
- source_type: physical_table
  namespace: stg
  table_name: CERTIFICATE_RECORD_LOGS
  alias: ce_re_lo
  select_fields: id, certificate_record_id, action_type, certificate_number, issue_decision_id,
    issue_date, created_by, created_at, updated_at, note, updated_by
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: ce_re_lo.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: certificate_record_id
  transformation: ce_re_lo.certificate_record_id
  data_type: int
  description: 'FK -> CERTIFICATE_RECORDS: Bản ghi CCHN trong sổ đăng bộ'
  target_attr_name: null
- target_column: action_type
  transformation: ce_re_lo.action_type
  data_type: string
  description: Loại hành động kích hoạt thông báo (mã sự kiện nghiệp vụ)
  target_attr_name: null
- target_column: certificate_number
  transformation: ce_re_lo.certificate_number
  data_type: string
  description: Số CCHN cấp cho NHNCK
  target_attr_name: null
- target_column: issue_decision_id
  transformation: ce_re_lo.issue_decision_id
  data_type: int
  description: 'FK -> DECISIONS: Quyết định cấp CCHN'
  target_attr_name: null
- target_column: issue_date
  transformation: ce_re_lo.issue_date
  data_type: date
  description: Ngày cấp CCHN
  target_attr_name: null
- target_column: created_by
  transformation: ce_re_lo.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: created_at
  transformation: ce_re_lo.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: ce_re_lo.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: note
  transformation: ce_re_lo.note
  data_type: string
  description: Ghi chú bổ sung
  target_attr_name: null
- target_column: updated_by
  transformation: ce_re_lo.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
