schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ODS-NHNCK.PROFESSIONAL_HISTORIES
  logical_name: Mapping ODS – source NHNCK.PROFESSIONAL_HISTORIES
  physical_name: professional_histories
  dm_ref: null
  brd_ref: BRD-SRC-NHNCK-PROFESSIONAL_HISTORIES
target:
  namespace: ods
  physical_name: professional_histories
  etl_handle: Fact Snapshot
  description: Lịch sử thay đổi định danh cá nhân của người hành nghề
input:
- source_type: physical_table
  namespace: stg
  table_name: PROFESSIONAL_HISTORIES
  alias: pr_hi
  select_fields: id, organization_id, nationality_id, education_level_id, registration_type,
    username, password, full_name, first_name, avatar, birth_date, birth_year, gender,
    permanent_country_id, permanent_province_id, permanent_district_id, permanent_address,
    current_country_id, current_province_id, current_district_id, place_of_birth,
    address, identity_number, identity_issue_date, identity_issue_place, phone_number,
    mobile_number, email, workplace, created_at, created_by, updated_at, updated_by,
    record_status, identity_type, position, department, previous_identity_number,
    professional_id, change_date, national, religion, hometown, status_work, reason_update,
    status_account
  filter: ds_snpst_dt = {etl_date}
relationship: []
mapping_columns:
- target_column: id
  transformation: pr_hi.id
  data_type: int
  description: Khóa chính của bản ghi (số tự tăng)
  target_attr_name: null
- target_column: organization_id
  transformation: pr_hi.organization_id
  data_type: int
  description: 'FK -> ORGANIZATIONS: Tổ chức kinh doanh CK sử dụng NHNCK'
  target_attr_name: null
- target_column: nationality_id
  transformation: pr_hi.nationality_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc tịch của người hành nghề'
  target_attr_name: null
- target_column: education_level_id
  transformation: pr_hi.education_level_id
  data_type: int
  description: 'FK -> EDUCATION_LEVELS: Trình độ học vấn'
  target_attr_name: null
- target_column: registration_type
  transformation: pr_hi.registration_type
  data_type: int
  description: 'Nguồn tiếp nhận hồ sơ: 0=MCĐT/cổng DVC, 1=Nhập tay (MANUAL)'
  target_attr_name: null
- target_column: username
  transformation: pr_hi.username
  data_type: string
  description: Tên đăng nhập vào hệ thống
  target_attr_name: null
- target_column: password
  transformation: pr_hi.password
  data_type: string
  description: Mật khẩu đã mã hóa (bcrypt hash)
  target_attr_name: null
- target_column: full_name
  transformation: pr_hi.full_name
  data_type: string
  description: Họ và tên đầy đủ của người hành nghề
  target_attr_name: null
- target_column: first_name
  transformation: pr_hi.first_name
  data_type: string
  description: Tên đệm và tên riêng (tên gọi) của người hành nghề
  target_attr_name: null
- target_column: avatar
  transformation: pr_hi.avatar
  data_type: string
  description: Đường dẫn/URL ảnh đại diện của người hành nghề
  target_attr_name: null
- target_column: birth_date
  transformation: pr_hi.birth_date
  data_type: date
  description: Ngày sinh (trong bản ghi vi phạm, snapshot tại thời điểm ghi)
  target_attr_name: null
- target_column: birth_year
  transformation: pr_hi.birth_year
  data_type: string
  description: Năm sinh (lưu dạng chuỗi, dùng khi chỉ biết năm không có ngày tháng)
  target_attr_name: null
- target_column: gender
  transformation: pr_hi.gender
  data_type: int
  description: 'Giới tính: 0=Nam, 1=Nữ'
  target_attr_name: null
- target_column: permanent_country_id
  transformation: pr_hi.permanent_country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_province_id
  transformation: pr_hi.permanent_province_id
  data_type: int
  description: 'FK -> PROVINCES: Tỉnh/thành phố địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_district_id
  transformation: pr_hi.permanent_district_id
  data_type: int
  description: 'FK -> DISTRICTS: Quận/huyện địa chỉ thường trú'
  target_attr_name: null
- target_column: permanent_address
  transformation: pr_hi.permanent_address
  data_type: string
  description: Địa chỉ cụ thể theo thường trú (số nhà, đường, phường/xã...)
  target_attr_name: null
- target_column: current_country_id
  transformation: pr_hi.current_country_id
  data_type: int
  description: 'FK -> COUNTRIES: Quốc gia địa chỉ tạm trú hiện tại'
  target_attr_name: null
- target_column: current_province_id
  transformation: pr_hi.current_province_id
  data_type: int
  description: 'FK -> PROVINCES: Tỉnh/thành phố địa chỉ tạm trú'
  target_attr_name: null
- target_column: current_district_id
  transformation: pr_hi.current_district_id
  data_type: int
  description: 'FK -> DISTRICTS: Quận/huyện địa chỉ tạm trú'
  target_attr_name: null
- target_column: place_of_birth
  transformation: pr_hi.place_of_birth
  data_type: string
  description: Nơi sinh của người hành nghề
  target_attr_name: null
- target_column: address
  transformation: pr_hi.address
  data_type: string
  description: Địa chỉ trụ sở tổ chức (NCLOB)
  target_attr_name: null
- target_column: identity_number
  transformation: pr_hi.identity_number
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu của người hành nghề
  target_attr_name: null
- target_column: identity_issue_date
  transformation: pr_hi.identity_issue_date
  data_type: date
  description: Ngày cấp CMND/CCCD/Hộ chiếu
  target_attr_name: null
- target_column: identity_issue_place
  transformation: pr_hi.identity_issue_place
  data_type: string
  description: Nơi cấp CMND/CCCD/Hộ chiếu
  target_attr_name: null
- target_column: phone_number
  transformation: pr_hi.phone_number
  data_type: string
  description: Số điện thoại cố định
  target_attr_name: null
- target_column: mobile_number
  transformation: pr_hi.mobile_number
  data_type: string
  description: Số điện thoại di động
  target_attr_name: null
- target_column: email
  transformation: pr_hi.email
  data_type: string
  description: Địa chỉ email liên lạc
  target_attr_name: null
- target_column: workplace
  transformation: pr_hi.workplace
  data_type: string
  description: Nơi làm việc hiện tại (tên tổ chức kinh doanh CK)
  target_attr_name: null
- target_column: created_at
  transformation: pr_hi.created_at
  data_type: date
  description: Thời điểm tạo bản ghi
  target_attr_name: null
- target_column: created_by
  transformation: pr_hi.created_by
  data_type: int
  description: ID tài khoản người tạo bản ghi
  target_attr_name: null
- target_column: updated_at
  transformation: pr_hi.updated_at
  data_type: date
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: updated_by
  transformation: pr_hi.updated_by
  data_type: int
  description: ID tài khoản người cập nhật bản ghi lần cuối
  target_attr_name: null
- target_column: record_status
  transformation: pr_hi.record_status
  data_type: int
  description: 'Trạng thái bản ghi: 1=Đang hoạt động/Hiệu lực, 0=Không hoạt động'
  target_attr_name: null
- target_column: identity_type
  transformation: pr_hi.identity_type
  data_type: int
  description: 'Loại giấy tờ định danh: 1=CMND, 2=CCCD, 3=Hộ chiếu'
  target_attr_name: null
- target_column: position
  transformation: pr_hi.position
  data_type: string
  description: Chức vụ/vị trí đảm nhiệm
  target_attr_name: null
- target_column: department
  transformation: pr_hi.department
  data_type: string
  description: Phòng ban công tác
  target_attr_name: null
- target_column: previous_identity_number
  transformation: pr_hi.previous_identity_number
  data_type: string
  description: Số CMND cũ (trước khi đổi sang CCCD)
  target_attr_name: null
- target_column: professional_id
  transformation: pr_hi.professional_id
  data_type: int
  description: 'FK -> PROFESSIONALS: Người hành nghề liên quan'
  target_attr_name: null
- target_column: change_date
  transformation: pr_hi.change_date
  data_type: date
  description: Ngày ghi nhận thay đổi thông tin
  target_attr_name: null
- target_column: national
  transformation: pr_hi.national
  data_type: string
  description: Dân tộc (theo dữ liệu C06 CSDL quốc gia về dân cư)
  target_attr_name: null
- target_column: religion
  transformation: pr_hi.religion
  data_type: string
  description: Tôn giáo (theo dữ liệu C06 CSDL quốc gia về dân cư)
  target_attr_name: null
- target_column: hometown
  transformation: pr_hi.hometown
  data_type: string
  description: Quê quán theo C06 CSDL quốc gia về dân cư
  target_attr_name: null
- target_column: status_work
  transformation: pr_hi.status_work
  data_type: int
  description: 'Trạng thái hành nghề: 0=Chưa hành nghề, 1=Đang hành nghề, 2=Thu hồi
    có cấp lại, 3=Thu hồi không cấp lại, 4=Cấp hành nghề có thời hạn'
  target_attr_name: null
- target_column: reason_update
  transformation: pr_hi.reason_update
  data_type: string
  description: Lý do cập nhật thông tin người hành nghề
  target_attr_name: null
- target_column: status_account
  transformation: pr_hi.status_account
  data_type: int
  description: 'Trạng thái tài khoản người hành nghề: 0=Chưa kích hoạt, 1=Đang hoạt
    động, 2=Khóa'
  target_attr_name: null
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
