schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-scr_prac_license_ap_ed_ctf_doc-NHNCK.APPLICATION_SPECIALIZATIONS
  logical_name: Mapping Atomic - Securities Practitioner License Application Education
    Certificate Document – source NHNCK.APPLICATION_SPECIALIZATIONS
  physical_name: scr_prac_license_ap_ed_ctf_doc
  dm_ref: ATM-scr_prac_license_ap_ed_ctf_doc-NHNCK.APPLICATION_SPECIALIZATIONS
  brd_ref: BRD-SRC-NHNCK-APPLICATION_SPECIALIZATIONS
target:
  namespace: atm
  physical_name: scr_prac_license_ap_ed_ctf_doc
  etl_handle: SCD4A
  description: Chứng chỉ hoặc bằng chuyên môn đào tạo đính kèm trong hồ sơ đăng ký
    CCHN. Ghi nhận loại chuyên môn, file đính kèm, trạng thái thẩm định và cán bộ
    thẩm định.
input:
- source_type: physical_table
  namespace: ods
  table_name: APPLICATION_SPECIALIZATIONS
  alias: ap_sp
  select_fields: ID, APPLICATION_ID, SPECIALIZATION_ID, ISSUE_DATE, ISSUE_PLACE, RECORD_STATUS,
    APPRAISALED_AT, ASSIGNEE_ID, FILES, NOTE
  filter: null
relationship: []
mapping_columns:
- target_column: scr_prac_license_ap_ed_ctf_doc_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_SPECIALIZATIONS'', ap_sp.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Securities Practitioner License Application Education Certificate
    Document Id
- target_column: scr_prac_license_ap_ed_ctf_doc_code
  transformation: ap_sp.ID
  data_type: string
  description: Mã định danh bản ghi chuyên môn. BK
  target_attr_name: Securities Practitioner License Application Education Certificate
    Document Code
- target_column: license_ap_id
  transformation: '{hash_id}(''NHNCK_APPLICATIONS'', ap_sp.APPLICATION_ID)'
  data_type: string
  description: FK đến License Application (hồ sơ đăng ký)
  target_attr_name: License Application Id
- target_column: license_ap_code
  transformation: ap_sp.APPLICATION_ID
  data_type: string
  description: Mã hồ sơ đăng ký. Lookup pair
  target_attr_name: License Application Code
- target_column: specialization_tp_code
  transformation: ap_sp.SPECIALIZATION_ID
  data_type: string
  description: Mã loại chuyên môn (Classification Value)
  target_attr_name: Specialization Type Code
- target_column: ctf_issu_dt
  transformation: ap_sp.ISSUE_DATE
  data_type: date
  description: Ngày cấp chứng chỉ chuyên môn
  target_attr_name: Certificate Issue Date
- target_column: ctf_issu_plc
  transformation: ap_sp.ISSUE_PLACE
  data_type: string
  description: Nơi cấp chứng chỉ chuyên môn
  target_attr_name: Certificate Issue Place
- target_column: rcrd_st_code
  transformation: ap_sp.RECORD_STATUS
  data_type: string
  description: Trạng thái thẩm định chứng chỉ (Classification Value)
  target_attr_name: Record Status Code
- target_column: aprs_completed_dt
  transformation: ap_sp.APPRAISALED_AT
  data_type: timestamp
  description: Thời điểm thẩm định hoàn tất
  target_attr_name: Appraisal Completed Date
- target_column: appraised_by_ofcr_id
  transformation: '{hash_id}(''NHNCK_USERS'', ap_sp.ASSIGNEE_ID)'
  data_type: string
  description: FK đến cán bộ thẩm định (Regulatory Authority Officer)
  target_attr_name: Appraised By Officer Id
- target_column: appraised_by_ofcr_code
  transformation: ap_sp.ASSIGNEE_ID
  data_type: string
  description: Mã cán bộ thẩm định. Lookup pair
  target_attr_name: Appraised By Officer Code
- target_column: attch_files
  transformation: ap_sp.FILES
  data_type: string
  description: Danh sách file đính kèm (JSON CLOB)
  target_attr_name: Attachment Files
- target_column: note
  transformation: ap_sp.NOTE
  data_type: string
  description: Ghi chú bổ sung
  target_attr_name: Note
- target_column: src_stm_code
  transformation: '''NHNCK_APPLICATION_SPECIALIZATIONS'''
  data_type: string
  description: Mã hệ thống nguồn (ETL-derived)
  target_attr_name: Source System Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
