- target_column: hire_dt
  transformation: or_re.HIRE_DATE
  data_type: date
  description: Ngày tuyển dụng vào tổ chức.
  target_attr_name: Hire Date
- target_column: tmt_dt
  transformation: or_re.TERMINATION_DATE
  data_type: date
  description: Ngày chấm dứt hợp đồng lao động (NULL = đang làm việc).
  target_attr_name: Termination Date
- target_column: rpt_dt
  transformation: or_re.REPORT_DATE
  data_type: date
  description: Ngày lập báo cáo.
  target_attr_name: Report Date
- target_column: disciplines
  transformation: or_re.DISCIPLINES
  data_type: string
  description: Kỷ luật của người hành nghề tại tổ chức.
  target_attr_name: Disciplines
- target_column: dsc
  transformation: or_re.DESCRIPTION
  data_type: string
  description: Mô tả bổ sung cho báo cáo.
  target_attr_name: Description
- target_column: notes
  transformation: or_re.NOTES
  data_type: string
  description: Ghi chú nội bộ.
  target_attr_name: Notes
- target_column: bsn_dept_nm
  transformation: or_re.BUSINESS_DEPARTMENT
  data_type: string
