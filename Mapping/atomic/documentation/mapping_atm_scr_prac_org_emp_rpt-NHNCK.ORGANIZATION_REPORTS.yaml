  target_attr_name: Practitioner Birth Date At Report
- target_column: prac_id_nbr_at_rpt
  transformation: or_re.IDENTITY_NUMBER
  data_type: string
  description: Số định danh cá nhân tại thời điểm lập báo cáo (snapshot).
  target_attr_name: Practitioner Identity Number At Report
- target_column: prac_pos_at_rpt
  transformation: or_re.POSITION
  data_type: string
  description: Chức vụ của người hành nghề tại tổ chức (snapshot).
  target_attr_name: Practitioner Position At Report
- target_column: prac_dept_at_rpt
  transformation: or_re.DEPARTMENT
  data_type: string
  description: Phòng ban của người hành nghề tại tổ chức (snapshot).
  target_attr_name: Practitioner Department At Report
- target_column: prac_workplace_at_rpt
  transformation: or_re.WORKPLACE
  data_type: string
  description: Nơi làm việc của người hành nghề tại thời điểm báo cáo (snapshot).
  target_attr_name: Practitioner Workplace At Report
- target_column: ctf_nbr_at_rpt
  transformation: or_re.CERTIFICATE_NUMBER
  data_type: string
  description: Số chứng chỉ hành nghề tại thời điểm lập báo cáo (snapshot).
  target_attr_name: Certificate Number At Report
- target_column: ctf_issu_dt_at_rpt
  transformation: or_re.ISSUE_DATE
  data_type: date
  description: Ngày cấp chứng chỉ hành nghề tại thời điểm lập báo cáo (snapshot).
