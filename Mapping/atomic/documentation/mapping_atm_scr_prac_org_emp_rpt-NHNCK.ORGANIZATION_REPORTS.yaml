schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-scr_prac_org_emp_rpt-NHNCK.ORGANIZATION_REPORTS
  logical_name: Mapping Atomic - Securities Practitioner Organization Employment Report
    – source NHNCK.ORGANIZATION_REPORTS
  physical_name: scr_prac_org_emp_rpt
  dm_ref: ATM-scr_prac_org_emp_rpt-NHNCK.ORGANIZATION_REPORTS
  brd_ref: BRD-SRC-NHNCK-ORGANIZATION_REPORTS
target:
  namespace: atm
  physical_name: scr_prac_org_emp_rpt
  etl_handle: Fact Append
  description: Báo cáo của tổ chức về tình trạng làm việc của người hành nghề. Mỗi
    dòng = 1 lần nộp báo cáo insert-only. Ghi nhận loại báo cáo, trạng thái làm việc,
    chức vụ và ngày báo cáo.
input:
- source_type: physical_table
  namespace: ods
  table_name: ORGANIZATION_REPORTS
  alias: or_re
  select_fields: ID, ORGANIZATION_ID, PROFESSIONAL_ID, CERTIFICATE_RECORD_ID, CERTIFICATE_ID,
    PARENT_REPORT_ID, FULL_NAME, BIRTH_DATE, IDENTITY_NUMBER, POSITION, DEPARTMENT,
    WORKPLACE, CERTIFICATE_NUMBER, ISSUE_DATE, HIRE_DATE, TERMINATION_DATE, REPORT_DATE,
    DISCIPLINES, DESCRIPTION, NOTES, BUSINESS_DEPARTMENT, FILE_PATH, FILE_PATH_TERMINATION,
    SYNC_ID, RECORD_TYPE, STATUS_ORGANIZATION, RECORD_STATUS, SYNC_CREATED_AT, SYNC_UPDATED_AT,
    CREATED_AT, CREATED_BY, UPDATED_AT, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: scr_prac_org_emp_rpt_id
  transformation: '{hash_id}(''NHNCK_ORGANIZATION_REPORTS'', or_re.ID)'
  data_type: string
  description: Khóa đại diện cho báo cáo danh sách NHNCK tại tổ chức (surrogate key).
  target_attr_name: Securities Practitioner Organization Employment Report Id
- target_column: scr_prac_org_emp_rpt_code
  transformation: or_re.ID
  data_type: string
  description: Mã định danh kỹ thuật (BK). Map từ PK bảng nguồn.
  target_attr_name: Securities Practitioner Organization Employment Report Code
- target_column: src_stm_code
  transformation: '''NHNCK_ORGANIZATION_REPORTS'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: scr_org_refr_id
  transformation: '{hash_id}(''NHNCK_ORGANIZATIONS'', or_re.ORGANIZATION_ID)'
  data_type: string
  description: FK đến tổ chức kinh doanh chứng khoán.
  target_attr_name: Securities Organization Reference Id
- target_column: scr_org_refr_code
  transformation: or_re.ORGANIZATION_ID
  data_type: string
  description: Mã tổ chức (denormalized).
  target_attr_name: Securities Organization Reference Code
- target_column: scr_prac_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', or_re.PROFESSIONAL_ID)'
  data_type: string
  description: FK đến người hành nghề chứng khoán.
  target_attr_name: Securities Practitioner Id
- target_column: scr_prac_code
  transformation: or_re.PROFESSIONAL_ID
  data_type: string
  description: Mã người hành nghề (denormalized).
  target_attr_name: Securities Practitioner Code
- target_column: license_ctf_doc_id
  transformation: '{hash_id}(''NHNCK_CERTIFICATE_RECORDS'', or_re.CERTIFICATE_RECORD_ID)'
  data_type: string
  description: FK đến hồ sơ chứng chỉ hành nghề (nullable).
  target_attr_name: License Certificate Document Id
- target_column: license_ctf_doc_code
  transformation: or_re.CERTIFICATE_RECORD_ID
  data_type: string
  description: Mã hồ sơ chứng chỉ hành nghề (denormalized).
  target_attr_name: License Certificate Document Code
- target_column: ctf_tp_code
  transformation: or_re.CERTIFICATE_ID
  data_type: string
  description: Loại chứng chỉ hành nghề tại thời điểm báo cáo.
  target_attr_name: Certificate Type Code
- target_column: prn_rpt_id
  transformation: '{hash_id}(''NHNCK_ORGANIZATION_REPORTS'', or_re.PARENT_REPORT_ID)'
  data_type: string
  description: FK self-ref — báo cáo gốc được điều chỉnh (nullable).
  target_attr_name: Parent Report Id
- target_column: prn_rpt_code
  transformation: or_re.PARENT_REPORT_ID
  data_type: string
  description: Mã báo cáo gốc (denormalized).
  target_attr_name: Parent Report Code
- target_column: prac_nm_at_rpt
  transformation: or_re.FULL_NAME
  data_type: string
  description: Họ và tên người hành nghề tại thời điểm lập báo cáo (snapshot).
  target_attr_name: Practitioner Name At Report
- target_column: prac_brth_dt_at_rpt
  transformation: or_re.BIRTH_DATE
