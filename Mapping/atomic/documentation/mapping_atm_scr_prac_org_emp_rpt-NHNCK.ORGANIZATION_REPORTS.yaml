  target_attr_name: External Sync Id
- target_column: rcrd_tp_code
  transformation: or_re.RECORD_TYPE
  data_type: string
  description: Phân loại loại bản ghi báo cáo.
  target_attr_name: Record Type Code
- target_column: org_st_code_at_rpt
  transformation: or_re.STATUS_ORGANIZATION
