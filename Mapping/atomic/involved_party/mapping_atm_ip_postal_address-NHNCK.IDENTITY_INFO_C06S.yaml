schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_postal_address-NHNCK.IDENTITY_INFO_C06S
  logical_name: Mapping Atomic - Involved Party Postal Address – source NHNCK.IDENTITY_INFO_C06S
  physical_name: ip_postal_address
  dm_ref: ATM-ip_postal_address-NHNCK.IDENTITY_INFO_C06S
  brd_ref: BRD-SRC-NHNCK-IDENTITY_INFO_C06S
target:
  namespace: atm
  physical_name: ip_postal_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: IDENTITY_INFO_C06S
  alias: id_in_c0
  select_fields: IDENTITY_NUMBER, CURRENT_DETAIL, CURRENT_COUNTRY_CODE, CURRENT_PROVINCE_CODE,
    CURRENT_DISTRICT_CODE, PERMANENT_DETAIL, PERMANENT_COUNTRY_CODE, PERMANENT_PROVINCE_CODE,
    PERMANENT_DISTRICT_CODE
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: id_in_c0
  alias: unpvt
  select_fields: IDENTITY_NUMBER, adr_tp_code, adr_val, country_code, province_code,
    district_code
  filter: null
  unpivot_spec:
    value_columns:
    - adr_val
    - country_code
    - province_code
    - district_code
    type_column: adr_tp_code
    legs:
    - type_value: CURRENT
      source_columns:
      - CURRENT_DETAIL
      - CURRENT_COUNTRY_CODE
      - CURRENT_PROVINCE_CODE
      - CURRENT_DISTRICT_CODE
    - type_value: PERMANENT
      source_columns:
      - PERMANENT_DETAIL
      - PERMANENT_COUNTRY_CODE
      - PERMANENT_PROVINCE_CODE
      - PERMANENT_DISTRICT_CODE
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_IDENTITY_INFO_C06S'', unpvt.IDENTITY_NUMBER)'
  data_type: string
  description: FK đến Individual.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.IDENTITY_NUMBER
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu của người hành nghề.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_IDENTITY_INFO_C06S'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: unpvt.adr_tp_code
  data_type: string
  description: Loại địa chỉ — tạm trú.
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: unpvt.adr_val
  data_type: string
  description: Địa chỉ chi tiết tạm trú (theo C06).
  target_attr_name: Address Value
- target_column: country_code
  transformation: unpvt.country_code
  data_type: string
  description: Mã quốc gia địa chỉ tạm trú (theo C06).
  target_attr_name: Country Code
- target_column: province_code
  transformation: unpvt.province_code
  data_type: string
  description: Mã tỉnh/thành phố địa chỉ tạm trú (theo C06).
  target_attr_name: Province Code
- target_column: district_code
  transformation: unpvt.district_code
  data_type: string
  description: Mã quận/huyện địa chỉ tạm trú (theo C06).
  target_attr_name: District Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
