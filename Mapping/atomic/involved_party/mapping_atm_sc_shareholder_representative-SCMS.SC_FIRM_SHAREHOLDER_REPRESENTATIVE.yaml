schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-sc_shareholder_representative-SCMS.SC_FIRM_SHAREHOLDER_REPRESENTATIVE
  logical_name: Mapping Atomic - Securities Company Shareholder Representative – source
    SCMS.SC_FIRM_SHAREHOLDER_REPRESENTATIVE
  physical_name: sc_shareholder_representative
  dm_ref: ATM-sc_shareholder_representative-SCMS.SC_FIRM_SHAREHOLDER_REPRESENTATIVE
  brd_ref: BRD-SRC-SCMS-SC_FIRM_SHAREHOLDER_REPRESENTATIVE
target:
  namespace: atm
  physical_name: sc_shareholder_representative
  etl_handle: SCD4A
  description: Người được cổ đông tổ chức ủy quyền đại diện quyền lợi tại CTCK. Ghi
    nhận thông tin cá nhân người đại diện, số cổ phần được đại diện và ngày bổ nhiệm.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_SHAREHOLDER_REPRESENTATIVE
  alias: sc_fi_sh_re
  select_fields: ID, SC_FIRM_INFO_ID, SC_FIRM_SHAREHOLDER_ID, RECORD_STATUS, REPRESENTATIVE_NAME,
    POSITION, ID_NUMBER, ISSUE_DATE, ISSUE_PLACE, SHARES_COUNT, OWNERSHIP_RATIO, ATTACHMENT_PATH,
    NOTE
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_INFO
  alias: sc_fi_in
  select_fields: ID, CODE
  filter: null
  note: Crosswalk bridge cho sc_id
relationship:
- main_alias: sc_fi_sh_re
  join_type: LEFT JOIN
  join_alias: sc_fi_in
  join_on: sc_fi_sh_re.SC_FIRM_INFO_ID = sc_fi_in.ID
mapping_columns:
- target_column: sc_shareholder_representative_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SHAREHOLDER_REPRESENTATIVE'', sc_fi_sh_re.ID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Securities Company Shareholder Representative Id
- target_column: sc_shareholder_representative_code
  transformation: sc_fi_sh_re.ID
  data_type: string
  description: Khóa chính kỹ thuật SCMS (ID tự tăng). BK của entity.
  target_attr_name: Securities Company Shareholder Representative Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_SHAREHOLDER_REPRESENTATIVE'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: sc_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_INFO'', sc_fi_in.CODE)'
  data_type: string
  description: FK đến Công ty chứng khoán liên quan.
  target_attr_name: Securities Company Id
- target_column: sc_code
  transformation: sc_fi_sh_re.SC_FIRM_INFO_ID
  data_type: string
  description: Mã Công ty chứng khoán.
  target_attr_name: Securities Company Code
- target_column: sc_shareholder_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SHAREHOLDER'', sc_fi_sh_re.SC_FIRM_SHAREHOLDER_ID)'
  data_type: string
  description: FK đến Cổ đông CTCK mà người này là đại diện.
  target_attr_name: Securities Company Shareholder Id
- target_column: sc_shareholder_code
  transformation: sc_fi_sh_re.SC_FIRM_SHAREHOLDER_ID
  data_type: string
  description: Mã Cổ đông CTCK.
  target_attr_name: Securities Company Shareholder Code
- target_column: record_status_code
  transformation: sc_fi_sh_re.RECORD_STATUS
  data_type: string
  description: Trạng thái bản ghi người đại diện cổ đông.
  target_attr_name: Record Status Code
- target_column: representative_nm
  transformation: sc_fi_sh_re.REPRESENTATIVE_NAME
  data_type: string
  description: Họ tên người đại diện cổ đông tổ chức.
  target_attr_name: Representative Name
- target_column: position
  transformation: sc_fi_sh_re.POSITION
  data_type: string
  description: Chức vụ của người đại diện tại tổ chức cổ đông.
  target_attr_name: Position
- target_column: identification_nbr
  transformation: sc_fi_sh_re.ID_NUMBER
  data_type: string
  description: Số CMND/CCCD của người đại diện (định danh cũ).
  target_attr_name: Identification Number
- target_column: issue_dt
  transformation: sc_fi_sh_re.ISSUE_DATE
  data_type: date
  description: Ngày cấp giấy tờ/chứng chỉ của người đại diện.
  target_attr_name: Issue Date
- target_column: issue_place
  transformation: sc_fi_sh_re.ISSUE_PLACE
  data_type: string
  description: Nơi cấp giấy tờ/chứng chỉ của người đại diện.
  target_attr_name: Issue Place
- target_column: shares_count
  transformation: sc_fi_sh_re.SHARES_COUNT
  data_type: int
  description: Số lượng cổ phần mà người đại diện này quản lý/đại diện.
  target_attr_name: Shares Count
- target_column: ownership_ratio
  transformation: sc_fi_sh_re.OWNERSHIP_RATIO
  data_type: decimal(5,2)
  description: Tỷ lệ sở hữu vốn của cổ đông mà người này đại diện (%).
  target_attr_name: Ownership Ratio
- target_column: attachment_path
  transformation: sc_fi_sh_re.ATTACHMENT_PATH
  data_type: string
  description: Đường dẫn file đính kèm trên hệ thống lưu trữ.
  target_attr_name: Attachment Path
- target_column: note
  transformation: sc_fi_sh_re.NOTE
  data_type: string
  description: Ghi chú bổ sung, không bắt buộc.
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
