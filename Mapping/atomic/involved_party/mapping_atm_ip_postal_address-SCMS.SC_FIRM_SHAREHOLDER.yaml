schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_postal_address-SCMS.SC_FIRM_SHAREHOLDER
  logical_name: Mapping Atomic - Involved Party Postal Address – source SCMS.SC_FIRM_SHAREHOLDER
  physical_name: ip_postal_address
  dm_ref: ATM-ip_postal_address-SCMS.SC_FIRM_SHAREHOLDER
  brd_ref: BRD-SRC-SCMS-SC_FIRM_SHAREHOLDER
target:
  namespace: atm
  physical_name: ip_postal_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_SHAREHOLDER
  alias: sc_fi_sh
  select_fields: ID, CURRENT_ADDRESS, HOUSEHOLD_REGISTRATION
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: sc_fi_sh
  alias: unpvt
  select_fields: ID, adr_tp_code, adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - adr_val
    type_column: adr_tp_code
    legs:
    - type_value: CURRENT
      source_columns:
      - CURRENT_ADDRESS
    - type_value: HOUSEHOLD_REGISTRY
      source_columns:
      - HOUSEHOLD_REGISTRATION
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SHAREHOLDER'', unpvt.ID)'
  data_type: string
  description: FK đến Securities Company Shareholder.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã Securities Company Shareholder.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_SHAREHOLDER'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: unpvt.adr_tp_code
  data_type: string
  description: 'Loại địa chỉ: CURRENT=Địa chỉ hiện tại.'
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: unpvt.adr_val
  data_type: string
  description: Địa chỉ hiện tại của cổ đông.
  target_attr_name: Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
