schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-FMS.FOR_BRCH
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.FOR_BRCH
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-FMS.FOR_BRCH
  brd_ref: BRD-SRC-FMS-FOR_BRCH
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: FOR_BRCH
  alias: fo_br
  select_fields: ID, LICENSE_DATE, REG_NO, LICENSE, TAX_CODE
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: fo_br
  alias: unpvt
  select_fields: ID, LICENSE_DATE, identification_tp_code, identification_nbr
  filter: null
  unpivot_spec:
    value_columns:
    - identification_nbr
    type_column: identification_tp_code
    legs:
    - type_value: BUSINESS_LICENSE
      source_columns:
      - REG_NO
    - type_value: OPERATION_LICENSE
      source_columns:
      - LICENSE
    - type_value: TAX_ID
      source_columns:
      - TAX_CODE
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_FOR_BRCH'', unpvt.ID)'
  data_type: string
  description: FK đến Foreign Fund Management Organization Unit.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã VPĐD/CN QLQ nước ngoài.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_FOR_BRCH'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: identification_issue_dt
  transformation: unpvt.LICENSE_DATE
  data_type: date
  description: Ngày cấp giấy phép.
  target_attr_name: Identification Issue Date
- target_column: identification_tp_code
  transformation: unpvt.identification_tp_code
  data_type: string
  description: Loại giấy tờ — giấy phép thành lập/đăng ký kinh doanh.
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: unpvt.identification_nbr
  data_type: string
  description: Số đăng ký kinh doanh của chi nhánh/VPĐD.
  target_attr_name: Identification Number
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
