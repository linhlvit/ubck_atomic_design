schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-sc_organization_unit-SCMS.SC_FIRM_BRANCH
  logical_name: Mapping Atomic - Securities Company Organization Unit – source SCMS.SC_FIRM_BRANCH
  physical_name: sc_organization_unit
  dm_ref: ATM-sc_organization_unit-SCMS.SC_FIRM_BRANCH
  brd_ref: BRD-SRC-SCMS-SC_FIRM_BRANCH
target:
  namespace: atm
  physical_name: sc_organization_unit
  etl_handle: SCD4A
  description: Chi nhánh của CTCK tại Việt Nam có địa chỉ pháp lý và giấy phép hoạt
    động riêng do UBCKNN cấp. Ghi nhận mã, địa chỉ, ngày thành lập và trạng thái pháp
    lý. org_unit_type_code = BRANCH.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_BRANCH
  alias: sc_fi_br
  select_fields: ID, SC_FIRM_INFO_ID, SC_FIRM_BRANCH_ID, BRANCH_CODE, FULL_NAME, BRANCH_NAME,
    NAME_EN, BRANCH_STATUS, RECORD_STATUS, PROVISIONAL, DECISION_NUMBER, DECISION_DATE,
    VALID_DOSSIER_DATE, OPERATION_DATE, OFFICIAL_OPERATION_DATE, DIRECTOR_NAME, REPRESENTATIVE_NAME,
    REPRESENTATIVE_TITLE, NHAN_SU_GIAM_DOC_ID, CO_QUAN_CAP, BUSINESS_LINES, ATTACHMENT_PATH,
    NOTE
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_INFO
  alias: sc_fi_in
  select_fields: ID, CODE
  filter: null
  note: Crosswalk bridge cho sc_id
relationship:
- main_alias: sc_fi_br
  join_type: LEFT JOIN
  join_alias: sc_fi_in
  join_on: sc_fi_br.SC_FIRM_INFO_ID = sc_fi_in.ID
mapping_columns:
- target_column: sc_ou_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_BRANCH'', sc_fi_br.ID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Securities Company Organization Unit Id
- target_column: sc_ou_code
  transformation: sc_fi_br.ID
  data_type: string
  description: Khóa chính kỹ thuật (ID tự tăng). BK của entity.
  target_attr_name: Securities Company Organization Unit Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_BRANCH'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: ou_tp_code
  transformation: 'null'
  data_type: string
  description: Loại đơn vị tổ chức trực thuộc CTCK.
  target_attr_name: Organization Unit Type Code
- target_column: sc_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_INFO'', sc_fi_in.CODE)'
  data_type: string
  description: FK đến Công ty chứng khoán (đơn vị cha).
  target_attr_name: Securities Company Id
- target_column: sc_code
  transformation: sc_fi_br.SC_FIRM_INFO_ID
  data_type: string
  description: Mã Công ty chứng khoán.
  target_attr_name: Securities Company Code
- target_column: parent_ou_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_BRANCH'', sc_fi_br.SC_FIRM_BRANCH_ID)'
  data_type: string
  description: FK tự tham chiếu — chi nhánh cha (nếu là chi nhánh cấp dưới).
  target_attr_name: Parent Organization Unit Id
- target_column: parent_ou_code
  transformation: sc_fi_br.SC_FIRM_BRANCH_ID
  data_type: string
  description: Mã đơn vị tổ chức cha.
  target_attr_name: Parent Organization Unit Code
- target_column: ou_code
  transformation: sc_fi_br.BRANCH_CODE
  data_type: string
  description: Mã nghiệp vụ chi nhánh (mã viết tắt).
  target_attr_name: Organization Unit Code
- target_column: ou_nm
  transformation: sc_fi_br.FULL_NAME
  data_type: string
  description: Tên chi nhánh.
  target_attr_name: Organization Unit Name
- target_column: ou_legacy_nm
  transformation: sc_fi_br.BRANCH_NAME
  data_type: string
  description: Tên chi nhánh (trường cũ BRANCH_NAME — có thể trùng với FULL_NAME).
  target_attr_name: Organization Unit Legacy Name
- target_column: ou_english_nm
  transformation: sc_fi_br.NAME_EN
  data_type: string
  description: Tên chi nhánh bằng tiếng Anh.
  target_attr_name: Organization Unit English Name
- target_column: cl_firm_status_id
  transformation: '{hash_id}(''SCMS_CAT_SC_FIRM_STATUS'', sc_fi_br.BRANCH_STATUS)'
  data_type: string
  description: FK đến trạng thái pháp lý chi nhánh.
  target_attr_name: Classification Firm Status Id
- target_column: cl_firm_status_code
  transformation: sc_fi_br.BRANCH_STATUS
  data_type: string
  description: Mã trạng thái pháp lý chi nhánh.
  target_attr_name: Classification Firm Status Code
- target_column: record_status_code
  transformation: sc_fi_br.RECORD_STATUS
  data_type: string
  description: 'Trạng thái bản ghi kỹ thuật: 1=Đang hoạt động/còn hiệu lực; 0=Ngừng
    hoạt động/hết hiệu lực.'
  target_attr_name: Record Status Code
- target_column: provisional_indicator
  transformation: sc_fi_br.PROVISIONAL
  data_type: int
  description: 'Cờ bản nháp: 1=Bản nháp; 0=Chính thức.'
  target_attr_name: Provisional Indicator
- target_column: decision_nbr
  transformation: sc_fi_br.DECISION_NUMBER
  data_type: string
  description: Số quyết định cấp phép/chấp thuận chi nhánh.
  target_attr_name: Decision Number
- target_column: decision_dt
  transformation: sc_fi_br.DECISION_DATE
  data_type: date
  description: Ngày ban hành quyết định.
  target_attr_name: Decision Date
- target_column: valid_dossier_dt
  transformation: sc_fi_br.VALID_DOSSIER_DATE
  data_type: date
  description: Ngày hồ sơ hợp lệ (ngày tiếp nhận hồ sơ hợp lệ).
  target_attr_name: Valid Dossier Date
- target_column: operation_dt
  transformation: sc_fi_br.OPERATION_DATE
  data_type: date
  description: Ngày bắt đầu hoạt động (dự kiến).
  target_attr_name: Operation Date
- target_column: official_operation_dt
  transformation: sc_fi_br.OFFICIAL_OPERATION_DATE
  data_type: date
  description: Ngày bắt đầu hoạt động chính thức.
  target_attr_name: Official Operation Date
- target_column: director_nm
  transformation: sc_fi_br.DIRECTOR_NAME
  data_type: string
  description: Họ tên Giám đốc chi nhánh.
  target_attr_name: Director Name
- target_column: representative_nm
  transformation: sc_fi_br.REPRESENTATIVE_NAME
  data_type: string
  description: Họ tên người đại diện chi nhánh.
  target_attr_name: Representative Name
- target_column: representative_title
  transformation: sc_fi_br.REPRESENTATIVE_TITLE
  data_type: string
  description: Chức danh người đại diện chi nhánh.
  target_attr_name: Representative Title
- target_column: personnel_director_id
  transformation: sc_fi_br.NHAN_SU_GIAM_DOC_ID
  data_type: string
  description: ID nhân sự giám đốc (liên kết nội bộ SCMS, không phải FK chính thức).
  target_attr_name: Personnel Director Id
- target_column: administrative_authority_nm
  transformation: sc_fi_br.CO_QUAN_CAP
  data_type: string
  description: 'Tên cơ quan cấp phép/quản lý chi nhánh (VD: UBCKNN, Sở KH).'
  target_attr_name: Administrative Authority Name
- target_column: business_lines
  transformation: sc_fi_br.BUSINESS_LINES
  data_type: string
  description: Danh sách nghiệp vụ kinh doanh chứng khoán được cấp phép cho chi nhánh.
  target_attr_name: Business Lines
- target_column: attachment_path
  transformation: sc_fi_br.ATTACHMENT_PATH
  data_type: string
  description: Đường dẫn file đính kèm trên hệ thống lưu trữ.
  target_attr_name: Attachment Path
- target_column: note
  transformation: sc_fi_br.NOTE
  data_type: string
  description: Ghi chú bổ sung, không bắt buộc.
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
