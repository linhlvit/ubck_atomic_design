  target_attr_name: Snapshot Mobile Number
- target_column: snpst_email
  transformation: ap_pr.EMAIL
  data_type: string
  description: Email tại thời điểm nộp hồ sơ
  target_attr_name: Snapshot Email
- target_column: snpst_workplace_nm
  transformation: ap_pr.WORKPLACE
  data_type: string
