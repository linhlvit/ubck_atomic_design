  target_attr_name: Snapshot Permanent Country Code
- target_column: snpst_permanent_province_id
  transformation: '{hash_id}(''ECAT_PROVINCE_NEW'', prov.PROVINCE_CODE)'
  data_type: string
  description: FK đến Geographic Area — tỉnh thường trú (snapshot)
  target_attr_name: Snapshot Permanent Province Id
- target_column: snpst_permanent_province_code
  transformation: ap_pr.PERMANENT_PROVINCE_ID
  data_type: string
