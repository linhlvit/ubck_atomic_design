schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_postal_address-FMS.SECURITIES
  logical_name: Mapping Atomic - Involved Party Postal Address – source FMS.SECURITIES
  physical_name: ip_postal_address
  dm_ref: ATM-ip_postal_address-FMS.SECURITIES
  brd_ref: BRD-SRC-FMS-SECURITIES
target:
  namespace: atm
  physical_name: ip_postal_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SECURITIES
  alias: secu
  select_fields: ID, ADDRESS
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_SECURITIES'', secu.ID)'
  data_type: string
  description: FK đến Fund Management Company.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: secu.ID
  data_type: string
  description: Mã công ty QLQ.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_SECURITIES'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: '''HEAD_OFFICE'''
  data_type: string
  description: Loại địa chỉ — trụ sở chính.
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: secu.ADDRESS
  data_type: string
  description: Địa chỉ trụ sở.
  target_attr_name: Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
