schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-SCMS.SC_FIRM_SHAREHOLDER_RELATION
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    SCMS.SC_FIRM_SHAREHOLDER_RELATION
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-SCMS.SC_FIRM_SHAREHOLDER_RELATION
  brd_ref: BRD-SRC-SCMS-SC_FIRM_SHAREHOLDER_RELATION
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_SHAREHOLDER_RELATION
  alias: sc_fi_sh_re
  select_fields: ID, ID_NUMBER, ISSUE_DATE, ISSUE_PLACE
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SHAREHOLDER_RELATION'', sc_fi_sh_re.ID)'
  data_type: string
  description: FK đến Securities Company Shareholder Relation.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: sc_fi_sh_re.ID
  data_type: string
  description: Mã Securities Company Shareholder Relation.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_SHAREHOLDER_RELATION'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identification_tp_code
  transformation: '''LEGACY_NATIONAL_ID'''
  data_type: string
  description: 'Loại giấy tờ tùy thân: LEGACY_NATIONAL_ID=CMND cũ (ID_NUMBER).'
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: sc_fi_sh_re.ID_NUMBER
  data_type: string
  description: Số CMND của người liên quan cổ đông.
  target_attr_name: Identification Number
- target_column: identification_issue_dt
  transformation: sc_fi_sh_re.ISSUE_DATE
  data_type: date
  description: Ngày cấp CMND.
  target_attr_name: Identification Issue Date
- target_column: identification_issue_place
  transformation: sc_fi_sh_re.ISSUE_PLACE
  data_type: string
  description: Nơi cấp CMND.
  target_attr_name: Identification Issue Place
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
