schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_electronic_address-KNT.TAX_REGISTRATION_INFO
  logical_name: Mapping Atomic - Involved Party Electronic Address – source KNT.TAX_REGISTRATION_INFO
  physical_name: ip_electronic_address
  dm_ref: ATM-ip_electronic_address-KNT.TAX_REGISTRATION_INFO
  brd_ref: BRD-SRC-KNT-TAX_REGISTRATION_INFO
target:
  namespace: atm
  physical_name: ip_electronic_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).
    Mỗi dòng = 1 kênh liên lạc từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: TAX_REGISTRATION_INFO
  alias: ta_re_in
  select_fields: TAX_CODE, BUSINESS_EMAIL, FAX, BUSINESS_FAX, PHONE, BUSINESS_PHONE
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: ta_re_in
  alias: unpvt
  select_fields: TAX_CODE, electronic_adr_tp_code, electronic_adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - electronic_adr_val
    type_column: electronic_adr_tp_code
    legs:
    - type_value: EMAIL_BUSINESS
      source_columns:
      - BUSINESS_EMAIL
    - type_value: FAX
      source_columns:
      - FAX
    - type_value: FAX_BUSINESS
      source_columns:
      - BUSINESS_FAX
    - type_value: PHONE
      source_columns:
      - PHONE
    - type_value: PHONE_BUSINESS
      source_columns:
      - BUSINESS_PHONE
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''KNT_TAX_REGISTRATION_INFO'', unpvt.TAX_CODE)'
  data_type: string
  description: FK đến External Tax Registration (Involved Party).
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.TAX_CODE
  data_type: string
  description: Mã External Tax Registration.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''KNT_TAX_REGISTRATION_INFO'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: electronic_adr_tp_code
  transformation: unpvt.electronic_adr_tp_code
  data_type: string
  description: Loại kênh liên lạc — email kinh doanh.
  target_attr_name: Electronic Address Type Code
- target_column: electronic_adr_val
  transformation: unpvt.electronic_adr_val
  data_type: string
  description: Email kinh doanh.
  target_attr_name: Electronic Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
