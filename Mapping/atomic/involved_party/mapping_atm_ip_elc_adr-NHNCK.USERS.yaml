schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_elc_adr-NHNCK.USERS
  logical_name: Mapping Atomic - Involved Party Electronic Address – source NHNCK.USERS
  physical_name: ip_elc_adr
  dm_ref: ATM-ip_elc_adr-NHNCK.USERS
  brd_ref: BRD-SRC-NHNCK-USERS
target:
  namespace: atm
  physical_name: ip_elc_adr
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).
    Mỗi dòng = 1 kênh liên lạc từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: USERS
  alias: user
  select_fields: ID, EMAIL, PHONE_NUMBER
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: user
  alias: unpvt
  select_fields: ID, elc_adr_tp_code, elc_adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - elc_adr_val
    type_column: elc_adr_tp_code
    legs:
    - type_value: EMAIL
      source_columns:
      - EMAIL
    - type_value: PHONE
      source_columns:
      - PHONE_NUMBER
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_USERS'', unpvt.ID)'
  data_type: string
  description: FK đến Regulatory Authority Officer
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã cán bộ UBCK
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_USERS'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: elc_adr_tp_code
  transformation: unpvt.elc_adr_tp_code
  data_type: string
  description: Loại địa chỉ điện tử — email.
  target_attr_name: Electronic Address Type Code
- target_column: elc_adr_val
  transformation: unpvt.elc_adr_val
  data_type: string
  description: Địa chỉ email cán bộ.
  target_attr_name: Electronic Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
