  physical_name: public_company
  etl_handle: SCD4A
  description: 'Hồ sơ công ty đại chúng (CTĐC) được quản lý bởi UBCKNN: tên, mã CK,
    sàn niêm yết, trạng thái hoạt động, vốn điều lệ, loại hình doanh nghiệp, nhóm
    ngành, loại BCTC.'
input:
- source_type: physical_table
  namespace: ods
  table_name: COMPANY_PROFILES
  alias: co_pr
  select_fields: ID, COMPANY_NAME_VN, COMPANY_NAME_EN, FIRST_REG_DATE, LATEST_REG_DATE,
