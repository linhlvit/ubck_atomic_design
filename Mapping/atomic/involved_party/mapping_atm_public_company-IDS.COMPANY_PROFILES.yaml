schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-public_company-IDS.COMPANY_PROFILES
  logical_name: Mapping Atomic - Public Company – source IDS.COMPANY_PROFILES
  physical_name: public_company
  dm_ref: ATM-public_company-IDS.COMPANY_PROFILES
  brd_ref: BRD-SRC-IDS-COMPANY_PROFILES
target:
