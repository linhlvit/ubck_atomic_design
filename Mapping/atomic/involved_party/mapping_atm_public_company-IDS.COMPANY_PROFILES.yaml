    HEAD_OFFICE_PROV, IPO_COMPANY_FLG, APPROVAL_STATUS_CD, DELETE_FLG
  filter: null
relationship: []
mapping_columns:
- target_column: pc_id
  transformation: '{hash_id}(''IDS_COMPANY_PROFILES'', co_pr.ID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Public Company Id
- target_column: pc_code
  transformation: co_pr.ID
  data_type: string
  description: Khóa chính. BK của entity — map từ PK bảng nguồn.
  target_attr_name: Public Company Code
- target_column: src_stm_code
  transformation: '''IDS_COMPANY_PROFILES'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: pc_nm
  transformation: co_pr.COMPANY_NAME_VN
