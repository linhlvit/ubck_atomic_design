schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-FIMS.TRADINGREPRESENTATIVE
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FIMS.TRADINGREPRESENTATIVE
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-FIMS.TRADINGREPRESENTATIVE
  brd_ref: BRD-SRC-FIMS-TRADINGREPRESENTATIVE
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: TRADINGREPRESENTATIVE
  alias: tr_re
  select_fields: ID, IDNO
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FIMS_TRADINGREPRESENTATIVE'', tr_re.ID)'
  data_type: string
  description: FK đến Trading Representative (Involved Party).
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: tr_re.ID
  data_type: string
  description: Mã Trading Representative.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FIMS_TRADINGREPRESENTATIVE'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identification_tp_code
  transformation: '''NATIONAL_ID'''
  data_type: string
  description: Loại giấy tờ tùy thân.
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: tr_re.IDNO
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu của đại diện giao dịch.
  target_attr_name: Identification Number
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
