schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-FMS.INVES
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.INVES
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-FMS.INVES
  brd_ref: BRD-SRC-FMS-INVES
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: INVES
  alias: in
  select_fields: ID_TYPE, ID_NO, ID_DATE, ID_PLACE, ID
  filter: null
relationship: []
mapping_columns:
- target_column: src_stm_code
  transformation: '''FMS_INVES'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: identification_tp_code
  transformation: in.ID_TYPE
  data_type: string
  description: 'Loại giấy tờ định danh: 1=CMND, 2=CCCD, 3=Hộ chiếu, 4=Mã số DN.'
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: in.ID_NO
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu/Mã số doanh nghiệp.
  target_attr_name: Identification Number
- target_column: identification_issue_dt
  transformation: in.ID_DATE
  data_type: date
  description: Ngày cấp CMND/CCCD/Hộ chiếu.
  target_attr_name: Identification Issue Date
- target_column: identification_issue_place
  transformation: in.ID_PLACE
  data_type: string
  description: Nơi cấp giấy tờ định danh.
  target_attr_name: Identification Issue Place
- target_column: ip_id
  transformation: '{hash_id}(''FMS_INVES'', in.ID)'
  data_type: string
  description: FK đến Discretionary Investment Investor.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: in.ID
  data_type: string
  description: Mã nhà đầu tư ủy thác.
  target_attr_name: Involved Party Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
