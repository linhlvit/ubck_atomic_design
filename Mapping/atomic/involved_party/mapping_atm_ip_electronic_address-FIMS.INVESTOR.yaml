schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_electronic_address-FIMS.INVESTOR
  logical_name: Mapping Atomic - Involved Party Electronic Address – source FIMS.INVESTOR
  physical_name: ip_electronic_address
  dm_ref: ATM-ip_electronic_address-FIMS.INVESTOR
  brd_ref: BRD-SRC-FIMS-INVESTOR
target:
  namespace: atm
  physical_name: ip_electronic_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).
    Mỗi dòng = 1 kênh liên lạc từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: INVESTOR
  alias: inve
  select_fields: TransactionCode, Email, Fax, Telephone, Website
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: inve
  alias: unpvt
  select_fields: TransactionCode, electronic_adr_tp_code, electronic_adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - electronic_adr_val
    type_column: electronic_adr_tp_code
    legs:
    - type_value: EMAIL
      source_columns:
      - Email
    - type_value: FAX
      source_columns:
      - Fax
    - type_value: PHONE
      source_columns:
      - Telephone
    - type_value: WEBSITE
      source_columns:
      - Website
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FIMS_INVESTOR'', unpvt.TransactionCode)'
  data_type: string
  description: FK đến Foreign Investor (Involved Party).
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.TransactionCode
  data_type: string
  description: Mã Foreign Investor.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FIMS_INVESTOR'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: electronic_adr_tp_code
  transformation: unpvt.electronic_adr_tp_code
  data_type: string
  description: Loại kênh liên lạc — email.
  target_attr_name: Electronic Address Type Code
- target_column: electronic_adr_val
  transformation: unpvt.electronic_adr_val
  data_type: string
  description: Địa chỉ email liên hệ.
  target_attr_name: Electronic Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
