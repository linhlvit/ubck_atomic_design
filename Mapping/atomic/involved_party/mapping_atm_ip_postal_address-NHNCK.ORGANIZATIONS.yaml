schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_postal_address-NHNCK.ORGANIZATIONS
  logical_name: Mapping Atomic - Involved Party Postal Address – source NHNCK.ORGANIZATIONS
  physical_name: ip_postal_address
  dm_ref: ATM-ip_postal_address-NHNCK.ORGANIZATIONS
  brd_ref: BRD-SRC-NHNCK-ORGANIZATIONS
target:
  namespace: atm
  physical_name: ip_postal_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: ORGANIZATIONS
  alias: org
  select_fields: ID, ADDRESS
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_ORGANIZATIONS'', org.ID)'
  data_type: string
  description: FK đến Securities Organization Reference.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: org.ID
  data_type: string
  description: Mã tổ chức.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_ORGANIZATIONS'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: '''HEAD_OFFICE'''
  data_type: string
  description: Loại địa chỉ — trụ sở chính.
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: org.ADDRESS
  data_type: string
  description: Địa chỉ trụ sở chính của tổ chức.
  target_attr_name: Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
