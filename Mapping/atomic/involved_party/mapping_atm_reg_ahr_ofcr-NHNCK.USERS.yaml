schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-reg_ahr_ofcr-NHNCK.USERS
  logical_name: Mapping Atomic - Regulatory Authority Officer – source NHNCK.USERS
  physical_name: reg_ahr_ofcr
  dm_ref: ATM-reg_ahr_ofcr-NHNCK.USERS
  brd_ref: BRD-SRC-NHNCK-USERS
target:
  namespace: atm
  physical_name: reg_ahr_ofcr
  etl_handle: SCD4A
  description: Cán bộ, chuyên viên UBCKNN có tài khoản trong hệ thống NHNCK. Ghi nhận
    thông tin nhân sự, đơn vị/phòng ban phụ trách và trạng thái tài khoản. Không lưu
    thông tin xác thực (PASSWORD).
input:
- source_type: physical_table
  namespace: ods
  table_name: USERS
  alias: user
  select_fields: ID, FULL_NAME, GENDER, UNIT_ID, DEPARTMENT_ID, POSITION_ID, PROFESSIONAL_ID,
    RECORD_STATUS, RECORD_TYPE, CREATED_AT, UPDATED_AT, CREATED_BY, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: reg_ahr_ofcr_id
  transformation: '{hash_id}(''NHNCK_USERS'', user.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Regulatory Authority Officer Id
- target_column: reg_ahr_ofcr_code
  transformation: user.ID
  data_type: string
  description: Mã cán bộ/chuyên viên UBCK. BK
  target_attr_name: Regulatory Authority Officer Code
- target_column: src_stm_code
  transformation: '''NHNCK_USERS'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: full_nm
  transformation: user.FULL_NAME
  data_type: string
  description: Họ và tên đầy đủ
  target_attr_name: Full Name
- target_column: idv_gnd_code
  transformation: user.GENDER
  data_type: string
  description: Giới tính
  target_attr_name: Individual Gender Code
- target_column: ou_id
  transformation: '{hash_id}(''NHNCK_UNITS'', user.UNIT_ID)'
  data_type: string
  description: FK đến Regulatory Authority Organization Unit (đơn vị)
  target_attr_name: Organization Unit Id
- target_column: ou_code
  transformation: user.UNIT_ID
  data_type: string
  description: Mã đơn vị
  target_attr_name: Organization Unit Code
- target_column: dept_id
  transformation: '{hash_id}(''NHNCK_DEPARTMENTS'', user.DEPARTMENT_ID)'
  data_type: string
  description: FK đến Regulatory Authority Organization Unit (phòng ban)
  target_attr_name: Department Id
- target_column: dept_code
  transformation: user.DEPARTMENT_ID
  data_type: string
  description: Mã phòng ban
  target_attr_name: Department Code
- target_column: pos_code
  transformation: user.POSITION_ID
  data_type: string
  description: Mã vị trí/chức danh
  target_attr_name: Position Code
- target_column: scr_prac_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', user.PROFESSIONAL_ID)'
  data_type: string
  description: FK đến Securities Practitioner (nếu cán bộ cũng là NHNCK)
  target_attr_name: Securities Practitioner Id
- target_column: scr_prac_code
  transformation: user.PROFESSIONAL_ID
  data_type: string
  description: Mã người hành nghề liên kết
  target_attr_name: Securities Practitioner Code
- target_column: rcrd_st_code
  transformation: user.RECORD_STATUS
  data_type: string
  description: Trạng thái hoạt động của cán bộ
  target_attr_name: Record Status Code
- target_column: rcrd_tp_code
  transformation: user.RECORD_TYPE
  data_type: string
  description: Loại bản ghi cán bộ
  target_attr_name: Record Type Code
- target_column: crt_tms
  transformation: user.CREATED_AT
  data_type: timestamp
  description: Thời điểm tạo bản ghi
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: user.UPDATED_AT
  data_type: timestamp
  description: Thời điểm cập nhật bản ghi lần cuối
  target_attr_name: Updated Timestamp
- target_column: crt_by_ofcr_id
  transformation: '{hash_id}(''NHNCK_USERS'', user.CREATED_BY)'
  data_type: string
  description: FK đến cán bộ tạo bản ghi (self-ref)
  target_attr_name: Created By Officer Id
- target_column: crt_by_ofcr_code
  transformation: user.CREATED_BY
  data_type: string
  description: Mã cán bộ tạo bản ghi
  target_attr_name: Created By Officer Code
- target_column: udt_by_ofcr_id
  transformation: '{hash_id}(''NHNCK_USERS'', user.UPDATED_BY)'
  data_type: string
  description: FK đến cán bộ cập nhật bản ghi lần cuối (self-ref)
  target_attr_name: Updated By Officer Id
- target_column: udt_by_ofcr_code
  transformation: user.UPDATED_BY
  data_type: string
  description: Mã cán bộ cập nhật bản ghi lần cuối
  target_attr_name: Updated By Officer Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
