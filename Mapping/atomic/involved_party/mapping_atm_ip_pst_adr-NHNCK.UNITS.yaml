schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_pst_adr-NHNCK.UNITS
  logical_name: Mapping Atomic - Involved Party Postal Address – source NHNCK.UNITS
  physical_name: ip_pst_adr
  dm_ref: ATM-ip_pst_adr-NHNCK.UNITS
  brd_ref: BRD-SRC-NHNCK-UNITS
target:
  namespace: atm
  physical_name: ip_pst_adr
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ bưu chính của Involved Party (trụ sở/kinh doanh/thường
    trú/nơi ở hiện tại). Mỗi dòng = 1 loại địa chỉ từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: UNITS
  alias: unit
  select_fields: ID, UNIT_CODE, ADDRESS
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_UNITS'', unit.ID)'
  data_type: string
  description: FK đến Regulatory Authority Organization Unit
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unit.UNIT_CODE
  data_type: string
  description: Mã đơn vị
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_UNITS'''
  data_type: string
  description: Mã hệ thống nguồn
  target_attr_name: Source System Code
- target_column: adr_tp_code
  transformation: '''HEAD_OFFICE'''
  data_type: string
  description: Loại địa chỉ — trụ sở chính
  target_attr_name: Address Type Code
- target_column: adr_val
  transformation: unit.ADDRESS
  data_type: string
  description: Địa chỉ trụ sở đơn vị
  target_attr_name: Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
