schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-FMS.REPRESENT
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    FMS.REPRESENT
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-FMS.REPRESENT
  brd_ref: BRD-SRC-FMS-REPRESENT
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: REPRESENT
  alias: repr
  select_fields: ID, ID_NO, ID_DATE
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''FMS_REPRESENT'', repr.ID)'
  data_type: string
  description: FK đến Investment Fund Representative Board Member.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: repr.ID
  data_type: string
  description: Mã thành viên ban đại diện.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''FMS_REPRESENT'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: identification_tp_code
  transformation: '''NATIONAL_ID'''
  data_type: string
  description: Loại giấy tờ định danh.
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: repr.ID_NO
  data_type: string
  description: Số CMND/CCCD/Hộ chiếu/Mã số doanh nghiệp.
  target_attr_name: Identification Number
- target_column: identification_issue_dt
  transformation: repr.ID_DATE
  data_type: date
  description: Ngày cấp CMND/CCCD/Hộ chiếu.
  target_attr_name: Identification Issue Date
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
