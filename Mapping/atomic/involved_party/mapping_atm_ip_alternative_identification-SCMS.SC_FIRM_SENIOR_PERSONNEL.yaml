schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-SCMS.SC_FIRM_SENIOR_PERSONNEL
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    SCMS.SC_FIRM_SENIOR_PERSONNEL
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-SCMS.SC_FIRM_SENIOR_PERSONNEL
  brd_ref: BRD-SRC-SCMS-SC_FIRM_SENIOR_PERSONNEL
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_SENIOR_PERSONNEL
  alias: sc_fi_se_pe
  select_fields: ID, ISSUE_DATE, ISSUE_PLACE, ID_NUMBER, NATIONAL_ID
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: sc_fi_se_pe
  alias: unpvt
  select_fields: ID, ISSUE_DATE, ISSUE_PLACE, identification_tp_code, identification_nbr
  filter: null
  unpivot_spec:
    value_columns:
    - identification_nbr
    type_column: identification_tp_code
    legs:
    - type_value: LEGACY_NATIONAL_ID
      source_columns:
      - ID_NUMBER
    - type_value: NATIONAL_ID
      source_columns:
      - NATIONAL_ID
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SENIOR_PERSONNEL'', unpvt.ID)'
  data_type: string
  description: FK đến Securities Company Senior Personnel.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã Securities Company Senior Personnel.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_SENIOR_PERSONNEL'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identification_issue_dt
  transformation: unpvt.ISSUE_DATE
  data_type: date
  description: Ngày cấp CMND cũ.
  target_attr_name: Identification Issue Date
- target_column: identification_issue_place
  transformation: unpvt.ISSUE_PLACE
  data_type: string
  description: Nơi cấp CMND cũ.
  target_attr_name: Identification Issue Place
- target_column: identification_tp_code
  transformation: unpvt.identification_tp_code
  data_type: string
  description: 'Loại giấy tờ tùy thân: LEGACY_NATIONAL_ID=CMND cũ.'
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: unpvt.identification_nbr
  data_type: string
  description: Số CMND cũ.
  target_attr_name: Identification Number
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
