schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_elc_adr-NHNCK.PROFESSIONALS
  logical_name: Mapping Atomic - Involved Party Electronic Address – source NHNCK.PROFESSIONALS
  physical_name: ip_elc_adr
  dm_ref: ATM-ip_elc_adr-NHNCK.PROFESSIONALS
  brd_ref: BRD-SRC-NHNCK-PROFESSIONALS
target:
  namespace: atm
  physical_name: ip_elc_adr
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).
    Mỗi dòng = 1 kênh liên lạc từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: PROFESSIONALS
  alias: pro
  select_fields: ID, EMAIL, MOBILE_NUMBER, PHONE_NUMBER
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: pro
  alias: unpvt
  select_fields: ID, elc_adr_tp_code, elc_adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - elc_adr_val
    type_column: elc_adr_tp_code
    legs:
    - type_value: EMAIL
      source_columns:
      - EMAIL
    - type_value: MOBILE
      source_columns:
      - MOBILE_NUMBER
    - type_value: PHONE
      source_columns:
      - PHONE_NUMBER
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', unpvt.ID)'
  data_type: string
  description: FK đến Securities Practitioner.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã người hành nghề.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_PROFESSIONALS'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: elc_adr_tp_code
  transformation: unpvt.elc_adr_tp_code
  data_type: string
  description: Loại kênh liên lạc — email.
  target_attr_name: Electronic Address Type Code
- target_column: elc_adr_val
  transformation: unpvt.elc_adr_val
  data_type: string
  description: Địa chỉ email.
  target_attr_name: Electronic Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
