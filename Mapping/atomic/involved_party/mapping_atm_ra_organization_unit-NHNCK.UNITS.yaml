- target_column: ra_ou_nm
  transformation: unit.UNIT_NAME
  data_type: string
  description: Tên đơn vị nội bộ UBCKNN
  target_attr_name: Regulatory Authority Organization Unit Name
- target_column: hierarchy_level_code
  transformation: unit.LEVEL_
