schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_electronic_address-SCMS.SC_FIRM_SHAREHOLDER
  logical_name: Mapping Atomic - Involved Party Electronic Address – source SCMS.SC_FIRM_SHAREHOLDER
  physical_name: ip_electronic_address
  dm_ref: ATM-ip_electronic_address-SCMS.SC_FIRM_SHAREHOLDER
  brd_ref: BRD-SRC-SCMS-SC_FIRM_SHAREHOLDER
target:
  namespace: atm
  physical_name: ip_electronic_address
  etl_handle: SCD4A
  description: Lưu trữ các địa chỉ liên lạc điện tử của Involved Party (điện thoại/fax/email).
    Mỗi dòng = 1 kênh liên lạc từ 1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_SHAREHOLDER
  alias: sc_fi_sh
  select_fields: ID, EMAIL, PHONE
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: sc_fi_sh
  alias: unpvt
  select_fields: ID, electronic_adr_tp_code, electronic_adr_val
  filter: null
  unpivot_spec:
    value_columns:
    - electronic_adr_val
    type_column: electronic_adr_tp_code
    legs:
    - type_value: EMAIL
      source_columns:
      - EMAIL
    - type_value: PHONE
      source_columns:
      - PHONE
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_SHAREHOLDER'', unpvt.ID)'
  data_type: string
  description: FK đến Securities Company Shareholder (Involved Party).
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã Securities Company Shareholder.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_SHAREHOLDER'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: electronic_adr_tp_code
  transformation: unpvt.electronic_adr_tp_code
  data_type: string
  description: Loại kênh liên lạc — email.
  target_attr_name: Electronic Address Type Code
- target_column: electronic_adr_val
  transformation: unpvt.electronic_adr_val
  data_type: string
  description: Địa chỉ email của cổ đông.
  target_attr_name: Electronic Address Value
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
