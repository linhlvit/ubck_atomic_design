schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alt_identn-NHNCK.PROFESSIONALS
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    NHNCK.PROFESSIONALS
  physical_name: ip_alt_identn
  dm_ref: ATM-ip_alt_identn-NHNCK.PROFESSIONALS
  brd_ref: BRD-SRC-NHNCK-PROFESSIONALS
target:
  namespace: atm
  physical_name: ip_alt_identn
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: PROFESSIONALS
  alias: pro
  select_fields: ID, IDENTITY_TYPE, IDENTITY_NUMBER, IDENTITY_ISSUE_DATE, IDENTITY_ISSUE_PLACE,
    PREVIOUS_IDENTITY_NUMBER
  filter: null
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', pro.ID)'
  data_type: string
  description: FK đến Securities Practitioner.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: pro.ID
  data_type: string
  description: Mã người hành nghề.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_PROFESSIONALS'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: identn_tp_code
  transformation: '''1=CMND;2=CCCD;3=PASSPORT'''
  data_type: string
  description: Loại giấy tờ định danh.
  target_attr_name: Identification Type Code
- target_column: identn_nbr
  transformation: pro.IDENTITY_NUMBER
  data_type: string
  description: Số giấy tờ định danh (CMND/CCCD/Hộ chiếu).
  target_attr_name: Identification Number
- target_column: identn_issu_dt
  transformation: pro.IDENTITY_ISSUE_DATE
  data_type: date
  description: Ngày cấp giấy tờ định danh.
  target_attr_name: Identification Issue Date
- target_column: identn_issu_plc
  transformation: pro.IDENTITY_ISSUE_PLACE
  data_type: string
  description: Nơi cấp giấy tờ định danh.
  target_attr_name: Identification Issue Place
- target_column: prev_identn_nbr
  transformation: pro.PREVIOUS_IDENTITY_NUMBER
  data_type: string
  description: Số CMND cũ (trước khi đổi sang CCCD).
  target_attr_name: Previous Identification Number
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
