schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-ip_alternative_identification-SCMS.SC_FIRM_INFO
  logical_name: Mapping Atomic - Involved Party Alternative Identification – source
    SCMS.SC_FIRM_INFO
  physical_name: ip_alternative_identification
  dm_ref: ATM-ip_alternative_identification-SCMS.SC_FIRM_INFO
  brd_ref: BRD-SRC-SCMS-SC_FIRM_INFO
target:
  namespace: atm
  physical_name: ip_alternative_identification
  etl_handle: SCD4A
  description: Lưu trữ các giấy tờ định danh thay thế của Involved Party (CMND/CCCD/Hộ
    chiếu/Giấy phép kinh doanh/Chứng chỉ hành nghề). Mỗi dòng = 1 loại giấy tờ từ
    1 nguồn.
input:
- source_type: physical_table
  namespace: ods
  table_name: SC_FIRM_INFO
  alias: sc_fi_in
  select_fields: ID, FOUNDATION_LICENSE_NUMBER, FOUNDATION_LICENSE_DATE, FOUNDATION_LICENSE_ISSUER,
    CERTIFICATE_NUMBER, CUSTODIAN_CERT_NUMBER, CUSTODIAN_CERT_DATE, CUSTODIAN_MEMBER_CERT_NUMBER,
    CUSTODIAN_MEMBER_CERT_DATE, ENTERPRISE_CODE, BUSINESS_LICENSE_NUMBER, BUSINESS_LICENSE_DATE,
    BUSINESS_LICENSE_ISSUER, TAX_CODE, CODE
  filter: null
- source_type: unpivot_cte
  namespace: null
  table_name: sc_fi_in
  alias: unpvt
  select_fields: ID, CODE, identification_tp_code, identification_nbr, identification_issue_dt,
    identification_issue_place
  filter: null
  unpivot_spec:
    value_columns:
    - identification_nbr
    - identification_issue_dt
    - identification_issue_place
    type_column: identification_tp_code
    legs:
    - type_value: BUSINESS_LICENSE
      source_columns:
      - FOUNDATION_LICENSE_NUMBER
      - FOUNDATION_LICENSE_DATE
      - FOUNDATION_LICENSE_ISSUER
    - type_value: CERTIFICATE
      source_columns:
      - CERTIFICATE_NUMBER
    - type_value: CUSTODIAN_CERT
      source_columns:
      - CUSTODIAN_CERT_NUMBER
      - CUSTODIAN_CERT_DATE
    - type_value: CUSTODIAN_MEMBER_CERT
      source_columns:
      - CUSTODIAN_MEMBER_CERT_NUMBER
      - CUSTODIAN_MEMBER_CERT_DATE
    - type_value: ENTERPRISE_CODE
      source_columns:
      - ENTERPRISE_CODE
    - type_value: OPERATION_LICENSE
      source_columns:
      - BUSINESS_LICENSE_NUMBER
      - BUSINESS_LICENSE_DATE
      - BUSINESS_LICENSE_ISSUER
    - type_value: TAX_ID
      source_columns:
      - TAX_CODE
relationship: []
mapping_columns:
- target_column: ip_id
  transformation: '{hash_id}(''SCMS_SC_FIRM_INFO'', unpvt.CODE)'
  data_type: string
  description: FK đến Securities Company.
  target_attr_name: Involved Party Id
- target_column: ip_code
  transformation: unpvt.ID
  data_type: string
  description: Mã Securities Company.
  target_attr_name: Involved Party Code
- target_column: src_stm_code
  transformation: '''SCMS_SC_FIRM_INFO'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: identification_tp_code
  transformation: unpvt.identification_tp_code
  data_type: string
  description: Loại giấy tờ định danh — giấy phép thành lập.
  target_attr_name: Identification Type Code
- target_column: identification_nbr
  transformation: unpvt.identification_nbr
  data_type: string
  description: Số giấy phép thành lập.
  target_attr_name: Identification Number
- target_column: identification_issue_dt
  transformation: unpvt.identification_issue_dt
  data_type: date
  description: Ngày cấp giấy phép thành lập.
  target_attr_name: Identification Issue Date
- target_column: identification_issue_place
  transformation: unpvt.identification_issue_place
  data_type: string
  description: Cơ quan cấp giấy phép thành lập.
  target_attr_name: Identification Issue Place
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
