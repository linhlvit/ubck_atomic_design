schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-geo-NHNCK.COUNTRIES
  logical_name: Mapping Atomic - Geographic Area – source NHNCK.COUNTRIES
  physical_name: geo
  dm_ref: ATM-geo-NHNCK.COUNTRIES
  brd_ref: BRD-SRC-NHNCK-COUNTRIES
target:
  namespace: atm
  physical_name: geo
  etl_handle: SCD4A
  description: 'Đơn vị địa lý dùng làm FK tham chiếu: quốc gia/quốc tịch (COUNTRY),
    vùng/miền (REGION), tỉnh/thành phố mới/cũ (PROVINCE/PROVINCE_OLD), quận/huyện
    cũ (DISTRICT_OLD), phường/xã mới/cũ (WARD/WARD_OLD). Phân biệt bằng geographic_area_type_code.
    Hỗ trợ song song bộ danh mục pre- và post-sáp nhập hành chính 2025.'
input:
- source_type: physical_table
  namespace: ods
  table_name: qlnhn
  alias: ql
  select_fields: COUNTRIES
  filter: null
relationship: []
mapping_columns:
- target_column: geo_id
  transformation: '{hash_id}(''NHNCK_COUNTRIES'', ql.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Geographic Area Id
- target_column: geo_code
  transformation: ql.ID
  data_type: string
  description: Mã quốc gia nguồn. BK
  target_attr_name: Geographic Area Code
- target_column: src_stm_code
  transformation: '''NHNCK_COUNTRIES'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: geo_tp_code
  transformation: 'null'
  data_type: string
  description: Phân loại vùng địa lý — Quốc gia
  target_attr_name: Geographic Area Type Code
- target_column: geo_nm
  transformation: ql.COUNTRY_NAME
  data_type: string
  description: Tên quốc gia/vùng lãnh thổ
  target_attr_name: Geographic Area Name
- target_column: iso_cty_code
  transformation: ql.COUNTRY_CODE
  data_type: string
  description: Mã quốc gia ISO 3166-1 alpha-2
  target_attr_name: ISO Country Code
- target_column: prn_geo_id
  transformation: '{hash_id}(''NHNCK_COUNTRIES'', ql.)'
  data_type: string
  description: FK đến vùng địa lý cha (self-ref). NULL cho quốc gia
  target_attr_name: Parent Geographic Area Id
- target_column: prn_geo_code
  transformation: 'null'
  data_type: string
  description: Mã vùng địa lý cha
  target_attr_name: Parent Geographic Area Code
- target_column: dflt_f
  transformation: ql.DEFAULT_FLAG
  data_type: boolean
  description: 'Cờ mặc định: true=Mặc định; false=Không'
  target_attr_name: Default Flag
- target_column: geo_st_code
  transformation: ql.RECORD_STATUS
  data_type: string
  description: 'Trạng thái bản ghi: 1=Hoạt động; 0=Không hoạt động'
  target_attr_name: Geographic Area Status Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
