schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-geo-NHNCK.PROVINCES
  logical_name: Mapping Atomic - Geographic Area – source NHNCK.PROVINCES
  physical_name: geo
  dm_ref: ATM-geo-NHNCK.PROVINCES
  brd_ref: BRD-SRC-NHNCK-PROVINCES
target:
  namespace: atm
  physical_name: geo
  etl_handle: SCD4A
  description: 'Đơn vị địa lý dùng làm FK tham chiếu: quốc gia/quốc tịch (COUNTRY),
    vùng/miền (REGION), tỉnh/thành phố mới/cũ (PROVINCE/PROVINCE_OLD), quận/huyện
    cũ (DISTRICT_OLD), phường/xã mới/cũ (WARD/WARD_OLD). Phân biệt bằng geographic_area_type_code.
    Hỗ trợ song song bộ danh mục pre- và post-sáp nhập hành chính 2025.'
input:
- source_type: physical_table
  namespace: ods
  table_name: PROVINCES
  alias: prov
  select_fields: ID, PROVINCE_NAME, PROVINCE_CODE, COUNTRY_ID, DEFAULT_FLAG, RECORD_STATUS
  filter: null
relationship: []
mapping_columns:
- target_column: geo_id
  transformation: '{hash_id}(''NHNCK_PROVINCES'', prov.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Geographic Area Id
- target_column: geo_code
  transformation: prov.ID
  data_type: string
  description: Mã tỉnh/thành phố nguồn. BK
  target_attr_name: Geographic Area Code
- target_column: src_stm_code
  transformation: '''NHNCK_PROVINCES'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: geo_tp_code
  transformation: 'null'
  data_type: string
  description: Phân loại vùng địa lý — Tỉnh/Thành phố
  target_attr_name: Geographic Area Type Code
- target_column: geo_nm
  transformation: prov.PROVINCE_NAME
  data_type: string
  description: Tên tỉnh/thành phố
  target_attr_name: Geographic Area Name
- target_column: iso_cty_code
  transformation: prov.PROVINCE_CODE
  data_type: string
  description: Mã tỉnh/thành theo chuẩn
  target_attr_name: ISO Country Code
- target_column: prn_geo_id
  transformation: '{hash_id}(''NHNCK_PROVINCES'', prov.COUNTRY_ID)'
  data_type: string
  description: FK đến quốc gia cha
  target_attr_name: Parent Geographic Area Id
- target_column: prn_geo_code
  transformation: prov.COUNTRY_ID
  data_type: string
  description: Mã quốc gia cha
  target_attr_name: Parent Geographic Area Code
- target_column: dflt_f
  transformation: prov.DEFAULT_FLAG
  data_type: boolean
  description: Cờ mặc định
  target_attr_name: Default Flag
- target_column: geo_st_code
  transformation: prov.RECORD_STATUS
  data_type: string
  description: Trạng thái bản ghi
  target_attr_name: Geographic Area Status Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
