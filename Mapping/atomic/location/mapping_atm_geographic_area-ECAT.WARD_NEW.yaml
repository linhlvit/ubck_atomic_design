schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-geographic_area-ECAT.WARD_NEW
  logical_name: Mapping Atomic - Geographic Area – source ECAT.WARD_NEW
  physical_name: geographic_area
  dm_ref: ATM-geographic_area-ECAT.WARD_NEW
  brd_ref: BRD-SRC-ECAT-WARD_NEW
target:
  namespace: atm
  physical_name: geographic_area
  etl_handle: SCD4A
  description: 'Đơn vị địa lý dùng làm FK tham chiếu: quốc gia/quốc tịch (COUNTRY),
    vùng/miền (REGION), tỉnh/thành phố mới/cũ (PROVINCE/PROVINCE_OLD), quận/huyện
    cũ (DISTRICT_OLD), phường/xã mới/cũ (WARD/WARD_OLD). Phân biệt bằng geographic_area_type_code.
    Hỗ trợ song song bộ danh mục pre- và post-sáp nhập hành chính 2025.'
input:
- source_type: physical_table
  namespace: ods
  table_name: WARD_NEW
  alias: wa_ne
  select_fields: CODE, NAME_VN, NAME_EN, PROVINCE_NEW_ID, EFFECTIVE, ACTIVE, DELETED,
    EFFECTIVE_START_DATE, EFFECTIVE_END_DATE, VERSION, DISPLAY_LABEL, ACTIVE_REASON,
    DELETED_REASON, CREATED_AT, UPDATED_AT, CREATED_BY_ID, CREATED_BY_NAME, UPDATED_BY_ID,
    UPDATED_BY_NAME, CATEGORY
  filter: null
relationship: []
mapping_columns:
- target_column: geographic_area_id
  transformation: '{hash_id}(''ECAT_WARD_NEW'', wa_ne.CODE)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Geographic Area Id
- target_column: src_stm_code
  transformation: '''ECAT_WARD_NEW'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: geographic_area_tp_code
  transformation: 'null'
  data_type: string
  description: Phân loại vùng địa lý — Phường/Xã/Thị trấn hiện hành
  target_attr_name: Geographic Area Type Code
- target_column: geographic_area_code
  transformation: wa_ne.CODE
  data_type: string
  description: Mã phường/xã nghiệp vụ (do ECAT quản lý). BK duy nhất — Id hash từ
    trường này.
  target_attr_name: Geographic Area Code
- target_column: geographic_area_nm
  transformation: wa_ne.NAME_VN
  data_type: string
  description: Tên phường/xã/thị trấn (tiếng Việt)
  target_attr_name: Geographic Area Name
- target_column: geographic_area_english_nm
  transformation: wa_ne.NAME_EN
  data_type: string
  description: Tên phường/xã/thị trấn (tiếng Anh)
  target_attr_name: Geographic Area English Name
- target_column: parent_geographic_area_id
  transformation: '{hash_id}(''ECAT_WARD_NEW'', wa_ne.PROVINCE_NEW_ID)'
  data_type: string
  description: FK đến tỉnh/thành phố cha
  target_attr_name: Parent Geographic Area Id
- target_column: parent_geographic_area_code
  transformation: wa_ne.PROVINCE_NEW_ID
  data_type: string
  description: Mã tỉnh/thành phố cha
  target_attr_name: Parent Geographic Area Code
- target_column: effective_indicator
  transformation: wa_ne.EFFECTIVE
  data_type: int
  description: 'Tình trạng hiệu lực: true=Hiệu lực; false=Hết hiệu lực'
  target_attr_name: Effective Indicator
- target_column: active_indicator
  transformation: wa_ne.ACTIVE
  data_type: int
  description: 'Trạng thái sử dụng: true=Đang sử dụng; false=Không sử dụng'
  target_attr_name: Active Indicator
- target_column: deleted_indicator
  transformation: wa_ne.DELETED
  data_type: int
  description: 'Cờ xóa mềm: true=Đã xóa; false=Chưa xóa'
  target_attr_name: Deleted Indicator
- target_column: effective_start_dt
  transformation: wa_ne.EFFECTIVE_START_DATE
  data_type: timestamp
  description: Ngày bắt đầu hiệu lực
  target_attr_name: Effective Start Date
- target_column: effective_end_dt
  transformation: wa_ne.EFFECTIVE_END_DATE
  data_type: timestamp
  description: Ngày kết thúc hiệu lực
  target_attr_name: Effective End Date
- target_column: version_nbr
  transformation: wa_ne.VERSION
  data_type: int
  description: Số phiên bản bản ghi tại nguồn
  target_attr_name: Version Number
- target_column: display_label
  transformation: wa_ne.DISPLAY_LABEL
  data_type: string
  description: Nhãn hiển thị
  target_attr_name: Display Label
- target_column: active_reason
  transformation: wa_ne.ACTIVE_REASON
  data_type: string
  description: Lý do thay đổi trạng thái sử dụng
  target_attr_name: Active Reason
- target_column: deleted_reason
  transformation: wa_ne.DELETED_REASON
  data_type: string
  description: Lý do xóa
  target_attr_name: Deleted Reason
- target_column: created_tms
  transformation: wa_ne.CREATED_AT
  data_type: timestamp
  description: Thời điểm bản ghi được tạo tại nguồn
  target_attr_name: Created Timestamp
- target_column: updated_tms
  transformation: wa_ne.UPDATED_AT
  data_type: timestamp
  description: Thời điểm bản ghi được cập nhật gần nhất tại nguồn
  target_attr_name: Updated Timestamp
- target_column: created_by_staff_id
  transformation: '{hash_id}(''ECAT_UBCK_STAFF'', wa_ne.CREATED_BY_ID)'
  data_type: string
  description: FK đến Regulatory Authority Staff — cán bộ tạo bản ghi
  target_attr_name: Created By Staff Id
- target_column: created_by_staff_code
  transformation: wa_ne.CREATED_BY_ID
  data_type: string
  description: Mã cán bộ tạo bản ghi — lookup pair với Created By Staff Id
  target_attr_name: Created By Staff Code
- target_column: created_by_staff_nm
  transformation: wa_ne.CREATED_BY_NAME
  data_type: string
  description: Tên người tạo bản ghi (denormalized snapshot tại thời điểm tạo)
  target_attr_name: Created By Staff Name
- target_column: updated_by_staff_id
  transformation: '{hash_id}(''ECAT_UBCK_STAFF'', wa_ne.UPDATED_BY_ID)'
  data_type: string
  description: FK đến Regulatory Authority Staff — cán bộ cập nhật bản ghi gần nhất
  target_attr_name: Updated By Staff Id
- target_column: updated_by_staff_code
  transformation: wa_ne.UPDATED_BY_ID
  data_type: string
  description: Mã cán bộ cập nhật bản ghi — lookup pair với Updated By Staff Id
  target_attr_name: Updated By Staff Code
- target_column: updated_by_staff_nm
  transformation: wa_ne.UPDATED_BY_NAME
  data_type: string
  description: Tên người cập nhật bản ghi gần nhất (denormalized snapshot)
  target_attr_name: Updated By Staff Name
- target_column: geographic_area_category_code
  transformation: wa_ne.CATEGORY
  data_type: string
  description: Loại đơn vị hành chính cấp phường/xã (Phường/Xã/Thị trấn)
  target_attr_name: Geographic Area Category Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
