schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-cl_nationality-SCMS.CAT_NATIONALITY
  logical_name: Mapping Atomic - Classification Nationality – source SCMS.CAT_NATIONALITY
  physical_name: cl_nationality
  dm_ref: ATM-cl_nationality-SCMS.CAT_NATIONALITY
  brd_ref: BRD-SRC-SCMS-CAT_NATIONALITY
target:
  namespace: atm
  physical_name: cl_nationality
  etl_handle: Upsert
  description: 'Danh mục quốc tịch dùng cho nhân sự, cổ đông, người liên quan của
    CTCK. Nâng cấp từ Classification Value (scheme SCMS_NATIONALITY) lên entity thật.
    Xem 7e #11.'
input:
- source_type: physical_table
  namespace: ods
  table_name: CAT_NATIONALITY
  alias: ca_na
  select_fields: ID, NATIONALITY_CODE, CREATED_AT, NATIONALITY_NAME, RECORD_STATUS,
    NOTE
  filter: created_at >= {etl_date} AND created_at < {etl_date} + 1
relationship: []
mapping_columns:
- target_column: cl_nationality_id
  transformation: '{hash_id}(''SCMS_CAT_NATIONALITY'', ca_na.NATIONALITY_CODE)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Classification Nationality Id
- target_column: cl_nationality_code
  transformation: ca_na.NATIONALITY_CODE
  data_type: string
  description: Mã quốc tịch. BK của entity.
  target_attr_name: Classification Nationality Code
- target_column: src_stm_code
  transformation: '''SCMS_CAT_NATIONALITY'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: data_dt
  transformation: ca_na.CREATED_AT
  data_type: date
  description: 'Thời điểm tạo bản ghi (nguồn: CREATED_AT). Dùng làm căn cứ partition
    Delta Lake / incremental filter — bảng nguồn có data_change_mode=Append, filter_logic
    theo created_at (xem BRD/Source/brd_SCMS.yaml, đã sửa lỗi created_by→created_at
    2026-07-15).'
  target_attr_name: Data Date
- target_column: cl_nationality_nm
  transformation: ca_na.NATIONALITY_NAME
  data_type: string
  description: Tên quốc tịch.
  target_attr_name: Classification Nationality Name
- target_column: record_status_code
  transformation: ca_na.RECORD_STATUS
  data_type: string
  description: 'Trạng thái bản ghi quốc tịch: 1 = Đang sử dụng; 0 = Ngừng sử dụng.'
  target_attr_name: Record Status Code
- target_column: note
  transformation: ca_na.NOTE
  data_type: string
  description: Ghi chú bổ sung, không bắt buộc.
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
