schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-sp_professional_training_class_enrollment-NHNCK.SPECIALIZATION_COURSE_DETAILS
  logical_name: Mapping Atomic - Securities Practitioner Professional Training Class
    Enrollment – source NHNCK.SPECIALIZATION_COURSE_DETAILS
  physical_name: sp_professional_training_class_enrollment
  dm_ref: ATM-sp_professional_training_class_enrollment-NHNCK.SPECIALIZATION_COURSE_DETAILS
  brd_ref: BRD-SRC-NHNCK-SPECIALIZATION_COURSE_DETAILS
target:
  namespace: atm
  physical_name: sp_professional_training_class_enrollment
  etl_handle: SCD4A
  description: Đăng ký tham gia và kết quả học tập của người hành nghề tại một khóa
    đào tạo chuyên môn. Ghi nhận điểm thi, kết quả đạt/không đạt và trạng thái ghi
    danh.
input:
- source_type: physical_table
  namespace: ods
  table_name: SPECIALIZATION_COURSE_DETAILS
  alias: sp_co_de
  select_fields: ID, SPECIALIZATION_COURSE_ID, PROFESSIONAL_ID, SPECIALIZATION_ID,
    EXAM_NUMBER, FULL_NAME, BIRTH_DATE, PLACE_OF_BIRTH, PERMANENT_COUNTRY_ID, PERMANENT_PROVINCE_ID,
    PERMANENT_DISTRICT_ID, IDENTITY_TYPE, IDENTITY_NUMBER, IDENTITY_ISSUE_DATE, IDENTITY_ISSUE_PLACE,
    EXAM_SCORE, RESULT, DESCRIPTION, NOTE, ASSIGNEE_ID
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: SPECIALIZATION_COURSES
  alias: sp_co
  select_fields: ID, COURSE_CODE
  filter: null
  note: Crosswalk bridge cho sp_professional_training_class_id
- source_type: physical_table
  namespace: ods
  table_name: COUNTRIES
  alias: coun
  select_fields: ID, COUNTRY_CODE
  filter: null
  note: Crosswalk bridge cho permanent_residence_country_id
- source_type: physical_table
  namespace: ods
  table_name: PROVINCES
  alias: prov
  select_fields: ID, PROVINCE_CODE
  filter: null
  note: Crosswalk bridge cho permanent_residence_province_id
- source_type: physical_table
  namespace: ods
  table_name: DISTRICTS
  alias: dist
  select_fields: ID, DISTRICT_CODE
  filter: null
  note: Crosswalk bridge cho permanent_residence_district_id
relationship:
- main_alias: sp_co_de
  join_type: LEFT JOIN
  join_alias: sp_co
  join_on: sp_co_de.SPECIALIZATION_COURSE_ID = sp_co.ID
- main_alias: sp_co_de
  join_type: LEFT JOIN
  join_alias: coun
  join_on: sp_co_de.PERMANENT_COUNTRY_ID = coun.ID
- main_alias: sp_co_de
  join_type: LEFT JOIN
  join_alias: prov
  join_on: sp_co_de.PERMANENT_PROVINCE_ID = prov.ID
- main_alias: sp_co_de
  join_type: LEFT JOIN
  join_alias: dist
  join_on: sp_co_de.PERMANENT_DISTRICT_ID = dist.ID
mapping_columns:
- target_column: sp_professional_training_class_enrollment_id
  transformation: '{hash_id}(''NHNCK_SPECIALIZATION_COURSE_DETAILS'', sp_co_de.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Securities Practitioner Professional Training Class Enrollment
    Id
- target_column: sp_professional_training_class_enrollment_code
  transformation: sp_co_de.ID
  data_type: string
  description: Mã định danh (BK từ PK nguồn)
  target_attr_name: Securities Practitioner Professional Training Class Enrollment
    Code
- target_column: src_stm_code
  transformation: '''NHNCK_SPECIALIZATION_COURSE_DETAILS'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: sp_professional_training_class_id
  transformation: '{hash_id}(''NHNCK_SPECIALIZATION_COURSES'', sp_co.COURSE_CODE)'
  data_type: string
  description: FK đến lớp đào tạo nghiệp vụ chứng khoán
  target_attr_name: Securities Practitioner Professional Training Class Id
- target_column: sp_professional_training_class_code
  transformation: sp_co_de.SPECIALIZATION_COURSE_ID
  data_type: string
  description: Mã lớp đào tạo
  target_attr_name: Securities Practitioner Professional Training Class Code
- target_column: sp_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', sp_co_de.PROFESSIONAL_ID)'
  data_type: string
  description: FK đến người hành nghề chứng khoán
  target_attr_name: Securities Practitioner Id
- target_column: sp_code
  transformation: sp_co_de.PROFESSIONAL_ID
  data_type: string
  description: Mã người hành nghề
  target_attr_name: Securities Practitioner Code
- target_column: specialization_tp_code
  transformation: sp_co_de.SPECIALIZATION_ID
  data_type: string
  description: Loại chuyên ngành đào tạo
  target_attr_name: Specialization Type Code
- target_column: exam_nbr
  transformation: sp_co_de.EXAM_NUMBER
  data_type: string
  description: Số báo danh dự thi
  target_attr_name: Exam Number
- target_column: practitioner_nm_at_enrollment
  transformation: sp_co_de.FULL_NAME
  data_type: string
  description: Họ tên học viên tại thời điểm đăng ký (snapshot)
  target_attr_name: Practitioner Name At Enrollment
- target_column: practitioner_birth_dt_at_enrollment
  transformation: sp_co_de.BIRTH_DATE
  data_type: date
  description: Ngày sinh tại thời điểm đăng ký (snapshot)
  target_attr_name: Practitioner Birth Date At Enrollment
- target_column: place_of_birth
  transformation: sp_co_de.PLACE_OF_BIRTH
  data_type: string
  description: Nơi sinh (snapshot)
  target_attr_name: Place of Birth
- target_column: permanent_residence_country_id
  transformation: '{hash_id}(''ECAT_COUNTRY'', coun.COUNTRY_CODE)'
  data_type: string
  description: FK đến quốc gia thường trú (snapshot)
  target_attr_name: Permanent Residence Country Id
- target_column: permanent_residence_country_code
  transformation: sp_co_de.PERMANENT_COUNTRY_ID
  data_type: string
  description: Mã quốc gia thường trú
  target_attr_name: Permanent Residence Country Code
- target_column: permanent_residence_province_id
  transformation: '{hash_id}(''ECAT_PROVINCE_NEW'', prov.PROVINCE_CODE)'
  data_type: string
  description: FK đến tỉnh/thành thường trú (snapshot)
  target_attr_name: Permanent Residence Province Id
- target_column: permanent_residence_province_code
  transformation: sp_co_de.PERMANENT_PROVINCE_ID
  data_type: string
  description: Mã tỉnh/thành thường trú
  target_attr_name: Permanent Residence Province Code
- target_column: permanent_residence_district_id
  transformation: '{hash_id}(''ECAT_DISTRICT_OLD'', dist.DISTRICT_CODE)'
  data_type: string
  description: FK đến quận/huyện thường trú (snapshot)
  target_attr_name: Permanent Residence District Id
- target_column: permanent_residence_district_code
  transformation: sp_co_de.PERMANENT_DISTRICT_ID
  data_type: string
  description: Mã quận/huyện thường trú
  target_attr_name: Permanent Residence District Code
- target_column: practitioner_identity_tp_code_at_enrollment
  transformation: sp_co_de.IDENTITY_TYPE
  data_type: string
  description: Loại giấy tờ định danh tại thời điểm đăng ký (snapshot)
  target_attr_name: Practitioner Identity Type Code At Enrollment
- target_column: practitioner_identity_nbr_at_enrollment
  transformation: sp_co_de.IDENTITY_NUMBER
  data_type: string
  description: Số định danh tại thời điểm đăng ký (snapshot)
  target_attr_name: Practitioner Identity Number At Enrollment
- target_column: practitioner_identity_issue_dt_at_enrollment
  transformation: sp_co_de.IDENTITY_ISSUE_DATE
  data_type: date
  description: Ngày cấp giấy tờ định danh (snapshot)
  target_attr_name: Practitioner Identity Issue Date At Enrollment
- target_column: practitioner_identity_issue_place_at_enrollment
  transformation: sp_co_de.IDENTITY_ISSUE_PLACE
  data_type: string
  description: Nơi cấp giấy tờ định danh (snapshot)
  target_attr_name: Practitioner Identity Issue Place At Enrollment
- target_column: exam_score
  transformation: sp_co_de.EXAM_SCORE
  data_type: decimal(5,2)
  description: Điểm thi
  target_attr_name: Exam Score
- target_column: training_result_code
  transformation: sp_co_de.RESULT
  data_type: string
  description: Kết quả đào tạo (-1=Không thi, 0=Không đạt, 1=Đạt)
  target_attr_name: Training Result Code
- target_column: description
  transformation: sp_co_de.DESCRIPTION
  data_type: string
  description: Mô tả
  target_attr_name: Description
- target_column: note
  transformation: sp_co_de.NOTE
  data_type: string
  description: Ghi chú
  target_attr_name: Note
- target_column: assignee_officer_id
  transformation: '{hash_id}(''IAM_USERS'', sp_co_de.ASSIGNEE_ID)'
  data_type: string
  description: FK đến cán bộ phụ trách (nullable)
  target_attr_name: Assignee Officer Id
- target_column: assignee_officer_code
  transformation: sp_co_de.ASSIGNEE_ID
  data_type: string
  description: Mã cán bộ phụ trách
  target_attr_name: Assignee Officer Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
