schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-sp_related_party-NHNCK.PROFESSIONAL_RELATIONSHIPS
  logical_name: Mapping Atomic - Securities Practitioner Related Party – source NHNCK.PROFESSIONAL_RELATIONSHIPS
  physical_name: sp_related_party
  dm_ref: ATM-sp_related_party-NHNCK.PROFESSIONAL_RELATIONSHIPS
  brd_ref: BRD-SRC-NHNCK-PROFESSIONAL_RELATIONSHIPS
target:
  namespace: atm
  physical_name: sp_related_party
  etl_handle: SCD4A
  description: Quan hệ thân nhân của người hành nghề chứng khoán. Ghi nhận loại quan hệ,
    họ tên, năm sinh, địa chỉ, nghề nghiệp và số giấy tờ định danh của người thân.
input:
- source_type: physical_table
  namespace: ods
  table_name: PROFESSIONAL_RELATIONSHIPS
  alias: pr_re
  select_fields: ID, PROFESSIONAL_ID, RELATIONSHIP_TYPE, FULL_NAME, BIRTH_YEAR, ADDRESS,
    OCCUPATION, WORKPLACE, IDENTITY_ID, COUNTRY_ID, NOTE
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: COUNTRIES
  alias: coun
  select_fields: ID, COUNTRY_CODE
  filter: null
  note: Crosswalk bridge cho country_id
relationship:
- main_alias: pr_re
  join_type: LEFT JOIN
  join_alias: coun
  join_on: pr_re.COUNTRY_ID = coun.ID
mapping_columns:
- target_column: sp_related_party_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONAL_RELATIONSHIPS'', pr_re.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Securities Practitioner Related Party Id
- target_column: sp_related_party_code
  transformation: pr_re.ID
  data_type: string
  description: Mã định danh quan hệ (PK nguồn). BK
  target_attr_name: Securities Practitioner Related Party Code
- target_column: src_stm_code
  transformation: '''NHNCK_PROFESSIONAL_RELATIONSHIPS'''
  data_type: string
  description: Mã hệ thống nguồn.
  target_attr_name: Source System Code
- target_column: sp_id
  transformation: '{hash_id}(''NHNCK_PROFESSIONALS'', pr_re.PROFESSIONAL_ID)'
  data_type: string
  description: FK đến Securities Practitioner
  target_attr_name: Securities Practitioner Id
- target_column: sp_code
  transformation: pr_re.PROFESSIONAL_ID
  data_type: string
  description: Mã người hành nghề chứng khoán
  target_attr_name: Securities Practitioner Code
- target_column: rltnp_tp_code
  transformation: pr_re.RELATIONSHIP_TYPE
  data_type: string
  description: "Loại quan hệ (1: Vợ/Chồng, 2: Con, 3: Bố, 4: Mẹ, 5: Ông, 6: Bà)"
  target_attr_name: Relationship Type Code
- target_column: related_individual_full_nm
  transformation: pr_re.FULL_NAME
  data_type: string
  description: Họ và tên người thân
  target_attr_name: Related Individual Full Name
- target_column: related_individual_birth_year
  transformation: pr_re.BIRTH_YEAR
  data_type: int
  description: Năm sinh người thân
  target_attr_name: Related Individual Birth Year
- target_column: related_individual_adr
  transformation: pr_re.ADDRESS
  data_type: string
  description: Địa chỉ người thân
  target_attr_name: Related Individual Address
- target_column: related_individual_occupation
  transformation: pr_re.OCCUPATION
  data_type: string
  description: Nghề nghiệp người thân
  target_attr_name: Related Individual Occupation
- target_column: related_individual_workplace
  transformation: pr_re.WORKPLACE
  data_type: string
  description: Nơi làm việc người thân
  target_attr_name: Related Individual Workplace
- target_column: related_individual_identity_nbr
  transformation: pr_re.IDENTITY_ID
  data_type: string
  description: Số CMND/CCCD người thân
  target_attr_name: Related Individual Identity Number
- target_column: country_id
  transformation: '{hash_id}(''ECAT_COUNTRY'', coun.COUNTRY_CODE)'
  data_type: string
  description: FK đến Geographic Area — quốc gia
  target_attr_name: Country Id
- target_column: country_code
  transformation: pr_re.COUNTRY_ID
  data_type: string
  description: Mã quốc gia
  target_attr_name: Country Code
- target_column: note
  transformation: pr_re.NOTE
  data_type: string
  description: Ghi chú
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []