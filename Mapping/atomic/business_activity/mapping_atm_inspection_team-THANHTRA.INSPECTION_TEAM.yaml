schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-inspection_team-THANHTRA.INSPECTION_TEAM
  logical_name: Mapping Atomic - Inspection Team – source THANHTRA.INSPECTION_TEAM
  physical_name: inspection_team
  dm_ref: ATM-inspection_team-THANHTRA.INSPECTION_TEAM
  brd_ref: BRD-SRC-THANHTRA-INSPECTION_TEAM
target:
  namespace: atm
  physical_name: inspection_team
  etl_handle: SCD4A
  description: Hồ sơ đoàn thanh tra cụ thể (mã HSTT-YYYY-XXX), ghi nhận thông tin
    thành lập đoàn, quyết định thanh tra, hình thức thanh tra (định kỳ/đột xuất) và
    ngày ký biên bản xác minh.
input:
- source_type: physical_table
  namespace: ods
  table_name: INSPECTION_TEAM
  alias: in_te
  select_fields: CODE, INSPECTION_ANNUAL_PLAN_ID, PLAN_YEAR, FORM_TYPE, START_DATE,
    END_DATE, DURATION_DAYS, DECISION_NUMBER, DECISION_DATE, DECISION_NAME, ANNOUNCEMENT_DATE,
    CONTENT, INSPECTION_PERIOD_FROM, INSPECTION_PERIOD_TO, ANTI_MONEY_LAUNDERING,
    ABNORMAL_TRANSACTION_CHECK, VERIFICATION_MINUTES_SIGN_DATE, NOTE
  filter: null
relationship: []
mapping_columns:
- target_column: inspection_team_id
  transformation: '{hash_id}(''THANHTRA_INSPECTION_TEAM'', in_te.CODE)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Inspection Team Id
- target_column: inspection_team_code
  transformation: in_te.CODE
  data_type: string
  description: Mã hồ sơ đoàn thanh tra tự sinh UNIQUE (HSTT-YYYY-XXX). BK duy nhất
    — Id hash từ trường này.
  target_attr_name: Inspection Team Code
- target_column: src_stm_code
  transformation: '''THANHTRA_INSPECTION_TEAM'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: inspection_annual_plan_id
  transformation: '{hash_id}(''THANHTRA_INSPECTION_ANNUAL_PLAN'', in_te.INSPECTION_ANNUAL_PLAN_ID)'
  data_type: string
  description: FK đến kế hoạch thanh tra năm (chỉ có khi form_type=PERIODIC).
  target_attr_name: Inspection Annual Plan Id
- target_column: inspection_annual_plan_code
  transformation: in_te.INSPECTION_ANNUAL_PLAN_ID
  data_type: string
  description: Mã kế hoạch thanh tra năm liên kết (snapshot).
  target_attr_name: Inspection Annual Plan Code
- target_column: plan_year
  transformation: in_te.PLAN_YEAR
  data_type: int
  description: Năm thanh tra.
  target_attr_name: Plan Year
- target_column: form_tp_code
  transformation: in_te.FORM_TYPE
  data_type: string
  description: 'Hình thức: PERIODIC (Định kỳ), UNSCHEDULED (Đột xuất).'
  target_attr_name: Form Type Code
- target_column: start_dt
  transformation: in_te.START_DATE
  data_type: date
  description: Ngày bắt đầu đoàn thanh tra.
  target_attr_name: Start Date
- target_column: end_dt
  transformation: in_te.END_DATE
  data_type: date
  description: Ngày kết thúc đoàn thanh tra (phải >= start_date).
  target_attr_name: End Date
- target_column: duration_days
  transformation: in_te.DURATION_DAYS
  data_type: int
  description: Thời hạn thanh tra (số ngày, chỉ nhập số nguyên > 0).
  target_attr_name: Duration Days
- target_column: decision_nbr
  transformation: in_te.DECISION_NUMBER
  data_type: string
  description: Số quyết định thanh tra (UNIQUE trên phân hệ).
  target_attr_name: Decision Number
- target_column: decision_dt
  transformation: in_te.DECISION_DATE
  data_type: date
  description: Ngày ban hành quyết định thanh tra.
  target_attr_name: Decision Date
- target_column: decision_nm
  transformation: in_te.DECISION_NAME
  data_type: string
  description: Tên quyết định thanh tra.
  target_attr_name: Decision Name
- target_column: announcement_dt
  transformation: in_te.ANNOUNCEMENT_DATE
  data_type: date
  description: Ngày công bố quyết định thanh tra.
  target_attr_name: Announcement Date
- target_column: content
  transformation: in_te.CONTENT
  data_type: string
  description: Nội dung tổng quát cuộc thanh tra.
  target_attr_name: Content
- target_column: inspection_period_from_dt
  transformation: in_te.INSPECTION_PERIOD_FROM
  data_type: date
  description: Thời kỳ thanh tra - Từ ngày.
  target_attr_name: Inspection Period From Date
- target_column: inspection_period_to_dt
  transformation: in_te.INSPECTION_PERIOD_TO
  data_type: date
  description: Thời kỳ thanh tra - Đến ngày.
  target_attr_name: Inspection Period To Date
- target_column: anti_money_laundering_indicator
  transformation: in_te.ANTI_MONEY_LAUNDERING
  data_type: string
  description: 'Có thanh tra PCRT: 0=Không, 1=Có.'
  target_attr_name: Anti Money Laundering Indicator
- target_column: abnormal_transaction_check_indicator
  transformation: in_te.ABNORMAL_TRANSACTION_CHECK
  data_type: string
  description: 'Kiểm tra giao dịch bất thường: 0=Không, 1=Có.'
  target_attr_name: Abnormal Transaction Check Indicator
- target_column: verification_minutes_sign_dt
  transformation: in_te.VERIFICATION_MINUTES_SIGN_DATE
  data_type: date
  description: Ngày ký biên bản xác minh — mốc tính thời hạn lập kết luận thanh tra;
    phải nhập trước khi hệ thống gửi nhắc nhở kết luận.
  target_attr_name: Verification Minutes Sign Date
- target_column: note
  transformation: in_te.NOTE
  data_type: string
  description: Ghi chú bổ sung.
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
