schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-pc_evaluation_criterion-IDS.EVALUATION_CRITERIA
  logical_name: Mapping Atomic - Public Company Evaluation Criterion – source IDS.EVALUATION_CRITERIA
  physical_name: pc_evaluation_criterion
  dm_ref: ATM-pc_evaluation_criterion-IDS.EVALUATION_CRITERIA
  brd_ref: BRD-SRC-IDS-EVALUATION_CRITERIA
target:
  namespace: atm
  physical_name: pc_evaluation_criterion
  etl_handle: SCD4A
  description: 'Chỉ tiêu đánh giá/xếp hạng công ty đại chúng thuộc một nhóm chỉ tiêu:
    mã chỉ tiêu, tên, điểm tối đa, thứ tự.'
input:
- source_type: physical_table
  namespace: ods
  table_name: EVALUATION_CRITERIA
  alias: ev_cr
  select_fields: CRITERION_CD, GROUP_CD, CRITERION_NAME, DESCRIPTION, SUBGROUP_NAME,
    BASIC_FLG, DISPLAY_ORDER_GROUP, DISPLAY_ORDER_SUBGROUP
  filter: null
relationship: []
mapping_columns:
- target_column: pc_evaluation_criterion_id
  transformation: '{hash_id}(''IDS_EVALUATION_CRITERIA'', ev_cr.CRITERION_CD)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Public Company Evaluation Criterion Id
- target_column: pc_evaluation_criterion_code
  transformation: ev_cr.CRITERION_CD
  data_type: string
  description: Mã chỉ tiêu. BK duy nhất — Id hash từ trường này.
  target_attr_name: Public Company Evaluation Criterion Code
- target_column: src_stm_code
  transformation: '''IDS_EVALUATION_CRITERIA'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: pc_evaluation_group_id
  transformation: '{hash_id}(''IDS_EVALUATION_GROUPS'', ev_cr.GROUP_CD)'
  data_type: string
  description: Id của nhóm đánh giá.
  target_attr_name: Public Company Evaluation Group Id
- target_column: pc_evaluation_group_code
  transformation: ev_cr.GROUP_CD
  data_type: string
  description: Mã nhóm đánh giá (denormalized lookup).
  target_attr_name: Public Company Evaluation Group Code
- target_column: pc_evaluation_criterion_nm
  transformation: ev_cr.CRITERION_NAME
  data_type: string
  description: Tên chỉ tiêu đánh giá.
  target_attr_name: Public Company Evaluation Criterion Name
- target_column: description
  transformation: ev_cr.DESCRIPTION
  data_type: string
  description: Mô tả chỉ tiêu đánh giá.
  target_attr_name: Description
- target_column: subgroup_nm
  transformation: ev_cr.SUBGROUP_NAME
  data_type: string
  description: Tên nhóm con.
  target_attr_name: Subgroup Name
- target_column: basic_criterion_indicator
  transformation: ev_cr.BASIC_FLG
  data_type: int
  description: Là chỉ tiêu cơ bản hay không.
  target_attr_name: Basic Criterion Indicator
- target_column: display_order_group
  transformation: ev_cr.DISPLAY_ORDER_GROUP
  data_type: int
  description: Số thứ tự hiển thị nhóm.
  target_attr_name: Display Order Group
- target_column: display_order_subgroup
  transformation: ev_cr.DISPLAY_ORDER_SUBGROUP
  data_type: int
  description: Số thứ tự hiển thị nhóm con.
  target_attr_name: Display Order Subgroup
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
