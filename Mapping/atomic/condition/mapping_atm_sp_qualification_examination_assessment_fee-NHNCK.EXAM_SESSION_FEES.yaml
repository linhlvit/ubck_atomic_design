schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-sp_qualification_examination_assessment_fee-NHNCK.EXAM_SESSION_FEES
  logical_name: Mapping Atomic - Securities Practitioner Qualification Examination
    Assessment Fee – source NHNCK.EXAM_SESSION_FEES
  physical_name: sp_qualification_examination_assessment_fee
  dm_ref: ATM-sp_qualification_examination_assessment_fee-NHNCK.EXAM_SESSION_FEES
  brd_ref: BRD-SRC-NHNCK-EXAM_SESSION_FEES
target:
  namespace: atm
  physical_name: sp_qualification_examination_assessment_fee
  etl_handle: SCD4A
  description: Biểu phí thi sát hạch quy định cho từng loại CCHN trong từng đợt thi
    (Condition). Phân biệt với License Application Fee là phí thực tế thu từng hồ
    sơ (Transaction).
input:
- source_type: physical_table
  namespace: ods
  table_name: EXAM_SESSION_FEES
  alias: ex_se_fe
  select_fields: ID, EXAM_SESSION_ID, CERTIFICATE_ID, FEE_EXAM, FEE_APPEAL
  filter: null
- source_type: physical_table
  namespace: ods
  table_name: CERTIFICATES
  alias: cert
  select_fields: ID, CERTIFICATE_CODE
  filter: null
  note: Crosswalk bridge cho sp_license_certificate_tp_id
relationship:
- main_alias: ex_se_fe
  join_type: LEFT JOIN
  join_alias: cert
  join_on: ex_se_fe.CERTIFICATE_ID = cert.ID
mapping_columns:
- target_column: sp_qualification_examination_assessment_fee_id
  transformation: '{hash_id}(''NHNCK_EXAM_SESSION_FEES'', ex_se_fe.ID)'
  data_type: string
  description: Id tự sinh (surrogate key)
  target_attr_name: Securities Practitioner Qualification Examination Assessment Fee
    Id
- target_column: sp_qualification_examination_assessment_fee_code
  transformation: ex_se_fe.ID
  data_type: string
  description: Mã định danh (tự động tăng). BK
  target_attr_name: Securities Practitioner Qualification Examination Assessment Fee
    Code
- target_column: src_stm_code
  transformation: '''NHNCK_EXAM_SESSION_FEES'''
  data_type: string
  description: Mã nguồn dữ liệu
  target_attr_name: Source System Code
- target_column: sp_qualification_examination_assessment_id
  transformation: '{hash_id}(''NHNCK_EXAM_SESSION_FEES'', ex_se_fe.EXAM_SESSION_ID)'
  data_type: string
  description: FK đến đợt thi (Exam Assessment)
  target_attr_name: Securities Practitioner Qualification Examination Assessment Id
- target_column: sp_qualification_examination_assessment_code
  transformation: ex_se_fe.EXAM_SESSION_ID
  data_type: string
  description: Mã đợt thi
  target_attr_name: Securities Practitioner Qualification Examination Assessment Code
- target_column: sp_license_certificate_tp_id
  transformation: '{hash_id}(''NHNCK_CERTIFICATES'', cert.CERTIFICATE_CODE)'
  data_type: string
  description: FK đến loại chứng chỉ
  target_attr_name: Securities Practitioner License Certificate Type Id
- target_column: sp_license_certificate_tp_code
  transformation: ex_se_fe.CERTIFICATE_ID
  data_type: string
  description: Mã loại chứng chỉ (denormalized lookup)
  target_attr_name: Securities Practitioner License Certificate Type Code
- target_column: examination_fee_amt
  transformation: ex_se_fe.FEE_EXAM
  data_type: decimal(23,2)
  description: Mức phí dự thi (VNĐ)
  target_attr_name: Examination Fee Amount
- target_column: appeal_fee_amt
  transformation: ex_se_fe.FEE_APPEAL
  data_type: decimal(23,2)
  description: Mức phí phúc khảo (VNĐ)
  target_attr_name: Appeal Fee Amount
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
