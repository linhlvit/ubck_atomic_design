schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-scr_prac_license_ap_fee-NHNCK.APPLICATION_FEES
  logical_name: Mapping Atomic - Securities Practitioner License Application Fee –
    source NHNCK.APPLICATION_FEES
  physical_name: scr_prac_license_ap_fee
  dm_ref: ATM-scr_prac_license_ap_fee-NHNCK.APPLICATION_FEES
  brd_ref: BRD-SRC-NHNCK-APPLICATION_FEES
target:
  namespace: atm
  physical_name: scr_prac_license_ap_fee
  etl_handle: SCD4A
  description: Phí thực tế phát sinh cho hồ sơ đăng ký CCHN — phí nộp hồ sơ, phí cấp
    CCHN (Transaction). Có lifecycle riêng qua trạng thái thanh toán. Phân biệt với
    Examination Assessment Fee (Condition).
input:
- source_type: physical_table
  namespace: ods
  table_name: APPLICATION_FEES
  alias: ap_fe
  select_fields: ID, APPLICATION_ID, PROFESSIONAL_ID, FEE_TYPE, CONTENT, FEE, REQUEST_DATE,
    PAYMENT_DATE, EXPIRY_DATE, RECORD_STATUS, FILE_PATH, NOTE, CREATED_AT, UPDATED_AT,
    CREATED_BY, UPDATED_BY
  filter: null
relationship: []
mapping_columns:
- target_column: scr_prac_license_ap_fee_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_FEES'', ap_fe.ID)'
  data_type: string
  description: Surrogate primary key
  target_attr_name: Securities Practitioner License Application Fee Id
- target_column: scr_prac_license_ap_fee_code
  transformation: ap_fe.ID
  data_type: string
  description: Business key từ APPLICATION_FEES.ID
  target_attr_name: Securities Practitioner License Application Fee Code
- target_column: license_ap_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_FEES'', ap_fe.APPLICATION_ID)'
  data_type: string
  description: FK đến License Application
  target_attr_name: License Application Id
- target_column: license_ap_code
  transformation: ap_fe.APPLICATION_ID
  data_type: string
  description: Mã hồ sơ đăng ký (lookup pair)
  target_attr_name: License Application Code
- target_column: scr_prac_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_FEES'', ap_fe.PROFESSIONAL_ID)'
  data_type: string
  description: FK đến Securities Practitioner (redundant — derive được từ Application)
  target_attr_name: Securities Practitioner Id
- target_column: scr_prac_code
  transformation: ap_fe.PROFESSIONAL_ID
  data_type: string
  description: Mã chuyên viên (lookup pair)
  target_attr_name: Securities Practitioner Code
- target_column: fee_tp_code
  transformation: ap_fe.FEE_TYPE
  data_type: string
  description: 'Loại phí: 1=Phí thi 2=Phí phúc khảo 3=Phí cấp chứng chỉ'
  target_attr_name: Fee Type Code
- target_column: fee_cntnt
  transformation: ap_fe.CONTENT
  data_type: string
  description: Nội dung khoản phí
  target_attr_name: Fee Content
- target_column: fee_amt
  transformation: ap_fe.FEE
  data_type: decimal(23,2)
  description: Số tiền phí (VNĐ)
  target_attr_name: Fee Amount
- target_column: pymt_rqs_dt
  transformation: ap_fe.REQUEST_DATE
  data_type: date
  description: Ngày yêu cầu nộp phí
  target_attr_name: Payment Request Date
- target_column: pymt_dt
  transformation: ap_fe.PAYMENT_DATE
  data_type: date
  description: Ngày thanh toán thực tế
  target_attr_name: Payment Date
- target_column: pymt_expiry_dt
  transformation: ap_fe.EXPIRY_DATE
  data_type: date
  description: Ngày hết hạn thanh toán
  target_attr_name: Payment Expiry Date
- target_column: rcrd_st_code
  transformation: ap_fe.RECORD_STATUS
  data_type: string
  description: 'Trạng thái thanh toán (proxy từ RECORD_STATUS: 1=Hoạt động)'
  target_attr_name: Record Status Code
- target_column: pymt_evidence_file_path
  transformation: ap_fe.FILE_PATH
  data_type: string
  description: Đường dẫn chứng từ thanh toán
  target_attr_name: Payment Evidence File Path
- target_column: note
  transformation: ap_fe.NOTE
  data_type: string
  description: Ghi chú
  target_attr_name: Note
- target_column: src_stm_code
  transformation: '''NHNCK_APPLICATION_FEES'''
  data_type: string
  description: Mã hệ thống nguồn
  target_attr_name: Source System Code
- target_column: crt_tms
  transformation: ap_fe.CREATED_AT
  data_type: timestamp
  description: Thời điểm tạo bản ghi
  target_attr_name: Created Timestamp
- target_column: udt_tms
  transformation: ap_fe.UPDATED_AT
  data_type: timestamp
  description: Thời điểm cập nhật bản ghi
  target_attr_name: Updated Timestamp
- target_column: crt_by_ofcr_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_FEES'', ap_fe.CREATED_BY)'
  data_type: string
  description: FK đến cán bộ tạo bản ghi
  target_attr_name: Created By Officer Id
- target_column: crt_by_ofcr_code
  transformation: ap_fe.CREATED_BY
  data_type: string
  description: Mã cán bộ tạo bản ghi
  target_attr_name: Created By Officer Code
- target_column: udt_by_ofcr_id
  transformation: '{hash_id}(''NHNCK_APPLICATION_FEES'', ap_fe.UPDATED_BY)'
  data_type: string
  description: FK đến cán bộ cập nhật bản ghi
  target_attr_name: Updated By Officer Id
- target_column: udt_by_ofcr_code
  transformation: ap_fe.UPDATED_BY
  data_type: string
  description: Mã cán bộ cập nhật bản ghi
  target_attr_name: Updated By Officer Code
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
