schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-securities_trade-ORDERTRADE.TRADE_BOOK_HOSE
  logical_name: Mapping Atomic - Securities Trade – source ORDERTRADE.TRADE_BOOK_HOSE
  physical_name: securities_trade
  dm_ref: ATM-securities_trade-ORDERTRADE.TRADE_BOOK_HOSE
  brd_ref: BRD-SRC-ORDERTRADE-TRADE_BOOK_HOSE
target:
  namespace: atm
  physical_name: securities_trade
  etl_handle: Fact Append
  description: Từng lần khớp lệnh thành công trên HOSE và HNX. Mỗi dòng = 1 Trade
    ID. Lưu đồng thời thông tin bên mua và bên bán trong cùng 1 row. FK-BK về Securities
    Order qua buy/sell_scr_ordr_code.
input:
- source_type: physical_table
  namespace: ods
  table_name: TRADE_BOOK_HOSE
  alias: tr_bo_ho
  select_fields: TRADE_ID, TRADE_DATE, MARKET_ID, SYMBOL, CURRENCY, BOARD_TYPE, TIME,
    SESSION, EXECUTION_EXEC_PRICE, EXECUTION_EXEC_PRICE_LTP, EXECUTION_VOLUME, EXECUTION_VALUE,
    EXECUTION_LTP, EXECUTION_NEW_HIGH_LOW_PRICE, BUY_ORDER_DATE, BUY_ORDER_TIME, BUY_ORDER_ACCEPT_ID,
    BUY_BRK_ID, BUY_BRK, BUY_PIN, BUY_ACCT_NO, BUY_NAME, BUY_CLIENT_HOUSE_CLASSIFICATION_CODE,
    BUY_INVEST_TYPE, BUY_FOREIGNER_INVESTOR_TYPE, BUY_ORDER_PRICE, BUY_ORDER_VOL,
    BUY_TRADER_NO, BUY_TRADER_NAME, BUY_REFERENCE_SEQUENCE_NO, SELL_ORDER_DATE, SELL_ORDER_TIME,
    SELL_ORDER_ACCEPT_ID, SELL_BRK_ID, SELL_BRK, SELL_PIN, SELL_ACCT_NO, SELL_NAME,
    SELL_CLIENT_HOUSE_CLASSIFICATION_CODE, SELL_INVEST_TYPE, SELL_FOREIGNER_INVESTOR_TYPE,
    SELL_ORDER_PRICE, SELL_ORDER_VOL, SELL_TRADER_NO, SELL_TRADER_NAME, SELL_REFERENCE_SEQUENCE_NO
  filter: TRADE_DATE = {etl_date}
relationship: []
mapping_columns:
- target_column: securities_trade_id
  transformation: '{hash_id}(''ORDERTRADE_TRADE_BOOK_HOSE'', tr_bo_ho.TRADE_ID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Securities Trade Id
- target_column: securities_trade_code
  transformation: tr_bo_ho.TRADE_ID
  data_type: string
  description: Số thứ tự giao dịch khớp lệnh được ghi nhận trên hệ thống Sàn trong
    ngày, theo từng mã chứng khoán (Trade ID / BK). BK.
  target_attr_name: Securities Trade Code
- target_column: src_stm_code
  transformation: '''ORDERTRADE_TRADE_BOOK_HOSE'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: trade_dt
  transformation: tr_bo_ho.TRADE_DATE
  data_type: date
  description: Ngày giao dịch theo thị trường chứng khoán.
  target_attr_name: Trade Date
- target_column: market_id_code
  transformation: tr_bo_ho.MARKET_ID
  data_type: string
  description: Mã thị trường chứng khoán.
  target_attr_name: Market Id Code
- target_column: security_symbol_code
  transformation: tr_bo_ho.SYMBOL
  data_type: string
  description: Mã chứng khoán.
  target_attr_name: Security Symbol Code
- target_column: currency_code
  transformation: tr_bo_ho.CURRENCY
  data_type: string
  description: Đơn vị tiền tệ.
  target_attr_name: Currency Code
- target_column: board_tp_code
  transformation: tr_bo_ho.BOARD_TYPE
  data_type: string
  description: Loại bảng giao dịch.
  target_attr_name: Board Type Code
- target_column: trade_time
  transformation: tr_bo_ho.TIME
  data_type: string
  description: Thời gian diễn ra giao dịch khớp lệnh.
  target_attr_name: Trade Time
- target_column: session_code
  transformation: tr_bo_ho.SESSION
  data_type: string
  description: Phiên giao dịch.
  target_attr_name: Session Code
- target_column: execution_price
  transformation: tr_bo_ho.EXECUTION_EXEC_PRICE
  data_type: decimal(23,2)
  description: Giá khớp lệnh thực tế của giao dịch.
  target_attr_name: Execution Price
- target_column: execution_price_versus_ltp
  transformation: tr_bo_ho.EXECUTION_EXEC_PRICE_LTP
  data_type: decimal(23,2)
  description: Chênh lệch giữa giá khớp lệnh và giá khớp gần nhất của mã chứng khoán.
  target_attr_name: Execution Price Versus LTP
- target_column: execution_vol
  transformation: tr_bo_ho.EXECUTION_VOLUME
  data_type: int
  description: Khối lượng khớp lệnh.
  target_attr_name: Execution Volume
- target_column: execution_val
  transformation: tr_bo_ho.EXECUTION_VALUE
  data_type: decimal(23,2)
  description: Tổng giá trị giao dịch của lệnh khớp.
  target_attr_name: Execution Value
- target_column: execution_last_traded_price
  transformation: tr_bo_ho.EXECUTION_LTP
  data_type: decimal(23,2)
  description: Giá khớp gần nhất của mã chứng khoán trên thị trường (Last Traded Price).
  target_attr_name: Execution Last Traded Price
- target_column: execution_new_high_low_price_indicator
  transformation: tr_bo_ho.EXECUTION_NEW_HIGH_LOW_PRICE
  data_type: string
  description: Đánh dấu nếu lệnh tạo giá khớp cao nhất hoặc thấp nhất mới trong ngày.
  target_attr_name: Execution New High Low Price Indicator
- target_column: buy_order_dt
  transformation: tr_bo_ho.BUY_ORDER_DATE
  data_type: date
  description: Ngày đặt lệnh mua.
  target_attr_name: Buy Order Date
- target_column: buy_order_time
  transformation: tr_bo_ho.BUY_ORDER_TIME
  data_type: string
  description: Thời gian đặt lệnh mua.
  target_attr_name: Buy Order Time
- target_column: buy_securities_order_id
  transformation: '{hash_id}(''ORDERTRADE_ORDER_BOOK_HOSE'', tr_bo_ho.BUY_ORDER_ACCEPT_ID)'
  data_type: string
  description: FK surrogate đến Securities Order của lệnh mua (best-effort resolve).
  target_attr_name: Buy Securities Order Id
- target_column: buy_securities_order_code
  transformation: tr_bo_ho.BUY_ORDER_ACCEPT_ID
  data_type: string
  description: FK-BK đến Securities Order của lệnh mua (Order Accept Number — BK phụ
    HOSE).
  target_attr_name: Buy Securities Order Code
- target_column: buy_broker_id
  transformation: tr_bo_ho.BUY_BRK_ID
  data_type: string
  description: Mã/số công ty chứng khoán thực hiện giao dịch mua.
  target_attr_name: Buy Broker Id
- target_column: buy_broker_nm
  transformation: tr_bo_ho.BUY_BRK
  data_type: string
  description: Tên công ty chứng khoán thực hiện giao dịch mua.
  target_attr_name: Buy Broker Name
- target_column: buy_account_pin_code
  transformation: tr_bo_ho.BUY_PIN
  data_type: string
  description: Mã PIN của tài khoản mua.
  target_attr_name: Buy Account Pin Code
- target_column: buy_account_nbr
  transformation: tr_bo_ho.BUY_ACCT_NO
  data_type: string
  description: Mã/Số tài khoản giao dịch mua của nhà đầu tư.
  target_attr_name: Buy Account Number
- target_column: buy_account_holder_nm
  transformation: tr_bo_ho.BUY_NAME
  data_type: string
  description: Tên tài khoản giao dịch mua của nhà đầu tư.
  target_attr_name: Buy Account Holder Name
- target_column: buy_client_house_cl_code
  transformation: tr_bo_ho.BUY_CLIENT_HOUSE_CLASSIFICATION_CODE
  data_type: string
  description: Phân loại lệnh khách hàng/công ty tự doanh của lệnh mua.
  target_attr_name: Buy Client House Classification Code
- target_column: buy_investor_tp_code
  transformation: tr_bo_ho.BUY_INVEST_TYPE
  data_type: string
  description: Phân loại nhà đầu tư của lệnh mua (raw từ HOSE).
  target_attr_name: Buy Investor Type Code
- target_column: buy_foreign_investor_tp_code
  transformation: tr_bo_ho.BUY_FOREIGNER_INVESTOR_TYPE
  data_type: string
  description: Phân loại đầu tư nước ngoài của lệnh mua.
  target_attr_name: Buy Foreign Investor Type Code
- target_column: buy_order_price
  transformation: tr_bo_ho.BUY_ORDER_PRICE
  data_type: decimal(23,2)
  description: Giá đặt mua.
  target_attr_name: Buy Order Price
- target_column: buy_order_vol
  transformation: tr_bo_ho.BUY_ORDER_VOL
  data_type: int
  description: Khối lượng đặt mua.
  target_attr_name: Buy Order Volume
- target_column: buy_trader_nbr
  transformation: tr_bo_ho.BUY_TRADER_NO
  data_type: string
  description: Mã/số định danh người thực hiện đặt mua.
  target_attr_name: Buy Trader Number
- target_column: buy_trader_nm
  transformation: tr_bo_ho.BUY_TRADER_NAME
  data_type: string
  description: Tên người thực hiện đặt mua.
  target_attr_name: Buy Trader Name
- target_column: buy_reference_sequence_nbr
  transformation: tr_bo_ho.BUY_REFERENCE_SEQUENCE_NO
  data_type: string
  description: Số tham chiếu theo thứ tự đặt mua trong ngày.
  target_attr_name: Buy Reference Sequence Number
- target_column: sell_order_dt
  transformation: tr_bo_ho.SELL_ORDER_DATE
  data_type: date
  description: Ngày đặt lệnh bán.
  target_attr_name: Sell Order Date
- target_column: sell_order_time
  transformation: tr_bo_ho.SELL_ORDER_TIME
  data_type: string
  description: Thời gian đặt lệnh bán.
  target_attr_name: Sell Order Time
- target_column: sell_securities_order_id
  transformation: '{hash_id}(''ORDERTRADE_ORDER_BOOK_HOSE'', tr_bo_ho.SELL_ORDER_ACCEPT_ID)'
  data_type: string
  description: FK surrogate đến Securities Order của lệnh bán (best-effort resolve).
  target_attr_name: Sell Securities Order Id
- target_column: sell_securities_order_code
  transformation: tr_bo_ho.SELL_ORDER_ACCEPT_ID
  data_type: string
  description: FK-BK đến Securities Order của lệnh bán (Order Accept Number — BK phụ
    HOSE).
  target_attr_name: Sell Securities Order Code
- target_column: sell_broker_id
  transformation: tr_bo_ho.SELL_BRK_ID
  data_type: string
  description: Mã/số công ty chứng khoán thực hiện giao dịch bán.
  target_attr_name: Sell Broker Id
- target_column: sell_broker_nm
  transformation: tr_bo_ho.SELL_BRK
  data_type: string
  description: Tên công ty chứng khoán thực hiện giao dịch bán.
  target_attr_name: Sell Broker Name
- target_column: sell_account_pin_code
  transformation: tr_bo_ho.SELL_PIN
  data_type: string
  description: Mã PIN của tài khoản bán.
  target_attr_name: Sell Account Pin Code
- target_column: sell_account_nbr
  transformation: tr_bo_ho.SELL_ACCT_NO
  data_type: string
  description: Mã/Số tài khoản giao dịch bán của nhà đầu tư.
  target_attr_name: Sell Account Number
- target_column: sell_account_holder_nm
  transformation: tr_bo_ho.SELL_NAME
  data_type: string
  description: Tên tài khoản giao dịch bán của nhà đầu tư.
  target_attr_name: Sell Account Holder Name
- target_column: sell_client_house_cl_code
  transformation: tr_bo_ho.SELL_CLIENT_HOUSE_CLASSIFICATION_CODE
  data_type: string
  description: Phân loại lệnh khách hàng/công ty tự doanh của lệnh bán.
  target_attr_name: Sell Client House Classification Code
- target_column: sell_investor_tp_code
  transformation: tr_bo_ho.SELL_INVEST_TYPE
  data_type: string
  description: Phân loại nhà đầu tư của lệnh bán (raw từ HOSE).
  target_attr_name: Sell Investor Type Code
- target_column: sell_foreign_investor_tp_code
  transformation: tr_bo_ho.SELL_FOREIGNER_INVESTOR_TYPE
  data_type: string
  description: Phân loại đầu tư nước ngoài của lệnh bán.
  target_attr_name: Sell Foreign Investor Type Code
- target_column: sell_order_price
  transformation: tr_bo_ho.SELL_ORDER_PRICE
  data_type: decimal(23,2)
  description: Giá đặt bán.
  target_attr_name: Sell Order Price
- target_column: sell_order_vol
  transformation: tr_bo_ho.SELL_ORDER_VOL
  data_type: int
  description: Khối lượng đặt bán.
  target_attr_name: Sell Order Volume
- target_column: sell_trader_nbr
  transformation: tr_bo_ho.SELL_TRADER_NO
  data_type: string
  description: Mã/số định danh người thực hiện đặt bán.
  target_attr_name: Sell Trader Number
- target_column: sell_trader_nm
  transformation: tr_bo_ho.SELL_TRADER_NAME
  data_type: string
  description: Tên người thực hiện đặt bán.
  target_attr_name: Sell Trader Name
- target_column: sell_reference_sequence_nbr
  transformation: tr_bo_ho.SELL_REFERENCE_SEQUENCE_NO
  data_type: string
