schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-inspection_annual_plan-THANHTRA.INSPECTION_ANNUAL_PLAN
  logical_name: Mapping Atomic - Inspection Annual Plan – source THANHTRA.INSPECTION_ANNUAL_PLAN
  physical_name: inspection_annual_plan
  dm_ref: ATM-inspection_annual_plan-THANHTRA.INSPECTION_ANNUAL_PLAN
  brd_ref: BRD-SRC-THANHTRA-INSPECTION_ANNUAL_PLAN
target:
  namespace: atm
  physical_name: inspection_annual_plan
  etl_handle: SCD4A
  description: Kế hoạch thanh tra hàng năm của UBCKNN, được phê duyệt bằng quyết định
    hành chính. Mỗi năm có 1 kế hoạch (PLAN_YEAR unique), bao gồm thông tin quyết
    định phê duyệt, trạng thái DRAFT/APPROVED.
input:
- source_type: physical_table
  namespace: ods
  table_name: INSPECTION_ANNUAL_PLAN
  alias: in_an_pl
  select_fields: ID, NAME, PLAN_YEAR, DECISION_NUMBER, DECISION_DATE, STATUS, NOTE
  filter: null
relationship: []
mapping_columns:
- target_column: inspection_annual_plan_id
  transformation: '{hash_id}(''THANHTRA_INSPECTION_ANNUAL_PLAN'', in_an_pl.ID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Inspection Annual Plan Id
- target_column: inspection_annual_plan_code
  transformation: in_an_pl.ID
  data_type: string
  description: Khóa chính UUID của bảng nguồn. BK của entity.
  target_attr_name: Inspection Annual Plan Code
- target_column: src_stm_code
  transformation: '''THANHTRA_INSPECTION_ANNUAL_PLAN'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: inspection_annual_plan_nm
  transformation: in_an_pl.NAME
  data_type: string
  description: Tên kế hoạch thanh tra hàng năm.
  target_attr_name: Inspection Annual Plan Name
- target_column: plan_year
  transformation: in_an_pl.PLAN_YEAR
  data_type: int
  description: Năm thanh tra, UNIQUE (mỗi năm chỉ 1 kế hoạch).
  target_attr_name: Plan Year
- target_column: approval_decision_nbr
  transformation: in_an_pl.DECISION_NUMBER
  data_type: string
  description: Số quyết định ban hành (bắt buộc khi status=APPROVED).
  target_attr_name: Approval Decision Number
- target_column: approval_decision_dt
  transformation: in_an_pl.DECISION_DATE
  data_type: date
  description: Ngày quyết định (bắt buộc khi status=APPROVED).
  target_attr_name: Approval Decision Date
- target_column: life_cycle_status_code
  transformation: in_an_pl.STATUS
  data_type: string
  description: 'Trạng thái: DRAFT (Dự thảo), APPROVED (Đã duyệt).'
  target_attr_name: Life Cycle Status Code
- target_column: note
  transformation: in_an_pl.NOTE
  data_type: string
  description: Ghi chú bổ sung.
  target_attr_name: Note
transformation_rules_ref: Mapping/Rules/transformation_rules.yaml
final_filter: []
