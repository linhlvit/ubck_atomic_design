schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-corporate_bond_trading_snapshot-MDDS.JAD_CORPBONDINFOR
  logical_name: Mapping Atomic - Corporate Bond Trading Snapshot – source MDDS.JAD_CORPBONDINFOR
  physical_name: corporate_bond_trading_snapshot
  dm_ref: ATM-corporate_bond_trading_snapshot-MDDS.JAD_CORPBONDINFOR
  brd_ref: BRD-SRC-MDDS-JAD_CORPBONDINFOR
target:
  namespace: atm
  physical_name: corporate_bond_trading_snapshot
  etl_handle: Fact Snapshot
  description: Snapshot trạng thái giao dịch của trái phiếu doanh nghiệp niêm yết
    tại sàn HNX tại một thời điểm, bao gồm giá khớp, order book thỏa thuận Outright,
    thông tin đặc thù trái phiếu (kỳ hạn, lãi suất, coupon, mệnh giá, ngày phát hành/đáo
    hạn).
input:
- source_type: physical_table
  namespace: ods
  table_name: JAD_CORPBONDINFOR
  alias: ja_co
  select_fields: KID, SYMBOL, TRADINGDATE, FULLNAME, TRADINGTIME, FLOORCODE, STOCKTYPE,
    TRADINGSESSIONID, SECURITYTRADINGSTATUS, TRADSESSTATUS, PERIOD_UNIT, INTEREST_PERIOD_UNIT,
    INTEREST_COUPON_TYPE, INTERESTRATE_TYPE, INTEREST_TYPE, INTEREST_PAYMENT_TYPE,
    CEILING, FLOOR, REFERENCE, CLOSEPRICE, CLOSEVOL, CHANGE, OPEN, HIGH, LOW, AVERAGEPRICE,
    TOTALTRADING, TOTALTRADINGVALUE, TOTALLISTINGQTTY, FOREIGNREMAIN, PT_MATCH_QTTY,
    PT_MATCH_PRICE, PT_TOTAL_TRADED_QTTY, PT_TOTAL_TRADED_VALUE, PT_BESTBIDQTTY, PT_BESTBIDPRICE,
    PT_BESTOFFERQTTY, PT_BESTOFFERPRICE, PT_TOTALBIDQTTY, PT_TOTALOFFERQTTY, PT_MAXQTTY,
    PT_MAXPRICE, PT_MINQTTY, PT_MINPRICE, ISSUERNAME, ISSUEDATE, MATURITYDATE, PARVALUE,
    BOND_PERIOD, PERIOD_REMAIN, INTEREST_PERIOD, INTEREST_RATE, CHARACTERISTICS
  filter: TRADINGDATE = {etl_date}
relationship: []
mapping_columns:
- target_column: corporate_bond_trading_snpst_id
  transformation: '{hash_id}(''MDDS_JAD_CORPBONDINFOR'', ja_co.KID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Corporate Bond Trading Snapshot Id
- target_column: corporate_bond_trading_snpst_code
  transformation: ja_co.KID
  data_type: string
  description: ID mã do jadapter sinh. BK của Snapshot entity.
  target_attr_name: Corporate Bond Trading Snapshot Code
- target_column: src_stm_code
  transformation: '''MDDS_JAD_CORPBONDINFOR'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: symbol
  transformation: ja_co.SYMBOL
  data_type: string
  description: Mã chứng khoán trái phiếu.
  target_attr_name: Symbol
- target_column: trading_dt
  transformation: ja_co.TRADINGDATE
  data_type: date
  description: Ngày giao dịch format dd/mm/yyyy.
  target_attr_name: Trading Date
- target_column: bond_full_nm
  transformation: ja_co.FULLNAME
  data_type: string
  description: Tên đầy đủ của trái phiếu.
  target_attr_name: Bond Full Name
- target_column: trading_time
  transformation: ja_co.TRADINGTIME
  data_type: string
  description: Thời gian giao dịch.
  target_attr_name: Trading Time
- target_column: floor_code
  transformation: ja_co.FLOORCODE
  data_type: string
  description: 'Mã sàn: 06 (corp-bond HNX).'
  target_attr_name: Floor Code
- target_column: stock_tp_code
  transformation: ja_co.STOCKTYPE
  data_type: string
  description: 'Loại CK: 12 (trái phiếu DN).'
  target_attr_name: Stock Type Code
- target_column: trading_session_status_code
  transformation: ja_co.TRADINGSESSIONID
  data_type: string
  description: Trạng thái phiên giao dịch HNX.
  target_attr_name: Trading Session Status Code
- target_column: security_trading_status_code
  transformation: ja_co.SECURITYTRADINGSTATUS
  data_type: string
  description: Trạng thái trái phiếu (0-bình thường / 10-tạm ngừng / 11-hạn chế).
  target_attr_name: Security Trading Status Code
- target_column: trading_session_status_2_code
  transformation: ja_co.TRADSESSTATUS
  data_type: string
  description: Trạng thái phiên giao dịch (tradsesstatus — trường thứ 2).
