schema_type: mapping
schema_version: '1.0'
mapping:
  id: MAP-ATM-security_trading_snapshot-MDDS.JAD_STOCKINFOR
  logical_name: Mapping Atomic - Security Trading Snapshot – source MDDS.JAD_STOCKINFOR
  physical_name: security_trading_snapshot
  dm_ref: ATM-security_trading_snapshot-MDDS.JAD_STOCKINFOR
  brd_ref: BRD-SRC-MDDS-JAD_STOCKINFOR
target:
  namespace: atm
  physical_name: security_trading_snapshot
  etl_handle: Fact Snapshot
  description: Snapshot trạng thái giao dịch của một công cụ tài chính (cổ phiếu,
    chứng quyền, hợp đồng phái sinh, chứng chỉ quỹ) tại một thời điểm trong ngày giao
    dịch, bao gồm giá, sổ lệnh, NĐTNN và thông tin đặc thù theo loại instrument.
input:
- source_type: physical_table
  namespace: ods
  table_name: JAD_STOCKINFOR
  alias: ja_st
  select_fields: HISTORYID, SYMBOL, TRADINGDATE, FULLNAME, STOCKID, KID, STOCKTYPE,
    FLOORCODE, TRADINGSESSIONID, LASTCOLOR, SYMBOLSTATUSCODE, CEILING, FLOOR, REFERENCE,
    CLOSEPRICE, CLOSEVOL, CHANGE, OPEN, HIGH, LOW, AVERAGEPRICE, BIDPRICE1, BIDVOL1,
    BIDPRICE2, BIDVOL2, BIDPRICE3, BIDVOL3, OFFERPRICE1, OFFERVOL1, OFFERPRICE2, OFFERVOL2,
    OFFERPRICE3, OFFERVOL3, TOTALTRADING, TOTALTRADINGVALUE, TOTAL_OFFER_QTTY, TOTAL_BID_QTTY,
    FOREIGNBUY, FOREIGNSELL, FOREIGNREMAIN, FOREIGNROOM, PT_MATCH_QTTY, PT_MATCH_PRICE,
    PT_TOTAL_TRADED_QTTY, PT_TOTAL_TRADED_VALUE, STATUS, SYMBOLISIN, LISTEDSHARE,
    TOTALLISTINGQTTY, MARKETID, BOARDID, PRODUCTGRPID, PRODUCTID, TRADINGTIME, FUNDTYPE,
    OPENINTEREST, FIRSTTRADINGDATE, LASTTRADINGDATE, UNDERLYINGSYMBOL, ISSUERNAME,
    COVEREDWARRANTTYPE, MATURITYDATE, EXERCISEPRICE, EXERCISERATIO, SETTLEMENTPRICE,
    MATURITYMONTHYEAR, LISTINGDATE, CONTRACTMULTIPLIER, PUTORCALL, EXERCISESTYLE,
    COUPONRATE, YIELD, ISSUEDATE
  filter: TRADINGDATE = {etl_date}
relationship: []
mapping_columns:
- target_column: security_trading_snpst_id
  transformation: '{hash_id}(''MDDS_JAD_STOCKINFOR'', ja_st.HISTORYID)'
  data_type: string
  description: Khóa đại diện (surrogate key).
  target_attr_name: Security Trading Snapshot Id
- target_column: security_trading_snpst_code
  transformation: ja_st.HISTORYID
  data_type: string
  description: ID unique cho từng dòng lịch sử — PK bảng nguồn. BK của Snapshot entity.
  target_attr_name: Security Trading Snapshot Code
- target_column: src_stm_code
  transformation: '''MDDS_JAD_STOCKINFOR'''
  data_type: string
  description: Mã hệ thống nguồn dữ liệu.
  target_attr_name: Source System Code
- target_column: symbol
  transformation: ja_st.SYMBOL
  data_type: string
  description: Mã chứng khoán.
  target_attr_name: Symbol
- target_column: trading_dt
  transformation: ja_st.TRADINGDATE
  data_type: date
  description: Ngày giao dịch format dd/mm/yyyy. ETL cần parse sang Date.
  target_attr_name: Trading Date
- target_column: security_full_nm
  transformation: ja_st.FULLNAME
  data_type: string
  description: Tên chứng khoán (tiếng Việt).
  target_attr_name: Security Full Name
- target_column: security_id
  transformation: ja_st.STOCKID
  data_type: string
  description: ID của chứng khoán trong hệ thống Sở.
  target_attr_name: Security Id
- target_column: jadapter_id
  transformation: ja_st.KID
  data_type: string
  description: ID của mã do jadapter tự sinh.
  target_attr_name: Jadapter Id
- target_column: stock_tp_code
  transformation: ja_st.STOCKTYPE
  data_type: string
  description: Loại chứng khoán (ST/BO/MF/FU/OP/EF/W...).
  target_attr_name: Stock Type Code
- target_column: floor_code
  transformation: ja_st.FLOORCODE
  data_type: string
  description: 'Mã sàn: 02-HNX, 04-UPCOM, 10-HOSE, 03-FDS, 06-corp-bond.'
  target_attr_name: Floor Code
- target_column: trading_session_status_code
  transformation: ja_st.TRADINGSESSIONID
  data_type: string
  description: Trạng thái phiên tại thời điểm chụp.
  target_attr_name: Trading Session Status Code
- target_column: trade_direction_code
  transformation: ja_st.LASTCOLOR
  data_type: string
  description: Chiều mua/bán chủ động gần nhất.
  target_attr_name: Trade Direction Code
- target_column: symbol_status_code
  transformation: ja_st.SYMBOLSTATUSCODE
  data_type: string
  description: Trạng thái mã CK.
  target_attr_name: Symbol Status Code
- target_column: ceiling_price
  transformation: ja_st.CEILING
  data_type: decimal(23,2)
  description: Giá trần.
  target_attr_name: Ceiling Price
- target_column: floor_price
  transformation: ja_st.FLOOR
  data_type: decimal(23,2)
  description: Giá sàn.
  target_attr_name: Floor Price
- target_column: reference_price
  transformation: ja_st.REFERENCE
  data_type: decimal(23,2)
  description: Giá tham chiếu.
  target_attr_name: Reference Price
- target_column: close_price
  transformation: ja_st.CLOSEPRICE
  data_type: decimal(23,2)
  description: Giá khớp gần nhất.
  target_attr_name: Close Price
- target_column: close_vol
  transformation: ja_st.CLOSEVOL
  data_type: int
  description: Khối lượng khớp gần nhất.
  target_attr_name: Close Volume
- target_column: price_change
  transformation: ja_st.CHANGE
  data_type: decimal(23,2)
  description: Thay đổi giữa giá khớp gần nhất và giá tham chiếu.
  target_attr_name: Price Change
- target_column: open_price
  transformation: ja_st.OPEN
  data_type: decimal(23,2)
