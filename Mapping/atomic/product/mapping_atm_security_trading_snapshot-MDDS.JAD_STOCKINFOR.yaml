  target_attr_name: Open Price
- target_column: high_price
  transformation: ja_st.HIGH
  data_type: decimal(23,2)
  description: Giá khớp cao nhất tính đến thời điểm.
  target_attr_name: High Price
- target_column: low_price
  transformation: ja_st.LOW
  data_type: decimal(23,2)
  description: Giá khớp thấp nhất tính đến thời điểm.
  target_attr_name: Low Price
- target_column: average_price
  transformation: ja_st.AVERAGEPRICE
  data_type: decimal(23,2)
  description: Giá khớp trung bình.
  target_attr_name: Average Price
- target_column: bid_price_1
  transformation: ja_st.BIDPRICE1
  data_type: decimal(23,2)
  description: Giá mua top 1.
  target_attr_name: Bid Price 1
- target_column: bid_vol_1
  transformation: ja_st.BIDVOL1
  data_type: int
  description: Khối lượng mua top 1.
  target_attr_name: Bid Volume 1
- target_column: bid_price_2
  transformation: ja_st.BIDPRICE2
  data_type: decimal(23,2)
  description: Giá mua top 2.
  target_attr_name: Bid Price 2
- target_column: bid_vol_2
  transformation: ja_st.BIDVOL2
  data_type: int
  description: Khối lượng mua top 2.
  target_attr_name: Bid Volume 2
- target_column: bid_price_3
  transformation: ja_st.BIDPRICE3
  data_type: decimal(23,2)
  description: Giá mua top 3.
  target_attr_name: Bid Price 3
- target_column: bid_vol_3
  transformation: ja_st.BIDVOL3
  data_type: int
  description: Khối lượng mua top 3.
  target_attr_name: Bid Volume 3
- target_column: offer_price_1
  transformation: ja_st.OFFERPRICE1
  data_type: decimal(23,2)
  description: Giá bán top 1.
  target_attr_name: Offer Price 1
- target_column: offer_vol_1
  transformation: ja_st.OFFERVOL1
  data_type: int
  description: Khối lượng bán top 1.
  target_attr_name: Offer Volume 1
- target_column: offer_price_2
  transformation: ja_st.OFFERPRICE2
  data_type: decimal(23,2)
  description: Giá bán top 2.
  target_attr_name: Offer Price 2
- target_column: offer_vol_2
  transformation: ja_st.OFFERVOL2
  data_type: int
  description: Khối lượng bán top 2.
  target_attr_name: Offer Volume 2
- target_column: offer_price_3
  transformation: ja_st.OFFERPRICE3
  data_type: decimal(23,2)
  description: Giá bán top 3.
  target_attr_name: Offer Price 3
- target_column: offer_vol_3
  transformation: ja_st.OFFERVOL3
  data_type: int
  description: Khối lượng bán top 3.
  target_attr_name: Offer Volume 3
- target_column: total_trading_vol
  transformation: ja_st.TOTALTRADING
  data_type: int
  description: Tổng khối lượng khớp từ đầu ngày.
  target_attr_name: Total Trading Volume
- target_column: total_trading_val
  transformation: ja_st.TOTALTRADINGVALUE
  data_type: decimal(23,2)
