  transformation: ja_st.EXERCISEPRICE
  data_type: decimal(23,2)
  description: Giá thực hiện CW.
  target_attr_name: Exercise Price
- target_column: exercise_ratio
  transformation: ja_st.EXERCISERATIO
  data_type: string
  description: Tỉ lệ thực hiện CW.
  target_attr_name: Exercise Ratio
